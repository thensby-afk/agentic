<script>
/* ============================================================
   UU MAINTENANCE & PM COMPLIANCE DASHBOARD
   Self-contained: no external dependencies
   ============================================================ */

// ---------- Global state ----------
const STATE = {
  costRaw: null,          // Array of cost rows
  costEnriched: null,     // Cost rows with derived fields
  // Annual inflation rate (%) used to deflate historical costs to real / today's-money terms.
  // Defaults to 3.5% (a typical assumption the client wants baked in); the user can change it.
  // 0 = off (nominal cash). When > 0, every cost is divided by
  // (1 + rate/100)^(years from that month back to the latest data month), so recent months are
  // ~unchanged and older months scale up to today's equivalent. Work-order counts are never
  // affected. Forecasts are computed on the deflated (real) basis and carry no inflation forward.
  inflationPct: 3.5,
  pmFiles: [],            // {name, rows, minMonth, maxMonth}
  pmEnriched: null,       // All PM rows merged, enriched
  allMonths: [],          // Sorted array of YYYY-MM strings present in data
  filters: {
    timeFrom: null,
    timeTo: null,
    aggregation: 'quarter',
    businessArea: new Set(),
    county: new Set(),
    criticality: new Set(),
    includeUnknown: false,
    // NEW (Overview redesign) - global focus + comparison + asset-class picker
    focusPeriod: 'latest-complete',  // 'latest-complete' | specific period key (e.g. "FY26 Q3")
    comparisonMode: 'prior',         // prior | prior-year | 3yr-avg | none
    assetClassSelection: null        // null = auto default (top 20 by avg yearly cost); Set<string> = user-picked
  },
  overview: {
    // Section-local toggles that don't belong in the global filter bar
    s4CostMetric: 'corrective',       // Section 4: corrective | reactive | proactive
    s4LogScale: false,
    s4ChartShow: 10,                   // Section 4 chart: show top N lines (3|5|10|15|20|all)
    s4HiddenAcs: new Set(),            // Asset classes hidden via interactive legend
    s4TableExpanded: false,
    s3PanelCView: 10,                  // Section 3 Panel C: 10 | 15 | 20 | 'all'
    s5ChartShow: 10,                   // Section 5 chart: show top N lines (3|5|10|15|20|all)
    s5HiddenAcs: new Set(),
    s5TableExpanded: false,
    s6ViewBy: 'assetClass',            // Section 6 entity level: assetClass | county | businessArea | site
    s6TopN: 20,                        // Section 6 top-N slider (5-50)
    s7EntityType: 'assetClass',        // Section 7: assetClass | assetClassCounty | county | businessArea | site
    s7CostMetric: 'corrective',        // Section 7 cost metric toggle
    s7ShowCount: 5,                    // Section 7 rows shown: 5 | 10 | 'all'
    s7MinSpend: 50000,                 // Section 7 min total spend threshold (£) to filter out noise
    s7SortBy: 'abs',                   // Section 7 sort: 'abs' (Δ£) | 'pct' (Δ%)
    s7ShowDecreases: false,
    s7ShowGains: false
  },
  section2: {
    assetClass: null,
    assetType: null,
    counties: new Set(),
    businessAreas: new Set(),
    sites: new Set(),
    costMetric: 'corrective',
    // Deep-dive redesign state
    costMetricToggles: { reactive:true, proactive:true, corrective:false, preventative:false, total:false },
    moverMode: 'yoy',          // 'yoy' | 'prior'
    moverSort: 'abs',          // 'abs' | 'pct'
    moverTopN: 5,              // 5 | 10 | 'all'
    scatterTopN: 30,           // 15 | 30 | 50 | 'all' — sites shown in the concentric-ring scatter
    splitBy: 'none'            // 'none' | 'county' | 'ba' — splits the three trend lines (reactive share, cost/WO, PM compliance)
  },
  section3: {
    // ----- Change 2: multi-class scenario model -----
    // Free multi-select of asset classes (replaces the old Top-N presets). The user ticks
    // any number of classes from the full list. `selectedClassSet` is the source of truth
    // (a Set of asset-class names); `selectedClasses` is the ordered array derived from it
    // (ranked by corrective spend) and used by everything downstream. On first load, before
    // the user has touched the list, we default to the top 5 by corrective spend.
    selectedClassSet: null,                  // Set<string> of chosen classes (null = not yet initialised)
    userChoseClasses: false,                 // becomes true once the user toggles the list
    topN: 5,                                 // retained only as the first-load default count (top 5)
    selectedClasses: null,                   // ordered array derived from selectedClassSet (set lazily)
    // Per-class typed sensitivities: expected % change in each metric per +1pp compliance.
    // Shape: { [assetClass]: { correctiveVol, correctiveCpw,
    //                          _touched: {correctiveVol, correctiveCpw} } }
    // A value is pre-filled from the regression fit and flagged _touched=true once edited /
    // imported. null value = fall back to the live fit for that metric.
    perClassSensitivities: {},
    // Overall (overarching) assumptions — a convenience row above the per-class table. Blank
    // by default. When the user types a value in one of these boxes, that single variable is
    // replicated to EVERY selected class (overwriting any per-class value for that variable)
    // and marked as edited. Per-class rows can still be individually overridden afterwards.
    overallSensitivities: { correctiveVol: null, correctiveCpw: null },
    // Forecast result tab: per-class manual % reduction ("haircut") applied to that class's
    // modelled impact. Map assetClass -> percent (0-100). A value of 20 means the class's
    // volume AND spend impact (corrective/reactive/proactive alike) are scaled by (1 - 0.20),
    // reflecting only capturing 80% of the modelled saving. Default/absent = 0 (no reduction).
    resultReductionPct: {},
    aiStepIndex: 0,                          // Asset Specific Insights tab: which selected class is shown
    outputStepIndex: 0,                      // which selected class's projection is shown in the output stepper
    assetClass: null,                        // the class currently being projected (driven by outputStepIndex)
    assetType: null,
    historyMonths: 24,                       // how many months of history to show in the table
    projHorizonMonths: 48,                   // 6 | 12 | 24 | 36 | 48 | 60 — default 48 covers through FY30 in the FY toggle
    chartHorizonMonths: 24,
    // Global compliance trajectory (shared across all selected classes)
    compTrajectory: {
      kind: 'improve',                       // 'flat' | 'improve' | 'trend'
      targetPct: 90,
      byMonth: 12
    },
    // Global model params
    historicalWindow: 24,                    // months of history used for the fit (6/12/18/24)
    projAnchor: '6mo',                       // 'last' | '3mo' | '6mo' | '12mo'
    naturalDriftOn: false,
    outputGrain: 'month',                    // 'month' | 'quarter' | 'fy'
    outputMetric: 'corrective',              // 'corrective' | 'reactive' | 'proactive'
    baselineKind: 'fy',                      // 'fy' | 'last_12mo' | 'last_6mo'
    baselineFy: null,
    selectedFy: null,
    showFullTable: false
  },
  // Fixed 6-month lag between PM compliance change and its effect on reactive volume / £-per-WO.
  // Operationally: assets that have been neglected continue to need reactive work for ~6 months
  // after PM improves; the benefit of better PM today shows up in the data ~6 months later.
  // Same lag applied to £/WO (the cost of remaining reactive jobs reflects severity, also lagged).
  // Lag is applied symmetrically to all baselines so comparisons stay apples-to-apples.
  // DOM tab id for the Overview tab is still 'section1' (kept for minimal DOM churn).
  activeTab: 'section0'
};

// ---------- Constants ----------
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const COLORS = {
  primary:'#024E43', success:'#00A878', warning:'#FF6B35', danger:'#d32f2f',
  accent:'#e91e63', neutral:'#94a3b8',
  // Palette for series (colour-blind sensitive, distinct)
  series: ['#024E43','#00A878','#FF6B35','#e91e63','#1565c0','#8e44ad','#d32f2f','#f9a825','#5d4037','#00838f']
};

// Expected columns (strict)
const COST_COLUMNS = [
  'REPORT_MONTH','SITE_DESC','EQUIPMENT_CLASS','EQUIPMENT_CLASS_DESCRIPTION',
  'MAINTENANCE_WORK_CENTRE','MAINTENANCE_WORK_CENTRE_DESCRIPTION',
  'ASSET_CLASS_DESCRIPTION','MAINTENANCE_PLANT_DESC','PLANNING_PLANT_DESC',
  'TOTAL_WORKORDERS','REACTIVE_WORKORDERS','PROACTIVE_WORKORDERS','PREVENTATIVE_WORKORDERS','OTHER_WORKORDERS',
  'TOTAL_OPERATIONS','REACTIVE_OPERATIONS','PROACTIVE_OPERATIONS','PREVENTATIVE_OPERATIONS','OTHER_OPERATIONS',
  'TOTAL_COST_ACTUAL','TOTAL_COST_CALCULATED',
  'REACTIVE_CORRECTIVE_LABOUR','REACTIVE_CORRECTIVE_CONTRACTOR','REACTIVE_CORRECTIVE_MATERIALS','REACTIVE_CORRECTIVE_OTHER','TOTAL_REACTIVE_CORRECTIVE_COST',
  'PROACTIVE_CORRECTIVE_LABOUR','PROACTIVE_CORRECTIVE_CONTRACTOR','PROACTIVE_CORRECTIVE_MATERIALS','PROACTIVE_CORRECTIVE_OTHER','TOTAL_PROACTIVE_CORRECTIVE_COST',
  'PREVENTATIVE_LABOUR','PREVENTATIVE_CONTRACTOR','PREVENTATIVE_MATERIALS','PREVENTATIVE_OTHER','TOTAL_PREVENTATIVE_COST',
  'OTHER_LABOUR','OTHER_CONTRACTOR','OTHER_MATERIALS','OTHER_OTHER','TOTAL_OTHER_COST'
];

const PM_COLUMNS_REQUIRED = [
  'MONTH','SITE_DESC','EQUIPMENT_CLASS','EQUIPMENT_CLASS_DESCRIPTION','ASSET_CLASS_DESCRIPTION',
  'MAINTENANCE_WORK_CENTRE','MAINTENANCE_PLANT_DESC','PLANNING_PLANT_DESC',
  'total_tasks','overdue_tasks'
];

// ---------- Utility: CSV parser ----------
// Handles quoted fields, embedded commas, newlines, escaped quotes.
function parseCSV(text){
  const rows = [];
  let cur = [], field = '', inQ = false, i = 0;
  // Strip BOM
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const len = text.length;
  while(i < len){
    const c = text[i];
    if(inQ){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i += 2; continue; }
        inQ = false; i++; continue;
      }
      field += c; i++;
    } else {
      if(c === '"'){ inQ = true; i++; continue; }
      if(c === ','){ cur.push(field); field = ''; i++; continue; }
      if(c === '\r'){ i++; continue; }
      if(c === '\n'){ cur.push(field); rows.push(cur); cur = []; field = ''; i++; continue; }
      // Handle tab-separated fallback? No — treat as field content. User said CSV.
      field += c; i++;
    }
  }
  // Last field
  if(field.length > 0 || cur.length > 0){ cur.push(field); rows.push(cur); }
  if(!rows.length) return { headers:[], rows:[] };
  const headers = rows[0].map(h => h.trim());
  const dataRows = rows.slice(1).filter(r => r.length > 1 || (r.length === 1 && r[0].trim() !== ''));
  const objs = dataRows.map(r => {
    const o = {};
    headers.forEach((h, idx) => { o[h] = r[idx] !== undefined ? r[idx] : ''; });
    return o;
  });
  return { headers, rows: objs };
}

// ---------- Single-line CSV parsers (quote-aware) used by the streaming cost loader ----------
// Parse one CSV line into an array of field strings, honouring RFC-style double-quoting.
function parseCsvDataLine(line){
  const out = [];
  let field = '', inQ = false, i = 0;
  const len = line.length;
  while(i < len){
    const c = line[i];
    if(inQ){
      if(c === '"'){
        if(line[i+1] === '"'){ field += '"'; i += 2; continue; }
        inQ = false; i++; continue;
      }
      field += c; i++;
    } else {
      if(c === '"'){ inQ = true; i++; continue; }
      if(c === ','){ out.push(field); field = ''; i++; continue; }
      if(c === '\r'){ i++; continue; }
      field += c; i++;
    }
  }
  out.push(field);
  return out;
}
// Header line variant: trims each field name.
function parseHeaderCsvLine(line){
  return parseCsvDataLine(line).map(h => h.trim());
}

// Normalise a SAP criticality value so the SAME level matches across the cost and PM files
// regardless of case or surrounding whitespace (e.g. "a", "A ", " A" all → "A"). Blank → the
// pseudo-value 'Unspecified'. This prevents the filter from treating cost-side and PM-side
// spellings as different values (which zeroed costs when only one side's spelling was selected).
function normCriticality(v){
  const s = (v == null ? '' : String(v)).trim();
  if(!s || s.toUpperCase() === 'UNSPECIFIED') return 'Unspecified';
  return s.toUpperCase();
}

// Detect delimiter: CSV vs tab.
function detectDelimiter(firstLine){
  const tabs = (firstLine.match(/\t/g) || []).length;
  const commas = (firstLine.match(/,/g) || []).length;
  return tabs > commas ? '\t' : ',';
}

function parseDelimited(text){
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const firstNL = text.indexOf('\n');
  const firstLine = firstNL >= 0 ? text.slice(0, firstNL) : text;
  const delim = detectDelimiter(firstLine);
  let result;
  if(delim === ','){
    result = parseCSV(text);
  } else {
    // Tab-delimited: simple split, no quote handling needed typically
    const lines = text.split(/\r?\n/).filter(l => l.length > 0);
    if(!lines.length) return { headers:[], rows:[] };
    const headers = lines[0].split('\t').map(h => h.trim());
    const rows = lines.slice(1).map(line => {
      const parts = line.split('\t');
      const o = {};
      headers.forEach((h, idx) => { o[h] = parts[idx] !== undefined ? parts[idx] : ''; });
      return o;
    });
    result = { headers, rows };
  }
  // Drop unnamed leading index column (pandas to_csv() default). Heuristic:
  // first header is empty/whitespace, and the column's values across first few rows
  // all look like non-negative integers.
  if(result.headers.length > 0 && result.headers[0] === ''){
    const firstColName = result.headers[0];
    const sampleSize = Math.min(10, result.rows.length);
    let looksLikeIndex = true;
    for(let i = 0; i < sampleSize; i++){
      const v = result.rows[i][firstColName];
      if(v === undefined || v === '' || !/^\d+$/.test(String(v).trim())){
        looksLikeIndex = false;
        break;
      }
    }
    if(looksLikeIndex){
      result.headers = result.headers.slice(1);
      result.rows.forEach(r => { delete r[firstColName]; });
      result._droppedIndexColumn = true;
    }
  }
  return result;
}

// ---------- Utility: Date parsing & FY ----------
// Parse MMM-YY or DD/MM/YYYY to {year, month1based, ym}
function parseMonthCell(raw){
  if(raw === null || raw === undefined || raw === '') return null;
  const s = String(raw).trim();
  if(!s) return null;

  // MMM-YY format e.g. Jan-20, or MMM-YYYY e.g. Jan-2020
  let m = s.match(/^([A-Za-z]{3,9})[-\s]+(\d{2,4})$/);
  if(m){
    const monStr = m[1].toLowerCase().slice(0,3);
    const monIdx = MONTH_NAMES.findIndex(mn => mn.toLowerCase() === monStr);
    if(monIdx >= 0){
      let yr = parseInt(m[2], 10);
      if(yr < 100) yr = 2000 + yr;
      return { year:yr, month:monIdx+1, ym: `${yr}-${String(monIdx+1).padStart(2,'0')}` };
    }
  }
  // YYYY-MM or YYYY/MM only
  m = s.match(/^(\d{4})[-/](\d{1,2})$/);
  if(m){
    const yr = parseInt(m[1],10), mo = parseInt(m[2],10);
    if(mo>=1 && mo<=12) return { year:yr, month:mo, ym: `${yr}-${String(mo).padStart(2,'0')}` };
  }
  // MM-YYYY or MM/YYYY — e.g. "01-2020"
  m = s.match(/^(\d{1,2})[-/](\d{4})$/);
  if(m){
    const mo = parseInt(m[1],10), yr = parseInt(m[2],10);
    if(mo>=1 && mo<=12) return { year:yr, month:mo, ym: `${yr}-${String(mo).padStart(2,'0')}` };
  }
  // DD/MM/YYYY or D/M/YYYY — UK style (since data is British)
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[\sT].*)?$/);
  if(m){
    const mo = parseInt(m[2],10), yr = parseInt(m[3],10);
    if(mo>=1 && mo<=12) return { year:yr, month:mo, ym: `${yr}-${String(mo).padStart(2,'0')}` };
  }
  // DD-MM-YYYY or DD-MMM-YYYY
  m = s.match(/^(\d{1,2})-([A-Za-z]{3,9})-(\d{2,4})$/);
  if(m){
    const monStr = m[2].toLowerCase().slice(0,3);
    const monIdx = MONTH_NAMES.findIndex(mn => mn.toLowerCase() === monStr);
    if(monIdx >= 0){
      let yr = parseInt(m[3], 10);
      if(yr < 100) yr = 2000 + yr;
      return { year:yr, month:monIdx+1, ym: `${yr}-${String(monIdx+1).padStart(2,'0')}` };
    }
  }
  // DD-MM-YYYY (numeric)
  m = s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
  if(m){
    const mo = parseInt(m[2],10), yr = parseInt(m[3],10);
    if(mo>=1 && mo<=12) return { year:yr, month:mo, ym: `${yr}-${String(mo).padStart(2,'0')}` };
  }
  // YYYY-MM-DD or YYYY/MM/DD, optionally with time
  m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})(?:[\sT].*)?$/);
  if(m){
    const yr = parseInt(m[1],10), mo = parseInt(m[2],10);
    if(mo>=1 && mo<=12) return { year:yr, month:mo, ym: `${yr}-${String(mo).padStart(2,'0')}` };
  }
  // "January 2020" / "January, 2020"
  m = s.match(/^([A-Za-z]{3,9}),?\s+(\d{4})$/);
  if(m){
    const monStr = m[1].toLowerCase().slice(0,3);
    const monIdx = MONTH_NAMES.findIndex(mn => mn.toLowerCase() === monStr);
    if(monIdx >= 0){
      const yr = parseInt(m[2],10);
      return { year:yr, month:monIdx+1, ym: `${yr}-${String(monIdx+1).padStart(2,'0')}` };
    }
  }
  // Excel serial number (days since 1900-01-01, with Excel leap-year bug)
  // Common range: 10000 (1927) to 80000 (2119). Accept 30000-80000 as real dates.
  if(/^\d+(\.\d+)?$/.test(s)){
    const serial = parseFloat(s);
    if(serial > 20000 && serial < 80000){
      // Excel: serial 1 = 1900-01-01; but 1900 was incorrectly treated as leap year, offset by 2
      const ms = (serial - 25569) * 86400 * 1000;
      const d = new Date(ms);
      if(!isNaN(d.getTime())){
        return { year: d.getUTCFullYear(), month: d.getUTCMonth()+1, ym: `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}` };
      }
    }
  }
  // Last resort: try Date constructor (covers many ISO and JS-parseable formats)
  const d = new Date(s);
  if(!isNaN(d.getTime()) && d.getFullYear() > 1990 && d.getFullYear() < 2100){
    return { year: d.getFullYear(), month: d.getMonth()+1, ym: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}` };
  }
  return null;
}

// UU FY: April–March. Month>=4 -> FY = calYear+1; else FY = calYear.
function computeFY(year, month){
  return month >= 4 ? year + 1 : year;
}
function computeFYQuarter(month){
  // Q1 Apr-Jun, Q2 Jul-Sep, Q3 Oct-Dec, Q4 Jan-Mar
  if(month >= 4 && month <= 6) return 1;
  if(month >= 7 && month <= 9) return 2;
  if(month >= 10 && month <= 12) return 3;
  return 4;
}
function fyLabel(fy){ return `FY${String(fy).slice(-2)}`; }
function fyQuarterLabel(fy, q){ return `${fyLabel(fy)} Q${q}`; }
function monthLabel(ym){
  const [y,m] = ym.split('-').map(Number);
  return `${MONTH_NAMES[m-1]}-${String(y).slice(-2)}`;
}
// FY quarter ordinal for sorting: fy*10 + q
function fyQOrd(fy, q){ return fy*10 + q; }

// ---------- Utility: Business area & county parsing ----------
function parsePlantDesc(raw){
  if(!raw) return { businessArea:'Unknown', county:null };
  const s = String(raw).trim();
  // Normalise variants of Greater Manchester
  const normalise = v => v.replace(/Greater Manch(\b|$)/i, 'Greater Manchester').trim();

  // WW Network DAM - County
  let m = s.match(/^WW Network DAM\s*-\s*(.+)$/i);
  if(m) return { businessArea:'WW Network', county: normalise(m[1]) };
  // Wastewater County
  m = s.match(/^Wastewater\s+(.+)$/i);
  if(m){
    const rest = normalise(m[1]);
    // Handle "Wastewater Network" / "Wastewater  Network" which is not a county
    if(/^network$/i.test(rest)) return { businessArea:'Wastewater', county:null };
    return { businessArea:'Wastewater', county: rest };
  }
  // Water County
  m = s.match(/^Water\s+(.+)$/i);
  if(m) return { businessArea:'Water', county: normalise(m[1]) };
  // Bio-resourcing
  if(/^bio-?resourcing$/i.test(s)) return { businessArea:'Bio-resourcing', county:null };
  // Other Area
  if(/^other area$/i.test(s)) return { businessArea:'Other Area', county:null };
  // Unknown
  if(/^unknown$/i.test(s) || s === '') return { businessArea:'Unknown', county:null };
  // Default
  return { businessArea:'Unknown', county:null };
}

// ---------- Utility: numbers ----------
function toNum(v){
  if(v === null || v === undefined || v === '') return 0;
  if(typeof v === 'number') return v;
  const s = String(v).replace(/[£$€,\s]/g,'');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function fmtCurrency(v){
  if(v === null || v === undefined || !isFinite(v)) return '—';
  const abs = Math.abs(v);
  if(abs >= 1e9) return '£' + (v/1e9).toFixed(2) + 'bn';
  if(abs >= 1e6) return '£' + (v/1e6).toFixed(2) + 'M';
  if(abs >= 1e3) return '£' + (v/1e3).toFixed(1) + 'k';
  return '£' + v.toFixed(0);
}
function fmtCurrencyFull(v){
  if(v === null || v === undefined || !isFinite(v)) return '—';
  return '£' + v.toLocaleString('en-GB', {maximumFractionDigits:0});
}
function fmtNum(v){
  if(v === null || v === undefined || !isFinite(v)) return '—';
  return v.toLocaleString('en-GB', {maximumFractionDigits:0});
}
function fmtPct(v){
  if(v === null || v === undefined || !isFinite(v)) return '—';
  return v.toFixed(1) + '%';
}
function fmtDelta(v, isPct){
  if(v === null || v === undefined || !isFinite(v)) return '—';
  const sign = v > 0 ? '+' : '';
  return isPct ? (sign + v.toFixed(1) + 'pp') : (sign + (v*100).toFixed(1) + '%');
}

// ---------- Multi-select builder ----------
function buildMultiSelect(container, options, selectedSet, onChange){
  container.innerHTML = '';
  container.classList.add('multi-select');
  const trigger = document.createElement('div');
  trigger.className = 'multi-select-trigger';
  const panel = document.createElement('div');
  panel.className = 'multi-select-panel';

  const actions = document.createElement('div');
  actions.className = 'ms-actions';
  const allBtn = document.createElement('button');
  allBtn.className = 'btn btn-small';
  allBtn.textContent = 'All';
  const noneBtn = document.createElement('button');
  noneBtn.className = 'btn btn-small';
  noneBtn.textContent = 'None';
  actions.appendChild(allBtn);
  actions.appendChild(noneBtn);
  panel.appendChild(actions);

  const updateTriggerLabel = () => {
    if(selectedSet.size === 0 || selectedSet.size === options.length){
      trigger.firstChild.textContent = `All (${options.length})`;
    } else {
      trigger.firstChild.textContent = `${selectedSet.size} selected`;
    }
  };
  const labelSpan = document.createElement('span');
  trigger.appendChild(labelSpan);

  options.forEach(opt => {
    const lbl = document.createElement('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = selectedSet.has(opt);
    cb.addEventListener('change', () => {
      if(cb.checked) selectedSet.add(opt); else selectedSet.delete(opt);
      updateTriggerLabel();
      onChange();
    });
    lbl.appendChild(cb);
    lbl.appendChild(document.createTextNode(' ' + opt));
    panel.appendChild(lbl);
  });

  allBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    options.forEach(o => selectedSet.add(o));
    panel.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = true);
    updateTriggerLabel();
    onChange();
  });
  noneBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    selectedSet.clear();
    panel.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = false);
    updateTriggerLabel();
    onChange();
  });

  trigger.addEventListener('click', (e) => {
    e.stopPropagation();
    document.querySelectorAll('.multi-select.open').forEach(el => {
      if(el !== container) el.classList.remove('open');
    });
    container.classList.toggle('open');
  });

  container.appendChild(trigger);
  container.appendChild(panel);
  updateTriggerLabel();
}

// ---------- Inflation (real-terms deflation) control ----------
// Applies across every tab: deflates historical costs to today's money by the entered annual
// rate, so charts, fitted relationships, baselines and forecasts all reflect real (net-of-
// inflation) cost trends. Volumes are never affected. 0% = nominal cash (unchanged).
function updateInflationHint(){
  const hint = document.getElementById('inflationHint');
  if(!hint) return;
  const rate = STATE.inflationPct || 0;
  if(!rate){ hint.textContent = ''; return; }
  const anchor = inflationLatestMonth();
  hint.textContent = anchor ? `Costs shown in real terms at ${monthLabel(anchor)} prices` : 'Costs shown in real terms';
}
(function wireInflation(){
  const inp = document.getElementById('inflationInput');
  if(!inp) return;
  const apply = () => {
    let v = parseFloat(inp.value);
    if(!isFinite(v) || v < 0) v = 0;
    if(v > 100) v = 100;
    inp.value = String(v);
    if(v === (STATE.inflationPct || 0)) return;   // no change
    STATE.inflationPct = v;
    updateInflationHint();
    // Cost-derived caches are keyed by rate, but clear the working cache to be safe and
    // re-render whatever is on screen so every visual updates immediately.
    _renderCache = null;
    rerenderAll();
  };
  inp.addEventListener('change', apply);
  inp.addEventListener('input', () => {
    // Live-update the hint text as they type, but only re-render on change/blur (cheaper).
    const v = parseFloat(inp.value);
    if(isFinite(v) && v >= 0) { /* hint updates on apply */ }
  });
})();

// ---------- File reading ----------
function readFileAsText(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new Error('Failed to read file'));
    r.readAsText(file);
  });
}

// ---------- Load cost file ----------
// Aggregates on ingest: groups by (ym, site, assetClass, assetType, businessArea, county)
// and sums all numeric columns. This collapses 647k detail rows to typically 50-100k
// aggregate rows, making every downstream operation dramatically faster.
async function loadCostFile(file){
  showLoading('Parsing cost file (' + Math.round(file.size/1024/1024) + ' MB)...');
  // Allow the UI to repaint the "loading" message before we start
  await new Promise(r => setTimeout(r, 20));

  const text = await readFileAsText(file);
  showLoading('Parsing ' + fmtNum(text.length) + ' characters...');
  await new Promise(r => setTimeout(r, 20));

  // ---- Single streaming pass: parse each row and aggregate it immediately, then discard it.
  // Peak memory is the raw text + the aggregation map (typically 50-100k rows), NOT three
  // full-file copies of the detail rows. This is what stops large files crashing mid-load.
  const agg = new Map();
  let skipped = 0;
  const skippedSamples = [];
  let rowCount = 0;
  let headers = null;
  let colIdx = null;         // header name -> column index, resolved once
  let missing = null;

  // Yield to the browser roughly every CHUNK rows so the tab stays responsive. We can't await
  // inside the synchronous streamer, so we count rows and yield between micro-batches by
  // parsing in slices is complex; instead we do periodic synchronous progress + a yield using
  // a lightweight counter checked in onRow (progress text only) and one yield pass at the end
  // of parsing. To keep true responsiveness on huge files, we chunk the raw text by lines.
  const CHUNK = 25000;

  const getVal = (fields, name) => {
    const idx = colIdx[name];
    return (idx === undefined || idx < 0) ? '' : (fields[idx] !== undefined ? fields[idx] : '');
  };
  // Try several possible column names (first match wins) — used where files disagree on a
  // header name (e.g. criticality as 'SAP_CRITICALITY' vs 'Criticality'). Case-insensitive.
  const _colIdxLower = null; // built lazily below
  let _lowerMap = null;
  const getValAny = (fields, names) => {
    for(const n of names){
      const idx = colIdx[n];
      if(idx !== undefined && idx >= 0) return fields[idx] !== undefined ? fields[idx] : '';
    }
    // Case-insensitive fallback
    if(!_lowerMap){ _lowerMap = {}; for(const k in colIdx){ _lowerMap[k.toLowerCase()] = colIdx[k]; } }
    for(const n of names){
      const idx = _lowerMap[n.toLowerCase()];
      if(idx !== undefined && idx >= 0) return fields[idx] !== undefined ? fields[idx] : '';
    }
    return '';
  };

  const onRow = (fields) => {
    rowCount++;
    const dt = parseMonthCell(getVal(fields, 'REPORT_MONTH'));
    if(!dt){
      skipped++;
      if(skippedSamples.length < 5) skippedSamples.push(getVal(fields, 'REPORT_MONTH'));
      return;
    }
    const plant = parsePlantDesc(getVal(fields, 'MAINTENANCE_PLANT_DESC'));
    const site = getVal(fields, 'SITE_DESC') || '';
    const assetType = getVal(fields, 'EQUIPMENT_CLASS_DESCRIPTION') || '';
    const assetClass = getVal(fields, 'ASSET_CLASS_DESCRIPTION') || '';
    const equipmentClass = getVal(fields, 'EQUIPMENT_CLASS') || '';
    const businessArea = plant.businessArea;
    const county = plant.county || '';
    // SAP criticality is optional — present in newer files, absent in older ones. Normalise
    // blanks to a pseudo-value so rows without it can still be filtered/seen.
    // Criticality column may be named differently across files: 'SAP_CRITICALITY' (PM) or
    // 'Criticality' (cost). Accept whichever is present. getValAny tries each name in order.
    const sapCriticality = normCriticality(getValAny(fields, ['SAP_CRITICALITY', 'Criticality', 'CRITICALITY', 'SAP_Criticality']));
    const key = dt.ym + '|' + site + '|' + assetClass + '|' + assetType + '|' + businessArea + '|' + county + '|' + equipmentClass + '|' + sapCriticality;

    let row = agg.get(key);
    if(!row){
      row = {
        ym: dt.ym, year: dt.year, month: dt.month,
        fy: computeFY(dt.year, dt.month), fyq: computeFYQuarter(dt.month),
        site, equipmentClass, assetType, assetClass,
        businessArea, county: plant.county, sapCriticality,
        totalWO: 0, reactiveWO: 0, proactiveWO: 0, preventativeWO: 0, otherWO: 0,
        totalCost: 0, reactiveCost: 0, proactiveCost: 0, preventativeCost: 0, otherCost: 0,
        reactiveLabour: 0, reactiveContractor: 0, reactiveMaterials: 0, reactiveOther: 0,
        proactiveLabour: 0, proactiveContractor: 0, proactiveMaterials: 0, proactiveOther: 0,
        correctiveWO: 0, correctiveCost: 0
      };
      agg.set(key, row);
    }
    row.totalWO        += toNum(getVal(fields, 'TOTAL_WORKORDERS'));
    row.reactiveWO     += toNum(getVal(fields, 'REACTIVE_WORKORDERS'));
    row.proactiveWO    += toNum(getVal(fields, 'PROACTIVE_WORKORDERS'));
    row.preventativeWO += toNum(getVal(fields, 'PREVENTATIVE_WORKORDERS'));
    row.otherWO        += toNum(getVal(fields, 'OTHER_WORKORDERS'));
    row.totalCost        += toNum(getVal(fields, 'TOTAL_COST_ACTUAL'));
    row.reactiveCost     += toNum(getVal(fields, 'TOTAL_REACTIVE_CORRECTIVE_COST'));
    row.proactiveCost    += toNum(getVal(fields, 'TOTAL_PROACTIVE_CORRECTIVE_COST'));
    row.preventativeCost += toNum(getVal(fields, 'TOTAL_PREVENTATIVE_COST'));
    row.otherCost        += toNum(getVal(fields, 'TOTAL_OTHER_COST'));
    row.reactiveLabour     += toNum(getVal(fields, 'REACTIVE_CORRECTIVE_LABOUR'));
    row.reactiveContractor += toNum(getVal(fields, 'REACTIVE_CORRECTIVE_CONTRACTOR'));
    row.reactiveMaterials  += toNum(getVal(fields, 'REACTIVE_CORRECTIVE_MATERIALS'));
    row.reactiveOther      += toNum(getVal(fields, 'REACTIVE_CORRECTIVE_OTHER'));
    row.proactiveLabour     += toNum(getVal(fields, 'PROACTIVE_CORRECTIVE_LABOUR'));
    row.proactiveContractor += toNum(getVal(fields, 'PROACTIVE_CORRECTIVE_CONTRACTOR'));
    row.proactiveMaterials  += toNum(getVal(fields, 'PROACTIVE_CORRECTIVE_MATERIALS'));
    row.proactiveOther      += toNum(getVal(fields, 'PROACTIVE_CORRECTIVE_OTHER'));
  };

  // Parse the file in raw-text line slices so we can yield to the browser between micro-batches
  // (keeping the progress bar alive on very large files) while still never holding more than the
  // aggregation map. We hand each slice to the streaming parser; the header is resolved from the
  // first slice only.
  let clean = text;
  if(clean.charCodeAt(0) === 0xFEFF) clean = clean.slice(1);
  const total = clean.length;
  // Resolve headers from the first line, validate columns, THEN stream the rest.
  {
    const firstNL = clean.indexOf('\n');
    const headerLine = firstNL >= 0 ? clean.slice(0, firstNL) : clean;
    const delim = detectDelimiter(headerLine);
    const rawHeaders = (delim === '\t')
      ? headerLine.replace(/\r$/, '').split('\t').map(h => h.trim())
      : parseHeaderCsvLine(headerLine);
    // Resolve columns by exact header name. A leading unnamed pandas index column (if present)
    // simply never matches a required name, so it's harmless — no special handling needed.
    headers = rawHeaders;
    colIdx = {};
    headers.forEach((h, idx) => { if(colIdx[h] === undefined) colIdx[h] = idx; });
    missing = COST_COLUMNS.filter(c => colIdx[c] === undefined);
    if(missing.length){
      hideLoading();
      throw new Error('Cost file missing columns: ' + missing.join(', '));
    }
  }

  showLoading('Reading & aggregating rows...');
  await new Promise(r => setTimeout(r, 20));

  // Stream by walking newline-delimited slices, yielding every CHUNK rows. We feed complete
  // lines to a per-line parser so quoted newlines are still handled within a line via the
  // full streamer as a fallback. For robustness with quoted fields spanning the batch boundary,
  // we accumulate until quotes balance before parsing a batch.
  let processedSinceYield = 0;
  const headerNL = clean.indexOf('\n');
  let pos = headerNL >= 0 ? headerNL + 1 : total;   // start after header line
  const delimIsComma = detectDelimiter(clean.slice(0, headerNL >= 0 ? headerNL : total)) === ',';

  // Build a small helper to parse a single data line (comma with quotes, or tab).
  const parseLine = delimIsComma ? parseCsvDataLine : (line) => line.replace(/\r$/, '').split('\t');

  let batchStart = pos;
  while(pos <= total){
    let nl = clean.indexOf('\n', pos);
    if(nl === -1) nl = total;
    // Handle a possible quoted newline in comma files: if the line so far has an odd number of
    // unescaped quotes, keep extending to the next newline.
    let lineEnd = nl;
    if(delimIsComma){
      while(lineEnd < total && ((clean.slice(pos, lineEnd).split('"').length - 1) % 2 === 1)){
        let nxt = clean.indexOf('\n', lineEnd + 1);
        if(nxt === -1){ lineEnd = total; break; }
        lineEnd = nxt;
      }
    }
    if(lineEnd > pos){
      const line = clean.slice(pos, lineEnd);
      if(line.trim() !== ''){
        const fields = parseLine(line);
        onRow(fields);
        processedSinceYield++;
      }
    }
    pos = lineEnd + 1;
    if(processedSinceYield >= CHUNK){
      processedSinceYield = 0;
      showProgress('Aggregating cost rows: ' + fmtNum(rowCount) + ' read...', Math.min(99, pos / total * 100));
      await new Promise(r => setTimeout(r, 0));
    }
    if(lineEnd >= total) break;
  }

  // Finalise derived sums
  for(const row of agg.values()){
    row.correctiveWO = row.reactiveWO + row.proactiveWO;
    row.correctiveCost = row.reactiveCost + row.proactiveCost;
  }

  const enriched = Array.from(agg.values());
  STATE.costRaw = { name: file.name, rowCount, skipped, aggregatedCount: enriched.length };
  STATE.costEnriched = enriched;

  renderCostFileList();
  rebuildDimensions();
  initialiseFiltersIfReady();
  rerenderAll();
  flashLoadSuccess(`Cost data loaded — ${fmtNum(enriched.length)} rows from ${fmtNum(rowCount)} input rows${skipped ? ' (' + skipped + ' skipped)' : ''}`);

  // Post-load diagnostics
  if(enriched.length === 0 && skipped > 0){
    const samplesTxt = skippedSamples.map(s => JSON.stringify(s)).join(', ');
    alert('All ' + skipped + ' rows skipped — could not parse MONTH column.\n\n' +
          'First few MONTH values seen: ' + samplesTxt + '\n\n' +
          'Expected formats: "Jan-20", "01/01/2020", or "2020-01-15".');
  } else if(skipped > 0 && skipped > enriched.length * 0.01){
    // More than 1% skipped — warn
    const samplesTxt = skippedSamples.map(s => JSON.stringify(s)).join(', ');
    console.warn('Cost load: ' + skipped + ' of ' + rows.length + ' rows skipped. Sample unparseable MONTH values: ' + samplesTxt);
  }
}

// ---------- Load PM file ----------
async function loadPMFile(file){
  showLoading('Parsing PM file ' + file.name + '...');
  const text = await readFileAsText(file);
  const { headers, rows } = parseDelimited(text);

  // Tolerant validation (mirrors the cost loader): require only the columns PM
  // compliance actually needs. Compliance = 1 - overdue_tasks / total_tasks, grouped by
  // asset class over the reporting month; everything else is optional context.
  const missing = PM_COLUMNS_REQUIRED.filter(c => !headers.includes(c));
  if(missing.length){
    hideLoading();
    throw new Error('PM file missing columns: ' + missing.join(', '));
  }

  showProgress('Aggregating PM rows: 0 / ' + fmtNum(rows.length), 0);
  await new Promise(r => setTimeout(r, 20));

  // Aggregate to (ym, site, assetClass, assetType, businessArea, county, equipmentClass)
  const agg = new Map();
  let skipped = 0;
  const total = rows.length;
  const CHUNK = 50000;
  for(let i = 0; i < total; i++){
    const r = rows[i];
    const dt = parseMonthCell(r.MONTH) || parseMonthCell(r.START_DATE_MONTH);
    if(!dt){ skipped++; continue; }
    const plant = parsePlantDesc(r.MAINTENANCE_PLANT_DESC);
    const site = r.SITE_DESC || '';
    const assetType = r.EQUIPMENT_CLASS_DESCRIPTION || '';
    const assetClass = r.ASSET_CLASS_DESCRIPTION || '';
    const equipmentClass = r.EQUIPMENT_CLASS || '';
    const businessArea = plant.businessArea;
    const county = plant.county || '';
    const sapCriticality = normCriticality(r.SAP_CRITICALITY != null ? r.SAP_CRITICALITY
      : (r.Criticality != null ? r.Criticality
      : (r.CRITICALITY != null ? r.CRITICALITY : r.SAP_Criticality)));
    const key = dt.ym + '|' + site + '|' + assetClass + '|' + assetType + '|' + businessArea + '|' + county + '|' + equipmentClass + '|' + sapCriticality;

    let row = agg.get(key);
    if(!row){
      row = {
        ym: dt.ym, year: dt.year, month: dt.month,
        fy: computeFY(dt.year, dt.month), fyq: computeFYQuarter(dt.month),
        site, equipmentClass, assetType, assetClass,
        businessArea, county: plant.county, sapCriticality,
        totalTasks: 0, overdueTasks: 0,
        _file: file.name
      };
      agg.set(key, row);
    }
    row.totalTasks += toNum(r.total_tasks);
    row.overdueTasks += toNum(r.overdue_tasks);
    if((i + 1) % CHUNK === 0){
      showProgress(`Aggregating PM rows from ${escapeHtml(file.name)}: ${fmtNum(i + 1)} / ${fmtNum(total)}`, (i + 1) / total * 100);
      await new Promise(r => setTimeout(r, 0));
    }
  }

  const enriched = Array.from(agg.values());

  // Handle overlap: replace — drop any existing rows with matching key
  const newKeys = new Set(enriched.map(r => `${r.ym}|${r.site}|${r.equipmentClass}`));
  STATE.pmEnriched = (STATE.pmEnriched || []).filter(r => !newKeys.has(`${r.ym}|${r.site}|${r.equipmentClass}`));
  STATE.pmEnriched = STATE.pmEnriched.concat(enriched);

  // Compute file meta — find min/max YM in single pass
  let minYm = null, maxYm = null;
  for(const r of enriched){
    if(minYm === null || r.ym < minYm) minYm = r.ym;
    if(maxYm === null || r.ym > maxYm) maxYm = r.ym;
  }
  const meta = {
    name: file.name,
    rowCount: rows.length,
    parsed: enriched.length,
    skipped,
    minMonth: minYm,
    maxMonth: maxYm
  };
  // If file with same name already exists, replace the meta entry
  STATE.pmFiles = STATE.pmFiles.filter(f => f.name !== file.name);
  STATE.pmFiles.push(meta);

  renderPMFileList();
  rebuildDimensions();
  initialiseFiltersIfReady();
  rerenderAll();
  flashLoadSuccess(`PM compliance loaded — ${fmtNum(enriched.length)} aggregated rows from ${escapeHtml(file.name)}${skipped ? ' (' + skipped + ' skipped)' : ''}`);
}

// ---------- File list rendering ----------
function renderCostFileList(){
  const el = document.getElementById('costFileList');
  if(!STATE.costRaw){ el.innerHTML = ''; return; }
  const r = STATE.costRaw;
  el.innerHTML = `<span class="file-chip">${escapeHtml(r.name)} · ${fmtNum(STATE.costEnriched.length)} rows${r.skipped ? ` · ${r.skipped} skipped` : ''}</span>`;
}
function renderPMFileList(){
  const el = document.getElementById('pmFileList');
  if(!STATE.pmFiles.length){ el.innerHTML = ''; return; }
  const files = STATE.pmFiles;

  // Collapsed summary chip + expandable panel
  // Compute combined row count and date range
  let totalParsed = 0, combinedMin = null, combinedMax = null;
  for(const f of files){
    totalParsed += f.parsed;
    if(combinedMin === null || (f.minMonth && f.minMonth < combinedMin)) combinedMin = f.minMonth;
    if(combinedMax === null || (f.maxMonth && f.maxMonth > combinedMax)) combinedMax = f.maxMonth;
  }
  const summaryText = `${files.length} file${files.length===1?'':'s'} · ${fmtNum(totalParsed)} rows${combinedMin && combinedMax ? ` · ${monthLabel(combinedMin)} to ${monthLabel(combinedMax)}` : ''}`;

  el.innerHTML = `
    <span class="file-chip pm-summary-chip" id="pmSummaryChip" title="Click for file details">
      ${escapeHtml(summaryText)}
      <span class="pm-summary-caret">▾</span>
    </span>
    <div class="pm-file-detail-panel" id="pmFileDetailPanel">
      <div class="pm-file-detail-header">Loaded PM files</div>
      ${files.map(f => `
        <div class="pm-file-detail-row">
          <div class="pm-file-detail-name" title="${escapeHtml(f.name)}">${escapeHtml(f.name)}</div>
          <div class="pm-file-detail-meta">${fmtNum(f.parsed)} rows · ${monthLabel(f.minMonth)} to ${monthLabel(f.maxMonth)}${f.skipped ? ` · ${fmtNum(f.skipped)} skipped` : ''}</div>
          <button class="pm-file-detail-remove" data-name="${escapeHtml(f.name)}" title="Remove this file">×</button>
        </div>
      `).join('')}
    </div>
  `;

  const chip = document.getElementById('pmSummaryChip');
  const panel = document.getElementById('pmFileDetailPanel');
  chip.addEventListener('click', (e) => {
    e.stopPropagation();
    panel.classList.toggle('open');
    chip.classList.toggle('open');
  });
  // Close panel on outside click
  const closeOnOutside = (e) => {
    if(!panel.contains(e.target) && e.target !== chip && !chip.contains(e.target)){
      panel.classList.remove('open');
      chip.classList.remove('open');
    }
  };
  document.addEventListener('click', closeOnOutside, { once: false });

  el.querySelectorAll('button[data-name]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const name = btn.dataset.name;
      const meta = STATE.pmFiles.find(f => f.name === name);
      if(!meta) return;
      STATE.pmFiles = STATE.pmFiles.filter(f => f.name !== name);
      STATE.pmEnriched = (STATE.pmEnriched || []).filter(row => row._file !== name);
      renderPMFileList();
      updateCoverage();
      rerenderAll();
    });
  });
}

// ---------- HTML escape ----------
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- Loading indicator ----------
function showLoading(msg){
  const el = document.getElementById('coverageInfo');
  if(el) el.innerHTML = '<span class="loading">' + escapeHtml(msg) + '</span>';
}
// Progress-bar variant: call with (msg, pct) where pct is 0..100, or null for indeterminate
function showProgress(msg, pct){
  const el = document.getElementById('coverageInfo');
  if(!el) return;
  const hasPct = pct != null && isFinite(pct);
  const clamped = hasPct ? Math.max(0, Math.min(100, pct)) : 0;
  const pctLbl = hasPct ? ` <strong>${clamped.toFixed(0)}%</strong>` : '';
  const barCls = hasPct ? '' : 'indeterminate';
  el.innerHTML = `
    <div class="load-progress-wrap">
      <div class="load-progress-label">${escapeHtml(msg)}${pctLbl}</div>
      <div class="load-progress-track"><div class="load-progress-bar ${barCls}" style="width:${clamped.toFixed(1)}%"></div></div>
    </div>
  `;
}
function hideLoading(){ updateCoverage(); }
// Brief green confirmation after a load — reverts to normal coverage after 1.6s
let _successTimer = null;
function flashLoadSuccess(msg){
  const el = document.getElementById('coverageInfo');
  if(!el) return;
  el.classList.add('coverage-success');
  el.innerHTML = `<span class="coverage-check">✓</span>${escapeHtml(msg)}`;
  clearTimeout(_successTimer);
  _successTimer = setTimeout(() => {
    el.classList.remove('coverage-success');
    updateCoverage();
  }, 1800);
}

// ---------- Coverage info ----------
function updateCoverage(){
  const el = document.getElementById('coverageInfo');
  if(typeof updateInflationHint === 'function') updateInflationHint();
  const parts = [];
  const minMax = (rows) => {
    let mn = null, mx = null;
    for(const r of rows){
      if(mn === null || r.ym < mn) mn = r.ym;
      if(mx === null || r.ym > mx) mx = r.ym;
    }
    return [mn, mx];
  };
  if(STATE.costEnriched && STATE.costEnriched.length){
    const [mn, mx] = minMax(STATE.costEnriched);
    parts.push(`Cost: ${monthLabel(mn)} to ${monthLabel(mx)} (${fmtNum(STATE.costEnriched.length)} rows)`);
  }
  if(STATE.pmEnriched && STATE.pmEnriched.length){
    const [mn, mx] = minMax(STATE.pmEnriched);
    parts.push(`PM: ${monthLabel(mn)} to ${monthLabel(mx)} (${STATE.pmFiles.length} file${STATE.pmFiles.length===1?'':'s'}, ${fmtNum(STATE.pmEnriched.length)} rows)`);
  }
  el.innerHTML = parts.length ? parts.join(' &nbsp;|&nbsp; ') : 'No data loaded';
}

// ---------- Build available dimensions ----------
function rebuildDimensions(){
  const months = new Set();
  const businessAreas = new Set();
  const counties = new Set();
  const criticalities = new Set();
  const assetClasses = new Set();
  const assetTypes = new Set();
  const sites = new Set();

  let hasNullCounty = false;
  const collect = (rows) => {
    if(!rows) return;
    for(const r of rows){
      months.add(r.ym);
      businessAreas.add(r.businessArea || 'Unknown');
      if(r.county) counties.add(r.county);
      else hasNullCounty = true;
      criticalities.add(normCriticality(r.sapCriticality));
      if(r.assetClass) assetClasses.add(r.assetClass);
      if(r.assetType) assetTypes.add(r.assetType);
      if(r.site) sites.add(r.site);
    }
  };
  collect(STATE.costEnriched);
  collect(STATE.pmEnriched);

  // Surface a pseudo-county 'No county' for rows from plants without a county
  // assignment (Bio-resourcing, WW Network DAM non-counties, Other Area, unparseable).
  // This lets the user filter / see how much spend is untagged.
  const countyList = [...counties].sort();
  if(hasNullCounty) countyList.push('No county');

  // Criticality list: natural sort, but keep the pseudo-value 'Unspecified' last.
  const critList = [...criticalities].filter(c => c !== 'Unspecified').sort((a, b) =>
    String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' }));
  if(criticalities.has('Unspecified')) critList.push('Unspecified');

  STATE.allMonths = [...months].sort();
  STATE.dimensions = {
    businessAreas: [...businessAreas].sort(),
    counties: countyList,
    criticalities: critList,
    assetClasses: [...assetClasses].sort(),
    assetTypes: [...assetTypes].sort(),
    sites: [...sites].sort()
  };
  // Pre-index rows by asset class so Deep-dive filter changes only iterate the
  // selected class's rows instead of scanning all ~50k cost / ~1.8M PM rows.
  // Asset class is immutable per row, so this index is safe to build once.
  const byClass = (rows) => {
    const m = new Map();
    if(!rows) return m;
    for(const r of rows){
      const ac = r.assetClass || 'Unknown';
      let arr = m.get(ac);
      if(!arr){ arr = []; m.set(ac, arr); }
      arr.push(r);
    }
    return m;
  };
  STATE.costByAssetClass = byClass(STATE.costEnriched);
  STATE.pmByAssetClass = byClass(STATE.pmEnriched);
  // Invalidate the default asset-class selection cache - new data may change the ranking
  if(typeof invalidateDefaultAssetClassCache === 'function') invalidateDefaultAssetClassCache();
}

// ---------- Initialise filter UI once data is loaded ----------
function initialiseFiltersIfReady(){
  if(!STATE.costEnriched && !STATE.pmEnriched) return;
  const bar = document.getElementById('globalFilterBar');
  // Hidden on the Forecast result tab (results follow only the Forward look assumptions).
  bar.style.display = (STATE.activeTab === 'section4' || STATE.activeTab === 'section5') ? 'none' : '';
  document.getElementById('emptyState').style.display = 'none';

  // Time range dropdowns
  const tFrom = document.getElementById('fltTimeFrom');
  const tTo = document.getElementById('fltTimeTo');
  const months = STATE.allMonths;
  const optHtml = months.map(m => `<option value="${m}">${monthLabel(m)}</option>`).join('');
  tFrom.innerHTML = optHtml;
  tTo.innerHTML = optHtml;

  // Default: all
  if(!STATE.filters.timeFrom || !months.includes(STATE.filters.timeFrom)){
    STATE.filters.timeFrom = months[0];
  }
  if(!STATE.filters.timeTo || !months.includes(STATE.filters.timeTo)){
    STATE.filters.timeTo = months[months.length-1];
  }
  tFrom.value = STATE.filters.timeFrom;
  tTo.value = STATE.filters.timeTo;

  tFrom.onchange = () => {
    STATE.filters.timeFrom = tFrom.value;
    if(STATE.filters.timeFrom > STATE.filters.timeTo){
      STATE.filters.timeTo = STATE.filters.timeFrom;
      tTo.value = STATE.filters.timeTo;
    }
    updateActivePresetButton();
    rerenderAll();
  };
  tTo.onchange = () => {
    STATE.filters.timeTo = tTo.value;
    if(STATE.filters.timeTo < STATE.filters.timeFrom){
      STATE.filters.timeFrom = STATE.filters.timeTo;
      tFrom.value = STATE.filters.timeFrom;
    }
    updateActivePresetButton();
    rerenderAll();
  };

  // Preset buttons (inline with Time range)
  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.onclick = () => {
      const v = btn.getAttribute('data-preset');
      applyTimePreset(v);
      tFrom.value = STATE.filters.timeFrom;
      tTo.value = STATE.filters.timeTo;
      updateActivePresetButton();
      STATE.filters.focusPeriod = 'latest-complete';
      rebuildFocusPeriodDropdown();
      rerenderAll();
    };
  });
  // On first init, mark 'All' as active since the default is full history
  updateActivePresetButton();

  // Aggregation
  const aggSel = document.getElementById('fltAggregation');
  aggSel.value = STATE.filters.aggregation;
  aggSel.onchange = () => {
    STATE.filters.aggregation = aggSel.value;
    // Reset focus period to auto on aggregation change - period list is different now
    STATE.filters.focusPeriod = 'latest-complete';
    rebuildFocusPeriodDropdown();
    rerenderAll();
  };

  // Focus period dropdown (populated based on current aggregation + time range)
  rebuildFocusPeriodDropdown();
  document.getElementById('fltFocusPeriod').onchange = (e) => {
    STATE.filters.focusPeriod = e.target.value;
    rerenderAll();
  };

  // Comparison mode
  const cmpSel = document.getElementById('fltComparison');
  cmpSel.value = STATE.filters.comparisonMode;
  cmpSel.onchange = () => { STATE.filters.comparisonMode = cmpSel.value; rerenderAll(); };

  // Business area multi
  if(STATE.filters.businessArea.size === 0){
    STATE.dimensions.businessAreas.forEach(b => STATE.filters.businessArea.add(b));
  }
  buildMultiSelect(document.getElementById('fltBusinessArea'), STATE.dimensions.businessAreas, STATE.filters.businessArea, rerenderAll);

  // County multi
  if(STATE.filters.county.size === 0){
    STATE.dimensions.counties.forEach(c => STATE.filters.county.add(c));
  }
  buildMultiSelect(document.getElementById('fltCounty'), STATE.dimensions.counties, STATE.filters.county, rerenderAll);

  // SAP criticality multi (optional dimension; may be just ['Unspecified'] for older files).
  // Default = ALL selected. Drop any previously-selected values that are no longer present
  // (e.g. after loading different data), and if nothing valid remains, select everything.
  {
    const critDim = STATE.dimensions.criticalities || [];
    const critSet = new Set(critDim);
    for(const v of [...STATE.filters.criticality]){ if(!critSet.has(v)) STATE.filters.criticality.delete(v); }
    if(STATE.filters.criticality.size === 0){ critDim.forEach(c => STATE.filters.criticality.add(c)); }
  }
  buildMultiSelect(document.getElementById('fltCriticality'), STATE.dimensions.criticalities || [], STATE.filters.criticality, rerenderAll);

  // Asset class picker chip (full modal comes in Chunk 3). For now: shows count + no-op click.
  updateAssetClassChipLabel();
  document.getElementById('fltAssetClassChip').onclick = () => {
    if(typeof openAssetClassPicker === 'function'){
      openAssetClassPicker();
    } else {
      // Chunk 3 will implement the picker. For now, toggle between null (auto) and full set.
      console.log('Asset class picker will open in Chunk 3');
    }
  };

  // Include unknown toggle
  const unkToggle = document.getElementById('fltIncludeUnknown');
  unkToggle.checked = STATE.filters.includeUnknown;
  unkToggle.onchange = () => { STATE.filters.includeUnknown = unkToggle.checked; rerenderAll(); };
}

// Highlight the preset button (All / Last 2FY / Last FY / Last Q) that matches
// the current time range - or none if custom.
function updateActivePresetButton(){
  const months = STATE.allMonths;
  if(!months.length) return;
  const from = STATE.filters.timeFrom, to = STATE.filters.timeTo;
  const last = months[months.length - 1];
  const firstMatch = months[0] === from && last === to ? 'all' : null;
  let matched = firstMatch;
  if(!matched){
    // Test each preset by simulating and comparing
    const backup = { from, to };
    for(const p of ['last-quarter','last-fy','last-2fy']){
      applyTimePreset(p);
      if(STATE.filters.timeFrom === from && STATE.filters.timeTo === to){ matched = p; break; }
    }
    // Restore actual range (applyTimePreset has side effects on STATE)
    STATE.filters.timeFrom = backup.from;
    STATE.filters.timeTo = backup.to;
  }
  document.querySelectorAll('.preset-btn').forEach(b => {
    b.classList.toggle('active', b.getAttribute('data-preset') === matched);
  });
}

// ---------- Focus period helpers ----------
function rebuildFocusPeriodDropdown(){
  const sel = document.getElementById('fltFocusPeriod');
  if(!sel) return;
  const periods = getPeriodsInRange(STATE.filters.aggregation);
  const latestComplete = findLatestCompletePeriod(periods);
  let html = `<option value="latest-complete">Latest complete${latestComplete ? ' (' + escapeHtml(latestComplete) + ')' : ''}</option>`;
  // Most-recent-first so users don't scroll through old periods to reach current
  for(let i = periods.length - 1; i >= 0; i--){
    const p = periods[i];
    const isPartial = isPartialQuarter(p, getDataMonthsInRange());
    const suffix = isPartial ? ' (partial)' : '';
    html += `<option value="${escapeHtml(p)}">${escapeHtml(p)}${suffix}</option>`;
  }
  sel.innerHTML = html;
  // Reset to auto if current selection is no longer in range
  const cur = STATE.filters.focusPeriod;
  if(cur !== 'latest-complete' && !periods.includes(cur)){
    STATE.filters.focusPeriod = 'latest-complete';
  }
  sel.value = STATE.filters.focusPeriod;
}

// Latest period that has all constituent months present in the data
function findLatestCompletePeriod(periods){
  if(!periods || !periods.length) return null;
  const dataMonths = getDataMonthsInRange();
  for(let i = periods.length - 1; i >= 0; i--){
    if(!isPartialQuarter(periods[i], dataMonths)) return periods[i];
  }
  return periods[periods.length - 1] || null;
}

// Data months restricted to the filter time range
function getDataMonthsInRange(){
  const months = STATE.allMonths || [];
  const from = STATE.filters.timeFrom, to = STATE.filters.timeTo;
  if(!from || !to) return new Set(months);
  return new Set(months.filter(m => m >= from && m <= to));
}

// Resolve the current focus period from filter state (converts 'latest-complete' to actual period)
function resolveFocusPeriod(){
  if(STATE.filters.focusPeriod && STATE.filters.focusPeriod !== 'latest-complete'){
    return STATE.filters.focusPeriod;
  }
  return findLatestCompletePeriod(getPeriodsInRange(STATE.filters.aggregation));
}

// Is the focus period partial?
function isFocusPeriodPartial(){
  const p = resolveFocusPeriod();
  if(!p) return false;
  return isPartialQuarter(p, getDataMonthsInRange());
}

// Pretty-label the comparison mode for display
function comparisonModeLabel(){
  const m = STATE.filters.comparisonMode;
  return ({prior:'prior period','prior-year':'same period prior year','3yr-avg':'3-year average',none:'no comparison'})[m] || m;
}

// Compute the comparison period key for a given focus period, using global comparison mode
function resolveComparisonPeriod(focusPeriod){
  const mode = STATE.filters.comparisonMode;
  if(mode === 'none') return null;
  if(mode === '3yr-avg') return '3yr-avg';
  if(mode === 'prior') return priorPeriod(focusPeriod, STATE.filters.aggregation);
  if(mode === 'prior-year') return priorYearPeriod(focusPeriod, STATE.filters.aggregation);
  return null;
}

function applyTimePreset(preset){
  const months = STATE.allMonths;
  if(!months.length) return;
  const last = months[months.length-1];
  const [ly, lm] = last.split('-').map(Number);
  const lastDt = { year: ly, month: lm };
  let fromYm = months[0];
  if(preset === 'last-quarter'){
    // Last 3 months ending at last
    const idx = months.length - 1;
    fromYm = months[Math.max(0, idx - 2)];
  } else if(preset === 'last-fy'){
    // Last 12 months prior FY
    const fy = computeFY(ly, lm);
    // FY starts April of (fy-1); for full last FY, use fy-1 April start to fy-1 March end
    const prevFyStartYear = fy - 1;
    fromYm = `${prevFyStartYear-1}-04`; // starts Apr of (fy-1)? Actually FY N runs Apr(N-1)-Mar(N). Prior FY = FY(fy-1) => Apr(fy-2) - Mar(fy-1)
    const startY = fy - 2, endY = fy - 1;
    fromYm = `${startY}-04`;
    const toYm = `${endY}-03`;
    STATE.filters.timeFrom = months.includes(fromYm) ? fromYm : months[0];
    STATE.filters.timeTo = months.includes(toYm) ? toYm : months[months.length-1];
    return;
  } else if(preset === 'last-2fy'){
    const fy = computeFY(ly, lm);
    const startY = fy - 3;
    fromYm = `${startY}-04`;
    STATE.filters.timeFrom = months.includes(fromYm) ? fromYm : months[0];
    STATE.filters.timeTo = last;
    return;
  } else if(preset === 'all'){
    STATE.filters.timeFrom = months[0];
    STATE.filters.timeTo = last;
    return;
  }
  STATE.filters.timeFrom = fromYm;
  STATE.filters.timeTo = last;
}

// Per-class cost stats for the picker table (FY columns + average, respects global non-time filters)
function computeAssetClassPickerStats(classes){
  const f = STATE.filters;
  const hasBA = f.businessArea.size > 0 && f.businessArea.size < STATE.dimensions.businessAreas.length;
  const hasCty = f.county.size > 0 && f.county.size < STATE.dimensions.counties.length;
  // Determine FY list + complete FYs from all loaded months
  const fys = new Set();
  const monthsByFy = new Map();
  for(const ym of STATE.allMonths){
    const [y,m] = ym.split('-').map(Number);
    const fy = computeFY(y, m);
    fys.add(fy);
    if(!monthsByFy.has(fy)) monthsByFy.set(fy, new Set());
    monthsByFy.get(fy).add(m);
  }
  const fyList = [...fys].sort();
  const completeFys = new Set();
  monthsByFy.forEach((monthSet, fy) => { if(monthSet.size === 12) completeFys.add(fy); });
  // Totals per (class, fy)
  const totals = new Map();
  const classSet = new Set(classes);
  if(STATE.costEnriched){
    for(const r of STATE.costEnriched){
      if(!r.assetClass || !classSet.has(r.assetClass)) continue;
      if(hasBA && !f.businessArea.has(r.businessArea)) continue;
      if(hasCty){
        const key = r.county || 'No county';
        if(!f.county.has(key)) continue;
      }
      if(!totals.has(r.assetClass)) totals.set(r.assetClass, new Map());
      const m = totals.get(r.assetClass);
      m.set(r.fy, (m.get(r.fy) || 0) + (r.totalCost || 0));
    }
  }
  const stats = [];
  const latestFy = fyList[fyList.length - 1];
  for(const ac of classes){
    const m = totals.get(ac) || new Map();
    const byFy = {};
    fyList.forEach(fy => { byFy[fy] = m.get(fy) || 0; });
    const completeFyVals = fyList.filter(fy => completeFys.has(fy)).map(fy => m.get(fy) || 0);
    const avg = completeFyVals.length
      ? completeFyVals.reduce((a,b) => a+b, 0) / completeFyVals.length
      : (byFy[latestFy] || 0);
    stats.push({ assetClass: ac, byFy, avg, latest: byFy[latestFy] || 0 });
  }
  return { stats, fyList, completeFys, latestFy };
}

function getVisibleStats(){
  if(!_pickerState) return [];
  const term = _pickerState.searchTerm;
  let arr = _pickerState.stats;
  if(term){
    arr = arr.filter(s => s.assetClass.toLowerCase().includes(term));
  }
  const col = _pickerState.sortCol, dir = _pickerState.sortDir;
  arr = [...arr].sort((a, b) => {
    let av, bv;
    if(col === 'assetClass'){ av = a.assetClass.toLowerCase(); bv = b.assetClass.toLowerCase(); }
    else if(col === 'avg'){ av = a.avg; bv = b.avg; }
    else if(col === 'latest'){ av = a.latest; bv = b.latest; }
    else if(col.startsWith('fy_')){ const fy = parseInt(col.slice(3),10); av = a.byFy[fy] || 0; bv = b.byFy[fy] || 0; }
    else { av = a.avg; bv = b.avg; }
    if(av < bv) return dir === 'asc' ? -1 : 1;
    if(av > bv) return dir === 'asc' ? 1 : -1;
    return 0;
  });
  return arr;
}

// Row-set aggregation helper by a key function, returning Map(key -> {totalCost, reactiveCost, proactiveCost, preventativeCost, otherCost, ...})
function aggregateByKey(rows, keyFn){
  const m = new Map();
  for(const r of rows){
    const k = keyFn(r);
    if(k === null || k === undefined) continue;
    let a = m.get(k);
    if(!a){ a = { totalCost:0, reactiveCost:0, proactiveCost:0, preventativeCost:0, otherCost:0, totalWO:0, reactiveWO:0, proactiveWO:0 }; m.set(k, a); }
    a.totalCost += r.totalCost || 0;
    a.reactiveCost += r.reactiveCost || 0;
    a.proactiveCost += r.proactiveCost || 0;
    a.preventativeCost += r.preventativeCost || 0;
    a.otherCost += r.otherCost || 0;
    a.totalWO += r.totalWO || 0;
    a.reactiveWO += r.reactiveWO || 0;
    a.proactiveWO += r.proactiveWO || 0;
  }
  return m;
}

function sumAggregate(aggMap){
  let s = 0;
  for(const a of aggMap.values()) s += a.totalCost;
  return s;
}

function sumAggregateField(aggMap, field){
  let s = 0;
  for(const a of aggMap.values()) s += a[field] || 0;
  return s;
}

function entityFromAgg(name, a){
  return {
    label: name,
    totalCost: a.totalCost,
    reactiveCost: a.reactiveCost,
    proactiveCost: a.proactiveCost,
    preventativeCost: a.preventativeCost,
    otherCost: a.otherCost,
    nonReactiveCost: a.totalCost - a.reactiveCost,
    totalWO: a.totalWO,
    reactivePct: a.totalCost > 0 ? (a.reactiveCost / a.totalCost * 100) : null
  };
}

function buildCascadePanel({ title, focusLbl, entities, totalSpend, totalReactive, footerNote }){
  const maxCost = entities.reduce((m, e) => Math.max(m, e.totalCost), 0) || 1;
  const rows = entities.map(e => cascadeRow(e, maxCost)).join('');
  const footerLine = `Total: ${fmtCurrency(entities.reduce((s,e) => s + e.totalCost, 0))}${footerNote ? ' · ' + escapeHtml(footerNote) : ''}`;
  return `
    <div class="ov-cascade-panel">
      <h4 class="ov-cascade-title">${escapeHtml(title)}</h4>
      <div class="ov-cascade-sub">for ${escapeHtml(focusLbl)}</div>
      <div class="ov-cascade-body">${rows || '<div class="ov-placeholder" style="padding:16px 10px;margin:0">No data for this selection.</div>'}</div>
      <div class="ov-cascade-footer">${footerLine}</div>
    </div>
  `;
}

function buildCascadePanelC({ focusLbl, allEntities, shown, totalSpend, totalReactive, totalCount, view }){
  const maxCost = shown.reduce((m, e) => Math.max(m, e.totalCost), 0) || 1;
  const rows = shown.map(e => cascadeRow(e, maxCost)).join('');
  const viewOptions = [10, 15, 20, 'all'].map(v => {
    const active = v === view;
    return `<option value="${v}" ${active?'selected':''}>${v === 'all' ? 'All selected' : 'Top ' + v}</option>`;
  }).join('');
  const footerLine = `Showing ${shown.length} of ${totalCount} selected · Total ${fmtCurrency(shown.reduce((s,e) => s + e.totalCost, 0))}`;
  return `
    <div class="ov-cascade-panel">
      <div class="ov-cascade-view-ctrl">
        <h4 class="ov-cascade-title">By Asset Class</h4>
        <select id="ovS3PanelCView" title="How many to show">${viewOptions}</select>
      </div>
      <div class="ov-cascade-sub">for ${escapeHtml(focusLbl)}</div>
      <div class="ov-cascade-body">${rows || '<div class="ov-placeholder" style="padding:16px 10px;margin:0">No data for this selection.</div>'}</div>
      <div class="ov-cascade-footer">${footerLine}</div>
    </div>
  `;
}

function cascadeRow(e, maxCost){
  const widthPct = maxCost > 0 ? (e.totalCost / maxCost * 100) : 0;
  const t = e.totalCost || 1;
  const reactivePctStr = e.reactivePct !== null ? e.reactivePct.toFixed(0) + '%' : '—';
  const seg = (cost, cls) => {
    if(cost <= 0) return '';
    const w = (cost / t * 100).toFixed(1);
    return `<div class="cascade-seg ${cls}" style="width:${w}%"></div>`;
  };
  const tt = `${e.label} · ${fmtCurrencyFull(e.totalCost)} total · ${fmtNum(e.totalWO)} WOs · Reactive ${fmtCurrencyFull(e.reactiveCost)} (${reactivePctStr}) · Proactive ${fmtCurrencyFull(e.proactiveCost)} · Preventative ${fmtCurrencyFull(e.preventativeCost)} · Other ${fmtCurrencyFull(e.otherCost)}`;
  return `
    <div class="cascade-row" title="${escapeHtml(tt)}">
      <div class="cascade-label">${escapeHtml(e.label)}</div>
      <div class="cascade-bar-track">
        <div class="cascade-bar" style="width:${widthPct.toFixed(1)}%">
          ${seg(e.reactiveCost,'cs-reactive')}${seg(e.proactiveCost,'cs-proactive')}${seg(e.preventativeCost,'cs-preventative')}${seg(e.otherCost,'cs-other')}
        </div>
      </div>
      <div class="cascade-value">${fmtCurrency(e.totalCost)} · <span class="cascade-vol">${fmtNum(e.totalWO)} WOs</span> (${reactivePctStr} R)</div>
    </div>
  `;
}

// Stable colour for an asset class - same colour across Sections 4/5/6
function ovAssetClassColor(assetClass, rank){
  // Deterministic hash based on class name to keep colour stable across renders
  const palette = COLORS.series;
  const extended = [...palette, '#2e7d32', '#6a1b9a', '#c62828', '#1b5e20', '#4527a0', '#00695c', '#bf360c', '#283593'];
  // Prefer rank (top-10 assignment) when provided, falling back to hash
  if(typeof rank === 'number' && rank >= 0 && rank < extended.length) return extended[rank];
  let h = 0;
  for(let i = 0; i < assetClass.length; i++){ h = ((h << 5) - h + assetClass.charCodeAt(i)) | 0; }
  return extended[Math.abs(h) % extended.length];
}

// Collect per-asset-class cost series for the selected metric
function ovCollectAssetClassCostSeries(metric){
  const agg = STATE.filters.aggregation;
  const periods = getPeriodsInRange(agg);
  const selection = resolveAssetClassSelection();
  const rows = ovFilteredCostRows();
  const byAc = new Map();
  for(const r of rows){
    const ac = r.assetClass;
    if(!ac) continue;
    if(selection && selection.size > 0 && !selection.has(ac)) continue;
    if(!byAc.has(ac)) byAc.set(ac, new Map());
    const pm = byAc.get(ac);
    const p = periodKey(r, agg);
    let s = pm.get(p);
    if(!s){ s = { rC:0, pC:0, rW:0, pW:0 }; pm.set(p, s); }
    s.rC += r.reactiveCost || 0;
    s.pC += r.proactiveCost || 0;
    s.rW += r.reactiveWO || 0;
    s.pW += r.proactiveWO || 0;
  }
  const series = [];
  for(const [ac, pm] of byAc){
    let totalCorrective = 0, totalWOs = 0, nPeriods = 0;
    const points = periods.map(p => {
      const s = pm.get(p);
      if(!s) return { p, ratio: null, vol: 0 };
      totalCorrective += s.rC + s.pC;
      totalWOs += s.rW + s.pW;
      nPeriods += 1;
      let ratio, vol;
      if(metric === 'corrective'){
        const wo = s.rW + s.pW;
        ratio = wo > 0 ? (s.rC + s.pC) / wo : null;
        vol = wo;
      } else if(metric === 'reactive'){
        ratio = s.rW > 0 ? s.rC / s.rW : null;
        vol = s.rW;
      } else {
        ratio = s.pW > 0 ? s.pC / s.pW : null;
        vol = s.pW;
      }
      return { p, ratio, vol };
    });
    series.push({ ac, points, totalCorrective, totalWOs, nPeriods });
  }
  series.sort((a, b) => b.totalCorrective - a.totalCorrective);
  return { series, periods };
}

// Collect per-asset-class PM compliance series
function ovCollectAssetClassPMSeries(){
  const agg = STATE.filters.aggregation;
  const periods = getPeriodsInRange(agg);
  const selection = resolveAssetClassSelection();
  const rows = ovFilteredPMRows();
  const byAc = new Map();
  for(const r of rows){
    const ac = r.assetClass;
    if(!ac) continue;
    if(selection && selection.size > 0 && !selection.has(ac)) continue;
    if(!byAc.has(ac)) byAc.set(ac, new Map());
    const pm = byAc.get(ac);
    const p = periodKey(r, agg);
    let s = pm.get(p);
    if(!s){ s = { total:0, overdue:0 }; pm.set(p, s); }
    s.total += r.totalTasks || 0;
    s.overdue += r.overdueTasks || 0;
  }
  // We also need corrective-spend ranking (for top-10 selection) - compute via cost rows
  const costByAc = new Map();
  for(const r of ovFilteredCostRows()){
    const ac = r.assetClass;
    if(!ac) continue;
    if(selection && selection.size > 0 && !selection.has(ac)) continue;
    costByAc.set(ac, (costByAc.get(ac) || 0) + (r.reactiveCost || 0) + (r.proactiveCost || 0));
  }
  const series = [];
  for(const [ac, pm] of byAc){
    let totalTasks = 0, nPeriods = 0;
    const points = periods.map(p => {
      const s = pm.get(p);
      if(!s) return { p, ratio: null, vol: 0 };
      totalTasks += s.total;
      nPeriods += 1;
      return { p, ratio: s.total > 0 ? (1 - s.overdue / s.total) * 100 : null, vol: s.total };
    });
    series.push({ ac, points, totalTasks, nPeriods, totalCorrective: costByAc.get(ac) || 0 });
  }
  series.sort((a, b) => b.totalCorrective - a.totalCorrective);
  return { series, periods };
}

// Shared line chart renderer for Sections 4 and 5
function ovRenderAssetClassLineChart(host, opts){
  // opts: { periods, seriesList, yFmt, yAxisLabel, targetY, yBoundsForce, partialSet, tooltipBuilder }
  const { periods, seriesList, yFmt, yAxisLabel, targetY, yBoundsForce, partialSet, tooltipBuilder } = opts;
  const W = Math.max(600, host.clientWidth || host.offsetWidth || 900);
  const H = 320;
  const mL = 72, mR = 90, mT = 14, mB = 34;
  const plotW = W - mL - mR, plotH = H - mT - mB;
  const nP = periods.length;
  // Y bounds
  const allVals = [];
  seriesList.forEach(s => s.points.forEach(pt => { if(pt.ratio !== null && !isNaN(pt.ratio)) allVals.push(pt.ratio); }));
  let yMin, yMax;
  if(yBoundsForce){
    yMin = yBoundsForce.min;
    yMax = yBoundsForce.max;
  } else if(allVals.length){
    yMin = Math.min(...allVals);
    yMax = Math.max(...allVals);
    // Include target if provided
    if(typeof targetY === 'number'){ yMin = Math.min(yMin, targetY); yMax = Math.max(yMax, targetY); }
    // Pad 5% above/below
    const pad = (yMax - yMin) * 0.08 || 1;
    yMin = Math.max(0, yMin - pad);
    yMax = yMax + pad;
    if(opts.yIsPct){
      yMin = Math.max(0, Math.floor(yMin));
      yMax = Math.min(100, Math.ceil(yMax));
      if(yMax - yMin < 10){ yMax = Math.min(100, yMin + 10); }
    }
  } else {
    yMin = 0; yMax = 1;
  }
  const ticksObj = niceTicks(yMin, yMax, 5);
  const yTicks = ticksObj.ticks;
  const yActualMin = yTicks[0];
  const yActualMax = yTicks[yTicks.length - 1];
  const xStep = plotW / Math.max(1, nP);
  const xCenter = (i) => mL + i * xStep + xStep / 2;
  const yScale = (v) => (mT + plotH) - ((v - yActualMin) / (yActualMax - yActualMin)) * plotH;

  const parts = [];
  parts.push(`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="xMidYMid meet" style="overflow:visible">`);
  // Gridlines + Y labels
  yTicks.forEach(t => {
    const y = yScale(t);
    parts.push(`<line x1="${mL}" y1="${y.toFixed(1)}" x2="${(W - mR).toFixed(1)}" y2="${y.toFixed(1)}" stroke="#eaeaea" stroke-width="1"/>`);
    parts.push(`<text x="${(mL - 6).toFixed(1)}" y="${(y + 3).toFixed(1)}" text-anchor="end" font-size="11" fill="#666">${escapeHtml(yFmt(t))}</text>`);
  });
  // Axis range annotation (top-right)
  if(opts.showRangeAnnotation){
    parts.push(`<text x="${(W - mR).toFixed(1)}" y="${(mT + 2).toFixed(1)}" text-anchor="end" font-size="10" fill="#888" font-style="italic">Y-axis: ${escapeHtml(yFmt(yActualMin))} - ${escapeHtml(yFmt(yActualMax))}</text>`);
  }
  // Y axis label
  parts.push(`<text x="16" y="${(mT + plotH / 2).toFixed(1)}" text-anchor="middle" transform="rotate(-90 16 ${(mT + plotH / 2).toFixed(1)})" font-size="11" fill="#666">${escapeHtml(yAxisLabel)}</text>`);
  // Target line
  if(typeof targetY === 'number' && targetY >= yActualMin && targetY <= yActualMax){
    const yT = yScale(targetY);
    parts.push(`<line x1="${mL}" y1="${yT.toFixed(1)}" x2="${(W - mR).toFixed(1)}" y2="${yT.toFixed(1)}" stroke="${COLORS.neutral}" stroke-width="1.2" stroke-dasharray="5,3"/>`);
    parts.push(`<text x="${(W - mR + 4).toFixed(1)}" y="${(yT + 3).toFixed(1)}" font-size="10" fill="#666" font-style="italic">Target ${escapeHtml(yFmt(targetY))}</text>`);
  }
  // Lines + dots
  const tooltipData = [];
  seriesList.forEach((s, idx) => {
    const color = ovAssetClassColor(s.ac, idx);
    let path = '';
    let penDown = false;
    s.points.forEach((pt, i) => {
      if(pt.ratio === null || isNaN(pt.ratio)){ penDown = false; return; }
      const cx = xCenter(i), cy = yScale(pt.ratio);
      path += penDown ? `L ${cx.toFixed(1)},${cy.toFixed(1)} ` : `M ${cx.toFixed(1)},${cy.toFixed(1)} `;
      penDown = true;
    });
    if(path.trim()){
      parts.push(`<path class="ov-line" data-ac="${escapeHtml(s.ac)}" d="${path.trim()}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>`);
    }
    s.points.forEach((pt, i) => {
      if(pt.ratio === null || isNaN(pt.ratio)) return;
      const cx = xCenter(i), cy = yScale(pt.ratio);
      const partial = partialSet.has(pt.p);
      const r = partial ? 3 : 3;
      const fill = partial ? '#fff' : color;
      const tt = tooltipBuilder(s.ac, pt, partial);
      tooltipData.push({ tt });
      parts.push(`<circle class="ov-dot" data-ttidx="${tooltipData.length - 1}" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r}" fill="${fill}" stroke="${color}" stroke-width="1.5"/>`);
    });
  });
  // X axis labels
  const labelY = mT + plotH + 18;
  const labelStep = Math.max(1, Math.ceil(nP / Math.max(1, Math.floor(plotW / 70))));
  periods.forEach((p, i) => {
    if(i % labelStep !== 0 && i !== nP - 1) return;
    const cx = xCenter(i);
    const partial = partialSet.has(p);
    const lbl = p + (partial ? '*' : '');
    const fill = partial ? COLORS.warning : '#666';
    parts.push(`<text x="${cx.toFixed(1)}" y="${labelY}" text-anchor="middle" font-size="11" fill="${fill}">${escapeHtml(lbl)}</text>`);
  });
  parts.push(`</svg>`);
  host.innerHTML = parts.join('');
  // Wire tooltips
  host.querySelectorAll('.ov-dot').forEach(n => {
    const idx = parseInt(n.getAttribute('data-ttidx'), 10);
    const tt = tooltipData[idx].tt;
    addTooltip(n, tt);
  });
}

// Build a colour-swatch legend; if hiddenSet+onToggle supplied, items are click-toggleable
function ovBuildLegend(seriesList, host, hiddenSet, onToggle){
  const interactive = hiddenSet && typeof onToggle === 'function';
  host.innerHTML = seriesList.map((s, i) => {
    const c = ovAssetClassColor(s.ac, i);
    const muted = interactive && hiddenSet.has(s.ac) ? ' muted' : '';
    const cls = interactive ? 'legend-item toggleable' + muted : 'legend-item';
    return `<div class="${cls}" data-ac="${escapeHtml(s.ac)}"><span class="legend-swatch" style="background:${c}"></span>${escapeHtml(s.ac)}</div>`;
  }).join('');
  if(interactive){
    host.querySelectorAll('.legend-item').forEach(el => {
      el.onclick = () => onToggle(el.getAttribute('data-ac'));
    });
  }
}

function renderOv4CostTrends(){
  const el = document.getElementById('ovSection4');
  if(!el) return;
  const metric = STATE.overview.s4CostMetric;
  const chartShow = STATE.overview.s4ChartShow;
  const { series, periods } = ovCollectAssetClassCostSeries(metric);

    el.innerHTML = '<div class="ov-card"><div class="ov-card-header"><h3 class="ov-card-title">Cost per workorder by asset class</h3></div><div class="ov-placeholder">No data for the selected filter.</div></div>';

  }

  const topNAll = series.slice(0, chartCap);

  el.innerHTML = `
    <div class="ov-card">
      <div class="ov-card-header">
        <h3 class="ov-card-title">Cost per workorder by asset class</h3>
        <div class="ov-card-controls">
          <label>Metric</label>
          <select id="ovS4Metric">
            <option value="corrective" ${metric==='corrective'?'selected':''}>Corrective (R+P)</option>

            <option value="15" ${chartShow===15?'selected':''}>Top 15</option>

          </select>
