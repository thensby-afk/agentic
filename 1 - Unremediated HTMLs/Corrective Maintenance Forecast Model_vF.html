function renderOv4Table(series, metric, topN){
  const host = document.getElementById('ov4Table');
  if(!host) return;
  const topAcs = new Set(topN.map(s => s.ac));
  const rows = series.map((s, idx) => {
    const firstValidIdx = s.points.findIndex(pt => pt.ratio !== null);
    const lastValidIdx = (() => { for(let i = s.points.length - 1; i >= 0; i--){ if(s.points[i].ratio !== null) return i; } return -1; })();
    const first = firstValidIdx >= 0 ? s.points[firstValidIdx].ratio : null;
    const last = lastValidIdx >= 0 ? s.points[lastValidIdx].ratio : null;
    const delta = (first !== null && last !== null) ? (last - first) : null;
    const pct = (first !== null && last !== null && first !== 0) ? ((last - first) / first * 100) : null;
    const totalVol = s.points.reduce((a, pt) => a + (pt.vol || 0), 0);
    return { ac: s.ac, first, last, delta, pct, vol: totalVol, periods: s.nPeriods, idx };
  });
  // Default sort: Δ% descending (biggest rise first)
  rows.sort((a, b) => {
    const ap = (a.pct === null) ? -Infinity : a.pct;
    const bp = (b.pct === null) ? -Infinity : b.pct;
    return bp - ap;
  });
  const body = rows.map(r => {
    const color = topAcs.has(r.ac) ? ovAssetClassColor(r.ac, r.idx) : null;
    const swatch = color ? `<span class="ov-swatch" style="background:${color}"></span>` : '';
    const first = r.first !== null ? fmtCurrency(r.first) : '—';
    const last = r.last !== null ? fmtCurrency(r.last) : '—';
    const delta = r.delta !== null ? fmtCurrency(r.delta) : '—';
    const pctTxt = r.pct !== null ? ((r.pct >= 0 ? '+' : '') + r.pct.toFixed(1) + '%') : '—';
    return `<tr class="${topAcs.has(r.ac) ? 'top-n' : ''}" style="${color ? `color:${color}` : ''}">
      <td style="color:var(--text-primary)">${swatch}${escapeHtml(r.ac)}</td>
      <td class="num">${first}</td>
      <td class="num">${last}</td>
      <td class="num">${delta}</td>
      <td class="num">${pctTxt}</td>
      <td class="num vol">${fmtNum(r.vol)}</td>
      <td class="num vol">${r.periods}</td>
    </tr>`;
  }).join('');
  host.innerHTML = `
    <table class="ov-trend-table">
      <thead><tr>
        <th>Asset class</th>
        <th class="num">First £</th>
        <th class="num">Last £</th>
        <th class="num">Δ£</th>
        <th class="num sort-active">Δ%</th>
        <th class="num">Total WOs</th>
        <th class="num">Periods</th>
      </tr></thead>
      <tbody>${body}</tbody>
    </table>
  `;
}

function buildSection4SoWhat(series, metric, periods){
  if(!series.length || periods.length < 2) return '';
  const label = { corrective:'Corrective', reactive:'Reactive', proactive:'Proactive' }[metric];
  const derive = (s) => {
    const firstValidIdx = s.points.findIndex(pt => pt.ratio !== null);
    const lastValidIdx = (() => { for(let i = s.points.length - 1; i >= 0; i--){ if(s.points[i].ratio !== null) return i; } return -1; })();
    if(firstValidIdx < 0 || lastValidIdx < 0) return null;
    const first = s.points[firstValidIdx].ratio, last = s.points[lastValidIdx].ratio;
    if(first === 0) return null;
    return { pct: (last - first) / first * 100 };
  };
  const withDerived = series.map(s => ({ ...s, d: derive(s) })).filter(s => s.d !== null);
  if(!withDerived.length) return '';
  const risers = [...withDerived].sort((a,b) => b.d.pct - a.d.pct).filter(s => s.d.pct > 10);
  const fallers = withDerived.filter(s => s.d.pct < -5);
  if(!risers.length && !fallers.length) return '';
  let txt = '';
  if(risers.length){
    txt += `${label} cost per WO for <strong>${escapeHtml(risers[0].ac)}</strong> has risen ${risers[0].d.pct.toFixed(0)}% over ${periods.length} periods.`;
    if(risers.length >= 3){
      txt += ` <strong>${escapeHtml(risers[1].ac)}</strong> and <strong>${escapeHtml(risers[2].ac)}</strong> are the next-steepest risers.`;
    } else if(risers.length === 2){
      txt += ` <strong>${escapeHtml(risers[1].ac)}</strong> is the next-steepest riser.`;
    }
  }
  if(fallers.length){
    if(txt) txt += ' ';
    const names = fallers.slice(0, 2).map(s => `<strong>${escapeHtml(s.ac)}</strong>`).join(' and ');
    txt += `${names} ${fallers.length === 1 ? 'is' : 'are'} trending downward.`;
  }
  return txt;
}

function renderOv5Table(series, topN){
  const host = document.getElementById('ov5Table');

  const topAcs = new Set(topN.map(s => s.ac));

    const firstValidIdx = s.points.findIndex(pt => pt.ratio !== null);

    const first = firstValidIdx >= 0 ? s.points[firstValidIdx].ratio : null;
    const last = lastValidIdx >= 0 ? s.points[lastValidIdx].ratio : null;
    const delta = (first !== null && last !== null) ? (last - first) : null;
    const gap = last !== null ? (last - 95) : null;
    const totalTasks = s.points.reduce((a, pt) => a + (pt.vol || 0), 0);
    return { ac: s.ac, first, last, delta, gap, vol: totalTasks, periods: s.nPeriods, idx };
  });
  // Default sort: target gap ascending (worst first)
  rows.sort((a, b) => {
    const ag = (a.gap === null) ? Infinity : a.gap;
    const bg = (b.gap === null) ? Infinity : b.gap;
    return ag - bg;
  });
  const body = rows.map(r => {
    const color = topAcs.has(r.ac) ? ovAssetClassColor(r.ac, r.idx) : null;

}

function buildSection5SoWhat(series, periods){
  if(!series.length || periods.length < 2) return '';
  const rows = series.map(s => {
    const firstValidIdx = s.points.findIndex(pt => pt.ratio !== null);
    const lastValidIdx = (() => { for(let i = s.points.length - 1; i >= 0; i--){ if(s.points[i].ratio !== null) return i; } return -1; })();
    if(firstValidIdx < 0 || lastValidIdx < 0) return null;
    const first = s.points[firstValidIdx].ratio;
    const last = s.points[lastValidIdx].ratio;
    const gap = last - 95;
    const delta = last - first;
    const validPts = s.points.filter(pt => pt.ratio !== null).map(pt => pt.ratio);
    const allBelowTarget = validPts.every(v => v < 95);
    return { ac: s.ac, first, last, delta, gap, allBelowTarget, validCount: validPts.length };
  }).filter(r => r !== null);
  if(!rows.length) return '';
  const worstFaller = [...rows].sort((a,b) => a.delta - b.delta)[0];
  const consistentlyBelow = rows.filter(r => r.allBelowTarget && r.gap < -10 && Math.abs(r.delta) < 2);
  const aboveTargetInLast = rows.filter(r => r.last >= 95);
  let txt = '';
  if(worstFaller && worstFaller.delta < -3 && worstFaller.gap < 0){
    txt += `<strong>${escapeHtml(worstFaller.ac)}</strong> compliance has fallen from ${worstFaller.first.toFixed(0)}% to ${worstFaller.last.toFixed(0)}% and sits ${Math.abs(worstFaller.gap).toFixed(0)}pp below the 95% target.`;
  }
  if(consistentlyBelow.length){
    if(txt) txt += ' ';
    const names = consistentlyBelow.slice(0, 2).map(r => `<strong>${escapeHtml(r.ac)}</strong>`).join(' and ');
    const avgGap = consistentlyBelow.slice(0, 2).reduce((s,r) => s + Math.abs(r.gap), 0) / Math.min(2, consistentlyBelow.length);
    txt += `${names} ${consistentlyBelow.length === 1 ? 'has' : 'have'} been consistently ~${avgGap.toFixed(0)}pp below target.`;
  }
  if(aboveTargetInLast.length && aboveTargetInLast.length <= 3){
    if(txt) txt += ' ';
    const names = aboveTargetInLast.slice(0, 3).map(r => `<strong>${escapeHtml(r.ac)}</strong>`).join(', ');
    txt += `Only ${names} sat above target in the latest period.`;
  } else if(!aboveTargetInLast.length){
    if(txt) txt += ' ';
    txt += `No asset classes sat above target in the latest period.`;
  }
  return txt;
}

function renderOv2SpendTrend(){
  const el = document.getElementById('ovSection2');
  if(!el) return;
  const agg = STATE.filters.aggregation;
  const periods = getPeriodsInRange(agg);
  if(!periods.length){
    el.innerHTML = '<div class="ov-card"><div class="ov-card-header"><h3 class="ov-card-title">Spend and PM compliance over time</h3></div><div class="ov-placeholder">No data for the selected filter.</div></div>';
    return;
  }
  const costRows = ovFilteredCostRows();
  const pmRows = ovFilteredPMRows();
  const costByP = new Map();
  const pmByP = new Map();
  periods.forEach(p => {
    costByP.set(p, { preventative:0, proactive:0, reactive:0, other:0, total:0 });
    pmByP.set(p, { total:0, overdue:0 });
  });
  for(const r of costRows){
    const p = periodKey(r, agg);
    if(!costByP.has(p)) continue;
    const s = costByP.get(p);
    s.preventative += r.preventativeCost || 0;
    s.proactive += r.proactiveCost || 0;
    s.reactive += r.reactiveCost || 0;
    s.other += r.otherCost || 0;
    s.total += r.totalCost || 0;
  }
  for(const r of pmRows){
    const p = periodKey(r, agg);
    if(!pmByP.has(p)) continue;
    const s = pmByP.get(p);
    s.total += r.totalTasks || 0;
    s.overdue += r.overdueTasks || 0;
  }
  const compByP = new Map();
  periods.forEach(p => {
    const s = pmByP.get(p);
    compByP.set(p, s.total > 0 ? (1 - s.overdue / s.total) * 100 : null);
  });
  const dataMonths = getDataMonthsInRange();
  const partialSet = new Set(periods.filter(p => agg === 'quarter' && isPartialQuarter(p, dataMonths)));

  const soWhat = buildSection2SoWhat(periods, costByP, compByP);

  el.innerHTML = `
    <div class="ov-card">
      <div class="ov-card-header">
        <h3 class="ov-card-title">Spend and PM compliance over time</h3>
      </div>
      ${soWhat ? `<div class="ov-section-sowhat">${soWhat}</div>` : ''}
      <div class="ov2-split">
        <div class="ov2-panel">
          <div class="ov2-panel-title">Spend by category (£)</div>
          <div class="chart-wrap" id="ov2CostChart"></div>
          <div class="legend" id="ov2CostLegend"></div>
        </div>
        <div class="ov2-panel">
          <div class="ov2-panel-title">PM compliance (%)</div>
          <div class="chart-wrap" id="ov2PMChart"></div>
          <div class="legend" id="ov2PMLegend"></div>
        </div>
      </div>
    </div>
  `;
  renderOv2CostChart(document.getElementById('ov2CostChart'), periods, costByP, partialSet);
  renderOv2ComplianceChart(document.getElementById('ov2PMChart'), periods, pmByP, compByP, partialSet);
  document.getElementById('ov2CostLegend').innerHTML = `
    <div class="legend-item"><span class="legend-swatch" style="background:${COLORS.success}"></span>Preventative</div>
    <div class="legend-item"><span class="legend-swatch" style="background:#1565c0"></span>Proactive</div>
    <div class="legend-item"><span class="legend-swatch" style="background:${COLORS.warning}"></span>Reactive</div>
    <div class="legend-item"><span class="legend-swatch" style="background:${COLORS.neutral}"></span>Other</div>
  `;
  document.getElementById('ov2PMLegend').innerHTML = `
    <div class="legend-item"><span style="display:inline-block;width:14px;height:2px;background:${COLORS.primary};vertical-align:middle;margin-right:4px"></span>PM compliance</div>
    <div class="legend-item"><span style="display:inline-block;width:14px;height:0;border-top:1.5px dashed ${COLORS.neutral};vertical-align:middle;margin-right:4px"></span>Target 95%</div>
  `;
}

// Stacked bar: cost by category over time
function renderOv2CostChart(host, periods, costByP, partialSet){
  const W = Math.max(380, host.clientWidth || host.offsetWidth || 500);
  const H = 260;
  const mL = 64, mR = 12, mT = 12, mB = 34;
  const plotW = W - mL - mR, plotH = H - mT - mB;
  const nP = periods.length;
  let maxTotal = 0;
  periods.forEach(p => { const s = costByP.get(p); if(s && s.total > maxTotal) maxTotal = s.total; });
  if(maxTotal === 0) maxTotal = 1;
  const ticksObj = niceTicks(0, maxTotal, 5);
  const yTicks = ticksObj.ticks;
  const yMax = ticksObj.max;
  const xStep = plotW / Math.max(1, nP);
  const barW = Math.max(6, Math.min(40, xStep * 0.75));
  const xCenter = (i) => mL + i * xStep + xStep / 2;
  const yScale = (v) => (mT + plotH) - (v / yMax) * plotH;
  const stackOrder = ['preventative','proactive','reactive','other'];
  const stackColors = { preventative: COLORS.success, proactive: '#1565c0', reactive: COLORS.warning, other: COLORS.neutral };
  const stackLabels = { preventative:'Preventative', proactive:'Proactive', reactive:'Reactive', other:'Other' };
  const parts = [];
  parts.push(`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="xMidYMid meet" style="overflow:visible">`);
  yTicks.forEach(t => {
    const y = yScale(t);
    parts.push(`<line x1="${mL}" y1="${y.toFixed(1)}" x2="${(W - mR).toFixed(1)}" y2="${y.toFixed(1)}" stroke="#eaeaea" stroke-width="1"/>`);
    parts.push(`<text x="${(mL - 6).toFixed(1)}" y="${(y + 3).toFixed(1)}" text-anchor="end" font-size="11" fill="#666">${escapeHtml(fmtCurrency(t))}</text>`);
  });
  periods.forEach((p, i) => {
    const s = costByP.get(p);
    if(!s) return;
    const cx = xCenter(i);
    const x = cx - barW / 2;
    let cumY = mT + plotH;
    stackOrder.forEach(cat => {
      const v = s[cat];
      if(v <= 0) return;
      const h = (v / yMax) * plotH;
      const y = cumY - h;
      const pctStr = s.total > 0 ? (v / s.total * 100).toFixed(1) : '0';
      const tt = `<div class="tt-title">${escapeHtml(p)}${partialSet.has(p) ? ' (partial)':''}</div><div class="tt-row"><span class="tt-label">${escapeHtml(stackLabels[cat])}</span><span>${escapeHtml(fmtCurrencyFull(v))}</span></div><div class="tt-row"><span class="tt-label">Share of period</span><span>${pctStr}%</span></div>`;
      parts.push(`<rect class="ov2-bar" data-tt="${encodeURIComponent(tt)}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(0.5, h).toFixed(1)}" fill="${stackColors[cat]}"/>`);
      cumY = y;
    });
  });
  const labelY = mT + plotH + 18;
  const labelStep = Math.max(1, Math.ceil(nP / Math.max(1, Math.floor(plotW / 70))));
  periods.forEach((p, i) => {
    if(i % labelStep !== 0 && i !== nP - 1) return;
    const cx = xCenter(i);
    const partial = partialSet.has(p);
    const lbl = p + (partial ? '*' : '');
    const fill = partial ? COLORS.warning : '#666';
    parts.push(`<text x="${cx.toFixed(1)}" y="${labelY}" text-anchor="middle" font-size="11" fill="${fill}">${escapeHtml(lbl)}</text>`);
  });
  parts.push(`</svg>`);
  host.innerHTML = parts.join('');
  host.querySelectorAll('.ov2-bar').forEach(n => addTooltip(n, decodeURIComponent(n.getAttribute('data-tt'))));
}

// Line chart: PM compliance over time with 95% target line
function renderOv2ComplianceChart(host, periods, pmByP, compByP, partialSet){
  const W = Math.max(380, host.clientWidth || host.offsetWidth || 500);
  const H = 260;
  const mL = 54, mR = 70, mT = 12, mB = 34;
  const plotW = W - mL - mR, plotH = H - mT - mB;
  const nP = periods.length;
  const validComp = periods.map(p => compByP.get(p)).filter(v => v !== null && !isNaN(v));
  let compMin, compMax;
  if(validComp.length){
    let vMin = Math.min(...validComp);
    let vMax = Math.max(...validComp);
    vMin = Math.min(vMin, 95); vMax = Math.max(vMax, 95);
    compMin = Math.max(0, Math.floor(vMin - 5));
    compMax = Math.min(100, Math.ceil(vMax + 5));
    if(compMax - compMin < 10){ compMax = Math.min(100, compMin + 10); }
  } else { compMin = 70; compMax = 100; }
  const compTicksObj = niceTicks(compMin, compMax, 4);
  const yTicksComp = compTicksObj.ticks;
  const xStep = plotW / Math.max(1, nP);
  const xCenter = (i) => mL + i * xStep + xStep / 2;
  const yScale = (v) => (mT + plotH) - ((v - compMin) / (compMax - compMin)) * plotH;
  const parts = [];
  parts.push(`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="xMidYMid meet" style="overflow:visible">`);
  yTicksComp.forEach(t => {
    const y = yScale(t);
    parts.push(`<line x1="${mL}" y1="${y.toFixed(1)}" x2="${(W - mR).toFixed(1)}" y2="${y.toFixed(1)}" stroke="#eaeaea" stroke-width="1"/>`);
    parts.push(`<text x="${(mL - 6).toFixed(1)}" y="${(y + 3).toFixed(1)}" text-anchor="end" font-size="11" fill="#666">${t.toFixed(0)}%</text>`);
  });
  if(95 >= compMin && 95 <= compMax){
    const yT = yScale(95);
    parts.push(`<line x1="${mL}" y1="${yT.toFixed(1)}" x2="${(W - mR).toFixed(1)}" y2="${yT.toFixed(1)}" stroke="${COLORS.neutral}" stroke-width="1.2" stroke-dasharray="5,3"/>`);
    parts.push(`<text x="${(W - mR + 4).toFixed(1)}" y="${(yT + 3).toFixed(1)}" font-size="10" fill="#666" font-style="italic">Target 95%</text>`);
  }
  let linePath = '';
  const dots = [];
  let penDown = false;
  periods.forEach((p, i) => {
    const v = compByP.get(p);
    if(v === null || isNaN(v)){ penDown = false; return; }
    const cx = xCenter(i), cy = yScale(v);
    linePath += penDown ? `L ${cx.toFixed(1)},${cy.toFixed(1)} ` : `M ${cx.toFixed(1)},${cy.toFixed(1)} `;
    penDown = true;
    const partial = partialSet.has(p);
    const pmVals = pmByP.get(p) || { total:0, overdue:0 };
    const onTime = (pmVals.total || 0) - (pmVals.overdue || 0);
    const tt = `<div class="tt-title">${escapeHtml(p)}${partial ? ' (partial)':''}</div><div class="tt-row"><span class="tt-label">PM compliance</span><span>${v.toFixed(1)}%</span></div><div class="tt-row"><span class="tt-label">On time / total</span><span>${fmtNum(onTime)} / ${fmtNum(pmVals.total)}</span></div><div class="tt-row"><span class="tt-label">vs 95% target</span><span>${(v - 95).toFixed(1)}pp</span></div>`;
    dots.push({ cx, cy, partial, tt });
  });
  if(linePath.trim()){
    parts.push(`<path d="${linePath.trim()}" fill="none" stroke="${COLORS.primary}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`);
  }
  dots.forEach(d => parts.push(`<circle class="ov2-dot" data-tt="${encodeURIComponent(d.tt)}" cx="${d.cx.toFixed(1)}" cy="${d.cy.toFixed(1)}" r="3.5" fill="${d.partial ? '#fff' : COLORS.primary}" stroke="${COLORS.primary}" stroke-width="1.5"/>`));
  const labelY = mT + plotH + 18;
  const labelStep = Math.max(1, Math.ceil(nP / Math.max(1, Math.floor(plotW / 70))));
  periods.forEach((p, i) => {
    if(i % labelStep !== 0 && i !== nP - 1) return;
    const cx = xCenter(i);
    const partial = partialSet.has(p);
    const lbl = p + (partial ? '*' : '');
    const fill = partial ? COLORS.warning : '#666';
    parts.push(`<text x="${cx.toFixed(1)}" y="${labelY}" text-anchor="middle" font-size="11" fill="${fill}">${escapeHtml(lbl)}</text>`);
  });
  parts.push(`</svg>`);
  host.innerHTML = parts.join('');
  host.querySelectorAll('.ov2-dot').forEach(n => addTooltip(n, decodeURIComponent(n.getAttribute('data-tt'))));
}

// --- Legacy compound chart (kept for reference but no longer called) ---
function renderSection2CompoundChart(host, periods, costByP, pmByP, compByP, partialSet){
  const W = Math.max(600, host.clientWidth || host.offsetWidth || 900);
  const totalH = 400;
  const mL = 70, mR = 96, mT = 14, mB = 34;
  const gap = 14;
  const topFrac = 0.62;
  const plotAvail = totalH - mT - mB - gap;
  const topPlotH = Math.round(plotAvail * topFrac);
  const btmPlotH = plotAvail - topPlotH;
  const plotW = W - mL - mR;
  const nP = periods.length;

  // Cost max
  let maxTotal = 0;
  periods.forEach(p => { const s = costByP.get(p); if(s.total > maxTotal) maxTotal = s.total; });
  if(maxTotal === 0) maxTotal = 1;
  const costTicksObj = niceTicks(0, maxTotal, 5);
  const yTicksCost = costTicksObj.ticks;
  const yAxisMaxCost = costTicksObj.max;

  // Compliance axis: auto-zoom to [min-5, max+5] clamped 0..100, always extended to include 95
  const validComp = periods.map(p => compByP.get(p)).filter(v => v !== null && !isNaN(v));
  let compMin, compMax;
  if(validComp.length){
    let vMin = Math.min(...validComp);
    let vMax = Math.max(...validComp);
    vMin = Math.min(vMin, 95); // extend to include target
    vMax = Math.max(vMax, 95);
    compMin = Math.max(0, Math.floor(vMin - 5));
    compMax = Math.min(100, Math.ceil(vMax + 5));
    if(compMax - compMin < 10){ compMax = Math.min(100, compMin + 10); }
  } else {
    compMin = 70; compMax = 100;
  }
  const compTicksObj = niceTicks(compMin, compMax, 4);
  const yTicksComp = compTicksObj.ticks;

  const xStep = plotW / Math.max(1, nP);
  const barW = Math.max(6, Math.min(40, xStep * 0.75));
  const xCenter = (i) => mL + i * xStep + xStep / 2;
  const topY1 = mT, topY2 = mT + topPlotH;
  const btmY1 = mT + topPlotH + gap, btmY2 = btmY1 + btmPlotH;
  const costScale = (v) => topY2 - (v / yAxisMaxCost) * topPlotH;
  const compScale = (v) => btmY2 - ((v - compMin) / (compMax - compMin)) * btmPlotH;
  const stackOrder = ['preventative','proactive','reactive','other'];
  const stackColors = { preventative: COLORS.success, proactive: '#1565c0', reactive: COLORS.warning, other: COLORS.neutral };
  const stackLabels = { preventative:'Preventative', proactive:'Proactive', reactive:'Reactive', other:'Other' };

  const parts = [];
  parts.push(`<svg viewBox="0 0 ${W} ${totalH}" width="100%" height="${totalH}" preserveAspectRatio="xMidYMid meet" style="overflow:visible">`);

  // Top plot gridlines + labels
  for(const t of yTicksCost){
    const y = costScale(t);
    parts.push(`<line x1="${mL}" y1="${y.toFixed(1)}" x2="${(W - mR).toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e8e8e8" stroke-width="1"/>`);
    parts.push(`<text x="${(mL - 6).toFixed(1)}" y="${(y + 3).toFixed(1)}" text-anchor="end" font-size="11" fill="#666">${escapeHtml(fmtCurrency(t))}</text>`);
  }
  // Top Y-axis label
  parts.push(`<text x="16" y="${(topY1 + topPlotH / 2).toFixed(1)}" text-anchor="middle" transform="rotate(-90 16 ${(topY1 + topPlotH / 2).toFixed(1)})" font-size="11" fill="#666">£ total cost</text>`);

  // Stacked bars
  periods.forEach((p, i) => {
    const s = costByP.get(p);
    const cx = xCenter(i);
    const x = cx - barW / 2;
    let cumY = topY2;
    stackOrder.forEach(cat => {
      const v = s[cat];
      if(v <= 0) return;
      const h = (v / yAxisMaxCost) * topPlotH;
      const y = cumY - h;
      const pctOfTotal = s.total > 0 ? (v / s.total * 100).toFixed(1) : '0';
      const tt = `<div class="tt-title">${escapeHtml(p)}${partialSet.has(p) ? ' (partial)' : ''}</div><div class="tt-row"><span class="tt-label">${escapeHtml(stackLabels[cat])}</span><span>${escapeHtml(fmtCurrencyFull(v))}</span></div><div class="tt-row"><span class="tt-label">Share of period total</span><span>${pctOfTotal}%</span></div>`;
      parts.push(`<rect class="ov2-bar" data-tt="${encodeURIComponent(tt)}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(0.5, h).toFixed(1)}" fill="${stackColors[cat]}"/>`);
      cumY = y;
    });
  });

  // Bottom plot gridlines + labels
  for(const t of yTicksComp){
    const y = compScale(t);
    parts.push(`<line x1="${mL}" y1="${y.toFixed(1)}" x2="${(W - mR).toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e8e8e8" stroke-width="1"/>`);
    parts.push(`<text x="${(mL - 6).toFixed(1)}" y="${(y + 3).toFixed(1)}" text-anchor="end" font-size="11" fill="#666">${t.toFixed(0)}%</text>`);
  }
  // Target line at 95%
  if(95 >= compMin && 95 <= compMax){
    const yT = compScale(95);
    parts.push(`<line x1="${mL}" y1="${yT.toFixed(1)}" x2="${(W - mR).toFixed(1)}" y2="${yT.toFixed(1)}" stroke="${COLORS.neutral}" stroke-width="1.2" stroke-dasharray="5,3"/>`);
    parts.push(`<text x="${(W - mR + 4).toFixed(1)}" y="${(yT + 3).toFixed(1)}" font-size="10" fill="#666" font-style="italic">Target 95%</text>`);
  }
  // Bottom Y-axis label
  parts.push(`<text x="16" y="${(btmY1 + btmPlotH / 2).toFixed(1)}" text-anchor="middle" transform="rotate(-90 16 ${(btmY1 + btmPlotH / 2).toFixed(1)})" font-size="11" fill="#666">PM compliance %</text>`);

  // Compliance line + dots
  let linePath = '';
  const dots = [];
  let penDown = false;
  periods.forEach((p, i) => {
    const v = compByP.get(p);
    if(v === null || isNaN(v)){ penDown = false; return; }
    const cx = xCenter(i);
    const cy = compScale(v);
    linePath += penDown ? `L ${cx.toFixed(1)},${cy.toFixed(1)} ` : `M ${cx.toFixed(1)},${cy.toFixed(1)} `;
    penDown = true;
    const partial = partialSet.has(p);
    const pmVals = pmByP.get(p);
    const onTime = (pmVals.total || 0) - (pmVals.overdue || 0);
    const tt = `<div class="tt-title">${escapeHtml(p)}${partial ? ' (partial)' : ''}</div><div class="tt-row"><span class="tt-label">PM compliance</span><span>${v.toFixed(1)}%</span></div><div class="tt-row"><span class="tt-label">On time / total</span><span>${fmtNum(onTime)} / ${fmtNum(pmVals.total)}</span></div><div class="tt-row"><span class="tt-label">vs 95% target</span><span>${(v - 95).toFixed(1)}pp</span></div>`;
    dots.push({ cx, cy, partial, tt });
  });
  if(linePath.trim()){
    parts.push(`<path d="${linePath.trim()}" fill="none" stroke="${COLORS.primary}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`);
  }
  dots.forEach(d => {
    parts.push(`<circle class="ov2-dot" data-tt="${encodeURIComponent(d.tt)}" cx="${d.cx.toFixed(1)}" cy="${d.cy.toFixed(1)}" r="3.5" fill="${d.partial ? '#fff' : COLORS.primary}" stroke="${COLORS.primary}" stroke-width="1.5"/>`);
  });

  // X axis labels (shared, below bottom plot)
  const labelY = btmY2 + 18;
  const labelStep = Math.max(1, Math.ceil(nP / Math.max(1, Math.floor(plotW / 70))));
  periods.forEach((p, i) => {
    if(i % labelStep !== 0 && i !== nP - 1) return;
    const cx = xCenter(i);
    const partial = partialSet.has(p);
    const lbl = p + (partial ? '*' : '');
    const fill = partial ? COLORS.warning : '#666';
    parts.push(`<text x="${cx.toFixed(1)}" y="${labelY}" text-anchor="middle" font-size="11" fill="${fill}">${escapeHtml(lbl)}</text>`);
  });

  parts.push(`</svg>`);
  host.innerHTML = parts.join('');
  // Wire tooltips
  host.querySelectorAll('.ov2-bar, .ov2-dot').forEach(n => {
    const tt = decodeURIComponent(n.getAttribute('data-tt'));
    addTooltip(n, tt);
  });
}

function buildSection2SoWhat(periods, costByP, compByP){
  if(periods.length < 2) return '';
  const first = periods[0], last = periods[periods.length - 1];
  const firstC = costByP.get(first), lastC = costByP.get(last);
  if(!firstC || !lastC || firstC.total <= 0 || lastC.total <= 0) return '';
  const spendPct = ((lastC.total - firstC.total) / firstC.total * 100);
  const firstRShare = firstC.reactive / firstC.total * 100;
  const lastRShare = lastC.reactive / lastC.total * 100;
  const rShift = lastRShare - firstRShare;
  let spendBit;
  if(Math.abs(spendPct) < 3) spendBit = 'Total spend has held roughly flat';
  else if(spendPct > 0) spendBit = `Total spend has grown ${spendPct.toFixed(0)}%`;
  else spendBit = `Total spend has fallen ${Math.abs(spendPct).toFixed(0)}%`;
  let rBit;
  if(Math.abs(rShift) < 1) rBit = `reactive share roughly stable around ${lastRShare.toFixed(0)}%`;
  else if(rShift > 0) rBit = `reactive share rising from ${firstRShare.toFixed(0)}% to ${lastRShare.toFixed(0)}%`;
  else rBit = `reactive share falling from ${firstRShare.toFixed(0)}% to ${lastRShare.toFixed(0)}%`;
  let compBit = '';
  const firstComp = compByP.get(first), lastComp = compByP.get(last);
  if(firstComp !== null && lastComp !== null){
    const pp = lastComp - firstComp;
    const validComp = periods.map(p => compByP.get(p)).filter(v => v !== null);
    const allBelow = validComp.every(v => v < 95);
    const allAbove = validComp.every(v => v >= 95);
    if(Math.abs(pp) < 1){
      compBit = ` PM compliance held around ${lastComp.toFixed(0)}%`;
    } else if(pp < 0){
      compBit = ` PM compliance fell ${Math.abs(pp).toFixed(1)}pp`;
    } else {
      compBit = ` PM compliance rose ${pp.toFixed(1)}pp`;
    }
    if(allBelow) compBit += ' and has been below the 95% target throughout.';
    else if(allAbove) compBit += ' and has held above the 95% target throughout.';
    else compBit += '.';
  }
  return `${spendBit} over ${periods.length} periods, with ${rBit}.${compBit}`;
}

// Collect scatter items at the chosen entity level (asset class / county / BA / site).
// Returns: items[], focus, excludedNoPm, totalEntities
function ovCollectScatterData(viewBy){
  const focus = resolveFocusPeriod();
  if(!focus) return { items: [], focus: null, excludedNoPm: 0, totalEntities: 0 };
  const costRows = ovRowsInPeriod('cost', focus);
  const pmRows = ovRowsInPeriod('pm', focus);
  const keyOf = (r) => {
    switch(viewBy){
      case 'assetClass': return r.assetClass || null;
      case 'county': return r.county || null;
      case 'businessArea': return r.businessArea || null;
      case 'site': return r.site || null;
      default: return r.assetClass || null;
    }
  };
  // Aggregate cost per entity + sub-aggregate per BA for dominant-BA colouring
  const byEnt = new Map();
  const baByEnt = new Map();
  for(const r of costRows){
    const k = keyOf(r);
    if(!k) continue;
    if(!byEnt.has(k)) byEnt.set(k, { rC:0, pC:0, rW:0, pW:0, totalWO:0, totalCost:0 });
    const s = byEnt.get(k);
    s.rC += r.reactiveCost || 0;
    s.pC += r.proactiveCost || 0;
    s.rW += r.reactiveWO || 0;
    s.pW += r.proactiveWO || 0;
    s.totalWO += r.totalWO || 0;
    s.totalCost += r.totalCost || 0;
    const ba = r.businessArea || 'Unknown';
    const subKey = k + '|||' + ba;
    baByEnt.set(subKey, (baByEnt.get(subKey) || 0) + (r.totalCost || 0));
  }
  const pmByEnt = new Map();
  for(const r of pmRows){
    const k = keyOf(r);
    if(!k) continue;
    if(!pmByEnt.has(k)) pmByEnt.set(k, { total:0, overdue:0 });
    const s = pmByEnt.get(k);
    s.total += r.totalTasks || 0;
    s.overdue += r.overdueTasks || 0;
  }
  const items = [];
  let excludedNoPm = 0;
  for(const [k, cs] of byEnt){
    const pm = pmByEnt.get(k);
    if(!pm || pm.total === 0){ excludedNoPm++; continue; }
    const compliancePct = (1 - pm.overdue / pm.total) * 100;
    const corrective = cs.rC + cs.pC;
    if(corrective <= 0) continue;
    const reactiveShare = cs.rC / corrective * 100;
    // Dominant BA for this entity
    let dominantBa = 'Unknown', maxCost = 0;
    for(const [sk, v] of baByEnt){
      const sep = sk.indexOf('|||');
      const ent = sk.slice(0, sep);
      const ba = sk.slice(sep + 3);
      if(ent !== k) continue;
      if(v > maxCost){ maxCost = v; dominantBa = ba; }
    }
    items.push({
      label: k,
      y: reactiveShare,
      compliancePct,
      totalSpend: cs.totalCost,
      correctiveSpend: corrective,
      correctiveWO: cs.rW + cs.pW,
      reactiveWO: cs.rW, proactiveWO: cs.pW,
      reactiveCost: cs.rC, proactiveCost: cs.pC,
      totalTasks: pm.total, onTime: pm.total - pm.overdue,
      businessArea: dominantBa
    });
  }
  items.sort((a,b) => b.totalSpend - a.totalSpend);
  return { items, focus, excludedNoPm, totalEntities: items.length };
}

function renderScatterSVG(host, items, yDef, yMedian){
  const W = Math.max(600, host.clientWidth || host.offsetWidth || 900);
  const H = 380;
  const mL = 78, mR = 24, mT = 26, mB = 42;
  const plotW = W - mL - mR, plotH = H - mT - mB;
  // Y axis fixed 0-100 since metric is always reactive share %
  const yMin = 0, yMax = 100;
  const yTicksObj = niceTicks(yMin, yMax, 5);
  const yTicks = yTicksObj.ticks;
  const yActualMin = yTicks[0], yActualMax = yTicks[yTicks.length - 1];
  const xScale = (v) => mL + (v / 100) * plotW;
  const yScale = (v) => (mT + plotH) - ((v - yActualMin) / (yActualMax - yActualMin)) * plotH;
  const spendMax = Math.max(...items.map(i => i.totalSpend), 1);
  const rForSpend = (spend) => {
    if(spendMax <= 0) return 6;
    const t = Math.sqrt(spend / spendMax);
    return Math.max(5, Math.min(28, 5 + t * 24));
  };

  const parts = [];
  parts.push(`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="xMidYMid meet" style="overflow:visible">`);
  // Highlight the top-LEFT quadrant subtly (PM uplift opportunity)
  const x95 = xScale(95);
  const yMed = yScale(yMedian);
  parts.push(`<rect x="${mL.toFixed(1)}" y="${mT.toFixed(1)}" width="${(x95 - mL).toFixed(1)}" height="${(yMed - mT).toFixed(1)}" fill="${COLORS.warning}" fill-opacity="0.06"/>`);
  // Gridlines + Y labels
  yTicks.forEach(t => {
    const y = yScale(t);
    parts.push(`<line x1="${mL}" y1="${y.toFixed(1)}" x2="${(W - mR).toFixed(1)}" y2="${y.toFixed(1)}" stroke="#eee" stroke-width="1"/>`);
    parts.push(`<text x="${(mL - 6).toFixed(1)}" y="${(y + 3).toFixed(1)}" text-anchor="end" font-size="11" fill="#666">${escapeHtml(yDef.fmt(t))}</text>`);
  });
  // X axis ticks every 10
  for(let x = 0; x <= 100; x += 10){
    const xp = xScale(x);
    parts.push(`<line x1="${xp.toFixed(1)}" y1="${mT}" x2="${xp.toFixed(1)}" y2="${(mT + plotH).toFixed(1)}" stroke="#f3f3f3" stroke-width="1"/>`);
    if(x % 20 === 0){
      parts.push(`<text x="${xp.toFixed(1)}" y="${(mT + plotH + 16).toFixed(1)}" text-anchor="middle" font-size="11" fill="#666">${x}%</text>`);
    }
  }
  // Axis labels
  parts.push(`<text x="${(mL + plotW / 2).toFixed(1)}" y="${(mT + plotH + 34).toFixed(1)}" text-anchor="middle" font-size="11" fill="#666">PM compliance (higher is better) →</text>`);
  parts.push(`<text x="16" y="${(mT + plotH / 2).toFixed(1)}" text-anchor="middle" transform="rotate(-90 16 ${(mT + plotH / 2).toFixed(1)})" font-size="11" fill="#666">${escapeHtml(yDef.axis)}</text>`);
  // Quadrant split lines
  parts.push(`<line x1="${x95.toFixed(1)}" y1="${mT}" x2="${x95.toFixed(1)}" y2="${(mT + plotH).toFixed(1)}" stroke="${COLORS.neutral}" stroke-width="1.3" stroke-dasharray="6,4"/>`);
  parts.push(`<line x1="${mL}" y1="${yMed.toFixed(1)}" x2="${(W - mR).toFixed(1)}" y2="${yMed.toFixed(1)}" stroke="${COLORS.neutral}" stroke-width="1.3" stroke-dasharray="6,4"/>`);
  // Median annotation
  parts.push(`<text x="${(W - mR - 4).toFixed(1)}" y="${(yMed - 4).toFixed(1)}" text-anchor="end" font-size="10" fill="#888" font-style="italic">Median (${yMedian.toFixed(0)}%)</text>`);
  parts.push(`<text x="${(x95 + 4).toFixed(1)}" y="${(mT + 11).toFixed(1)}" font-size="10" fill="#888" font-style="italic">95% target</text>`);
  // Quadrant labels (top-LEFT highlighted as the actionable cell)
  const labelPad = 8;
  const subdued = 'font-size="10.5" fill="#888" font-style="italic"';
  parts.push(`<text x="${(mL + labelPad).toFixed(1)}" y="${(mT + 14).toFixed(1)}" font-size="11" fill="${COLORS.warning}" font-weight="700">PM UPLIFT OPPORTUNITY</text>`);
  parts.push(`<text x="${(mL + labelPad).toFixed(1)}" y="${(mT + 26).toFixed(1)}" ${subdued}>low PM, above-median reactive share</text>`);
  parts.push(`<text x="${(W - mR - labelPad).toFixed(1)}" y="${(mT + 14).toFixed(1)}" text-anchor="end" ${subdued}>PM at target but reactive still high - investigate</text>`);
  parts.push(`<text x="${(mL + labelPad).toFixed(1)}" y="${(mT + plotH - 6).toFixed(1)}" ${subdued}>Low PM but holding up - watch</text>`);
  parts.push(`<text x="${(W - mR - labelPad).toFixed(1)}" y="${(mT + plotH - 6).toFixed(1)}" text-anchor="end" ${subdued}>Healthy</text>`);

  // Bubbles
  const bubbles = [];
  items.forEach(it => {
    const cx = xScale(it.compliancePct);
    const cy = yScale(it.y);
    const r = rForSpend(it.totalSpend);
    const color = BA_COLOR[it.businessArea] || COLORS.neutral;
    const isTopLeft = it.compliancePct < 95 && it.y >= yMedian;
    const tt = `<div class="tt-title">${escapeHtml(it.label)}</div>
      <div class="tt-row"><span class="tt-label">Business area</span><span>${escapeHtml(it.businessArea)}</span></div>
      <div class="tt-row"><span class="tt-label">PM compliance</span><span>${it.compliancePct.toFixed(1)}% (${fmtNum(it.onTime)}/${fmtNum(it.totalTasks)} tasks)</span></div>
      <div class="tt-row"><span class="tt-label">Reactive share</span><span>${it.y.toFixed(1)}%</span></div>
      <div class="tt-row"><span class="tt-label">Total spend</span><span>${escapeHtml(fmtCurrencyFull(it.totalSpend))}</span></div>
      <div class="tt-row"><span class="tt-label">Corrective £ (R+P)</span><span>${escapeHtml(fmtCurrencyFull(it.correctiveSpend))} (${fmtNum(it.correctiveWO)} WOs)</span></div>`;
    bubbles.push({ cx, cy, r, color, label: it.label, isTopLeft, tt });
  });
  bubbles.forEach((b, i) => {
    parts.push(`<circle class="ov-scatter-bubble" data-ttidx="${i}" cx="${b.cx.toFixed(1)}" cy="${b.cy.toFixed(1)}" r="${b.r.toFixed(1)}" fill="${b.color}" fill-opacity="0.7" stroke="${b.color}" stroke-width="1.5"/>`);
  });
  // Persistent labels for the actionable top-LEFT quadrant
  bubbles.forEach(b => {
    if(!b.isTopLeft) return;
    const lx = b.cx + b.r + 4;
    parts.push(`<text x="${lx.toFixed(1)}" y="${(b.cy + 4).toFixed(1)}" font-size="11" fill="${COLORS.warning}" font-weight="600">${escapeHtml(truncateLabel(b.label, 20))}</text>`);
  });
  parts.push(`</svg>`);
  host.innerHTML = parts.join('');
  host.querySelectorAll('.ov-scatter-bubble').forEach((n, i) => addTooltip(n, bubbles[i].tt));
}

function truncateLabel(s, n){
  if(!s) return '';
  return s.length > n ? s.slice(0, n - 1) + '…' : s;
}

function buildSection6SoWhat(topLeft, focus, viewLabel){
  if(!topLeft.length){
    return `No ${escapeHtml(viewLabel)}s sit in the PM uplift quadrant for ${escapeHtml(focus)}. PM compliance is at target or reactive share is well-controlled across the visible set.`;
  }
  const totalCombined = topLeft.reduce((s, x) => s + x.totalSpend, 0);
  const nameList = topLeft.slice(0, 3).map(x => `<strong>${escapeHtml(x.label)}</strong>`).join(', ').replace(/,([^,]*)$/, ' and$1');
  const wordN = topLeft.length === 1 ? `One ${viewLabel}` : `${topLeft.length} ${viewLabel}s`;
  if(topLeft.length > 5){
    return `${topLeft.length} ${viewLabel}s show high reactive share with PM compliance below target in ${escapeHtml(focus)} - led by ${nameList} - combined spend <strong>${fmtCurrency(totalCombined)}</strong>. Lifting PM here should reduce reactive cost.`;
  }
  return `${wordN} show${topLeft.length === 1 ? 's' : ''} high reactive share with PM compliance below target in ${escapeHtml(focus)} - ${nameList} - combined spend <strong>${fmtCurrency(totalCombined)}</strong>. Lifting PM here should reduce reactive cost.`;
}

// Section 7 - What's changed (movers)
// ============================================================
function getMoversEntityKey(r, entityType){
  switch(entityType){
    case 'assetClass': return r.assetClass || null;
    case 'assetClassCounty': return (r.assetClass && r.county) ? (r.assetClass + ' in ' + r.county) : null;
    case 'county': return r.county || null;
    case 'businessArea': return r.businessArea || null;
    case 'site': return r.site || null;
    default: return r.assetClass || null;
  }
}

function ovCollectMovers(entityType, costMetric){
  const focus = resolveFocusPeriod();
  if(!focus) return { cost:[], pm:[], hasComparison:false, focus:null };
  const cmpMode = STATE.filters.comparisonMode;
  if(cmpMode === 'none') return { cost:[], pm:[], hasComparison:false, focus };
  const cmpPeriod = resolveComparisonPeriod(focus);
  if(!cmpPeriod) return { cost:[], pm:[], hasComparison:false, focus };
  const agg = STATE.filters.aggregation;
  const curCost = ovRowsInPeriod('cost', focus);
  const cmpCost = cmpPeriod === '3yr-avg' ? rowsFor3YrAvg(ovFilteredCostRows(), focus, agg) : ovRowsInPeriod('cost', cmpPeriod);
  const curPM = ovRowsInPeriod('pm', focus);
  const cmpPM = cmpPeriod === '3yr-avg' ? rowsFor3YrAvg(ovFilteredPMRows(), focus, agg) : ovRowsInPeriod('pm', cmpPeriod);
  const grp = (rows) => {
    const m = new Map();
    for(const r of rows){
      const k = getMoversEntityKey(r, entityType);
      if(!k) continue;
      let arr = m.get(k);
      if(!arr){ arr = []; m.set(k, arr); }
      arr.push(r);
    }
    return m;
  };
  const gCurCost = grp(curCost), gCmpCost = grp(cmpCost);
  const gCurPM = grp(curPM), gCmpPM = grp(cmpPM);
  const pickRatio = (m) => m.costPerWO[costMetric];
  const pickWO = (m) => costMetric === 'reactive' ? m.reactiveWO : costMetric === 'proactive' ? m.proactiveWO : m.correctiveWO;
  const minSpend = STATE.overview.s7MinSpend || 0;
  const costRows = [];
  for(const [key, arr] of gCurCost){
    const cmpArr = gCmpCost.get(key);
    if(!cmpArr) continue;
    const cm = computeCostMetrics(arr), pm = computeCostMetrics(cmpArr);
    const curWO = pickWO(cm), cmpWO = pickWO(pm);
    if(curWO < 3 || cmpWO < 3) continue;
    if(cm.totalCost < minSpend) continue;  // material-spend threshold to drop tiny entities
    const curR = pickRatio(cm), cmpR = pickRatio(pm);
    if(curR === null || cmpR === null || cmpR === 0) continue;
    const delta = curR - cmpR;
    const pct = delta / cmpR * 100;
    costRows.push({ key, now:curR, then:cmpR, delta, pct, vol:curWO, totalSpend:cm.totalCost });
  }
  const pmRows = [];
  for(const [key, arr] of gCurPM){
    const cmpArr = gCmpPM.get(key);
    if(!cmpArr) continue;
    const cm = computePMMetrics(arr), pm = computePMMetrics(cmpArr);
    if(cm.totalTasks < 5 || pm.totalTasks < 5) continue;
    if(cm.compliancePct === null || pm.compliancePct === null) continue;
    const delta = cm.compliancePct - pm.compliancePct;
    pmRows.push({ key, now:cm.compliancePct, then:pm.compliancePct, delta, vol:cm.totalTasks });
  }
  return { cost:costRows, pm:pmRows, hasComparison:true, cmpLabel:comparisonModeLabel(), focus };
}

  const data = ovCollectMovers(entityType, costMetric);

    el.innerHTML = `<div class="ov-card"><div class="ov-card-header"><h3 class="ov-card-title">What's changed</h3></div><div class="ov-placeholder">Select a comparison period in the filter bar to see what's changed.</div></div>`;
    return;
  }

  const pmFallsAll   = [...data.pm].filter(r => r.delta < 0).sort((a,b) => a.delta - b.delta);

  const showCountLbl = ov.s7ShowCount;

  el.innerHTML = `
    <div class="ov-card">

            <option value="assetClassCounty" ${entityType==='assetClassCounty'?'selected':''}>Asset class × county</option>
            <option value="county" ${entityType==='county'?'selected':''}>County</option>
            <option value="businessArea" ${entityType==='businessArea'?'selected':''}>Business area</option>
            <option value="site" ${entityType==='site'?'selected':''}>Site</option>
          </select>
          <label>Cost</label>
          <select id="ovS7CostMetric">
            <option value="corrective" ${costMetric==='corrective'?'selected':''}>Corrective</option>
            <option value="reactive" ${costMetric==='reactive'?'selected':''}>Reactive</option>
            <option value="proactive" ${costMetric==='proactive'?'selected':''}>Proactive</option>
          </select>
          <label>Sort</label>
          <select id="ovS7SortBy">
            <option value="abs" ${ov.s7SortBy==='abs'?'selected':''}>Δ£ (material)</option>
            <option value="pct" ${ov.s7SortBy==='pct'?'selected':''}>Δ% (relative)</option>
          </select>
          <label>Min spend £<span id="ovS7MinSpendLabel" style="font-weight:600;color:var(--primary)">${minSpendK}k</span></label>
          <input type="range" id="ovS7MinSpend" min="0" max="500000" step="10000" value="${ov.s7MinSpend}" style="width:100px">
          <label>Show</label>
          <select id="ovS7Show">
            <option value="5" ${showCountLbl===5?'selected':''}>Top 5</option>
            <option value="10" ${showCountLbl===10?'selected':''}>Top 10</option>
            <option value="all" ${showCountLbl==='all'?'selected':''}>All</option>

      ${soWhat ? `<div class="ov-section-sowhat">${soWhat}</div>` : ''}
      <div class="ov-movers-row">
        <div class="ov-movers-panel">

          ${buildMoversCostTable(costRises, { direction:'rise' }) || '<div class="ov-scatter-empty">No qualifying movers</div>'}
          <div class="ov-movers-collapsed ${ov.s7ShowDecreases ? 'open' : ''}" id="ov7DecreasesPanel">

function buildMoversCostTable(rows, opts){
  if(!rows.length) return '';
  const badCls = opts.direction === 'rise' ? 'delta-bad' : 'delta-good';
  const body = rows.map(r => {
    const pctTxt = (r.pct >= 0 ? '+' : '') + r.pct.toFixed(1) + '%';
    return `<tr>
      <td>${escapeHtml(r.key)}</td>
      <td class="num">${fmtCurrency(r.now)}</td>
      <td class="num">${fmtCurrency(r.then)}</td>
      <td class="num">${r.delta >= 0 ? '+' : ''}${fmtCurrency(r.delta)}</td>
      <td class="num ${badCls}">${pctTxt}</td>
      <td class="num vol">${fmtNum(r.vol)}</td>
    </tr>`;
  }).join('');
  return `
    <table class="ov-movers-table">
      <thead><tr>
        <th>Entity</th>
        <th class="num">Now</th>
        <th class="num">Then</th>
        <th class="num">Δ£</th>
        <th class="num">Δ%</th>
        <th class="num">WOs</th>
      </tr></thead>
      <tbody>${body}</tbody>
    </table>
  `;
}

function buildMoversPMTable(rows, opts){
  if(!rows.length) return '';
  const badCls = opts.direction === 'fall' ? 'delta-bad' : 'delta-good';
  const body = rows.map(r => {
    const dTxt = (r.delta >= 0 ? '+' : '') + r.delta.toFixed(1) + 'pp';
    return `<tr>
      <td>${escapeHtml(r.key)}</td>
      <td class="num">${r.now.toFixed(1)}%</td>
      <td class="num">${r.then.toFixed(1)}%</td>
      <td class="num ${badCls}">${dTxt}</td>
      <td class="num vol">${fmtNum(r.vol)}</td>
    </tr>`;
  }).join('');
  return `
    <table class="ov-movers-table">
      <thead><tr>
        <th>Entity</th>
        <th class="num">Now</th>
        <th class="num">Then</th>
        <th class="num">Δpp</th>
        <th class="num">Tasks</th>
      </tr></thead>
      <tbody>${body}</tbody>
    </table>
  `;
}

function buildSection7SoWhat(costRisesAll, pmFallsAll, cmpLabel){
  const topCost = costRisesAll.slice(0, 2);
  const topPm = pmFallsAll.slice(0, 2);
  if(!topCost.length && !topPm.length) return '';
  if(!topCost.length){
    return `The steepest compliance falls since ${escapeHtml(cmpLabel)} are <strong>${escapeHtml(topPm[0].key)}</strong> (${topPm[0].delta.toFixed(1)}pp)${topPm[1] ? ' and <strong>' + escapeHtml(topPm[1].key) + '</strong> (' + topPm[1].delta.toFixed(1) + 'pp)' : ''}.`;
  }
  const topCostKeys = new Set(topCost.map(r => r.key));
  const overlapPm = pmFallsAll.filter(r => topCostKeys.has(r.key) && r.delta < -3).slice(0, 2);
  const costNames = topCost.map(r => `<strong>${escapeHtml(r.key)}</strong> (${r.delta >= 0 ? '+' : ''}${fmtCurrency(r.delta)}/WO, ${fmtNum(r.vol)} WOs)`).join(' and ');
  let sentence = `The steepest cost rises since ${escapeHtml(cmpLabel)} are ${costNames}`;
  if(overlapPm.length) sentence += `, both of which also saw PM compliance fall by more than 3pp`;
  sentence += '.';
  if(topPm.length && !overlapPm.length){
    sentence += ` Separately, the steepest compliance fall was <strong>${escapeHtml(topPm[0].key)}</strong> (${topPm[0].delta.toFixed(1)}pp).`;
  }
  return sentence;
}

function buildCascadeSoWhat(baEntities, ctyTop, acShown, totalSpend, focusLbl){
  if(totalSpend <= 0 || !baEntities.length) return '';
  const topBa = baEntities[0];
  const topBaShare = (topBa.totalCost / totalSpend * 100);
  if(topBaShare > 80){
    const topCty = ctyTop[0];
    if(topCty){
      const ctyShare = topCty.totalCost / totalSpend * 100;
      return `<strong>${escapeHtml(topBa.label)}</strong> accounts for ${topBaShare.toFixed(0)}% of spend in ${escapeHtml(focusLbl)} - <strong>${escapeHtml(topCty.label)}</strong> alone is ${ctyShare.toFixed(0)}%.`;
    }
    return `<strong>${escapeHtml(topBa.label)}</strong> accounts for ${topBaShare.toFixed(0)}% of spend in ${escapeHtml(focusLbl)}.`;
  }
  if(topBaShare < 25 && baEntities.length >= 2){
    return `Spend is evenly distributed - no single business area exceeds 25% of the ${escapeHtml(focusLbl)} total.`;
  }
  // Normal narrative
  let txt = `<strong>${escapeHtml(topBa.label)}</strong> accounts for ${topBaShare.toFixed(0)}% of spend in ${escapeHtml(focusLbl)}.`;
  if(ctyTop.length >= 2){
    const combined = (ctyTop[0].totalCost + ctyTop[1].totalCost) / totalSpend * 100;
    txt += ` <strong>${escapeHtml(ctyTop[0].label)}</strong> and <strong>${escapeHtml(ctyTop[1].label)}</strong> drive ${combined.toFixed(0)}% of total.`;
  } else if(ctyTop.length === 1){
    const share = ctyTop[0].totalCost / totalSpend * 100;
    txt += ` <strong>${escapeHtml(ctyTop[0].label)}</strong> alone is ${share.toFixed(0)}%.`;
  }
  if(acShown.length){
    const topAc = acShown[0];
    const rShare = topAc.reactivePct !== null ? topAc.reactivePct.toFixed(0) + '%' : '—';
    txt += ` The biggest asset class is <strong>${escapeHtml(topAc.label)}</strong> at ${fmtCurrency(topAc.totalCost)} (${rShare} reactive).`;
  }
  return txt;
}

// ============================================================
// Overview - shared helpers (filtering, period index, sparkline, etc.)
// ============================================================

// Apply asset-class selection on top of global filters (cost rows)
function ovFilteredCostRows(){
  if(_renderCache && _renderCache.ovCostRows) return _renderCache.ovCostRows;
  const selection = resolveAssetClassSelection();
  const base = getFilteredCostRows();
  const rows = (selection && selection.size > 0) ? base.filter(r => selection.has(r.assetClass)) : base;
  if(_renderCache) _renderCache.ovCostRows = rows;
  return rows;
}

// Apply asset-class selection on top of global filters (pm rows)
function ovFilteredPMRows(){
  if(_renderCache && _renderCache.ovPMRows) return _renderCache.ovPMRows;
  const selection = resolveAssetClassSelection();
  const base = getFilteredPMRows();
  const rows = (selection && selection.size > 0) ? base.filter(r => selection.has(r.assetClass)) : base;
  if(_renderCache) _renderCache.ovPMRows = rows;
  return rows;
}

// Period index scoped to overview rows, with render cache
function ovRowsInPeriod(type, period){
  const agg = STATE.filters.aggregation;
  if(!_renderCache){
    const rows = type === 'cost' ? ovFilteredCostRows() : ovFilteredPMRows();
    return rows.filter(r => periodKey(r, agg) === period);
  }
  const cacheKey = 'ovPeriodIdx_' + type + '_' + agg;
  let idx = _renderCache[cacheKey];
  if(!idx){
    idx = new Map();
    const rows = type === 'cost' ? ovFilteredCostRows() : ovFilteredPMRows();
    for(const r of rows){
      const k = periodKey(r, agg);
      let arr = idx.get(k);
      if(!arr){ arr = []; idx.set(k, arr); }
      arr.push(r);
    }
    _renderCache[cacheKey] = idx;
  }
  return idx.get(period) || [];
}

// Sparkline periods: last N periods in ALL DATA (not filter range) ending at focus period.
// N = 6 for quarter/month, 4 for FY (typically only 3-6 FYs of data).
function ovGetSparklinePeriods(focusPeriod){
  const agg = STATE.filters.aggregation;
  const allMonths = STATE.allMonths;
  if(!allMonths.length) return [];
  const N = agg === 'fy' ? 5 : 6;
  if(agg === 'month'){
    const idx = allMonths.indexOf(focusPeriod);
    if(idx < 0) return allMonths.slice(-N);
    return allMonths.slice(Math.max(0, idx - (N-1)), idx + 1);
  }
  if(agg === 'fy'){
    const fySet = new Set();
    for(const ym of allMonths){
      const [y,m] = ym.split('-').map(Number);
      fySet.add(fyLabel(computeFY(y,m)));
    }
    const allFys = [...fySet].sort((a,b) => periodOrd(a,'fy') - periodOrd(b,'fy'));
    const idx = allFys.indexOf(focusPeriod);
    if(idx < 0) return allFys.slice(-N);
    return allFys.slice(Math.max(0, idx - (N-1)), idx + 1);
  }
  const qSet = new Set();
  for(const ym of allMonths){
    const [y,m] = ym.split('-').map(Number);
    qSet.add(fyQuarterLabel(computeFY(y,m), computeFYQuarter(m)));
  }
  const allQs = [...qSet].sort((a,b) => periodOrd(a,'quarter') - periodOrd(b,'quarter'));
  const idx = allQs.indexOf(focusPeriod);
  if(idx < 0) return allQs.slice(-N);
  return allQs.slice(Math.max(0, idx - (N-1)), idx + 1);
}

// Compute sparkline data in a single pass per dataset (cost + PM).
// Respects all non-time filters + asset class selection; time range is ignored.
function ovComputeSparklineData(periods){
  const cacheKey = 'ovSparklineData_' + periods.join('|');
  if(_renderCache && _renderCache[cacheKey]) return _renderCache[cacheKey];
  const agg = STATE.filters.aggregation;
  const f = STATE.filters;
  const hasBA = f.businessArea.size > 0 && f.businessArea.size < STATE.dimensions.businessAreas.length;
  const hasCty = f.county.size > 0 && f.county.size < STATE.dimensions.counties.length;
  const selection = resolveAssetClassSelection();
  const useSel = selection && selection.size > 0;
  const matchFilters = (r) => {
    if(hasBA && !f.businessArea.has(r.businessArea)) return false;
    if(hasCty){
      const key = r.county || 'No county';
      if(!f.county.has(key)) return false;
    }
    if(!f.includeUnknown && (r.assetClass === 'Unknown' || r.equipmentClass === 'Unknown' || !r.assetClass)) return false;
    if(useSel && !selection.has(r.assetClass)) return false;
    return true;
  };
  const periodSet = new Set(periods);
  const data = new Map();
  periods.forEach(p => data.set(p, {
    totalCost:0, reactiveCost:0, proactiveCost:0,
    reactiveWO:0, proactiveWO:0, totalWO:0,
    pmTotal:0, pmOverdue:0,
    hasCost:false, hasPM:false
  }));
  if(STATE.costEnriched){
    for(const r of STATE.costEnriched){
      const p = periodKey(r, agg);
      if(!periodSet.has(p)) continue;
      if(!matchFilters(r)) continue;
      const s = data.get(p);
      s.totalCost += r.totalCost || 0;
      s.reactiveCost += r.reactiveCost || 0;
      s.proactiveCost += r.proactiveCost || 0;
      s.reactiveWO += r.reactiveWO || 0;
      s.proactiveWO += r.proactiveWO || 0;
      s.totalWO += r.totalWO || 0;
      s.hasCost = true;
    }
  }
  if(STATE.pmEnriched){
    for(const r of STATE.pmEnriched){
      const p = periodKey(r, agg);
      if(!periodSet.has(p)) continue;
      if(!matchFilters(r)) continue;
      const s = data.get(p);
      s.pmTotal += r.totalTasks || 0;
      s.pmOverdue += r.overdueTasks || 0;
      s.hasPM = true;
    }
  }
  if(_renderCache) _renderCache[cacheKey] = data;
  return data;
}

// Build an SVG sparkline. Returns { svg, min, max, first, last, firstPeriod, lastPeriod }.
// `periods` is optional - if supplied, the first/last non-null indices map to period labels for the footer.
function ovBuildSparkline(values, colorHex, focusIdx, periods){
  const w = 160, h = 36, padX = 3, padY = 4;
  const nonNull = values.filter(v => v !== null && !isNaN(v));
  if(nonNull.length < 2){
    return { svg: `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"></svg>`, min: null, max: null, first: null, last: null, firstPeriod: null, lastPeriod: null };
  }
  // Find first/last non-null indices for period labels
  let firstValidIdx = -1, lastValidIdx = -1;
  for(let i = 0; i < values.length; i++){
    if(values[i] !== null && !isNaN(values[i])){
      if(firstValidIdx === -1) firstValidIdx = i;
      lastValidIdx = i;
    }
  }
  let min = Math.min(...nonNull);
  let max = Math.max(...nonNull);
  if(max === min){
    // Flat line - centre it
    const pad = Math.abs(min) * 0.05 || 1;
    min -= pad; max += pad;
  }
  const range = max - min;
  const xStep = values.length > 1 ? (w - padX*2) / (values.length - 1) : 0;
  const baseY = h - padY;
  const points = values.map((v, i) => {
    if(v === null || isNaN(v)) return null;
    return { x: padX + i * xStep, y: h - padY - ((v - min) / range) * (h - padY*2) };
  });
  // Line only - no end dots, no area fill (clean, low-noise)
  let linePath = '';
  for(let i = 0; i < points.length; i++){
    const p = points[i];
    if(!p) continue;
    const prev = points[i-1];
    if(i === 0 || !prev) linePath += `M ${p.x.toFixed(2)},${p.y.toFixed(2)} `;
    else linePath += `L ${p.x.toFixed(2)},${p.y.toFixed(2)} `;
  }
  const svg = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${linePath.trim()}" fill="none" stroke="${colorHex}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
  </svg>`;
  return {
    svg, min, max,
    first: nonNull[0], last: nonNull[nonNull.length - 1],
    firstPeriod: periods ? periods[firstValidIdx] : null,
    lastPeriod: periods ? periods[lastValidIdx] : null
  };
}

// Human label for the time-span under a sparkline
function ovSparkSpanLabel(periods){
  const n = periods.length;
  const agg = STATE.filters.aggregation;
  if(!n) return '';
  if(n === 1) return '1 period';
  const unit = agg === 'month' ? 'months' : agg === 'fy' ? 'FYs' : 'quarters';
  return `${periods[0]} → ${periods[n - 1]} (${n} ${unit})`;
}

// Human-readable scope text for banner ("across UU", "in Water", "in Water (Cumbria)", etc.)
function ovScopeText(){
  const f = STATE.filters;
  const baTotal = STATE.dimensions.businessAreas.length;
  const ctTotal = STATE.dimensions.counties.length;
  const baAll = f.businessArea.size === 0 || f.businessArea.size === baTotal;
  const ctAll = f.county.size === 0 || f.county.size === ctTotal;
  if(baAll && ctAll) return 'across UU';
  const fmtList = (set, labelMany) => {
    const arr = [...set].sort();
    if(arr.length === 1) return arr[0];
    if(arr.length <= 3) return arr.join('/');
    return `${arr.length} ${labelMany}`;
  };
  if(!baAll && ctAll) return 'in ' + fmtList(f.businessArea, 'business areas');
  if(baAll && !ctAll) return 'in ' + fmtList(f.county, 'counties');
  return `in ${fmtList(f.businessArea, 'business areas')} (${fmtList(f.county, 'counties')})`;
}

// Focus period partial-month count helpers
function focusPeriodMonthCount(period){
  const agg = STATE.filters.aggregation;
  if(agg === 'month') return 1;
  const m = period.match(/FY(\d+)\s*Q(\d+)/);
  if(!m) return 0;
  const fy = 2000 + parseInt(m[1],10);
  const q = parseInt(m[2],10);
  let startMon, year;
  if(q === 1){ startMon = 4; year = fy - 1; }
  else if(q === 2){ startMon = 7; year = fy - 1; }
  else if(q === 3){ startMon = 10; year = fy - 1; }
  else { startMon = 1; year = fy; }
  const required = [0,1,2].map(o => `${year}-${String(startMon+o).padStart(2,'0')}`);
  const dataMonths = getDataMonthsInRange();
  return required.filter(ym => dataMonths.has(ym)).length;
}

function focusPeriodExpectedMonths(period){
  return STATE.filters.aggregation === 'month' ? 1 : 3;
}

// Top N cost movers (asset class × county) for the banner driver slot.
// Uses corrective £/WO % change, min 3 corrective WOs in both periods.
function ovTopCostMovers(currentPeriod, comparisonPeriod, n){
  if(!comparisonPeriod || STATE.filters.comparisonMode === 'none') return [];
  const agg = STATE.filters.aggregation;
  const curRows = ovRowsInPeriod('cost', currentPeriod);
  let cmpRows;
  if(comparisonPeriod === '3yr-avg'){
    cmpRows = rowsFor3YrAvg(ovFilteredCostRows(), currentPeriod, agg);
  } else {
    cmpRows = ovRowsInPeriod('cost', comparisonPeriod);
  }
  if(!curRows.length || !cmpRows.length) return [];
  const keyOf = (r) => (r.assetClass && r.county) ? `${r.assetClass}||${r.county}` : null;
  const group = (rows) => {
    const m = new Map();
    for(const r of rows){
      const k = keyOf(r);
      if(!k) continue;
      let arr = m.get(k);
      if(!arr){ arr = []; m.set(k, arr); }
      arr.push(r);
    }
    return m;
  };
  const gCur = group(curRows), gCmp = group(cmpRows);
  const out = [];
  for(const [k, curArr] of gCur){
    const cmpArr = gCmp.get(k);
    if(!cmpArr) continue;
    const cm = computeCostMetrics(curArr), pm = computeCostMetrics(cmpArr);
    if(cm.correctiveWO < 3 || pm.correctiveWO < 3) continue;
    if(cm.costPerWO.corrective === null || pm.costPerWO.corrective === null) continue;
    const pct = (cm.costPerWO.corrective - pm.costPerWO.corrective) / pm.costPerWO.corrective * 100;
    if(pct <= 0) continue;
    const [ac, cty] = k.split('||');
    out.push({ ac, cty, label: `${ac} in ${cty}`, pct });
  }
  out.sort((a,b) => b.pct - a.pct);
  return out.slice(0, n);
}

// ============================================================
// Section 0 - Headline banner
// ============================================================
function renderOv0Banner(){
  const el = document.getElementById('ovSection0');
  if(!el) return;
  const focus = resolveFocusPeriod();
  if(!focus){
    el.innerHTML = '<div class="ov-banner"><div class="ov-banner-text">No data for the selected filter.</div></div>';
    return;
  }
  const cmpMode = STATE.filters.comparisonMode;
  const cmpPeriod = resolveComparisonPeriod(focus);
  const agg = STATE.filters.aggregation;
  const partial = isFocusPeriodPartial();
  const scope = ovScopeText();
  const cmpLbl = comparisonModeLabel();

  // Current period metrics
  const cm = computeCostMetrics(ovRowsInPeriod('cost', focus));
  const pmMet = computePMMetrics(ovRowsInPeriod('pm', focus));

  // Comparison metrics
  let ccm = null, cpm = null;
  if(cmpMode !== 'none' && cmpPeriod){
    if(cmpPeriod === '3yr-avg'){
      ccm = computeCostMetrics(rowsFor3YrAvg(ovFilteredCostRows(), focus, agg));
      cpm = computePMMetrics(rowsFor3YrAvg(ovFilteredPMRows(), focus, agg));
    } else {
      ccm = computeCostMetrics(ovRowsInPeriod('cost', cmpPeriod));
      cpm = computePMMetrics(ovRowsInPeriod('pm', cmpPeriod));
    }
  }

  // Sentence composition
  const parts = [];
  // Slot 1+2: period + total
  const periodBit = partial
    ? `So far in <strong>${escapeHtml(focus)}</strong> (based on ${focusPeriodMonthCount(focus)} of ${focusPeriodExpectedMonths(focus)} months)`
    : `In <strong>${escapeHtml(focus)}</strong>`;
  const totalBit = cm.totalCost > 0
    ? `<strong>${fmtCurrency(cm.totalCost)}</strong> was spent on maintenance ${scope}.`
    : `no maintenance spend was recorded ${scope}.`;
  parts.push(`${periodBit}, ${totalBit}`);

  // Slot 3: reactive
  if(cm.totalCost > 0){
    const reactivePct = cm.reactiveCost / cm.totalCost * 100;
    let clause = `Reactive spend was <strong>${fmtCurrency(cm.reactiveCost)} (${fmtPct(reactivePct)})</strong>`;
    if(ccm && ccm.totalCost > 0){
      const cmpPct = ccm.reactiveCost / ccm.totalCost * 100;
      const d = reactivePct - cmpPct;
      const dir = d >= 0 ? 'up' : 'down';
      clause += `, ${dir} <strong>${Math.abs(d).toFixed(1)}pp</strong> vs ${cmpLbl}`;
    }
    clause += '.';
    parts.push(clause);
  }

  // Slot 4: PM compliance
  if(pmMet.compliancePct !== null){
    let clause = `PM compliance was <strong>${fmtPct(pmMet.compliancePct)}</strong>`;
    if(cpm && cpm.compliancePct !== null){
      const d = pmMet.compliancePct - cpm.compliancePct;
      const dir = d >= 0 ? 'up' : 'down';
      clause += `, ${dir} <strong>${Math.abs(d).toFixed(1)}pp</strong> vs ${cmpLbl}`;
    }
    clause += '.';
    parts.push(clause);
  } else {
    parts.push('PM compliance could not be computed for this selection.');
  }

  // Slot 5: drivers
  const movers = ovTopCostMovers(focus, cmpPeriod, 2);
  if(movers.length === 2){
    parts.push(`The steepest cost increases came from <strong>${escapeHtml(movers[0].label)}</strong> and <strong>${escapeHtml(movers[1].label)}</strong>.`);
  } else if(movers.length === 1){
    parts.push(`The steepest cost increase came from <strong>${escapeHtml(movers[0].label)}</strong>.`);
  }

  const html = parts.join(' ');
  const plain = html.replace(/<[^>]+>/g, '');

  el.innerHTML = `
    <div class="ov-banner">
      <div class="ov-banner-text">${html}</div>
      <button class="ov-banner-copy" id="ovBannerCopy" type="button">Copy sentence</button>
    </div>
  `;
  const btn = document.getElementById('ovBannerCopy');
  if(btn){
    btn.onclick = () => {
      const doReset = () => { btn.classList.remove('copied'); btn.textContent = 'Copy sentence'; };
      const ok = () => {
        btn.classList.add('copied');
        btn.textContent = 'Copied';
        setTimeout(doReset, 1500);
      };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(plain).then(ok).catch(() => {
          fallbackCopy(plain); ok();
        });
      } else {
        fallbackCopy(plain); ok();
      }
    };
  }
}

function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.top = '-1000px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
}
