<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<title>UU Maintenance & PM Compliance Dashboard — Corrective model</title>
<style>
:root{
  --primary:#024E43;
  --success:#00A878;
  --warning:#FF6B35;
  --danger:#d32f2f;
  --accent:#e91e63;
  --neutral:#94a3b8;
  --text-primary:#333;
  --text-secondary:#666;
  --bg:#f5f5f5;
  --surface:#fff;
  --border:#e0e0e0;
  --tint:#e8f5f1;
  --amber:#fff8e1;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text-primary);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;line-height:1.5}
button{font-family:inherit;font-size:inherit}
h1,h2,h3,h4{color:var(--primary);margin:0}

/* Header */
.app-header{background:var(--primary);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
.app-header h1{color:#fff;font-size:18px;font-weight:600;letter-spacing:.2px}
.coverage{font-size:12px;opacity:.9;text-align:right;line-height:1.4}

/* Upload bar */
.upload-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.upload-group{display:flex;gap:8px;align-items:center}
.upload-group-inflation{margin-left:auto;padding-left:14px;border-left:1px solid var(--border)}
.upload-group-inflation input{padding:5px 7px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:13px;text-align:right}
.upload-group-inflation input:focus{outline:none;border-color:var(--primary)}
.inflation-unit{font-size:12px;color:var(--text-secondary)}
.inflation-hint{font-size:11.5px;color:var(--primary);font-style:italic;margin-left:6px}
.upload-group label{font-weight:600;color:var(--primary);font-size:13px}
.btn{border:1px solid var(--border);background:var(--surface);padding:6px 12px;border-radius:6px;cursor:pointer;color:var(--text-primary)}
.btn:hover{background:#fafafa}
.btn-primary{background:var(--success);color:#fff;border-color:var(--success)}
.btn-primary:hover{background:#009468}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-danger:hover{background:#b71c1c}
.btn-small{padding:4px 8px;font-size:12px}
.file-list{font-size:12px;color:var(--text-secondary);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.file-chip{background:var(--tint);color:var(--primary);padding:3px 8px;border-radius:4px;display:inline-flex;gap:6px;align-items:center}
.file-chip button{border:none;background:transparent;color:var(--primary);cursor:pointer;padding:0;font-size:14px;line-height:1}
.file-chip button:hover{color:var(--danger)}

/* PM summary chip + expandable detail panel */
.pm-summary-chip{cursor:pointer;user-select:none;position:relative}
.pm-summary-chip:hover{background:#d6ebe4}
.pm-summary-caret{display:inline-block;margin-left:4px;transition:transform .15s ease;font-size:10px}
.pm-summary-chip.open .pm-summary-caret{transform:rotate(180deg)}
.pm-file-detail-panel{display:none;position:absolute;top:100%;left:auto;right:auto;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-top:6px;min-width:420px;max-width:560px;max-height:300px;overflow:auto;z-index:200;box-shadow:0 6px 16px rgba(0,0,0,.12);padding:4px}
.pm-file-detail-panel.open{display:block}
.pm-file-detail-header{font-size:11px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px;padding:8px 10px 4px}
.pm-file-detail-row{display:flex;align-items:center;gap:8px;padding:6px 10px;border-top:1px solid var(--border)}
.pm-file-detail-row:first-of-type{border-top:none}
.pm-file-detail-row:hover{background:var(--tint)}
.pm-file-detail-name{font-weight:600;color:var(--text-primary);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.pm-file-detail-meta{font-size:11px;color:var(--text-secondary);white-space:nowrap}
.pm-file-detail-remove{border:none;background:transparent;color:var(--text-secondary);cursor:pointer;font-size:16px;line-height:1;padding:2px 6px;border-radius:4px}
.pm-file-detail-remove:hover{color:var(--danger);background:#fdecea}

/* Tabs */
.tabs{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;gap:0}
.tab{padding:12px 20px;cursor:pointer;border:none;background:transparent;color:var(--text-secondary);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab:hover:not(.active){color:var(--primary);background:#fafafa}
.tab:disabled{opacity:.4;cursor:not-allowed}

/* Filter bar */
.filter-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.filter-group{display:flex;flex-direction:column;gap:4px;min-width:140px}
.filter-group label{font-size:11px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px}
.filter-group select,.filter-group input{padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:13px;font-family:inherit}
.filter-group select:focus,.filter-group input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(2,78,67,.15)}
.multi-select{position:relative;min-width:180px}
.multi-select-trigger{padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;min-height:28px}
.multi-select-trigger:after{content:'▾';color:var(--text-secondary);margin-left:6px}
.multi-select-panel{position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:6px;margin-top:2px;max-height:240px;overflow:auto;z-index:100;box-shadow:0 4px 12px rgba(0,0,0,.08);display:none}
.multi-select.open .multi-select-panel{display:block}
.multi-select-panel label{display:flex;align-items:center;gap:6px;padding:5px 10px;cursor:pointer;font-size:13px}
.multi-select-panel label:hover{background:var(--tint)}
.multi-select-panel input{margin:0}
.ms-actions{border-bottom:1px solid var(--border);padding:4px;display:flex;gap:4px}
.ms-actions button{flex:1;font-size:11px;padding:3px}

/* Toggle */
.toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13px}
.toggle input{margin:0}

/* Main content */
.main{padding:20px 24px}
.section-summary{background:var(--tint);border-left:3px solid var(--primary);padding:10px 14px;border-radius:4px;margin-bottom:16px;color:var(--primary);font-size:13px}
.segmented{display:inline-flex;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:2px;margin-bottom:12px}
.segmented button{border:none;background:transparent;padding:6px 12px;cursor:pointer;border-radius:4px;font-size:13px;color:var(--text-secondary);font-weight:600}
.segmented button.active{background:var(--primary);color:#fff}

/* Cards and rows */
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.row-single{display:grid;grid-template-columns:1fr;gap:16px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.card-title{font-size:14px;font-weight:600;color:var(--primary)}
.card-subtitle{font-size:12px;color:var(--text-secondary)}
.card-controls{display:flex;gap:8px;align-items:center;font-size:12px}
.card-controls select,.card-controls input[type=range]{font-size:12px}

/* Section controls */
.section-controls{display:flex;gap:16px;align-items:center;margin-bottom:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px}
.section-controls-label{font-size:12px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px}

/* Empty state */
.empty-state{text-align:center;padding:80px 20px;color:var(--text-secondary)}
.empty-state h2{color:var(--primary);margin-bottom:12px}
.empty-state p{max-width:520px;margin:6px auto}

/* Tables */
table.data-table{width:100%;border-collapse:collapse;font-size:12px}
table.data-table th{background:var(--primary);color:#fff;text-align:left;padding:7px 10px;font-weight:600;font-size:12px}
table.data-table td{padding:6px 10px;border-bottom:1px solid var(--border)}
table.data-table tr:hover td{background:#fafafa}
table.data-table tfoot td,table.data-table .summary-row td{background:var(--tint);color:var(--primary);font-weight:600}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pct-good{color:var(--success);font-weight:600}
.pct-warn{color:var(--warning);font-weight:600}
.pct-bad{color:var(--danger);font-weight:600}
.delta-up{color:var(--danger)}
.delta-down{color:var(--success)}

/* Chart containers */
.chart-wrap{position:relative;width:100%}
.chart-wrap svg{display:block;width:100%;height:auto;overflow:visible}
.chart-empty{text-align:center;color:var(--text-secondary);padding:40px 20px;font-size:13px;font-style:italic}

/* Tooltip */
#tooltip{position:fixed;background:var(--primary);color:#fff;padding:8px 10px;border-radius:6px;font-size:12px;pointer-events:none;z-index:1000;opacity:0;transition:opacity .12s;max-width:280px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
#tooltip.show{opacity:1}
#tooltip .tt-title{font-weight:600;margin-bottom:4px;border-bottom:1px solid rgba(255,255,255,.25);padding-bottom:3px}
#tooltip .tt-row{display:flex;justify-content:space-between;gap:12px}
#tooltip .tt-label{opacity:.85}

/* Alerts */
.alert{padding:10px 14px;border-radius:6px;margin-bottom:12px;font-size:13px}
.alert-warn{background:var(--amber);border-left:3px solid var(--warning);color:#7a4a00}
.alert-error{background:#fdecea;border-left:3px solid var(--danger);color:#7a1a1a}
.alert-info{background:var(--tint);border-left:3px solid var(--primary);color:var(--primary)}

/* Legend */
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--text-secondary);margin-top:6px}
.legend-item{display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.legend-item.muted{opacity:.35}
.legend-swatch{width:10px;height:10px;border-radius:2px;display:inline-block}

/* Slider layout */
.slider-wrap{display:flex;gap:8px;align-items:center;font-size:12px}
.slider-wrap input[type=range]{width:120px}

/* KPI row */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px}
.kpi-label{font-size:11px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.kpi-value{font-size:22px;font-weight:700;color:var(--primary);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi-sub{font-size:11px;color:var(--text-secondary);margin-top:2px}

/* Deep dive selector */
.dd-selector{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.dd-selector .filter-group{min-width:0}

/* Loading */
.loading{display:inline-block;padding:4px 10px;font-size:12px;color:var(--text-secondary);font-style:italic}

/* Progress bar for large-file load */
.load-progress-wrap{display:inline-flex;flex-direction:column;gap:4px;min-width:320px;vertical-align:middle}
.load-progress-label{font-size:11px;color:var(--text-secondary);font-style:italic}
.load-progress-label strong{font-weight:600;color:var(--primary);font-style:normal}
.load-progress-track{width:100%;height:6px;background:#e8e8e8;border-radius:3px;overflow:hidden}
.load-progress-bar{height:100%;background:var(--primary);transition:width .15s ease-out;border-radius:3px;min-width:0}
.load-progress-bar.indeterminate{width:100%!important;background:linear-gradient(90deg,transparent 0%,var(--primary) 50%,transparent 100%);background-size:60% 100%;background-position:-60% 0;animation:load-shimmer 1.4s linear infinite}
@keyframes load-shimmer{0%{background-position:-60% 0}100%{background-position:160% 0}}

/* Success confirmation flash after load */
.coverage-success{color:var(--success);font-weight:500;font-size:12.5px}
.coverage-check{display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--success);color:#fff;text-align:center;line-height:16px;font-size:10px;font-weight:700;margin-right:6px;vertical-align:middle}

/* Footer spacing */
.main{padding-bottom:60px}

/* ===== Overview tab (new narrative main tab) ===== */
/* Asset class picker trigger chip */
.ac-picker-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:13px;cursor:pointer;color:var(--text-primary);min-height:28px;font-family:inherit}
.ac-picker-chip:hover{background:#fafafa;border-color:var(--primary)}
.ac-picker-chip-caret{color:var(--text-secondary);font-size:10px}

/* Filter bar visual grouping */
.filter-divider{width:1px;align-self:stretch;background:var(--border);margin:4px 2px}
.time-range-row{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.preset-buttons{display:inline-flex;gap:3px;margin-left:4px}
.preset-btn{border:1px solid var(--border);background:var(--surface);padding:4px 9px;border-radius:4px;font-size:11px;cursor:pointer;color:var(--text-secondary);font-family:inherit;font-weight:500}
.preset-btn:hover{background:var(--tint);color:var(--primary);border-color:var(--primary)}
.preset-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* Overview section container */
.ov-section{margin-bottom:16px}
.ov-section-title{font-size:15px;font-weight:600;color:var(--primary);margin:0 0 4px}
.ov-section-sowhat{font-size:13px;color:var(--primary);font-style:italic;margin-bottom:10px;line-height:1.4}

/* Section 0 banner */
.ov-banner{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:10px;padding:14px 18px;margin-bottom:16px;display:flex;gap:16px;align-items:flex-start}
.ov-banner-text{flex:1;font-size:14px;line-height:1.55;color:var(--text-primary)}
.ov-banner-text strong{color:var(--primary)}
.ov-banner-copy{border:1px solid var(--border);background:var(--surface);padding:5px 10px;border-radius:6px;font-size:12px;cursor:pointer;color:var(--text-secondary);white-space:nowrap;font-family:inherit}
.ov-banner-copy:hover{background:var(--tint);color:var(--primary);border-color:var(--primary)}
.ov-banner-copy.copied{background:var(--success);color:#fff;border-color:var(--success)}

/* Section 1 KPI tiles row */
.ov-period-header{display:flex;align-items:baseline;gap:12px;margin-bottom:8px;font-size:12px;color:var(--text-secondary);flex-wrap:wrap}
.ov-period-header .ov-focus{font-weight:600;color:var(--primary);font-size:13px}
.ov-period-header .ov-compare{color:var(--text-secondary)}
.ov-period-header .ov-info{font-size:11px;color:var(--text-secondary);cursor:help}
.ov-kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:6px}
.ov-kpi-tile{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.03);display:flex;flex-direction:column;gap:8px}
.ov-kpi-label{font-size:10px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
/* Main row: value/delta on the LEFT, sparkline (max 50% width) on the RIGHT */
.ov-kpi-main{display:flex;align-items:center;gap:14px;flex:1;min-height:54px;justify-content:space-between}
.ov-kpi-value-block{flex:0 0 auto;display:flex;flex-direction:column;gap:4px;min-width:0}
.ov-kpi-value{font-size:28px;font-weight:600;color:var(--primary);font-variant-numeric:tabular-nums;line-height:1.05;white-space:nowrap}
.ov-kpi-delta{font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.ov-kpi-delta.up-bad,.ov-kpi-delta.down-bad{color:var(--warning)}
.ov-kpi-delta.up-good,.ov-kpi-delta.down-good{color:var(--success)}
.ov-kpi-delta.neutral{color:var(--text-secondary)}
.ov-kpi-spark-block{flex:0 0 50%;max-width:50%;display:flex;align-items:center;min-width:0}
.ov-kpi-spark{height:46px;width:100%;display:flex;align-items:center}
.ov-kpi-spark svg{width:100%;height:100%;overflow:visible;display:block}
/* Footer: volume + trend (first → last) on a single line */
.ov-kpi-footer{font-size:11px;color:var(--text-secondary);font-variant-numeric:tabular-nums;border-top:1px solid #f0f0f0;padding-top:6px;margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.ov-kpi-footer .ov-kpi-trend{color:var(--text-secondary)}
.ov-kpi-footer .ov-kpi-trend-period{color:#999;font-style:italic;font-size:10.5px}

/* Shared chart card styling */
.ov-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.03);margin-bottom:16px}
.ov-card-title{font-size:15px;font-weight:600;color:var(--primary);margin:0}
.ov-card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.ov-card-controls{display:flex;gap:8px;align-items:center;font-size:12px;flex-wrap:wrap}
.ov-card-controls select{padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:12px;font-family:inherit}
.ov-chart-context{font-size:11.5px;color:var(--text-secondary);margin-bottom:6px;line-height:1.4}

/* Coming-soon placeholder during incremental build */
.ov-placeholder{padding:28px 18px;background:#fafafa;border:1px dashed var(--border);border-radius:8px;color:var(--text-secondary);font-size:13px;text-align:center;font-style:italic}

/* Section 3 three-panel cascade */
.ov-cascade-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
@media (max-width: 1100px){
  .ov-cascade-row{grid-template-columns:1fr 1fr}
  .ov-cascade-row > :nth-child(1){grid-column:1 / -1}
}
@media (max-width: 720px){
  .ov-cascade-row{grid-template-columns:1fr}
  .ov-cascade-row > :nth-child(1){grid-column:auto}
  .ov-kpi-row{grid-template-columns:repeat(2,1fr)}
}

/* Sparkline colours */
.spark-line{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.spark-area{opacity:.15}
.spark-dot{r:3}
.spark-dot-focus{r:4;stroke:#fff;stroke-width:1}

/* Cascade bar */
.cascade-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;font-variant-numeric:tabular-nums}
.cascade-label{flex:0 0 130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.cascade-bar-track{flex:1;background:#f5f5f5;border-radius:3px;height:18px;display:flex;align-items:center}
.cascade-bar{height:18px;border-radius:3px;overflow:hidden;display:flex;min-width:1px}
.cascade-seg{height:100%}
.cs-reactive{background:#FF6B35}
.cs-proactive{background:#fbcab1}
.cs-preventative{background:#cde9d3}
.cs-other{background:#dcdcdc}
.cascade-value{flex:0 0 auto;min-width:150px;text-align:right;font-size:12px;color:var(--text-primary)}
.cascade-value .cascade-vol{color:var(--text-secondary);font-weight:400}

/* Cascade section-level legend */
.cascade-legend{display:flex;align-items:center;gap:14px;margin-top:10px;padding-top:8px;border-top:1px solid var(--border);font-size:11px;color:var(--text-secondary);flex-wrap:wrap}
.cascade-legend .legend-swatch{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:middle}
.cascade-legend .legend-item{display:inline-flex;align-items:center}

/* Asset class picker modal */
.ov-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:500;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
.ov-modal-panel{background:var(--surface);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.2);width:100%;max-width:860px;max-height:calc(100vh - 80px);display:flex;flex-direction:column;overflow:hidden}
.ov-modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.ov-modal-title{font-size:16px;font-weight:600;color:var(--primary);margin:0}
.ov-modal-close{border:none;background:transparent;font-size:22px;line-height:1;cursor:pointer;color:var(--text-secondary);padding:4px 8px;border-radius:4px}
.ov-modal-close:hover{background:var(--tint);color:var(--primary)}
.ov-picker-toolbar{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ov-picker-search{padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;flex:1;min-width:200px;font-family:inherit}
.ov-picker-search:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(2,78,67,.15)}
.ov-picker-table-wrap{flex:1;overflow:auto;min-height:0}
.ov-picker-table{width:100%;border-collapse:collapse;font-size:12px}
.ov-picker-table th{background:var(--primary);color:#fff;text-align:left;padding:8px 10px;font-weight:600;position:sticky;top:0;cursor:pointer;user-select:none;font-size:11px;text-transform:uppercase;letter-spacing:.3px;z-index:2}
.ov-picker-table th.num{text-align:right}
.ov-picker-table th:hover{background:#013930}
.ov-picker-table th.sort-active::after{content:' ▾';font-size:9px}
.ov-picker-table th.sort-active.sort-asc::after{content:' ▴'}
.ov-picker-table td{padding:6px 10px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
.ov-picker-table td.num{text-align:right}
.ov-picker-table td.partial{color:var(--warning)}
.ov-picker-table tr:hover td{background:#fafafa}
.ov-picker-table tr.disabled td{opacity:.4}
.ov-picker-table input[type=checkbox]{cursor:pointer;margin:0}
.ov-modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px}
.ov-picker-counter{font-size:13px;color:var(--text-secondary)}
.ov-picker-counter strong{color:var(--primary);font-weight:600}
.ov-picker-footnote{font-size:11px;color:var(--text-secondary);padding:6px 20px;background:#fafafa;border-top:1px solid var(--border);font-style:italic}

/* Section 3 cascade panels */
.ov-cascade-panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.03);display:flex;flex-direction:column}
.ov-cascade-title{font-size:13px;font-weight:600;color:var(--primary);margin:0}
.ov-cascade-sub{font-size:11px;color:var(--text-secondary);margin-bottom:10px}
.ov-cascade-body{flex:1}
.ov-cascade-footer{font-size:11px;color:var(--text-secondary);padding-top:8px;margin-top:8px;border-top:1px dashed var(--border)}
.ov-cascade-view-ctrl{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ov-cascade-view-ctrl select{font-size:12px;padding:3px 6px;border:1px solid var(--border);border-radius:4px;background:var(--surface);font-family:inherit}

/* Sections 4+5 side-by-side */
.ov-trends-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width: 1100px){ .ov-trends-row{grid-template-columns:1fr} }
.ov-trends-cell{margin-bottom:0}
.ov-trends-cell .ov-card{margin-bottom:0;height:100%;display:flex;flex-direction:column}

/* Collapsible table */
.ov-table-collapse{margin-top:12px;border-top:1px solid var(--border);padding-top:8px}
.ov-table-collapse > summary{cursor:pointer;font-size:12px;color:var(--primary);font-weight:500;list-style:none;padding:4px 0;user-select:none}
.ov-table-collapse > summary::before{content:'▸ ';font-size:10px;display:inline-block;transition:transform .15s ease}
.ov-table-collapse[open] > summary::before{transform:rotate(90deg)}
.ov-table-collapse > summary::-webkit-details-marker{display:none}
.ov-table-explain{font-size:11.5px;color:var(--text-secondary);background:#fafafa;padding:8px 12px;border-radius:6px;margin:8px 0;line-height:1.5}
.ov-table-explain strong{color:var(--primary)}
.ov-table-explain ul{margin:4px 0 0 0;padding-left:18px}
.ov-table-explain li{margin:2px 0}

/* Interactive legend (clickable to toggle line visibility) */
.legend-item.toggleable{cursor:pointer;padding:2px 6px;border-radius:4px;transition:background .12s}
.legend-item.toggleable:hover{background:var(--tint)}
.legend-item.muted{opacity:.35}

/* Section 2 side-by-side split */
.ov2-split{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:4px}
@media (max-width: 900px){ .ov2-split{grid-template-columns:1fr} }
.ov2-panel{display:flex;flex-direction:column;min-width:0}
.ov2-panel-title{font-size:12px;color:var(--text-secondary);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}

/* Section 6 scatter */
.ov-scatter-card{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media (max-width: 1000px){ .ov-scatter-card{grid-template-columns:1fr} }
.ov-scatter-list{background:var(--tint);border:1px solid var(--border);border-radius:8px;padding:14px 16px;font-size:12px}
.ov-scatter-list h4{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--primary);margin:0 0 10px;font-weight:700}
.ov-scatter-list table{width:100%;border-collapse:collapse}
.ov-scatter-list th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.3px;color:var(--text-secondary);padding:4px 6px;border-bottom:1px solid var(--border);font-weight:600}
.ov-scatter-list td{padding:5px 6px;border-bottom:1px solid #e8e8e8;font-variant-numeric:tabular-nums}
.ov-scatter-list td.num{text-align:right}
.ov-scatter-list .ba-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.ov-scatter-list .subtext{color:var(--text-secondary);font-size:11px}
.ov-scatter-empty{padding:20px;text-align:center;color:var(--text-secondary);font-style:italic}

/* Section 7 movers */
.ov-movers-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
@media (max-width: 900px){ .ov-movers-row{grid-template-columns:1fr} }
.ov-movers-panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.ov-movers-panel h4{font-size:13px;color:var(--primary);margin:0 0 10px;font-weight:600}
.ov-movers-table{width:100%;border-collapse:collapse;font-size:12px}
.ov-movers-table th{text-align:left;background:#fafafa;color:var(--text-secondary);font-weight:600;padding:5px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--border)}
.ov-movers-table th.num{text-align:right}
.ov-movers-table td{padding:6px 8px;border-bottom:1px solid #f0f0f0;font-variant-numeric:tabular-nums}
.ov-movers-table td.num{text-align:right}
.ov-movers-table td.vol{color:var(--text-secondary)}
.ov-movers-table td.delta-bad{color:var(--warning);font-weight:600}
.ov-movers-table td.delta-good{color:var(--success);font-weight:600}
.ov-movers-expand{display:block;margin-top:8px;font-size:12px;color:var(--primary);cursor:pointer;text-decoration:none;border:none;background:transparent;padding:0;font-family:inherit;font-weight:500}
.ov-movers-expand:hover{text-decoration:underline}
.ov-movers-expand-row{display:flex;gap:12px;margin-top:6px}
.ov-movers-collapsed{margin-top:12px;padding-top:10px;border-top:1px dashed var(--border)}
.ov-movers-collapsed-header{font-size:12px;color:var(--primary);cursor:pointer;user-select:none;padding:4px 0;font-weight:500}
.ov-movers-collapsed-header::before{content:'▸ ';font-size:10px;transition:transform .15s ease}
.ov-movers-collapsed.open .ov-movers-collapsed-header::before{content:'▾ '}
.ov-movers-collapsed-body{display:none;margin-top:8px}
.ov-movers-collapsed.open .ov-movers-collapsed-body{display:block}

/* Section 4/5 tables */
.ov-trend-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px}
.ov-trend-table th{background:var(--primary);color:#fff;text-align:left;padding:7px 10px;font-weight:600;cursor:pointer;user-select:none}
.ov-trend-table th:hover{background:#013930}
.ov-trend-table th.sort-active::after{content:' ▾';font-size:10px}
.ov-trend-table th.sort-active.sort-asc::after{content:' ▴'}
.ov-trend-table td{padding:6px 10px;border-bottom:1px solid var(--border)}
.ov-trend-table tr.top-n td:first-child{border-left:3px solid currentColor}
.ov-trend-table td.vol{color:var(--text-secondary)}
.ov-trend-table td.num{text-align:right;font-variant-numeric:tabular-nums}
.ov-trend-table td.gap-bad{color:var(--warning);font-weight:600}
.ov-trend-table td.gap-good{color:var(--success);font-weight:600}
.ov-swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* ===== Deep-dive tab (narrative redesign) ===== */
/* Section 1 — context + headline */
.dd-title-row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.dd-title-label{font-size:12px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.dd-chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:17px;font-weight:600;cursor:pointer;color:var(--primary);font-family:inherit;min-height:38px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.dd-chip:hover{background:#fafafa;border-color:var(--primary)}
.dd-chip-caret{color:var(--text-secondary);font-size:12px;font-weight:400}
.dd-title-sub{font-size:12px;color:var(--text-secondary);flex:1}
.dd-title-sub strong{color:var(--primary);font-weight:600}

.dd-filter-bar{background:#fafafa;border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.dd-filter-bar-label{font-size:11px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.4px;font-weight:600;margin-right:4px}
.dd-filter-bar .filter-group{gap:4px}
.dd-filter-bar .filter-group > label{font-size:11px;color:var(--text-secondary);margin-right:4px}
.dd-filter-bar select{padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:12px;font-family:inherit;min-width:110px}

.dd-pills{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media (max-width: 900px){ .dd-pills{grid-template-columns:repeat(2,1fr)} }
.dd-pill{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.dd-pill-label{font-size:10px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.dd-pill-main{display:flex;align-items:baseline;gap:8px}
.dd-pill-delta{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.dd-pill-delta.up-bad,.dd-pill-delta.down-bad{color:var(--warning)}
.dd-pill-delta.up-good,.dd-pill-delta.down-good{color:var(--success)}
.dd-pill-delta.neutral{color:var(--text-secondary)}
.dd-pill-abs{font-size:11.5px;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.dd-pill-context{font-size:10.5px;color:var(--text-secondary);font-variant-numeric:tabular-nums}

/* Section 2 KPIs reuses .ov-kpi-* styles */

/* Sections 3, 4, 5 — two-card split */
.dd-split{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media (max-width: 1100px){ .dd-split{grid-template-columns:1fr} }
.dd-split .ov-card{margin-bottom:0;height:100%;display:flex;flex-direction:column}

/* Section 4 — stacked panels (lines over muted volume bars) */
.dd-stacked-wrap{display:flex;flex-direction:column;gap:0}
.dd-stacked-top{flex:0 0 auto}
.dd-stacked-bot{flex:0 0 auto;margin-top:-4px}
.dd-stacked-bot-label{font-size:10px;color:var(--text-secondary);margin:4px 0 0 60px;font-style:italic}

/* Section 5 — category breakdown card (donut + trend inline) */
.dd-cat-body{display:grid;grid-template-columns:160px 1fr;gap:16px;align-items:start}
@media (max-width: 640px){ .dd-cat-body{grid-template-columns:1fr} }
.dd-donut-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.dd-donut-total{font-size:11px;color:var(--text-secondary);font-variant-numeric:tabular-nums;text-align:center;line-height:1.3}
.dd-donut-total strong{display:block;font-size:15px;color:var(--primary);font-weight:600}
.dd-donut-legend{font-size:11px;width:100%;margin-top:4px}
.dd-donut-legend .li{display:flex;justify-content:space-between;gap:6px;padding:2px 0;font-variant-numeric:tabular-nums}
.dd-donut-legend .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* Section 6 — Pareto + scatter */
.dd-geo{display:grid;grid-template-columns:3fr 2fr;gap:16px;margin-bottom:16px}
@media (max-width: 1100px){ .dd-geo{grid-template-columns:1fr} }
.dd-pareto-table{width:100%;font-size:11.5px;font-variant-numeric:tabular-nums}
.dd-pareto-row{display:grid;grid-template-columns:160px 1fr 130px;gap:8px;align-items:center;padding:3px 0;font-size:11.5px}
.dd-pareto-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-primary)}
.dd-pareto-bar-track{position:relative;height:18px;background:#f5f5f5;border-radius:3px;display:flex;align-items:center;overflow:hidden}
.dd-pareto-bar-total{background:#e4e4e4;height:100%}
.dd-pareto-bar-reactive{background:var(--danger,#d32f2f);height:100%;position:absolute;left:0;top:0}
.dd-pareto-value{text-align:right;color:var(--text-secondary);font-size:11.5px}
.dd-pareto-value .reactive-v{color:var(--danger,#d32f2f);font-weight:600}

/* Section 7 movers — reuses .ov-movers-* styles */
.dd-movers-controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:12px;color:var(--text-secondary)}
.dd-movers-controls .seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.dd-movers-controls .seg button{border:none;background:var(--surface);padding:4px 10px;font-size:11.5px;cursor:pointer;color:var(--text-secondary);font-family:inherit;border-right:1px solid var(--border)}
.dd-movers-controls .seg button:last-child{border-right:none}
.dd-movers-controls .seg button.active{background:var(--primary);color:#fff}
.dd-movers-controls .seg button:hover:not(.active){background:var(--tint);color:var(--primary)}

/* Deep-dive empty state */
.dd-empty{padding:28px 18px;background:#fafafa;border:1px dashed var(--border);border-radius:8px;color:var(--text-secondary);font-size:13px;text-align:center;font-style:italic}

/* ===== Forward-look tab ===== */
.fl-scope-strip{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px;padding:10px 14px;background:#fafafa;border:1px solid var(--border);border-radius:8px}
.fl-scope-strip-label{font-size:11px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.fl-scope-strip select{padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:12.5px;font-family:inherit;min-width:140px}
.fl-section-sub{font-size:11.5px;color:var(--text-secondary);margin-bottom:8px;line-height:1.4;font-style:italic}

/* History block: table on left, charts on right */
.fl-hist-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:16px}
@media (max-width: 1180px){ .fl-hist-grid{grid-template-columns:1fr} }
.fl-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.03);min-width:0}
.fl-card-title{font-size:14px;font-weight:600;color:var(--primary);margin:0 0 4px}

/* History table — multi-level header, scrollable horizontally if narrow */
.fl-hist-table-wrap{overflow-x:auto;max-height:560px;overflow-y:auto;border:1px solid var(--border);border-radius:6px}
.fl-hist-table{width:100%;border-collapse:collapse;font-size:11px;font-variant-numeric:tabular-nums}
.fl-hist-table thead th{background:var(--primary);color:#fff;font-weight:600;padding:6px 6px;text-align:right;font-size:10px;text-transform:uppercase;letter-spacing:.3px;position:sticky;top:0;z-index:2;white-space:nowrap}
.fl-hist-table thead tr.fl-grouprow th{background:#013930;font-size:9.5px;letter-spacing:.4px;border-right:1px solid #024E43}
.fl-hist-table thead tr.fl-grouprow th.fl-blank{background:var(--primary)}
.fl-hist-table th.fl-month{text-align:left}
.fl-hist-table td{padding:4px 6px;border-bottom:1px solid #f0f0f0;text-align:right;white-space:nowrap}
.fl-hist-table td.fl-month{text-align:left;font-weight:500;color:var(--primary);background:#fafafa;position:sticky;left:0;z-index:1}
.fl-hist-table td.fl-grpdiv{border-left:1px solid var(--border)}
.fl-hist-table th.fl-grpdiv{border-left:1px solid #024E43}
.fl-hist-table tr:hover td:not(.fl-month){background:#fafafa}
.fl-hist-table td.pm-good{color:var(--success);font-weight:600}
.fl-hist-table td.pm-warn{color:var(--warning);font-weight:600}
.fl-hist-table td.pm-bad{color:var(--danger);font-weight:600}

/* Right column charts stack */
.fl-chart-stack{display:flex;flex-direction:column;gap:12px}
.fl-mini-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.fl-mini-title{font-size:11px;color:var(--text-secondary);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}

/* PM compliance KPI strip */
.fl-pm-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
@media (max-width: 720px){ .fl-pm-strip{grid-template-columns:1fr} }
.fl-pm-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.fl-pm-card .lbl{font-size:10px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.fl-pm-card .val{font-size:24px;font-weight:600;color:var(--primary);font-variant-numeric:tabular-nums;margin-top:2px}
.fl-pm-card .sub{font-size:11px;color:var(--text-secondary);margin-top:2px}
.fl-pm-card.delta-up{border-left:3px solid var(--success)}
.fl-pm-card.delta-down{border-left:3px solid var(--danger)}
.fl-pm-card.delta-flat{border-left:3px solid var(--neutral,#94a3b8)}

/* Scenario model area */
.fl-model-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.fl-model-title{font-size:15px;font-weight:600;color:var(--primary);margin:0 0 8px}

/* Mode toggle (compliance-driven vs manual) */
.fl-mode-toggle{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:14px}
.fl-mode-toggle button{border:none;background:var(--surface);padding:6px 14px;font-size:12px;cursor:pointer;color:var(--text-secondary);font-family:inherit;border-right:1px solid var(--border)}
.fl-mode-toggle button:last-child{border-right:none}
.fl-mode-toggle button.active{background:var(--primary);color:#fff}
.fl-mode-toggle button:hover:not(.active){background:var(--tint);color:var(--primary)}

/* Scenario panels grid */
.fl-panels-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
@media (max-width: 1024px){ .fl-panels-row{grid-template-columns:1fr} }
.fl-sub-panel{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:#fafafa}
.fl-sub-panel-title{font-size:11px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.4px;margin:0 0 8px}
.fl-sub-panel label{display:block;font-size:11px;color:var(--text-secondary);margin-bottom:8px}
.fl-sub-panel label > span.lbl-text{display:block;margin-bottom:3px}
.fl-sub-panel input[type=number],.fl-sub-panel input[type=range],.fl-sub-panel select{font-family:inherit;font-size:12px;padding:3px 6px;border:1px solid var(--border);border-radius:4px;background:var(--surface);width:100%;box-sizing:border-box}
.fl-sub-panel input[type=range]{padding:0}

.fl-sens-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.fl-sens-row > span.lbl-text{flex:0 0 auto;font-size:11px;color:var(--text-secondary)}
.fl-sens-pills{display:inline-flex;border:1px solid var(--border);border-radius:5px;overflow:hidden;flex:0 0 auto}
.fl-sens-pills button{border:none;background:var(--surface);padding:3px 8px;font-size:11px;cursor:pointer;color:var(--text-secondary);font-family:inherit;border-right:1px solid var(--border)}
.fl-sens-pills button:last-child{border-right:none}
.fl-sens-pills button.active{background:var(--primary);color:#fff}
.fl-sens-pills button:hover:not(.active){background:var(--tint);color:var(--primary)}

.fl-fitted-hint{display:inline-block;font-size:10px;color:#999;font-style:italic;margin-left:6px}

/* Per-metric fit + multiplier UI (replaces the old sensitivity pills) */
.fl-metric-row{padding:8px 4px;border-bottom:1px dashed var(--border)}
.fl-metric-row:last-child{border-bottom:none}
.fl-metric-label{font-size:11.5px;font-weight:600;color:var(--text-primary);margin-bottom:3px}
.fl-metric-fit{font-size:10.5px;color:var(--text-secondary);margin-bottom:2px;font-variant-numeric:tabular-nums}
.fl-metric-fit strong{color:var(--primary);font-weight:600}
.fl-metric-effective{font-size:10.5px;color:#444;margin-bottom:2px;font-variant-numeric:tabular-nums}
.fl-metric-effective strong{color:#024E43;font-weight:600}
.fl-metric-fit-note{font-size:10px;color:#999;font-style:italic;margin-bottom:4px}
.fl-fit-q{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600;margin-left:4px;text-transform:uppercase;letter-spacing:.3px}
.fl-fit-q-good{background:#dff5e8;color:#00714F}
.fl-fit-q-moderate{background:#e8f0f5;color:#1565c0}
.fl-fit-q-weak{background:#fff3c4;color:#8B6B00}
.fl-fit-q-very-weak{background:#fde2dc;color:#8B0000}
.fl-fit-warn{font-size:10.5px;color:#8B0000;background:#fff8e1;border-left:3px solid var(--warning);padding:5px 8px;border-radius:3px;margin:4px 0}

.fl-mult-row{display:flex;gap:8px;align-items:center;margin-top:4px}
.fl-mult-row input[type=range]{flex:1;min-width:0;padding:0}
.fl-mult-row input[type=number]{font-family:inherit;font-size:11.5px;padding:3px 6px;border:1px solid var(--border);border-radius:4px;background:var(--surface)}
.fl-mult-unit{font-size:10.5px;color:var(--text-secondary);font-style:italic}

/* Model parameters strip — historical window + drift toggle */
.fl-model-params{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px;padding:8px 12px;background:#fafafa;border:1px dashed var(--border);border-radius:6px;font-size:11.5px;color:var(--text-secondary)}
.fl-model-params-label{font-weight:600;color:var(--primary);text-transform:uppercase;font-size:10px;letter-spacing:.3px}
.fl-model-params label{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-secondary)}
.fl-model-params select{font-family:inherit;font-size:11.5px;padding:3px 6px;border:1px solid var(--border);border-radius:4px;background:var(--surface)}
.fl-model-params .lbl-text{display:inline}
.fl-toggle-inline{cursor:pointer}
.fl-toggle-inline input{margin-right:4px}
.fl-auto-drift-badge{display:inline-block;font-size:10.5px;color:#5d4500;background:#fff4d6;border:1px solid #f0c850;border-radius:3px;padding:3px 8px;margin-left:8px;cursor:help}

.fl-advanced{margin-top:6px}
.fl-advanced summary{font-size:11px;color:var(--primary);cursor:pointer;list-style:none;padding:3px 0;font-weight:500}
.fl-advanced summary::before{content:'▸ ';font-size:10px;display:inline-block;transition:transform .15s ease}
.fl-advanced[open] summary::before{transform:rotate(90deg)}
.fl-advanced summary::-webkit-details-marker{display:none}
.fl-adv-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}

/* Output panel */
.fl-output-controls{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary)}
.fl-grain-toggle{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.fl-grain-toggle button{border:none;background:var(--surface);padding:4px 10px;font-size:11px;cursor:pointer;color:var(--text-secondary);font-family:inherit;border-right:1px solid var(--border)}
.fl-grain-toggle button:last-child{border-right:none}
.fl-grain-toggle button.active{background:var(--primary);color:#fff}
.fl-grain-toggle button:hover:not(.active){background:var(--tint);color:var(--primary)}

/* Three-chart projection grid */
.fl-out-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:10px}
@media (max-width: 1180px){ .fl-out-grid{grid-template-columns:1fr} }
.fl-out-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;min-width:0}
.fl-out-card-title{font-size:12.5px;font-weight:700;color:var(--primary);margin:0 0 4px;letter-spacing:.2px}
.fl-out-card-sub{font-size:10.5px;color:var(--text-secondary);margin-bottom:6px;font-style:italic;min-height:30px;line-height:1.4}
.fl-out-chart{margin:0}
.fl-out-delta-row{margin-top:6px;border-top:1px dashed var(--border);padding-top:6px}
.fl-out-delta-label{font-size:9.5px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.3px;font-weight:600;margin-bottom:3px}
.fl-out-delta-row svg{display:block;width:100%;height:24px}

/* Baseline selector */
.fl-baseline-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--text-secondary);margin-top:6px}
.fl-baseline-row select,.fl-baseline-row input{font-family:inherit;font-size:11.5px;padding:3px 6px;border:1px solid var(--border);border-radius:4px;background:var(--surface)}

/* Per-FY toggle + cards */
.fl-fy-toggle{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-top:14px;flex-wrap:wrap}
.fl-fy-toggle button{border:none;background:var(--surface);padding:5px 12px;font-size:12px;cursor:pointer;color:var(--text-secondary);font-family:inherit;border-right:1px solid var(--border)}
.fl-fy-toggle button:last-child{border-right:none}
.fl-fy-toggle button.active{background:var(--primary);color:#fff}
.fl-fy-toggle button:hover:not(.active){background:var(--tint);color:var(--primary)}

.fl-fy-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
@media (max-width: 720px){ .fl-fy-cards{grid-template-columns:1fr} }
.fl-fy-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;border-left:3px solid var(--primary);box-shadow:0 1px 2px rgba(0,0,0,.03)}
.fl-fy-card.savings-pos{border-left-color:var(--success)}
.fl-fy-card.savings-neg{border-left-color:var(--danger)}
.fl-fy-card .lbl{font-size:10px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.fl-fy-card .val{font-size:22px;font-weight:600;color:var(--primary);font-variant-numeric:tabular-nums;margin-top:2px}
.fl-fy-card .delta{font-size:13px;font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums}
.fl-fy-card .delta.up-good,.fl-fy-card .delta.down-good{color:var(--success)}
.fl-fy-card .delta.up-bad,.fl-fy-card .delta.down-bad{color:var(--danger)}
.fl-fy-card .sub{font-size:11px;color:var(--text-secondary);margin-top:4px;line-height:1.35}

/* Help button + popup */
.fl-help-btn{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--tint);color:var(--primary);border:1px solid var(--primary);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;padding:0;margin-left:6px;vertical-align:middle}
.fl-help-btn:hover{background:var(--primary);color:#fff}

.fl-help-modal{max-width:780px}
.fl-help-section{margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid #eef0f2}
.fl-help-section:last-child{border-bottom:none}
.fl-help-section h4{font-size:14px;color:var(--primary);margin:0 0 8px;font-weight:600;display:flex;align-items:center;gap:8px}
.fl-help-section h4 .fl-help-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;font-size:11px;font-weight:700}
.fl-help-section p{font-size:12.5px;color:var(--text-primary);line-height:1.55;margin:0 0 8px}
.fl-help-diagram{margin:10px 0;padding:8px;background:#fafbfc;border-radius:4px;border:1px solid #eef0f2;text-align:center}
.fl-help-keyline{font-size:12px;color:var(--primary);background:#e8f3f0;padding:7px 10px;border-radius:4px;border-left:3px solid var(--primary);margin:8px 0;line-height:1.5}
.fl-help-intro{font-size:13px;color:var(--text-primary);line-height:1.6;background:#fbfaf5;padding:12px 14px;border-radius:6px;border:1px solid #f0eadd;margin-bottom:18px}
.fl-help-intro strong{color:var(--primary)}

/* "How this works" sticky side tab — sits on right edge of viewport when on the
   Forward look tab. Vertical text, branded primary colour, slides on hover. */
.fl-howto-tab{position:fixed;right:0;top:48%;transform:translateY(-50%);background:var(--primary);color:#fff;writing-mode:vertical-rl;text-orientation:mixed;padding:18px 10px;font-size:13px;font-weight:600;cursor:pointer;border:none;border-radius:8px 0 0 8px;box-shadow:-3px 3px 10px rgba(2,78,67,0.25);z-index:60;letter-spacing:0.6px;transition:transform 0.18s ease,background 0.18s ease,box-shadow 0.18s ease;font-family:inherit}
.fl-howto-tab::before{content:'?';display:block;writing-mode:horizontal-tb;font-size:14px;font-weight:700;background:#fff;color:var(--primary);width:20px;height:20px;border-radius:50%;line-height:20px;text-align:center;margin:0 auto 8px}
.fl-howto-tab:hover{background:#013832;transform:translateY(-50%) translateX(-4px);box-shadow:-5px 4px 14px rgba(2,78,67,0.35)}
.fl-howto-tab:focus{outline:2px solid var(--success);outline-offset:2px}
.fl-help-diagram{margin:8px 0;background:#fafafa;border:1px solid var(--border);border-radius:6px;padding:10px;text-align:center}
.fl-help-diagram svg{display:block;margin:0 auto;max-width:100%}

/* Collapsible row-by-row table inside output */
.fl-out-fulltable{margin-top:14px;border-top:1px solid var(--border);padding-top:8px}
.fl-out-fulltable > summary{cursor:pointer;font-size:12px;color:var(--primary);font-weight:500;list-style:none;padding:4px 0;user-select:none}
.fl-out-fulltable > summary::before{content:'▸ ';font-size:10px;display:inline-block;transition:transform .15s ease}
.fl-out-fulltable[open] > summary::before{transform:rotate(90deg)}
.fl-out-fulltable > summary::-webkit-details-marker{display:none}

.fl-summary-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
@media (max-width: 720px){ .fl-summary-strip{grid-template-columns:1fr} }
.fl-summary-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.03);border-left:3px solid var(--primary)}
.fl-summary-card.savings-pos{border-left-color:var(--success)}
.fl-summary-card.savings-neg{border-left-color:var(--danger)}
.fl-summary-card .lbl{font-size:10px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.fl-summary-card .val{font-size:22px;font-weight:600;color:var(--primary);font-variant-numeric:tabular-nums;margin-top:2px}
.fl-summary-card .sub{font-size:11px;color:var(--text-secondary);margin-top:2px}

/* Projection rows in extended table */
.fl-hist-table tr.fl-proj td{background:#fff8e1}
.fl-hist-table tr.fl-proj td.fl-month{background:#fff3c4;font-style:italic;color:#8B6B00}

@media (max-width: 1024px){
  .row{grid-template-columns:1fr}
}



/* ===== Change 2: multi-class scenario model ===== */
.fl-topsel-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:16px}
.fl-topsel-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.fl-topsel-label{font-weight:600;font-size:14px;color:var(--text-primary)}
.fl-topsel-count{font-size:12px;color:var(--text-secondary)}

/* Asset-class multi-select checkbox list */
.fl-msel-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:6px;max-height:320px;overflow-y:auto;padding:2px}
.fl-msel-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;background:var(--surface);transition:background .12s,border-color .12s}
.fl-msel-item:hover{border-color:var(--primary);background:var(--tint)}
.fl-msel-item.fl-msel-on{border-color:var(--primary);background:var(--tint)}
.fl-msel-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary);flex-shrink:0;cursor:pointer}
.fl-msel-name{flex:1;font-size:13px;font-weight:600;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl-msel-spend{font-size:12px;color:var(--text-secondary);font-variant-numeric:tabular-nums;flex-shrink:0}
.fl-msel-empty{font-size:13px;color:var(--warning);font-weight:600;padding:10px 2px}
.fl-seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.fl-seg button{border:none;background:var(--surface);padding:7px 14px;font-size:13px;cursor:pointer;color:var(--text-secondary);font-family:inherit;border-right:1px solid var(--border);font-weight:600}
.fl-seg button:last-child{border-right:none}
.fl-seg button.active{background:var(--primary);color:#fff}
.fl-seg button:disabled{opacity:.4;cursor:not-allowed}

/* Assumptions table */
.fl-as-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:16px}

/* Overall (overarching) assumptions row */
.fl-ov-card{background:var(--tint);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.fl-ov-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.fl-ov-title{font-size:14px;font-weight:700;color:var(--primary)}
.fl-ov-sub{font-size:12px;color:var(--text-secondary);line-height:1.5;margin-bottom:10px}
.fl-ov-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:820px){.fl-ov-grid{grid-template-columns:repeat(2,1fr)}}
.fl-ov-cell{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.fl-ov-label{font-size:11.5px;font-weight:600;color:var(--text-secondary);margin-bottom:6px}
.fl-ov-input{width:82px}
.fl-as-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.fl-as-toolbar{display:flex;gap:8px;flex-wrap:wrap}
.fl-btn-sec{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;color:var(--primary);font-family:inherit}
.fl-btn-sec:hover{background:var(--tint);border-color:var(--primary)}
.fl-as-table-wrap{overflow-x:auto}
.fl-as-table{width:100%;border-collapse:collapse;font-size:13px}
.fl-as-table th{background:var(--tint);color:var(--primary);text-align:center;padding:8px 10px;font-weight:600;font-size:12px;border-bottom:2px solid var(--border);white-space:nowrap}
.fl-as-table th.fl-as-rowhead-th{text-align:left;min-width:180px}
.fl-as-th-sub{font-size:10px;font-weight:500;color:var(--text-secondary);opacity:.8}
.fl-as-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.fl-as-rowhead{display:flex;align-items:center;gap:10px}
.fl-as-rank{width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fl-as-name{font-weight:600;font-size:13px}
.fl-as-activerow td{background:var(--tint)}
.fl-as-cell{text-align:center}
.fl-as-input-wrap{display:inline-flex;align-items:center;gap:4px}
.fl-as-input{width:74px;padding:5px 6px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:13px;text-align:right}
.fl-as-input:focus{outline:none;border-color:var(--primary)}
.fl-as-edited .fl-as-input{border-color:var(--warning);background:#fff8f4;font-weight:600}
.fl-as-unit{font-size:11px;color:var(--text-secondary)}
.fl-as-fit{font-size:10.5px;color:var(--text-secondary);margin-top:3px;white-space:nowrap}
.fl-as-actions{text-align:center;white-space:nowrap}
.fl-as-view{background:var(--primary);color:#fff;border:none;border-radius:6px;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;margin-right:4px}
.fl-as-view:hover{background:#013930}
.fl-as-reset{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:12px;cursor:pointer;color:var(--text-secondary)}
.fl-as-reset:hover{border-color:var(--primary);color:var(--primary)}
.fl-fit-q{display:inline-block;padding:1px 6px;border-radius:8px;font-size:9.5px;font-weight:600;margin-left:3px}
.fl-fit-q-strong{background:#e6f6ef;color:#0a7d54}
.fl-fit-q-moderate{background:#eaf3fb;color:#1565c0}
.fl-fit-q-weak{background:#fff4e0;color:#8a6d00}
.fl-fit-q-very-weak{background:#fdecea;color:#c0392b}

.fl-global-badge{font-size:10.5px;font-weight:600;background:var(--tint);color:var(--primary);padding:2px 8px;border-radius:8px;margin-left:8px;vertical-align:middle}

/* Output stepper */
.fl-stepper-card{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--primary);color:#fff;border-radius:10px;padding:12px 18px;margin-bottom:16px}
.fl-stepper-nav{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:7px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.fl-stepper-nav:hover:not(:disabled){background:rgba(255,255,255,.28)}
.fl-stepper-nav:disabled{opacity:.35;cursor:not-allowed}
.fl-stepper-center{text-align:center}
.fl-stepper-eyebrow{font-size:11px;opacity:.85;text-transform:uppercase;letter-spacing:.5px}
.fl-stepper-title{font-size:18px;font-weight:700;margin-top:2px}

/* Toast */
#flToastHost{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center}
.fl-toast{background:var(--primary);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.2);opacity:0;transform:translateY(10px);transition:opacity .3s,transform .3s;max-width:520px;text-align:center}
.fl-toast-show{opacity:1;transform:translateY(0)}
.fl-toast-err{background:var(--danger)}


/* ===== Forecast result tab (section4) ===== */
.fr-wrap{max-width:1400px;margin:0 auto}
.fr-intro{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:16px}

/* Per-class manual % reduction panel */
.fr-red-card{background:var(--tint);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:16px}
.fr-red-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.fr-red-title{font-size:14px;font-weight:700;color:var(--primary)}
.fr-red-sub{font-size:12px;color:var(--text-secondary);line-height:1.5;margin-bottom:12px}
.fr-red-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.fr-red-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px}
.fr-red-name{font-size:13px;font-weight:600;color:var(--text-primary);flex:1;min-width:0;line-height:1.35}
.fr-red-input-wrap{display:flex;align-items:center;gap:5px;flex-shrink:0}
.fr-red-input{width:60px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:13px;text-align:right}
.fr-red-input:focus{outline:none;border-color:var(--primary)}
.fr-red-unit{font-size:12px;color:var(--text-secondary)}
.fr-intro h2{font-size:16px;margin-bottom:6px}
.fr-intro p{margin:0;color:var(--text-secondary);font-size:13px;line-height:1.55}

.fr-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.fr-kpis-2{grid-template-columns:repeat(2,1fr)}
@media (max-width:900px){.fr-kpis{grid-template-columns:1fr}}
.fr-kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px 20px;border-left:4px solid var(--neutral)}
.fr-kpi.savings-pos{border-left-color:var(--success)}
.fr-kpi.savings-neg{border-left-color:var(--warning)}
.fr-kpi-label{font-size:12px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.fr-kpi-value{font-size:30px;font-weight:700;color:var(--primary);font-variant-numeric:tabular-nums;line-height:1.05}
.fr-kpi.savings-pos .fr-kpi-value{color:var(--success)}
.fr-kpi.savings-neg .fr-kpi-value{color:var(--warning)}
.fr-kpi-sub{font-size:11.5px;color:var(--text-secondary);margin-top:8px;line-height:1.4}

.fr-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.fr-card-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.fr-card-head h3{font-size:14px}
.fr-table-wrap{overflow-x:auto}
.fr-table{width:100%;border-collapse:collapse;font-size:13px}
.fr-table th{background:var(--primary);color:#fff;text-align:right;padding:9px 12px;font-weight:600;font-size:12px;white-space:nowrap}
.fr-table th.fr-rowhead-th{text-align:left;min-width:200px}
.fr-table th.fr-total-th{background:#013930}
.fr-table td{padding:8px 12px;border-bottom:1px solid var(--border)}
.fr-table td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.fr-rowhead{display:flex;align-items:center;gap:10px;font-weight:600}
.fr-rank{width:22px;height:22px;border-radius:50%;background:var(--tint);color:var(--primary);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.fr-table tbody tr:hover td{background:#fafafa}
.fr-total-cell{font-weight:700;background:#f4f9f7}
.fr-good{color:var(--success);font-weight:600}
.fr-bad{color:var(--warning);font-weight:600}
.fr-grand td{border-top:2px solid var(--primary);background:var(--tint);font-weight:700}
.fr-grand td.fr-total-cell{background:#dcefe8}
.fr-grand .fr-rowhead{font-weight:700}
.fr-partial{color:var(--warning);font-weight:700;cursor:help}
.fr-foot{font-size:11px;color:var(--text-secondary);margin-top:10px;line-height:1.5}

/* work-type blocks (corrective / reactive / proactive) */
.fr-block{margin-bottom:26px;padding-bottom:8px;border-bottom:1px dashed var(--border)}
.fr-block:last-of-type{border-bottom:none}
.fr-block-head{margin-bottom:12px}
.fr-block-title{font-size:17px;color:var(--primary);margin-bottom:2px;border-left:4px solid var(--primary);padding-left:10px}
.fr-block-blurb{font-size:12px;color:var(--text-secondary);padding-left:14px}
.fr-card-head h4{font-size:13px}


/* ===== Readme tab (section0) ===== */
.rm-wrap{max-width:1000px;margin:0 auto;padding:4px 0 40px}
.rm-hero{background:linear-gradient(135deg,var(--primary),#013930);color:#fff;border-radius:12px;padding:26px 30px;margin-bottom:18px}
.rm-hero h1{color:#fff;font-size:24px;margin:0 0 8px;font-weight:700}
.rm-hero p{margin:0;font-size:14px;line-height:1.6;opacity:.94;max-width:820px}

.rm-start{background:var(--tint);border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin-bottom:18px}
.rm-start-title{font-size:14px;font-weight:700;color:var(--primary);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.rm-steps{margin:0;padding-left:22px;font-size:13.5px;line-height:1.7;color:var(--text-primary)}
.rm-steps li{margin-bottom:4px}

.rm-concepts{margin-bottom:22px}
.rm-concepts-title{font-size:15px;font-weight:700;color:var(--primary);margin-bottom:10px}
.rm-concept-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:760px){.rm-concept-grid{grid-template-columns:1fr}}
.rm-concept{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.rm-concept-h{font-size:13px;font-weight:700;color:var(--primary);margin-bottom:5px}
.rm-concept p{margin:0;font-size:12.5px;line-height:1.55;color:var(--text-secondary)}
.rm-concept strong{color:var(--text-primary)}

.rm-tabs-title{font-size:17px;font-weight:700;color:var(--primary);margin:6px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--border)}

.rm-tab-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin-bottom:14px;border-left:4px solid var(--primary)}
.rm-tab-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.rm-tab-badge{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.rm-tab-head h2{font-size:18px;color:var(--primary);margin:0}
.rm-tab-purpose{font-size:13px;font-style:italic;color:var(--text-secondary);margin-bottom:8px;padding-left:40px}
.rm-tab-card > p{font-size:13.5px;line-height:1.6;color:var(--text-primary);margin:0 0 8px}
.rm-tab-points{margin:0;padding-left:20px;font-size:13px;line-height:1.65;color:var(--text-primary)}
.rm-tab-points li{margin-bottom:4px}
.rm-tab-points strong{color:var(--primary)}
.rm-tab-note{background:#fafafa;border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-top:10px;font-size:12.5px;line-height:1.55;color:var(--text-secondary)}

.rm-foot{background:var(--tint);border-radius:10px;padding:16px 20px;margin-top:18px;font-size:13px;line-height:1.6;color:var(--text-secondary)}
.rm-foot strong{color:var(--primary)}


/* ===== Asset Specific Insights tab (section5) ===== */
.ai-wrap{max-width:1400px;margin:0 auto}
.ai-stepper{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--primary);color:#fff;border-radius:10px;padding:12px 18px;margin-bottom:18px}

.ai-stepper-eyebrow{font-size:11px;opacity:.85;text-transform:uppercase;letter-spacing:.5px}
.ai-stepper-title{font-size:19px;font-weight:700;margin-top:2px}
.ai-target-card{border-left:4px solid var(--primary)}
.ai-section{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.ai-section-title{font-size:15px;color:var(--primary);margin-bottom:2px}
.ai-section-sub{font-size:12px;color:var(--text-secondary);line-height:1.5;margin-bottom:14px}
.ai-chart-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.ai-chart-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (max-width:1000px){.ai-chart-grid-3{grid-template-columns:1fr}.ai-chart-grid-2{grid-template-columns:1fr}}
.ai-chart-card{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--surface)}
.ai-chart-h{font-size:12.5px;font-weight:600;color:var(--text-primary);margin-bottom:6px}
.ai-export-row{display:flex;justify-content:flex-end;margin-bottom:14px}

/* PDF export (print) — one asset class per page */
#aiPrintRoot{position:absolute;left:-100000px;top:0;width:1040px;background:#fff}
.ai-print-page{width:1040px;padding:8px 4px 20px;box-sizing:border-box}
.ai-print-head{border-bottom:2px solid var(--primary);margin-bottom:12px;padding-bottom:6px}
.ai-print-title{font-size:20px;font-weight:700;color:var(--primary)}
.ai-print-meta{font-size:11px;color:var(--text-secondary);margin-top:2px}
@media print {
  body.ai-printing > *:not(#aiPrintRoot){ display:none !important; }
  body.ai-printing #aiPrintRoot{ position:static !important; left:auto !important; width:auto !important; }

  body.ai-printing .ai-print-page:last-child{ page-break-after:auto; break-after:auto; }

  body.ai-printing .ai-section{ border:none; padding:0; margin:0 0 4px; }
  body.ai-printing .ai-section-title{ font-size:12px; margin-bottom:1px; }

  body.ai-printing .ai-chart-grid-3, body.ai-printing .ai-chart-grid-2{ gap:6px; margin-bottom:6px; }
