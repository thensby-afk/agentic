// ---- KPI tile builders (compact layout) ----
// Shared tile renderer. Layout: label on top, value+delta LEFT, sparkline (50%) RIGHT,
// footer line: WO volume · first → last value (FY25 Q2 → FY26 Q3)
function ovRenderTile(label, valueStr, deltaHtml, deltaCls, spark, axisFmt, spanLabel, volume){
  const hasTrend = spark.first !== undefined && spark.last !== undefined && spark.first !== null && spark.last !== null;
  let trendHtml = '';
  if(hasTrend){
    const valTxt = `${escapeHtml(axisFmt(spark.first))} → ${escapeHtml(axisFmt(spark.last))}`;
    const periodTxt = (spark.firstPeriod && spark.lastPeriod && spark.firstPeriod !== spark.lastPeriod)
      ? ` <span class="ov-kpi-trend-period">(${escapeHtml(spark.firstPeriod)} → ${escapeHtml(spark.lastPeriod)})</span>`
      : '';
    trendHtml = `<span class="ov-kpi-trend">${valTxt}${periodTxt}</span>`;
  }
  const sep = (volume && hasTrend) ? '<span class="ov-kpi-trend">·</span>' : '';
  return `
    <div class="ov-kpi-tile">
      <div class="ov-kpi-label">${label}</div>
      <div class="ov-kpi-main">
        <div class="ov-kpi-value-block">
          <div class="ov-kpi-value">${valueStr}</div>
          <div class="ov-kpi-delta ${deltaCls}">${deltaHtml}</div>
        </div>
        <div class="ov-kpi-spark-block">
          <div class="ov-kpi-spark">${spark.svg}</div>
        </div>
      </div>
      ${(volume || hasTrend) ? `<div class="ov-kpi-footer">${volume ? `<span>${volume}</span>` : ''}${sep}${trendHtml}</div>` : ''}
    </div>
  `;
}

function ovBuildTile_Spend(cm, ccm, periods, data, focusIdx, partial){
  const val = cm.totalCost;
  const valStr = val > 0 ? fmtCurrency(val) + (partial ? '*' : '') : '—';
  let deltaHtml = '—', deltaCls = 'neutral';
  if(ccm && ccm.totalCost > 0){
    const d = val - ccm.totalCost, pct = d / ccm.totalCost * 100;
    const arrow = d > 1 ? '▲' : d < -1 ? '▼' : '▸';
    const curRS = cm.totalCost > 0 ? cm.reactiveCost / cm.totalCost : null;
    const cmpRS = ccm.totalCost > 0 ? ccm.reactiveCost / ccm.totalCost : null;
    if(Math.abs(pct) < 1) deltaCls = 'neutral';
    else if(d > 0 && curRS !== null && cmpRS !== null && curRS > cmpRS + 0.005) deltaCls = 'up-bad';
    else if(d < 0 && curRS !== null && cmpRS !== null && curRS < cmpRS - 0.005) deltaCls = 'down-good';
    else deltaCls = 'neutral';
    deltaHtml = `${arrow} ${d >= 0 ? '+' : ''}${pct.toFixed(1)}% (${fmtCurrency(Math.abs(d))})`;
  }
  const sparkVals = periods.map(p => { const s = data.get(p); return (s && s.hasCost) ? s.totalCost : null; });
  const spark = ovBuildSparkline(sparkVals, COLORS.warning, focusIdx, periods);
  const vol = cm.totalWO > 0 ? `${fmtNum(cm.totalWO)} WOs` : '';
  return ovRenderTile('Total spend', valStr, deltaHtml, deltaCls, spark, fmtCurrency, ovSparkSpanLabel(periods), vol);
}

function ovBuildTile_ReactiveShare(cm, ccm, periods, data, focusIdx, partial){
  const share = cm.totalCost > 0 ? (cm.reactiveCost / cm.totalCost * 100) : null;
  const valStr = share !== null ? fmtPct(share) + (partial ? '*' : '') : '—';
  let deltaHtml = '—', deltaCls = 'neutral';
  if(share !== null && ccm && ccm.totalCost > 0){
    const cmpShare = ccm.reactiveCost / ccm.totalCost * 100;
    const d = share - cmpShare;
    const arrow = d > 0.1 ? '▲' : d < -0.1 ? '▼' : '▸';
    deltaCls = d > 0.5 ? 'up-bad' : d < -0.5 ? 'down-good' : 'neutral';
    deltaHtml = `${arrow} ${d >= 0 ? '+' : ''}${d.toFixed(1)}pp`;
  }
  const sparkVals = periods.map(p => {
    const s = data.get(p);
    if(!s || !s.hasCost || s.totalCost <= 0) return null;
    return s.reactiveCost / s.totalCost * 100;
  });
  const spark = ovBuildSparkline(sparkVals, COLORS.warning, focusIdx, periods);
  const vol = (cm.totalWO > 0) ? `${fmtNum(cm.reactiveWO)} of ${fmtNum(cm.totalWO)} WOs reactive` : '';
  return ovRenderTile('Reactive share', valStr, deltaHtml, deltaCls, spark, v => v.toFixed(0) + '%', ovSparkSpanLabel(periods), vol);
}

function ovBuildTile_CorrectiveCostPerWO(cm, ccm, periods, data, focusIdx, partial){
  const val = cm.costPerWO.corrective;
  const valStr = val !== null ? fmtCurrency(val) + (partial ? '*' : '') : '—';
  let deltaHtml = '—', deltaCls = 'neutral';
  if(val !== null && ccm && ccm.costPerWO.corrective !== null){
    const d = val - ccm.costPerWO.corrective;
    const pct = d / ccm.costPerWO.corrective * 100;
    const arrow = d > 0.01 ? '▲' : d < -0.01 ? '▼' : '▸';
    deltaCls = pct > 1 ? 'up-bad' : pct < -1 ? 'down-good' : 'neutral';
    deltaHtml = `${arrow} ${d >= 0 ? '+' : ''}${pct.toFixed(1)}% (${fmtCurrency(Math.abs(d))})`;
  }
  const sparkVals = periods.map(p => {
    const s = data.get(p);
    if(!s || !s.hasCost) return null;
    const wo = (s.reactiveWO + s.proactiveWO);
    if(wo <= 0) return null;
    return (s.reactiveCost + s.proactiveCost) / wo;
  });
  const spark = ovBuildSparkline(sparkVals, COLORS.warning, focusIdx, periods);
  const vol = cm.correctiveWO > 0 ? `${fmtNum(cm.correctiveWO)} corrective WOs` : '';
  return ovRenderTile('Corrective £/WO', valStr, deltaHtml, deltaCls, spark, fmtCurrency, ovSparkSpanLabel(periods), vol);
}

function ovBuildTile_PMCompliance(pm, cpm, periods, data, focusIdx, partial){
  const val = pm.compliancePct;
  const valStr = val !== null ? fmtPct(val) + (partial ? '*' : '') : '—';
  let deltaHtml = '—', deltaCls = 'neutral';
  if(val !== null && cpm && cpm.compliancePct !== null){
    const d = val - cpm.compliancePct;
    const arrow = d > 0.1 ? '▲' : d < -0.1 ? '▼' : '▸';
    deltaCls = d > 0.5 ? 'up-good' : d < -0.5 ? 'down-bad' : 'neutral';
    deltaHtml = `${arrow} ${d >= 0 ? '+' : ''}${d.toFixed(1)}pp`;
  }
  const sparkVals = periods.map(p => {
    const s = data.get(p);
    if(!s || !s.hasPM || s.pmTotal <= 0) return null;
    return (1 - s.pmOverdue / s.pmTotal) * 100;
  });
  const spark = ovBuildSparkline(sparkVals, COLORS.primary, focusIdx, periods);
  const vol = pm.totalTasks > 0 ? `${fmtNum(pm.onTimeTasks)} of ${fmtNum(pm.totalTasks)} tasks on time` : '';
  return ovRenderTile('PM compliance', valStr, deltaHtml, deltaCls, spark, v => v.toFixed(0) + '%', ovSparkSpanLabel(periods), vol);
}

// Render-scoped cache. Cleared at the start of each rerender. Avoids redundant
// filtering and indexing across the Overview tab renderers and Section 2 Deep dive.
let _renderCache = null;
function getFilteredCostRows(){
  if(_renderCache && _renderCache.costRows) return _renderCache.costRows;
  const rows = deflateRows(applyGlobalFilters(STATE.costEnriched || []));
  if(_renderCache) _renderCache.costRows = rows;
  return rows;
}
function getFilteredPMRows(){
  if(_renderCache && _renderCache.pmRows) return _renderCache.pmRows;
  const rows = applyGlobalFilters(STATE.pmEnriched || []);
  if(_renderCache) _renderCache.pmRows = rows;
  return rows;
}


// ============================================================
// AGGREGATION ENGINE
// ============================================================

// Apply global filters to a row set (either cost or PM rows)
function applyGlobalFilters(rows){
  const f = STATE.filters;
  const hasBA = f.businessArea.size > 0 && f.businessArea.size < STATE.dimensions.businessAreas.length;
  const hasCty = f.county.size > 0 && f.county.size < STATE.dimensions.counties.length;
  const critDim = (STATE.dimensions.criticalities || []);
  const hasCrit = f.criticality.size > 0 && f.criticality.size < critDim.length;
  return rows.filter(r => {
    if(r.ym < f.timeFrom || r.ym > f.timeTo) return false;
    if(hasBA && !f.businessArea.has(r.businessArea)) return false;
    // County filter: if user has selected a subset, the row's county (or pseudo-value
    // 'No county' for null) must be in the selection. This lets users filter on
    // untagged-county rows (Bio-resourcing, WW Network non-county plants, etc.)
    if(hasCty){
      const key = r.county || 'No county';
      if(!f.county.has(key)) return false;
    }
    if(hasCrit && !f.criticality.has(normCriticality(r.sapCriticality))) return false;
    if(!f.includeUnknown && (r.assetClass === 'Unknown' || r.equipmentClass === 'Unknown' || !r.assetClass)) return false;
    return true;
  });
}

// Compute period key (FY-Quarter or Month) from a row
function periodKey(r, agg){
  if(agg === 'month') return r.ym;
  if(agg === 'fy') return fyLabel(r.fy);
  // quarter
  return fyQuarterLabel(r.fy, r.fyq);
}

function periodOrd(key, agg){
  if(agg === 'month'){
    const [y,m] = key.split('-').map(Number);
    return y*100 + m;
  }
  if(agg === 'fy'){
    const m = key.match(/FY(\d+)/);
    if(!m) return 0;
    return (2000 + parseInt(m[1],10)) * 10;
  }
  // "FY26 Q3"
  const m = key.match(/FY(\d+)\s*Q(\d+)/);
  if(!m) return 0;
  return fyQOrd(2000 + parseInt(m[1],10), parseInt(m[2],10));
}

// Get all periods present across the time window, sorted
function getPeriodsInRange(agg){
  const from = STATE.filters.timeFrom;
  const to = STATE.filters.timeTo;
  const months = STATE.allMonths.filter(m => m >= from && m <= to);
  if(agg === 'month') return months;
  if(agg === 'fy'){
    const fySet = new Set();
    for(const ym of months){
      const [y,m] = ym.split('-').map(Number);
      fySet.add(fyLabel(computeFY(y, m)));
    }
    return [...fySet].sort((a,b) => periodOrd(a,'fy') - periodOrd(b,'fy'));
  }
  // quarter
  const qSet = new Set();
  for(const ym of months){
    const [y,m] = ym.split('-').map(Number);
    qSet.add(fyQuarterLabel(computeFY(y,m), computeFYQuarter(m)));
  }
  return [...qSet].sort((a,b) => periodOrd(a,'quarter') - periodOrd(b,'quarter'));
}

// Check if a period is partial (not all constituent months represented in data).
// Works for quarter and FY aggregations.
function isPartialQuarter(qLabel, dataMonths){
  // FY: e.g. "FY26" - all 12 months of the FY must be present
  const fyMatch = qLabel.match(/^FY(\d+)$/);
  if(fyMatch){
    const fy = 2000 + parseInt(fyMatch[1],10);
    const required = [];
    for(let i = 0; i < 12; i++){
      const mo = ((i + 3) % 12) + 1;          // Apr..Mar
      const yr = (mo >= 4) ? fy - 1 : fy;
      required.push(`${yr}-${String(mo).padStart(2,'0')}`);
    }
    return !required.every(ym => dataMonths.has(ym));
  }
  // Quarter
  const m = qLabel.match(/FY(\d+)\s*Q(\d+)/);
  if(!m) return false;
  const fy = 2000 + parseInt(m[1],10);
  const q = parseInt(m[2],10);
  let startMon, year;
  if(q === 1){ startMon = 4; year = fy - 1; }
  else if(q === 2){ startMon = 7; year = fy - 1; }
  else if(q === 3){ startMon = 10; year = fy - 1; }
  else { startMon = 1; year = fy; }
  const required = [0,1,2].map(off => {
    const mm = startMon + off;
    return `${year}-${String(mm).padStart(2,'0')}`;
  });
  return !required.every(ym => dataMonths.has(ym));
}

// Sum a numeric field over rows
function sumBy(rows, key){
  let s = 0;
  for(const r of rows) s += r[key] || 0;
  return s;
}

// Group rows by a key function
function groupBy(rows, keyFn){
  const out = new Map();
  for(const r of rows){
    const k = keyFn(r);
    if(!out.has(k)) out.set(k, []);
    out.get(k).push(r);
  }
  return out;
}

// Compute cost per workorder metrics for a group of rows — single pass
// ---------- Inflation deflation to real (today's-money) terms ----------
// "Today" is the latest data month. A cost recorded `d` months before today is divided by
// (1 + annualRate)^(d/12), bringing it into today's money. Rate 0 ⇒ factor 1 everywhere
// (nominal cash, unchanged). Work-order counts are NEVER deflated — only costs.
let _inflFactorCache = { rate: null, anchor: null, map: null };
function inflationLatestMonth(){
  // Latest month present in the data (the real-terms reference point).
  const m = STATE.allMonths;
  return (m && m.length) ? m[m.length - 1] : null;
}
function monthsBetween(ymA, ymB){
  // Whole months from ymA to ymB (ymB - ymA); positive when ymB is later.
  const [ya, ma] = ymA.split('-').map(Number);
  const [yb, mb] = ymB.split('-').map(Number);
  return (yb - ya) * 12 + (mb - ma);
}
// Real-terms multiplier for a given ym (multiply a nominal cost by this to get today's money).
function inflationFactor(ym){
  const rate = STATE.inflationPct || 0;
  if(!rate || !ym) return 1;
  const anchor = inflationLatestMonth();
  if(!anchor) return 1;
  if(_inflFactorCache.rate !== rate || _inflFactorCache.anchor !== anchor){
    _inflFactorCache = { rate, anchor, map: new Map() };
  }
  let f = _inflFactorCache.map.get(ym);
  if(f === undefined){
    const dMonths = monthsBetween(ym, anchor);       // months from `ym` up to today (≥0 for past)
    f = Math.pow(1 + rate / 100, dMonths / 12);      // scale older money UP to today's money
    _inflFactorCache.map.set(ym, f);
  }
  return f;
}
// Deflate a single cost value tagged with its month.
function deflateCost(cost, ym){ return (cost || 0) * inflationFactor(ym); }

// Return a copy of the given cost rows with every cost field deflated to real (today's-money)
// terms by the row's own month. Volume/work-order fields are copied unchanged. When inflation
// is 0 the original array is returned untouched (no allocation, identical behaviour to before).
const _INFL_COST_FIELDS = [
  'reactiveCost','proactiveCost','preventativeCost','otherCost','totalCost','correctiveCost',
  'reactiveLabour','reactiveContractor','reactiveMaterials','reactiveOther',
  'proactiveLabour','proactiveContractor','proactiveMaterials','proactiveOther'
];
function deflateRows(rows){
  const rate = STATE.inflationPct || 0;
  if(!rate || !rows || !rows.length) return rows;
  return rows.map(r => {
    const f = inflationFactor(r.ym);
    if(f === 1) return r;
    const out = Object.assign({}, r);
    for(const k of _INFL_COST_FIELDS){ if(out[k] != null) out[k] = out[k] * f; }
    return out;
  });
}

function computeCostMetrics(rows){
  let reactiveCost = 0, proactiveCost = 0, preventativeCost = 0, otherCost = 0;
  let reactiveWO = 0, proactiveWO = 0, preventativeWO = 0, otherWO = 0;
  let totalWO = 0, totalCost = 0;
  let reactiveLabour = 0, reactiveContractor = 0, reactiveMaterials = 0, reactiveOtherCat = 0;
  let proactiveLabour = 0, proactiveContractor = 0, proactiveMaterials = 0, proactiveOtherCat = 0;
  for(const r of rows){
    reactiveCost     += r.reactiveCost     || 0;
    proactiveCost    += r.proactiveCost    || 0;
    preventativeCost += r.preventativeCost || 0;
    otherCost        += r.otherCost        || 0;
    reactiveWO       += r.reactiveWO       || 0;
    proactiveWO      += r.proactiveWO      || 0;
    preventativeWO   += r.preventativeWO   || 0;
    otherWO          += r.otherWO          || 0;
    totalWO          += r.totalWO          || 0;
    totalCost        += r.totalCost        || 0;
    reactiveLabour     += r.reactiveLabour     || 0;
    reactiveContractor += r.reactiveContractor || 0;
    reactiveMaterials  += r.reactiveMaterials  || 0;
    reactiveOtherCat   += r.reactiveOther      || 0;
    proactiveLabour     += r.proactiveLabour     || 0;
    proactiveContractor += r.proactiveContractor || 0;
    proactiveMaterials  += r.proactiveMaterials  || 0;
    proactiveOtherCat   += r.proactiveOther      || 0;
  }
  const correctiveCost = reactiveCost + proactiveCost;
  const correctiveWO = reactiveWO + proactiveWO;
  return {
    reactiveCost, proactiveCost, preventativeCost, otherCost, correctiveCost, totalCost,
    reactiveWO, proactiveWO, preventativeWO, otherWO, correctiveWO, totalWO,
    costPerWO: {
      corrective: correctiveWO > 0 ? correctiveCost / correctiveWO : null,
      reactive: reactiveWO > 0 ? reactiveCost / reactiveWO : null,
      proactive: proactiveWO > 0 ? proactiveCost / proactiveWO : null,
      preventative: preventativeWO > 0 ? preventativeCost / preventativeWO : null,
      total: totalWO > 0 ? totalCost / totalWO : null
    },
    reactiveLabour, reactiveContractor, reactiveMaterials, reactiveOtherCat,
    proactiveLabour, proactiveContractor, proactiveMaterials, proactiveOtherCat
  };
}

function computePMMetrics(rows){
  const total = sumBy(rows, 'totalTasks');
  const overdue = sumBy(rows, 'overdueTasks');
  return {
    totalTasks: total,
    overdueTasks: overdue,
    onTimeTasks: total - overdue,
    compliancePct: total > 0 ? (1 - overdue/total) * 100 : null
  };
}

// Get dimension value for grouping
function dimValue(r, dimension){
  switch(dimension){
    case 'assetClass': return r.assetClass || 'Unknown';
    case 'assetType': return r.assetType || 'Unknown';
    case 'county': return r.county || 'N/A';
    case 'businessArea': return r.businessArea || 'Unknown';
    case 'site': return r.site || 'Unknown';
    default: return r.assetClass || 'Unknown';
  }
}

function dimLabel(dimension){
  switch(dimension){
    case 'assetClass': return 'Asset class';
    case 'assetType': return 'Asset type';
    case 'county': return 'County';
    case 'businessArea': return 'Business area';
    case 'site': return 'Site';
    default: return dimension;
  }
}

// Compute "top N by total corrective spend" shortlist for a dimension — cached per render
function topNByCorrectiveSpend(rows, dimension, n){
  const cacheKey = 'topN_' + dimension + '_' + n;
  if(_renderCache && _renderCache[cacheKey]) return _renderCache[cacheKey];
  // Single-pass accumulator
  const spendByKey = new Map();
  for(const r of rows){
    const k = dimValue(r, dimension);
    const s = (r.reactiveCost || 0) + (r.proactiveCost || 0);
    spendByKey.set(k, (spendByKey.get(k) || 0) + s);
  }
  const arr = [];
  for(const [key, spend] of spendByKey){
    arr.push({ key, spend });
  }
  arr.sort((a,b) => b.spend - a.spend);
  const result = arr.slice(0, n).map(a => a.key);
  if(_renderCache) _renderCache[cacheKey] = result;
  return result;
}

// ============================================================
// PERIOD HELPERS (for Section 1 snapshot & comparisons)
// ============================================================
function priorPeriod(period, agg){
  if(agg === 'month'){
    const [y,m] = period.split('-').map(Number);
    const d = new Date(y, m-1, 1);
    d.setMonth(d.getMonth() - 1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  }
  if(agg === 'fy'){
    const mat = period.match(/^FY(\d+)$/);
    if(!mat) return null;
    const fy = 2000 + parseInt(mat[1],10);
    return fyLabel(fy - 1);
  }
  // quarter: FY26 Q3 -> FY26 Q2, FY26 Q1 -> FY25 Q4
  const mat = period.match(/FY(\d+)\s*Q(\d+)/);
  if(!mat) return null;
  const fy = 2000 + parseInt(mat[1],10);
  const q = parseInt(mat[2],10);
  if(q > 1) return fyQuarterLabel(fy, q-1);
  return fyQuarterLabel(fy-1, 4);
}

function priorYearPeriod(period, agg){
  if(agg === 'month'){
    const [y,m] = period.split('-').map(Number);
    return `${y-1}-${String(m).padStart(2,'0')}`;
  }
  if(agg === 'fy'){
    // FY mode - "prior year" == "prior period" (1 FY back). Same behaviour.
    return priorPeriod(period, agg);
  }
  const mat = period.match(/FY(\d+)\s*Q(\d+)/);
  if(!mat) return null;
  const fy = 2000 + parseInt(mat[1],10);
  const q = parseInt(mat[2],10);
  return fyQuarterLabel(fy-1, q);
}

// Rows matching a specific period — uses render-cached period index
function rowsInPeriod(rows, period, agg){
  if(_renderCache){
    // Tag each row-array with a unique id; build an index keyed by that id
    const rowsId = rows === _renderCache.costRows ? 'cost' : (rows === _renderCache.pmRows ? 'pm' : null);
    if(rowsId){
      const cacheKey = 'periodIdx_' + rowsId + '_' + agg;
      let idx = _renderCache[cacheKey];
      if(!idx){
        idx = new Map();
        for(const r of rows){
          const k = periodKey(r, agg);
          let arr = idx.get(k);
          if(!arr){ arr = []; idx.set(k, arr); }
          arr.push(r);
        }
        _renderCache[cacheKey] = idx;
      }
      return idx.get(period) || [];
    }
  }
  return rows.filter(r => periodKey(r, agg) === period);
}

// Rows for 3-year-avg comparison for a given period (prior 3 FYs of same quarter / FY / month)
function rowsFor3YrAvg(rows, period, agg){
  if(agg === 'quarter'){
    const mat = period.match(/FY(\d+)\s*Q(\d+)/);
    if(!mat) return [];
    const fy = 2000 + parseInt(mat[1],10);
    const q = parseInt(mat[2],10);
    const wantFYs = new Set([fy-1, fy-2, fy-3]);
    return rows.filter(r => wantFYs.has(r.fy) && r.fyq === q);
  }
  if(agg === 'fy'){
    const mat = period.match(/^FY(\d+)$/);
    if(!mat) return [];
    const fy = 2000 + parseInt(mat[1],10);
    const wantFYs = new Set([fy-1, fy-2, fy-3]);
    return rows.filter(r => wantFYs.has(r.fy));
  }
  // month
  const [y,m] = period.split('-').map(Number);
  const wantYears = new Set([y-1, y-2, y-3]);
  return rows.filter(r => wantYears.has(r.year) && r.month === m);
}

// ============================================================
// SVG CHART PRIMITIVES
// ============================================================

const CHART_DEFAULTS = {
  margin: { top: 20, right: 20, bottom: 50, left: 70 },
  barGroupGap: 0.25,
  barGap: 0.08,
  height: 280
};

function svgEl(tag, attrs = {}, children = []){
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for(const [k,v] of Object.entries(attrs)){
    if(v === null || v === undefined) continue;
    el.setAttribute(k, v);
  }
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if(c == null) return;
    if(typeof c === 'string') el.appendChild(document.createTextNode(c));
    else el.appendChild(c);
  });
  return el;
}

function niceTicks(min, max, count = 5){
  if(min === max){ min -= 1; max += 1; }
  const range = max - min;
  const step = niceNum(range / (count - 1));
  const niceMin = Math.floor(min / step) * step;
  const niceMax = Math.ceil(max / step) * step;
  const ticks = [];
  for(let v = niceMin; v <= niceMax + 1e-9; v += step) ticks.push(v);
  return { ticks, min: niceMin, max: niceMax };
}
function niceNum(x){
  if(x <= 0) return 1;
  const exp = Math.floor(Math.log10(x));
  const frac = x / Math.pow(10, exp);
  let nf;
  if(frac < 1.5) nf = 1;
  else if(frac < 3) nf = 2;
  else if(frac < 7) nf = 5;
  else nf = 10;
  return nf * Math.pow(10, exp);
}

// Text measurement using canvas (approximate)
let _canvasCtx = null;
function measureText(text, font = '12px Segoe UI, system-ui, sans-serif'){
  if(!_canvasCtx){
    const c = document.createElement('canvas');
    _canvasCtx = c.getContext('2d');
  }
  _canvasCtx.font = font;
  return _canvasCtx.measureText(text).width;
}

// Attach tooltip events to an element
function addTooltip(el, html){
  el.addEventListener('mousemove', e => showTooltip(e.clientX, e.clientY, html));
  el.addEventListener('mouseleave', hideTooltip);
}

// ============================================================
// BAR CHART — Horizontal, sortable, optional comparison bars
// Items: [{ label, value, comparison?, tooltip? }]
// opts: { fmt, title, height, barColor, comparisonColor, comparisonLabel, valueLabel }
// ============================================================
function renderHorizontalBarChart(container, items, opts = {}){
  container.innerHTML = '';
  if(!items || !items.length){
    container.innerHTML = '<div class="chart-empty">No data for current selection</div>';
    return;
  }
  const fmt = opts.fmt || (v => String(v));
  const height = opts.height || Math.max(180, items.length * 26 + 50);
  const hasComparison = items.some(it => it.comparison !== undefined && it.comparison !== null);
  const barColor = opts.barColor || COLORS.primary;
  const comparisonColor = opts.comparisonColor || COLORS.neutral;
  const comparisonLabel = opts.comparisonLabel || 'Comparison';
  const valueLabel = opts.valueLabel || 'Value';

  // Calculate left margin based on label widths
  const maxLabelWidth = Math.min(220, Math.max(80, ...items.map(it => measureText(it.label) + 12)));
  const margin = { top: 14, right: 60, bottom: 30, left: maxLabelWidth };
  const w = container.clientWidth || 500;
  const width = Math.max(300, w);
  const innerW = width - margin.left - margin.right;
  const innerH = height - margin.top - margin.bottom;

  // Compute max value including comparison
  let maxVal = 0;
  items.forEach(it => {
    if(it.value != null && isFinite(it.value)) maxVal = Math.max(maxVal, it.value);
    if(hasComparison && it.comparison != null && isFinite(it.comparison)) maxVal = Math.max(maxVal, it.comparison);
  });
  if(maxVal <= 0) maxVal = 1;
  const ticks = niceTicks(0, maxVal, 5);
  maxVal = ticks.max;

  const barSlotHeight = innerH / items.length;
  const barHeight = hasComparison ? barSlotHeight * 0.35 : barSlotHeight * 0.55;

  const svg = svgEl('svg', { viewBox: `0 0 ${width} ${height}`, preserveAspectRatio: 'xMidYMid meet' });

  // Gridlines
  ticks.ticks.forEach(t => {
    const x = margin.left + (t / maxVal) * innerW;
    svg.appendChild(svgEl('line', { x1:x, y1:margin.top, x2:x, y2:margin.top + innerH, stroke:'#eee', 'stroke-width':1 }));
    svg.appendChild(svgEl('text', {
      x, y: margin.top + innerH + 16, 'text-anchor':'middle', 'font-size':10, fill:'#666'
    }, fmt(t)));
  });

  // Bars
  items.forEach((it, i) => {
    const y0 = margin.top + i * barSlotHeight;
    // Label
    const labelTxt = svgEl('text', {
      x: margin.left - 8, y: y0 + barSlotHeight/2 + 4,
      'text-anchor':'end', 'font-size':11, fill:'#333'
    }, truncate(it.label, 30));
    if(it.label.length > 30){
      const title = svgEl('title', {}, it.label);
      labelTxt.appendChild(title);
    }
    svg.appendChild(labelTxt);

    // Current bar
    const val = (it.value != null && isFinite(it.value)) ? it.value : 0;
    const barW = (val / maxVal) * innerW;
    if(val > 0){
      const barY = hasComparison ? y0 + barSlotHeight * 0.1 : y0 + (barSlotHeight - barHeight)/2;
      const bar = svgEl('rect', {
        x: margin.left, y: barY, width: barW, height: barHeight,
        fill: barColor, rx: 2
      });
      addTooltip(bar, buildBarTooltipHTML(it, valueLabel, comparisonLabel, hasComparison, fmt));
      svg.appendChild(bar);
      // Value label at end of bar
      svg.appendChild(svgEl('text', {
        x: margin.left + barW + 4, y: barY + barHeight/2 + 3.5,
        'font-size':10, fill:'#333'
      }, fmt(val)));
    }
    // Comparison bar
    if(hasComparison && it.comparison != null && isFinite(it.comparison)){
      const cVal = it.comparison;
      const cBarW = (cVal / maxVal) * innerW;
      if(cVal > 0){
        const cBarY = y0 + barSlotHeight * 0.55;
        const cBar = svgEl('rect', {
          x: margin.left, y: cBarY, width: cBarW, height: barHeight,
          fill: comparisonColor, rx: 2
        });
        addTooltip(cBar, buildBarTooltipHTML(it, valueLabel, comparisonLabel, hasComparison, fmt));
        svg.appendChild(cBar);
      }
    }
  });

  // X axis line
  svg.appendChild(svgEl('line', {
    x1: margin.left, y1: margin.top + innerH, x2: margin.left + innerW, y2: margin.top + innerH,
    stroke: '#ccc', 'stroke-width': 1
  }));

  container.appendChild(svg);

  // Legend if comparison present
  if(hasComparison){
    const legend = document.createElement('div');
    legend.className = 'legend';
    legend.innerHTML = `
      <span class="legend-item"><span class="legend-swatch" style="background:${barColor}"></span>${escapeHtml(valueLabel)}</span>
      <span class="legend-item"><span class="legend-swatch" style="background:${comparisonColor}"></span>${escapeHtml(comparisonLabel)}</span>
    `;
    container.appendChild(legend);
  }
}

function buildBarTooltipHTML(item, valueLabel, comparisonLabel, hasComparison, fmt){
  const lines = [
    `<div class="tt-title">${escapeHtml(item.label)}</div>`,
    `<div class="tt-row"><span class="tt-label">${escapeHtml(valueLabel)}:</span><span>${fmt(item.value)}</span></div>`
  ];
  if(hasComparison && item.comparison != null){
    lines.push(`<div class="tt-row"><span class="tt-label">${escapeHtml(comparisonLabel)}:</span><span>${fmt(item.comparison)}</span></div>`);
    if(item.value != null && item.comparison > 0){
      const deltaPct = ((item.value - item.comparison) / item.comparison) * 100;
      const cls = deltaPct > 0 ? 'delta-up' : 'delta-down';
      lines.push(`<div class="tt-row"><span class="tt-label">Change:</span><span>${deltaPct > 0 ? '+' : ''}${deltaPct.toFixed(1)}%</span></div>`);
    }
  }
  if(item.extra){
    for(const [k,v] of Object.entries(item.extra)){
      lines.push(`<div class="tt-row"><span class="tt-label">${escapeHtml(k)}:</span><span>${v}</span></div>`);
    }
  }
  return lines.join('');
}

function truncate(s, n){
  if(!s) return '';
  return s.length > n ? s.slice(0, n-1) + '…' : s;
}

// ============================================================
// LINE CHART — multi-series trend
// series: [{ name, color, points: [{x: periodKey, y: number|null, tooltipExtra?}]}]
// periods: sorted list of period keys (x axis)
// opts: { fmt, yLabel, height, partialPeriods (Set of period keys) }
// ============================================================
function renderLineChart(container, series, periods, opts = {}){
  container.innerHTML = '';
  if(!periods.length || !series.length){
    container.innerHTML = '<div class="chart-empty">No data for current selection</div>';
    return;
  }
  const fmt = opts.fmt || (v => String(v));
  const height = opts.height || 280;
  // Reserve extra right margin when a secondary axis is present, for the right-side tick labels.
  const hasSecondary = !!(opts.secondarySeries && opts.secondarySeries.length);
  const margin = { top: 14, right: hasSecondary ? 50 : 20, bottom: 50, left: 60 };
  const w = container.clientWidth || 500;
  const width = Math.max(300, w);
  const innerW = width - margin.left - margin.right;
  const innerH = height - margin.top - margin.bottom;
  const partial = opts.partialPeriods || new Set();

  // Y range
  let minY = Infinity, maxY = -Infinity;
  series.forEach(s => {
    s.points.forEach(p => {
      if(p.y != null && isFinite(p.y)){
        if(p.y < minY) minY = p.y;
        if(p.y > maxY) maxY = p.y;
      }
    });
  });
  if(!isFinite(minY)){ minY = 0; maxY = 1; }
  if(minY === maxY){ maxY = minY + 1; }
  // For percentage y-axis, clamp to 0-100
  if(opts.isPercent){ minY = 0; maxY = 100; }
  else { minY = Math.min(0, minY); }
  const ticks = niceTicks(minY, maxY, 5);
  minY = ticks.min; maxY = ticks.max;

  const xScale = i => margin.left + (periods.length === 1 ? innerW/2 : (i / (periods.length - 1)) * innerW);
  const yScale = v => margin.top + innerH - ((v - minY) / (maxY - minY)) * innerH;

  const svg = svgEl('svg', { viewBox: `0 0 ${width} ${height}`, preserveAspectRatio: 'xMidYMid meet' });

  // Gridlines & y labels
  ticks.ticks.forEach(t => {
    const y = yScale(t);
    svg.appendChild(svgEl('line', { x1:margin.left, y1:y, x2:margin.left+innerW, y2:y, stroke:'#eee', 'stroke-width':1 }));
    svg.appendChild(svgEl('text', { x:margin.left-6, y:y+3, 'text-anchor':'end', 'font-size':10, fill:'#666' }, fmt(t)));
  });

  // X axis labels — rotate if crowded. Auto-thin labels when there are many periods so
  // they don't overlap. opts.tickEvery overrides; otherwise we pick a sensible step
  // targeting ~12 visible labels.
  const xLabelRotate = periods.length > 10 || periods.some(p => p.length > 6);
  const tickEvery = opts.tickEvery || Math.max(1, Math.ceil(periods.length / 12));
  periods.forEach((p, i) => {
    const showLabel = (i % tickEvery === 0) || (i === periods.length - 1);
    if(!showLabel) return;
    const x = xScale(i);
    const y = margin.top + innerH + 14;
    const isPartial = partial.has(p);
    const label = p + (isPartial ? ' *' : '');
    if(xLabelRotate){
      svg.appendChild(svgEl('text', {
        x, y, 'font-size':10, fill: isPartial ? COLORS.warning : '#666',
        transform: `rotate(-40 ${x} ${y})`, 'text-anchor':'end'
      }, label));
    } else {
      svg.appendChild(svgEl('text', {
        x, y, 'text-anchor':'middle', 'font-size':10, fill: isPartial ? COLORS.warning : '#666'
      }, label));
    }
  });

  // X axis line
  svg.appendChild(svgEl('line', {
    x1: margin.left, y1: margin.top + innerH, x2: margin.left + innerW, y2: margin.top + innerH,
    stroke: '#ccc', 'stroke-width': 1
  }));

  // Optional vertical rule — used by Forward-look to separate history from projection.
  // opts.verticalRule = { atIndex, label, color }
  if(opts.verticalRule && typeof opts.verticalRule.atIndex === 'number'){
    const vr = opts.verticalRule;
    const vx = xScale(vr.atIndex);
    if(vx > margin.left && vx < margin.left + innerW){
      svg.appendChild(svgEl('line', {
        x1: vx, y1: margin.top, x2: vx, y2: margin.top + innerH,
        stroke: vr.color || '#888', 'stroke-width': 1, 'stroke-dasharray': '3,3', opacity: 0.7
      }));
      if(vr.label){
        svg.appendChild(svgEl('text', {
          x: vx + 3, y: margin.top + 9, 'font-size': 9, fill: vr.color || '#888', 'font-style': 'italic'
        }, vr.label));
      }
    }
  }

  // Optional target line (horizontal reference)
  if(opts.targetLine != null && isFinite(opts.targetLine)){
    const ty = yScale(opts.targetLine);
    if(ty >= margin.top && ty <= margin.top + innerH){
      svg.appendChild(svgEl('line', {
        x1: margin.left, y1: ty, x2: margin.left + innerW, y2: ty,
        stroke: COLORS.danger, 'stroke-width': 1, 'stroke-dasharray': '4,3', opacity: 0.75
      }));
      const tLbl = opts.targetLineLabel || `${fmt(opts.targetLine)} target`;
      svg.appendChild(svgEl('text', {
        x: margin.left + innerW - 4, y: ty - 3, 'text-anchor': 'end',
        'font-size': 10, fill: COLORS.danger, 'font-style': 'italic'
      }, tLbl));
    }
  }

  // Secondary axis + faint background series. Drawn BEFORE the main lines so it sits visually behind.
  // opts.secondarySeries: [{ name, color, points: [{y}] }] — values are %, scaled 0–100 by default.
  // opts.secondaryRange: [min, max] — defaults to [0, 100]. opts.secondaryFmt: optional formatter.
  // opts.secondaryYLabel: label shown above the right axis.
  if(hasSecondary){
    const sRange = opts.secondaryRange || [0, 100];
    const sMin = sRange[0], sMax = sRange[1];
    const sFmt = opts.secondaryFmt || (v => v.toFixed(0) + '%');
    const sScale = v => margin.top + innerH - ((v - sMin) / (sMax - sMin)) * innerH;
    const sTicks = niceTicks(sMin, sMax, 4);
    // Right-axis tick labels (no gridlines — keep visual clutter low)
    sTicks.ticks.forEach(t => {
      if(t < sMin || t > sMax) return;
      const y = sScale(t);
      svg.appendChild(svgEl('text', {
        x: margin.left + innerW + 6, y: y + 3, 'text-anchor': 'start',
        'font-size': 10, fill: '#999'
      }, sFmt(t)));
    });
    // Right axis label (shown vertically alongside)
    if(opts.secondaryYLabel){
      svg.appendChild(svgEl('text', {
        x: margin.left + innerW + 38, y: margin.top + innerH / 2,
        'text-anchor': 'middle', 'font-size': 10, fill: '#999',
        'font-style': 'italic',
        transform: `rotate(90 ${margin.left + innerW + 38} ${margin.top + innerH / 2})`
      }, opts.secondaryYLabel));
    }
    // Faint background lines for each secondary series — dashed, low opacity, no markers
    opts.secondarySeries.forEach((s, sIdx) => {
      const color = s.color || '#94a3b8';
      let pathD = '';
      let started = false;
      s.points.forEach((p, i) => {
        if(p.y == null || !isFinite(p.y)){ started = false; return; }
        const x = xScale(i), y = sScale(p.y);
        if(!started){ pathD += `M ${x} ${y}`; started = true; }
        else pathD += ` L ${x} ${y}`;
      });
      if(pathD){
        svg.appendChild(svgEl('path', {
          d: pathD, stroke: color, 'stroke-width': 1.5, fill: 'none',
          'stroke-dasharray': '5,3', opacity: 0.55,
          'stroke-linejoin': 'round', 'stroke-linecap': 'round'
        }));
      }
    });
  }

  // Lines — draw with segments, break at nulls to create gaps. Per-series flags:
  //   noDots: true  → don't draw point markers (used for baseline reference lines)
  //   dashed: true  → render the line dashed (4,3 pattern)
  //   lineLabel: '' → render a small label at the right end of the line
  series.forEach((s, sIdx) => {
    const color = s.color || COLORS.series[sIdx % COLORS.series.length];
    let pathD = '';
    let started = false;
    let lastDrawnX = null, lastDrawnY = null;
    s.points.forEach((p, i) => {
      if(p.y == null || !isFinite(p.y)){ started = false; return; }
      const x = xScale(i), y = yScale(p.y);
      if(!started){ pathD += `M ${x} ${y}`; started = true; }
      else pathD += ` L ${x} ${y}`;
      lastDrawnX = x; lastDrawnY = y;
    });
    if(pathD){
      const pathAttrs = {
        d: pathD, stroke: color, 'stroke-width': 2, fill: 'none',
        'stroke-linejoin':'round', 'stroke-linecap':'round'
      };
      if(s.dashed) pathAttrs['stroke-dasharray'] = '5,3';
      svg.appendChild(svgEl('path', pathAttrs));
      // Optional inline label at the end of the line
      if(s.lineLabel && lastDrawnX != null){
        svg.appendChild(svgEl('text', {
          x: lastDrawnX - 4, y: lastDrawnY - 4, 'text-anchor': 'end',
          'font-size': 10, fill: color, 'font-style': 'italic', opacity: 0.85
        }, s.lineLabel));
      }
    }
    if(s.noDots) return;
    // Points with hover (smaller markers — r=2 — to reduce visual noise on dense charts)
    s.points.forEach((p, i) => {
      if(p.y == null || !isFinite(p.y)) return;
      const x = xScale(i), y = yScale(p.y);
      const circle = svgEl('circle', { cx:x, cy:y, r:2, fill:color, stroke:'#fff', 'stroke-width':0.75 });
      const tip = [
        `<div class="tt-title">${escapeHtml(s.name)} — ${escapeHtml(periods[i])}${partial.has(periods[i]) ? ' (partial)' : ''}</div>`,
        `<div class="tt-row"><span class="tt-label">${escapeHtml(opts.yLabel || 'Value')}:</span><span>${fmt(p.y)}</span></div>`
      ];
      if(p.tooltipExtra){
        for(const [k,v] of Object.entries(p.tooltipExtra)){
          tip.push(`<div class="tt-row"><span class="tt-label">${escapeHtml(k)}:</span><span>${v}</span></div>`);
        }
      }
      addTooltip(circle, tip.join(''));
      svg.appendChild(circle);
    });
  });

  container.appendChild(svg);

  // Legend (primary series + any secondary series rendered with a dashed swatch hint)
  if(series.length > 1 || !opts.suppressLegend || hasSecondary){
    const legend = document.createElement('div');
    legend.className = 'legend';
    const primaryItems = series.map((s, i) => {
      const color = s.color || COLORS.series[i % COLORS.series.length];
      return `<span class="legend-item"><span class="legend-swatch" style="background:${color}"></span>${escapeHtml(s.name)}</span>`;
    }).join('');
    const secondaryItems = hasSecondary ? opts.secondarySeries.map(s => {
      const color = s.color || '#94a3b8';
      return `<span class="legend-item" style="opacity:.7"><span class="legend-swatch" style="background:repeating-linear-gradient(90deg, ${color} 0 4px, transparent 4px 7px)"></span>${escapeHtml(s.name)} <span style="color:#999;font-size:10px;font-style:italic">(right axis)</span></span>`;
    }).join('') : '';
    legend.innerHTML = primaryItems + secondaryItems;
    container.appendChild(legend);
  }
  if(partial.size > 0){
    const note = document.createElement('div');
    note.style.cssText = 'font-size:11px;color:' + COLORS.warning + ';margin-top:4px';
    note.textContent = '* partial quarter (not all months present in data)';
    container.appendChild(note);
  }
}

// ============================================================
// STACKED BAR CHART — for spend composition over periods
// periods: [p1, p2, ...]
// series: [{ name, color, values: [v1, v2, ...] (aligned to periods) }]
// ============================================================
function renderStackedBarChart(container, series, periods, opts = {}){
  container.innerHTML = '';
  if(!periods.length || !series.length){
    container.innerHTML = '<div class="chart-empty">No data for current selection</div>';
    return;
  }
  const fmt = opts.fmt || fmtCurrency;
  const height = opts.height || 260;
  const margin = { top: 14, right: 20, bottom: 50, left: 60 };
  const w = container.clientWidth || 500;
  const width = Math.max(300, w);
  const innerW = width - margin.left - margin.right;
  const innerH = height - margin.top - margin.bottom;

  // Compute totals per period
  const totals = periods.map((_, i) => series.reduce((s, ser) => s + (ser.values[i] || 0), 0));
  let maxY = Math.max(...totals, 0);
  if(maxY <= 0) maxY = 1;
  const ticks = niceTicks(0, maxY, 5);
  maxY = ticks.max;

  const barW = innerW / periods.length * 0.7;
  const xPos = i => margin.left + (i + 0.5) * (innerW / periods.length) - barW/2;
  const yScale = v => margin.top + innerH - (v / maxY) * innerH;

  const svg = svgEl('svg', { viewBox: `0 0 ${width} ${height}`, preserveAspectRatio: 'xMidYMid meet' });

  // Gridlines
  ticks.ticks.forEach(t => {
    const y = yScale(t);
    svg.appendChild(svgEl('line', { x1:margin.left, y1:y, x2:margin.left+innerW, y2:y, stroke:'#eee', 'stroke-width':1 }));
    svg.appendChild(svgEl('text', { x:margin.left-6, y:y+3, 'text-anchor':'end', 'font-size':10, fill:'#666' }, fmt(t)));
  });

  // Stacked bars
  periods.forEach((p, i) => {
    let yCursor = margin.top + innerH;
    series.forEach((s, sIdx) => {
      const v = s.values[i] || 0;
      if(v <= 0) return;
      const barH = (v / maxY) * innerH;
      const y = yCursor - barH;
      const color = s.color || COLORS.series[sIdx % COLORS.series.length];
      const rect = svgEl('rect', { x: xPos(i), y, width: barW, height: barH, fill: color });
      const tip = [
        `<div class="tt-title">${escapeHtml(p)}</div>`,
        `<div class="tt-row"><span class="tt-label">${escapeHtml(s.name)}:</span><span>${fmt(v)}</span></div>`,
        `<div class="tt-row"><span class="tt-label">Total:</span><span>${fmt(totals[i])}</span></div>`
      ].join('');
      addTooltip(rect, tip);
      svg.appendChild(rect);
      yCursor = y;
    });
    // X label
    const lx = xPos(i) + barW/2;
    const ly = margin.top + innerH + 14;
    const rotate = periods.length > 10 || p.length > 6;
    if(rotate){
      svg.appendChild(svgEl('text', { x:lx, y:ly, 'font-size':10, fill:'#666', transform:`rotate(-40 ${lx} ${ly})`, 'text-anchor':'end' }, p));
    } else {
      svg.appendChild(svgEl('text', { x:lx, y:ly, 'text-anchor':'middle', 'font-size':10, fill:'#666' }, p));
    }
  });

  // X-axis
  svg.appendChild(svgEl('line', {
    x1: margin.left, y1: margin.top + innerH, x2: margin.left + innerW, y2: margin.top + innerH,
    stroke: '#ccc', 'stroke-width': 1
  }));

  container.appendChild(svg);

  // Legend
  const legend = document.createElement('div');
  legend.className = 'legend';
  legend.innerHTML = series.map((s, i) => {
    const color = s.color || COLORS.series[i % COLORS.series.length];
    return `<span class="legend-item"><span class="legend-swatch" style="background:${color}"></span>${escapeHtml(s.name)}</span>`;
  }).join('');
  container.appendChild(legend);
}

// ============================================================
// DEEP DIVE TAB — narrative redesign (single asset class focus)
// Sections: 1) chip+filters+pills  2) KPI tiles  3) spend evolution
// 4) cost/WO + volume + PM  5) category breakdown  6) geography  7) movers
// ============================================================

let _ddPickerState = null;

function renderSection2(){
  const host = document.getElementById('section2');
  if(!STATE.costEnriched && !STATE.pmEnriched){ host.innerHTML = ''; return; }
  const s2 = STATE.section2;

  // Asset class universe from globally-filtered rows
  const costAll = getFilteredCostRows();
  const pmAll = getFilteredPMRows();
  const classSet = new Set();
  [...costAll, ...pmAll].forEach(r => { if(r.assetClass && r.assetClass !== 'Unknown') classSet.add(r.assetClass); });
  if(STATE.filters.includeUnknown) classSet.add('Unknown');
  const classList = [...classSet].sort();

  // Default: highest corrective spend
  if(!s2.assetClass || !classList.includes(s2.assetClass)){
    const spendByClass = {};
    costAll.forEach(r => {
      const k = r.assetClass || 'Unknown';
      if(!classList.includes(k)) return;
      spendByClass[k] = (spendByClass[k] || 0) + (r.correctiveCost || 0);
    });
    const sorted = Object.entries(spendByClass).sort((a,b) => b[1] - a[1]);
    s2.assetClass = sorted.length ? sorted[0][0] : (classList[0] || null);
    s2.assetType = null; s2.businessAreas.clear(); s2.counties.clear(); s2.sites.clear();
  }

  if(!s2.assetClass){
    host.innerHTML = '<div class="dd-empty">No asset classes available for the current filter.</div>';
    return;
  }

  host.innerHTML = `
    <div id="ddS1"></div>
    <div id="ddS2"></div>
    <div id="ddS3"></div>
    <div id="ddS4"></div>
    <div id="ddS5"></div>
    <div id="ddSContrib"></div>
    <div id="ddS6"></div>
    <div id="ddS7"></div>
  `;

  ddRenderS1(classList);
  ddRenderS2KPIs();
  ddRenderS3SpendEvolution();
  ddRenderS4CostPerWO();
  ddRenderS5CategoryBreakdown();
  ddRenderContributors();
  ddRenderS6Geography();
  ddRenderS7Movers();
}

// ---------- Deep-dive row helpers ----------
// Iterate ONLY rows for the selected asset class, using the preindex built in
// rebuildDimensions. Applies global + local filters in a single pass.
function ddFilterFromIndex(indexMap){
  const s2 = STATE.section2;
  const base = (indexMap && indexMap.get(s2.assetClass)) || [];
  const f = STATE.filters;
  const hasBA = f.businessArea.size > 0 && f.businessArea.size < STATE.dimensions.businessAreas.length;
  const hasCty = f.county.size > 0 && f.county.size < STATE.dimensions.counties.length;
  const res = [];
  for(const r of base){
    // Global filters
    if(r.ym < f.timeFrom || r.ym > f.timeTo) continue;
    if(hasBA && !f.businessArea.has(r.businessArea)) continue;
    if(hasCty){ const ck = r.county || 'No county'; if(!f.county.has(ck)) continue; }
    if(!f.includeUnknown && (r.assetClass === 'Unknown' || r.equipmentClass === 'Unknown' || !r.assetClass)) continue;
    // Local Deep-dive filters
    if(s2.assetType && r.assetType !== s2.assetType) continue;
    if(s2.businessAreas.size && !s2.businessAreas.has(r.businessArea)) continue;
    if(s2.counties.size){ if(!r.county || !s2.counties.has(r.county)) continue; }
    if(s2.sites.size && !s2.sites.has(r.site)) continue;
    res.push(r);
  }
  return res;
}
function ddFilteredCostRows(){
  if(_renderCache && _renderCache.ddCostRows) return _renderCache.ddCostRows;
  const rows = ddFilterFromIndex(STATE.costByAssetClass);
  if(_renderCache) _renderCache.ddCostRows = rows;
  return rows;
}
function ddFilteredPMRows(){
  if(_renderCache && _renderCache.ddPMRows) return _renderCache.ddPMRows;
  const rows = ddFilterFromIndex(STATE.pmByAssetClass);
  if(_renderCache) _renderCache.ddPMRows = rows;
  return rows;
}
function ddRowsInPeriod(type, period){
  const agg = STATE.filters.aggregation;
  const cacheKey = 'ddPeriodIdx_' + type + '_' + agg;
  let idx = _renderCache && _renderCache[cacheKey];
  if(!idx){
    idx = new Map();
    const rows = type === 'cost' ? ddFilteredCostRows() : ddFilteredPMRows();
    for(const r of rows){
      const k = periodKey(r, agg);
      let arr = idx.get(k);
      if(!arr){ arr = []; idx.set(k, arr); }
      arr.push(r);
    }
    if(_renderCache) _renderCache[cacheKey] = idx;
  }
  return idx.get(period) || [];
}
// Sparkline data for deep-dive — ignores global time filter, applies class+local+BA/county/unknown
// Uses the per-class preindex so iteration is O(class rows) not O(all rows).
function ddComputeSparklineData(periods){
  const key = 'ddSparkData_' + periods.join('|');
  if(_renderCache && _renderCache[key]) return _renderCache[key];
  const agg = STATE.filters.aggregation;
  const periodSet = new Set(periods);
  const data = new Map();
  periods.forEach(p => data.set(p, {
    totalCost:0, reactiveCost:0, proactiveCost:0, preventativeCost:0, otherCost:0,
    reactiveWO:0, proactiveWO:0, correctiveWO:0, totalWO:0,
    pmTotal:0, pmOverdue:0, hasCost:false, hasPM:false
  }));
  const s2 = STATE.section2;
  const f = STATE.filters;
  const hasBA = f.businessArea.size > 0 && f.businessArea.size < STATE.dimensions.businessAreas.length;
  const hasCty = f.county.size > 0 && f.county.size < STATE.dimensions.counties.length;
  const matchFilters = (r) => {
    if(s2.assetType && r.assetType !== s2.assetType) return false;
    if(hasBA && !f.businessArea.has(r.businessArea)) return false;
    if(hasCty){ const ck = r.county || 'No county'; if(!f.county.has(ck)) return false; }
    if(s2.businessAreas.size && !s2.businessAreas.has(r.businessArea)) return false;
    if(s2.counties.size){ if(!r.county || !s2.counties.has(r.county)) return false; }
    if(s2.sites.size && !s2.sites.has(r.site)) return false;
    if(!f.includeUnknown && (r.assetClass === 'Unknown' || !r.assetClass)) return false;
    return true;
  };
  const costBase = (STATE.costByAssetClass && STATE.costByAssetClass.get(s2.assetClass)) || [];
  for(const r of costBase){
    const p = periodKey(r, agg);
    if(!periodSet.has(p)) continue;
    if(!matchFilters(r)) continue;
    const s = data.get(p);
    s.totalCost += r.totalCost || 0;
    s.reactiveCost += r.reactiveCost || 0;
    s.proactiveCost += r.proactiveCost || 0;
    s.preventativeCost += r.preventativeCost || 0;
    s.otherCost += r.otherCost || 0;
    s.reactiveWO += r.reactiveWO || 0;
    s.proactiveWO += r.proactiveWO || 0;
    s.correctiveWO += (r.correctiveWO != null ? r.correctiveWO : ((r.reactiveWO || 0) + (r.proactiveWO || 0)));
    s.totalWO += r.totalWO || 0;
    s.hasCost = true;
  }
  const pmBase = (STATE.pmByAssetClass && STATE.pmByAssetClass.get(s2.assetClass)) || [];
  for(const r of pmBase){
    const p = periodKey(r, agg);
    if(!periodSet.has(p)) continue;
    if(!matchFilters(r)) continue;
    const s = data.get(p);
    s.pmTotal += r.totalTasks || 0;
    s.pmOverdue += r.overdueTasks || 0;
    s.hasPM = true;
  }
  if(_renderCache) _renderCache[key] = data;
  return data;
}

function ddBuildHeadlinePills(focus){
  if(!focus) return '<div class="dd-empty">No focus period available.</div>';
  const cmpMode = STATE.filters.comparisonMode;
  const cmpPeriod = resolveComparisonPeriod(focus);
  const agg = STATE.filters.aggregation;
  const cm = computeCostMetrics(ddRowsInPeriod('cost', focus));
  const pmm = computePMMetrics(ddRowsInPeriod('pm', focus));
  let ccm = null, cpm = null;
  if(cmpMode !== 'none' && cmpPeriod){
    if(cmpPeriod === '3yr-avg'){
      ccm = computeCostMetrics(rowsFor3YrAvg(ddFilteredCostRows(), focus, agg));
      cpm = computePMMetrics(rowsFor3YrAvg(ddFilteredPMRows(), focus, agg));
    } else {
      ccm = computeCostMetrics(ddRowsInPeriod('cost', cmpPeriod));
      cpm = computePMMetrics(ddRowsInPeriod('pm', cmpPeriod));
    }
  }

  const pillPct = (label, v, pv, goodDir) => {
    let deltaHtml = '—', deltaCls = 'neutral', abs = '';
    if(v != null && pv != null && pv !== 0){
      const d = v - pv, pct = d / Math.abs(pv) * 100;
      const arrow = d > 0 ? '▲' : d < 0 ? '▼' : '▸';
      if(Math.abs(pct) < 1) deltaCls = 'neutral';
      else if(d > 0) deltaCls = goodDir === 'up' ? 'up-good' : 'up-bad';
      else deltaCls = goodDir === 'up' ? 'down-bad' : 'down-good';
      deltaHtml = `${arrow} ${d >= 0 ? '+' : ''}${pct.toFixed(1)}%`;
    }
    return { deltaHtml, deltaCls, abs };
  };

  // Pill 1 - Total spend (up = bad)
  const p1 = pillPct('Total spend', cm.totalCost, ccm ? ccm.totalCost : null, 'down');
  if(cm.totalCost != null && ccm && ccm.totalCost > 0){
    const d = cm.totalCost - ccm.totalCost;
    p1.abs = `${d >= 0 ? '+' : '−'}${fmtCurrency(Math.abs(d))}`;
  }
  // Pill 2 - Cost per WO (up = bad)
  const curCpW = cm.costPerWO.corrective, cmpCpW = ccm ? ccm.costPerWO.corrective : null;
  const p2 = pillPct('Corrective £/WO', curCpW, cmpCpW, 'down');
  if(curCpW != null && cmpCpW != null){
    const d = curCpW - cmpCpW;
    p2.abs = `${d >= 0 ? '+' : '−'}${fmtCurrencyFull(Math.abs(d))}`;
  }
  // Pill 3 - Reactive share pp
  const share = cm.totalCost > 0 ? (cm.reactiveCost / cm.totalCost * 100) : null;
  const cmpShare = (ccm && ccm.totalCost > 0) ? (ccm.reactiveCost / ccm.totalCost * 100) : null;
  let p3DeltaHtml = '—', p3Cls = 'neutral';
  if(share != null && cmpShare != null){
    const d = share - cmpShare;
    const arrow = d > 0.1 ? '▲' : d < -0.1 ? '▼' : '▸';
    p3Cls = Math.abs(d) < 0.5 ? 'neutral' : (d > 0 ? 'up-bad' : 'down-good');
    p3DeltaHtml = `${arrow} ${d >= 0 ? '+' : ''}${d.toFixed(1)}pp`;
  }
  // Pill 4 - PM compliance pp
  const pmV = pmm.compliancePct, cmpPmV = cpm ? cpm.compliancePct : null;
  let p4DeltaHtml = '—', p4Cls = 'neutral';
  if(pmV != null && cmpPmV != null){
    const d = pmV - cmpPmV;
    const arrow = d > 0.1 ? '▲' : d < -0.1 ? '▼' : '▸';
    p4Cls = Math.abs(d) < 0.5 ? 'neutral' : (d > 0 ? 'up-good' : 'down-bad');
    p4DeltaHtml = `${arrow} ${d >= 0 ? '+' : ''}${d.toFixed(1)}pp`;
  }

  const pill = (label, deltaHtml, deltaCls, abs, context) => `
    <div class="dd-pill">
      <div class="dd-pill-label">${escapeHtml(label)}</div>
      <div class="dd-pill-main">
        <span class="dd-pill-delta ${deltaCls}">${deltaHtml}</span>
        ${abs ? `<span class="dd-pill-abs">${escapeHtml(abs)}</span>` : ''}
      </div>
      <div class="dd-pill-context">${context}</div>
    </div>
  `;

  return [
    pill('Total spend', p1.deltaHtml, p1.deltaCls, p1.abs,
      `${cm.totalCost > 0 ? fmtCurrency(cm.totalCost) : '—'}${ccm ? ` vs ${fmtCurrency(ccm.totalCost)}` : ''}`),
    pill('Corrective £/WO', p2.deltaHtml, p2.deltaCls, p2.abs,
      `${curCpW != null ? fmtCurrencyFull(curCpW) : '—'}${cmpCpW != null ? ` vs ${fmtCurrencyFull(cmpCpW)}` : ''}`),
    pill('Reactive share', p3DeltaHtml, p3Cls, '',
      `${share != null ? fmtPct(share) : '—'}${cmpShare != null ? ` vs ${fmtPct(cmpShare)}` : ''}`),
    pill('PM compliance', p4DeltaHtml, p4Cls, '',
      `${pmV != null ? fmtPct(pmV) : '—'}${cmpPmV != null ? ` vs ${fmtPct(cmpPmV)}` : ''}`)
  ].join('');
}

function ddComputeClassPickerStats(classList){
  const focus = resolveFocusPeriod();
  const agg = STATE.filters.aggregation;
  const byClass = new Map();
  for(const r of getFilteredCostRows()){
    if(!r.assetClass || !classList.includes(r.assetClass)) continue;
    if(focus && periodKey(r, agg) !== focus) continue;
    if(!byClass.has(r.assetClass)) byClass.set(r.assetClass, { cost: [], pm: [] });
    byClass.get(r.assetClass).cost.push(r);
  }
  for(const r of getFilteredPMRows()){
    if(!r.assetClass || !classList.includes(r.assetClass)) continue;
    if(focus && periodKey(r, agg) !== focus) continue;
    if(!byClass.has(r.assetClass)) byClass.set(r.assetClass, { cost: [], pm: [] });
    byClass.get(r.assetClass).pm.push(r);
  }
  const stats = [];
  for(const ac of classList){
    const bucket = byClass.get(ac) || { cost: [], pm: [] };
    const cm = computeCostMetrics(bucket.cost);
    const pmm = computePMMetrics(bucket.pm);
    stats.push({
      assetClass: ac,
      total: cm.totalCost,
      reactive: cm.reactiveCost,
      reactiveShare: cm.totalCost > 0 ? cm.reactiveCost / cm.totalCost * 100 : null,
      pm: pmm.compliancePct,
      wo: cm.totalWO
    });
  }
  return stats;
}

function ddGetVisiblePickerStats(){
  const s = _ddPickerState;
  let arr = s.stats;
  if(s.search) arr = arr.filter(x => x.assetClass.toLowerCase().includes(s.search));
  const col = s.sortCol, dir = s.sortDir;
  arr = [...arr].sort((a,b) => {
    let av, bv;
    if(col === 'ac'){ av = a.assetClass.toLowerCase(); bv = b.assetClass.toLowerCase(); }
    else { av = a[col]; bv = b[col]; if(av == null) av = -Infinity; if(bv == null) bv = -Infinity; }
    if(av < bv) return dir === 'asc' ? -1 : 1;
    if(av > bv) return dir === 'asc' ? 1 : -1;
    return 0;
  });
  return arr;
}

function ddRenderPickerTable(){
  const tbody = document.getElementById('ddPickerTbody');
  if(!tbody || !_ddPickerState) return;
  const s = _ddPickerState;
  const visible = ddGetVisiblePickerStats();
  const rowsHtml = visible.map(x => {
    const isSel = s.selected === x.assetClass;
    const pmCls = x.pm == null ? '' : (x.pm >= 90 ? 'pct-good' : x.pm >= 70 ? 'pct-warn' : 'pct-bad');
    return `
      <tr data-ac="${escapeHtml(x.assetClass)}" ${isSel ? 'style="background:var(--tint)"' : ''}>
        <td><input type="radio" name="ddPickerRadio" ${isSel ? 'checked' : ''}></td>
        <td>${escapeHtml(x.assetClass)}</td>
        <td class="num">${x.total > 0 ? fmtCurrency(x.total) : '—'}</td>
        <td class="num">${x.reactive > 0 ? fmtCurrency(x.reactive) : '—'}</td>
        <td class="num">${x.reactiveShare != null ? fmtPct(x.reactiveShare) : '—'}</td>
        <td class="num ${pmCls}">${x.pm != null ? fmtPct(x.pm) : '—'}</td>

function ddRenderS2KPIs(){
  const el = document.getElementById('ddS2');
  if(!el) return;
  const focus = resolveFocusPeriod();
  if(!focus){ el.innerHTML = '<div class="dd-empty">No focus period available.</div>'; return; }
  const cmpMode = STATE.filters.comparisonMode;
  const cmpPeriod = resolveComparisonPeriod(focus);
  const agg = STATE.filters.aggregation;
  const partial = isFocusPeriodPartial();

  const cm = computeCostMetrics(ddRowsInPeriod('cost', focus));
  const pm = computePMMetrics(ddRowsInPeriod('pm', focus));
  let ccm = null, cpm = null;
  if(cmpMode !== 'none' && cmpPeriod){
    if(cmpPeriod === '3yr-avg'){
      ccm = computeCostMetrics(rowsFor3YrAvg(ddFilteredCostRows(), focus, agg));
      cpm = computePMMetrics(rowsFor3YrAvg(ddFilteredPMRows(), focus, agg));
    } else {
      ccm = computeCostMetrics(ddRowsInPeriod('cost', cmpPeriod));
      cpm = computePMMetrics(ddRowsInPeriod('pm', cmpPeriod));
    }
  }
  const sparkPeriods = ovGetSparklinePeriods(focus);
  const sparkData = ddComputeSparklineData(sparkPeriods);
  const focusIdx = sparkPeriods.indexOf(focus);

  const cmpLbl = comparisonModeLabel();
  const compareSpan = (cmpMode === 'none') ? '' : `<span class="ov-compare">compared to ${escapeHtml(cmpLbl)}</span>`;
  const partialMark = partial ? ` <span style="color:var(--warning)" title="partial period">*</span>` : '';

  const t1 = ddTile_Spend(cm, ccm, sparkPeriods, sparkData, focusIdx, partial);
  const t2 = ddTile_CorrectiveWOs(cm, ccm, sparkPeriods, sparkData, focusIdx, partial);
  const t3 = ddTile_CostPerWO(cm, ccm, sparkPeriods, sparkData, focusIdx, partial);
  const t4 = ddTile_ReactiveShare(cm, ccm, sparkPeriods, sparkData, focusIdx, partial);
  const t5 = ddTile_PMCompliance(pm, cpm, sparkPeriods, sparkData, focusIdx, partial);

  el.innerHTML = `
    <div class="ov-period-header">
      <span class="ov-focus">For ${escapeHtml(focus)}${partialMark}</span>
      ${compareSpan}
    </div>
    <div class="ov-kpi-row" style="grid-template-columns:repeat(5,1fr)">${t1}${t2}${t3}${t4}${t5}</div>
  `;
}

function ddTile_Spend(cm, ccm, periods, data, focusIdx, partial){
  const val = cm.totalCost;
  const valStr = val > 0 ? fmtCurrency(val) + (partial ? '*' : '') : '—';
  let deltaHtml = '—', deltaCls = 'neutral';
  if(ccm && ccm.totalCost > 0){
    const d = val - ccm.totalCost, pct = d / ccm.totalCost * 100;
    const arrow = d > 1 ? '▲' : d < -1 ? '▼' : '▸';
    deltaCls = Math.abs(pct) < 1 ? 'neutral' : (d > 0 ? 'up-bad' : 'down-good');
    deltaHtml = `${arrow} ${d >= 0 ? '+' : ''}${pct.toFixed(1)}% (${fmtCurrency(Math.abs(d))})`;
  }
  const sparkVals = periods.map(p => { const s = data.get(p); return (s && s.hasCost) ? s.totalCost : null; });
  const spark = ovBuildSparkline(sparkVals, COLORS.warning, focusIdx, periods);
  const vol = cm.totalWO > 0 ? `${fmtNum(cm.totalWO)} WOs` : '';
  return ovRenderTile('Total spend', valStr, deltaHtml, deltaCls, spark, fmtCurrency, ovSparkSpanLabel(periods), vol);
}

function ddTile_CorrectiveWOs(cm, ccm, periods, data, focusIdx, partial){
  const val = cm.correctiveWO;
  const valStr = val > 0 ? fmtNum(val) + (partial ? '*' : '') : '—';
  let deltaHtml = '—', deltaCls = 'neutral';
  if(ccm && ccm.correctiveWO > 0){
    const d = val - ccm.correctiveWO, pct = d / ccm.correctiveWO * 100;
    const arrow = d > 0 ? '▲' : d < 0 ? '▼' : '▸';
    deltaCls = Math.abs(pct) < 1 ? 'neutral' : (d > 0 ? 'up-bad' : 'down-good');
    deltaHtml = `${arrow} ${d >= 0 ? '+' : ''}${pct.toFixed(1)}%`;
  }
  const sparkVals = periods.map(p => { const s = data.get(p); return (s && s.hasCost) ? s.correctiveWO : null; });
  const spark = ovBuildSparkline(sparkVals, COLORS.neutral, focusIdx, periods);
  const vol = cm.reactiveWO > 0 ? `${fmtNum(cm.reactiveWO)} R · ${fmtNum(cm.proactiveWO)} P` : '';
  return ovRenderTile('Corrective WOs', valStr, deltaHtml, deltaCls, spark, v => fmtNum(Math.round(v)), ovSparkSpanLabel(periods), vol);
}

function ddTile_CostPerWO(cm, ccm, periods, data, focusIdx, partial){
  const val = cm.costPerWO.corrective;
  const valStr = val != null ? fmtCurrencyFull(val) + (partial ? '*' : '') : '—';
  let deltaHtml = '—', deltaCls = 'neutral';
  if(val != null && ccm && ccm.costPerWO.corrective != null){
    const d = val - ccm.costPerWO.corrective, pct = d / ccm.costPerWO.corrective * 100;
    const arrow = d > 0.01 ? '▲' : d < -0.01 ? '▼' : '▸';
    deltaCls = Math.abs(pct) < 1 ? 'neutral' : (d > 0 ? 'up-bad' : 'down-good');
    deltaHtml = `${arrow} ${d >= 0 ? '+' : ''}${pct.toFixed(1)}%`;
  }
  const sparkVals = periods.map(p => {
    const s = data.get(p);
    if(!s || !s.hasCost) return null;
    const wo = s.reactiveWO + s.proactiveWO;
    if(wo <= 0) return null;
    return (s.reactiveCost + s.proactiveCost) / wo;
  });
  const spark = ovBuildSparkline(sparkVals, COLORS.warning, focusIdx, periods);
  const vol = cm.correctiveWO > 0 ? `${fmtNum(cm.correctiveWO)} corrective WOs` : '';

}

function ddTile_ReactiveShare(cm, ccm, periods, data, focusIdx, partial){
  const share = cm.totalCost > 0 ? (cm.reactiveCost / cm.totalCost * 100) : null;
  const valStr = share != null ? fmtPct(share) + (partial ? '*' : '') : '—';
  let deltaHtml = '—', deltaCls = 'neutral';
  if(share != null && ccm && ccm.totalCost > 0){
    const cmpShare = ccm.reactiveCost / ccm.totalCost * 100;
    const d = share - cmpShare;
    const arrow = d > 0.1 ? '▲' : d < -0.1 ? '▼' : '▸';
    deltaCls = Math.abs(d) < 0.5 ? 'neutral' : (d > 0 ? 'up-bad' : 'down-good');
    deltaHtml = `${arrow} ${d >= 0 ? '+' : ''}${d.toFixed(1)}pp`;
  }
  const sparkVals = periods.map(p => {
    const s = data.get(p);
    if(!s || !s.hasCost || s.totalCost <= 0) return null;
    return s.reactiveCost / s.totalCost * 100;
  });
  const spark = ovBuildSparkline(sparkVals, COLORS.danger, focusIdx, periods);
  const vol = cm.reactiveWO > 0 ? `${fmtCurrency(cm.reactiveCost)} of ${fmtCurrency(cm.totalCost)}` : '';
  return ovRenderTile('Reactive share', valStr, deltaHtml, deltaCls, spark, v => v.toFixed(0) + '%', ovSparkSpanLabel(periods), vol);
}

function ddTile_PMCompliance(pm, cpm, periods, data, focusIdx, partial){
  const val = pm.compliancePct;
  const valStr = val != null ? fmtPct(val) + (partial ? '*' : '') : '—';
  let deltaHtml = '—', deltaCls = 'neutral';
  if(val != null && cpm && cpm.compliancePct != null){
    const d = val - cpm.compliancePct;
    const arrow = d > 0.1 ? '▲' : d < -0.1 ? '▼' : '▸';
    deltaCls = Math.abs(d) < 0.5 ? 'neutral' : (d > 0 ? 'up-good' : 'down-bad');
    deltaHtml = `${arrow} ${d >= 0 ? '+' : ''}${d.toFixed(1)}pp`;
  }
  const sparkVals = periods.map(p => {
    const s = data.get(p);
    if(!s || !s.hasPM || s.pmTotal <= 0) return null;
    return (1 - s.pmOverdue / s.pmTotal) * 100;

  const spark = ovBuildSparkline(sparkVals, COLORS.primary, focusIdx, periods);
  const vol = pm.totalTasks > 0 ? `${fmtNum(pm.onTimeTasks)} of ${fmtNum(pm.totalTasks)} tasks` : '';
  return ovRenderTile('PM compliance', valStr, deltaHtml, deltaCls, spark, v => v.toFixed(0) + '%', ovSparkSpanLabel(periods), vol);
}

// ---------- Split-by helpers (applies to Section 3 right, Section 4 left + right) ----------
// Build N line-chart series, one per group (county or business area), by grouping rows
// per (period, group) and calling pointFn(rowsInBucket) -> {y, tooltipExtra}.
// For county: top 6 by total £ + "Other" covering the tail.
// For BA: all business areas in canonical order, with any extras appended.
function ddBuildSplitSeries(rows, dimension, periods, pointFn){
  const aggK = STATE.filters.aggregation;
  const bucket = new Map();     // key "period||group" -> row[]
  const groupTotals = new Map();
  // "No county" covers rows where county is null (Bio-resourcing, Wastewater Network, Other Area,
  // Unknown plant) — these are excluded from the global county dropdown but are real data, so we
  // surface them here as a separate group rather than silently folding into 'Unknown'.
  const dimOf = (r) => dimension === 'county' ? (r.county || 'No county') : (r.businessArea || 'No business area');
  for(const r of rows){
    const p = periodKey(r, aggK);
    const g = dimOf(r);
    const k = p + '||' + g;
    let arr = bucket.get(k);
    if(!arr){ arr = []; bucket.set(k, arr); }
    arr.push(r);
    groupTotals.set(g, (groupTotals.get(g) || 0) + (r.totalCost || 0));
  }
  let groups;
  let otherList = [];
  if(dimension === 'county'){
    const ranked = [...groupTotals.entries()].sort((a,b) => b[1] - a[1]);
    groups = ranked.slice(0, 6).map(e => e[0]);
    otherList = ranked.slice(6).map(e => e[0]);
    if(otherList.length) groups.push('__OTHER__');
  } else {
    const baCanonical = ['Water','Wastewater','WW Network','Bio-resourcing'];
    groups = baCanonical.filter(b => groupTotals.has(b))
      .concat([...groupTotals.keys()].filter(b => !baCanonical.includes(b)).sort());
  }
  return groups.map((g, i) => {
    const label = g === '__OTHER__' ? `Other (${otherList.length})` : g;
    const color = g === '__OTHER__' ? COLORS.neutral : COLORS.series[i % COLORS.series.length];
    const points = periods.map(p => {
      let grp = [];
      if(g === '__OTHER__'){
        for(const o of otherList){ const arr = bucket.get(p + '||' + o); if(arr) grp = grp.concat(arr); }
      } else {
        grp = bucket.get(p + '||' + g) || [];
      }
      return pointFn(grp);
    });
    return { name: label, color, points };
  });
}

// Build stacked-bar series split by dimension — returns array of {name, color, values[]}
// suitable for renderStackedBarChart. valueFn(row) returns the scalar summed into each bucket.
function ddBuildSplitStackedValues(rows, dimension, periods, valueFn){
  const aggK = STATE.filters.aggregation;
  const bucket = new Map();       // "period||group" -> summed value
  const groupTotals = new Map();
  const dimOf = (r) => dimension === 'county' ? (r.county || 'No county') : (r.businessArea || 'No business area');
  for(const r of rows){
    const p = periodKey(r, aggK);
    const g = dimOf(r);
    const v = valueFn(r) || 0;
    const k = p + '||' + g;
    bucket.set(k, (bucket.get(k) || 0) + v);
    groupTotals.set(g, (groupTotals.get(g) || 0) + v);
  }
  let groups;
  let otherList = [];
  if(dimension === 'county'){
    const ranked = [...groupTotals.entries()].sort((a,b) => b[1] - a[1]);
    groups = ranked.slice(0, 6).map(e => e[0]);
    otherList = ranked.slice(6).map(e => e[0]);
    if(otherList.length) groups.push('__OTHER__');
  } else {
    const baCanonical = ['Water','Wastewater','WW Network','Bio-resourcing'];
    groups = baCanonical.filter(b => groupTotals.has(b))
      .concat([...groupTotals.keys()].filter(b => !baCanonical.includes(b)).sort());
  }
  return groups.map((g, i) => {
    const label = g === '__OTHER__' ? `Other (${otherList.length})` : g;
    const color = g === '__OTHER__' ? COLORS.neutral : COLORS.series[i % COLORS.series.length];
    const values = periods.map(p => {
      if(g === '__OTHER__'){
        let sum = 0;
        for(const o of otherList) sum += bucket.get(p + '||' + o) || 0;
        return sum;
      }
      return bucket.get(p + '||' + g) || 0;
    });
    return { name: label, color, values };
  });
}
// Map-lookup: for a given site, which group is it in (county or BA)?
// Used by scatter + Pareto to colour-code sites by their group.
function ddGroupForSite(dimension, site, rows){
  if(!rows) return null;
  // Take the first row for this site in the given filtered set
  const r = rows.find(x => x.site === site);
  if(!r) return null;
  return dimension === 'county' ? (r.county || 'No county') : (r.businessArea || 'No business area');
}
// Build a stable site → color map for the given dimension using the same ordering
// rule as the split helpers (top 6 counties by total £ + Other; canonical BA order).
function ddGroupColorMap(dimension, rows){
  const groupTotals = new Map();
  const dimOf = (r) => dimension === 'county' ? (r.county || 'No county') : (r.businessArea || 'No business area');
  for(const r of rows){
    const g = dimOf(r);
    groupTotals.set(g, (groupTotals.get(g) || 0) + (r.totalCost || 0));
  }
  let groups;
  let otherList = [];
  if(dimension === 'county'){
    const ranked = [...groupTotals.entries()].sort((a,b) => b[1] - a[1]);
    groups = ranked.slice(0, 6).map(e => e[0]);
    otherList = ranked.slice(6).map(e => e[0]);
  } else {
    const baCanonical = ['Water','Wastewater','WW Network','Bio-resourcing'];
    groups = baCanonical.filter(b => groupTotals.has(b))
      .concat([...groupTotals.keys()].filter(b => !baCanonical.includes(b)).sort());
  }
  const colorMap = new Map();
  groups.forEach((g, i) => colorMap.set(g, COLORS.series[i % COLORS.series.length]));
  for(const g of otherList) colorMap.set(g, COLORS.neutral);
  return { colorMap, topGroups: groups, otherList };
}

function ddRenderVolumeBars(host, periods, values, partial){
  host.innerHTML = '';
  if(!periods.length){ return; }
  const height = 70;
  const margin = { top: 2, right: 20, bottom: 2, left: 60 };
  const w = host.clientWidth || 500;
  const width = Math.max(300, w);
  const innerW = width - margin.left - margin.right;
  const innerH = height - margin.top - margin.bottom;
  const maxV = Math.max(1, ...values);
  const svg = svgEl('svg', { viewBox: `0 0 ${width} ${height}`, preserveAspectRatio: 'xMidYMid meet' });
  const barStep = innerW / periods.length;
  const barW = Math.max(2, barStep * 0.75);
  periods.forEach((p, i) => {
    const v = values[i] || 0;
    const bh = (v / maxV) * innerH;
    const x = margin.left + barStep * i + (barStep - barW) / 2;
    const y = margin.top + innerH - bh;
    const rect = svgEl('rect', {
      x: x.toFixed(1), y: y.toFixed(1), width: barW.toFixed(1), height: bh.toFixed(1),
      fill: COLORS.neutral, 'fill-opacity': 0.35
    });
    addTooltip(rect, `<div class="tt-title">${escapeHtml(p)}${partial.has(p) ? ' (partial)' : ''}</div><div class="tt-row"><span class="tt-label">Corrective WOs:</span><span>${fmtNum(v)}</span></div>`);
    svg.appendChild(rect);
  });
  host.appendChild(svg);
}

    { name: 'Other', color: COLORS.neutral, values: mk('reactiveOther') }
  ];
  const proactiveSeries = [
    { name: 'Labour', color: '#1565c0', values: mk('proactiveLabour') },
    { name: 'Contractor', color: COLORS.accent, values: mk('proactiveContractor') },
    { name: 'Materials', color: COLORS.warning, values: mk('proactiveMaterials') },
    { name: 'Other', color: COLORS.neutral, values: mk('proactiveOther') }
  ];

  const focusIdx = periods.indexOf(focus);
  const mkSlices = (seriesArr) => seriesArr.map(s => ({
    name: s.name, color: s.color, value: focusIdx >= 0 ? (s.values[focusIdx] || 0) : 0
  }));
  const reactiveSlices = mkSlices(reactiveSeries);
  const proactiveSlices = mkSlices(proactiveSeries);
  const reactiveTotal = reactiveSlices.reduce((s,x) => s + x.value, 0);
  const proactiveTotal = proactiveSlices.reduce((s,x) => s + x.value, 0);

  const buildLegend = (slices, total) => slices.map(s => {
    const pct = total > 0 ? (s.value / total * 100) : 0;
    return `<div class="li"><span><span class="sw" style="background:${s.color}"></span>${escapeHtml(s.name)}</span><span>${fmtCurrency(s.value)} <span style="color:#999">(${pct.toFixed(0)}%)</span></span></div>`;
  }).join('');

  const split = STATE.section2.splitBy || 'none';
  const splitLbl = split === 'county' ? 'county' : 'business area';
  const trendContext = split === 'none'
    ? 'Bars = composition over time (labour / contractor / materials / other).'
    : 'Bars = composition over time, split by ' + splitLbl + '. Donut continues to show labour / contractor / materials / other for the focus period.';

  el.innerHTML = `
    <h3 class="ov-section-title">Where the money goes</h3>
    <div class="dd-split">
      <div class="ov-card">
        <div class="ov-card-header">
          <h3 class="ov-card-title">Reactive spend composition</h3>
          <div class="ov-card-controls">${ddSplitByDropdownHtml()}</div>
        </div>
        <div class="ov-chart-context">Donut = focus period (${escapeHtml(focus || '—')}). ${trendContext}</div>
        <div class="dd-cat-body">
          <div class="dd-donut-wrap">
            <div id="ddS5ReactiveDonut"></div>
            <div class="dd-donut-total"><strong>${fmtCurrency(reactiveTotal)}</strong>total reactive</div>
            <div class="dd-donut-legend">${buildLegend(reactiveSlices, reactiveTotal)}</div>
          </div>
          <div id="ddS5ReactiveTrend"></div>
        </div>
      </div>
      <div class="ov-card">
        <div class="ov-card-header">
          <h3 class="ov-card-title">Proactive spend composition</h3>
          <div class="ov-card-controls">${ddSplitByDropdownHtml()}</div>
        </div>
        <div class="ov-chart-context">Donut = focus period (${escapeHtml(focus || '—')}). ${trendContext}</div>
        <div class="dd-cat-body">
          <div class="dd-donut-wrap">
            <div id="ddS5ProactiveDonut"></div>
            <div class="dd-donut-total"><strong>${fmtCurrency(proactiveTotal)}</strong>total proactive</div>
            <div class="dd-donut-legend">${buildLegend(proactiveSlices, proactiveTotal)}</div>
          </div>
          <div id="ddS5ProactiveTrend"></div>
        </div>
      </div>

  `;

  ddRenderDonut(document.getElementById('ddS5ReactiveDonut'), reactiveSlices, 130, 28);
  ddRenderDonut(document.getElementById('ddS5ProactiveDonut'), proactiveSlices, 130, 28);

  // Reactive trend — aggregate stacks by category, split by dimension restacks per county/BA using reactive £
  const rHost = document.getElementById('ddS5ReactiveTrend');
  let rTrendSeries;
  if(split === 'none'){
    rTrendSeries = reactiveSeries;
  } else {
    rTrendSeries = ddBuildSplitStackedValues(rows, split, periods, r => r.reactiveCost || 0);

  if(rTrendSeries.some(s => s.values.some(v => v > 0))){

  } else {

  const pHost = document.getElementById('ddS5ProactiveTrend');

  if(split === 'none'){

  if(pTrendSeries.some(s => s.values.some(v => v > 0))){
    renderStackedBarChart(pHost, pTrendSeries, periods, { fmt: fmtCurrency, height: 220, partialPeriods: partial });
  } else {

  ddWireSplitByDropdowns();
}

function ddRenderDonut(host, slices, size, strokeW){
  host.innerHTML = '';
  size = size || 120;
  strokeW = strokeW || 24;
  const r = (size - strokeW) / 2;
  const cx = size / 2, cy = size / 2;
  const total = slices.reduce((s, x) => s + (x.value || 0), 0);
  const svg = svgEl('svg', { width: size, height: size, viewBox: `0 0 ${size} ${size}` });
  if(total <= 0){
    svg.appendChild(svgEl('circle', { cx, cy, r, fill: 'none', stroke: '#f0f0f0', 'stroke-width': strokeW }));
    host.appendChild(svg);
    return;
  }
  let angle = -Math.PI / 2;
  slices.forEach(s => {
    const frac = s.value / total;
    if(frac <= 0) return;
    const endAngle = angle + frac * 2 * Math.PI;
    const large = frac > 0.5 ? 1 : 0;
    const x0 = cx + r * Math.cos(angle), y0 = cy + r * Math.sin(angle);
    // Handle full-circle edge case
    if(frac >= 0.9999){
      svg.appendChild(svgEl('circle', { cx, cy, r, fill: 'none', stroke: s.color, 'stroke-width': strokeW }));
      angle = endAngle;
      return;
    }
    const x1 = cx + r * Math.cos(endAngle), y1 = cy + r * Math.sin(endAngle);
    const path = svgEl('path', {
      d: `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`,
      fill: 'none', stroke: s.color, 'stroke-width': strokeW
    });
    addTooltip(path, `<div class="tt-title">${escapeHtml(s.name)}</div><div class="tt-row"><span>${fmtCurrency(s.value)}</span><span style="margin-left:12px">${(frac*100).toFixed(1)}%</span></div>`);
    svg.appendChild(path);
    angle = endAngle;
  });
  host.appendChild(svg);
}
