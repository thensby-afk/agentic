// ============================================================
// Forward-look — projection math (pure functions)
// ============================================================

// Fixed lag between PM compliance changes and their effect on reactive volume / £/WO.
// 6 months reflects the typical UU operational reality — neglected assets continue to
// generate reactive work for some months after PM improves; the benefit of better PM
// today only shows up in the data ~6 months later.
const FL_LAG_MONTHS = 6;

// Fit the historical relationship between a metric and PM compliance, using the 6-month lag.
// Returns { elasticity, r2, n, drift }:
//   elasticity — the value used in V(c) = v0 * exp(-elasticity * (c - c0)).
//                Positive = volume falls as compliance rises (conventional).
//                Negative = volume rises as compliance rises (what we see in the user's data).
//                Capped to [-0.20, +0.20] to prevent runaway from degenerate fits.
//   r2         — coefficient of determination (0..1). Used to surface fit quality.
//   n          — number of (lagged-compliance, value) pairs used.
//   drift      — fitted constant monthly %-change of the value series (used by natural-drift toggle).
// `window` is the number of months of value history to use; lagged compliance can be looked up
// from beyond the window (using the full history we have).
function flFitElasticityFromHistory(history, valueGetter, lag, window){
  if(!history || !history.length) return { elasticity: 0, r2: 0, n: 0, drift: 0 };
  // Cache key uses the function source as a stable identifier for the value getter.
  // Same history reference + same getter + same lag/window ⇒ identical fit.
  // Cache key MUST include the asset class/type. The valueGetter arrows (e.g. r=>r.reactive.wo)
  // stringify identically for every class, and lag/window are global — so without the class in
  // the key, a multi-class sweep (Forecast result roll-up, or output toggles when the render
  // cache persists) would reuse the FIRST class's fitted elasticity for every later class.
  // The fit is a function of `history`, which is class-specific, so the class belongs in the key.
  const s3 = STATE.section3;
  const cacheKey = '_flFit_' + (s3.assetClass || '') + '_' + (s3.assetType || '') + '_' + lag + '_' + window + '_i' + (STATE.inflationPct || 0) + '_c' + [...STATE.filters.criticality].sort().join(',') + '_' + (valueGetter && valueGetter.toString());
  if(_renderCache && _renderCache[cacheKey]) return _renderCache[cacheKey];
  const tail = history.slice(-window);
  const fullCompliance = history.map(r => r.pmPct);
  const startIdx = history.length - tail.length;
  const pairs = [];
  for(let i = 0; i < tail.length; i++){
    const v = valueGetter(tail[i]);
    const cIdx = startIdx + i - lag;
    const c = (cIdx >= 0 && cIdx < fullCompliance.length) ? fullCompliance[cIdx] : null;
    if(v != null && v > 0 && c != null && isFinite(c)) pairs.push([c, Math.log(v)]);
  }
  const drift = flFitMonthlyRate(tail.map(valueGetter), window);
  const memo = (v) => { if(_renderCache) _renderCache[cacheKey] = v; return v; };
  // recentDrift = monthly rate fitted over the last 6 months only — used by the
  // auto-drift fallback so the projection tracks the *recent* level rather than
  // extrapolating a long-run decline that the user's chosen window may capture.
  const recentDrift = flFitMonthlyRate(history.map(valueGetter), 6);
  if(pairs.length < 4) return memo({ elasticity: 0, r2: 0, n: pairs.length, drift, recentDrift });
  const n = pairs.length;
  const meanX = pairs.reduce((s,p) => s + p[0], 0) / n;
  const meanY = pairs.reduce((s,p) => s + p[1], 0) / n;
  let num = 0, den = 0;
  for(const [x, y] of pairs){
    num += (x - meanX) * (y - meanY);
    den += (x - meanX) ** 2;
  }
  if(den === 0) return memo({ elasticity: 0, r2: 0, n, drift, recentDrift });
  const slope = num / den;
  let ssRes = 0, ssTot = 0;
  for(const [x, y] of pairs){
    const yPred = meanY + slope * (x - meanX);
    ssRes += (y - yPred) ** 2;
    ssTot += (y - meanY) ** 2;
  }
  const r2 = ssTot > 0 ? Math.max(0, 1 - ssRes / ssTot) : 0;
  // V(c) = v0 * exp(-elasticity * (c - c0))  ⇒  log(V) − log(v0) = −elasticity · (c − c0)
  // Slope of log(V) wrt c is therefore −elasticity, so elasticity = −slope.
  const elasticityCapped = Math.max(-0.20, Math.min(0.20, -slope));
  return memo({ elasticity: elasticityCapped, r2, n, drift, recentDrift });
}

// Map R² to a quality label + CSS class. Threshold from working agreement with the user.
function flFitQuality(r2){
  if(r2 >= 0.5)  return { label: 'Strong',    cls: 'good' };
  if(r2 >= 0.25) return { label: 'Moderate',  cls: 'moderate' };
  if(r2 >= 0.10) return { label: 'Weak',      cls: 'weak' };
  return { label: 'Very weak', cls: 'very-weak' };
}

// True when both user-modelled corrective fits (volume + £/WO) are "Very weak" (R² < 0.10).
// Used to auto-enable natural drift so the projection gently extends the recent trend.
function flAllFitsVeryWeak(fits){
  if(!fits) return false;
  const keys = ['correctiveVol','correctiveCpw'];
  return keys.every(k => fits[k] && fits[k].n >= 4 && fits[k].r2 < 0.10);
}

// Map an anchor key to a month-count window. 'last' = 1 (single most recent value);
// '3mo' / '6mo' / '12mo' = rolling mean over the last N months.
const FL_ANCHOR_WINDOW = { 'last': 1, '3mo': 3, '6mo': 6, '12mo': 12 };
const FL_ANCHOR_LABEL  = { 'last': 'Last month', '3mo': '3-month avg', '6mo': '6-month avg', '12mo': '12-month avg' };

// Average of the last N non-null, finite values returned by getter(historyRow).
// Used to compute the projection anchor — replaces "last value" with a smoothed
// estimate that ignores single-month noise.
function flAnchorAverage(history, getter, n){
  if(!history || !history.length) return null;
  const tail = history.slice(-n);
  let sum = 0, cnt = 0;
  for(const r of tail){
    const v = getter(r);
    if(v != null && isFinite(v)) { sum += v; cnt++; }
  }
  return cnt > 0 ? sum / cnt : null;
}

// Build the {reactive, proactive, preventative, c0} anchor object that flComputeProjection
// uses as v0 / c0. For the 'last' anchor, returns the most recent month's values directly
// (equivalent to the old behaviour). For 3mo/6mo/12mo, returns rolling means.
function flBuildAnchor(history, anchorKey){
  if(!history || !history.length) return null;
  const n = FL_ANCHOR_WINDOW[anchorKey] || 1;
  const last = history[history.length - 1];
  if(n === 1){
    return {
      corrective: { wo: last.corrective.wo, cpw: last.corrective.cpw },
      preventative: { wo: last.preventative.wo, cpw: last.preventative.cpw },
      c0: last.pmPct,
      windowN: 1
    };
  }
  return {
    corrective:  { wo: flAnchorAverage(history, r => r.corrective.wo,  n), cpw: flAnchorAverage(history, r => r.corrective.cpw,  n) },
    preventative:{ wo: flAnchorAverage(history, r => r.preventative.wo,n), cpw: flAnchorAverage(history, r => r.preventative.cpw,n) },
    c0: flAnchorAverage(history, r => r.pmPct, n),
    windowN: n
  };
}

// Sensitivity presets map a user-friendly label to two parameters:
//   floor    — asymptotic minimum as a % of current value (hard lower bound)
//   elasticity — fractional change per 1pp compliance change (e.g. 0.05 = 5%
//                volume reduction per +1pp compliance, applied as a negative
//                elasticity in the log-linear model).
// The projection is anchored at (c0, v0): V(c) = max(floor*v0, v0*exp(-elasticity*(c-c0))).
// This gives diminishing-returns S-curve feel (compounding ratios) while
// guaranteeing V(c0) = v0 — no jump at the projection boundary.
const FL_SENSITIVITY_PRESETS = {
  'low':         { floor: 80, elasticity: 0.005 },
  'medium':      { floor: 50, elasticity: 0.025 },
  'medium-high': { floor: 40, elasticity: 0.04  },
  'high':        { floor: 30, elasticity: 0.06  }
};
const FL_SENSITIVITY_ORDER = ['low','medium','medium-high','high','custom'];
const FL_SENSITIVITY_LABEL = { low:'Low', medium:'Medium', 'medium-high':'Medium-high', high:'High', custom:'Custom' };

// Resolve sensitivity (preset or custom) to {floor, elasticity}.
function flResolveSensitivity(sensitivityKey, customParams){
  if(sensitivityKey === 'custom') return { ...customParams };
  return { ...FL_SENSITIVITY_PRESETS[sensitivityKey] };
}

// Constant monthly %-change fitted to a series. Uses log-linear regression
// over the last n non-null, positive values. Returns the rate as a fraction
// (e.g. 0.021 = 2.1%/month). Returns 0 if not enough history.
function flFitMonthlyRate(values, n){
  const tail = values.slice(-n).filter(v => v != null && isFinite(v) && v > 0);
  if(tail.length < 2) return 0;
  const xs = tail.map((_, i) => i);
  const ys = tail.map(v => Math.log(v));
  const meanX = xs.reduce((a,b) => a+b, 0) / xs.length;
  const meanY = ys.reduce((a,b) => a+b, 0) / ys.length;
  let num = 0, den = 0;
  for(let i = 0; i < xs.length; i++){
    num += (xs[i] - meanX) * (ys[i] - meanY);
    den += (xs[i] - meanX) ** 2;
  }
  if(den === 0) return 0;
  const slope = num / den; // log per month
  const rate = Math.exp(slope) - 1;
  // Cap at +/-50% per month to keep projections sane
  return Math.max(-0.5, Math.min(0.5, rate));
}

// Linear (not log-linear) least-squares slope for percentage compliance series.
// Returns slope in pp per month.
function flFitTrendSlope(values, n){
  const tail = values.slice(-n).filter(v => v != null && isFinite(v));
  if(tail.length < 2) return 0;
  const xs = tail.map((_, i) => i);
  const meanX = xs.reduce((a,b) => a+b, 0) / xs.length;
  const meanY = tail.reduce((a,b) => a+b, 0) / tail.length;
  let num = 0, den = 0;
  for(let i = 0; i < xs.length; i++){
    num += (xs[i] - meanX) * (tail[i] - meanY);
    den += (xs[i] - meanX) ** 2;
  }
  if(den === 0) return 0;
  return num / den;
}

// Build the compliance trajectory for the projection horizon.
// trajectory = { kind: 'flat' | 'improve' | 'trend', targetPct, byMonth }
// historicalCompliance = recent monthly compliance values (for slope fitting)
// Returns an array of length horizon with the modelled compliance % at each month.
function flProjectComplianceSeries(c0, trajectory, historicalCompliance, horizon){
  if(c0 == null) c0 = 0;
  const out = [];
  if(trajectory.kind === 'flat'){
    for(let t = 1; t <= horizon; t++) out.push(c0);
  } else if(trajectory.kind === 'improve'){
    const target = trajectory.targetPct, n = Math.max(1, trajectory.byMonth);
    for(let t = 1; t <= horizon; t++){
      const ramp = Math.min(t / n, 1);
      out.push(c0 + (target - c0) * ramp);
    }
  } else if(trajectory.kind === 'trend'){
    const slope = flFitTrendSlope(historicalCompliance, 6);
    for(let t = 1; t <= horizon; t++){
      // Cap at [0, 100]
      out.push(Math.max(0, Math.min(100, c0 + slope * t)));
    }
  } else {
    for(let t = 1; t <= horizon; t++) out.push(c0);
  }
  return out;
}

// Project a metric (volume or £/WO) using log-linear elasticity anchored at (c0, v0).
//   V(c) = max(floor*v0, v0 * exp(-elasticity * (c - c0)))
// elasticity is a positive number; it's applied as a negative exponent so that
// rising compliance reduces volume. At c=c0, V=v0 exactly (no boundary jump).
// Below c0 (worsening compliance), V rises by the same compounding ratio,
// capped at 3*v0 to prevent runaway in pathological scenarios.
// floor is a % of v0 (e.g. 30 = floor at 30% of current).
function flProjectLogistic(v0, floorPct, elasticity, complianceSeries, c0){
  if(v0 == null || !isFinite(v0)) return complianceSeries.map(() => null);
  const vFloor = v0 * (floorPct / 100);
  const vCap = v0 * 3;
  return complianceSeries.map(c => {
    const delta = c - c0;
    const v = v0 * Math.exp(-elasticity * delta);
    return Math.max(vFloor, Math.min(vCap, v));
  });
}

// Project manually using a constant monthly %-change with a 10%-of-v0 floor.
function flProjectManual(v0, monthlyRate, horizon){
  if(v0 == null || !isFinite(v0)) return Array(horizon).fill(null);
  const floor = v0 * 0.10;
  const out = [];
  let cur = v0;
  for(let t = 1; t <= horizon; t++){
    cur = Math.max(cur * (1 + monthlyRate), floor);
    out.push(cur);
  }
  return out;
}

// Aggregate a series of monthly records to FY-Quarter or FY grain.
// `records` is an array of { ym, monthLabel, reactive:{wo,cost}, ..., pmPct, pmTasks, pmOverdue }.
// Returns equivalent records at the new grain. £/WO is recomputed sum-then-divide;
// PM compliance is weighted by Σtasks.
function flAggregateMonthly(records, grain){
  if(grain === 'month') return records.map(r => ({ ...r, periodLabel: r.monthLabel }));
  const buckets = new Map();
  const keyFn = (r) => {
    const [y, m] = r.ym.split('-').map(Number);
    const fy = computeFY(y, m);
    if(grain === 'fy') return { key: 'FY' + String(fy).slice(-2), order: fy * 10 };
    // FY quarter
    const q = computeFYQuarter(m);
    return { key: 'FY' + String(fy).slice(-2) + ' Q' + q, order: fy * 10 + q };
  };
  for(const r of records){
    const k = keyFn(r);
    let buc = buckets.get(k.key);
    if(!buc){
      buc = {
        periodLabel: k.key, _order: k.order, isProj: !!r.isProj,
        reactive:{wo:0,cost:0}, proactive:{wo:0,cost:0}, preventative:{wo:0,cost:0},
        corrective:{wo:0,cost:0}, total:{wo:0,cost:0},
        pmTasks: 0, pmOverdue: 0
      };
      buckets.set(k.key, buc);
    }
    if(r.isProj) buc.isProj = true;
    ['reactive','proactive','preventative','corrective','total'].forEach(g => {
      buc[g].wo += r[g].wo || 0;
      buc[g].cost += r[g].cost || 0;
    });
    buc.pmTasks += r.pmTasks || 0;
    buc.pmOverdue += r.pmOverdue || 0;
  }
  const out = [...buckets.values()].sort((a,b) => a._order - b._order);
  for(const buc of out){
    ['reactive','proactive','preventative','corrective','total'].forEach(g => {
      buc[g].cpw = buc[g].wo > 0 ? buc[g].cost / buc[g].wo : null;
    });
    buc.pmPct = buc.pmTasks > 0 ? (1 - buc.pmOverdue / buc.pmTasks) * 100 : null;
    delete buc._order;
  }
  return out;
}

// Compute the projection: given history + scenario state, return an array of
// { ym, monthLabel, isProj:true, ...metrics, pmPct, pmTasks, pmOverdue:null }.
// Compute the projection with a 6-month lag between compliance and reactive volume / £-per-WO.
//
// Display horizon is automatically extended by FL_LAG_MONTHS so the user sees the FULL effect
// of any compliance trajectory they set. e.g. if user picks "improve to 90% by month 12" with
// a 12-month horizon, the projection actually runs for 18 months — months 13-18 reveal the
// lagged response of the final compliance level.
//
// For each projected month t, the volume / £-per-WO are computed from the compliance value
// at month (t − 6). For early months (t ≤ 6) the lookback falls into HISTORY, so we use
// the last 6 months of historical compliance. For later months it's inside the projection
// trajectory itself.
//
// Baseline scenario for the "vs baseline" delta: same lag mechanics, but using the
// baselineKind compliance trajectory ('flat' / 'trend' / 'custom').
//
// PM tasks/overdue are not modelled — projected pmTasks is set to the rolling 6-month
// historical average so weighted aggregation at FY grain still works.
function flComputeProjection(history, scenario){
  if(!history.length) return { projection: [], complianceSeries: [], displayHorizon: 0, trajectoryHorizon: 0, fits: {} };
  // Cache by a fingerprint of the scenario inputs that affect the projection.
  // Identical inputs → identical output, so we can skip the recompute when the function
  // is called twice in one render cycle.
  const cacheKey = 'flProj_' + [
    scenario.assetClass, scenario.assetType, scenario.projHorizonMonths,
    scenario.compTrajectory && scenario.compTrajectory.kind,
    scenario.compTrajectory && scenario.compTrajectory.targetPct,
    scenario.compTrajectory && scenario.compTrajectory.byMonth,
    scenario.historicalWindow, scenario.naturalDriftOn, scenario.projAnchor,
    (STATE.inflationPct || 0),
    [...STATE.filters.criticality].sort().join(','),
    scenario.perClassSensitivities && scenario.assetClass
      ? JSON.stringify(scenario.perClassSensitivities[scenario.assetClass]) : '',
    history.length
  ].join('|');
  if(_renderCache && _renderCache[cacheKey]) return _renderCache[cacheKey];
  const trajectoryHorizon = scenario.projHorizonMonths;
  const displayHorizon = trajectoryHorizon + FL_LAG_MONTHS;
  const last = history[history.length - 1];
  const histCompliance = history.map(r => r.pmPct);
  // Anchor = projection start point. 'last' replicates the previous behaviour
  // (single most recent month). '3mo' / '6mo' (default) / '12mo' use a rolling mean,
  // smoothing out single-month noise so the projection doesn't get locked into
  // a one-off dip or spike.
  const anchor = flBuildAnchor(history, scenario.projAnchor || '6mo') || {
    reactive: last.reactive, proactive: last.proactive, preventative: last.preventative,
    c0: last.pmPct, windowN: 1
  };
  const c0 = anchor.c0 != null ? anchor.c0 : (last.pmPct != null ? last.pmPct : 75);

  // Build the SCENARIO compliance series for the trajectory horizon, then extend with the
  // last value for the lag tail (so the lookback at t > trajectoryHorizon reads the final
  // trajectory value — i.e. the compliance held at its end-of-trajectory level).
  const scenarioCompShort = flProjectComplianceSeries(c0, scenario.compTrajectory, histCompliance, trajectoryHorizon);
  const scenarioCompliance = scenarioCompShort.concat(Array(FL_LAG_MONTHS).fill(scenarioCompShort[scenarioCompShort.length - 1] != null ? scenarioCompShort[scenarioCompShort.length - 1] : c0));

  // Lag-shifted compliance lookup: for each projection month t (1-indexed), what compliance
  // drives the response? Returns array length displayHorizon. For t ≤ FL_LAG_MONTHS the
  // lookback falls into history (last FL_LAG_MONTHS months of history); we use the actual
  // historical compliance values so pre-projection conditioning is faithful.
  const lookbackHistorical = histCompliance.slice(-FL_LAG_MONTHS); // up to 6 values, oldest→newest
  const buildLagged = (compliance) => {
    const out = [];
    for(let t = 0; t < displayHorizon; t++){
      let c;
      if(t < FL_LAG_MONTHS){
        const histIdx = lookbackHistorical.length - FL_LAG_MONTHS + t;
        c = histIdx >= 0 && histIdx < lookbackHistorical.length ? lookbackHistorical[histIdx] : c0;
      } else {
        c = compliance[t - FL_LAG_MONTHS];
      }
      if(c == null) c = c0;
      out.push(c);
    }
    return out;
  };
  const scenarioLagged = buildLagged(scenarioCompliance);

  // Fit per-metric elasticities and drift from the user's historical window.
  // The window is applied to the value series; lagged-compliance lookback can read
  // beyond the window from full history.
  const window = scenario.historicalWindow || 24;
  const fits = {
    correctiveVol:  flFitElasticityFromHistory(history, r => r.corrective.wo,   FL_LAG_MONTHS, window),
    correctiveCpw:  flFitElasticityFromHistory(history, r => r.corrective.cpw,  FL_LAG_MONTHS, window),
    preventativeVol:flFitElasticityFromHistory(history, r => r.preventative.wo, FL_LAG_MONTHS, window),
    preventativeCpw:flFitElasticityFromHistory(history, r => r.preventative.cpw,FL_LAG_MONTHS, window)
  };
  // Auto-enable drift when the four user-modelled fits are all Very weak — otherwise the
  // compliance term collapses to ~0 and the projection sits dead flat at v0, which looks
  // like a cliff after the wiggly history. Falling back to a short-window monthly %-change
  // (last 6 months, capped at ±0.3%/month so it can't run away over a long horizon) tracks
  // recent levels rather than extrapolating long-run trends the data doesn't support.
  // Corrective model: auto-drift is DISABLED by design. The projection uses each metric's
  // fitted compliance relationship as-is (or the user's typed override), with no automatic
  // trend extension — even when the fit is weak. Natural drift only applies if the user
  // explicitly ticks "Add natural drift" below.
  const autoDriftActive = false;
  const driftOn = !!scenario.naturalDriftOn;
  const AUTO_DRIFT_CAP = 0.003; // ±0.3%/month → ±~5.5% over 18 months

  // Asymmetric soft-saturation envelopes — see docs/uu-forward-look-methodology.md.
  // Volume rise capped at +25%, fall at -50% (reactive vol can plausibly halve under a
  // major compliance gain; proactive vol rise is bounded by the asset population, not
  // the rate of PM scheduling). £/WO ±30% (severity changes are roughly symmetric).
  // Caps are ASYMPTOTES, not hard clips — the response curve approaches the cap with
  // diminishing returns rather than ramping into a wall.
  const CAP_VOL_RISE = 0.25, CAP_VOL_FALL = 0.50;
  const CAP_CPW_RISE = 0.30, CAP_CPW_FALL = 0.30;

  // Soft saturation in LOG space: replaces a hard clip on the response factor with
  // a curve that approaches the cap asymptotically with exact asymptotes.
  //   logCap_rise = log(1 + capRise),  logCap_fall = -log(1 - capFall)
  //   if raw_log >= 0:  sat_log =  logCap_rise * (1 - exp(-raw_log / logCap_rise))
  //   else:             sat_log = -logCap_fall * (1 - exp(raw_log / logCap_fall))
  //   factor = exp(sat_log)
  // At small raw_log the response matches the raw exponential (the elasticity pickup
  // is preserved one-for-one). As raw_log → ±∞, factor asymptotes to (1+capRise) or
  // (1-capFall) exactly. Log-space is the natural form for an exp() response model.
  const softSaturate = (rawFactor, capRise, capFall) => {
    if(rawFactor <= 0) return 1 - capFall;  // shouldn't happen; defensive
    const rawLog = Math.log(rawFactor);
    const logCapRise = Math.log(1 + capRise);
    const logCapFall = -Math.log(1 - capFall);
    let satLog;
    if(rawLog >= 0){
      satLog = logCapRise * (1 - Math.exp(-rawLog / logCapRise));
    } else {
      satLog = -logCapFall * (1 - Math.exp(rawLog / logCapFall));
    }
    return Math.exp(satLog);
  };

  // Project a single metric using the RAW fitted elasticity * user multiplier, with optional
  // drift, and soft-saturate the result against asymmetric caps.
  //   raw_factor   = (1 + drift)^t * exp(-mult * elasticity * (c(t-lag) - c0))
  //   V(t)         = v0 * softSaturate(raw_factor, cap_rise, cap_fall)
  // No automatic R² shrinkage: the soft saturation cap is the bounding mechanism.
  // R² and the quality label (Strong / Moderate / Weak / Very weak) are surfaced in the
  // UI as informational guidance — the user can lower the multiplier on noisy fits
  // they don't trust, but the model trusts the slope at face value by default.
  // The auto-drift fallback (when ALL four user-modelled fits are R² < 0.10) still kicks
  // in for the genuine "no signal in the data" case, replacing compliance-driven response
  // with a capped recent-trend extrapolation.
  // metricKind ('vol' | 'cpw') selects the appropriate cap pair.
  const projectMetric = (v0, fitKey, complianceSeriesLagged, metricKind) => {
    if(v0 == null || !isFinite(v0)) return Array(displayHorizon).fill(null);
    const fit = fits[fitKey];
    const mult = scenario.multipliers && scenario.multipliers[fitKey] != null
      ? scenario.multipliers[fitKey] : 1.0;
    let drift;
    if(autoDriftActive){
      // Use the historical-window slope (same window the user picked for the fit), capped.
      // Aligning with the user's window means "the trend you said to look at" — not a
      // hardcoded 6-month tail that may capture only post-peak retreat or pre-rise dip.
      const r = (fit.drift != null) ? fit.drift : 0;
      drift = Math.max(-AUTO_DRIFT_CAP, Math.min(AUTO_DRIFT_CAP, r));
    } else if(driftOn){
      drift = fit.drift;
    } else {
      drift = 0;
    }
    const capRise = metricKind === 'cpw' ? CAP_CPW_RISE : CAP_VOL_RISE;
    const capFall = metricKind === 'cpw' ? CAP_CPW_FALL : CAP_VOL_FALL;
    // Effective elasticity. Change-2 model: the user types the expected % change in this
    // metric per +1pp of PM compliance, per asset class. That typed value IS the effective
    // relationship and overrides multiplier×fitted. Mapping: the response uses
    //   exp(-elasticity * delta_pp_as_fraction)   [delta = (c - c0), in points]
    // and "% change per +1pp" p means V multiplies by (1 + p/100) per +1pp, i.e.
    //   exp(effElasticity_per_point * 1) with the sign convention below. We store the typed
    // value in scenario.perClassSensitivities[class][fitKey] as a %/pp number. Because the
    // existing compFactor is exp(-mult*elasticity*(c-c0)) with elasticity in per-point units
    // where positive elasticity = metric FALLS as compliance rises, a typed "+p %/pp" (metric
    // rises) maps to elasticity_eff = -(p/100) and we set mult=1.
    let effElasticity, usingTyped = false;
    const sens = scenario.perClassSensitivities && scenario.assetClass
      ? scenario.perClassSensitivities[scenario.assetClass] : null;
    const typed = sens && sens[fitKey] != null && sens[fitKey] !== '' ? Number(sens[fitKey]) : null;
    if(typed != null && isFinite(typed)){
      effElasticity = -(typed / 100);   // per +1pp, as a per-point elasticity
      usingTyped = true;
    } else {
      effElasticity = mult * fit.elasticity;
    }
    return complianceSeriesLagged.map((c, idx) => {
      const t = idx + 1;
      const trendFactor = Math.pow(1 + drift, t);
      const compFactor = Math.exp(-effElasticity * (c - c0));
      const rawFactor = trendFactor * compFactor;
      return v0 * softSaturate(rawFactor, capRise, capFall);
    });
  };

  // Project the modelled groups. The Change-2 model is always compliance-driven; the
  // per-class typed sensitivities (handled inside projectMetric) replace the old manual mode.
  const projectGroup = (g, complianceSeriesLagged) => {
    return {
      wo:  projectMetric(anchor[g].wo,  g + 'Vol', complianceSeriesLagged, 'vol'),
      cpw: projectMetric(anchor[g].cpw, g + 'Cpw', complianceSeriesLagged, 'cpw')
    };
  };

  const proj = {
    // Corrective is projected DIRECTLY from the two typed/fitted corrective sensitivities.
    corrective: projectGroup('corrective', scenarioLagged),
    // Preventative follows its fitted relationship (not user-typed, not displayed in the
    // corrective-only tabs, but retained so 'total' remains well-defined).
    preventative: {
      wo:  projectMetric(anchor.preventative.wo,  'preventativeVol', scenarioLagged, 'vol'),
      cpw: projectMetric(anchor.preventative.cpw, 'preventativeCpw', scenarioLagged, 'cpw')
    }
  };

  // Build projected monthly records (extending the history forward by displayHorizon)
  const monthIter = (ym, n) => {
    const out = [];
    let [y, m] = ym.split('-').map(Number);
    for(let i = 0; i < n; i++){
      m++;
      if(m > 12){ m = 1; y++; }
      out.push(`${y}-${String(m).padStart(2,'0')}`);
    }
    return out;
  };
  const projYms = monthIter(last.ym, displayHorizon);
  const avgPmTasks = (() => {
    const tail = history.slice(-6).filter(r => r.pmTasks > 0);
    if(!tail.length) return 0;
    return tail.reduce((s,r) => s + r.pmTasks, 0) / tail.length;
  })();

  const buildRow = (ym, idx) => {
    const wrap = (cost, wo) => ({ wo, cost, cpw: wo > 0 ? cost / wo : null });
    // Corrective is projected directly. Reactive/proactive are not modelled in this version,
    // so they are null in projected months (the tabs show corrective only going forward).
    const corrective  = wrap((proj.corrective.wo[idx] || 0) * (proj.corrective.cpw[idx] || 0), proj.corrective.wo[idx] || 0);
    const reactive    = { wo: null, cost: null, cpw: null };
    const proactive   = { wo: null, cost: null, cpw: null };
    const preventative= wrap((proj.preventative.wo[idx]|| 0) * (proj.preventative.cpw[idx]|| 0), proj.preventative.wo[idx]|| 0);
    const total       = wrap(corrective.cost + preventative.cost, corrective.wo + preventative.wo);
    const c = scenarioCompliance[idx];
    const cLag = scenarioLagged[idx];
    const tasks = Math.round(avgPmTasks);
    return {
      ym, monthLabel: monthLabel(ym), isProj: true,
      reactive, proactive, preventative, corrective, total,
      pmPct: c, pmPctLag: cLag, pmTasks: tasks, pmOverdue: tasks * (1 - c / 100)
    };
  };

  const projection = projYms.map((ym, i) => buildRow(ym, i));
  const result = {
    projection,
    complianceSeries: scenarioCompliance,
    trajectoryHorizon, displayHorizon,
    fits,
    autoDriftActive,
    anchor
  };
  if(_renderCache) _renderCache[cacheKey] = result;
  return result;
}

// Compute the implied constant monthly %-change for each metric that the
// compliance-driven projection produces. Used to pre-populate the manual sliders
// when the user switches to manual mode (untouched). If the modelled projection
// takes v0 → vFinal over `horizon` months, the equivalent rate r solves
//   v0 · (1+r)^horizon = vFinal  ⇒  r = (vFinal/v0)^(1/horizon) − 1
// ============================================================
// Forward-look — output panel (chunk 7, redesigned to three side-by-side charts)
// Layout:
//   - baseline + grain selectors
//   - three charts (volume / £-per-WO / total cost) with %Δ row + 1-line explanation each
//   - FY toggle + per-FY summary cards
//   - collapsed row-by-row extended table at the bottom
// ============================================================
function flRenderOutput(hostId){
  STATE.section3.outputMetric = 'corrective';   // corrective-only model
  // Remember the host so internal toggle re-renders (grain/metric/baseline) target the
  // same container. The Change-2 stepper calls flRenderOutput('flOutputInner').
  if(hostId) STATE.section3._outputHostId = hostId;
  const activeHostId = STATE.section3._outputHostId || 'flOutput';
  const el = document.getElementById(activeHostId);
  if(!el) return;
  const s3 = STATE.section3;
  const history = flMonthlyHistory(s3.historyMonths);
  if(!history.length){ el.innerHTML = ''; return; }
  const projInfo = flComputeProjection(history, s3);
  // Cap all projected output at FY30 (FL_AMP8_LAST_FY) — the dashboard shows insights
  // only through FY30. Clipping here means charts, FY cards, the toggle and the extended
  // table all inherit the cap from a single point.
  const projection = (projInfo.projection || []).filter(r => {
    const [y, m] = r.ym.split('-').map(Number);
    return computeFY(y, m) <= FL_AMP8_LAST_FY;
  });
  const { displayHorizon, trajectoryHorizon } = projInfo;

  const grain = s3.outputGrain || 'month';
  const histRecs = history.map(r => ({ ...r, isProj:false }));
  const projRecs = projection.map(r => ({ ...r, isProj:true }));
  // Chart-only clip: limits the chart's x-axis to N projection months from "today".
  // Table + FY cards always use the full projection.
  const chartHorizon = Math.max(6, Math.min(s3.chartHorizonMonths || 24, displayHorizon));
  const projRecsChart = projRecs.slice(0, chartHorizon);
  const fullScenarioChart = histRecs.concat(projRecsChart);
  const aggScenarioChart = flAggregateMonthly(fullScenarioChart, grain);
  const fullScenario = histRecs.concat(projRecs);
  const aggScenario = flAggregateMonthly(fullScenario, grain);

  // Build the FY options list dynamically from data, defaulting baselineFy to FY25 if available
  // (or most recent complete FY otherwise). Fall back to last-12-months if no FY has data.
  const availableFys = flAvailableFys();
  if(availableFys.length){
    const fyValues = availableFys.map(f => f.fy);
    if(s3.baselineFy == null || !fyValues.includes(s3.baselineFy)){
      s3.baselineFy = fyValues.includes(2025) ? 2025 : (availableFys[availableFys.length - 1].fy);
    }
  } else if(s3.baselineKind === 'fy'){
    s3.baselineKind = 'last_12mo';
  }
  // Compute baseline averages for the chosen period (per-month rates)
  const baselineMonthly = flComputeBaselineAverages(s3.baselineKind, s3.baselineFy);
  const baselineForChart = flScaleBaselineForGrain(baselineMonthly, grain);

  // Compute available FYs that the projection spans, for the per-FY toggle.
  // Capped at FY30 (FL_AMP8_LAST_FY) — the dashboard shows insights only through FY30.
  const fysCovered = new Set();
  for(const r of projRecs){
    const [y, m] = r.ym.split('-').map(Number);
    const fy = computeFY(y, m);
    if(fy <= FL_AMP8_LAST_FY) fysCovered.add(fy);
  }
  const fyList = [...fysCovered].sort();
  if(s3.selectedFy == null || !fyList.includes(s3.selectedFy)) s3.selectedFy = fyList[0] || null;

  // Build the baseline selector dropdown based on what's actually available
  const fyOptionLabel = (f) => 'FY' + String(f.fy).slice(-2) + (f.isComplete ? '' : ' (' + f.monthsCovered + ' of 12 months)');
  const fyOptions = availableFys.map(f =>
    `<option value="fy:${f.fy}" ${s3.baselineKind === 'fy' && s3.baselineFy === f.fy ? 'selected' : ''}>${fyOptionLabel(f)} average</option>`
  ).join('');

  // Chart range dropdown options — common monthly spans up to the model's displayHorizon,
  // plus a Full option. Each option labels the end-month it produces.
  const lastHistYm = history.length ? history[history.length - 1].ym : null;
  const monthEndLabel = (n) => {
    if(!lastHistYm) return '';
    const [y, m] = lastHistYm.split('-').map(Number);
    let nm = m + n, ny = y;
    while(nm > 12){ nm -= 12; ny++; }
    return MONTH_NAMES[nm - 1] + '-' + String(ny).slice(-2);
  };
  const baseRanges = [12, 24, 36, 48].filter(n => n < displayHorizon);
  if(!baseRanges.includes(chartHorizon) && chartHorizon < displayHorizon) baseRanges.push(chartHorizon);
  baseRanges.push(displayHorizon);
  const chartRangeOptions = [...new Set(baseRanges)].sort((a,b) => a - b).map(n => {
    const isFull = n === displayHorizon;
    const lbl = n + ' months · to ' + monthEndLabel(n) + (isFull ? ' (full)' : '');
    return `<option value="${n}" ${chartHorizon === n ? 'selected' : ''}>${lbl}</option>`;
  }).join('');

  el.innerHTML = `
    <div class="fl-model-card">
      <div style="display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px">
        <h3 class="fl-model-title">Projection output ${flHelpButton('output')}</h3>
        <div class="fl-output-controls">
          <span>Grain:</span>
          <div class="fl-grain-toggle">
            <button data-fl-grain="month"   class="${grain === 'month' ? 'active' : ''}" type="button">Month</button>
            <button data-fl-grain="quarter" class="${grain === 'quarter' ? 'active' : ''}" type="button">FY Quarter</button>
            <button data-fl-grain="fy"      class="${grain === 'fy' ? 'active' : ''}" type="button">Fiscal Year</button>
          </div>
          <span style="margin-left:14px">Chart range:</span>
          <select data-fl-chart-range>${chartRangeOptions}</select>
        </div>
      </div>
      <div class="fl-baseline-row">
        <span><strong>Baseline</strong> (historical reference average):</span>
        <select data-fl-baseline-kind>
          ${fyOptions}
          <option value="last_12mo" ${s3.baselineKind === 'last_12mo' ? 'selected' : ''}>Last 12 months average</option>
          <option value="last_6mo"  ${s3.baselineKind === 'last_6mo'  ? 'selected' : ''}>Last 6 months average</option>
        </select>
        <span style="color:#999">·</span>
        <span><strong>Metric</strong>: Corrective (reactive + proactive)</span>
        <select data-fl-output-metric style="display:none">
          <option value="corrective" selected>Corrective (R + P)</option>
        </select>
        <span style="color:#999">· baseline = constant ${escapeHtml(baselineMonthly.periodLabel)}; %Δ rows compare scenario vs this reference.</span>
      </div>
      <div class="fl-section-sub" style="margin-top:8px">
        Trajectory horizon: <strong>${trajectoryHorizon} months</strong>. Display horizon: <strong>${displayHorizon} months</strong> (= trajectory + 6-month lag, so the full effect of compliance changes is visible). Corrective volume and £/WO at projected month <em>t</em> are driven by compliance from month <em>t − 6</em>, using each metric's fitted relationship as-is (or your typed override); no automatic drift is applied.
        ${projInfo.anchor ? `<br><span style="color:#666">Anchor: <strong>${escapeHtml(FL_ANCHOR_LABEL[s3.projAnchor] || '6-month avg')}</strong> — projection starts from the rolling-mean level rather than the most recent single month, so a one-off dip or spike doesn't lock the projection in.</span>` : ''}
      </div>

      <div class="fl-out-grid">
        <div class="fl-out-card">
          <h4 class="fl-out-card-title">1 · ${escapeHtml(flMetricLabel(s3.outputMetric))} volume</h4>
          <div class="fl-out-card-sub" id="flOutSub_vol"></div>
          <div class="fl-out-chart" id="flOutChart_vol"></div>
          <div class="fl-out-delta-row">
            <div class="fl-out-delta-label">% change vs baseline</div>
            <div id="flOutDelta_vol"></div>
          </div>
        </div>
        <div class="fl-out-card">
          <h4 class="fl-out-card-title">2 · ${escapeHtml(flMetricLabel(s3.outputMetric))} cost per workorder</h4>
          <div class="fl-out-card-sub" id="flOutSub_cpw"></div>
          <div class="fl-out-chart" id="flOutChart_cpw"></div>
          <div class="fl-out-delta-row">
            <div class="fl-out-delta-label">% change vs baseline</div>
            <div id="flOutDelta_cpw"></div>
          </div>
        </div>
        <div class="fl-out-card">
          <h4 class="fl-out-card-title">3 · ${escapeHtml(flMetricLabel(s3.outputMetric))} total cost</h4>
          <div class="fl-out-card-sub" id="flOutSub_cost"></div>
          <div class="fl-out-chart" id="flOutChart_cost"></div>
          <div class="fl-out-delta-row">
            <div class="fl-out-delta-label">% change vs baseline</div>
            <div id="flOutDelta_cost"></div>
          </div>
        </div>
      </div>

      <div style="display:flex;align-items:baseline;gap:10px;margin-top:18px;flex-wrap:wrap">
        <strong style="font-size:13px;color:var(--primary)">Annualised impact</strong>
        ${flHelpButton('fy')}
        <span style="color:#999;font-size:11.5px">— pick a fiscal year to see scenario vs baseline at that grain</span>
      </div>
      <div class="fl-fy-toggle" id="flFyToggle">
        ${fyList.map(fy => `<button data-fl-fy="${fy}" class="${s3.selectedFy === fy ? 'active' : ''}" type="button">FY${String(fy).slice(-2)}</button>`).join('')}
      </div>
      <div id="flFyCards" class="fl-fy-cards"></div>

      <details class="fl-out-fulltable" ${s3.showFullTable ? 'open' : ''} id="flOutFullTable">
        <summary>Show row-by-row extended table</summary>
        <div id="flOutTable" style="margin-top:8px"></div>
      </details>
    </div>
  `;

  // Chart uses clipped (chart-horizon) data; table + FY cards use full projection.
  flRenderProjectionTriple(aggScenarioChart, baselineForChart);
  flRenderFyCards(projection, baselineMonthly, history, s3.selectedFy);
  flRenderProjectionTable(document.getElementById('flOutTable'), aggScenario);

  const renderOutputCached = () => flWithCache(() => flRenderOutput());
  el.querySelectorAll('[data-fl-grain]').forEach(b => b.onclick = () => {
    s3.outputGrain = b.getAttribute('data-fl-grain');
    renderOutputCached();
  });
  el.querySelectorAll('[data-fl-chart-range]').forEach(s => s.onchange = () => {
    s3.chartHorizonMonths = parseInt(s.value, 10);
    renderOutputCached();
  });
  // Baseline selector — values are 'fy:<year>' or 'last_12mo' / 'last_6mo'
  el.querySelectorAll('[data-fl-baseline-kind]').forEach(s => s.onchange = () => {
    const v = s.value;
    if(v.startsWith('fy:')){
      s3.baselineKind = 'fy';
      s3.baselineFy = parseInt(v.slice(3), 10);
    } else {
      s3.baselineKind = v;
    }
    renderOutputCached();
  });
  el.querySelectorAll('[data-fl-output-metric]').forEach(s => s.onchange = () => {
    s3.outputMetric = s.value;
    renderOutputCached();
  });
  el.querySelectorAll('[data-fl-fy]').forEach(b => b.onclick = () => {
    s3.selectedFy = parseInt(b.getAttribute('data-fl-fy'), 10);
    renderOutputCached();
  });
  const fullTbl = document.getElementById('flOutFullTable');
  if(fullTbl){
    fullTbl.addEventListener('toggle', () => { s3.showFullTable = fullTbl.open; });
  }
  el.querySelectorAll('[data-fl-help]').forEach(b => b.onclick = () => flOpenHelpModal(b.getAttribute('data-fl-help')));
}

// Friendly label for the selected work-type metric.
function flMetricLabel(metric){
  return metric === 'reactive' ? 'Reactive' : metric === 'proactive' ? 'Proactive' : 'Corrective';
}

// Render the three chart cards. Scenario line on top + a flat horizontal baseline at
// the chosen historical average (no dots, dashed, with a label). %Δ row below shows the
// scenario value at each period vs the constant baseline.
function flRenderProjectionTriple(aggScenario, baselineForChart){
  const periods = aggScenario.map(r => r.periodLabel);
  const metric = STATE.section3.outputMetric || 'corrective';
  const metricLbl = flMetricLabel(metric);
  const baselineLabel = baselineForChart.periodLabel;

  // The history/projection boundary, in agg-period space — used to draw the "today" rule.
  let histCount = 0;
  for(const r of aggScenario){ if(!r.isProj) histCount++; else break; }
  const todayRule = { atIndex: histCount - 0.5, label: 'today', color: '#888' };
  const grain = STATE.section3.outputGrain || 'month';
  const tickEvery = grain === 'month' ? 3 : 1;

  // Scenario series per metric
  const volScenario  = aggScenario.map(r => r[metric].wo);
  const cpwScenario  = aggScenario.map(r => r[metric].cpw);
  const costScenario = aggScenario.map(r => r[metric].cost);
  // Baseline values — ONE constant per chart (already grain-scaled in baselineForChart)
  const volBaselineConst  = baselineForChart[metric].wo;
  const cpwBaselineConst  = baselineForChart[metric].cpw;
  const costBaselineConst = baselineForChart[metric].cost;

  // PM compliance overlay on right axis
  const compliancePoints = aggScenario.map(r => ({ y: r.pmPct }));
  const secondarySeries = [{ name: 'PM compliance %', color: COLORS.success, points: compliancePoints }];

  // Render one chart. Baseline is passed as a no-dot dashed reference series with all
  // points equal to the constant value, plus a label tagged on the right edge.
  const renderOne = (hostId, scenarioVals, baselineConst, fmt, yLabel) => {
    const host = document.getElementById(hostId);
    if(!host) return;
    const scenarioPoints = scenarioVals.map((v, i) => ({
      y: v,
      tooltipExtra: {
        'Period': aggScenario[i].periodLabel + (aggScenario[i].isProj ? ' (proj)' : ''),
        'PM compliance': aggScenario[i].pmPct != null ? aggScenario[i].pmPct.toFixed(0) + '%' : '—',
        'Baseline': baselineConst != null ? fmt(baselineConst) : '—'
      }
    }));
    const baselinePoints = scenarioVals.map(() => ({ y: baselineConst }));
    renderLineChart(host, [
      { name: 'Scenario', color: COLORS.primary, points: scenarioPoints },
      { name: 'Baseline · ' + baselineLabel, color: COLORS.neutral, points: baselinePoints,
        noDots: true, dashed: true, lineLabel: baselineLabel }
    ], periods, {
      fmt, yLabel, height: 200, suppressLegend: false,
      verticalRule: todayRule, tickEvery,
      secondarySeries, secondaryYLabel: 'PM %', secondaryRange: [0, 100]
    });
  };
  renderOne('flOutChart_vol',  volScenario,  volBaselineConst,  v => fmtNum(Math.round(v)),    'WOs');
  renderOne('flOutChart_cpw',  cpwScenario,  cpwBaselineConst,  v => fmtCurrencyFull(v),       '£/WO');
  renderOne('flOutChart_cost', costScenario, costBaselineConst, v => fmtCurrency(v),           '£');

  // %Δ row — scenario value at each projected period vs the constant baseline
  const constArr = (n, v) => Array(n).fill(v);
  flRenderDeltaStrip('flOutDelta_vol',  volScenario,  constArr(volScenario.length,  volBaselineConst),  aggScenario, tickEvery);
  flRenderDeltaStrip('flOutDelta_cpw',  cpwScenario,  constArr(cpwScenario.length,  cpwBaselineConst),  aggScenario, tickEvery);
  flRenderDeltaStrip('flOutDelta_cost', costScenario, constArr(costScenario.length, costBaselineConst), aggScenario, tickEvery);

  // Auto-generated explanation under each chart
  const subVol = document.getElementById('flOutSub_vol');
  const subCpw = document.getElementById('flOutSub_cpw');
  const subCost = document.getElementById('flOutSub_cost');
  if(subVol)  subVol.textContent  = flBuildExplanation('volume',    metricLbl, volScenario,  constArr(volScenario.length,  volBaselineConst),  aggScenario, baselineLabel);
  if(subCpw)  subCpw.textContent  = flBuildExplanation('costperwo', metricLbl, cpwScenario,  constArr(cpwScenario.length,  cpwBaselineConst),  aggScenario, baselineLabel);
  if(subCost) subCost.textContent = flBuildExplanation('totalcost', metricLbl, costScenario, constArr(costScenario.length, costBaselineConst), aggScenario, baselineLabel);
}

// Render a small SVG strip showing %Δ vs baseline at each period. Aligned visually with
// the chart above (same x-axis margins). Projected periods only — historical periods
// have no baseline-vs-scenario distinction. Labels thinned per `tickEvery` to match
// the chart's x-axis label density.
function flRenderDeltaStrip(hostId, scenario, baseline, agg, tickEvery){
  const host = document.getElementById(hostId);
  if(!host) return;
  const w = 500, h = 22, padL = 60, padR = 20;  // match renderLineChart left/right margins
  const innerW = w - padL - padR;
  const n = scenario.length;
  const stepX = n > 1 ? innerW / (n - 1) : 0;
  const every = tickEvery || 1;
  let svg = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:22px">`;
  // Find first / last projection indices so we always label them
  let firstProjIdx = -1, lastProjIdx = -1;
  for(let i = 0; i < n; i++){
    if(agg[i].isProj){ if(firstProjIdx === -1) firstProjIdx = i; lastProjIdx = i; }
  }
  for(let i = 0; i < n; i++){
    if(!agg[i].isProj) continue;
    if(scenario[i] == null || baseline[i] == null || baseline[i] === 0) continue;
    // Always render first + last projected points; thin the rest by `every`
    const showLabel = (i === firstProjIdx) || (i === lastProjIdx) || (i % every === 0);
    if(!showLabel) continue;
    const d = (scenario[i] - baseline[i]) / Math.abs(baseline[i]) * 100;
    const x = padL + stepX * i;
    const cls = Math.abs(d) < 0.5 ? '#666' : (d > 0 ? '#d32f2f' : '#00A878');
    const txt = (d >= 0 ? '+' : '') + d.toFixed(0) + '%';
    svg += `<text x="${x.toFixed(1)}" y="14" text-anchor="middle" font-size="10" fill="${cls}" font-weight="500" font-family="Helvetica,sans-serif">${txt}</text>`;
  }
  svg += `</svg>`;
  host.innerHTML = svg;
}

// Build a one-sentence explanation under each chart based on scenario vs baseline behaviour.
// baselineLabel surfaces the comparison reference, e.g. "FY25 average".
function flBuildExplanation(kind, metricLbl, scenario, baseline, agg, baselineLabel){
  let firstProj = -1, lastProj = -1;
  for(let i = 0; i < agg.length; i++){
    if(agg[i].isProj){ if(firstProj === -1) firstProj = i; lastProj = i; }
  }
  if(firstProj === -1 || lastProj === -1) return 'Not enough projection data to summarise.';
  const sFinal = scenario[lastProj], bFinal = baseline[lastProj];
  if(sFinal == null || bFinal == null || bFinal === 0) return 'Projection values not available at end of horizon.';
  const dFinal = (sFinal - bFinal) / Math.abs(bFinal) * 100;
  const magWord = Math.abs(dFinal) >= 20 ? 'significantly' : Math.abs(dFinal) >= 5 ? 'meaningfully' : 'modestly';
  const finalLabel = agg[lastProj].periodLabel;
  const ref = baselineLabel ? ('the ' + baselineLabel.toLowerCase()) : 'baseline';
  let phrase;
  if(kind === 'volume'){
    if(dFinal < -1) phrase = `${metricLbl} workorders end ${magWord} ${Math.abs(dFinal).toFixed(0)}% below ${ref} by ${finalLabel}.`;
    else if(dFinal > 1) phrase = `${metricLbl} workorders end ${magWord} ${dFinal.toFixed(0)}% above ${ref} by ${finalLabel}.`;
    else phrase = `${metricLbl} workorders track ${ref} closely through ${finalLabel}.`;
  } else if(kind === 'costperwo'){
    if(dFinal < -1) phrase = `${metricLbl} £/WO ends ${magWord} ${Math.abs(dFinal).toFixed(0)}% below ${ref} by ${finalLabel}.`;
    else if(dFinal > 1) phrase = `${metricLbl} £/WO ends ${magWord} ${dFinal.toFixed(0)}% above ${ref} by ${finalLabel}.`;
    else phrase = `${metricLbl} £/WO sits close to ${ref} through ${finalLabel}.`;
  } else {
    if(dFinal < -1) phrase = `${metricLbl} total cost ends ${magWord} ${Math.abs(dFinal).toFixed(0)}% below ${ref} by ${finalLabel}.`;
    else if(dFinal > 1) phrase = `${metricLbl} total cost ends ${magWord} ${dFinal.toFixed(0)}% above ${ref} by ${finalLabel}.`;
    else phrase = `${metricLbl} total cost tracks ${ref} closely through ${finalLabel}.`;
  }
  return phrase;
}

// Per-FY summary cards. Compares the projected FY total to the chosen baseline (a constant
// monthly historical average). Multiplies the monthly avg by the number of projection months
// covered in the chosen FY so we compare like-for-like.
function flRenderFyCards(projection, baselineMonthly, history, fy){
  const host = document.getElementById('flFyCards');
  if(!host) return;
  if(fy == null){ host.innerHTML = ''; return; }
  const metric = STATE.section3.outputMetric || 'corrective';
  const metricLbl = flMetricLabel(metric).toLowerCase();
  const inFy = (r) => {
    const [y, m] = r.ym.split('-').map(Number);
    return computeFY(y, m) === fy;
  };
  const projInFy = projection.filter(inFy);
  if(!projInFy.length){ host.innerHTML = '<div class="dd-empty">No projection in this FY.</div>'; return; }
  const sumWo   = (arr) => arr.reduce((s,r) => s + (r[metric].wo   || 0), 0);
  const sumCost = (arr) => arr.reduce((s,r) => s + (r[metric].cost || 0), 0);
  const cpwAgg  = (arr) => { const wo = sumWo(arr), cost = sumCost(arr); return wo > 0 ? cost / wo : null; };
  const sWo = sumWo(projInFy);
  const sCost = sumCost(projInFy);
  const sCpw = cpwAgg(projInFy);
  const monthsCovered = projInFy.length;
  // Baseline = monthly average × months covered (so FY card shows comparable totals).
  // £/WO baseline is grain-independent and uses the period rate directly.
  const bWo   = baselineMonthly[metric].wo  * monthsCovered;
  const bCost = baselineMonthly[metric].cost * monthsCovered;
  const bCpw  = baselineMonthly[metric].cpw;
  const fyLbl = 'FY' + String(fy).slice(-2);
  const baselineLbl = baselineMonthly.periodLabel;
  const subNote = monthsCovered < 12 ? `${monthsCovered} of 12 months projected — partial FY` : '';

  const renderCard = (lbl, value, deltaPct, deltaAbs, deltaCls, sub) => `
    <div class="fl-fy-card ${deltaCls === 'down-good' ? 'savings-pos' : (deltaCls === 'up-bad' ? 'savings-neg' : '')}">
      <div class="lbl">${escapeHtml(lbl)}</div>
      <div class="val">${value}</div>
      <div class="delta ${deltaCls}">${deltaPct}${deltaAbs ? ' · ' + deltaAbs : ''}</div>
      <div class="sub">${escapeHtml(sub)}</div>
    </div>
  `;

  const dWoPct  = bWo > 0 ? (sWo - bWo) / bWo * 100 : null;
  const woCls   = dWoPct == null ? '' : (dWoPct < -0.5 ? 'down-good' : dWoPct > 0.5 ? 'up-bad' : '');
  const dCpwPct = (bCpw && bCpw > 0 && sCpw != null) ? (sCpw - bCpw) / bCpw * 100 : null;
  const cpwCls  = dCpwPct == null ? '' : (dCpwPct < -0.5 ? 'down-good' : dCpwPct > 0.5 ? 'up-bad' : '');
  const dCostPct = bCost > 0 ? (sCost - bCost) / bCost * 100 : null;
  const dCostAbs = sCost - bCost;
  const costCls  = dCostPct == null ? '' : (dCostPct < -0.5 ? 'down-good' : dCostPct > 0.5 ? 'up-bad' : '');

  host.innerHTML = `
    ${renderCard(
      `${fyLbl} ${metricLbl} workorders (vs ${baselineLbl})`,
      fmtNum(Math.round(sWo)),
      dWoPct == null ? '—' : `${dWoPct >= 0 ? '+' : ''}${dWoPct.toFixed(1)}%`,
      dWoPct == null ? '' : `vs ${fmtNum(Math.round(bWo))}`,
      woCls,
      subNote || `Sum across ${monthsCovered} projected months in ${fyLbl}.`
    )}
    ${renderCard(
      `${fyLbl} ${metricLbl} £/WO (vs ${baselineLbl})`,
      sCpw != null ? fmtCurrencyFull(sCpw) : '—',
      dCpwPct == null ? '—' : `${dCpwPct >= 0 ? '+' : ''}${dCpwPct.toFixed(1)}%`,
      bCpw != null ? `vs ${fmtCurrencyFull(bCpw)}` : '',
      cpwCls,
      subNote || `Σ£ / ΣWO at the FY level.`
    )}
    ${renderCard(
      `${fyLbl} ${metricLbl} spend (vs ${baselineLbl})`,
      fmtCurrency(sCost),
      dCostPct == null ? '—' : `${dCostPct >= 0 ? '+' : ''}${dCostPct.toFixed(1)}%`,
      dCostAbs != null ? `${dCostAbs >= 0 ? '+' : '−'}${fmtCurrency(Math.abs(dCostAbs))}` : '',
      costCls,
      `${dCostAbs > 0 ? 'Higher' : (dCostAbs < 0 ? 'Saving' : 'Tied')} vs ${baselineLbl} this FY${subNote ? ' · ' + subNote : ''}`
    )}
  `;
}

// Extended row-by-row table — same as before, but rendered into the collapsible details element.
function flRenderProjectionTable(host, series){
  if(!host) return;
  if(!series.length){ host.innerHTML = ''; return; }
  const groups = ['corrective','preventative','total'];
  const groupLabels = { corrective:'Corrective', preventative:'Preventative', total:'Total' };
  const subCols = ['WOs','£/WO','£'];
  const pmCls = (v) => v == null ? '' : (v >= 90 ? 'pm-good' : v >= 70 ? 'pm-warn' : 'pm-bad');
  const fmtCpw = (v) => v == null ? '—' : fmtCurrencyFull(v);
  const grain = STATE.section3.outputGrain || 'month';
  const periodHeader = grain === 'month' ? 'Month' : grain === 'quarter' ? 'FY Quarter' : 'Fiscal Year';

  const headerRow1 = `
    <tr class="fl-grouprow">
      <th class="fl-blank"></th>
      ${groups.map(g => `<th colspan="3" class="fl-grpdiv">${escapeHtml(groupLabels[g])}</th>`).join('')}
      <th class="fl-grpdiv">PM %</th>
    </tr>
  `;
  const headerRow2 = `
    <tr>
      <th class="fl-month">${escapeHtml(periodHeader)}</th>
      ${groups.map(() => subCols.map((sc, si) => `<th class="${si === 0 ? 'fl-grpdiv' : ''}">${escapeHtml(sc)}</th>`).join('')).join('')}
      <th class="fl-grpdiv">PM %</th>
    </tr>
  `;
  const rowsHtml = series.map(r => {
    const cells = groups.map(g => {
      const m = r[g];
      return `<td class="fl-grpdiv">${m.wo > 0 ? fmtNum(Math.round(m.wo)) : '—'}</td><td>${fmtCpw(m.cpw)}</td><td>${m.cost > 0 ? fmtCurrency(m.cost) : '—'}</td>`;
    }).join('');
    const projLbl = r.isProj ? ' (proj)' : '';
    return `<tr class="${r.isProj ? 'fl-proj' : ''}"><td class="fl-month">${escapeHtml(r.periodLabel)}${projLbl}</td>${cells}<td class="fl-grpdiv ${pmCls(r.pmPct)}">${r.pmPct != null ? fmtPct(r.pmPct) : '—'}</td></tr>`;
  }).join('');
  host.innerHTML = `
    <div class="fl-hist-table-wrap" style="max-height:440px">
      <table class="fl-hist-table">
        <thead>${headerRow1}${headerRow2}</thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
  `;
}

function flHelpButton(topic){
  return `<button class="fl-help-btn" data-fl-help="${escapeHtml(topic)}" type="button" title="How does this work?">?</button>`;
}

// "How this works" sticky side tab. Created once on first call, then shown only on
// the Forward look tab. Click opens the full help modal.
function flEnsureHowtoTab(){
  let btn = document.getElementById('flHowtoTab');
  if(!btn){
    btn = document.createElement('button');
    btn.id = 'flHowtoTab';
    btn.className = 'fl-howto-tab';
    btn.type = 'button';
    btn.setAttribute('aria-label', 'How this projection works');
    btn.title = 'Open the full walkthrough';
    btn.textContent = 'How this works';
    btn.onclick = () => flOpenHelpModal('all');
    document.body.appendChild(btn);
  }
  btn.style.display = STATE && STATE.activeTab === 'section3' ? '' : 'none';
}

function flOpenHelpModal(topic){
  let host = document.getElementById('flHelpModalHost');
  if(!host){ host = document.createElement('div'); host.id = 'flHelpModalHost'; document.body.appendChild(host); }
  const sections = flBuildHelpContent(topic);
  host.innerHTML = `
    <div class="ov-modal-overlay" id="flHelpOverlay">
      <div class="ov-modal-panel fl-help-modal" role="dialog" aria-label="How the projection works">
        <div class="ov-modal-header">
          <div class="ov-modal-title">How the projection works</div>
          <button class="ov-modal-close" id="flHelpClose" type="button" aria-label="Close">×</button>
        </div>
        <div style="padding:16px 22px;overflow-y:auto;max-height:calc(100vh - 140px)">
          ${sections}
        </div>
        <div class="ov-modal-footer">
          <span style="color:var(--text-secondary);font-size:11.5px;font-style:italic">This is a model, not a forecast — use it to compare scenarios, not to predict to the £.</span>
          <div style="display:flex;gap:8px"><button class="btn btn-primary" id="flHelpDone" type="button">Got it</button></div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('flHelpOverlay').addEventListener('click', e => { if(e.target.id === 'flHelpOverlay') flCloseHelpModal(); });
  document.getElementById('flHelpClose').onclick = flCloseHelpModal;
  document.getElementById('flHelpDone').onclick = flCloseHelpModal;
  const esc = (e) => { if(e.key === 'Escape') flCloseHelpModal(); };
  document.addEventListener('keydown', esc);
  host._esc = esc;
}

function flCloseHelpModal(){
  const host = document.getElementById('flHelpModalHost');
  if(!host) return;
  if(host._esc) document.removeEventListener('keydown', host._esc);
  host.innerHTML = '';
}

// ============================================================
// FORECAST RESULT TAB (section4)
// Rolls up the Forward-look scenario across all Top-N selected asset classes.
// Headline: total AMP8 (FY26-FY30) corrective VOLUME impact, £/WO impact, and
// total corrective SPEND impact (each = projected − baseline, summed FY26-30).
// Then a per-class table: each FY's corrective spend impact + total AMP8, with
// a grand-total row.
// Impact convention matches the Forward-look FY cards: baseline is the chosen
// baseline period's MONTHLY rate; per-FY impact = Σ projection in FY − (monthly
// baseline × months of that FY present in the projection).
// ============================================================

// AMP8 fiscal-year window (inclusive). FY = Apr-Mar (computeFY). Nothing beyond FY30.
const FL_AMP8_FIRST_FY = 2026;
const FL_AMP8_LAST_FY  = 2030;   // hard cap — dashboard shows insights only through FY30

// Which corrective metric the roll-up reports (the tab is corrective-focused).
// Uses the 'corrective' bucket already produced by the projection/ baseline engine.
function flComputeRollup(){
  const s3 = STATE.section3;
  const classList = flCurrentClassList();
  flResolveSelectedClasses(classList);
  const selected = (s3.selectedClasses || []).slice();

  // Preserve the currently-stepped class so we can restore it after the sweep.
  const prevClass = s3.assetClass, prevType = s3.assetType;

  const fys = [];
  for(let fy = FL_AMP8_FIRST_FY; fy <= FL_AMP8_LAST_FY; fy++) fys.push(fy);

  const WORKTYPES = ['corrective'];   // corrective-only model

  // Per-work-type per-class results:
  // perClass[wt] = [ { ac, byFy:{fy:{volImpact, spendImpact, monthsCovered}}, totalVol, totalSpend, hasData } ]
  const perClass = { corrective: [] };
  // Portfolio accumulators per work-type (annualised, summed across classes & FYs)
  const acc = {
    corrective: { vol:0, spend:0 }
  };

  // Temp per-class holder keyed by ac then wt, built in the sweep
  const holder = {}; // holder[ac][wt] = {byFy, totalVol, totalSpend, hasData}

  for(const ac of selected){
    s3.assetClass = ac;
    s3.assetType = null;
    flClearClassCaches();
    const history = flMonthlyHistory(s3.historyMonths);
    holder[ac] = {};
    if(!history.length){
      for(const wt of WORKTYPES) holder[ac][wt] = { byFy:{}, totalVol:0, totalSpend:0, hasData:false };
      continue;
    }
    const projInfo = flComputeProjection(history, s3);
    const projection = projInfo.projection || [];
    const baseMonthly = flComputeBaselineAverages(s3.baselineKind || 'fy', s3.baselineFy);

    // Per-class manual % reduction (haircut). Scales this class's volume + spend impact for
    // every work-type by (1 - pct/100), so corrective = reactive + proactive stays consistent.
    const rawPct = (STATE.section3.resultReductionPct && STATE.section3.resultReductionPct[ac] != null)
      ? Number(STATE.section3.resultReductionPct[ac]) : 0;
    const redPct = isFinite(rawPct) ? Math.max(0, Math.min(100, rawPct)) : 0;
    const redFactor = 1 - (redPct / 100);

    for(const wt of WORKTYPES){
      const byFy = {};
      let totalVol = 0, totalSpend = 0;
      for(const fy of fys){
        const inFy = projection.filter(r => {
          const [y,m] = r.ym.split('-').map(Number);
          return computeFY(y,m) === fy;
        });
        const monthsCovered = inFy.length;
        // Actual delta over the months present in this FY
        const projWo   = inFy.reduce((s,r)=> s + ((r[wt] && r[wt].wo)   || 0), 0);
        const projCost = inFy.reduce((s,r)=> s + ((r[wt] && r[wt].cost) || 0), 0);
        const baseWo   = (baseMonthly[wt].wo   || 0) * monthsCovered;
        const baseCost = (baseMonthly[wt].cost || 0) * monthsCovered;
        const rawVolDelta   = projWo - baseWo;
        const rawSpendDelta = projCost - baseCost;
        // ANNUALISE: scale a partial FY up to a full-year equivalent (×12/monthsCovered).
        // Full FYs (monthsCovered==12) are unchanged. monthsCovered==0 ⇒ no data for that FY.
        const scale = monthsCovered > 0 ? (12 / monthsCovered) : 0;
        // Apply the annualisation and the per-class manual reduction (haircut).
        const volImpact   = rawVolDelta   * scale * redFactor;
        const spendImpact = rawSpendDelta * scale * redFactor;
        byFy[fy] = { monthsCovered, volImpact, spendImpact };
        totalVol   += volImpact;      // AMP8 = sum of the five annualised FY impacts
        totalSpend += spendImpact;
      }
      holder[ac][wt] = { byFy, totalVol, totalSpend, hasData:true, reductionPct: redPct };
      acc[wt].vol   += totalVol;
      acc[wt].spend += totalSpend;
    }
  }

  // restore stepped class
  s3.assetClass = prevClass; s3.assetType = prevType;
  flClearClassCaches();

  // Assemble perClass arrays in the selected (ranked) order, per work-type
  for(const wt of WORKTYPES){
    perClass[wt] = selected.map(ac => {
      const h = holder[ac][wt];
      return { ac, byFy: h.byFy, totalVol: h.totalVol, totalSpend: h.totalSpend, hasData: h.hasData, reductionPct: h.reductionPct || 0 };
    });
  }

  const baselineLabel = selected.length
    ? flComputeBaselineAverages(s3.baselineKind || 'fy', s3.baselineFy).periodLabel : '';

  return {
    fys, selected, perClass,
    headline: {
      corrective: { volumeImpact: acc.corrective.vol, spendImpact: acc.corrective.spend }
    },
    baselineLabel
  };
}


// ---------- Render the Forecast result tab ----------
function renderSection4(){
  const host = document.getElementById('section4');
  if(!host) return;
  if(!STATE.costEnriched && !STATE.pmEnriched){
    host.innerHTML = '<div class="dd-empty" style="margin:24px">Load cost and PM data to see forecast results.</div>';
    return;
  }

  const R = flComputeRollup();
  if(!R.selected.length){
    host.innerHTML = '<div class="dd-empty" style="margin:24px">No asset classes selected. Choose a Top-N set on the Forward look tab first.</div>';
    return;
  }

  const s3 = STATE.section3;
  const trajLbl = (() => {
    const ct = s3.compTrajectory;
    if(ct.kind === 'improve') return `compliance improving to ${ct.targetPct}% over ${ct.byMonth} months`;
    if(ct.kind === 'trend') return 'compliance continuing its recent trend';
    return 'compliance held flat';
  })();

  const money = (v) => {
    if(v == null || !isFinite(v)) return '—';
    const s = v < 0 ? '−' : (v > 0 ? '+' : '');
    return `<span class="${v<0?'fr-good':(v>0?'fr-bad':'')}">${s}${fmtCurrency(Math.abs(v))}</span>`;
  };

  // ---- One work-type block: two headline cards (volume + spend) + per-class table ----
  const workTypeBlock = (wt, title, blurb) => {
    const h = R.headline[wt];
    const rows = R.perClass[wt];

    // Headline cards (negative = saving = good)
    const volSign = h.volumeImpact === 0 ? 0 : (h.volumeImpact < 0 ? -1 : 1);
    const spendSign = h.spendImpact === 0 ? 0 : (h.spendImpact < 0 ? -1 : 1);
    const volStr   = `${h.volumeImpact >= 0 ? '+' : '−'}${fmtNum(Math.abs(Math.round(h.volumeImpact)))}`;
    const spendStr = `${h.spendImpact >= 0 ? '+' : '−'}${fmtCurrency(Math.abs(h.spendImpact))}`;
    const kpiCard = (label, valueStr, sign, good, sub) => {
      const cls = sign === 0 ? '' : (good ? 'savings-pos' : 'savings-neg');
      return `<div class="fr-kpi ${cls}">
        <div class="fr-kpi-label">${escapeHtml(label)}</div>
        <div class="fr-kpi-value">${valueStr}</div>
        <div class="fr-kpi-sub">${escapeHtml(sub)}</div>
      </div>`;
    };

    const fyHeaders = R.fys.map(fy => `<th class="num">FY${String(fy).slice(-2)}</th>`).join('');
    const bodyRows = rows.map((c, i) => {
      if(!c.hasData){
        return `<tr><td class="fr-rowhead"><span class="fr-rank">${i+1}</span>${escapeHtml(c.ac)}</td>
          ${R.fys.map(()=>'<td class="num">—</td>').join('')}<td class="num">—</td></tr>`;
      }
      const cells = R.fys.map(fy => {
        const d = c.byFy[fy];
        const partial = d && d.monthsCovered > 0 && d.monthsCovered < 12
          ? ` <span class="fr-partial" title="${d.monthsCovered} of 12 months projected — annualised to a full-year equivalent">*</span>` : '';
        return `<td class="num">${d && d.monthsCovered > 0 ? money(d.spendImpact) : '—'}${partial}</td>`;
      }).join('');
      return `<tr>
        <td class="fr-rowhead"><span class="fr-rank">${i+1}</span>${escapeHtml(c.ac)}</td>
        ${cells}
        <td class="num fr-total-cell">${money(c.totalSpend)}</td>
      </tr>`;
    }).join('');

    const fyTotals = {};
    R.fys.forEach(fy => { fyTotals[fy] = rows.reduce((s,c)=> s + (c.byFy[fy] ? c.byFy[fy].spendImpact : 0), 0); });
    const grandTotal = rows.reduce((s,c)=> s + c.totalSpend, 0);
    const totalRow = `
      <tr class="fr-grand">
        <td class="fr-rowhead">All selected classes</td>
        ${R.fys.map(fy => `<td class="num">${money(fyTotals[fy])}</td>`).join('')}
        <td class="num fr-total-cell">${money(grandTotal)}</td>
      </tr>`;

    return `
      <div class="fr-block">
        <div class="fr-block-head">
          <h3 class="fr-block-title">${escapeHtml(title)}</h3>
          <div class="fr-block-blurb">${escapeHtml(blurb)}</div>
        </div>
        <div class="fr-kpis fr-kpis-2">
          ${kpiCard(`AMP8 ${title.toLowerCase()} volume impact`, volStr, volSign, volSign < 0,
            `${volSign < 0 ? 'Fewer' : volSign > 0 ? 'More' : 'No change in'} ${title.toLowerCase()} workorders vs baseline · sum of annualised FY impacts`)}
          ${kpiCard(`AMP8 ${title.toLowerCase()} spend impact`, spendStr, spendSign, spendSign < 0,
            `${spendSign < 0 ? 'Saving' : spendSign > 0 ? 'Increase' : 'No change'} vs baseline · sum of annualised FY impacts`)}
        </div>
        <div class="fr-card">
          <div class="fr-card-head">
            <h4>${escapeHtml(title)} spend impact by asset class</h4>
          </div>
          <div class="fl-section-sub" style="margin-bottom:10px">
            Each cell is the <strong>annualised</strong> ${escapeHtml(title.toLowerCase())} spend impact for that fiscal year (projected − ${escapeHtml(R.baselineLabel || 'baseline')}, partial years scaled to a full-year equivalent; negative = saving). The final column sums the five annualised FY impacts into the total AMP8 impact.
          </div>
          <div class="fr-table-wrap">
            <table class="fr-table">
              <thead>
                <tr><th class="fr-rowhead-th">Asset class</th>${fyHeaders}<th class="num fr-total-th">Total AMP8</th></tr>
              </thead>
              <tbody>${bodyRows}${totalRow}</tbody>
            </table>
          </div>
        </div>
      </div>
    `;
  };

  // ---- Per-class manual % reduction panel (top of the tab) ----
  // Lists all selected classes; the user enters a % that haircuts that class's modelled
  // impact (volume + spend) by (1 - %/100). Uses each class's corrective total for context.
  const redRows = R.selected.map((ac) => {
    const pct = (s3.resultReductionPct && s3.resultReductionPct[ac] != null) ? s3.resultReductionPct[ac] : '';
    return `
      <div class="fr-red-row">
        <div class="fr-red-name" title="${escapeHtml(ac)}">${escapeHtml(ac)}</div>
        <div class="fr-red-input-wrap">
          <input type="number" min="0" max="100" step="1" value="${pct}" data-red-class="${escapeHtml(ac)}" class="fr-red-input" placeholder="0">
          <span class="fr-red-unit">%</span>
        </div>
      </div>`;
  }).join('');
  const anyReduction = R.selected.some(ac => s3.resultReductionPct && Number(s3.resultReductionPct[ac]) > 0);
  const reductionPanel = `
    <div class="fr-red-card">
      <div class="fr-red-head">
        <div class="fr-red-title">Manual spend-reduction adjustment</div>
        <button class="fl-btn-sec" id="frClearReductions" type="button" ${anyReduction ? '' : 'disabled'}>Clear all</button>
      </div>
      <div class="fr-red-sub">Enter a % reduction per asset class to avoid duplication of benefits across MESIP-wide initiatives.</div>
      <div class="fr-red-grid">${redRows}</div>
    </div>
  `;

  host.innerHTML = `
    <div class="fr-wrap">
      <div class="fr-intro">
        <h2>Forecast result — AMP8 roll-up (FY26–FY30)</h2>
        <p>Projection output and annualised impact summed across all ${R.selected.length} selected asset class${R.selected.length===1?'':'es'}, each using its own assumptions from the Forward look tab, with ${escapeHtml(trajLbl)}. Impact is measured against the ${escapeHtml(R.baselineLabel || 'baseline')}. Results reflect the Forward look assumptions only — the global filters do not apply here.</p>
      </div>
      ${reductionPanel}
      ${workTypeBlock('corrective', 'Corrective', 'Corrective = reactive + proactive — the headline maintenance impact.')}
      <div class="fr-card" style="text-align:right;background:transparent;border:none;padding:0">
        <button class="fl-btn-sec" id="frExportResults" type="button">⤓ Export results (CSV)</button>
      </div>
    </div>
  `;

  // Wire the per-class reduction inputs
  host.querySelectorAll('.fr-red-input').forEach(inp => {
    inp.onchange = () => {
      const ac = inp.getAttribute('data-red-class');
      if(!s3.resultReductionPct) s3.resultReductionPct = {};
      const v = inp.value === '' ? null : Number(inp.value);
      if(v == null || !isFinite(v) || v <= 0){
        delete s3.resultReductionPct[ac];
      } else {
        s3.resultReductionPct[ac] = Math.max(0, Math.min(100, v));
      }
      renderSection4();   // recompute + re-render with the new haircut
    };
  });
  const clearRed = document.getElementById('frClearReductions');
  if(clearRed) clearRed.onclick = () => { s3.resultReductionPct = {}; renderSection4(); };

  const exp = document.getElementById('frExportResults');
  if(exp) exp.onclick = () => flExportResultsCSV(R);
}

// ---------- Export the roll-up (all three work-types) to CSV ----------
function flExportResultsCSV(R){
  const lines = [];
  lines.push('# UU Forecast result — AMP8 annualised impact (FY26-FY30)');
  lines.push('# Generated,' + new Date().toISOString());
  lines.push('# baseline,' + (R.baselineLabel || ''));
  lines.push('# note,Each FY value is the annualised impact (partial FYs scaled to full-year equivalent). Total AMP8 = sum of the five annualised FY impacts.');
  ['corrective'].forEach(wt => {
    const h = R.headline[wt];
    lines.push('# headline_' + wt + '_volume_impact_wo,' + Math.round(h.volumeImpact));
    lines.push('# headline_' + wt + '_spend_impact,' + Math.round(h.spendImpact));
  });
  lines.push('');

  ['corrective'].forEach(wt => {
    lines.push('# ' + wt.toUpperCase() + ' — spend impact by asset class');
    const header = ['asset_class', ...R.fys.map(fy => 'FY' + String(fy).slice(-2) + '_spend_impact_annualised'), 'total_amp8_spend_impact'];
    if(wt === 'corrective') header.push('manual_reduction_pct');
    lines.push(header.join(','));
    for(const c of R.perClass[wt]){
      const row = [flCsvEscape(c.ac)];
      for(const fy of R.fys){ row.push(c.byFy[fy] && c.byFy[fy].monthsCovered > 0 ? Math.round(c.byFy[fy].spendImpact) : ''); }
      row.push(Math.round(c.totalSpend));
      if(wt === 'corrective') row.push(c.reductionPct || 0);
      lines.push(row.join(','));
    }
    const fyTotals = R.fys.map(fy => R.perClass[wt].reduce((s,c)=> s + (c.byFy[fy] ? c.byFy[fy].spendImpact : 0), 0));
    const grand = R.perClass[wt].reduce((s,c)=> s + c.totalSpend, 0);
    const totalRow = ['All selected classes', ...fyTotals.map(v=>Math.round(v)), Math.round(grand)];
    if(wt === 'corrective') totalRow.push('');
    lines.push(totalRow.join(','));
    lines.push('');
  });

  const csv = lines.join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `uu-forecast-result-amp8_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

          <li>The <strong>scatter</strong> highlights asset classes where low compliance coincides with high reactive spend — the best candidates for PM investment.</li>

      <div class="rm-tab-card">

      <div class="rm-tab-card">
        <div class="rm-tab-head"><span class="rm-tab-badge">3</span><h2>Forward look</h2></div>

        <ul class="rm-tab-points">

          <li><strong>Output stepper</strong> — page through each selected class one at a time to see its projection: three charts (volume, £/WO, total cost) against a baseline, percentage-change strips, and per-fiscal-year summary cards.</li>

      </div>

      <div class="rm-tab-card">
        <div class="rm-tab-head"><span class="rm-tab-badge">4</span><h2>Forecast result</h2></div>

        <p>This tab totals the Forward look projections into an AMP8 (FY26–FY30) picture. It reflects the Forward look assumptions only — the global filters do not apply here.</p>
        <ul class="rm-tab-points">
          <li>Three stacked blocks — <strong>Corrective</strong>, then <strong>Reactive</strong>, then <strong>Proactive</strong> — each with headline cards for <strong>volume impact</strong> and <strong>spend impact</strong>, plus a per-asset-class table.</li>
          <li><strong>Impact</strong> means projected minus baseline. Each fiscal year's figure is <strong>annualised</strong> (a partial year is scaled up to a full-year equivalent), and the <strong>Total AMP8</strong> column is the sum of the five annualised fiscal-year impacts.</li>
          <li>A negative number is a <strong>saving</strong> versus the baseline (shown green); a positive number is an increase (amber).</li>
          <li><strong>Export results (CSV)</strong> downloads the full table for all three work-types.</li>
