      </div>

      <div class="rm-foot">
        <strong>A note on the numbers.</strong> Forecasts are fitted from a limited history, so treat them as informed estimates rather than certainties — the fit quality labels (Strong / Moderate / Weak) and the ability to override every assumption are there so you can apply judgement. Impact figures on the Forecast result tab are annual-equivalent, not literal cash over exact calendar months.
      </div>
    </div>
  `;
}



// ============================================================
// ASSET SPECIFIC INSIGHTS TAB (section5)
// Read-only per-class summary. A stepper pages through the classes selected on the
// Forward look tab. For the current class:
//   • Top cards: total corrective / reactive / proactive AMP8 spend change (ties to the
//     Forecast result tab, incl. its manual % reduction) + PM compliance target.
//   • Historical section: FY line charts (reactive / proactive / corrective spend), PM %,
//     reactive share % — across all available fiscal years (actuals only).
//   • Forward-looking section: the same three spend metrics + PM % + reactive share %, as one
//     continuous line spanning history → forecast, forecast years dashed, with a "today" marker.
// No user inputs.
// ============================================================

// Build FY-aggregated ACTUAL history for the current class (all available FYs).
function aiHistoryFYs(){
  const s3 = STATE.section3;
  // Full-history monthly records for the class (respecting BA/county filters, not time).
  // flMonthlyHistory takes a window; use a large window to capture all available months.
  const allMonthsN = (STATE.allMonths && STATE.allMonths.length) ? STATE.allMonths.length : 120;
  const hist = flMonthlyHistory(allMonthsN);
  return { monthly: hist, fys: flAggregateMonthly(hist, 'fy') };
}

// Build a combined ACTUAL + FORECAST monthly series, then aggregate to FY (clipped to FY30).
function aiCombinedFYs(histMonthly){
  const s3 = STATE.section3;
  const projInfo = flComputeProjection(flMonthlyHistory(s3.historyMonths), s3);
  const projMonths = (projInfo.projection || []).filter(r => {
    const [y, m] = r.ym.split('-').map(Number);
    return computeFY(y, m) <= FL_AMP8_LAST_FY;
  });
  // Actual history months come first; projection months (strictly after last actual) follow.
  const lastActualYm = histMonthly.length ? histMonthly[histMonthly.length - 1].ym : null;
  const projAfter = projMonths.filter(r => !lastActualYm || r.ym > lastActualYm);
  const combined = histMonthly.concat(projAfter);
  const fys = flAggregateMonthly(combined, 'fy');
  // Determine the first FY that contains any projected month (for the "today" divider + dashing).
  const firstProjFy = projAfter.length ? (() => { const [y,m] = projAfter[0].ym.split('-').map(Number); return computeFY(y,m); })() : null;
  // Reactive/proactive aren't modelled forward, so any FY that is entirely projected has no
  // meaningful split — null it out (aggregation summed nulls to 0) so the reactive-share chart
  // shows actuals only rather than dropping to 0% in the forecast. A straddling FY (part actual)
  // keeps its actual-derived split.
  if(firstProjFy != null){
    const firstActualProjFy = (() => { const [y,m] = projAfter[0].ym.split('-').map(Number); return (m === 4) ? computeFY(y,m) : null; })();
    for(const b of fys){
      const fyNum = aiFyNum(b.periodLabel);
      // Fully-projected FY = starts at or after the first projected month's FY, and that FY has
      // no actual months. Straddle only happens on the boundary FY; mark strictly-after as null.
      if(fyNum > firstProjFy || (fyNum === firstProjFy && firstActualProjFy === firstProjFy)){
        if(b.reactive){ b.reactive.cost = null; b.reactive.wo = null; b.reactive.cpw = null; }
        if(b.proactive){ b.proactive.cost = null; b.proactive.wo = null; b.proactive.cpw = null; }
      }
    }
  }
  return { fys, firstProjFy, projInfo };
}

function aiFyNum(label){ // 'FY27' -> 2027
  const two = parseInt(String(label).replace(/[^0-9]/g,''), 10);
  return 2000 + two;
}

// One FY line chart (single metric). `accessor(fyRec)` returns the y value.
function aiRenderFyChart(hostId, fyRecs, accessor, opts){
  const host = document.getElementById(hostId);
  if(!host) return;
  const periods = fyRecs.map(r => r.periodLabel);
  const pts = fyRecs.map(r => ({ y: accessor(r) }));
  renderLineChart(host, [{ name: opts.name, color: opts.color, points: pts }], periods, {
    fmt: opts.fmt, yLabel: opts.yLabel, height: opts.height || 240, isPercent: !!opts.isPercent
  });
}

// One combined history→forecast chart: solid actual series + dashed forecast series that
// share the boundary FY so the line is continuous, plus a "today" vertical marker.
function aiRenderCombinedChart(hostId, fyRecs, firstProjFy, accessor, opts){
  const host = document.getElementById(hostId);
  if(!host) return;
  const periods = fyRecs.map(r => r.periodLabel);
  // Split index: first FY that is (partly or fully) projected.
  let splitIdx = -1;
  if(firstProjFy != null){
    splitIdx = fyRecs.findIndex(r => aiFyNum(r.periodLabel) >= firstProjFy);
  }
  const actualPts = fyRecs.map((r, i) => ({ y: (splitIdx < 0 || i <= (splitIdx - 1)) ? accessor(r) : null }));
  // Forecast series starts one point BEFORE the split so it connects to the actual line.
  const fcPts = fyRecs.map((r, i) => ({ y: (splitIdx >= 0 && i >= (splitIdx - 1) && i >= 0) ? accessor(r) : null }));
  // If there is no projected FY (edge case), just show the actual line.
  const series = [{ name: 'Actual', color: opts.color, points: actualPts }];
  if(splitIdx >= 0){
    series.push({ name: 'Forecast', color: opts.color, dashed: true, points: fcPts });
  }
  const vr = (splitIdx >= 0) ? { atIndex: splitIdx - 0.0001 < 0 ? 0 : (splitIdx - 1 >= 0 ? splitIdx - 0.5 : 0), label: 'forecast →', color: '#888' } : null;
  renderLineChart(host, series, periods, {
    fmt: opts.fmt, yLabel: opts.yLabel, height: opts.height || 240, isPercent: !!opts.isPercent,
    verticalRule: (splitIdx >= 1) ? { atIndex: splitIdx - 0.5, label: 'forecast', color: '#888' } : null,
    targetLine: opts.targetLine, targetLineLabel: opts.targetLineLabel
  });
}

function renderSection5(){
  const host = document.getElementById('section5');
  if(!host) return;
  if(!STATE.costEnriched && !STATE.pmEnriched){
    host.innerHTML = '<div class="dd-empty" style="margin:24px">Load cost and PM data to see asset-specific insights.</div>';
    return;
  }
  const s3 = STATE.section3;
  const classList = flCurrentClassList();
  flResolveSelectedClasses(classList);
  const sel = s3.selectedClasses || [];
  if(!sel.length){
    host.innerHTML = '<div class="dd-empty" style="margin:24px">No asset classes selected. Choose one or more on the Forward look tab first.</div>';
    return;
  }
  // Clamp stepper index
  if(s3.aiStepIndex == null) s3.aiStepIndex = 0;
  if(s3.aiStepIndex >= sel.length) s3.aiStepIndex = 0;
  if(s3.aiStepIndex < 0) s3.aiStepIndex = sel.length - 1;
  const idx = s3.aiStepIndex;
  const ac = sel[idx];

  // Point the model at this class and clear per-class caches so all reads are for `ac`.
  s3.assetClass = ac; s3.assetType = null;
  flClearClassCaches();

  // --- KPI cards + charts pull this class's data; roll-up (R) ties to Forecast result ---
  const R = flComputeRollup();
  // flComputeRollup leaves the stepped class restored; re-point at ac for our own reads.
  s3.assetClass = ac; s3.assetType = null;
  flClearClassCaches();
  const target = (s3.compTrajectory && s3.compTrajectory.kind === 'improve') ? s3.compTrajectory.targetPct : null;
  const trajText = aiTrajText(s3);

  host.innerHTML = `
    <div class="ai-wrap">
      <div class="ai-stepper">
        <button class="fl-stepper-nav" id="aiPrev" type="button" ${sel.length<=1?'disabled':''}>‹ Prev</button>
        <div class="ai-stepper-center">
          <div class="ai-stepper-eyebrow">Asset specific insights · ${idx+1} of ${sel.length}</div>
          <div class="ai-stepper-title">${escapeHtml(ac)}</div>
        </div>
        <button class="fl-stepper-nav" id="aiNext" type="button" ${sel.length<=1?'disabled':''}>Next ›</button>
      </div>

      <div class="ai-export-row">
        <button class="fl-btn-sec" id="aiExportPdf" type="button">⤓ Export PDF (all asset classes)</button>
      </div>

      ${aiCardsHTML(ac, R, s3)}
      ${aiHistSectionHTML('ai', ac)}
      ${aiFwdSectionHTML('ai', ac, trajText)}
    </div>
  `;

  aiRenderChartsInto(ac, 'ai');

  // ---- Stepper + export wiring ----
  const prev = document.getElementById('aiPrev');
  const next = document.getElementById('aiNext');
  if(prev) prev.onclick = () => { s3.aiStepIndex = (idx - 1 + sel.length) % sel.length; renderSection5(); };
  if(next) next.onclick = () => { s3.aiStepIndex = (idx + 1) % sel.length; renderSection5(); };
  const exp = document.getElementById('aiExportPdf');
  if(exp) exp.onclick = () => aiExportPDF();
}

// PM-compliance trajectory description used across the tab and export.
function aiTrajText(s3){
  const ct = s3.compTrajectory;
  if(ct.kind === 'improve') return `PM compliance → ${ct.targetPct}% over ${ct.byMonth} months`;
  if(ct.kind === 'trend') return 'PM compliance continuing recent trend';
  return 'PM compliance held flat';
}

// The four KPI cards for one class (uses the roll-up R for consistency with Forecast result).
function aiCardsHTML(ac, R, s3){
  const corr = R.perClass.corrective.find(c => c.ac === ac) || { totalSpend: 0, totalVol: 0, reductionPct: 0 };
  const target = (s3.compTrajectory && s3.compTrajectory.kind === 'improve') ? s3.compTrajectory.targetPct : null;
  const trajText = aiTrajText(s3);
  const money = (v) => (v == null || !isFinite(v)) ? '—' : (v < 0 ? '−' : (v > 0 ? '+' : '')) + fmtCurrency(Math.abs(v));
  const num = (v) => (v == null || !isFinite(v)) ? '—' : (v < 0 ? '−' : (v > 0 ? '+' : '')) + fmtNum(Math.abs(Math.round(v)));
  const kpiCard = (label, valStr, sign, goodIfNeg, sub) => {
    const cls = sign === 0 ? '' : (goodIfNeg ? (sign < 0 ? 'savings-pos' : 'savings-neg') : (sign > 0 ? 'savings-pos' : 'savings-neg'));
    return `<div class="fr-kpi ${cls}">
      <div class="fr-kpi-label">${escapeHtml(label)}</div>
      <div class="fr-kpi-value">${valStr}</div>
      <div class="fr-kpi-sub">${escapeHtml(sub)}</div>
    </div>`;
  };
  const sgn = (v) => (v == null || v === 0) ? 0 : (v < 0 ? -1 : 1);
  return `<div class="fr-kpis">
    ${kpiCard('AMP8 corrective spend change', money(corr.totalSpend), sgn(corr.totalSpend), true, `${trajText}${corr.reductionPct ? ' · ' + corr.reductionPct + '% manual reduction applied' : ''}`)}
    ${kpiCard('AMP8 corrective work-order change', num(corr.totalVol), sgn(corr.totalVol), true, 'Corrective work orders vs baseline, FY26–30')}
    <div class="fr-kpi ai-target-card">
      <div class="fr-kpi-label">PM compliance target</div>
      <div class="fr-kpi-value">${target != null ? fmtPct(target) : '—'}</div>
      <div class="fr-kpi-sub">${escapeHtml(trajText)}</div>
    </div>
  </div>`;
}

// The two chart sections with host divs whose ids are prefixed (so multiple copies — e.g. per
// class in the PDF — can coexist). On-screen uses prefix 'ai' → ids 'aiHistReactive' etc.
// Historical section (actuals): spend, work orders, cost per job (each reactive/proactive/
// corrective), plus PM % and reactive share %. Host ids are prefixed so copies can coexist.
function aiHistSectionHTML(prefix, ac){
  return `
    <div class="ai-section">
      <h3 class="ai-section-title">Historical trends (actuals)</h3>
      <div class="ai-section-sub">Year-on-year actuals for ${escapeHtml(ac)} across all available fiscal years. Corrective = reactive + proactive.</div>
      <div class="ai-chart-grid-3">
        <div class="ai-chart-card"><div class="ai-chart-h">Corrective spend</div><div id="${prefix}HistCorrective"></div></div>
        <div class="ai-chart-card"><div class="ai-chart-h">Corrective work orders</div><div id="${prefix}HistCorrectiveWO"></div></div>
        <div class="ai-chart-card"><div class="ai-chart-h">Corrective cost per job (£/WO)</div><div id="${prefix}HistCorrectiveCPW"></div></div>
      </div>
      <div class="ai-chart-grid-2">
        <div class="ai-chart-card"><div class="ai-chart-h">PM compliance %</div><div id="${prefix}HistPM"></div></div>
        <div class="ai-chart-card"><div class="ai-chart-h">Reactive share % (reactive ÷ corrective)</div><div id="${prefix}HistShare"></div></div>
      </div>
    </div>
  `;
}

// Forward-looking section (history → forecast): same metric set as historical.
function aiFwdSectionHTML(prefix, ac, trajText){
  return `
    <div class="ai-section">
      <h3 class="ai-section-title">Forward-looking trends (history → forecast)</h3>
      <div class="ai-section-sub">Corrective actuals continue into the forecast (dashed, right of the marker) under the Forward look assumptions — ${escapeHtml(trajText.toLowerCase())}. Capped at FY30. Reactive share is actuals only (the split is not forecast in this model).</div>
      <div class="ai-chart-grid-3">
        <div class="ai-chart-card"><div class="ai-chart-h">Corrective spend</div><div id="${prefix}FwdCorrective"></div></div>
        <div class="ai-chart-card"><div class="ai-chart-h">Corrective work orders</div><div id="${prefix}FwdCorrectiveWO"></div></div>
        <div class="ai-chart-card"><div class="ai-chart-h">Corrective cost per job (£/WO)</div><div id="${prefix}FwdCorrectiveCPW"></div></div>
      </div>
      <div class="ai-chart-grid-2">
        <div class="ai-chart-card"><div class="ai-chart-h">PM compliance %</div><div id="${prefix}FwdPM"></div></div>
        <div class="ai-chart-card"><div class="ai-chart-h">Reactive share % (reactive ÷ corrective)</div><div id="${prefix}FwdShare"></div></div>
      </div>
    </div>
  `;
}

// Render all charts for class `ac` into hosts with the given id prefix. Points the model at
// `ac` and clears caches first. `chartHeight` sizes each chart (smaller for the print/PDF view).
function aiRenderChartsInto(ac, prefix, chartHeight){
  const s3 = STATE.section3;
  s3.assetClass = ac; s3.assetType = null;
  flClearClassCaches();
  const histAll = aiHistoryFYs();
  const combined = aiCombinedFYs(histAll.monthly);
  const target = (s3.compTrajectory && s3.compTrajectory.kind === 'improve') ? s3.compTrajectory.targetPct : null;
  // Reactive share needs the reactive/corrective split, which only exists in actuals. Return
  // null when reactive is absent (projected months) so the forward chart shows history only.
  const shareOf = (r) => (r.reactive && r.reactive.cost != null && r.corrective.cost > 0)
    ? (r.reactive.cost / r.corrective.cost * 100) : null;
  const H = chartHeight || 240;
  const woFmt = (v) => fmtNum(Math.round(v));
  const hf = histAll.fys;
  // Historical (actuals): corrective spend / work orders / £-per-job, PM %, reactive share %
  aiRenderFyChart(prefix+'HistCorrective',   hf, r => r.corrective.cost,{ name:'Corrective', color: COLORS.primary, fmt: fmtCurrencyFull, yLabel:'£ / year', height:H });
  aiRenderFyChart(prefix+'HistCorrectiveWO', hf, r => r.corrective.wo,  { name:'Corrective WO',color: COLORS.primary, fmt: woFmt, yLabel:'work orders / year', height:H });
  aiRenderFyChart(prefix+'HistCorrectiveCPW',hf, r => r.corrective.cpw, { name:'Corrective £/WO',color: COLORS.primary, fmt: fmtCurrencyFull, yLabel:'£ / work order', height:H });
  aiRenderFyChart(prefix+'HistPM',           hf, r => r.pmPct,          { name:'PM %',      color: COLORS.primary, fmt: v=>fmtPct(v), yLabel:'PM compliance %', isPercent:true, height:H });
  aiRenderFyChart(prefix+'HistShare',        hf, shareOf,               { name:'Reactive %',color: COLORS.danger,  fmt: v=>fmtPct(v), yLabel:'Reactive share %', isPercent:true, height:H });

  const cf = combined.fys, fp = combined.firstProjFy;
  const tl = target, tll = target!=null ? fmtPct(target)+' target' : null;
  // Forward-looking (history → forecast): corrective metrics + PM %; reactive share history-only
  aiRenderCombinedChart(prefix+'FwdCorrective',   cf, fp, r => r.corrective.cost,{ color: COLORS.primary, fmt: fmtCurrencyFull, yLabel:'£ / year', height:H });
  aiRenderCombinedChart(prefix+'FwdCorrectiveWO', cf, fp, r => r.corrective.wo,  { color: COLORS.primary, fmt: woFmt, yLabel:'work orders / year', height:H });
  aiRenderCombinedChart(prefix+'FwdCorrectiveCPW',cf, fp, r => r.corrective.cpw, { color: COLORS.primary, fmt: fmtCurrencyFull, yLabel:'£ / work order', height:H });
  aiRenderCombinedChart(prefix+'FwdPM',           cf, fp, r => r.pmPct,          { color: COLORS.primary, fmt: v=>fmtPct(v), yLabel:'PM compliance %', isPercent:true, targetLine: tl, targetLineLabel: tll, height:H });
  aiRenderCombinedChart(prefix+'FwdShare',        cf, fp, shareOf,               { color: COLORS.danger,  fmt: v=>fmtPct(v), yLabel:'Reactive share %', isPercent:true, height:H });
}

// ---- Export a single PDF containing every selected class's summary, one per page ----
// Zero-dependency: builds an off-screen print view (all classes) and calls window.print(),
// where the user chooses "Save as PDF". Print CSS shows only this view, one class per page.
function aiExportPDF(){
  const s3 = STATE.section3;
  const classList = flCurrentClassList();
  flResolveSelectedClasses(classList);
  const sel = (s3.selectedClasses || []).slice();
  if(!sel.length){ if(typeof flToast==='function') flToast('Select at least one asset class first.', true); return; }

  // Compute the roll-up once (all classes) for the KPI cards.
  const R = flComputeRollup();
  const trajText = aiTrajText(s3);

  // Preserve the on-screen stepped class so we can restore it afterwards.
  const prevClass = s3.assetClass, prevType = s3.assetType, prevStep = s3.aiStepIndex;

  // Build the off-screen print root.
  let root = document.getElementById('aiPrintRoot');
  if(root) root.remove();
  root = document.createElement('div');
  root.id = 'aiPrintRoot';

  const stamp = new Date().toISOString().slice(0,10);
  sel.forEach((ac, i) => {
    const px = 'aiP'+i+'_';
    // Page 1: header + KPI cards + historical section.
    const page1 = document.createElement('div');
    page1.className = 'ai-print-page';
    page1.innerHTML = `
      <div class="ai-print-head">
        <div class="ai-print-title">${escapeHtml(ac)}</div>
        <div class="ai-print-meta">Asset specific insights · class ${i+1} of ${sel.length} · historical · generated ${stamp}</div>
      </div>
      ${aiCardsHTML(ac, R, s3)}
      ${aiHistSectionHTML(px, ac)}
    `;
    root.appendChild(page1);
    // Page 2: header (continued) + forward-looking section.
    const page2 = document.createElement('div');
    page2.className = 'ai-print-page';
    page2.innerHTML = `
      <div class="ai-print-head">
        <div class="ai-print-title">${escapeHtml(ac)}</div>
        <div class="ai-print-meta">Asset specific insights · class ${i+1} of ${sel.length} · forward-looking · generated ${stamp}</div>
      </div>
      ${aiFwdSectionHTML(px, ac, trajText)}
    `;
    root.appendChild(page2);
  });
  document.body.appendChild(root);

  // Render each class's charts into its pages (root is laid out off-screen → charts get real
  // widths). Smaller height so each section fits on a single printed page.
  sel.forEach((ac, i) => { aiRenderChartsInto(ac, 'aiP'+i+'_', 150); });

  // Restore the model pointer + on-screen stepper state.
  s3.assetClass = prevClass; s3.assetType = prevType; s3.aiStepIndex = prevStep;
  flClearClassCaches();

  // Print, then clean up.
  const cleanup = () => {
    document.body.classList.remove('ai-printing');
    const r = document.getElementById('aiPrintRoot');
    if(r) r.remove();
    window.removeEventListener('afterprint', cleanup);
  };
  window.addEventListener('afterprint', cleanup);
  document.body.classList.add('ai-printing');
  // Defer to let layout settle before the print dialog opens.
  setTimeout(() => { try { window.print(); } catch(e) { cleanup(); } }, 60);
}
