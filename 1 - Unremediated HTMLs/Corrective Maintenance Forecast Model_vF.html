// CONTRIBUTORS — Business area + county share of spend over time
// Answers: who carries this asset class's cost, and is the mix shifting?
// ============================================================
function ddRenderContributors(){
  const el = document.getElementById('ddSContrib');
  if(!el) return;
  const agg = STATE.filters.aggregation;
  const periods = getPeriodsInRange(agg);
  const dataMonths = new Set(STATE.allMonths);
  const partial = new Set();
  if(agg === 'quarter') periods.forEach(p => { if(isPartialQuarter(p, dataMonths)) partial.add(p); });

  el.innerHTML = `
    <h3 class="ov-section-title">Who carries the spend</h3>
    <div class="dd-split">
      <div class="ov-card">
        <div class="ov-card-header"><h3 class="ov-card-title">Business area contribution</h3></div>
        <div class="ov-chart-context">Total £ by period, stacked by business area. Watch for a segment growing or shrinking as a share of the total.</div>
        <div id="ddContribBA"></div>
      </div>
      <div class="ov-card">
        <div class="ov-card-header"><h3 class="ov-card-title">County contribution</h3></div>
        <div class="ov-chart-context">Top 6 counties by total spend + Other. Shows where the geographic concentration lives and how it has shifted.</div>
        <div id="ddContribCty"></div>
      </div>
    </div>
  `;

  const rows = ddFilteredCostRows();
  if(!rows.length){
    document.getElementById('ddContribBA').innerHTML = '<div class="dd-empty">No cost data for this selection.</div>';
    document.getElementById('ddContribCty').innerHTML = '<div class="dd-empty">No cost data for this selection.</div>';
    return;
  }

  // ---- Business area contribution ----
  const baPeriodTotals = new Map(); // key = period||ba
  const baSet = new Set();
  for(const r of rows){
    const p = periodKey(r, agg);
    const ba = r.businessArea || 'Unknown';
    baSet.add(ba);
    const key = p + '||' + ba;
    baPeriodTotals.set(key, (baPeriodTotals.get(key) || 0) + (r.totalCost || 0));
  }
  const baCanonical = ['Water','Wastewater','WW Network','Bio-resourcing'];
  const baList = baCanonical.filter(b => baSet.has(b))
    .concat([...baSet].filter(b => !baCanonical.includes(b)).sort());
  const baColors = [COLORS.primary, COLORS.success, '#1565c0', '#8e44ad', COLORS.warning, COLORS.neutral, COLORS.accent];
  const baSeries = baList.map((ba, i) => ({
    name: ba,
    color: baColors[i % baColors.length],
    values: periods.map(p => baPeriodTotals.get(p + '||' + ba) || 0)
  }));
  const baHost = document.getElementById('ddContribBA');
  if(baSeries.some(s => s.values.some(v => v > 0))){
    renderStackedBarChart(baHost, baSeries, periods, { fmt: fmtCurrency, height: 280, partialPeriods: partial });
  } else {
    baHost.innerHTML = '<div class="dd-empty">No spend to split by business area.</div>';
  }

  // ---- County contribution ----
  const ctyPeriodTotals = new Map();
  const ctyTotals = new Map();
  for(const r of rows){
    const p = periodKey(r, agg);
    const cty = r.county || 'No county';  // Bio-resourcing / WW Network / Other Area plants
    const key = p + '||' + cty;
    ctyPeriodTotals.set(key, (ctyPeriodTotals.get(key) || 0) + (r.totalCost || 0));
    ctyTotals.set(cty, (ctyTotals.get(cty) || 0) + (r.totalCost || 0));
  }
  const ctyRanked = [...ctyTotals.entries()].sort((a,b) => b[1] - a[1]);
  const topCounties = ctyRanked.slice(0, 6).map(e => e[0]);
  const ctySeries = topCounties.map((cty, i) => ({
    name: cty,
    color: COLORS.series[i % COLORS.series.length],
    values: periods.map(p => ctyPeriodTotals.get(p + '||' + cty) || 0)
  }));
  if(ctyRanked.length > 6){
    const otherCties = ctyRanked.slice(6).map(e => e[0]);
    const otherVals = periods.map(p => {
      let sum = 0;
      for(const cty of otherCties) sum += ctyPeriodTotals.get(p + '||' + cty) || 0;
      return sum;
    });
    ctySeries.push({ name: `Other (${otherCties.length})`, color: COLORS.neutral, values: otherVals });
  }
  const ctyHost = document.getElementById('ddContribCty');
  if(ctySeries.some(s => s.values.some(v => v > 0))){
    renderStackedBarChart(ctyHost, ctySeries, periods, { fmt: fmtCurrency, height: 280, partialPeriods: partial });
  } else {
    ctyHost.innerHTML = '<div class="dd-empty">No spend to split by county.</div>';
  }
}

function ddRenderPareto(host, sites, split, groupColorMap){
  host.innerHTML = '';
  const paretoSites = [...sites].filter(s => s.totalCost > 0).sort((a,b) => b.reactiveCost - a.reactiveCost);
  if(!paretoSites.length){ host.innerHTML = '<div class="dd-empty">No sites with cost data.</div>'; return; }
  const totalReactive = paretoSites.reduce((s,x) => s + x.reactiveCost, 0);
  const maxTotal = Math.max(...paretoSites.map(s => s.totalCost), 1);
  const topN = 10;
  const top = paretoSites.slice(0, topN);
  const tail = paretoSites.slice(topN);

  let cum = 0;
  const enriched = top.map(s => {
    cum += s.reactiveCost;
    return { ...s, cumPct: totalReactive > 0 ? cum / totalReactive * 100 : 0 };
  });

  const groupLookup = (s) => split === 'county' ? s.county : (split === 'ba' ? s.businessArea : null);
  const colorForSite = (s) => {
    if(!split || split === 'none' || !groupColorMap) return null;
    return groupColorMap.get(groupLookup(s)) || COLORS.neutral;
  };

  const buildRow = (r) => {
    const totalPct = (r.totalCost / maxTotal) * 100;
    const reactivePct = (r.reactiveCost / maxTotal) * 100;
    const color = colorForSite(r);
    const dot = color ? `<span title="${escapeHtml(groupLookup(r))}" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${color};margin-right:6px;vertical-align:middle"></span>` : '';
    return `
      <div class="dd-pareto-row" data-site="${escapeHtml(r.site)}">
        <div class="dd-pareto-label" title="${escapeHtml(r.site)}">${dot}${escapeHtml(r.site)}</div>
        <div class="dd-pareto-bar-track">
          <div class="dd-pareto-bar-total" style="width:${totalPct.toFixed(1)}%"></div>
          <div class="dd-pareto-bar-reactive" style="width:${reactivePct.toFixed(1)}%"></div>
        </div>
        <div class="dd-pareto-value">
          <span class="reactive-v">${fmtCurrency(r.reactiveCost)}</span> / ${fmtCurrency(r.totalCost)}
          <span style="color:#999"> · cum ${r.cumPct.toFixed(0)}%</span>
        </div>
      </div>
    `;
  };

  // Optional legend when split is active
  let legendHtml = '';
  if(split && split !== 'none' && groupColorMap && groupColorMap.size){
    const entries = [...groupColorMap.entries()];
    legendHtml = `<div style="display:flex;flex-wrap:wrap;gap:8px;font-size:10.5px;color:var(--text-secondary);margin-bottom:6px">${entries.map(([g, c]) => `<span style="display:inline-flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:${c}"></span>${escapeHtml(g)}</span>`).join('')}</div>`;
  }

  let html = legendHtml + `<div class="dd-pareto-table">${enriched.map(buildRow).join('')}</div>`;
  if(tail.length){
    let tcum = cum;
    const tailEnriched = tail.map(s => {
      tcum += s.reactiveCost;
      return { ...s, cumPct: totalReactive > 0 ? tcum / totalReactive * 100 : 0 };
    });
    html += `<details class="ov-table-collapse"><summary>Show ${tail.length} more sites</summary><div class="dd-pareto-table" style="margin-top:8px">${tailEnriched.map(buildRow).join('')}</div></details>`;
  }
  host.innerHTML = html;

  host.querySelectorAll('.dd-pareto-row').forEach(rowEl => {
    const siteName = rowEl.getAttribute('data-site');
    const r = paretoSites.find(x => x.site === siteName);
    if(!r) return;
    addTooltip(rowEl, `
      <div class="tt-title">${escapeHtml(r.site)}</div>
      <div class="tt-row"><span class="tt-label">Total £:</span><span>${fmtCurrency(r.totalCost)}</span></div>
      <div class="tt-row"><span class="tt-label">Reactive £:</span><span>${fmtCurrency(r.reactiveCost)}</span></div>
      <div class="tt-row"><span class="tt-label">Reactive share:</span><span>${r.reactiveShare != null ? fmtPct(r.reactiveShare) : '—'}</span></div>
      <div class="tt-row"><span class="tt-label">WOs (R / total):</span><span>${fmtNum(r.reactiveWO)} / ${fmtNum(r.totalWO)}</span></div>
      <div class="tt-row"><span class="tt-label">PM compliance:</span><span>${r.compliance != null ? fmtPct(r.compliance) : '—'}</span></div>
    `);
  });
}

function ddRenderConcentricScatter(host, sites, split, groupColorMap){
  host.innerHTML = '';
  const all = sites.filter(s => s.reactiveCostPerWO != null && s.reactiveCostPerWO > 0 && s.compliance != null && s.totalCost > 0);

  // Top-N selector above the plot
  const topNRaw = STATE.section2.scatterTopN || 30;
  const topN = topNRaw === 'all' ? Infinity : topNRaw;
  const options = [15, 30, 50, 'all'];
  const segBtn = (n) => {
    const isActive = String(STATE.section2.scatterTopN || 30) === String(n);
    const bg = isActive ? 'var(--primary)' : 'var(--surface)';
    const fg = isActive ? '#fff' : 'var(--text-secondary)';
    return `<button data-dd-scatter-n="${n}" style="border:none;background:${bg};color:${fg};padding:3px 10px;font-size:11px;cursor:pointer;font-family:inherit;border-right:1px solid var(--border)" type="button">${n === 'all' ? 'All' : 'Top ' + n}</button>`;
  };
  const shownCount = Math.min(all.length, topN);
  let legendHtml = '';
  if(split && split !== 'none' && groupColorMap && groupColorMap.size){
    const entries = [...groupColorMap.entries()];
    legendHtml = `<div style="display:flex;flex-wrap:wrap;gap:10px;font-size:10.5px;color:var(--text-secondary);margin-bottom:6px">${entries.map(([g, c]) => `<span style="display:inline-flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:50%;border:2px solid ${c};background:transparent;box-sizing:border-box"></span>${escapeHtml(g)}</span>`).join('')}</div>`;
  }
  const controlsHtml = legendHtml + `
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:11px;color:var(--text-secondary)">
      <span>Show sites:</span>
      <div style="display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden">${options.map(segBtn).join('')}</div>
      <span style="color:#999">${fmtNum(shownCount)} of ${fmtNum(all.length)} (sorted by total £)</span>
    </div>
  `;

  const wireControls = () => {
    host.querySelectorAll('[data-dd-scatter-n]').forEach(b => b.onclick = () => {
      const v = b.getAttribute('data-dd-scatter-n');
      STATE.section2.scatterTopN = v === 'all' ? 'all' : parseInt(v, 10);
      ddRenderConcentricScatter(host, sites, split, groupColorMap);
    });
  };

  if(all.length < 2){
    host.innerHTML = controlsHtml + '<div class="dd-empty">Not enough sites with both reactive WOs and PM data in this period.</div>';
    wireControls();
    return;
  }

  // Filter to top N by total £
  const visible = (topN === Infinity || all.length <= topN)
    ? all
    : [...all].sort((a,b) => b.totalCost - a.totalCost).slice(0, topN);

  const height = 420;
  const margin = { top: 22, right: 46, bottom: 48, left: 70 };
  const w = host.clientWidth || 500;
  const width = Math.max(360, w);
  const innerW = width - margin.left - margin.right;
  const innerH = height - margin.top - margin.bottom;

  const xVals = visible.map(p => p.reactiveCostPerWO);
  const xMin = 0;
  const xMax = Math.max(...xVals) * 1.1;
  const yMin = Math.max(0, Math.min(...visible.map(p => p.compliance)) - 5);
  const yMax = 100;
  const xScale = v => margin.left + (v - xMin) / (xMax - xMin) * innerW;
  const yScale = v => margin.top + innerH - (v - yMin) / (yMax - yMin) * innerH;
  const med = (arr) => { const s = [...arr].sort((a,b) => a-b); return s[Math.floor(s.length/2)]; };
  const xMed = med(xVals);
  const yMed = med(visible.map(p => p.compliance));
  const maxTotal = Math.max(...visible.map(p => p.totalCost), 1);
  const rOuter = v => 8 + Math.sqrt(v / maxTotal) * 20;

  const svg = svgEl('svg', { viewBox: `0 0 ${width} ${height}`, preserveAspectRatio: 'xMidYMid meet' });

  const xTicks = niceTicks(xMin, xMax, 5).ticks;
  const yTicks = niceTicks(yMin, yMax, 5).ticks;
  const lastTickIdx = xTicks.length - 1;
  xTicks.forEach((t, i) => {
    const x = xScale(t);
    svg.appendChild(svgEl('line', { x1: x, y1: margin.top, x2: x, y2: margin.top + innerH, stroke: '#f0f0f0' }));
    // Last tick labelled with end-anchor so it doesn't clip off the right edge
    const anchor = (i === lastTickIdx) ? 'end' : (i === 0 ? 'start' : 'middle');
    svg.appendChild(svgEl('text', { x, y: margin.top + innerH + 14, 'text-anchor': anchor, 'font-size': 10, fill: '#666' }, fmtCurrency(t)));
  });
  yTicks.forEach(t => {
    const y = yScale(t);
    svg.appendChild(svgEl('line', { x1: margin.left, y1: y, x2: margin.left + innerW, y2: y, stroke: '#f0f0f0' }));
    svg.appendChild(svgEl('text', { x: margin.left - 6, y: y + 3, 'text-anchor': 'end', 'font-size': 10, fill: '#666' }, t.toFixed(0) + '%'));
  });
  // Median splits
  svg.appendChild(svgEl('line', { x1: xScale(xMed), y1: margin.top, x2: xScale(xMed), y2: margin.top + innerH, stroke: '#bbb', 'stroke-dasharray': '4,3' }));
  svg.appendChild(svgEl('line', { x1: margin.left, y1: yScale(yMed), x2: margin.left + innerW, y2: yScale(yMed), stroke: '#bbb', 'stroke-dasharray': '4,3' }));
  // Quadrant labels
  svg.appendChild(svgEl('text', { x: margin.left + 6, y: margin.top + 12, 'font-size': 9, fill: '#999', 'font-style': 'italic' }, 'Low £/WO · High compliance (healthy)'));
  svg.appendChild(svgEl('text', { x: margin.left + innerW - 6, y: margin.top + 12, 'text-anchor': 'end', 'font-size': 9, fill: '#999', 'font-style': 'italic' }, 'High £/WO · High compliance'));
  svg.appendChild(svgEl('text', { x: margin.left + innerW - 6, y: margin.top + innerH - 6, 'text-anchor': 'end', 'font-size': 10, fill: COLORS.danger, 'font-weight': 600 }, 'Action list (high £/WO, low PM)'));
  svg.appendChild(svgEl('text', { x: margin.left + 6, y: margin.top + innerH - 6, 'font-size': 9, fill: '#999', 'font-style': 'italic' }, 'Low £/WO · Low compliance'));
  // Axis labels
  svg.appendChild(svgEl('text', { x: margin.left + innerW / 2, y: height - 8, 'text-anchor': 'middle', 'font-size': 11, fill: '#555', 'font-weight': 600 }, 'Reactive cost per WO →'));
  svg.appendChild(svgEl('text', { x: 16, y: margin.top + innerH / 2, 'text-anchor': 'middle', 'font-size': 11, fill: '#555', 'font-weight': 600, transform: `rotate(-90 16 ${(margin.top + innerH / 2).toFixed(1)})` }, 'PM compliance %'));

  // Draw bubbles: inner filled disk first, then hollow outer ring on top so outer edge is always visible.
  // When split is active, colour the outer ring by the site's group (county or BA). Inner stays red for reactive £.
  const groupOf = (p) => split === 'county' ? p.county : (split === 'ba' ? p.businessArea : null);
  const ringColor = (p) => {
    if(!split || split === 'none' || !groupColorMap) return '#475569';
    return groupColorMap.get(groupOf(p)) || COLORS.neutral;
  };
  visible.forEach(p => {
    const cx = xScale(p.reactiveCostPerWO), cy = yScale(p.compliance);
    const rOut = rOuter(p.totalCost);
    const rIn = p.totalCost > 0 ? rOut * Math.sqrt(p.reactiveCost / p.totalCost) : 0;
    const grp = groupOf(p);
    const tip = `
      <div class="tt-title">${escapeHtml(p.site)}${grp ? ' <span style="font-weight:400;color:#999">· ' + escapeHtml(grp) + '</span>' : ''}</div>
      <div class="tt-row"><span class="tt-label">Total £:</span><span>${fmtCurrency(p.totalCost)}</span></div>
      <div class="tt-row"><span class="tt-label">Reactive £:</span><span>${fmtCurrency(p.reactiveCost)}</span></div>
      <div class="tt-row"><span class="tt-label">Reactive £/WO:</span><span>${fmtCurrencyFull(p.reactiveCostPerWO)}</span></div>
      <div class="tt-row"><span class="tt-label">PM compliance:</span><span>${fmtPct(p.compliance)}</span></div>
      <div class="tt-row"><span class="tt-label">WOs · Tasks:</span><span>${fmtNum(p.totalWO)} · ${fmtNum(p.tasks)}</span></div>

    const outer = svgEl('circle', { cx, cy, r: rOut.toFixed(1), fill: 'none', stroke: ringColor(p), 'stroke-width': 2, 'stroke-opacity': 0.9 });
    addTooltip(inner, tip);
    addTooltip(outer, tip);
    svg.appendChild(inner);
    svg.appendChild(outer);
  });

  // Label only top 6 sites in the action quadrant, sorted by reactive £/WO desc
  const actionSites = visible
    .filter(p => p.reactiveCostPerWO > xMed && p.compliance < yMed)
    .sort((a,b) => b.reactiveCostPerWO - a.reactiveCostPerWO)
    .slice(0, 6);
  actionSites.forEach(p => {
    const cx = xScale(p.reactiveCostPerWO), cy = yScale(p.compliance);
    const rOut = rOuter(p.totalCost);
    svg.appendChild(svgEl('text', {
      x: cx + rOut + 4, y: cy + 3, 'font-size': 10, fill: '#333', 'font-weight': 500
    }, p.site));
  });

  host.innerHTML = controlsHtml;
  host.appendChild(svg);
  wireControls();
}

// SECTION 7 — Movers (YoY default, toggle to prior period)

function ddRenderS7Movers(){
  const el = document.getElementById('ddS7');
  if(!el) return;
  const focus = resolveFocusPeriod();
  el.innerHTML = `<h3 class="ov-section-title">What's changed</h3><div id="ddS7Body"></div>`;
  const body = document.getElementById('ddS7Body');
  if(!focus){ body.innerHTML = '<div class="dd-empty">No focus period.</div>'; return; }
  const s2 = STATE.section2;
  const agg = STATE.filters.aggregation;
  const moverMode = s2.moverMode || 'yoy';
  const moverSort = s2.moverSort || 'abs';
  const topN = s2.moverTopN === 'all' ? Infinity : (s2.moverTopN || 5);

  const cmpPeriod = moverMode === 'yoy' ? priorYearPeriod(focus, agg) : priorPeriod(focus, agg);

  const controlsHtml = `
    <div class="dd-movers-controls">
      <span>${escapeHtml(focus)} vs ${cmpPeriod ? escapeHtml(cmpPeriod) : '—'} ${moverMode === 'yoy' ? '(YoY)' : '(prior period)'}</span>
      <span style="color:#aaa">·</span>
      <span>Compare to:</span>
      <div class="seg">
        <button data-mode="yoy" class="${moverMode === 'yoy' ? 'active' : ''}" type="button">Same period last year</button>
        <button data-mode="prior" class="${moverMode === 'prior' ? 'active' : ''}" type="button">Prior period</button>
      </div>
      <span style="color:#aaa">·</span>
      <span>Sort:</span>
      <div class="seg">
        <button data-sort="abs" class="${moverSort === 'abs' ? 'active' : ''}" type="button">Absolute Δ</button>
        <button data-sort="pct" class="${moverSort === 'pct' ? 'active' : ''}" type="button">%Δ</button>
      </div>
      <span style="color:#aaa">·</span>
      <span>Show:</span>
      <div class="seg">
        ${[5, 10, 'all'].map(n => `<button data-topn="${n}" class="${String(s2.moverTopN || 5) === String(n) ? 'active' : ''}" type="button">${n === 'all' ? 'All' : `Top ${n}`}</button>`).join('')}
      </div>
    </div>
  `;

  const wire = () => {
    body.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { STATE.section2.moverMode = b.getAttribute('data-mode'); ddRenderS7Movers(); });
    body.querySelectorAll('[data-sort]').forEach(b => b.onclick = () => { STATE.section2.moverSort = b.getAttribute('data-sort'); ddRenderS7Movers(); });
    body.querySelectorAll('[data-topn]').forEach(b => b.onclick = () => {
      const v = b.getAttribute('data-topn');
      STATE.section2.moverTopN = v === 'all' ? 'all' : parseInt(v, 10);
      ddRenderS7Movers();
    });
  };

  if(!cmpPeriod){
    body.innerHTML = controlsHtml + `<div class="dd-empty">Not enough history for the selected comparison. Try the other toggle or widen the time range.</div>`;
    wire();
    return;
  }

  const curCost = ddRowsInPeriod('cost', focus);
  const cmpCost = ddRowsInPeriod('cost', cmpPeriod);
  const curPM = ddRowsInPeriod('pm', focus);
  const cmpPM = ddRowsInPeriod('pm', cmpPeriod);
  const bySite = (rows) => { const m = new Map(); for(const r of rows){ if(!r.site) continue; if(!m.has(r.site)) m.set(r.site, []); m.get(r.site).push(r); } return m; };
  const curCostBySite = bySite(curCost), cmpCostBySite = bySite(cmpCost);
  const curPMBySite = bySite(curPM), cmpPMBySite = bySite(cmpPM);

  // Cost risers: noise filter ≥£5k in both periods
  const costMovers = [];
  for(const [site, curArr] of curCostBySite){
    const cmpArr = cmpCostBySite.get(site);
    if(!cmpArr) continue;
    const curM = computeCostMetrics(curArr), cmpM = computeCostMetrics(cmpArr);
    if(curM.totalCost < 5000 || cmpM.totalCost < 5000) continue;
    const d = curM.totalCost - cmpM.totalCost;
    if(d <= 0) continue;
    const pct = cmpM.totalCost > 0 ? d / cmpM.totalCost * 100 : null;
    costMovers.push({ site, prior: cmpM.totalCost, current: curM.totalCost, d, pct, wo: curM.totalWO, wo_prior: cmpM.totalWO });
  }
  costMovers.sort((a,b) => moverSort === 'abs' ? (b.d - a.d) : ((b.pct || 0) - (a.pct || 0)));
  const costTop = costMovers.slice(0, topN);

  // Compliance fallers: noise filter ≥5 tasks in both periods
  const compMovers = [];
  for(const [site, curArr] of curPMBySite){
    const cmpArr = cmpPMBySite.get(site);
    if(!cmpArr) continue;
    const curM = computePMMetrics(curArr), cmpM = computePMMetrics(cmpArr);
    if(curM.totalTasks < 5 || cmpM.totalTasks < 5) continue;
    if(curM.compliancePct == null || cmpM.compliancePct == null) continue;
    const d = curM.compliancePct - cmpM.compliancePct;
    if(d >= 0) continue;
    compMovers.push({ site, prior: cmpM.compliancePct, current: curM.compliancePct, d, tasks: curM.totalTasks, tasks_prior: cmpM.totalTasks });
  }
  compMovers.sort((a,b) => a.d - b.d);
  const compTop = compMovers.slice(0, topN);

  const costTable = costTop.length ? `
    <table class="ov-movers-table">
      <thead><tr><th>Site</th><th class="num">Prior £</th><th class="num">Current £</th><th class="num">Δ £</th><th class="num">Δ %</th><th class="num">WOs (prior → curr)</th></tr></thead>
      <tbody>
        ${costTop.map(r => `
          <tr>
            <td>${escapeHtml(r.site)}</td>
            <td class="num">${fmtCurrency(r.prior)}</td>
            <td class="num">${fmtCurrency(r.current)}</td>
            <td class="num delta-bad">+${fmtCurrency(r.d)}</td>
            <td class="num delta-bad">${r.pct != null ? '+' + r.pct.toFixed(0) + '%' : '—'}</td>
            <td class="num vol">${fmtNum(r.wo_prior)} → ${fmtNum(r.wo)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>` : '<div class="dd-empty">No sites meet noise filter (≥£5k in both periods).</div>';

  const compTable = compTop.length ? `
    <table class="ov-movers-table">
      <thead><tr><th>Site</th><th class="num">Prior %</th><th class="num">Current %</th><th class="num">Δ pts</th><th class="num">Tasks (prior → curr)</th></tr></thead>
      <tbody>
        ${compTop.map(r => `
          <tr>
            <td>${escapeHtml(r.site)}</td>
            <td class="num">${fmtPct(r.prior)}</td>
            <td class="num">${fmtPct(r.current)}</td>
            <td class="num delta-bad">${r.d.toFixed(1)}pp</td>
            <td class="num vol">${fmtNum(r.tasks_prior)} → ${fmtNum(r.tasks)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>` : '<div class="dd-empty">No sites meet noise filter (≥5 tasks in both periods).</div>';

  body.innerHTML = controlsHtml + `
    <div class="ov-movers-row">
      <div class="ov-movers-panel">
        <h4>Cost risers (by site)</h4>
        ${costTable}
      </div>
      <div class="ov-movers-panel">
        <h4>Compliance fallers (by site)</h4>
        ${compTable}
      </div>
    </div>
  `;
  wire();
}

// FORWARD-LOOK TAB — scenario modelling per asset class
// Sections: 1) scope strip  2) historical table + charts
// 3) PM compliance KPI strip  4) scenario controls  5) output
// ============================================================

let _flPickerState = null;

// Run a render-cycle function with _renderCache available. Inner event handlers (slider input,
// dropdown change) bypass `rerenderAll`, which means _renderCache is null and every helper
// re-iterates rows from scratch. This wrapper sets up a fresh cache for the duration of fn,
// or reuses the existing cache if one is already set up by a parent.
function flWithCache(fn){
  const wasOuter = !!_renderCache;
  if(!wasOuter) _renderCache = {};
  try { fn(); } finally { if(!wasOuter) _renderCache = null; }
}

// Debounce: delay calling fn until `ms` have passed since the last call.
// Used so that slider drags (oninput firing per pixel) don't cause one render per pixel.
function flDebounce(fn, ms){
  let t = null;
  return function(){
    const args = arguments, ctx = this;
    clearTimeout(t);
    t = setTimeout(() => fn.apply(ctx, args), ms);
  };
}


// ============================================================
// CHANGE 2 — Multi-class scenario model UI
// Top-N selector → per-class typed sensitivity table → global compliance/
// model controls → output stepper (one class at a time) → CSV export/import.
// Reuses the existing projection engine (flComputeProjection) and output
// renderer (flRenderOutput) by driving s3.assetClass per stepped class.
// ============================================================

// ---- Ranking: order asset classes by total corrective spend (reactive+proactive), desc ----
function flRankClassesByCorrective(classList){
  const spend = {};
  for(const r of (STATE.costEnriched || [])){
    const k = r.assetClass || 'Unknown';
    if(!classList.includes(k)) continue;
    spend[k] = (spend[k] || 0) + (r.correctiveCost || 0);
  }
  return [...classList].sort((a,b) => (spend[b]||0) - (spend[a]||0));
}

// Corrective-spend map (assetClass -> total corrective £) for the given classes; used to
// show each class's spend beside its checkbox and to order the list.
function flCorrectiveSpendMap(classList){
  const spend = {};
  for(const ac of classList) spend[ac] = 0;
  for(const r of (STATE.costEnriched || [])){
    const k = r.assetClass || 'Unknown';
    if(spend[k] === undefined) continue;
    spend[k] += (r.correctiveCost || 0);
  }
  return spend;
}

// ---- Resolve the current selection into an ordered, valid class list ----
// Source of truth is s3.selectedClassSet (a Set the user edits via checkboxes). On first
// load (before any user choice) it defaults to the top 5 by corrective spend. We always
// intersect with the currently-available classes (filters can change what's available) and
// order the result by corrective spend, biggest first.
function flResolveSelectedClasses(classList){
  const s3 = STATE.section3;
  const ranked = flRankClassesByCorrective(classList);

  // Initialise the selection set the first time, defaulting to the top 5 by corrective spend.
  if(!(s3.selectedClassSet instanceof Set)){
    const defaultN = Math.min(s3.topN || 5, ranked.length);
    s3.selectedClassSet = new Set(ranked.slice(0, defaultN));
  }
  // Keep only classes that still exist under the current filters.
  const available = new Set(classList);
  const chosen = [...s3.selectedClassSet].filter(ac => available.has(ac));
  s3.selectedClassSet = new Set(chosen);

  // Ordered array (by corrective spend, biggest first) for everything downstream.
  s3.selectedClasses = ranked.filter(ac => s3.selectedClassSet.has(ac));

  // Ensure a per-class sensitivity bucket exists for each selected class
  for(const ac of s3.selectedClasses){
    if(!s3.perClassSensitivities[ac]){
      s3.perClassSensitivities[ac] = {
        correctiveVol: null, correctiveCpw: null,
        _touched: { correctiveVol:false, correctiveCpw:false }
      };
    }
  }
  // Clamp the output stepper index
  if(s3.outputStepIndex >= s3.selectedClasses.length) s3.outputStepIndex = 0;
  if(s3.outputStepIndex < 0) s3.outputStepIndex = 0;
  return s3.selectedClasses;
}

// ---- Clear all per-class caches (history + filtered rows) when the active class changes ----
function flClearClassCaches(){
  if(!_renderCache) return;
  delete _renderCache.flAvailableFys;
  // All per-class caches are now class-scoped by key (flHistory_/flCostRows_/flPMRows_/
  // flBaselineAvg_/flProj_), so a sweep can't reuse another class's data. Still, drop them
  // on an explicit class switch so memory doesn't grow unbounded across many toggles.
  for(const k of Object.keys(_renderCache)){
    if(k.indexOf('flHistory_') === 0 || k.indexOf('flCostRows_') === 0 ||
       k.indexOf('flPMRows_') === 0 || k.indexOf('flBaselineAvg_') === 0 ||
       k.indexOf('flProj_') === 0 || k.indexOf('flAvailableFys_') === 0 ||
       k.indexOf('_flFit_') === 0){
      delete _renderCache[k];
    }
  }
}

// ---- Fit the four elasticities for a given asset class (as %/pp for display + prefill) ----
// Temporarily points the history at `ac`, fits, and returns { key: {pctPerPp, r2, n, q} }.
function flFitsForClass(ac){
  const s3 = STATE.section3;
  const prevClass = s3.assetClass, prevType = s3.assetType;
  s3.assetClass = ac; s3.assetType = null;
  flClearClassCaches();   // force history + rows recompute for this class
  const history = flMonthlyHistory(s3.historyMonths);
  const keys = ['correctiveVol','correctiveCpw'];
  const getters = {
    correctiveVol: r => r.corrective.wo,   correctiveCpw: r => r.corrective.cpw
  };
  const out = {};
  for(const k of keys){
    const fit = flFitElasticityFromHistory(history, getters[k], FL_LAG_MONTHS, s3.historicalWindow);
    // "% change per +1pp compliance" = -elasticity*100 (positive elasticity ⇒ metric falls as compliance rises)
    out[k] = { pctPerPp: -fit.elasticity * 100, r2: fit.r2, n: fit.n, q: flFitQuality(fit.r2), elasticity: fit.elasticity };
  }
  // restore
  s3.assetClass = prevClass; s3.assetType = prevType;
  flClearClassCaches();
  return out;
}

// ---- Ensure per-class sensitivities are pre-filled from the fit where untouched ----
function flPrefillSensitivities(ac, fits){
  const b = STATE.section3.perClassSensitivities[ac];
  if(!b) return;
  ['correctiveVol','correctiveCpw'].forEach(k => {
    if(!b._touched[k]){
      const v = fits[k] && isFinite(fits[k].pctPerPp) ? Number(fits[k].pctPerPp.toFixed(2)) : 0;
      b[k] = v;
    }
  });
}

// ---------- Main orchestrator (replaces the single-class scope build) ----------
function flRenderScenarioTab(){
  const host = document.getElementById('section3');
  if(!host) return;
  if(!STATE.costEnriched && !STATE.pmEnriched){ host.innerHTML = ''; return; }
  const s3 = STATE.section3;

  // Universe of asset classes (respecting global BA / county / Unknown filters)
  const costAll = getFilteredCostRows();
  const pmAll = getFilteredPMRows();
  const classSet = new Set();
  [...costAll, ...pmAll].forEach(r => { if(r.assetClass && r.assetClass !== 'Unknown') classSet.add(r.assetClass); });
  if(STATE.filters.includeUnknown) classSet.add('Unknown');
  const classList = [...classSet].sort();

  if(!classList.length){
    host.innerHTML = '<div class="dd-empty">No asset classes available for the current filter.</div>';
    return;
  }

  flResolveSelectedClasses(classList);

  host.innerHTML = `
    <div id="flTopSelector"></div>
    <div id="flGlobalControls"></div>
    <div id="flAssumptions"></div>
    <div id="flOutputStepper"></div>
    <div id="flOutput"></div>
  `;

  flRenderTopSelector(classList);
  flRenderGlobalControls();
  flRenderAssumptionsTable(classList);
  flRenderOutputStepper();
  flRenderSteppedOutput();
}

// ---------- Top-N selector ----------
// ---------- Asset-class multi-select (checkbox list of ALL classes) ----------
function flRenderTopSelector(classList){
  const el = document.getElementById('flTopSelector');
  if(!el) return;
  const s3 = STATE.section3;
  const ranked = flRankClassesByCorrective(classList);   // biggest corrective spend first
  const spend = flCorrectiveSpendMap(classList);
  const selectedSet = s3.selectedClassSet instanceof Set ? s3.selectedClassSet : new Set();
  const nSel = s3.selectedClasses.length;

  const rows = ranked.map(ac => {
    const checked = selectedSet.has(ac);
    return `
      <label class="fl-msel-item ${checked ? 'fl-msel-on' : ''}">
        <input type="checkbox" data-msel="${escapeHtml(ac)}" ${checked ? 'checked' : ''}>
        <span class="fl-msel-name">${escapeHtml(ac)}</span>
        <span class="fl-msel-spend">${fmtCurrency(spend[ac] || 0)}</span>
      </label>`;
  }).join('');

  el.innerHTML = `
    <div class="fl-topsel-card">
      <div class="fl-topsel-row">
        <span class="fl-topsel-label">Asset classes in scope:</span>
        <span class="fl-topsel-count">${nSel} of ${ranked.length} selected · ranked by corrective spend</span>
      </div>
      <div class="fl-section-sub" style="margin-bottom:10px">
        Tick any asset classes to include. Enter your expected sensitivities per class below, then step through each class's projection. Historical view always uses the most recent ${s3.historyMonths} months; global business area / county / Unknown filters still apply.
      </div>
      <div class="fl-msel-list" id="flMselList">${rows}</div>
      ${nSel === 0 ? '<div class="fl-msel-empty">Select at least one asset class to model.</div>' : ''}
    </div>
  `;

  el.querySelectorAll('[data-msel]').forEach(cb => {
    cb.onchange = () => {
      const ac = cb.getAttribute('data-msel');
      if(!(s3.selectedClassSet instanceof Set)) s3.selectedClassSet = new Set();
      if(cb.checked) s3.selectedClassSet.add(ac);
      else s3.selectedClassSet.delete(ac);
      s3.userChoseClasses = true;
      s3.outputStepIndex = 0;
      flRenderScenarioTab();
    };
  });
}

// ---------- Per-class assumptions table ----------
function flRenderAssumptionsTable(classList){
  const el = document.getElementById('flAssumptions');
  if(!el) return;
  const s3 = STATE.section3;

  // Nothing selected → prompt instead of an empty table.
  if(!s3.selectedClasses || !s3.selectedClasses.length){
    el.innerHTML = '<div class="fl-as-card"><div class="fl-msel-empty" style="margin:0">Select one or more asset classes above to set assumptions and see projections.</div></div>';
    return;
  }

  // Fit each selected class and pre-fill untouched cells
  const fitsByClass = {};
  for(const ac of s3.selectedClasses){
    const fits = flFitsForClass(ac);
    fitsByClass[ac] = fits;
    flPrefillSensitivities(ac, fits);
  }

  const metricCols = [
    { key:'correctiveVol', label:'Corrective volume' },
    { key:'correctiveCpw', label:'Corrective £/WO' }
  ];

  const cell = (ac, mk) => {
    const b = s3.perClassSensitivities[ac];
    const fit = fitsByClass[ac][mk];
    const val = b[mk] != null ? b[mk] : '';
    const touched = b._touched[mk];
    const q = fit.q;
    return `
      <td class="fl-as-cell ${touched?'fl-as-edited':''}">
        <div class="fl-as-input-wrap">
          <input type="number" step="0.1" value="${val}" data-as-class="${escapeHtml(ac)}" data-as-metric="${mk}" class="fl-as-input">
          <span class="fl-as-unit">%/pp</span>
        </div>
        <div class="fl-as-fit">fit ${fit.pctPerPp>=0?'+':''}${fit.pctPerPp.toFixed(1)} · R² ${fit.r2.toFixed(2)} <span class="fl-fit-q fl-fit-q-${q.cls}">${escapeHtml(q.label)}</span></div>
      </td>
    `;
  };

  const rows = s3.selectedClasses.map((ac, i) => `
    <tr class="${i===s3.outputStepIndex?'fl-as-activerow':''}">
      <td class="fl-as-rowhead">
        <div class="fl-as-rank">${i+1}</div>
        <div class="fl-as-name">${escapeHtml(ac)}</div>
      </td>
      ${metricCols.map(c => cell(ac, c.key)).join('')}
      <td class="fl-as-actions">
        <button class="fl-as-view" data-view-idx="${i}" type="button" title="View this class's projection">View ▾</button>
        <button class="fl-as-reset" data-reset-class="${escapeHtml(ac)}" type="button" title="Reset this row to fitted values">↺</button>
      </td>
    </tr>
  `).join('');

  // Overall (overarching) assumptions row — blank by default; typing a value replicates that
  // one variable to every selected class.
  const ov = s3.overallSensitivities || {};
  const overallCell = (mk) => {
    const val = ov[mk] != null ? ov[mk] : '';
    return `
      <div class="fl-ov-cell">
        <div class="fl-ov-label">${escapeHtml(metricCols.find(c=>c.key===mk).label)}</div>
        <div class="fl-as-input-wrap">
          <input type="number" step="0.1" value="${val}" data-ov-metric="${mk}" class="fl-as-input fl-ov-input" placeholder="—">
          <span class="fl-as-unit">%/pp</span>
        </div>
      </div>`;
  };
  const overallHtml = `
    <div class="fl-ov-card">
      <div class="fl-ov-head">
        <div class="fl-ov-title">Overall assumptions <span class="fl-global-badge">applies to all selected classes</span></div>
        <button class="fl-btn-sec" id="flClearOverall" type="button" title="Clear the overall boxes and revert every class to its regression-fit values">Clear overall</button>
      </div>
      <div class="fl-ov-sub">Set an expected % change per +1pp of PM compliance for all classes at once. Leave blank to let each class use its own regression fit below. Typing a value here overwrites that column for every selected class; you can still fine-tune an individual class afterwards.</div>
      <div class="fl-ov-grid">
        ${metricCols.map(c => overallCell(c.key)).join('')}
      </div>
    </div>
  `;

  el.innerHTML = `
    <div class="fl-as-card">
      <div class="fl-as-head">
        <h3 class="fl-model-title">Fitted relationships &amp; assumptions ${flHelpButton('model')}</h3>
        <div class="fl-as-toolbar">
          <button class="fl-btn-sec" id="flExportAssumptions" type="button">⤓ Export assumptions (CSV)</button>
          <button class="fl-btn-sec" id="flImportAssumptions" type="button">⤒ Import assumptions (CSV)</button>
          <button class="fl-btn-sec" id="flResetAllAssumptions" type="button">↺ Reset all to fitted</button>
          <input type="file" id="flImportFileInput" accept=".csv" style="display:none">
        </div>
      </div>
      <div class="fl-section-sub" style="margin-bottom:10px">
        Enter two assumptions per asset class — the expected <strong>% change in corrective volume</strong> and in <strong>corrective £/WO</strong> per +1 percentage point of PM compliance (corrective = reactive + proactive). Boxes are pre-filled from the regression fit (shown beneath each box with R² and quality); edit any value to override — edited cells are highlighted. These drive the corrective projection along the compliance trajectory set below.
      </div>
      ${overallHtml}
      <div class="fl-as-table-wrap">
        <table class="fl-as-table">
          <thead>
            <tr>
              <th class="fl-as-rowhead-th">Asset class</th>
              ${metricCols.map(c => `<th>${c.label}<div class="fl-as-th-sub">%/pp</div></th>`).join('')}
              <th class="fl-as-actions-th"></th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
  `;

  // Wire per-class number inputs (exclude the overall inputs, which also carry .fl-as-input)
  el.querySelectorAll('.fl-as-input:not(.fl-ov-input)').forEach(inp => {
    inp.onchange = () => {
      const ac = inp.getAttribute('data-as-class');
      const mk = inp.getAttribute('data-as-metric');
      const b = s3.perClassSensitivities[ac];
      const v = inp.value === '' ? null : Number(inp.value);
      b[mk] = (v != null && isFinite(v)) ? v : null;
      b._touched[mk] = (v != null);
      // If the edited row is the one currently shown in output, refresh output
      flRenderAssumptionsTable(classList);
      flRenderSteppedOutput();
    };
  });
  // Wire OVERALL inputs — replicate one variable to every selected class (overwriting any
  // per-class value for that variable) and mark them edited. Blank clears the overall box
  // only (per-class values are left as-is).
  el.querySelectorAll('.fl-ov-input').forEach(inp => {
    inp.onchange = () => {
      const mk = inp.getAttribute('data-ov-metric');
      const v = inp.value === '' ? null : Number(inp.value);
      const applied = (v != null && isFinite(v)) ? v : null;
      s3.overallSensitivities[mk] = applied;
      if(applied != null){
        for(const ac of s3.selectedClasses){
          const b = s3.perClassSensitivities[ac];
          if(!b) continue;
          b[mk] = applied;
          b._touched[mk] = true;
        }
      }
      flRenderAssumptionsTable(classList);
      flRenderSteppedOutput();
    };
  });
  // Clear overall boxes (does not alter per-class values)
  const clearOv = document.getElementById('flClearOverall');
  if(clearOv) clearOv.onclick = () => {
    // Clear the overall boxes AND revert every selected class back to its regression-fit
    // values (untouch so the next render re-prefills each cell from the fit).
    for(const ac of s3.selectedClasses){
      const bucket = s3.perClassSensitivities[ac];
      if(!bucket) continue;
      bucket._touched = { correctiveVol:false, correctiveCpw:false };
      bucket.correctiveVol = bucket.correctiveCpw = null;
    }
    s3.overallSensitivities = { correctiveVol:null, correctiveCpw:null };
    flRenderAssumptionsTable(classList);
    flRenderSteppedOutput();
  };
  // View buttons → jump the output stepper to that class
  el.querySelectorAll('[data-view-idx]').forEach(b => b.onclick = () => {
    s3.outputStepIndex = Number(b.getAttribute('data-view-idx'));
    flRenderOutputStepper();
    flRenderSteppedOutput();
    flRenderAssumptionsTable(classList);
    const out = document.getElementById('flOutputStepper');
    if(out && out.scrollIntoView) out.scrollIntoView({ behavior:'smooth', block:'start' });
  });
  // Per-row reset
  el.querySelectorAll('[data-reset-class]').forEach(b => b.onclick = () => {
    const ac = b.getAttribute('data-reset-class');
    const bucket = s3.perClassSensitivities[ac];
    bucket._touched = { correctiveVol:false, correctiveCpw:false };
    bucket.correctiveVol = bucket.correctiveCpw = null;
    flRenderAssumptionsTable(classList);
    flRenderSteppedOutput();
  });
  // Reset all
  const resetAll = document.getElementById('flResetAllAssumptions');
  if(resetAll) resetAll.onclick = () => {
    for(const ac of s3.selectedClasses){
      const bucket = s3.perClassSensitivities[ac];
      bucket._touched = { correctiveVol:false, correctiveCpw:false };
      bucket.correctiveVol = bucket.correctiveCpw = null;
    }
    // Also clear the overall boxes so the table returns fully to regression fits.
    s3.overallSensitivities = { correctiveVol:null, correctiveCpw:null };
    flRenderAssumptionsTable(classList);
    flRenderSteppedOutput();
  };
  // Export / import
  const exportBtn = document.getElementById('flExportAssumptions');
  if(exportBtn) exportBtn.onclick = () => flExportAssumptionsCSV();
  const importBtn = document.getElementById('flImportAssumptions');
  const fileInput = document.getElementById('flImportFileInput');
  if(importBtn && fileInput){
    importBtn.onclick = () => fileInput.click();
    fileInput.onchange = (e) => {
      const f = e.target.files && e.target.files[0];
      if(f) flImportAssumptionsCSV(f, classList);
      fileInput.value = '';
    };
  }
  // help
  el.querySelectorAll('[data-fl-help]').forEach(b => b.onclick = () => flOpenHelpModal(b.getAttribute('data-fl-help')));
}

// Helper: recompute the current class universe (used by re-render callbacks)
function flCurrentClassList(){
  const costAll = getFilteredCostRows();
  const pmAll = getFilteredPMRows();
  const classSet = new Set();
  [...costAll, ...pmAll].forEach(r => { if(r.assetClass && r.assetClass !== 'Unknown') classSet.add(r.assetClass); });
  if(STATE.filters.includeUnknown) classSet.add('Unknown');
  return [...classSet].sort();
}

// ---------- Render the projection output for the currently-stepped class ----------
// Drives s3.assetClass to the stepped class, clears the history cache, then calls the
// existing flRenderOutput()/flRenderPMStrip()/flRenderHistory() pipeline unchanged.
function flRenderSteppedOutput(){
  const s3 = STATE.section3;
  const sel = s3.selectedClasses || [];
  if(!sel.length){
    const outHost = document.getElementById('flOutput');
    if(outHost) outHost.innerHTML = '';

  s3.assetClass = ac;
  s3.assetType = null;

  flRenderOutput('flOutputInner');

// ============================================================
// CHANGE 2 — Assumptions CSV export / import (zero-dependency)
// Round-trips the per-class typed sensitivities plus the global compliance
// trajectory and model settings. Opens in Excel; import reads the same file.
// ============================================================

function flCsvEscape(v){
  const s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function flExportAssumptionsCSV(){
  const s3 = STATE.section3;
  const sel = s3.selectedClasses || [];
  const ct = s3.compTrajectory;
  const lines = [];

  // Section 1: metadata / global settings (key,value pairs on their own lines, prefixed #)
  lines.push('# UU Forward Look — scenario assumptions export');
  lines.push('# Generated,' + new Date().toISOString());
  lines.push('# selectedClasses,' + (s3.selectedClasses ? s3.selectedClasses.length : 0));
  lines.push('# trajectoryKind,' + ct.kind);
  lines.push('# trajectoryTargetPct,' + ct.targetPct);
  lines.push('# trajectoryByMonth,' + ct.byMonth);
  lines.push('# projHorizonMonths,' + s3.projHorizonMonths);
  lines.push('# historicalWindow,' + s3.historicalWindow);
  lines.push('# projAnchor,' + s3.projAnchor);
  lines.push('# naturalDriftOn,' + (s3.naturalDriftOn ? 'true' : 'false'));
  lines.push('');

  // Section 2: per-class assumptions table
  // Columns: asset_class, reactive_vol_pct_pp, reactive_cpw_pct_pp, proactive_vol_pct_pp, proactive_cpw_pct_pp, <fit references>
  lines.push([
    'asset_class',
    'corrective_vol_pct_pp','corrective_cpw_pct_pp',
    'corrective_vol_edited','corrective_cpw_edited'
  ].join(','));

  for(const ac of sel){
    const b = s3.perClassSensitivities[ac] || {};
    const t = b._touched || {};
    lines.push([
      flCsvEscape(ac),
      b.correctiveVol != null ? b.correctiveVol : '',
      b.correctiveCpw != null ? b.correctiveCpw : '',
      t.correctiveVol ? 'yes' : 'no',
      t.correctiveCpw ? 'yes' : 'no'
    ].join(','));
  }

  const csv = lines.join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const stamp = new Date().toISOString().slice(0,10);
  a.download = `uu-forward-look-assumptions_${stamp}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function flImportAssumptionsCSV(file, classList){
  const reader = new FileReader();
  reader.onload = (ev) => {
    try{
      const text = String(ev.target.result || '');
      flApplyImportedAssumptions(text, classList);
    }catch(err){
      flToast('Could not read assumptions CSV: ' + err.message, true);
    }
  };
  reader.onerror = () => flToast('Failed to read the file.', true);
  reader.readAsText(file);
}

function flApplyImportedAssumptions(text, classList){
  const s3 = STATE.section3;
  const rawLines = text.split(/\r?\n/);

  // Parse metadata (# key,value) and find the header row
  let headerIdx = -1;
  const meta = {};
  for(let i = 0; i < rawLines.length; i++){
    const ln = rawLines[i];
    if(ln.startsWith('#')){
      const body = ln.slice(1).trim();
      const ci = body.indexOf(',');
      if(ci > 0){ meta[body.slice(0, ci).trim()] = body.slice(ci + 1).trim(); }
      continue;
    }
    if(ln.trim() === '') continue;
    if(ln.toLowerCase().startsWith('asset_class')){ headerIdx = i; break; }
  }
  if(headerIdx < 0){ flToast('CSV has no "asset_class" header row — is this an assumptions export?', true); return; }

  // Apply global metadata where present
  const applyNum = (k, setter) => { if(meta[k] != null && meta[k] !== '' && isFinite(Number(meta[k]))) setter(Number(meta[k])); };
  if(meta.trajectoryKind && ['flat','improve','trend'].includes(meta.trajectoryKind)) s3.compTrajectory.kind = meta.trajectoryKind;
  applyNum('trajectoryTargetPct', v => s3.compTrajectory.targetPct = v);
  applyNum('trajectoryByMonth',   v => s3.compTrajectory.byMonth = v);
  applyNum('projHorizonMonths',   v => s3.projHorizonMonths = v);
  applyNum('historicalWindow',    v => s3.historicalWindow = v);
  if(meta.projAnchor && ['last','3mo','6mo','12mo'].includes(meta.projAnchor)) s3.projAnchor = meta.projAnchor;
  if(meta.naturalDriftOn != null) s3.naturalDriftOn = (meta.naturalDriftOn === 'true');

  // Parse the header to locate columns
  const header = flParseCsvLine(rawLines[headerIdx]).map(h => h.trim().toLowerCase());
  const col = (name) => header.indexOf(name);
  const cAc   = col('asset_class');
  const cCV   = col('corrective_vol_pct_pp');
  const cCC   = col('corrective_cpw_pct_pp');

  // Re-resolve the selected classes under the (possibly imported) topN before applying rows,
  // so buckets exist for the classes we're about to fill.
  flResolveSelectedClasses(classList);

  let applied = 0, unknown = 0;
  const importedClasses = [];
  for(let i = headerIdx + 1; i < rawLines.length; i++){
    if(rawLines[i].trim() === '' || rawLines[i].startsWith('#')) continue;
    const cells = flParseCsvLine(rawLines[i]);
    const ac = (cells[cAc] || '').trim();
    if(!ac) continue;
    importedClasses.push(ac);
    if(!s3.perClassSensitivities[ac]){
      // Class not in current selection — still store it so it applies if that class becomes selected.
      s3.perClassSensitivities[ac] = {
        correctiveVol:null, correctiveCpw:null,
        _touched:{ correctiveVol:false, correctiveCpw:false }
      };
      if(!classList.includes(ac)) unknown++;
    }
    const b = s3.perClassSensitivities[ac];
    const setCell = (colIdx, key) => {
      if(colIdx < 0) return;
      const raw = (cells[colIdx] || '').trim();
      if(raw === ''){ return; }
      const num = Number(raw);
      if(isFinite(num)){ b[key] = num; b._touched[key] = true; }
    };
    setCell(cCV, 'correctiveVol');
    setCell(cCC, 'correctiveCpw');
    applied++;
  }

  // Set the selection to the imported classes that exist in the current data (so the
  // checkboxes and everything downstream reflect the imported set). Any imported class not
  // currently available keeps its assumptions stored for when it becomes available.
  const available = new Set(classList);
  const nowSelected = importedClasses.filter(ac => available.has(ac));
  if(nowSelected.length){
    s3.selectedClassSet = new Set(nowSelected);
    s3.userChoseClasses = true;
    s3.outputStepIndex = 0;
  }

  // Full re-render so the selector, table, controls and output all reflect the import
  flRenderScenarioTab();
  let msg = `Imported assumptions for ${applied} asset class${applied===1?'':'es'}.`;
  if(unknown > 0) msg += ` (${unknown} not in the current data/filter — stored for when available.)`;
  flToast(msg, false);
}

// Minimal CSV line parser (handles quoted fields with commas and escaped quotes)
function flParseCsvLine(line){
  const out = [];
  let cur = '', inQ = false;
  for(let i = 0; i < line.length; i++){
    const ch = line[i];
    if(inQ){
      if(ch === '"'){
        if(line[i+1] === '"'){ cur += '"'; i++; }
        else inQ = false;
      } else cur += ch;
    } else {
      if(ch === '"') inQ = true;
      else if(ch === ','){ out.push(cur); cur = ''; }
      else cur += ch;
    }
  }
  out.push(cur);
  return out;
}

// Lightweight toast for import/export feedback (no dependency)
function flToast(message, isError){
  let host = document.getElementById('flToastHost');
  if(!host){ host = document.createElement('div'); host.id = 'flToastHost'; document.body.appendChild(host); }
  const t = document.createElement('div');
  t.className = 'fl-toast' + (isError ? ' fl-toast-err' : '');
  t.textContent = message;
  host.appendChild(t);
  setTimeout(() => { t.classList.add('fl-toast-show'); }, 10);
  setTimeout(() => { t.classList.remove('fl-toast-show'); setTimeout(() => t.remove(), 300); }, 4200);
}


// ---------- Forward-look row helpers ----------
// Filter cost rows to (assetClass, optional assetType) using the preindex.
// Applies global BA/county/Unknown filters. Ignores global time-range filter
// (forward look always uses the full data range).
function flFilteredCostRows(){
  const s3 = STATE.section3;
  const f = STATE.filters;
  // Class/type-scoped cache key. A generic key let a multi-class sweep (roll-up, or the
  // output stepper) reuse the first class's rows for later classes when _renderCache
  // persisted — producing per-class numbers that changed with visit order. Keying by
  // class makes that impossible.
  const _ck = 'flCostRows_' + (s3.assetClass || '') + '_' + (s3.assetType || '') + '_i' + (STATE.inflationPct || 0) + '_c' + [...f.criticality].sort().join(',');
  if(_renderCache && _renderCache[_ck]) return _renderCache[_ck];
  const hasBA = f.businessArea.size > 0 && f.businessArea.size < STATE.dimensions.businessAreas.length;
  const hasCty = f.county.size > 0 && f.county.size < STATE.dimensions.counties.length;
  const critDim = (STATE.dimensions.criticalities || []);
  const hasCrit = f.criticality.size > 0 && f.criticality.size < critDim.length;
  const base = (STATE.costByAssetClass && STATE.costByAssetClass.get(s3.assetClass)) || [];
  const out = [];
  for(const r of base){
    if(s3.assetType && r.assetType !== s3.assetType) continue;
    if(hasBA && !f.businessArea.has(r.businessArea)) continue;
    if(hasCty){ const ck = r.county || 'No county'; if(!f.county.has(ck)) continue; }
    if(hasCrit && !f.criticality.has(normCriticality(r.sapCriticality))) continue;
    if(!f.includeUnknown && (r.assetClass === 'Unknown' || r.equipmentClass === 'Unknown' || !r.assetClass)) continue;
    out.push(r);
  }
  const deflated = deflateRows(out);
  if(_renderCache) _renderCache[_ck] = deflated;
  return deflated;
}
function flFilteredPMRows(){
  const s3 = STATE.section3;
  const f = STATE.filters;
  const _ck = 'flPMRows_' + (s3.assetClass || '') + '_' + (s3.assetType || '') + '_c' + [...f.criticality].sort().join(',');
  if(_renderCache && _renderCache[_ck]) return _renderCache[_ck];
  const hasBA = f.businessArea.size > 0 && f.businessArea.size < STATE.dimensions.businessAreas.length;
  const hasCty = f.county.size > 0 && f.county.size < STATE.dimensions.counties.length;
  const critDim = (STATE.dimensions.criticalities || []);
  const hasCrit = f.criticality.size > 0 && f.criticality.size < critDim.length;
  const base = (STATE.pmByAssetClass && STATE.pmByAssetClass.get(s3.assetClass)) || [];
  const out = [];
  for(const r of base){
    if(s3.assetType && r.assetType !== s3.assetType) continue;
    if(hasBA && !f.businessArea.has(r.businessArea)) continue;
    if(hasCty){ const ck = r.county || 'No county'; if(!f.county.has(ck)) continue; }
    if(hasCrit && !f.criticality.has(normCriticality(r.sapCriticality))) continue;
    if(!f.includeUnknown && (r.assetClass === 'Unknown' || !r.assetClass)) continue;
    out.push(r);
  }
  if(_renderCache) _renderCache[_ck] = out;
  return out;
}

// Build a monthly history array of metric records, latest n months. Each record:
// { ym, monthLabel, reactive: {wo,cost,cpw}, proactive:{...}, preventative:{...},
//   corrective:{...}, total:{...}, pmPct, pmTasks, pmOverdue }
function flMonthlyHistory(n){
  const s3 = STATE.section3;
  const _hk = 'flHistory_' + (s3.assetClass || '') + '_' + (s3.assetType || '') + '_' + n + '_i' + (STATE.inflationPct || 0) + '_c' + [...STATE.filters.criticality].sort().join(',');
  if(_renderCache && _renderCache[_hk]) return _renderCache[_hk];
  const months = STATE.allMonths.slice(-n);
  const costRows = flFilteredCostRows();
  const pmRows = flFilteredPMRows();
  const costByMonth = new Map();
  for(const r of costRows){
    if(!costByMonth.has(r.ym)) costByMonth.set(r.ym, []);
    costByMonth.get(r.ym).push(r);
  }
  const pmByMonth = new Map();
  for(const r of pmRows){
    if(!pmByMonth.has(r.ym)) pmByMonth.set(r.ym, []);
    pmByMonth.get(r.ym).push(r);
  }
  // First pass: build the per-month records with pmPct
  const out = months.map(ym => {
    const cm = computeCostMetrics(costByMonth.get(ym) || []);
    const pmm = computePMMetrics(pmByMonth.get(ym) || []);
    const wrap = (cost, wo) => ({ wo, cost, cpw: wo > 0 ? cost / wo : null });
    return {
      ym,
      monthLabel: monthLabel(ym),
      reactive:     wrap(cm.reactiveCost,     cm.reactiveWO),
      proactive:    wrap(cm.proactiveCost,    cm.proactiveWO),
      preventative: wrap(cm.preventativeCost, cm.preventativeWO),
      corrective:   wrap(cm.correctiveCost,   cm.correctiveWO),
      total:        wrap(cm.totalCost,        cm.totalWO),
      pmPct: pmm.compliancePct,
      pmTasks: pmm.totalTasks,
      pmOverdue: pmm.overdueTasks
    };
  });
  // Second pass: add the M-6 PM compliance column (the value 6 months earlier — the lagged
  // value the model treats as the driver of THIS month's reactive volume / £-per-WO).
  // For early rows where the lookback falls before the visible history, search STATE.pmEnriched
  // directly so we can still surface a value if the data exists.
  const lag = FL_LAG_MONTHS;
  const allPmByMonth = new Map();
  for(const r of pmRows){
    if(!allPmByMonth.has(r.ym)) allPmByMonth.set(r.ym, []);
    allPmByMonth.get(r.ym).push(r);
  }
  // Also build a "wider history" map of the entire month list, not just the last n months
  const widerCompliance = new Map();
  for(const ym of STATE.allMonths){
    const grp = allPmByMonth.get(ym);
    if(!grp || !grp.length){ widerCompliance.set(ym, null); continue; }
    widerCompliance.set(ym, computePMMetrics(grp).compliancePct);
  }
  const ymMinusN = (ym, n) => {
    let [y, m] = ym.split('-').map(Number);
    m -= n;
    while(m <= 0){ m += 12; y -= 1; }
    return `${y}-${String(m).padStart(2,'0')}`;
  };
  out.forEach(r => {
    r.pmPctM6 = widerCompliance.has(ymMinusN(r.ym, lag)) ? widerCompliance.get(ymMinusN(r.ym, lag)) : null;
  });
  if(_renderCache) _renderCache[_hk] = out;
  return out;
}

// List the FYs that have any data for the currently scoped asset class.
// Returns [{fy, monthsCovered, isComplete}] sorted oldest → newest.
function flAvailableFys(){
  const s3 = STATE.section3;
  const _ak = 'flAvailableFys_' + (s3.assetClass || '') + '_' + (s3.assetType || '') + '_i' + (STATE.inflationPct || 0) + '_c' + [...STATE.filters.criticality].sort().join(',');
  if(_renderCache && _renderCache[_ak]) return _renderCache[_ak];
  const rows = flFilteredCostRows();
  const monthsByFy = new Map();
  for(const r of rows){
    if(!r.year || !r.month) continue;
    const fy = computeFY(r.year, r.month);
    if(!monthsByFy.has(fy)) monthsByFy.set(fy, new Set());
    monthsByFy.get(fy).add(r.ym);
  }
  const out = [];
  for(const [fy, ymSet] of monthsByFy){
    out.push({ fy, monthsCovered: ymSet.size, isComplete: ymSet.size >= 12 });
  }
  out.sort((a,b) => a.fy - b.fy);
  if(_renderCache) _renderCache[_ak] = out;
  return out;
}

// Compute the historical average for a chosen baseline period.
// kind: 'fy' uses fy arg; 'last_12mo' / 'last_6mo' use trailing months from latest data.
// Returns { reactive: {wo, cost, cpw}, proactive:{...}, preventative:{...},
//           corrective:{...}, total:{...}, monthsCovered, periodLabel }.
// Averages are MONTHLY rates (sum across period ÷ months covered) for wo + cost;
// £/WO is sum-then-divide (Σ£ / ΣWO) so it's grain-independent.
function flComputeBaselineAverages(kind, fy){
  const s3 = STATE.section3;
  // Cache key MUST include the asset class (and type), because flFilteredCostRows() below
  // is class-scoped. Without this, a roll-up that sweeps classes would reuse the first
  // class's baseline for every subsequent class. (This was the FY-card vs Forecast-result
  // mismatch: only the first class swept — Pump — was correct.)
  const cacheKey = 'flBaselineAvg_' + (s3.assetClass || '') + '_' + (s3.assetType || '') + '_' + kind + '_' + (fy || '') + '_i' + (STATE.inflationPct || 0) + '_c' + [...STATE.filters.criticality].sort().join(',');
  if(_renderCache && _renderCache[cacheKey]) return _renderCache[cacheKey];
  const rows = flFilteredCostRows();
  // Build the set of months in scope
  let inScope, label;
  if(kind === 'fy' && fy != null){
    inScope = (r) => computeFY(r.year, r.month) === fy;
    label = 'FY' + String(fy).slice(-2) + ' average';
  } else if(kind === 'last_12mo'){
    const lastYm = STATE.allMonths[STATE.allMonths.length - 1];
    if(!lastYm){ inScope = () => false; label = 'No data'; }
    else {
      const cutoffYm = (() => {
        let [y, m] = lastYm.split('-').map(Number);
        m -= 11;
        while(m <= 0){ m += 12; y -= 1; }
        return `${y}-${String(m).padStart(2,'0')}`;
      })();
      inScope = (r) => r.ym >= cutoffYm && r.ym <= lastYm;
      label = 'Last 12-month average';
    }
  } else if(kind === 'last_6mo'){
    const lastYm = STATE.allMonths[STATE.allMonths.length - 1];
    if(!lastYm){ inScope = () => false; label = 'No data'; }
    else {
      const cutoffYm = (() => {
        let [y, m] = lastYm.split('-').map(Number);
        m -= 5;
        while(m <= 0){ m += 12; y -= 1; }
        return `${y}-${String(m).padStart(2,'0')}`;
      })();
      inScope = (r) => r.ym >= cutoffYm && r.ym <= lastYm;
      label = 'Last 6-month average';
    }
  } else {
    inScope = () => false;
    label = 'No data';
  }
  // Filter rows + collect months covered
  const monthSet = new Set();
  const filtered = [];
  for(const r of rows){
    if(!inScope(r)) continue;
    monthSet.add(r.ym);
    filtered.push(r);
  }
  const monthsCovered = monthSet.size;
  if(!monthsCovered){
    const empty = { wo: 0, cost: 0, cpw: null };
    const result = {
      reactive: empty, proactive: empty, preventative: empty,
      corrective: empty, total: empty,
      monthsCovered: 0, periodLabel: label
    };
    if(_renderCache) _renderCache[cacheKey] = result;
    return result;
  }
  // Aggregate using existing computeCostMetrics (sum-then-divide)
  const cm = computeCostMetrics(filtered);
  // Convert to per-month rates for wo + cost (grain-aware scaling done at chart render time)
  const result = {
    reactive:     { wo: cm.reactiveWO     / monthsCovered, cost: cm.reactiveCost     / monthsCovered, cpw: cm.costPerWO.reactive },
    proactive:    { wo: cm.proactiveWO    / monthsCovered, cost: cm.proactiveCost    / monthsCovered, cpw: cm.costPerWO.proactive },
    preventative: { wo: cm.preventativeWO / monthsCovered, cost: cm.preventativeCost / monthsCovered, cpw: cm.costPerWO.preventative },
    corrective:   { wo: cm.correctiveWO   / monthsCovered, cost: cm.correctiveCost   / monthsCovered, cpw: cm.costPerWO.corrective },
    total:        { wo: cm.totalWO        / monthsCovered, cost: cm.totalCost        / monthsCovered, cpw: cm.costPerWO.total },
    monthsCovered, periodLabel: label
  };
  if(_renderCache) _renderCache[cacheKey] = result;
  return result;
}

// Scale the per-month rates from flComputeBaselineAverages to match a display grain.
// volume + cost scale by months-per-period; £/WO is a unit rate, unchanged.
function flScaleBaselineForGrain(avgs, grain){
  const factor = grain === 'fy' ? 12 : grain === 'quarter' ? 3 : 1;
  const scale = (m) => ({ wo: m.wo * factor, cost: m.cost * factor, cpw: m.cpw });
  return {
    reactive: scale(avgs.reactive), proactive: scale(avgs.proactive),
    preventative: scale(avgs.preventative), corrective: scale(avgs.corrective),
    total: scale(avgs.total),
    monthsCovered: avgs.monthsCovered, periodLabel: avgs.periodLabel
  };
}
