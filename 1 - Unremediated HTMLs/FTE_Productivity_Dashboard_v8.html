  _CM_COUNTIES:['Greater Manchester','Lancashire','Cheshire','Cumbria','Merseyside','Bioresources'],
  countyMatrix(){
    const el=document.getElementById('page-countymatrix'); this._impInit();
    const esc=U.esc, derived=State.derived||[];
    const mMs=(ym,end)=>{ const q=(ym||'').split('-'); const y=+q[0],mo=+q[1]; if(!y||!mo)return end?Infinity:-Infinity; return end?Date.UTC(y,mo,0,23,59,59):Date.UTC(y,mo-1,1); };
    const win=o=>({s:mMs(o.start,false),e:mMs(o.end,true)});
    const inWin=(r,w)=>r.rd>=w.s&&r.rd<=w.e;
    const dep=this._impDeploy, base=this._impBase, dw=win(dep), bw=win(base);
    const counties=this._CM_COUNTIES;
    const showAll=this._cmShowAll, showMode=this._cmShow;
    // sections = business units (biggest first); roles present per unit (named roles only unless "all")
    const bus=this._impBUList().map(x=>x.k);
    const roleOK=role=>{ if(!role||role==='Unknown'||role==='(Blank)')return false; if(!showAll&&role==='Other')return false; return true; };
    const urMap=Agg.groupBy(derived,r=>((r.businessUnit||'')+'|||'+(r.role||''))); const unitRoles={};
    urMap.forEach((b,k)=>{ const i=k.indexOf('|||'); const bu=k.slice(0,i), role=k.slice(i+3); if(!bu||!roleOK(role)||b.n<100)return; (unitRoles[bu]=unitRoles[bu]||[]).push({role,n:b.n}); });
    Object.keys(unitRoles).forEach(bu=>unitRoles[bu].sort((a,b)=>b.n-a.n));
    // deploy + baseline aggregates keyed by unit|||county|||role (one pass each)
    const keyf=r=>((r.businessUnit||'')+'|||'+(r.county||'')+'|||'+(r.role||''));
    const depMap=Agg.groupRows(derived.filter(r=>inWin(r,dw)),keyf), blMap=Agg.groupRows(derived.filter(r=>inWin(r,bw)),keyf);
    const stat=(map,bu,co,role)=>{ const a=map.get(bu+'|||'+co+'|||'+role); return a&&a.length?this._impStats(a):null; };
    const r23=(bu,co)=>{ const svc=/clean/i.test(bu)?'clean':/wastewater/i.test(bu)?'waste':/bioresource/i.test(bu)?'bio':''; const m={clean:['Greater Manchester','Lancashire'],waste:['Cheshire'],bio:['Bioresources']}; return (m[svc]||[]).indexOf(co)>=0; };
    // shading + chip
    const shLevel=(v,rgb)=>{ if(v==null||!isFinite(v))return 'transparent'; const a=Math.max(0,Math.min(0.5,(v-0.44)/(0.60-0.44)*0.5)); return 'rgba('+rgb+','+a.toFixed(3)+')'; };
    const shDelta=d=>{ if(d==null||!isFinite(d)||Math.abs(d)<0.0005)return 'transparent'; const a=Math.min(0.4,Math.abs(d)/0.05*0.4); return (d>0?'rgba(27,110,62,':'rgba(178,59,59,')+a.toFixed(3)+')'; };
    const chip=d=>{ if(d==null||!isFinite(d))return ''; const c=Math.abs(d)<0.0005?'var(--text3)':(d>0?'var(--green)':'var(--red)'), ar=Math.abs(d)<0.0005?'':(d>0?'▲':'▼'); return '<div style="font-size:8.5px;font-weight:700;color:'+c+';line-height:1.1">'+ar+(d>0?'+':'')+(d*100).toFixed(1)+'</div>'; };
    const bl='border-left:2px solid var(--border)';
    const cell=(bu,co,role,key,rgb,dot,edge)=>{ const sd=stat(depMap,bu,co,role); const st='text-align:center;padding:4px 5px;border-bottom:1px solid var(--border)'+(edge?';'+bl:'');
      if(!sd) return '<td style="'+st+';color:#c7d6cc">—</td>';
      const v=sd[key], sb=stat(blMap,bu,co,role), d=(sb&&isFinite(sb[key])&&isFinite(v))?v-sb[key]:null;
      if(showMode==='delta'){ const c=(d==null)?'var(--text3)':(Math.abs(d)<0.0005?'var(--text2)':(d>0?'var(--green)':'var(--red)')); return '<td style="'+st+';background:'+shDelta(d)+'"><div style="font-weight:800;color:'+c+'">'+(d==null?'—':((d>0?'+':'')+(d*100).toFixed(1)))+(dot?' <span style="color:#c98a1a" title="release-2.3 rollout">●</span>':'')+'</div></td>'; }
      return '<td style="'+st+';background:'+shLevel(v,rgb)+'"><div style="font-weight:800">'+(isFinite(v)?(v*100).toFixed(1):'—')+(dot?' <span style="color:#c98a1a" title="release-2.3 rollout">●</span>':'')+'</div>'+chip(d)+'</td>'; };
    const EW='43,111,138', WT='20,122,99';
    // header
    let th='<thead><tr><th rowspan="2" style="text-align:left;padding:6px 10px;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid var(--border2);position:sticky;left:0;background:var(--surface);z-index:2;vertical-align:bottom;min-width:210px">Business unit · Role</th>';
    counties.forEach(c=>{ th+='<th colspan="2" style="text-align:center;padding:5px 6px;font-size:10.5px;font-weight:800;border-bottom:1px solid var(--border);'+bl+'">'+esc(c)+'</th>'; });
    th+='</tr><tr>';
    counties.forEach(()=>{ th+='<th style="text-align:center;padding:3px 5px;font-size:9px;font-weight:700;color:#2b6f8a;border-bottom:2px solid var(--border2);'+bl+';min-width:44px">EWOR</th><th style="text-align:center;padding:3px 5px;font-size:9px;font-weight:700;color:#147a63;border-bottom:2px solid var(--border2);min-width:44px">WT</th>'; });
    th+='</tr></thead>';
    // body
    let tb='<tbody>'; let anyRow=false;
    bus.forEach(bu=>{ const roles=(unitRoles[bu]||[]).filter(rw=>counties.some(co=>depMap.has(bu+'|||'+co+'|||'+rw.role))); if(!roles.length)return; anyRow=true;
      tb+='<tr><td colspan="'+(counties.length*2+1)+'" style="padding:8px 10px 4px;font-weight:800;font-size:11.5px;color:#147a63;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;left:0">'+esc(bu)+'</td></tr>';
      roles.forEach(rw=>{ tb+='<tr><td style="padding:6px 10px;font-weight:600;border-bottom:1px solid var(--border);position:sticky;left:0;background:var(--surface)">'+esc(rw.role)+'</td>';
        counties.forEach(co=>{ const dot=r23(bu,co); tb+=cell(bu,co,rw.role,'ewor',EW,dot,true)+cell(bu,co,rw.role,'workPct',WT,false,false); });
        tb+='</tr>'; });
    });
    tb+='</tbody>';
    // controls
    const showSeg='<div class="seg">'+[['level','Deploy + Δ'],['delta','Δ vs baseline only']].map(([v,l])=>'<button class="'+(v===showMode?'on':'')+'" onclick="Pages.cmSetShow(\''+v+'\')">'+l+'</button>').join('')+'</div>';
    const roleSeg='<div class="seg">'+[['','Key roles'],['all','All roles']].map(([v,l])=>'<button class="'+((v==='all')===showAll?'on':'')+'" onclick="Pages.cmSetShowAll('+(v==='all'?'true':'false')+')">'+l+'</button>').join('')+'</div>';
    const winCtl='<label class="tr-ctl"><span class="fl">Deploy window</span><input type="month" class="tr-month" value="'+dep.start+'" onchange="Pages.cmSetWin(\'deploy\',\'start\',this.value)"> <span style="color:var(--text3)">to</span> <input type="month" class="tr-month" value="'+dep.end+'" onchange="Pages.cmSetWin(\'deploy\',\'end\',this.value)"></label>'+
      '<label class="tr-ctl"><span class="fl">Standard baseline</span><input type="month" class="tr-month" value="'+base.start+'" onchange="Pages.cmSetWin(\'base\',\'start\',this.value)"> <span style="color:var(--text3)">to</span> <input type="month" class="tr-month" value="'+base.end+'" onchange="Pages.cmSetWin(\'base\',\'end\',this.value)"></label>';
    const controls='<div class="card" style="padding:12px 15px;margin-bottom:12px"><div class="tr-controls" style="flex-wrap:wrap;gap:18px;align-items:center"><label class="tr-ctl"><span class="fl">Show</span>'+showSeg+'</label><label class="tr-ctl"><span class="fl">Roles</span>'+roleSeg+'</label>'+winCtl+'</div></div>';
    const header='<div class="ph"><div><div class="ph-title">County Matrix</div><div class="ph-sub">EWOR &amp; Working Time for every business unit and role, across counties — scan a role along the row, compare units down the page. Deploy window vs standard baseline; <span style="color:#c98a1a">●</span> = release-2.3 rollout cell. Daily extract only; independent of the global filters.</div></div></div>';
    const legend='<div class="note" style="margin:10px 0 4px">Columns are counties, each split into <b style="color:#2b6f8a">EWOR</b> and <b style="color:#147a63">Working Time</b> (% shown). '+(showMode==='delta'?'Cells show the <b>change vs baseline</b> (pp); green up, red down.':'Cells show the <b>deploy value</b> with a change-vs-baseline chip; shade ∝ level.')+' Deploy '+esc(dep.start)+'→'+esc(dep.end)+' vs baseline '+esc(base.start)+'→'+esc(base.end)+'. "Other" residual '+(showAll?'shown':'hidden')+'. Bioresources sits in its own column (not county-split).</div>';
    if(!anyRow){ el.innerHTML=header+controls+'<div class="ch-empty">No business-unit / role data in the current windows.</div>'; return; }
    el.innerHTML=header+controls+'<div class="card"><div class="card-body" style="padding:6px 8px 10px;overflow-x:auto"><table style="border-collapse:collapse;width:100%;font-size:11.5px;font-family:var(--f)">'+th+tb+'</table>'+legend+'</div></div>';
  },

  /* ---------- METHODOLOGY ---------- */
  methodology(){
    const CARD='background:var(--surface);border:1px solid var(--border);border-radius:10px';
    const exStep=(big,lbl,hi)=>'<div style="text-align:center;min-width:112px;padding:14px 16px;border-radius:10px;'+
        (hi?'background:var(--green-bg);border:1.5px solid var(--green)':'background:var(--surface2);border:1px solid var(--border)')+'">'+
        '<div style="font-size:34px;font-weight:800;line-height:1;font-family:var(--f)'+(hi?';color:var(--green)':'')+'">'+big+'</div>'+
        '<div style="font-size:11px;color:var(--text2);margin-top:7px;line-height:1.3">'+lbl+'</div></div>';
    const op=t=>'<div style="font-size:12px;color:var(--text3);font-weight:700;white-space:nowrap">'+t+'</div>';
    const chain=(t,d,accent)=>'<div style="flex:1;min-width:150px;padding:13px 15px;border-radius:10px;'+CARD+(accent?';border-left:3px solid '+accent:'')+'">'+
        '<div style="font-weight:800;font-size:12.5px">'+t+'</div><div style="font-size:11.5px;color:var(--text2);margin-top:5px;line-height:1.5">'+d+'</div></div>';
    const arr='<div style="align-self:center;color:var(--text3);font-weight:800;font-size:20px">→</div>';
    const html=
      '<div class="ph"><div><div class="ph-title">Methodology</div>'+
      '<div class="ph-sub">How this dashboard defines productivity, turns a target into what each KPI must do, and translates it into capacity and value. Built to read in five minutes.</div></div></div>'+

      '<div class="hb-banner">What "productivity" means here</div>'+
      '<p class="hb-p"><b>Productivity is output per hour</b> - how much operational work each paid hour produces. A productivity uplift is just how much more each hour delivers.</p>'+
      '<p class="hb-p">We read that uplift as <b>capacity created</b>. If productivity rises 25%, the same people now produce what 25% more of them would have at the old rate - so the team <b>does 25% more work with the capacity it already has</b>. A clean <b>1:1</b>: +X% productivity = X people-worth of extra capacity for every 100.</p>'+

      '<div style="margin:8px 0 4px;padding:18px 20px;'+CARD+'">'+
        '<div style="font-weight:800;font-size:13px;margin-bottom:16px">Worked example - a 100-person role, +25% productivity</div>'+
        '<div style="display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap">'+
          exStep('100','people today',false)+op('+25% output<br>per hour')+
          exStep('125','people-worth<br>of output',false)+op('=')+
          exStep('25','people-worth<br>of capacity created',true)+
        '</div>'+
        '<div style="font-size:11.5px;color:var(--text2);margin-top:16px;line-height:1.55">Same 100 people, same hours. The 25 is capacity you <b>created</b> - the team delivers 25% more with what it already has. It is not 25 people removed from the current team.</div>'+
      '</div>'+

      '<div class="hb-banner">The two levers we can measure</div>'+
      '<p class="hb-p">Output per hour moves through two KPIs in the daily extract. A target can be met through either, or a mix - the <b>Uplift Translator</b> lets you slide between them.</p>'+
      '<div class="hb-grid2">'+
        '<div class="hb-metric"><h4 style="color:#2b6f8a">① EWOR - more output per available hour</h4><p class="hb-sub">Planned work as a share of the hours left after shrinkage. Rises when each available hour is filled with more planned work.</p><div class="hb-note">More jobs completed per hour on the rota</div></div>'+
        '<div class="hb-metric"><h4 style="color:#147a63">② Working Time - more of the paid day spent working</h4><p class="hb-sub">Actual working time as a share of all paid hours. Rises when shrinkage and non-productive time - travel, admin, waiting - fall.</p><div class="hb-note">Less lost time before work even starts</div></div>'+
      '</div>'+
      '<div class="hb-flow">Combine the two and you have output per hour. That single number is what the productivity % measures.</div>'+

      '<div class="hb-banner">From a target to what each KPI must do</div>'+
      '<p class="hb-p">Because it is 1:1, the arithmetic is simple. To deliver an uplift of <b>p</b>, a KPI carrying share <b>s</b> of it must rise to:</p>'+
      '<div style="text-align:center;font-size:16px;font-family:var(--mono);background:var(--surface2);border:1px dashed var(--border2);border-radius:8px;padding:14px;margin:2px 0 12px">Required level  =  baseline × ( 1 + <b>s</b> × <b>p</b> )</div>'+
      '<p class="hb-p">Put the whole uplift through one lever and s = 1, so the required level is <b>baseline × (1 + p)</b>. Split it evenly and each lever carries half.</p>'+
      '<div style="overflow-x:auto"><table class="uct"><thead><tr><th class="l">Route to +25% for a role at EWOR 55% · Working Time 55%</th><th>EWOR</th><th>Working Time</th></tr></thead><tbody>'+
        '<tr><td class="l">All via EWOR</td><td><b>68.8%</b></td><td style="color:var(--text3)">55.0%</td></tr>'+
        '<tr><td class="l">All via Working Time</td><td style="color:var(--text3)">55.0%</td><td><b>68.8%</b></td></tr>'+
        '<tr class="tot"><td class="l">50 / 50 split</td><td><b>61.9%</b></td><td><b>61.9%</b></td></tr>'+
      '</tbody></table></div>'+
      '<div class="note" style="margin-top:8px">55% × 1.25 = 68.8% single-lever; 55% × 1.125 = 61.9% on a 50/50 split. The required levels depend only on the baseline and the target - not on the shrinkage figure.</div>'+

      '<div class="hb-banner">How it becomes capacity and value</div>'+
      '<div style="display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;margin:2px 0">'+
        chain('EWOR & Working Time','The two measured KPIs move vs baseline.','#2b6f8a')+arr+
        chain('Output per hour','The productivity % - the relative rise in output per hour.','#147a63')+arr+
        chain('FTE created','Productivity % × Budget FTE = capacity created - more output from the same team.','var(--green)')+arr+
        chain('£ value','FTE created × hours per FTE per year × role rate card.','var(--green)')+
      '</div>'+

      '<div class="note" style="border-left-color:var(--amber-mid);margin-top:14px;line-height:1.6"><b>Higher Efficiency only.</b> Only the Higher-Efficiency productivity stream shows up in EWOR and Working Time. <b>Lower Volumes</b> and <b>Structural Efficiency</b> are separate benefit streams in the programme target - real value, but they do not move these two KPIs. They are shown on their own in the Target Explorer and are never double-counted here.</div>'+

      '<div class="hb-banner">How the numbers are averaged - the weekly basis</div>'+
      '<p class="hb-p">The unit of aggregation is the <b>week</b>. Every metric is worked out for each week first, and any month, quarter or window figure is the <b>unweighted mean of those weekly values</b> - one vote per week. Volumes (# operations or service appointments, hours) are shown as a <b>per-week run-rate</b> (the mean weekly figure), so windows of different length - a 3-month deploy vs a 12-month baseline - compare like-for-like with no scaling.</p>'+
      '<div class="hb-grid2">'+
        '<div class="hb-metric"><h4 style="color:#2b6f8a">Why not pool the hours?</h4><p class="hb-sub">Pooling (Σ output ÷ Σ hours over the whole window) weights the average by volume, so a high-throughput week dominates and a genuinely strong quieter week is washed out. Averaging the weekly values gives every week equal weight, so week-to-week efficiency shows through.</p></div>'+
        '<div class="hb-metric"><h4 style="color:#147a63">Guard on thin weeks</h4><p class="hb-sub">Because each week counts equally, a near-empty week (holiday or stub - below a fifth of the median weekly capacity for that scope) is dropped from the mean, so a freak reading off a handful of hours can\'t distort the figure.</p></div>'+
      '</div>'+
      '<div class="note" style="margin-top:10px;color:var(--text3)">Note on the definition (updated 2026): productivity is measured as capacity <b>created</b> relative to current output - a 1:1 reading. An earlier version measured the headcount you could <b>cut</b> at flat output, which needed a larger per-hour gain for the same headline %. All figures on this dashboard now use the capacity-created definition above, on the weekly-average basis described here.</div>';

    document.getElementById('page-methodology').innerHTML=html;
  },

  /* ---------- HELP & GLOSSARY ---------- */
  help(){
    const items=[
      ['Total Capacity','Total Capacity = SUM_INTERVAL_DURATION + SUM_OVERTIME_DURATION','Total available hours that can be utilised by operational resources (standard + overtime).','Daily extract'],
      ['Effective Capacity','Effective Capacity = Total Capacity − Shrinkage','Capacity remaining once unavailable (shrinkage) time is removed.','Derived'],
      ['Shrinkage (Process)','Shrinkage = Leave + Absence + Meetings + Training + Lunch Break','Process Data sheet: capacity unavailable for productive work.','Process Data'],
      ['Shrinkage (Network)','Shrinkage = Leave + Absence + Meetings + Training + Lunch Break + Trade Union Duties','Network Data sheet adds SUM_TRADE_UNION_DUTIES — the one formula that differs between the two sheets.','Network Data'],
      ['Non-Productive Available Time','= Sleep + Administration + Travel + White Space + Van Tasks + Other','Time available for work but not spent on productive operational activity.','Daily extract'],
      ['Working Time','Working Time = Effective Capacity − Non-Productive Available Time','Effective productive hours after removing non-productive available time.','Derived'],
      ['Planned Output','Planned Output = SUM_PLANNED_TIME','Total planned hours of operational work.','Daily extract'],
      ['EWOR','EWOR = Planned Output ÷ Effective Capacity','Effective Work Output Ratio - output generated from effective capacity. One of the two levers of the headline productivity %, combined with Working Time.','Derived'],
      ['TWOR','TWOR = Planned Output ÷ Total Capacity','Total Work Output Ratio — output generated from total capacity.','Derived'],
      ['Working Time %','Working Time % = Working Time ÷ Total Capacity','Proportion of total capacity converted into productive work (capacity utilisation).','Derived'],
      ['Shrinkage %','Shrinkage % = Shrinkage ÷ Total Capacity','Proportion of total capacity lost to shrinkage.','Derived'],
      ['Effective Capacity %','Effective Capacity % = Effective Capacity ÷ Total Capacity','Proportion of total capacity that remains effective.','Derived'],
      ['Hidden Ratio','Hidden Ratio = EWOR ÷ (Working % of Total ÷ Effective %)','Output produced per productive working hour. Held constant from baseline.','Derived from daily extract'],
      ['Capacity created','Capacity created % = the rise in output per paid hour vs baseline, driven by the two levers (more Working Time, higher EWOR); a clean 1:1 with the output-per-hour gain.','The extra output the same team now delivers per paid hour - more output from the capacity already paid for, not headcount removed. Only positive improvement counts.','Derived from daily extract'],
      ['Budget FTE Equivalent','Budget FTE Equiv = Capacity created % × Budget FTEs','Capacity created expressed as full-time-equivalent headcount - the extra output the same team delivers, not roles removed.','Derived from daily extract'],
      ['Estimated Financial Benefit','£ / year = Budget FTE Equivalent × Hours per FTE per year (1576) × Cost per Hour','Annual financial value of the capacity created.','Derived from daily extract']
    ];
    const banner=t=>'<div class="hb-banner">'+t+'</div>';
    const box=t=>'<div class="hb-box">'+t+'</div>';
    const col=(t,intro,items)=>'<div class="hb-col"><div class="hb-col-h">'+t+'</div><div class="hb-col-i">'+intro+'</div><ul>'+items.map(i=>'<li>'+i+'</li>').join('')+'</ul></div>';
    const html=
      '<div class="ph"><div><div class="ph-title">Help &amp; Glossary</div><div class="ph-sub">The productivity tracking &amp; benefit-realisation approach, plus every metric, its formula, business meaning and data source.</div></div></div>'+

      banner('What are we doing?')+
      '<p class="hb-p">Creating a consistent, governance-led approach to monitor productivity performance, validate benefit delivery, and support leadership decision-making across the programme.</p>'+

      banner('Why are we doing this?')+
      '<p class="hb-p">Productivity improvement initiatives are embedded across multiple initiatives and big bets within SSB. While individual initiatives are expected to deliver efficiency gains, there was no single, consistent mechanism to track how these improvements translate into measurable productivity movement and value delivery. As the programme evolved, there was a need to:</p>'+
      '<div class="hb-grid4">'+box('Establish a structured productivity measurement approach')+box('Track productivity performance against forecast targets')+box('Quantify operational improvements and capacity created')+box('Translate productivity movement into financial and business value')+'</div>'+

      banner('What visibility are we trying to create?')+
      '<div class="hb-grid3">'+
        col('Operational Productivity Movement','Understand how initiatives improve:',['Working Time %','Effective Working / Output Ratios (EWOR)','Operational efficiency across key roles'])+
        col('Financial Impact','Translate operational productivity improvements into:',['Benefit realisation','Cost avoidance','Reduced contractor / overtime reliance','Improved capacity utilisation'])+
        col('Capacity Reinvestment','Identify how the capacity created is used:',['Reinvested into operations','Supporting increased output / service delivery','Meeting new demand without adding headcount'])+
      '</div>'+

      banner('How productivity is measured — Labour &amp; Productivity Deep Dive')+
      '<div class="hb-grid2">'+
        '<div class="hb-metric"><h4>① More Working Time</h4><p class="hb-sub">How much productive time is gained by reducing non-working / non-productive time.</p>'+
          '<div class="hb-tag">Shrinkage</div><ul><li>Leave, absence, breaks, meetings, training</li><li>Time lost before anyone starts work</li></ul>'+
          '<div class="hb-tag">Travel, Sleep Time &amp; Other</div><ul><li>Time between sites / jobs</li><li>Mandatory rest after night call-outs</li><li>Admin &amp; scheduling gaps</li></ul>'+
          '<div class="hb-note">If shrinkage / travel / admin reduces → more working time</div></div>'+
        '<div class="hb-metric"><h4>② More Output (EWOR)</h4><p class="hb-sub">How effectively working time is converted into operational output.</p>'+
          '<ul><li>Increased productive output from available working time</li><li>More jobs completed per hour worked</li><li>Improved tour completion</li></ul>'+
          '<div class="hb-note">More productive working hours drive higher operational output</div></div>'+
      '</div>'+
      '<div class="hb-flow">The combined effect is <b>capacity created</b> - the same team delivers more output per paid hour. That extra output can <b>reduce backlogs and meet unmet demand</b>, or <b>absorb new work without adding headcount</b>. It is more output from the capacity already paid for, not headcount removed.</div>'+

function cardInsight(cur, prevKpi, accent) {

  const dW = cur.workPct   - prevKpi.workPct;
  const dS = prevKpi.shrinkPct - cur.shrinkPct; // positive = shrinkage fell = good
  const eU=dE>T, eD=dE<-T, wU=dW>T, wD=dW<-T, sG=dS>T, sB=dS<-T;
  let txt;
  if      (eD && wU && sG) txt='Capacity has been freed up by reducing shrinkage and improving working time — but that freed-up capacity isn\'t being filled with planned work. This is a scheduling and demand planning issue, not a field performance issue: the hours are available, but the jobs aren\'t being assigned to fill them.';
  else if (eU && wU && sG) txt='The three metrics are telling a consistent positive story: shrinkage is down, working time is up, and output is increasing. Capacity improvements are being converted into productive planned work — the planning pipeline is keeping pace with availability gains.';
  else if (eU && wD && sG) txt='Output is rising even though working hours have narrowed — the improvement is being driven by lower shrinkage rather than more scheduled time. Field performance is strong, but watch whether the reduction in working time becomes a constraint on future output growth.';
  else if (eU && wU && sB) txt='Output and working time are both improving despite rising shrinkage. Field performance and scheduling are compensating for lower availability — but the rising shrinkage needs attention before it starts to erode the output gains.';
  else if (eD && wD && sB) txt='All three metrics are moving in the wrong direction: shrinkage is up, working time is down, and output is falling. Capacity is being lost on multiple fronts simultaneously. This requires a structured review of both field availability and the quality of the planning and scheduling pipeline.';
  else if (eD && wD && sG) txt='Shrinkage has improved, freeing up capacity — but both working time and EWOR are declining, meaning that freed capacity is not being converted into productive scheduled work. The availability is there; the problem is in planning and demand allocation.';
  else if (eD && wU && sB) txt='Working time has improved but shrinkage is rising, leaving the net capacity picture mixed. Despite more scheduled hours, output is falling — which points to a quality or complexity issue in the work being assigned, not simply a volume gap.';
  else if (eU && wD && sB) txt='Output efficiency has improved, but working time is down and shrinkage is rising — the capacity picture is weakening even as output holds up. This is likely unsustainable: output gains may reverse once the shrinkage and availability trends fully flow through.';
  else if (!eU&&!eD&&!wU&&!wD&&!sG&&!sB) txt='All three metrics are broadly stable this period with no significant movement. No immediate action required, but monitor for emerging trends in shrinkage and working time as leading indicators of future output.';
  else    txt='The three metrics are giving mixed signals this period. Review shrinkage, working time, and EWOR individually to identify which driver is out of step — and whether the issue sits in field availability or in planning and scheduling.';

// Rasterise a live <svg> to a PNG data-URL (for PPT embedding). Resolves CSS var() colours + font-family:inherit,
// which don't survive standalone SVG rendering. Returns {data,w,h}.
function svgToPng(svgEl, scale){
  return new Promise((resolve,reject)=>{
    try{
      const clone=svgEl.cloneNode(true);
      const vb=(clone.getAttribute('viewBox')||'0 0 760 300').split(/\s+/).map(Number);
      const w=vb[2]||760, h=vb[3]||300;
      clone.setAttribute('width',w); clone.setAttribute('height',h); clone.setAttribute('style','overflow:visible;background:#fff');
      const cs=getComputedStyle(document.documentElement);
      let xml=new XMLSerializer().serializeToString(clone)
        .replace(/var\((--[a-z0-9-]+)\)/gi,(m,name)=>(cs.getPropertyValue(name).trim()||'#888'))
        .replace(/font-family="inherit"/g,'font-family="Calibri, Arial, sans-serif"');
      if(!/xmlns=/.test(xml)) xml=xml.replace('<svg','<svg xmlns="http://www.w3.org/2000/svg"');
      const url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);
      const img=new Image();
      img.onload=()=>{ const c=document.createElement('canvas'); c.width=Math.round(w*scale); c.height=Math.round(h*scale);
        const ctx=c.getContext('2d'); ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height);
        resolve({data:c.toDataURL('image/png'),w,h}); };
      img.onerror=()=>reject(new Error('SVG rasterise failed'));
      img.src=url;
    }catch(e){ reject(e); }
  });
}

/* ====================== 14. APP CONTROLLER =============================== */
const App = {
  page:'releasesummary',
  init(){
    State.init();
    State.setData(null, [], false);  // start empty — no data until the user uploads
    ProgTgt.restore();               // re-hydrate uploaded programme targets from a previous session
    Toolbar.render();
    this.renderActive();
    this.wireDnD();
  },
  hasData(){ return State.derived && State.derived.length>0; },
  go(page,el){
    this.page=page;
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('on'));
    if(el)el.classList.add('on'); else document.querySelector('.nav-item[data-page="'+page+'"]')?.classList.add('on');
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById('page-'+page).classList.add('active');
    Toolbar.syncToolbar();
    this.renderActive();
    window.scrollTo(0,0);
  },
  renderActive(){
    const map={overview:'overview',explorer:'explorer',translator:'translator',impact:'impact',releasesummary:'releaseSummary',methodology:'methodology',help:'help'};
    // No daily data yet → show the upload empty state. Help, Methodology + Target Explorer stay available
    // (the explorer is driven by the programme-targets file / built-in plan, not the daily extract).
    if(!this.hasData() && this.page!=='help' && this.page!=='methodology' && this.page!=='explorer'){ document.getElementById('page-'+this.page).innerHTML=this.emptyStateHtml(); return; }
    try{ Pages[map[this.page]](); }catch(e){ console.error(e); document.getElementById('page-'+this.page).innerHTML='<div class="empty-state"><div class="es-ic">⚠️</div><h2>Render error</h2><p>'+U.esc(e.message)+'</p></div>'; }
  },
  emptyStateHtml(){
    return '<div class="empty-state"><div class="es-ic">📂</div>'+
      '<h2>Upload your daily operational extract</h2>'+
      '<p>Select a <b>.csv</b> or <b>.xlsx</b> file to begin. Everything is calculated in your browser — nothing is uploaded anywhere. For very large extracts, <b>CSV loads fastest</b>.</p>'+
      '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">'+
        '<button class="btn btn-green" onclick="document.getElementById(\'file-in\').click()">⬆ Upload Extract</button>'+
        '<button class="btn btn-ghost" onclick="App.go(\'help\',document.querySelector(\'.nav-item[data-page=help]\'))">❓ How it works</button>'+
      '</div>'+
      '</div>';
  },
  // Re-render after filter/granularity change. fromFilter=true also refreshes the filter chips.
  refresh(fromFilter){
    State._filtered=null;
    if(fromFilter)Toolbar.renderFilters();
    Toolbar.renderPeriods();   // period options depend on the filtered set
    Toolbar.renderAnomalyBar();// anomalies depend on the filtered set
    this.renderActive();
  },
  setGran(g){ State.setGran(g); Toolbar.render(); this.renderActive(); },
  setBusinessType(v){ State.setBusinessType(v); Toolbar.render(); this.renderActive(); },
  setPeriod(which,val){ const k=+val; if(which==='measure')State.measureKey=k; else State.baselineKey=k; this.renderActive(); },
  // Generic cross-filter from a chart click: toggle a single value on a dimension.
  drill(field,val){
    const s=State.filters[field];
    if(s.has(val)&&s.size===1)s.clear(); else { s.clear(); s.add(val); }
    State._filtered=null; Toolbar.renderFilters(); Toolbar.renderPeriods(); Toolbar.renderAnomalyBar(); this.renderActive();
    UI.toast(s.size?('Filtered to '+val):'Filter cleared');
  },
  drillCounty(county){ this.drill('county',county); },
  onFile(input){ const f=input.files&&input.files[0]; if(f)this.importFile(f); input.value=''; },
  onTargetFile(input){ const f=input.files&&input.files[0]; if(f)this.importTargets(f); input.value=''; },
  async importTargets(file){
    UI.showLoading('Reading '+file.name+' …','Loading programme targets');
    await new Promise(r=>setTimeout(r,20));
    try{
      const buf=await file.arrayBuffer();
      const store=ProgTgt.loadFromBuffer(buf, file.name);
      UI.hideLoading();
      Toolbar.render();
      this.go('explorer', document.querySelector('.nav-item[data-page=explorer]'));
      const info=ProgTgt.info();
      UI.toast('✓ Programme targets loaded · '+U.fmt(info.initiatives)+' rows · '+info.roles+' roles');
      this.showTargetMatch(store);
    }catch(e){ UI.hideLoading(); UI.openModal('Targets not loaded','<p style="font-size:12.5px;color:var(--text2);line-height:1.6">The programme-targets file could not be read:</p><div class="note" style="border-left-color:var(--red-mid);margin-top:8px">'+U.esc(e.message)+'</div><p style="font-size:11px;color:var(--text3);margin-top:10px">Expected the value tool → Productivity tab → <b>↓ Excel</b> file (sheet <b>Productivity %</b>).</p>'); }
  },
  // Report how the plan roles line up with the dashboard's role groups.
  showTargetMatch(store){
    const groups=Pages.ovGroups?Pages.ovGroups():[];
    const groupKeys=groups.map(g=>tgtRoleKey(g.label));
    const planRoles=store.roles;
    const matched=planRoles.filter(r=>groupKeys.includes(r));
    const planOnly=planRoles.filter(r=>!groupKeys.includes(r));
    const groupNoPlan=groups.filter(g=>!planRoles.includes(tgtRoleKey(g.label))).map(g=>g.title||g.label);
    const chip=(t,cls)=>'<span class="anom-chip" style="max-width:none;background:var(--surface2);margin:2px 4px 2px 0;display:inline-block">'+U.esc(t)+'</span>';
    let h='<div class="m-sub" style="margin-bottom:10px">Loaded <b>'+U.esc(store.filename||'targets file')+'</b> — '+U.fmt(store.detail.length)+' initiative rows across '+planRoles.length+' plan roles. The EWOR / Working-Time target overlay uses <b>Higher-efficiency</b> only; Lower volumes &amp; Structural efficiency are tracked separately in the Target Explorer.</div>';
    h+='<div style="margin-bottom:10px"><div style="font-weight:700;color:var(--green2);font-size:12px;margin-bottom:3px">✓ Matched to a dashboard role group ('+matched.length+')</div>'+(matched.length?matched.map(r=>chip(r)).join(''):'<span style="color:var(--text3)">none</span>')+'</div>';
    h+='<div style="margin-bottom:10px"><div style="font-weight:700;color:var(--amber);font-size:12px;margin-bottom:3px">◦ Plan roles with no measured group ('+planOnly.length+')</div><div class="m-sub" style="margin-bottom:4px">Benefit is allocated to these in the plan, but the daily extract does not track them, so they appear in the explorer but not on the Overview cards.</div>'+(planOnly.length?planOnly.map(r=>chip(r)).join(''):'<span style="color:var(--text3)">none</span>')+'</div>';
    if(groupNoPlan.length) h+='<div><div style="font-weight:700;color:var(--text3);font-size:12px;margin-bottom:3px">Dashboard groups with no plan target ('+groupNoPlan.length+')</div>'+groupNoPlan.map(r=>chip(r)).join('')+'</div>';
    UI.openModal('Programme targets — role matching', h);
  },
  async importFile(file){
    const kb=file.size/1024;
    UI.showLoading('Reading '+file.name+' …', kb>4000?'Large file ('+U.fmt(kb/1024,1)+' MB) — this can take several seconds':'Reading & calculating…');
    // Yield so the overlay paints before the (blocking) parse. Plain setTimeout (not rAF —
    // rAF can stall in a background/hidden tab and make the import appear to hang).
    await new Promise(r=>setTimeout(r,30));
    try{
      const {report,raw,derived,roleMap,ranges,untracked}=await DataEngine.load(file);
      if(!report.ok){ UI.hideLoading(); this.showValidation(report); return; }
      if(!derived.length){ UI.hideLoading(); this.showNoRows(report); return; }
      State.setData(raw,derived,false,{roleMap,ranges,untracked});
      Pages._groups=null; // rebuild role-group cards for the new dataset
      State.recon = report.recon || null;
      document.getElementById('nav-foot').innerHTML=U.fmt(derived.length)+' rows loaded<br>'+U.esc(file.name.slice(0,24));
      Toolbar.render(); this.go('releasesummary',document.querySelector('.nav-item[data-page=releasesummary]'));
      UI.hideLoading();
      let msg='✓ '+U.fmt(derived.length)+' rows loaded';
      if(report.badDates) msg+=' · '+U.fmt(report.badDates)+' skipped (bad dates)';
      if(report.futureDates) msg+=' · '+U.fmt(report.futureDates)+' future-dated (dropped)';
      if(report.cappedLate) msg+=' · '+U.fmt(report.cappedLate)+' dropped after '+CONFIG.maxDateISO;
      UI.toast(msg);
      if(report.recon || report.futureDates||report.cappedLate||report.negatives||report.logical) this.showValidation(report,true);
    }catch(e){ UI.hideLoading(); UI.openModal('Upload failed','<p style="font-size:12.5px;color:var(--text2);line-height:1.6">The file could not be processed:</p><div class="note" style="border-left-color:var(--red-mid);margin-top:8px">'+U.esc(e.message)+'</div><p style="font-size:11px;color:var(--text3);margin-top:10px">Tip: save the extract as <b>.xlsx</b> or <b>.csv</b> (not .xls), close it in Excel first, and ensure it isn\'t password-protected. For fastest loading, CSV is best for very large extracts.</p>'); }
  },
  // Shown when the file parsed but produced 0 usable rows (almost always date parsing).
  showNoRows(report){
    let h='<p style="color:var(--amber);font-weight:700">⚠ The file loaded but produced 0 usable rows.</p>'+
      '<div class="m-sub" style="margin:8px 0">Scanned '+U.fmt(report.total)+' rows · '+U.fmt(report.badDates||0)+' had a blank/unparseable '+CONFIG.columns.relevanceDate+'.</div>'+
      '<p style="font-size:12px;color:var(--text2);line-height:1.6">Every row needs a valid <b>'+CONFIG.columns.relevanceDate+'</b>. Accepted formats: Excel date serials, <b>DD/MM/YYYY</b>, or <b>YYYY-MM-DD</b>.</p>';
    if(report.detectedHeaders) h+='<p style="font-size:11px;color:var(--text2);margin-top:8px">Detected columns: <span style="color:var(--text3)">'+report.detectedHeaders.filter(Boolean).map(U.esc).join(' · ')+'</span></p>';
    UI.openModal('No usable rows',h);
  },
  // Reconciliation table — Excel's pre-computed totals (AW–BF) vs Claude's glossary-formula totals.
  reconTable(recon){
    let h='<table class="uct" style="margin-bottom:4px"><thead><tr><th class="l">Check · overall totals (hrs)</th><th>Claude (glossary)</th><th>Excel</th><th>Difference</th><th>Status</th></tr></thead><tbody>';
    recon.forEach(([label,c,x,formula])=>{
      const d=c-x, tol=Math.max(0.5, Math.abs(x)*0.001), ok=Math.abs(d)<=tol; // match within 0.1% or 0.5 hrs
      const pct=x? (d/Math.abs(x)*100):0;
      h+='<tr><td class="l"><b>'+U.esc(label)+'</b><br><span style="font-size:10px;color:var(--text3)">'+U.esc(formula)+'</span></td>'+
        '<td>'+U.fmt(c,0)+'</td><td>'+U.fmt(x,0)+'</td>'+
        '<td>'+(d>=0?'+':'')+U.fmt(d,0)+' <span style="color:var(--text3);font-size:10px">('+(pct>=0?'+':'')+pct.toFixed(2)+'%)</span></td>'+
        '<td><span class="dchip '+(ok?'dpos':'dneg')+'">'+(ok?'✓ match':'⚠ diff')+'</span></td></tr>';
    });
    return h+'</tbody></table>';
  },
  showValidation(report, warnOnly){
    let h='';
    if(report.recon && report.recon.length){
      h+='<p style="font-weight:700;margin-bottom:4px">Reconciliation — Excel vs Claude</p>'+
        '<div class="m-sub" style="margin-bottom:8px">Overall totals across all '+U.fmt(report.kept)+' loaded rows. Claude computes from the raw component columns using the <b>documented glossary formulas</b>; Excel = its own pre-computed columns (AW–BF). These should match.</div>'+
        this.reconTable(report.recon);
      if(report.missing.length||report.issues&&report.issues.length) h+='<div style="height:14px"></div>';
    }
    if(report.missing.length){
      h+='<p style="color:var(--red);font-weight:700;margin-bottom:10px">❌ Upload stopped — these required columns were not found:</p>'+
        '<ul style="margin:0 0 12px 18px;font-size:12px">'+report.missing.map(m=>'<li>'+U.esc(m)+'</li>').join('')+'</ul>';
      if(report.detectedHeaders){
        h+='<p style="font-size:11px;color:var(--text2);margin-bottom:4px">Columns detected in your file'+(report.headerRow?(' (header found on row '+(report.headerRow+1)+')'):'')+':</p>'+
          '<div class="note" style="border-left-color:var(--amber-mid);max-height:140px;overflow:auto">'+(report.detectedHeaders.filter(Boolean).map(U.esc).join(' · ')||'<i>none</i>')+'</div>'+
          '<p style="font-size:11px;color:var(--text3);margin-top:8px">If your column names differ, rename them to match the expected names above, or send me a sample header row and I will map them.</p>';
      }
    }
    const issues=report.issues||[];
    h+='<div class="m-sub" style="margin-bottom:8px">Scanned '+U.fmt(report.total)+' rows · '+report.badDates+' bad dates · '+report.negatives+' negative-hour · '+report.logical+' logical · '+report.futureDates+' future-dated (dropped)'+(report.cappedLate?(' · '+U.fmt(report.cappedLate)+' dropped after '+U.esc(CONFIG.maxDateISO)):'')+(report.kept!=null?(' · '+U.fmt(report.kept)+' kept'):'')+'</div>';
    if(issues.length){
      h+='<div class="valrep"><div class="vr-row vr-h"><div>Row</div><div>Column</div><div>Issue</div></div>'+
        issues.slice(0,60).map(i=>'<div class="vr-row"><div>'+i.row+'</div><div>'+U.esc(i.column)+'</div><div>'+U.esc(i.issue)+' — <i>'+U.esc(i.fix)+'</i></div></div>').join('')+'</div>';
      if(issues.length>60)h+='<div class="m-sub" style="margin-top:6px">… and '+(issues.length-60)+' more</div>';
    } else if(!report.missing.length){ h+='<p style="color:var(--green);font-weight:600">✅ Data loaded'+((report.negatives||report.futureDates)?' with only minor warnings':' — no validation issues')+'.</p>'; }
    const hasWarn=report.futureDates||report.negatives||report.logical||report.issues&&report.issues.length;
    const title = report.missing.length ? 'Validation Report' : (report.recon&&report.recon.length ? 'Data Loaded — Reconciliation'+(hasWarn?' & Validation':'') : (warnOnly?'Validation Warnings':'Validation Report'));
    UI.openModal(title,h);
  },
  wireDnD(){
    const ov=document.getElementById('drag-overlay'); let depth=0;
    window.addEventListener('dragenter',e=>{e.preventDefault();depth++;ov.style.display='flex';});
    window.addEventListener('dragover',e=>e.preventDefault());
    window.addEventListener('dragleave',e=>{depth--;if(depth<=0){depth=0;ov.style.display='none';}});
    window.addEventListener('drop',e=>{e.preventDefault();depth=0;ov.style.display='none';const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f)this.importFile(f);});
  }
};


/* ====================== BOOT ============================================= */
window.addEventListener('DOMContentLoaded',()=>App.init());
</script>
</body>
</html>
