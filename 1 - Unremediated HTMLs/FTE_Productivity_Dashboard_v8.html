    const ssXml=await decomp(zip['xl/sharedStrings.xml']); const ss=[];
    if(ssXml){ const doc=new DOMParser().parseFromString(ssXml,'text/xml'); const sis=doc.getElementsByTagName('si');
      for(let k=0;k<sis.length;k++){ const ts=sis[k].getElementsByTagName('t'); let s=''; for(let j=0;j<ts.length;j++)s+=ts[j].textContent; ss.push(s); } }
    // Workbook sheet order → worksheet paths
    const relXml=await decomp(zip['xl/_rels/workbook.xml.rels']); const rels={};
    if(relXml){ const rd=new DOMParser().parseFromString(relXml,'text/xml'); const rs=rd.getElementsByTagName('Relationship'); for(let k=0;k<rs.length;k++)rels[rs[k].getAttribute('Id')]=rs[k].getAttribute('Target'); }
    const wbXml=await decomp(zip['xl/workbook.xml']); const paths=[]; const sheetNames=[];
    if(wbXml){ const wd=new DOMParser().parseFromString(wbXml,'text/xml'); const NS='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
      const sh=wd.getElementsByTagName('sheet');
      for(let k=0;k<sh.length;k++){ const rId=sh[k].getAttributeNS(NS,'id')||sh[k].getAttribute('r:id'); let t=rels[rId]; if(!t)continue; t=t.startsWith('/')?t.slice(1):'xl/'+t; paths.push(t); sheetNames.push(sh[k].getAttribute('name')||('Sheet'+(k+1))); } }
    if(!paths.length) Object.keys(zip).forEach(k=>{ if(/^xl\/worksheets\/sheet\d+\.xml$/.test(k)){paths.push(k); sheetNames.push('Sheet'+paths.length);} });
    const decodeXml=s=> s.indexOf('&')<0?s : s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&apos;/g,"'");
    // Manual string scan of the worksheet XML — NO DOMParser (a 7.7M-cell sheet would build a
    // multi-GB DOM and crash). Walks <c …> cell tags by index, far faster and lighter.
    const parseSheet=async path=>{
      const xml=await decomp(zip[path]); if(!xml) return [];
      const rowMap={}; let maxR=0; let pos=0;
      for(;;){
        const ci=xml.indexOf('<c ',pos); if(ci<0) break;
        const gt=xml.indexOf('>',ci); if(gt<0) break;
        const selfClose=xml.charCodeAt(gt-1)===47; // '/>'
        const tag=xml.slice(ci+3,gt);
        pos=gt+1;
        const rq=tag.indexOf('r="'); if(rq<0) continue;
        let p=rq+3, col=0, cc=tag.charCodeAt(p);
        while(cc>=65&&cc<=90){ col=col*26+cc-64; cc=tag.charCodeAt(++p); }     // column letters
        let row=0; while(cc>=48&&cc<=57){ row=row*10+cc-48; cc=tag.charCodeAt(++p); } // row digits
        col--; row--;
        if(selfClose) continue;
        let t=null; const tq=tag.indexOf('t="'); if(tq>=0){ t=tag.slice(tq+3, tag.indexOf('"',tq+3)); }
        const cEnd=xml.indexOf('</c>',pos); if(cEnd<0) break;
        let val=null;
        if(t==='inlineStr'){ const is=xml.indexOf('<t',pos); if(is>=0&&is<cEnd){ const isg=xml.indexOf('>',is); val=decodeXml(xml.slice(isg+1, xml.indexOf('</t>',isg))); } }
        else { const vs=xml.indexOf('<v>',pos); if(vs>=0&&vs<cEnd){ const raw=xml.slice(vs+3, xml.indexOf('</v>',vs));
          if(t==='s') val=ss[+raw]; else if(t==='str') val=decodeXml(raw); else { const n=+raw; val=(n===n)?n:decodeXml(raw); } } }
        pos=cEnd+4;
        if(val==null||val==='') continue;
        (rowMap[row]||(rowMap[row]=[]))[col]=val; if(row>maxR)maxR=row;
      }
      const rows=[]; for(let r=0;r<=maxR;r++)rows.push(rowMap[r]||[]); return rows;
    };
    // Parse EVERY sheet — the workbook now carries Process Data, Network Data and the role-mapping sheet.
    const sheets=[];
    for(let s=0;s<paths.length;s++){ sheets.push({name:sheetNames[s]||('Sheet'+(s+1)), matrix:await parseSheet(paths[s])||[]}); }
    return sheets;
  }

  // Combine an array of {name,matrix} sheets into one derived set:
  //  1. Build the role map from the Tracked-Roles sheet (if present).
  //  2. Process every DATA sheet (valid header + a ROLE column), stamping Business Type from the map.
  //  3. Merge reports + reconciliation totals; compute the date range per Business Type.
  // Score how well a sheet matches the Tracked-Roles mapping we want to JOIN ON (the daily-extract
  // ROLE codes + Tagged Area + Scope + Display Name). This must beat a secondary "Role Mapping" sheet
  // that lists raw HR role strings — only the Tracked-Roles sheet joins to the data's ROLE column.
  function mappingScore(matrix,name){
    if(!isMappingSheet(matrix)) return -1;
    let best=-1;
    for(let i=0;i<Math.min(matrix.length,8);i++){ const h=normRow(matrix[i]); if(!h.length) continue;
      let sc=0;
      if(h.some(x=>x.indexOf('TAGGED_AREA')>=0)) sc+=3;                 // Business Type lives here — decisive
      if(h.some(x=>x.indexOf('DAILY')>=0)) sc+=3;                       // "Role Name in Daily Extract"
      if(h.some(x=>x.indexOf('DISPLAY_NAME')>=0)) sc+=1;
      if(h.some(x=>x==='SCOPE')) sc+=1;
      if(sc>best) best=sc;
    }
    if(/tracked/i.test(name||'')) best+=2;
    if(/mapping/i.test(name||'')&&!/tracked/i.test(name||'')) best-=1;
    return best;
  }
  function processWorkbook(sheets){
    // Pick the BEST mapping sheet (prefer the Tracked-Roles sheet over any raw "Role Mapping" sheet).
    let mapIdx=-1, mapScore=-1;
    sheets.forEach((s,i)=>{ const sc=mappingScore(s.matrix,s.name); if(sc>mapScore){ mapScore=sc; mapIdx=i; } });
    let rm=null;
    if(mapIdx>=0){ rm=parseRoleMap(sheets[mapIdx].matrix); }
    const roleMap=rm?rm.map:null;
    // Data sheets = everything that parses to a valid header with the mandatory columns, excluding the map sheet.
    const derived=[]; let firstReport=null; const reconAcc={}; let anyData=false; let untracked=[];
    sheets.forEach((s,i)=>{
      if(i===mapIdx) return;
      if(findHeaderRow(s.matrix).score<=0){ if(!untracked.length) untracked=parseUntracked(s.matrix); return; } // non-data sheet → try the "Not Tracked" list
      // Business Type / sheet origin from the sheet name.
      const defArea=/network/i.test(s.name)?'Network':'Process';
      const {report,derived:d}=processMatrix(s.matrix,{roleMap, defaultArea:defArea, sheetArea:defArea});
      if(!report.ok) return;
      anyData=true;
      if(!firstReport) firstReport=report;
      else { ['badDates','futureDates','cappedLate','negatives','logical','excluded','unmapped','total','kept'].forEach(k=>{ firstReport[k]=(firstReport[k]||0)+(report[k]||0); }); }
      if(report.recon) report.recon.forEach(([label,c,x,f])=>{ const a=reconAcc[label]||(reconAcc[label]={c:0,x:0,f}); a.c+=c; a.x+=x; });
      for(let k=0;k<d.length;k++) derived.push(d[k]);
    });
    if(!anyData){
      // No mappable data sheet → fall back to treating the first valid sheet as a single dataset.
      const s=sheets.find(x=>findHeaderRow(x.matrix).score>0)||sheets[0];
      const defA=/network/i.test(s?s.name:'')?'Network':'Process';
      const {report,derived:d}=processMatrix(s?s.matrix:[], {roleMap, defaultArea:defA, sheetArea:defA});
      return {report, derived:report.ok?d:[], roleMap:rm, ranges:computeRanges(d), untracked};
    }
    firstReport.recon=Object.keys(reconAcc).map(label=>[label,reconAcc[label].c,reconAcc[label].x,reconAcc[label].f]);
    return {report:firstReport, derived, roleMap:rm, ranges:computeRanges(derived), untracked};
  }
  // Date coverage per SOURCE SHEET (not tagged area) — the physical extract determines availability:
  // Process sheet ≈ Apr-2024→today, Network sheet ≈ Apr-2025→today. Window rule uses these floors.
  function computeRanges(derived){
    const bySheet={};
    for(let i=0;i<derived.length;i++){ const r=derived[i], a=r.sourceSheet||'Process'; const o=bySheet[a]||(bySheet[a]={min:r.rd,max:r.rd}); if(r.rd<o.min)o.min=r.rd; if(r.rd>o.max)o.max=r.rd; }
    const areas=Object.keys(bySheet);
    let allMin=Infinity, allMax=-Infinity, overMin=-Infinity;
    areas.forEach(a=>{ if(bySheet[a].min<allMin)allMin=bySheet[a].min; if(bySheet[a].max>allMax)allMax=bySheet[a].max; if(bySheet[a].min>overMin)overMin=bySheet[a].min; });
    if(!areas.length){ allMin=allMax=overMin=Date.now(); }
    return {bySheet, all:{min:allMin,max:allMax}, overlapStart:overMin};
  }

  return {
    norm, processWorkbook,
    // Async load from a File object. Returns {report, raw, derived, roleMap, ranges} or throws.
    load(file){
      return new Promise((resolve,reject)=>{
        const name=file.name.toLowerCase();
        if(name.endsWith('.xls')) return reject(new Error('Legacy .xls files are not supported. Please save as .xlsx or .csv.'));
        if(/\.(pdf|png|jpe?g|gif)$/.test(name)) return reject(new Error('That looks like a '+name.split('.').pop().toUpperCase()+' file. Upload a .csv or .xlsx extract.'));
        const reader=new FileReader();
        reader.onerror=()=>reject(new Error('Could not read the file.'));
        reader.onload=async e=>{
          try{
            let sheets;
            if(name.endsWith('.csv')){ sheets=[{name:'CSV',matrix:parseCSV(String(e.target.result))}]; }
            else if(typeof DecompressionStream!=='undefined'){
              sheets=await parseXlsxMatrix(e.target.result); // lean parser — returns every sheet
            } else {
              // Fallback for old browsers without DecompressionStream: SheetJS, all sheets.
              const wb=XLSX.read(e.target.result,{type:'array'});
              sheets=wb.SheetNames.map(nm=>({name:nm, matrix:XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,raw:true,blankrows:false})}));
            }
            const {report,derived,roleMap,ranges,untracked}=processWorkbook(sheets);
            resolve({report, raw:sheets, derived: report.ok?derived:null, roleMap, ranges, untracked});
          }catch(err){ reject(err); }
        };
        if(name.endsWith('.csv')) reader.readAsText(file); else reader.readAsArrayBuffer(file);
      });
    }
  };
})();

/* ====================== 4. AGGREGATION ENGINE =============================
   Map-based grouping over derived rows. Sums the additive HOUR fields only;
   percentages are derived afterwards by CalcEngine (never averaged). Cached.
   ========================================================================= */
const Agg = (function(){
  const SUM_FIELDS=['interval','overtime','leave','absence','meeting','training','lunch','tradeUnion',
    'sleep','admin','travel','whitespace','van','other','totalCap','shrink','effCap','nonProd','workTime','planned','finished'];
  function blank(){ const o={n:0}; SUM_FIELDS.forEach(f=>o[f]=0); return o; }
  function add(acc,r){ acc.n++; for(let i=0;i<SUM_FIELDS.length;i++){const f=SUM_FIELDS[i];acc[f]+=r[f];} }

  // Group rows by a key function → Map(key → summed bucket). O(n).
  function groupBy(rows,keyFn){
    const m=new Map();
    for(let i=0;i<rows.length;i++){
      const r=rows[i], k=keyFn(r);
      let acc=m.get(k); if(!acc){acc=blank();m.set(k,acc);}
      add(acc,r);
    }
    return m;
  }
  // Sum an entire row set into one bucket.
  function total(rows){ const acc=blank(); for(let i=0;i<rows.length;i++)add(acc,rows[i]); return acc; }
  // Group rows by a key function → Map(key → row[]). Keeps the live rows (needed for the
  // weekly-mean basis, which must re-group each group by ISO week). O(n).
  function groupRows(rows,keyFn){
    const m=new Map();
    for(let i=0;i<rows.length;i++){ const r=rows[i], k=keyFn(r); let a=m.get(k); if(!a){a=[];m.set(k,a);} a.push(r); }
    return m;
  }

  return {SUM_FIELDS,blank,add,groupBy,groupRows,total};
})();

/* ====================== 4b. WEEKLY-MEAN AGGREGATION =======================
   The tool's single averaging rule (2026-07-30). The grain is the ISO week
   (r.ws): every metric is computed per week, then rolled up as the UNWEIGHTED
   MEAN across weeks — one vote per week, so a high-volume week no longer
   dominates. Rates = mean of the weekly ratios (NOT the ratio of pooled sums);
   volumes (#ops, hours) = mean weekly run-rate (Σ over weeks ÷ number of weeks).
   Near-empty weeks (< MIN_WEEK_SHARE of the median weekly Total Capacity) are
   dropped so a holiday / stub week can't distort the mean.
   ========================================================================= */
const WK = (function(){
  const MIN_WEEK_SHARE = 0.2, d=U.div;
  // Included weekly buckets for a row set (guard applied).
  function weekBuckets(rows){
    if(!rows||!rows.length) return [];
    const by=Agg.groupBy(rows,r=>r.ws); const all=[...by.values()];
    const caps=all.map(b=>b.totalCap).filter(v=>v>0).sort((a,b)=>a-b);
    if(!caps.length) return all;
    const med=caps[caps.length>>1], floor=med*MIN_WEEK_SHARE, kept=all.filter(b=>b.totalCap>=floor);
    return kept.length?kept:all;
  }
  function mr(wbs,fn){ let s=0,c=0; for(const b of wbs){ const v=fn(b); if(isFinite(v)){s+=v;c++;} } return c?s/c:0; } // mean weekly ratio
  function mv(wbs,f){ if(!wbs.length)return 0; let s=0; for(const b of wbs)s+=b[f]; return s/wbs.length; }            // mean weekly run-rate
  const ewor=b=>d(b.planned,b.effCap), twor=b=>d(b.planned,b.totalCap), workP=b=>d(b.workTime,b.totalCap),
        shrP=b=>d(b.shrink,b.totalCap), effP=b=>d(b.effCap,b.totalCap), otP=b=>d(b.overtime,b.totalCap);
  // Ratios for a single week bucket (used by the weekly-noise chip).
  function weekStat(b){ return {ewor:ewor(b),twor:twor(b),workPct:workP(b),workPctOfTotal:workP(b),
    shrinkPct:shrP(b),shrPct:shrP(b),effPct:effP(b),otPct:otP(b)}; }
  // Calc.kpis-shaped (for kpisOf): volumes = mean weekly run-rate, ratios = weekly mean.
  function kpi(rows){ const w=weekBuckets(rows), o={n:rows?rows.length:0,weeks:w.length};
    Agg.SUM_FIELDS.forEach(f=>o[f]=mv(w,f));
    o.ewor=mr(w,ewor); o.twor=mr(w,twor); o.workPct=mr(w,workP); o.shrinkPct=mr(w,shrP); o.shrPct=o.shrinkPct;
    o.effPct=mr(w,effP); o.utilisation=o.workPct; o.otPct=mr(w,otP); o._b=o; return o; }
  // UCEngine.periodStats-shaped.
  function period(rows){ const w=weekBuckets(rows);
    const shrPct=mr(w,shrP), workPctOfTotal=mr(w,workP), e=mr(w,ewor), effPct=1-shrPct;
    return { b:null, shrPct, workPctOfTotal, ewor:e, effPct, hidden:d(e,d(workPctOfTotal,effPct)), totalCap:mv(w,'totalCap'), weeks:w.length }; }
  const COMP=[['Travel','travel'],['Admin','admin'],['Whitespace','whitespace'],['Van','van'],['Sleep','sleep'],['Other','other'],
    ['Leave','leave'],['Absence','absence'],['Meetings','meeting'],['Training','training'],['Lunch','lunch']];
  // Pages._impStats-shaped.
  function imp(rows){ const w=weekBuckets(rows), comp={}; COMP.forEach(([lab,f])=>comp[lab]=mr(w,b=>d(b[f],b.totalCap)));
    const m=new Set(); if(rows)for(let i=0;i<rows.length;i++)m.add(rows[i].mk);
    return { n:rows?rows.length:0, weeks:w.length, totalCap:mv(w,'totalCap'), ops:mv(w,'finished'), planned:mv(w,'planned'),
      ewor:mr(w,ewor), twor:mr(w,twor), workPct:mr(w,workP), shrPct:mr(w,shrP), otPct:mr(w,otP), comp:comp, months:m.size||1 }; }
  return { MIN_WEEK_SHARE, weekBuckets, meanRatio:mr, meanVol:mv, weekStat, kpi, period, imp };
})();

/* ====================== 5. CALC ENGINE (productivity KPIs) ================
   Pure functions. Given a summed bucket of hours, derive every KPI exactly
   per the supplied productivity model. Hours aggregated first, then %.
   ========================================================================= */
const Calc = {
  // Derive the full KPI set from a summed bucket.
  kpis(b){
    if(!b) b=Agg.blank();
    const totalCap=b.totalCap, shrink=b.shrink, effCap=b.effCap, nonProd=b.nonProd, workTime=b.workTime, planned=b.planned;
    return {
      n:b.n, totalCap, effCap, shrink, nonProd, workTime, planned, overtime:b.overtime, finished:b.finished,
      ewor:U.div(planned,effCap),                 // Planned Output ÷ Effective Capacity (raw — >100% flags a source-data issue)
      twor:U.div(planned,totalCap),               // Planned Output ÷ Total Capacity (raw)
      workPct:U.div(workTime,totalCap),           // Working Time ÷ Total Capacity
      shrinkPct:U.div(shrink,totalCap),           // Shrinkage ÷ Total Capacity
      effPct:U.div(effCap,totalCap),              // Effective Capacity ÷ Total Capacity
      utilisation:U.div(workTime,totalCap),
      _b:b
    };
  },
  kpisOf(rows){ return WK.kpi(rows); },   // weekly-mean basis (was pooled Agg.total)
  shrinkageBreakdown(b){ return CONFIG.shrinkageParts.map(([k,label])=>({key:k,label,value:b[k]||0})); },
  nonProdBreakdown(b){ return CONFIG.nonProdParts.map(([k,label])=>({key:k,label,value:b[k]||0})); }
};

/* ====================== 6. UNLOCKED-CAPACITY ENGINE ======================
   Exact replication of the supplied workbook (Instructions / Config /
   Results-By-Role / Results-Dynamic). Operates on WEEKLY data per group.
   Steps per group, over baseline & measurement windows:
     ratios from summed hours → hidden ratio → deltas → UC components → £.
   ========================================================================= */
const UCEngine = (function(){
  // Aggregate a set of derived rows into the period ratios the model needs.
  // Weekly-mean basis: each ratio is the unweighted mean of the weekly ratios (was ΣPlanned/ΣEffective
  // pooled over the window); totalCap is the mean weekly capacity. See the WK module.
  function periodStats(rows){ return WK.period(rows); }
  // Calendar weeks in an inclusive [start,end] window (INT((end-start)/7)).
  function weeks(startMs,endMs){ return Math.max(1, Math.floor((endMs-startMs)/ (7*86400000))); }

  // Core UC computation for ONE group given its baseline & measurement rows + budget/cost.
  // budgetFte/costPerHour drive the £ translation. avgMode 'rows' = AVERAGEIFS (by-role),
  // 'calendar' = Σ ÷ calendar-weeks (dynamic/filtered).
  function computeGroup(blRows, msRows, opts){
    const cfg=CONFIG.uc;
    const bl=periodStats(blRows), ms=periodStats(msRows);
    // Average total capacity per week.
    let blAvgCap, msAvgCap;
    if(opts.avgMode==='calendar'){
      blAvgCap=U.div(bl.totalCap, weeks(opts.blStart,opts.blEnd));
      msAvgCap=U.div(ms.totalCap, weeks(opts.msStart,opts.msEnd)); // each period's OWN weeks (corrected vs workbook quirk)
    } else {
      // AVERAGEIFS over weekly buckets → mean of weekly total-cap values.
      blAvgCap=avgWeekly(blRows); msAvgCap=avgWeekly(msRows);
    }
    const dShr = bl.shrPct - ms.shrPct;            // Δ Shrinkage (pp): BL − MS (positive = shrinkage fell = good)
    const dWork= ms.workPctOfTotal - bl.workPctOfTotal; // Δ Working %: MS − BL
    const dEwor= ms.ewor - bl.ewor;                // Δ EWOR: MS − BL
    // opts.signed → SIGNED net impact (declines subtract; used by the cards). Default → floored opportunity
    // (only improvements count; used by the £/unlocked-capacity tables, where negative benefit isn't booked).
    const signed=!!opts.signed;
    // UC Working Time — Total Capacity × Δ Working Time % × baseline hidden ratio (planned÷working conversion).
    const ucWork = signed? msAvgCap*dWork*bl.hidden : (dWork>0 ? msAvgCap*dWork*bl.hidden : 0);
    // UC EWOR — Effective Capacity × Δ EWOR (more planned output squeezed from each available hour).
    const ucEwor = signed? msAvgCap*ms.effPct*dEwor : (dEwor>0 ? msAvgCap*ms.effPct*dEwor : 0);
    const ucTotal= ucWork+ucEwor;                  // extra output-equivalent hours/week (lever decomposition)
    const ucAnnual= ucTotal*cfg.annualiseWeeks;
    // CAPACITY-CREATED productivity: the rise in output-per-hour, relative to CURRENT output (a clean 1:1).
    //   dPratio = Δ(output ÷ total capacity)   ·   Rbase = baseline output ÷ total capacity
    //   Productivity % = dPratio ÷ Rbase = relative rise in output per hour.
    // So +X% productivity = X people-worth of capacity created per 100 (the same team does X% more work) —
    // see the target conversion (each metric rises 1:1 with X).
    const dPratio = U.div(ucTotal, blAvgCap);
    const Rbase   = bl.ewor * bl.effPct;           // baseline output as a fraction of total capacity
    const prodPct = Math.abs(Rbase)>1e-9 ? dPratio/Rbase : 0;   // capacity created, relative to current output (signed)
    const budgetFte = opts.budgetFte||0;
    const fteEquiv = prodPct*budgetFte;            // FTE-worth of capacity created (more output, same team)
    const value = fteEquiv*cfg.hoursPerFteYear*(opts.costPerHour||cfg.defaultCostPerHour);
    const freedAnnual = fteEquiv*cfg.hoursPerFteYear;          // capacity-created hours / yr (display)
    const freedWk = U.div(freedAnnual, cfg.annualiseWeeks);   // capacity-created hours / wk (display)
    return {
      role:opts.role, blAvgCap, msAvgCap,
      bl, ms, dShr,dWork,dEwor, Rbase, dPratio,
      ucWork,ucEwor,ucTotal,ucAnnual,prodPct,budgetFte,fteEquiv,value,freedAnnual,freedWk,
      budgetFteFull:opts.budgetFteFull!=null?opts.budgetFteFull:budgetFte, share:opts.share!=null?opts.share:1,
      costPerHour:opts.costPerHour||cfg.defaultCostPerHour
    };
  }
  function avgWeekly(rows){ return WK.meanVol(WK.weekBuckets(rows),'totalCap'); }  // mean weekly capacity (guarded)

  // Build the By-Role results table for the configured roles, from a derived row set.
  // Uses each role's FULL Budget FTE (no pro-rating) — matches the supplied workbook exactly.
  function byRole(derived, periods){
    const cfg=CONFIG.uc;
    const blStart=U.toDate(periods.baselineStartISO), blEnd=U.toDate(periods.baselineEndISO);
    const msStart=U.toDate(periods.measureStartISO), msEnd=U.toDate(periods.measureEndISO);
    const inBL=r=>r.ws>=blStart&&r.ws<=blEnd, inMS=r=>r.ws>=msStart&&r.ws<=msEnd;
    const results=[];
    Object.keys(cfg.roles).forEach(role=>{
      const rr=derived.filter(r=>r.role===role);
      if(!rr.length) return;
      const blRows=rr.filter(inBL), msRows=rr.filter(inMS);
      if(!msRows.length) return;
      const meta=cfg.roles[role];
      results.push(computeGroup(blRows,msRows,{role,avgMode:'rows',budgetFte:meta.fte,costPerHour:meta.cost,
        budgetFteFull:meta.fte, share:1, blStart,blEnd,msStart,msEnd}));
    });
    return results;
  }

  // Roll up a set of by-role results into a programme total.
  function rollup(results){
    const t={ucWork:0,ucEwor:0,ucTotal:0,ucAnnual:0,freedWk:0,freedAnnual:0,fteEquiv:0,value:0,budgetFte:0,msAvgCap:0};
    results.forEach(r=>{t.ucWork+=r.ucWork;t.ucEwor+=r.ucEwor;t.ucTotal+=r.ucTotal;t.ucAnnual+=r.ucAnnual;
      t.freedWk+=(r.freedWk||0);t.freedAnnual+=(r.freedAnnual||0);t.fteEquiv+=r.fteEquiv;t.value+=r.value;t.budgetFte+=r.budgetFte;t.msAvgCap+=r.msAvgCap;});
    t.prodPct=U.div(t.fteEquiv,t.budgetFte);   // capacity created %, FTE-weighted across roles
    return t;
  }
  return {byRole,rollup,computeGroup,periodStats};
})();

/* ====================== 7. STATE + FILTER ENGINE =========================
   Single source of truth for the working dataset, the active filters and the
   reporting granularity. Re-filtering is O(n) and cached for the render pass.
   ========================================================================= */
const State = {
  raw:null, derived:[], demo:true,
  filters:{}, granularity:'monthly', // daily|weekly|monthly|quarterly
  businessType:'all',                  // 'all' | 'Process' | 'Network' (global Business Type filter)
  ranges:null, roleMap:null, untracked:null, // date coverage per source sheet + the Tracked-Roles map
  measureKey:null, baselineKey:null,   // selected measurement & baseline period buckets (Overview)
  dataVersion:0,                        // bumped on each new dataset (invalidates caches)
  _filtered:null, _filtKey:'',
  init(){ CONFIG.filterDims.forEach(([f])=>this.filters[f]=new Set()); },
  setData(raw,derived,isDemo,meta){
    this.raw=raw; this.derived=derived; this.demo=!!isDemo;
    meta=meta||{};
    this.ranges=meta.ranges||null; this.roleMap=meta.roleMap||null; this.untracked=meta.untracked||null;
    this.businessType='all'; this._win=null;
    CONFIG.filterDims.forEach(([f])=>this.filters[f]=new Set());
    this._filtered=null; this.measureKey=null; this.baselineKey=null; this.dataVersion++;
  },
  // Which Business Types actually exist in the loaded data (from the mapping's Tagged Area).
  businessTypes(){ const s=new Set(); (this.derived||[]).forEach(r=>s.add(r.businessType)); return [...s].filter(Boolean).sort(); },
  // Date window for the active Business Type. Process → its sheet range (Apr-2024→today);
  // Network / All → the network sheet start (Apr-2025→today) so we never show a period one dataset lacks.
  currentWindow(){
    const rg=this.ranges; if(!rg) return null;
    const today=U.toDate(new Date()), max=Math.max(rg.all?rg.all.max:today, today);
    let min;
    if(this.businessType!=='all' && rg.bySheet && rg.bySheet[this.businessType]) min=rg.bySheet[this.businessType].min;
    else min = rg.overlapStart!=null&&isFinite(rg.overlapStart)? rg.overlapStart : (rg.all?rg.all.min:today);
    return {min, max};
  },
  setBusinessType(v){ this.businessType=v||'all'; this._win=null; this._filtered=null; this.measureKey=null; this.baselineKey=null; },
  // Distinct values for a dimension within the CURRENTLY filtered set (minus that dim's own filter).
  options(field){
    const rows=this.filteredExcept(field); const s=new Set();
    for(let i=0;i<rows.length;i++) s.add(rows[i][field]);
    return [...s].sort((a,b)=>String(a).localeCompare(String(b)));
  },
  matches(r,exceptField){
    // Global Business Type filter + its date window (All/Network → Apr-2025→today; Process → Apr-2024→today),
    // so we never show a period one dataset has no data for.
    if(this.businessType!=='all' && r.businessType!==this.businessType) return false;
    const win=this._win||(this._win=this.currentWindow());
    if(win){ if(r.rd<win.min||r.rd>win.max) return false; }
    for(const [f] of CONFIG.filterDims){
      if(f===exceptField) continue;
      const sel=this.filters[f]; if(sel.size && !sel.has(r[f])) return false;
    }
    return true;
  },
  filteredExcept(exceptField){
    const out=[]; for(let i=0;i<this.derived.length;i++){const r=this.derived[i]; if(this.matches(r,exceptField))out.push(r);} return out;
  },
  // The fully filtered working set (all active filters), cached by filter signature.
  filtered(){
    const key='bt:'+this.businessType+';'+CONFIG.filterDims.map(([f])=>f+':'+[...this.filters[f]].join('|')).join(';');
    if(this._filtered && this._filtKey===key) return this._filtered;
    const out=[]; for(let i=0;i<this.derived.length;i++){const r=this.derived[i]; if(this.matches(r,null))out.push(r);}
    this._filtered=out; this._filtKey=key; return out;
  },
  anyFilter(){ return CONFIG.filterDims.some(([f])=>this.filters[f].size>0); },
  clearAll(){ CONFIG.filterDims.forEach(([f])=>this.filters[f].clear()); this._filtered=null; },
  toggle(field,val){ const s=this.filters[field]; if(s.has(val))s.delete(val); else s.add(val); this._filtered=null; },
  setGran(g){ this.granularity=g; this.measureKey=null; this.baselineKey=null; },
  // Ordered period buckets at the current granularity for the filtered set.
  periodBuckets(){ return Compare.periods(this.filtered(), this.granularity); },
  // Validate / seed the measurement & baseline selections against available buckets.
  ensurePeriods(buckets){
    if(!buckets||!buckets.length){ this.measureKey=this.baselineKey=null; return; }
    const keys=new Set(buckets.map(b=>b.key)), g=this.granularity;
    // Map an anchor ISO date → the bucket key it lands in, at the current granularity.
    const keyForISO=(iso)=>{ const bs=U.toDate(iso);
      if(g==='monthly'||g==='rolling3'){ const d=new Date(bs); return Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1); }
      if(g==='quarterly') return U.quarterKey(bs);
      if(g==='yearly') return U.fy(bs);
      if(g==='weekly') return bs-(((new Date(bs).getUTCDay()+6)%7)*86400000);
      return bs; };
    // Default measurement: always the latest available period in the data.
    if(this.measureKey==null||!keys.has(this.measureKey)){
      this.measureKey=buckets[buckets.length-1].key;
    }
    // Default baseline: same period last year relative to measurement period, else earliest available.
    if(this.baselineKey==null||!keys.has(this.baselineKey)){
      let pyKey=null;
      if(g==='quarterly'){
        pyKey=this.measureKey-4; // qk = fy*4+fq; subtracting 4 gives same quarter one fiscal year earlier
      } else if(g==='monthly'||g==='rolling3'){
        // measureKey is a ms timestamp — step back exactly one calendar year
        const d=new Date(this.measureKey);
        pyKey=Date.UTC(d.getUTCFullYear()-1,d.getUTCMonth(),1);
      }
      this.baselineKey=(pyKey!=null&&keys.has(pyKey))?pyKey:(buckets.length>1?buckets[0].key:buckets[buckets.length-1].key);
    }
  }
};

/* ====================== 9. COMPARISON ENGINE ============================
   Period-over-period comparisons used by KPI cards & the Insights page.
   ========================================================================= */
const Compare = {
  // Split filtered rows by a period key, return ordered list of {key,label,rows}.
  periods(rows, gran){
    if(gran==='rolling3') return Compare.rollingMonths(rows,3);
    const keyFn = gran==='daily'?r=>r.rd : gran==='weekly'?r=>r.ws : gran==='monthly'?r=>r.ms : gran==='yearly'?r=>r.fy : r=>r.qk;
    const labFn = gran==='daily'?U.dayLabel : gran==='weekly'?(ms=>'w/c '+U.dayLabel(ms)) : gran==='monthly'?U.monthLabel : gran==='yearly'?(fy=>'FY'+String(fy).slice(2)) : U.quarterLabelFromKey;
    const m=new Map();
    for(const r of rows){ const k=keyFn(r); if(!m.has(k))m.set(k,[]); m.get(k).push(r); }
    const keys=[...m.keys()].sort((a,b)=>a-b);
    return keys.map(k=>({key:k, label: labFn(k), rows:m.get(k)}));
  },
  // N-month TRAILING rolling buckets, one per calendar month present, keyed by month-start ms.
  //  Each bucket's rows = the trailing N months up to & including that month → a rolling average when
  //  ratios are recomputed from the summed hours. (Buckets overlap by design; used for the 3-Mo Rolling view.)
  rollingMonths(rows, N){
    const byMs=new Map();
    for(const r of rows){ const k=r.ms; if(!byMs.has(k))byMs.set(k,[]); byMs.get(k).push(r); }
    const months=[...byMs.keys()].sort((a,b)=>a-b);
    const mkOf=ms=>{ const d=new Date(ms); return d.getUTCFullYear()*12+d.getUTCMonth(); };
    return months.map(k=>{ const hi=mkOf(k); let rr=[];
      months.forEach(m2=>{ const mk=mkOf(m2); if(mk<=hi && mk>hi-N) rr=rr.concat(byMs.get(m2)); });
      return {key:k, label:U.monthLabel(k), rows:rr}; });
  },
  // Comparators over N-month trailing windows (keyed by month index mk) — the 3-Mo Rolling view's
  // current / previous-period / same-period-last-year, so the card NET reads rolling values with unchanged logic.
  rollingComparators(rows, N, anchorKey){
    const byMk=new Map(); rows.forEach(r=>{const k=r.mk; if(!byMk.has(k))byMk.set(k,[]); byMk.get(k).push(r);});
    const mks=[...byMk.keys()].sort((a,b)=>a-b); if(!mks.length) return null;
    const cur=(anchorKey!=null&&byMk.has(anchorKey))?anchorKey:mks[mks.length-1];
    const mkMs=mk=>Date.UTC(Math.floor(mk/12),mk%12,1);
    const win=hi=>{ let out=[]; byMk.forEach((v,k)=>{ if(k<=hi&&k>hi-N) out=out.concat(v); }); return out; };
    const wp=win(cur-1), wy=win(cur-12);
    const base=Compare.inWindow(rows,CONFIG.baseline.startISO,CONFIG.baseline.endISO);
    return {
      current:{label:U.monthLabel(mkMs(cur)), rows:win(cur)},
      prev: wp.length?{label:U.monthLabel(mkMs(cur-1)), rows:wp}:null,
      prevYear: wy.length?{label:U.monthLabel(mkMs(cur-12)), rows:wy}:null,
      baseline: base.length?{label:CONFIG.baseline.label, rows:base}:null
    };
  },
  // Rows within an ISO date window (by relevance date).
  inWindow(rows,startISO,endISO){ const s=U.toDate(startISO),e=U.toDate(endISO); return rows.filter(r=>r.rd>=s&&r.rd<=e); },
  // Comparators for the chosen "current" month/quarter. anchorKey (optional) sets which
  // month/quarter is treated as current — defaults to the latest present period.
  comparators(rows, mode, anchorKey){ // mode: 'monthly'|'quarterly'|'rolling3'
    if(mode==='rolling3') return Compare.rollingComparators(rows, 3, anchorKey);
    const isM=mode==='monthly';
    const keyFn=isM?r=>r.mk:r=>r.qk;
    const m=new Map(); rows.forEach(r=>{const k=keyFn(r); if(!m.has(k))m.set(k,[]); m.get(k).push(r);});
    const keys=[...m.keys()].sort((a,b)=>a-b); if(!keys.length) return null;
    const cur=(anchorKey!=null && m.has(anchorKey))? anchorKey : keys[keys.length-1];
    const prev= isM? cur-1 : cur-1;
    const prevYear= isM? cur-12 : cur-4;
    const baseRows=Compare.inWindow(rows,CONFIG.baseline.startISO,CONFIG.baseline.endISO);
    const lab = isM? U.monthLabel : U.quarterLabelFromKey;
    const labCur = isM? U.monthLabel(m.get(cur)[0].ms) : lab(cur);
    return {
      current:{label:labCur, rows:m.get(cur)},
      prev: m.has(prev)?{label: isM?U.monthLabel(m.get(prev)[0].ms):lab(prev), rows:m.get(prev)}:null,
      prevYear: m.has(prevYear)?{label:isM?U.monthLabel(m.get(prevYear)[0].ms):lab(prevYear), rows:m.get(prevYear)}:null,
      baseline: baseRows.length?{label:CONFIG.baseline.label, rows:baseRows}:null
    };
  }
};

/* ====================== 9b. ANOMALY ENGINE ===============================
   Generic, filter-aware anomaly detection — independent of any single page.
   Scans the CURRENT selection at the chosen granularity, both overall and
   broken down across every operational dimension, flagging latest-vs-previous
   period breaches of the configured thresholds. Surfaced as a global bar that
   appears on every section, plus a full detail table.
   ========================================================================= */
const Anomaly = {
  // Dimensions scanned for localised issues (in addition to the Overall scan).
  dims:[['county','County'],['productionArea','Work Centre'],['businessUnit','Business Unit'],['businessArea','Business Area'],['role','Role'],['skill','Skill']],
  scan(rows, gran){
    const a=CONFIG.anomaly, out=[];
    const mk=(scope,metric,cur,prev,chg,sev,cl,pl)=>out.push({scope,metric,cur,prev,chg,severity:sev,curLabel:cl,prevLabel:pl});
    const evaluate=(scope,rr)=>{
      const ps=Compare.periods(rr, gran);
      if(ps.length<2) return;
      const cB=ps[ps.length-1], pB=ps[ps.length-2];
      const cur=Calc.kpisOf(cB.rows), prev=Calc.kpisOf(pB.rows);
      if(cur.totalCap<=0||prev.totalCap<=0) return;
      // Flag when EWOR, Working Time % or Shrinkage % moves by more than deltaPct PERCENTAGE POINTS
      // vs the previous period (either direction). EWOR baselines >eworSaneMax are skipped —
      // they're source-data artefacts (≈0 effective capacity), not real productivity movements.
      [['ewor','EWOR'],['workPct','Working Time %'],['shrinkPct','Shrinkage %']].forEach(([k,label])=>{
        if(k==='ewor' && (prev.ewor>a.eworSaneMax || cur.ewor>a.eworSaneMax)) return;
        const chg=(cur[k]-prev[k])*100;
        if(Math.abs(chg)>a.deltaPct) mk(scope,label,U.pct(cur[k]),U.pct(prev[k]),chg, Math.abs(chg)>30?'high':'med',cB.label,pB.label);
      });
    };
    evaluate('Overall', rows);
    this.dims.forEach(([f,label])=>{
      const m=new Map();
      for(const r of rows){ let g=m.get(r[f]); if(!g){g=[];m.set(r[f],g);} g.push(r); }
      m.forEach((rr,val)=>{ if(rr.length>=2) evaluate(label+': '+val, rr); });
    });
    out.sort((x,y)=>((y.severity==='high')-(x.severity==='high')) || (Math.abs(y.chg)-Math.abs(x.chg)));
    return out;
  },
  // Cached scan for the current selection (recomputed only when data/filters/granularity change).
  current(){
    const rows=State.filtered();
    // The 3-Mo Rolling view uses overlapping buckets — meaningless for period-over-period anomalies, so scan monthly.
    const gran=State.granularity==='rolling3'?'monthly':State.granularity;
    const key=State.dataVersion+'|'+State._filtKey+'|'+gran;
    if(this._key===key && this._cache) return this._cache;
    this._cache=this.scan(rows, gran); this._key=key; return this._cache;
  },
  tableHtml(list){
    if(!list.length) return '<div class="ch-empty">✅ No anomalies detected for the current selection.</div>';
    let h='<div class="m-sub" style="margin-bottom:8px">'+list.length+' issue(s) · latest vs previous '+State.granularity+' period · flagged when EWOR, Working Time % or Shrinkage % move by &gt;'+CONFIG.anomaly.deltaPct+'pp (percentage points)</div>';
    h+='<div class="tbl-scroll" style="max-height:60vh"><table><thead><tr><th>Severity</th><th>Scope</th><th>Metric</th><th class="num">Current</th><th class="num">Previous</th><th class="num">Change (pp)</th><th>Periods</th></tr></thead><tbody>';
    list.slice(0,200).forEach(o=>{ h+='<tr><td><span class="badge '+(o.severity==='high'?'b-r':'b-a')+'">'+(o.severity==='high'?'High':'Medium')+'</span></td><td>'+U.esc(o.scope)+'</td><td>'+o.metric+'</td><td class="num">'+o.cur+'</td><td class="num">'+o.prev+'</td><td class="num">'+(o.chg>=0?'+':'')+o.chg.toFixed(1)+'pp</td><td style="font-size:10px;color:var(--text3)">'+U.esc(o.curLabel)+' vs '+U.esc(o.prevLabel)+'</td></tr>'; });
    h+='</tbody></table></div>';
    if(list.length>200) h+='<div class="m-sub" style="margin-top:6px">… and '+(list.length-200)+' more</div>';
    return h;
  }
};

const UI = {
  toast(msg,type){ const t=document.getElementById('toast'); t.className='toast show'+(type?(' '+type):''); t.textContent=msg; clearTimeout(this._tt); this._tt=setTimeout(()=>t.className='toast',3200); },
  showLoading(msg,sub){ const o=document.getElementById('load-overlay'); document.getElementById('load-msg').textContent=msg||'Processing…'; if(sub!=null)document.getElementById('load-sub').textContent=sub; o.style.display='flex'; },
  hideLoading(){ document.getElementById('load-overlay').style.display='none'; },
  openModal(title,html){ document.getElementById('modal-title').textContent=title; document.getElementById('modal-body').innerHTML=html; document.getElementById('modal').classList.add('open'); },
  closeModal(){ document.getElementById('modal').classList.remove('open'); },

  // Reusable KPI card. cur/prev are KPI objects; valueFn extracts the metric.
  // spec:{label, key, unit, fmt, info, baselineRows? }
  kpiCard(spec, cur, comp){
    const v=spec.fmt(cur);
    let trendHtml='', cls='neu';
    if(comp && comp.value!=null && isFinite(comp.value)){
      const delta=comp.delta; // signed change in the underlying metric
      const better = spec.higherBetter? delta>0 : delta<0;
      const worse = spec.higherBetter? delta<0 : delta>0;
      cls = Math.abs(delta)<1e-9?'neu':(better?'pos':'neg');
      const arrow = delta>1e-9?'▲':delta<-1e-9?'▼':'■';
      const tcls = cls==='pos'?'m-pos':cls==='neg'?'m-neg':'m-neu';
      trendHtml='<span class="m-trend '+tcls+'">'+arrow+' '+comp.deltaLabel+'</span><span class="m-cmp">vs '+U.esc(comp.label)+'</span>';
    } else { trendHtml='<span class="m-cmp">'+(comp?U.esc(comp.label):'No comparison')+'</span>'; }
    return '<div class="metric '+cls+'">'+
      '<div class="m-label">'+U.esc(spec.label)+'<span class="m-info" title="'+U.esc(spec.info)+'">i</span></div>'+
      '<div class="m-value">'+v+(spec.unit?'<span class="m-unit">'+spec.unit+'</span>':'')+'</div>'+
      '<div class="m-sub">'+trendHtml+'</div></div>';
  }
};

  ovGroups(){

    const seed=this.ovSeed;
    // matchKey = the r.role value a group aggregates; title = the card/table display label.
    const mk=(matchKey,title,area,scope)=>{ const s=seed[matchKey]||{}; return {
      key:(scope==='other'?'other':matchKey.replace(/[^a-z0-9]+/ig,'_').toLowerCase()), label:matchKey, title:title,

  overview(){
    const rows=State.filtered();

    const measureB=ps.find(p=>p.key===State.measureKey)||(ps.length?ps[ps.length-1]:null);

    const anchorKey = cmpMode==='quarterly'?aQk:aMk;

    // ── PowerPoint-style cards: EWOR + Working Time per role group, vs previous period & same period last year. ──
    const cardHtml=groups.length? groups.map(g=>{
      const gr=this.ovRows(g,rows);

      const hasCur=cmp&&cmp.current.rows.length;
      const cur=hasCur?Calc.kpisOf(cmp.current.rows):Calc.kpis(Agg.blank());
      const gps=Compare.periods(gr, gran);
      // Sparkline spans the SELECTED window: first dot = baseline period, last dot = measurement period.
      const lo=Math.min(State.baselineKey,State.measureKey), hi=Math.max(State.baselineKey,State.measureKey);
      const sps=(State.baselineKey!=null&&State.measureKey!=null)? gps.filter(p=>p.key>=lo&&p.key<=hi) : gps;
      // Pre-compute KPIs once per period (shared across the 3 metric rows, avoids triple re-aggregation).
      const spsKpis=sps.map(p=>Calc.kpisOf(p.rows));
      // goodDown = a fall in the metric is the improvement (true for Shrinkage): colours the delta accordingly.
      const dl=(k,which,goodDown)=>{ const o=cmp&&cmp[which];
        if(!o||!o.rows.length) return '<div style="color:var(--text3);font-weight:600;font-size:9.5px">— no '+(which==='prev'?'prior period':'prior year')+'</div>';
        if(!hasCur) return '<div style="color:var(--text3);font-weight:600;font-size:9.5px">—</div>';
        const d=(cur[k]-Calc.kpisOf(o.rows)[k])*100, good=goodDown?d<0:d>0, cls=Math.abs(d)<0.05?'':(good?'ov-dpos':'ov-dneg');
        return '<div class="'+cls+'">'+(d>=0?'▲ +':'▼ ')+d.toFixed(1)+'pp<div style="font-weight:600;color:var(--text3);font-size:9px">vs '+U.esc(o.label)+'</div></div>'; };
      const metric=(k,label,goodDown)=>{
        const actV=spsKpis.map(kpi=>kpi[k]);
        return '<div class="ov-metric"><div class="ov-m-label">'+label+'</div>'+
          '<div class="ov-m-top"><div class="ov-m-val" style="color:'+(hasCur?g.accent:'var(--text3)')+'">'+(hasCur?U.pct(cur[k],1):'—')+'</div>'+
          '<div class="ov-deltas">'+dl(k,'prev',goodDown)+dl(k,'prevYear',goodDown)+'</div></div>'+
          '<div class="ov-spark">'+sparkForecast(actV,[],g.accent,{labels:sps.map(p=>p.label),fmt:v=>U.pct(v,1),labelFontSize:22,noLegend:true})+'</div></div>';
      };
      // NET productivity % impact — computed for the SAME toolbar comparisons as the metric deltas above
      //  (measurement vs previous period, and vs same period last year), using the unlocked-capacity engine.
      //  Only positive metric movement unlocks capacity, so an all-declining period nets to +0.0% (not a false positive).
      // NET productivity impact (signed, combines EWOR/Working/Shrinkage). SMOOTHED to damp single-period
      //  spikes: monthly → 3-month rolling average, weekly → 4-week rolling average; quarterly/yearly unchanged.
      // NET productivity impact (signed) — measurement period vs previous period & same period last year.
      //  Unchanged logic; it simply reads whichever period the selected View produces (incl. the 3-month rolling view).
      const netOf=(o)=>{ if(!cmp||!hasCur||!o||!o.rows.length) return null;
        return UCEngine.computeGroup(o.rows, cmp.current.rows, {role:'',budgetFte:g.fte,costPerHour:g.cost,avgMode:'rows',signed:true}).prodPct; };
      const fmtVal=(v)=> v==null? '<span style="color:var(--text3)">—</span>'
        : '<span class="'+(v>0.00005?'pos':(v<-0.00005?'neg':''))+'">'+(v>=0?'+':'')+U.pct(v,1)+'</span>';
      const netBar='<div class="ov-net" title="Net productivity impact of the measurement period vs the previous period and the same period last year — combines EWOR and Working Time (signed; declines subtract).">'+
        '<div class="ov-net-row"><span class="ov-net-lbl">NET</span>'+fmtVal(netOf(cmp&&cmp.prev))+'<span class="ov-net-vs">vs '+U.esc(cmp&&cmp.prev?cmp.prev.label:'prev')+'</span></div>'+
        '<div class="ov-net-row">'+fmtVal(netOf(cmp&&cmp.prevYear))+'<span class="ov-net-vs">vs '+U.esc(cmp&&cmp.prevYear?cmp.prevYear.label:'last yr')+'</span></div>'+
      '</div>';
      return '<div class="ov-card" ondblclick="Pages.ovDrill(\''+g.key+'\')" title="Double-click for the breakdown by county / work centre">'+
        '<div class="ov-budget">Budget FTEs: <input type="number" min="0" value="'+g.fte+'" onclick="event.stopPropagation()" onchange="Pages.ovSetFte(\''+g.key+'\',this.value)"></div>'+
        '<div class="ov-head" style="background:'+g.accent+'">'+U.esc(g.title)+'</div>'+
        metric('ewor','EWOR',false)+metric('workPct','Working Time',false)+
        netBar+'</div>';
    }).join('') : '<div class="ch-empty" style="grid-column:1/-1">No roles for this Business Type.</div>';

    const btLabel=State.businessType==='all'?'All roles':State.businessType;
    const winTxt=w? (this._fmtD(State.currentWindow().min)+' → present'):'';
    document.getElementById('page-overview').innerHTML=
      '<div class="ph"><div><div class="ph-title">Productivity Overview</div>'+
      '<div class="ph-sub"><b>Section 1</b> shows productivity movement by role — EWOR and Working Time against the toolbar measurement period, with period-on-period comparisons. <b>Section 2</b> shows programme target uplift by role. <b>Section 3</b> translates gains into capacity hours and financial value. Currently showing: <b>'+U.esc(btLabel)+'</b>.</div></div></div>'+
      '<div class="hb-banner">1 · Productivity Movement</div>'+
      '<div class="m-sub" style="margin:-4px 0 8px">EWOR and Working Time by role group for the toolbar measurement period, vs the previous period and the same period last year, with the <b>net productivity % impact</b> at the foot of each card. Double-click a card for the county / work-centre breakdown.</div>'+
      '<div class="ov-grid ov-grid-wrap">'+cardHtml+'</div>'+
      this.ovOtherNote()+
      '<div class="hb-banner">2 · Programme Target Uplift % <span style="font-weight:600;font-size:10px;opacity:.75">· Higher efficiency only</span></div>'+
      '<div class="m-sub" style="margin:-4px 0 12px">Cumulative <b>higher-efficiency</b> uplift targets by role ('+(ProgTgt.isLoaded()?'from the uploaded value-tool export':'built-in programme plan')+'). Dashes show the target level each period; lines show actual EWOR &amp; Working Time vs the selected baseline. <b>Lower volumes</b> &amp; <b>structural efficiency</b> are excluded here (they don\'t move EWOR / Working Time) — see the <a href="#" onclick="App.go(\'explorer\',null);return false" style="color:var(--green);font-weight:700">Target Explorer</a>.</div>'+
      '<div id="tgt-section-inner">'+this.tgtSectionInner()+'</div>'+
      '<div class="hb-banner">3 · Capacity Created &amp; Productivity Targets</div>'+
      this.ovControls(w)+
      '<div class="ov-subhead">3.1 · £ Value by Role</div>'+
      this.ovValueTable(w)+
      '<div class="ov-subhead">3.2 · '+CONFIG.targetFY+' Productivity Uplift Target — Required Metric Levels &amp; Gap by Role</div>'+
      this.ovTargetTable(w)+
      '<div class="hb-banner">4 · Roles Not Tracked — Benefit Allocated, Not Yet Measurable</div>'+
      this.ovUntrackedPanel();
  },
  // Note listing the raw roles rolled into 'Other Process Roles' (incl. Catchment Controller).
  ovOtherNote(){
    const m=State.roleMap&&State.roleMap.map; if(!m) return '';
    const raws=Object.keys(m).filter(k=>m[k].scope==='other').map(k=>m[k].raw).filter(Boolean);
    const uniq=[...new Set(raws)].sort((a,b)=>a.localeCompare(b));
    return uniq.length? '<div class="note" style="margin:-6px 0 14px"><b>Other Process Roles</b> combines: '+uniq.map(U.esc).join(', ')+'.</div>':'';
  },
  // ── TARGET-DRIVEN by the FY27 productivity-uplift target % (reqProd), per role.
  //    Capacity-created: output per hour rises 1:1 with the uplift, so each metric rises 1:1 too.
  //    Required metric levels as SINGLE-LEVER routes (each lever alone delivers the uplift, from baseline):
  //      Required EWOR      = baseline EWOR      × (1 + reqProd)
  //      Required Working % = baseline Working % × (1 + reqProd)
  //      Required Shrinkage = baseline Shrinkage × (1 − reqProd)
  //    'Current' = the measurement window (editable baseline → today) running-average actuals.
  ovBundle(bl, ms, fte, cost, targetPct){
    const u=(bl.length&&ms.length)? UCEngine.computeGroup(bl,ms,{role:'',budgetFte:fte,costPerHour:cost,avgMode:'rows'}) : null;
    const bS=bl.length? UCEngine.periodStats(bl):null, mS=ms.length? UCEngine.periodStats(ms):null;
    const reqProd=targetPct||0;
    const eff=bS?(bS.effPct||1):1, hid=bS?(bS.hidden||1):1;
    const cap=u?u.msAvgCap:0;
    const gReq=_upliftG(reqProd);   // capacity-created single-lever: baseline × (1+p)
    return {u,bS,mS,reqProd,fte,cost,cap,
      reqEwor: bS? bS.ewor*(1+gReq) : null,
      reqWork: bS? bS.workPctOfTotal*(1+gReq) : null,
      reqShr:  bS? bS.shrPct*(1-gReq) : null,
      curProd: u? u.prodPct : 0,
      curEwor: mS? mS.ewor : (bS?bS.ewor:null),
      curWork: mS? mS.workPctOfTotal : (bS?bS.workPctOfTotal:null),
      curShr:  mS? mS.shrPct : (bS?bS.shrPct:null),
      achWk:u?u.freedWk:0, achHrs:u?u.freedAnnual:0, achFte:u?u.fteEquiv:0, achVal:u?u.value:0,
      dShr:(u&&mS&&bS)?(mS.shrPct-bS.shrPct):null, dWork:(u&&mS&&bS)?(mS.workPctOfTotal-bS.workPctOfTotal):null, dEwor:(u&&mS&&bS)?(mS.ewor-bS.ewor):null };
  },
  _fmtD(ms){ if(ms==null) return '—'; const d=new Date(ms); return d.getUTCDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getUTCMonth()]+' '+String(d.getUTCFullYear()).slice(2); },
  // Sections 2 & 3 measure SINCE LAUNCH, independent of the top toolbar: an editable baseline window
  // (default Sep–Nov 25) and a measurement window running from the day after the baseline up to today.
  ovWindows(){
    if(!this._ovBl) this._ovBl={start:CONFIG.ovBaselineDefault.start, end:CONFIG.ovBaselineDefault.end};
    const all=State.filtered();
    const blS=U.toDate(this._ovBl.start);
    // Baseline end = last day of the selected month
    const blE_d=new Date(U.toDate(this._ovBl.end));
    const blE=new Date(Date.UTC(blE_d.getUTCFullYear(),blE_d.getUTCMonth()+1,0));
    // Measurement end = last day of selected month, or latest date in data
    let latestMs=Date.now(); all.forEach(r=>{ if(r.rd>latestMs)latestMs=r.rd; });
    let msE;
    if(this._ovMsEnd){
      const d=new Date(U.toDate(this._ovMsEnd));
      msE=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0));
    } else { msE=new Date(latestMs); }
    const blAll=all.filter(r=>r.rd>=blS&&r.rd<=blE);
    const msAll=all.filter(r=>r.rd>blE&&r.rd<=msE);
    let last=null,first=null; msAll.forEach(r=>{ if(last==null||r.rd>last)last=r.rd; if(first==null||r.rd<first)first=r.rd; });
    return {blAll,msAll,blS,blE,msE,
      baseLabel:this._fmtD(blS)+' → '+this._fmtD(blE),
      measLabel:msAll.length?(this._fmtD(first)+' → '+this._fmtD(last)):'no post-baseline data'};
  },

      let h=includeLatest?'<option value=""'+((!selISO||selISO==='')?'selected':'')+'>Latest in data</option>':'';
      if(!ps.length) return h+'<option value="">No data</option>';

      '<span style="color:var(--text3)">to</span>'+
      '<select style="'+ss+'" onchange="Pages.ovSetBaseline(\'end\',this.value)">'+buildOpts(this._ovBl.end,false)+'</select>'+
      '<span class="fl" style="margin-left:12px">Measurement to</span>'+
      '<select style="'+ss+'" onchange="Pages.ovSetMeasEnd(this.value)">'+buildOpts(this._ovMsEnd||null,true)+'</select>'+
      '<span class="dchip dneu" style="margin-left:4px" title="Rows included in the measurement window">'+w.measLabel+'</span>'+
      '<span style="color:var(--text3);font-size:11px">· drives sections 2.1 &amp; 2.2</span>'+
    '</div>';
  },
  // ── SECTION 2 — Unlocked Capacity & £ Value by Role (movement since launch → capacity → £).
  ovValueTable(w){
    const P=(v)=>(v==null||!isFinite(v))?'—':U.pct(v,1);
    const dchip=(d,goodIfNeg)=>{ if(d==null||!isFinite(d)) return '<span class="dchip dneu">—</span>'; const pp=d*100; const good=goodIfNeg?pp<0:pp>0; const cls=Math.abs(pp)<0.05?'dneu':(good?'dpos':'dneg'); return '<span class="dchip '+cls+'">'+(pp>=0?'+':'')+pp.toFixed(1)+'pp</span>'; };
    const groups=this.ovVisibleGroups();
    const tot={fte:0,uc:0,cap:0,ann:0,fteq:0,val:0}; let body='';
    groups.forEach(g=>{
      const bl=this.ovRows(g,w.blAll), ms=this.ovRows(g,w.msAll);
      const b=this.ovBundle(bl,ms,g.fte,g.cost,g.target), has=b.u&&b.u.ucTotal>0.001;
      tot.fte+=g.fte; if(b.u){ tot.uc+=b.achWk; tot.cap+=b.u.blAvgCap; tot.ann+=b.achHrs; tot.fteq+=b.achFte; tot.val+=b.achVal; }
      body+='<tr ondblclick="Pages.ovDrill(\''+g.key+'\')" style="cursor:pointer" title="Double-click for the county / work-centre breakdown">'+
        '<td class="l"><b>'+U.esc(g.title)+'</b></td>'+
        '<td><input type="number" min="0" value="'+g.fte+'" onclick="event.stopPropagation()" onchange="Pages.ovSetFte(\''+g.key+'\',this.value)" style="width:54px;text-align:center;border:1px solid var(--border2);border-radius:6px;padding:2px 4px;font-family:var(--mono);font-size:11px"></td>'+
        '<td>'+dchip(b.dWork,false)+'</td><td>'+dchip(b.dEwor,false)+'</td>'+
        '<td><b>'+P(b.curProd)+'</b></td>'+
        '<td>'+(has?U.fmt(b.achWk,0):'—')+'</td><td>'+(has?U.fmt(b.achHrs,0):'—')+'</td><td>'+(has?U.fmt(b.achFte,1):'—')+'</td>'+
        '<td><b>'+(has?U.moneyFull(b.achVal):'—')+'</b></td></tr>';
    });
    const totProd=U.div(tot.fteq,tot.fte);   // capacity created %, FTE-weighted
    body+='<tr class="tot"><td class="l">Total</td><td>'+U.fmt(tot.fte,0)+'</td><td colspan="2">Combined across roles</td>'+
      '<td><b>'+P(totProd)+'</b></td><td>'+U.fmt(tot.uc,0)+'</td><td>'+U.fmt(tot.ann,0)+'</td><td>'+U.fmt(tot.fteq,1)+'</td><td><b>'+U.moneyFull(tot.val)+'</b></td></tr>';
    const tbl='<table class="uct"><thead><tr>'+
      '<th class="l">Role</th><th>Budget FTEs</th><th>Δ Working Time</th><th>Δ EWOR</th>'+
      '<th>Productivity</th><th>Capacity created / wk</th><th>Annual Hours</th><th>FTE Equiv</th><th>£ Value / yr</th>'+
      '</tr></thead><tbody>'+body+'</tbody></table>';
    return '<div class="ov-foot-note">From operational productivity movement to financial value: each role\'s Budget FTE &amp; rate card applied to the measured improvement vs baseline. Only positive net improvement generates capacity created &amp; £.</div>'+
      '<div class="card"><div class="card-head"><div>'+
      '<div class="card-sub">Movement from Baseline <b>'+U.esc(w.baseLabel)+'</b> to Measurement <b>'+U.esc(w.measLabel)+'</b>. Productivity % = <b>capacity created</b>, 1:1 with the output-per-hour gain - FTE created = productivity % × Budget FTE (more output from the same team), valued at the rate card. Budget FTE is editable.</div></div>'+
      '</div>'+
      '<div class="card-body" style="padding:4px 8px 8px;overflow-x:auto">'+tbl+'</div></div>';
  },
  // Metric-allocation mode for 2.2 — how the productivity uplift target is split across the 3 levers.
  //  'all' → weighted by each lever's ACTUAL share of unlocked capacity delivered so far (evidence-based;
  //          equal ⅓ when the role has no positive movement yet).
  //  'ewor'/'work'/'shr' → the whole uplift via that one metric (scenario); other metrics n/a.
  ovMetricMode(){ return this._ovMetricMode||'all'; },
  ovSetMetricMode(m){ this._ovMetricMode=m; this.overview(); },
  // Allocation fractions for a role's bundle. Single mode → 1 on that lever, null on the other.
  //  'all' → ucEwor : ucWork (the levers' realised contributions), normalised to sum 1.
  ovAlloc(b){
    const m=this.ovMetricMode();
    if(m==='ewor') return {e:1,w:null};
    if(m==='work') return {e:null,w:1};
    const u=b&&b.u, tot=u?(u.ucWork+u.ucEwor):0;
    if(tot>1e-9) return {e:u.ucEwor/tot, w:u.ucWork/tot}; // weighted by actual movement
    return {e:0.5,w:0.5};                                   // no signal yet → equal split
  },
  // Required metric levels for a role, given its bundle (baseline stats + realised UC), uplift target & allocation.
  //  Capacity-created: each metric rises 1:1 with the uplift, scaled by its SHARE (frac) of the target:
  //    EWOR: baseline × (1 + frac·p)   ·  Working: baseline × (1 + frac·p)
  //  Levers not used in single mode return null → shown as n/a.
  ovRequired(b, targetPct){
    const bS=b?b.bS:null, f=this.ovAlloc(b); if(!bS) return {e:null,w:null,f};
    const p=targetPct||0, g=_upliftG(p);   // capacity-created: each metric scales up by its share of g (=p)
    return {
      e: f.e==null? null : bS.ewor*(1+f.e*g),
      w: f.w==null? null : bS.workPctOfTotal*(1+f.w*g),
      f
    };
  },
  // ── SECTION 2.2 — FY27 Productivity Uplift Target: current vs the level each metric must reach (per allocation).
  ovTargetTable(w){
    const mode=this.ovMetricMode();
    const P=(v)=>(v==null||!isFinite(v))?'—':U.pct(v,1);
    const gap=(cur,req,down)=>{ if(cur==null||req==null||!isFinite(cur)||!isFinite(req)) return '—';
      const pp=(down? cur-req : req-cur)*100; if(pp<=0.05) return '<span class="dchip dpos">✓ met</span>';
      return '<span class="dchip dneg">'+pp.toFixed(1)+'pp</span>'; };
    // A metric triple: Current · Required · Gap. In 'all' mode the Required cell also shows the lever's
    // allocation weight (its share of the uplift). Unused levers (single mode) → n/a.
    const mcell=(cur,req,base,down,frac)=>{
      if(req==null) return '<td>'+P(cur)+'</td><td style="color:var(--text3)">n/a</td><td style="color:var(--text3)">n/a</td>';
      const wt=(mode==='all')? ' <span style="font-size:9px;color:var(--text3)" title="This lever carries '+Math.round(frac*100)+'% of the uplift, weighted by its share of the productivity gain so far.">·'+Math.round(frac*100)+'%</span>':'';
      return '<td>'+P(cur)+'</td><td title="Baseline '+P(base)+'."><b>'+P(req)+'</b>'+wt+'</td><td>'+gap(cur,req,down)+'</td>';
    };
    const groups=this.ovVisibleGroups();
    let wTgt=0, wCap=0, body=''; const tUc={e:0,w:0,s:0}; // summed lever contributions → programme allocation
    groups.forEach(g=>{
      const bl=this.ovRows(g,w.blAll), ms=this.ovRows(g,w.msAll);
      const b=this.ovBundle(bl,ms,g.fte,g.cost,g.target);
      const capG=b.bS?b.bS.totalCap:0; wTgt+=g.target*capG; wCap+=capG;
      if(b.u){ tUc.e+=b.u.ucEwor; tUc.w+=b.u.ucWork; }
      const req=this.ovRequired(b, g.target);
      body+='<tr>'+
        '<td class="l"><b>'+U.esc(g.title)+'</b></td>'+
        '<td><input type="number" min="0" step="0.1" value="'+(g.target*100).toFixed(1)+'" onchange="Pages.ovSetTargetPct(\''+g.key+'\',this.value)" style="width:60px;text-align:center;border:1.5px solid var(--border2);border-radius:6px;padding:2px 5px;font-family:var(--f);font-size:12px"> %</td>'+
        mcell(b.curEwor,req.e,b.bS?b.bS.ewor:null,false,req.f.e)+
        mcell(b.curWork,req.w,b.bS?b.bS.workPctOfTotal:null,false,req.f.w)+'</tr>';
    });
    const allLabels=new Set(groups.map(g=>g.label));
    const totTgt=wCap>0? wTgt/wCap : 0;
    const tb=this.ovBundle(w.blAll.filter(r=>allLabels.has(r.role)), w.msAll.filter(r=>allLabels.has(r.role)), 0, 0, totTgt);
    // Programme allocation = summed per-role lever contributions (not the pooled recompute, which cancels out).
    const treq=this.ovRequired({u:{ucEwor:tUc.e,ucWork:tUc.w}, bS:tb.bS}, totTgt);
    body+='<tr class="tot"><td class="l">Total / programme</td><td><b>'+P(totTgt)+'</b></td>'+
      mcell(tb.curEwor,treq.e,tb.bS?tb.bS.ewor:null,false,treq.f.e)+
      mcell(tb.curWork,treq.w,tb.bS?tb.bS.workPctOfTotal:null,false,treq.f.w)+'</tr>';
    const tbl='<table class="uct"><thead>'+
      '<tr><th class="l" rowspan="2">Role</th><th rowspan="2">'+CONFIG.targetFY+' Uplift Target</th>'+
        '<th colspan="3" style="background:var(--green-bg)">EWOR</th><th colspan="3" style="background:var(--surface2)">Working Time %</th></tr>'+
      '<tr><th>Current</th><th>Required</th><th>Gap</th><th>Current</th><th>Required</th><th>Gap</th></tr>'+
      '</thead><tbody>'+body+'</tbody></table>';
    const seg='<div class="seg ov-metric-seg">'+
      [['all','Both metrics'],['ewor','EWOR only'],['work','Working Time only']]
        .map(([k,lbl])=>'<button class="'+(k===mode?'on':'')+'" onclick="Pages.ovSetMetricMode(\''+k+'\')">'+lbl+'</button>').join('')+
      '</div>';
    const alloc = mode==='all'? 'the uplift is split across the two metrics (EWOR and Working Time) <b>in proportion to how much each has driven the productivity gain so far</b> (the ·% next to each Required level; equal ½ if a role has no movement yet)'
      : 'the <b>entire</b> uplift is delivered through <b>'+({ewor:'EWOR',work:'Working Time'}[mode])+'</b> (other metric n/a)';
    return '<div class="card"><div class="card-head"><div>'+
      '<div class="card-title" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><span>Deliver uplift via:</span>'+seg+'</div>'+
      '<div class="card-sub" style="margin-top:6px"><b>Target-driven by productivity uplift %.</b> The editable <b>'+CONFIG.targetFY+' uplift target</b> is the productivity gain each role must deliver. Under this view, '+alloc+'. <b>Current</b> = weekly average over <b>'+U.esc(w.measLabel)+'</b> (each week averaged equally); <b>Required</b> = the level the metric must reach off Baseline <b>'+U.esc(w.baseLabel)+'</b> to deliver its share. <b>Gap</b> = required vs current (green = met). The programme total weights each role by its size.</div></div></div>'+
      '<div class="card-body" style="padding:4px 8px 8px;overflow-x:auto">'+tbl+'</div></div>';
  },

  ovUntrackedPanel(){

  ovSetTargetPct(key,val){ const g=this.ovGroupById(key); if(g)g.target=Math.max(0,(+val||0)/100); this.overview(); },
  ovSetBaseline(which,val){ if(!this._ovBl)this._ovBl={start:CONFIG.ovBaselineDefault.start,end:CONFIG.ovBaselineDefault.end}; if(val)this._ovBl[which]=val; this.overview(); },
  ovSetMeasEnd(val){ this._ovMsEnd=val||null; this.overview(); },
  // Target-baseline window (Apr-25 to Nov-25 default) — used as the anchor for TARGET_PCT dashes.
  _tgtBl:{start:'2025-04-01',end:'2025-11-30'},
  setTargetBl(which,val){ if(val)this._tgtBl[which]=val; this.overview(); },
  // Target % chart section filters
  _tgtRole:'All',
  setTgtRole(){
    const r=document.getElementById('tgt-role');
    if(r) Pages._tgtRole=r.value;
    const area=document.getElementById('tgt-section-inner');
    if(area) area.innerHTML=Pages.tgtSectionInner();
  },
  tgtSectionInner(){
    const rows=State.filtered(), gran=State.granularity;
    const allGps=Compare.periods(rows,gran); State.ensurePeriods(allGps);
    const lo=Math.min(State.baselineKey,State.measureKey), hi=Math.max(State.baselineKey,State.measureKey);
    const sps=(State.baselineKey!=null&&State.measureKey!=null)?allGps.filter(p=>p.key>=lo&&p.key<=hi):allGps;
    const tgtR=Pages._tgtRole;
    // Role dropdown: only roles from the card groups
    const cardGroups=this.ovGroups();
    const sel=(val,opt)=>val===opt?' selected':'';
    const roleOpts='<option value="All"'+sel(tgtR,'All')+'>All roles</option>'+
      cardGroups.map(g=>'<option value="'+U.esc(g.label)+'"'+sel(tgtR,g.label)+'>'+U.esc(g.title)+'</option>').join('');
    // Baseline window bar (moved here from Section 1)
    const blBar='<div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)">'+
      '<span style="font-weight:700;color:var(--text2);white-space:nowrap">Baseline Window</span>'+
      '<label style="display:flex;align-items:center;gap:4px">From <input type="month" value="'+Pages._tgtBl.start.slice(0,7)+'" style="font-size:11px;padding:2px 5px;border:1px solid var(--border);border-radius:4px;background:var(--bg)" onchange="Pages.setTargetBl(\'start\',this.value+\'-01\')"></label>'+
      '<label style="display:flex;align-items:center;gap:4px">To <input type="month" value="'+Pages._tgtBl.end.slice(0,7)+'" style="font-size:11px;padding:2px 5px;border:1px solid var(--border);border-radius:4px;background:var(--bg)" onchange="Pages.setTargetBl(\'end\',this.value+\'-01\')"></label>'+
    '</div>';
    const ctrlBar='<div class="tgt-ctrl-bar">'+
      '<label>Role <select id="tgt-role" onchange="Pages.setTgtRole()">'+roleOpts+'</select></label>'+
      blBar+
    '</div>';
    // Period → last-month label helper (quarterly: use last month of quarter)
    const pml=(p)=>{ if(gran==='quarterly'){let mx=0;p.rows.forEach(r=>{if(r.ms>mx)mx=r.ms;});return mx?U.monthLabel(mx):null;} return p.label; };
    // Role-key mapping (card label → plan/target role) is shared via tgtRoleKey().
    // Baseline window dates
    const tbS=U.toDate(Pages._tgtBl.start);
    const _tbD=new Date(U.toDate(Pages._tgtBl.end));
    const tbE=Date.UTC(_tbD.getUTCFullYear(),_tbD.getUTCMonth()+1,0);
    // Rows filtered by selected role (for actual KPI)
    const roleRows=tgtR==='All'?rows:rows.filter(r=>r.role===tgtR);
    // Baseline KPIs
    const blRows=roleRows.filter(r=>r.rd>=tbS&&r.rd<=tbE);
    const blK=blRows.length?Calc.kpisOf(blRows):null;
    // Build target vals from the HIGHER-EFFICIENCY stream only (absolute: baseline × (1+uplift%)).
    // Only higher efficiency lifts EWOR / Working Time; lower volumes & structural efficiency are
    // tracked separately in the Target Explorer and never fold into this overlay.
    const tgtValsFor=(kpiKey)=>sps.map(p=>{
      if(!blK) return null;
      const ml=pml(p); if(!ml) return null;
      let uplift=0;
      if(tgtR==='All'){
        // Average HE uplift across all card groups (simple mean)
        let sum=0, cnt=0;
        cardGroups.forEach(g=>{ const u=ProgTgt.pct(tgtRoleKey(g.label),'he',ml); sum+=u; cnt++; });
        uplift=cnt>0?sum/cnt:0;
      } else {
        uplift=ProgTgt.pct(tgtRoleKey(tgtR),'he',ml);
      }
      const base=blK[kpiKey];
      if(!isFinite(base)||base<=0) return null;
      return base*(1+_upliftG(uplift));   // capacity-created single-lever level (= base × (1+uplift)); uplift 0 → baseline
    });
    // Actual KPI per period
    const actValsFor=(kpiKey)=>sps.map(p=>{
      const pr=tgtR==='All'?p.rows:p.rows.filter(r=>r.role===tgtR);
      if(!pr.length) return null;
      return Calc.kpisOf(pr)[kpiKey];
    });
    const subtitle=tgtR==='All'?'All roles':tgtR;
    const winLbl=sps.length?(sps[0].label+' → '+sps[sps.length-1].label):'';
    const mkChart=(kpiKey,chartTitle,color)=>'<div class="tgt-chart-wrap" style="flex:1;min-width:0">'+
      bigChart({metric:chartTitle,sub:subtitle+(winLbl?' · '+winLbl:'')+' · higher-efficiency target',
        yTitle:kpiKey==='ewor'?'EWOR (% of effective capacity)':'Working Time (% of total capacity)',
        labels:sps.map(p=>p.label),actual:actValsFor(kpiKey),target:tgtValsFor(kpiKey),accent:color,stepped:true})+
    '</div>';
    const chartsHtml='<div style="display:flex;gap:12px;align-items:stretch">'+
      mkChart('ewor','EWOR','#2b6f8a')+
      mkChart('workPct','Working Time %','#147a63')+
    '</div>';
    return ctrlBar+chartsHtml;
  },
  ovSetFte(key,val){ const g=this.ovGroupById(key); if(g)g.fte=+val||0; this.overview(); },
  ovDrill(key){
    const g=this.ovGroupById(key); if(!g) return;
    const rows=State.filtered(), gran=State.granularity;
    const ps=Compare.periods(rows, gran); State.ensurePeriods(ps);
    const measureB=ps.find(p=>p.key===State.measureKey)||(ps.length?ps[ps.length-1]:null);
    const baseB=ps.find(p=>p.key===State.baselineKey)||null;
    const ms=measureB?this.ovRows(g,measureB.rows):[];
    const bl=baseB?this.ovRows(g,baseB.rows):[];

    const row=(label,cls,indent,mk,bk)=>'<tr'+(cls?' class="'+cls+'"':'')+'><td class="l"'+(indent?' style="padding-left:24px"':'')+'>'+label+'</td>'+
      '<td class="num">'+U.pct(mk.ewor)+'</td><td>'+dchip((mk.ewor-bk.ewor)*100,false)+'</td>'+
      '<td class="num">'+U.pct(mk.workPct)+'</td><td>'+dchip((mk.workPct-bk.workPct)*100,false)+'</td>'+
      '<td class="num">'+U.pct(mk.shrinkPct)+'</td><td>'+dchip((mk.shrinkPct-bk.shrinkPct)*100,true)+'</td></tr>';
    let h='<div class="m-sub" style="margin-bottom:8px">Measurement <b>'+(measureB?U.esc(measureB.label):'—')+'</b>'+(baseB?' vs baseline <b>'+U.esc(baseB.label)+'</b>':'')+' · county totals with work-centre breakdown · Δ in percentage points</div>';
    if(!ms.length){ UI.openModal(g.title+' — by County & Work Centre','<div class="ch-empty">No data for this role group in the measurement period.</div>'); return; }
    h+='<div class="tbl-scroll" style="max-height:64vh"><table class="uct"><thead><tr><th class="l">County / Work Centre</th><th class="num">EWOR</th><th>Δ EWOR</th><th class="num">Working %</th><th>Δ Working</th><th class="num">Shrinkage %</th><th>Δ Shrinkage</th></tr></thead><tbody>';
    [...new Set(ms.map(r=>r.county))].sort((a,b)=>String(a).localeCompare(String(b))).forEach(county=>{
      const cms=ms.filter(r=>r.county===county), cbl=bl.filter(r=>r.county===county);
      h+=row('<b>'+U.esc(county)+'</b>','cty',false,Calc.kpisOf(cms),Calc.kpisOf(cbl));
      [...new Set(cms.map(r=>r.productionArea))].sort((a,b)=>String(a).localeCompare(String(b))).forEach(area=>{
        h+=row(U.esc(area),'',true,Calc.kpisOf(cms.filter(r=>r.productionArea===area)),Calc.kpisOf(cbl.filter(r=>r.productionArea===area)));
      });
    });
    h+='</tbody></table></div>';
    UI.openModal(g.title+' — by County & Work Centre', h);
  },

  /* ---------- PERFORMANCE INSIGHTS ---------- */
  insights(){
    const rows=State.filtered();
    const gran=State.granularity;
    const ps=Compare.periods(rows,gran); State.ensurePeriods(ps);
    const measureB=ps.find(p=>p.key===State.measureKey)||(ps.length?ps[ps.length-1]:null);
    const anchorRows=(measureB&&measureB.rows.length)?measureB.rows:rows;
    let anchorMk=null,anchorQk=null;
    for(const r of anchorRows){ if(anchorMk==null||r.mk>anchorMk)anchorMk=r.mk; if(anchorQk==null||r.qk>anchorQk)anchorQk=r.qk; }
    const anchorKey=gran==='quarterly'?anchorQk:anchorMk;
    const measureLabel=measureB?measureB.label:'latest period';
    const html=
      '<div class="ph"><div><div class="ph-title">Performance Insights</div>'+
      '<div class="ph-sub">EWOR, Working Time, Shrinkage, Capacity and Output by Business Unit and County — measurement period <b>'+U.esc(measureLabel)+'</b>, vs previous period and same period last year. Granularity and measurement window follow the toolbar.</div></div></div>'+
      '<div class="card"><div class="card-head"><div><div class="card-title">Performance Matrix</div>'+
      '<div class="card-sub">Current value · Δ vs previous '+U.esc(gran)+' period · Δ vs same period last fiscal year · Δ in percentage points for ratio metrics, hours for capacity/output</div>'+
      '</div><div class="ph-actions"><button class="btn btn-green btn-sm" onclick="Exports.insightsXlsx()">↓ Excel</button></div></div><div class="card-body" id="pi-matrix"></div></div>'+
      '<div class="card"><div class="card-head"><div><div class="card-title">Anomaly Detection</div>'+
      '<div class="card-sub">Scopes where EWOR, Working Time % or Shrinkage % moved by &gt;'+CONFIG.anomaly.deltaPct+'pp vs the previous '+gran+' period. Respects the current filters.</div>'+
      '</div></div><div class="card-body" id="anomaly"></div></div>';
    const el=document.getElementById('page-insights'); el.innerHTML=html;
    document.getElementById('pi-matrix').innerHTML=this.insightsMatrix(rows,gran,anchorKey);
    document.getElementById('anomaly').innerHTML=Anomaly.tableHtml(Anomaly.current());
  },
  insightsMatrix(rows,gran,anchorKey){
    function normBU(bu){
      const t=(bu||'').toLowerCase();
      if(t.includes('bio')||t.includes('bioresourc')) return 'Bioresources';
      if(t.includes('waste')||t.includes('wastewater')) return 'Wastewater';
      if(t.includes('water')) return 'Water';
      return bu||'Other';
    }
    const BU_ORDER=['Water','Wastewater','Bioresources'];
    const BU_CLS={'Water':'pi-bu-water','Wastewater':'pi-bu-ww','Bioresources':'pi-bu-bio'};
    // Fixed county order for Water and Wastewater; dynamic (sorted) for Bioresources
    const FIXED_COUNTIES=['Cheshire','Cumbria','Lancashire','Manchester','Merseyside'];
    // Group rows: BU → county → rows[]
    const buMap={}; BU_ORDER.forEach(b=>{ buMap[b]={}; });
    rows.forEach(r=>{
      const bu=normBU(r.businessUnit);
      if(!buMap[bu]) buMap[bu]={};
      let co=r.county||'Unknown';
      // For Water/Wastewater normalise "Greater Manchester" → "Manchester" to match fixed column names
      if((bu==='Water'||bu==='Wastewater')&&/^greater\s+/i.test(co)) co=co.replace(/^greater\s+/i,'').trim();
      if(!buMap[bu][co]) buMap[bu][co]=[];
      buMap[bu][co].push(r);
    });
    const buCols=BU_ORDER.map(bu=>{
      let counties;
      if(bu==='Water'||bu==='Wastewater'){
        // Show all 5 fixed counties always (empty columns if no data in that county)
        counties=FIXED_COUNTIES;
      } else {
        // Bioresources: whatever counties exist in the data, sorted
        counties=Object.keys(buMap[bu]||{}).sort();
      }
      return {bu, counties};
    }).filter(b=>b.counties.length);
    if(!buCols.length) return '<div class="ch-empty">No Business Unit data available for the current selection.</div>';
    // Pre-compute comparator KPIs per column
    function cmpKpis(rr){
      const c=Compare.comparators(rr,gran,anchorKey);
      if(!c||!c.current.rows.length) return {cur:null,prev:null,py:null,prevLabel:'—',pyLabel:'—',curLabel:'—'};
      return {
        cur:Calc.kpisOf(c.current.rows),
        prev:c.prev&&c.prev.rows.length?Calc.kpisOf(c.prev.rows):null,
        py:c.prevYear&&c.prevYear.rows.length?Calc.kpisOf(c.prevYear.rows):null,
        curLabel:c.current.label,
        prevLabel:c.prev?c.prev.label:'—',
        pyLabel:c.prevYear?c.prevYear.label:'—'
      };
    }
    const colData=[];
    buCols.forEach(({bu,counties})=>{ counties.forEach(co=>{ colData.push({bu,county:co,cmp:cmpKpis(buMap[bu][co]||[])}); }); });
    // Derive period labels for header subtitle from first data column
    const ref=colData.find(c=>c.cmp.cur)||colData[0];
    const prevLbl=ref.cmp.prevLabel, pyLbl=ref.cmp.pyLabel;
    // Build table
    let h='<div class="pi-wrap"><table class="pi-tbl"><thead>';
    // Row 1: BU headers
    h+='<tr><th class="pi-metric" rowspan="3" style="top:0;z-index:4">Metric</th>';
    buCols.forEach(({bu,counties})=>{
      h+='<th colspan="'+(counties.length*3)+'" class="pi-bu-head '+BU_CLS[bu]+'">'+U.esc(bu)+'</th>';
    });
    h+='</tr>';
    // Row 2: County headers
    h+='<tr>';

  /* ---------- UPLIFT TRANSLATOR (productivity target → required EWOR & Working Time) ----------
     For a role, at a point on the ramp, what the higher-efficiency productivity target implies for the
     two measurable KPIs. UC-decomposition off the baseline window:
        Eff%   = 1 − baseline Shrinkage
        Hidden = baseline EWOR ÷ (baseline Working% / Eff%)
        Required EWOR      = baseline EWOR      + (EWOR share    · p) ÷ Eff%
        Required Working % = baseline Working % + (Working share · p) ÷ Hidden
     The allocation slider sets the EWOR share (0→all Working, 1→all EWOR); the extremes are the two
     single-lever bounds. Only Higher efficiency is translated (LV/SE don't move these KPIs). */
  _trRole:null, _trFY:null, _trShare:null,
  trSetRole(v){ this._trRole=v; this._trShare=null; this.translator(); },
  trSetFY(fy){ this._trFY=fy; this._trShare=null; this.translator(); },
  trSetBl(which,val){ if(!this._ovBl)this._ovBl={start:CONFIG.ovBaselineDefault.start,end:CONFIG.ovBaselineDefault.end}; if(val)this._ovBl[which]=val+'-01'; this._trShare=null; this.translator(); },
  trAuto(){ this._trShare=null; this.translator(); },
  trSetShare(v){ this._trShare=Math.max(0,Math.min(1,(+v)/100)); const d=document.getElementById('tr-dyn'); if(d)d.innerHTML=this._trDyn(); const rr=document.getElementById('tr-share-read'); if(rr)rr.innerHTML=this._trShareRead(); this._trTableRefresh(); },
  translatorRoles(){ const set=new Set(); (State.derived||[]).forEach(r=>set.add(r.role)); const store=ProgTgt.active();
    return [...set].filter(role=>{ const rb=store.byRole[tgtRoleKey(role)]; return rb&&rb.he&&Object.keys(rb.he).some(k=>rb.he[k]>0); }).sort(); },
  _trCtx(){
    const store=ProgTgt.active();
    const roles=this.translatorRoles();
    let role=this._trRole; if(!role||roles.indexOf(role)<0) role=roles.indexOf('Process Controller')>=0?'Process Controller':(roles[0]||null);
    this._trRole=role;
    const fys=this._tgtFYs(); let fy=this._trFY; if(!fy||fys.indexOf(fy)<0) fy=fys[fys.length-1]; this._trFY=fy;
    const anchors=this._tgtAnchors(fys), anchorMl=anchors[fy];
    const ctx={store,roles,role,fys,fy,anchors,anchorMl};
    if(!role) return ctx;
    const w=this.ovWindows(); ctx.w=w;
    const blRows=w.blAll.filter(r=>r.role===role), msRows=w.msAll.filter(r=>r.role===role);
    ctx.bS=blRows.length?UCEngine.periodStats(blRows):null;
    ctx.mS=msRows.length?UCEngine.periodStats(msRows):null;
    ctx.u=(blRows.length&&msRows.length)?UCEngine.computeGroup(blRows,msRows,{role:'',budgetFte:0,costPerHour:0,avgMode:'rows'}):null;
    const rb=store.byRole[tgtRoleKey(role)]||{he:{},lv:{},se:{}};
    ctx.heMap=rb.he||{};
    ctx.p=ctx.heMap[anchorMl]||0; ctx.lv=(rb.lv||{})[anchorMl]||0; ctx.se=(rb.se||{})[anchorMl]||0;
    ctx.eff=ctx.bS?(ctx.bS.effPct||1):1; ctx.hid=ctx.bS?(ctx.bS.hidden||1):1;

    // by its share of p. Single-lever = baseline × (1+p).
    ctx.g = _upliftG(ctx.p);

      ctx.reqEwor=ctx.bS.ewor*(1+ctx.sE*ctx.g);
      ctx.reqWork=ctx.bS.workPctOfTotal*(1+ctx.sW*ctx.g);
      ctx.boundEwor=ctx.bS.ewor*(1+ctx.g);
      ctx.boundWork=ctx.bS.workPctOfTotal*(1+ctx.g);
      ctx.curEwor=ctx.mS?ctx.mS.ewor:ctx.bS.ewor;
      ctx.curWork=ctx.mS?ctx.mS.workPctOfTotal:ctx.bS.workPctOfTotal;
    }
    return ctx;
  },
  _trShareRead(){ const c=this._trCtx(); const dflt=this._trShare==null; return '<b>'+Math.round(c.sE*100)+'%</b> via EWOR · <b>'+Math.round(c.sW*100)+'%</b> via Working Time'+(dflt?' <span style="color:var(--text3);font-weight:600">· default 50 / 50</span>':''); },

  releaseSummary(){
