<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FTE Productivity Tracking &amp; Reporting Dashboard</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='5' y='5' width='90' height='90' rx='18' fill='%23ffffff' stroke='%230f4e3e' stroke-width='10'/><path d='M25 51 L43 71 L77 31' fill='none' stroke='%23008542' stroke-width='12' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<!-- Libraries (match the supplied reference tool's stack) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap"></noscript>
<style>
/* ============================================================================
   DESIGN TOKENS — ported from the supplied design reference (value.html).
   Colours / typography / radii / shadows reused so this feels like the same family.
   ========================================================================== */
:root{
  --bg:#f0f4f1; --surface:#fbfdfb; --surface2:#eaf2ec; --surface3:#d6e8da;
  --border:rgba(30,90,50,0.09); --border2:rgba(30,90,50,0.18);
  --text:#0c1f13; --text2:#345c3e; --text3:#7fa888;
  --green:#1b6e3e; --green2:#145430; --green-bg:#e2f4e9; --green-mid:#2d8a55; --green-light:#c8ecd3;
  --amber:#7a4000; --amber-bg:#fff0e0; --amber-mid:#d98a2b;
  --red:#922020; --red-bg:#fdeaea; --red-mid:#cf4b4b;
  --blue:#1d5a7a; --blue-bg:#e2eef4; --purple:#5b3a8a; --teal:#0f6e6e;
  --f:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'SFMono-Regular','Consolas','Liberation Mono',monospace;
  --r:8px; --r2:14px;
  --sh:0 1px 3px rgba(0,0,0,0.05),0 4px 16px rgba(0,0,0,0.06);
  --sh2:0 4px 12px rgba(0,0,0,0.08),0 16px 48px rgba(0,0,0,0.1);
  /* Categorical chart palette (greens-forward, accessible) */
  --c1:#1b6e3e; --c2:#2d8a55; --c3:#5bb37e; --c4:#8fce9f; --c5:#d98a2b;
  --c6:#1d5a7a; --c7:#5b3a8a; --c8:#0f6e6e; --c9:#b08900; --c10:#a14a4a;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:var(--f);background:var(--bg);color:var(--text);font-size:13px;}

/* ── Layout ── */
.app{display:grid;grid-template-columns:185px 1fr;min-height:100vh;}
.main{padding:18px 22px 60px;overflow-x:clip;min-width:0;}

/* ── Sidebar ── */
.nav{background:#0d2416;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;border-right:1px solid rgba(255,255,255,0.05);}
.nav-logo{padding:14px 14px 12px;border-bottom:1px solid rgba(255,255,255,0.07);background:rgba(0,0,0,0.15);}
.nav-logo .ssb{font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;display:block;width:100%;height:auto;
  --ssb-heading:#b9dd78;--ssb-tick:#b9dd78;--ssb-frame:#fff;--ssb-word:#fff;}
.ssb-heading{fill:var(--ssb-heading);}.ssb-tick{stroke:var(--ssb-tick);}.ssb-frame{stroke:var(--ssb-frame);}.ssb-word{fill:var(--ssb-word);}
.nav-logo-tool{margin-top:9px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.07);font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,0.6);}
.nav-logo-tool-sub{font-size:8px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,0.32);margin-top:2px;}
.nav-items{padding:9px 8px;flex:1;overflow-y:auto;min-height:0;}
.nav-sep{font-size:8px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,0.18);padding:10px 11px 4px;}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 11px;border-radius:7px;background:none;border:1px solid transparent;color:rgba(255,255,255,0.46);font-family:var(--f);font-size:12.5px;font-weight:500;cursor:pointer;transition:background-color .15s,color .15s,border-color .15s;text-align:left;margin-bottom:2px;}
.nav-item:hover{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.82);}
.nav-item.on{background:linear-gradient(135deg,rgba(43,130,75,0.28),rgba(43,130,75,0.18));color:#72d48f;border-color:rgba(43,130,75,0.25);}
.nav-item .ico{flex-shrink:0;font-size:14px;width:18px;text-align:center;opacity:.85;}
.nav-foot{padding:10px 12px;border-top:1px solid rgba(255,255,255,0.06);font-size:9px;color:rgba(255,255,255,0.22);font-family:var(--mono);line-height:1.5;}

/* ── Page header ── */
.page{display:none;animation:fade .25s ease;}
.page.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap;}
.ph-title{font-size:19px;font-weight:800;color:var(--text);letter-spacing:-.02em;}
.ph-sub{font-size:11.5px;color:var(--text3);margin-top:3px;max-width:760px;}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:var(--r);font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:var(--f);transition:background-color .15s,box-shadow .15s,color .15s,border-color .15s;white-space:nowrap;}
.btn-green{background:var(--green);color:#fff;box-shadow:0 2px 6px rgba(27,110,62,0.3);}
.btn-green:hover{background:var(--green2);box-shadow:0 3px 10px rgba(27,110,62,0.4);}
.btn-ghost{background:var(--surface);color:var(--text2);border:1.5px solid var(--border2);}
.btn-ghost:hover{background:var(--surface2);}
.btn-sm{padding:5px 11px;font-size:11px;}

/* ── Toolbar (filters) ── */
.vt{position:sticky;top:0;z-index:40;background:rgba(240,244,241,0.92);backdrop-filter:blur(8px);margin:-18px -22px 16px;padding:11px 22px;border-bottom:1px solid var(--border);}
.vt-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
.vt-brand{font-size:12px;font-weight:800;color:var(--text);letter-spacing:-.01em;display:flex;align-items:center;gap:8px;}
.vt-spacer{flex:1;}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:2px;gap:2px;}
.seg button{border:none;background:none;font-family:var(--f);font-size:11px;font-weight:600;color:var(--text2);padding:5px 11px;border-radius:6px;cursor:pointer;}
.seg button.on{background:var(--surface);color:var(--green);box-shadow:var(--sh);}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center;}
.fl{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text3);}
.fdrop{position:relative;}
.fdrop-btn{padding:6px 11px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid var(--border2);color:var(--text2);background:var(--surface);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.fdrop-btn:hover{background:var(--surface2);}
.fdrop-btn.has{border-color:var(--green);color:var(--green);background:var(--green-bg);}
.fdrop-btn .cnt{background:var(--green);color:#fff;border-radius:999px;font-size:9px;padding:1px 6px;font-weight:700;}
.fdrop-pop{display:none;position:absolute;top:calc(100% + 5px);left:0;z-index:60;background:var(--surface);border:1px solid var(--border2);border-radius:10px;box-shadow:var(--sh2);width:240px;max-height:320px;overflow:hidden;flex-direction:column;}
.fdrop-pop.open{display:flex;}
.fdrop-search{padding:8px;border-bottom:1px solid var(--border);}
.fdrop-search input{width:100%;padding:6px 9px;border:1px solid var(--border2);border-radius:7px;font-family:var(--f);font-size:11px;}
.fdrop-list{overflow-y:auto;padding:4px;flex:1;}
.fdrop-opt{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:11.5px;color:var(--text);}
.fdrop-opt:hover{background:var(--surface2);}
.fdrop-opt input{accent-color:var(--green);}
.fdrop-foot{padding:7px 8px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:6px;}
.lnk{color:var(--green);font-size:11px;font-weight:600;cursor:pointer;background:none;border:none;font-family:var(--f);}
.lnk:hover{text-decoration:underline;}
.per-sel{padding:6px 10px;border-radius:8px;border:1.5px solid var(--border2);background:var(--surface);color:var(--text2);font-family:var(--f);font-size:11px;font-weight:600;cursor:pointer;max-width:150px;}
.per-sel:focus{outline:none;border-color:var(--green);}
/* Global anomaly bar (shown in the sticky toolbar on every section) */
.anom-bar{display:flex;align-items:center;gap:9px;margin-top:9px;padding:7px 12px;border-radius:9px;font-size:11.5px;font-weight:600;border:1px solid;}
.anom-bar.ok{background:var(--green-bg);border-color:var(--border2);color:var(--green2);}
.anom-bar.warn{background:var(--amber-bg);border-color:#f0d2a8;color:var(--amber);}
.anom-bar.crit{background:var(--red-bg);border-color:#f3c4c4;color:var(--red);}
.anom-bar .chips{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0;overflow:hidden;}
.anom-chip{background:rgba(255,255,255,0.55);border-radius:6px;padding:2px 8px;font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px;}
.anom-bar .btn{margin-left:auto;}

/* ── KPI metric cards ── */
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px;}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:15px 16px 14px;box-shadow:var(--sh);position:relative;overflow:hidden;cursor:default;}
.metric::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--green);}
.metric.pos::after{background:var(--green);}.metric.neg::after{background:var(--red-mid);}.metric.neu::after{background:var(--text3);}
.m-label{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:7px;display:flex;align-items:center;gap:5px;}
.m-info{width:13px;height:13px;border-radius:50%;background:var(--surface3);color:var(--text2);font-size:9px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;cursor:help;flex-shrink:0;}
.m-value{font-size:24px;font-weight:800;color:var(--text);line-height:1;letter-spacing:-.02em;}
.m-unit{font-size:12px;font-weight:600;color:var(--text3);margin-left:3px;}
.m-sub{font-size:11px;margin-top:6px;color:var(--text3);display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.m-trend{font-weight:700;display:inline-flex;align-items:center;gap:2px;}
.m-pos{color:var(--green);}.m-neg{color:var(--red);}.m-neu{color:var(--text3);}
.m-cmp{font-size:10px;color:var(--text3);}

/* ── Cards ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);box-shadow:var(--sh);margin-bottom:16px;}
.card-head{padding:15px 18px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.card-title{font-size:13px;font-weight:700;color:var(--text);letter-spacing:-.01em;}
.card-sub{font-size:10.5px;color:var(--text3);margin-top:2px;}
.card-body{padding:14px 18px 16px;}
.card-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.charts .full{grid-column:1/-1;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}

/* ── Charts ── */
.chart-svg{width:100%;height:auto;display:block;font-family:var(--f);overflow:visible;}
.ch-tip{position:fixed;z-index:200;background:#0c1f13;color:#fff;border-radius:8px;padding:8px 11px;font-size:11px;pointer-events:none;box-shadow:var(--sh2);opacity:0;transition:opacity .1s;max-width:260px;line-height:1.5;}
.ch-tip b{color:#9fe6b6;}
.ch-empty{padding:40px 10px;text-align:center;color:var(--text3);font-size:12px;}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;justify-content:center;}
.legend span{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text2);cursor:pointer;}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}

/* ── Tables ── */
.tbl-scroll{overflow:auto;border:1px solid var(--border);border-radius:var(--r2);background:var(--surface);}
table{width:100%;border-collapse:collapse;}
th{padding:9px 8px;text-align:left;font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);background:var(--surface2);border-bottom:2px solid var(--border2);white-space:nowrap;position:sticky;top:0;z-index:2;cursor:pointer;user-select:none;}
th.num{text-align:right;}
th .sortarrow{color:var(--green);margin-left:3px;}
td{padding:8px 8px;border-bottom:1px solid var(--border);font-size:12px;vertical-align:middle;white-space:nowrap;}
td.num{text-align:right;font-family:var(--mono);font-size:11px;}
tr:nth-child(even) td{background:rgba(26,110,62,0.015);}
tr:hover td{background:rgba(26,110,62,0.05);}
.rank-tbl td,.rank-tbl th{white-space:normal;}
.minib{height:5px;border-radius:3px;background:var(--surface3);overflow:hidden;min-width:50px;}
.minib i{display:block;height:100%;border-radius:3px;background:var(--green);}

/* ── Performance Insights matrix ── */
.pi-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r2);background:var(--surface);}
.pi-tbl{width:100%;border-collapse:collapse;table-layout:auto;}
.pi-tbl th,.pi-tbl td{border-bottom:1px solid var(--border);white-space:nowrap;}
.pi-tbl td{padding:7px 8px;font-size:12px;vertical-align:middle;}
.pi-tbl td.num{text-align:right;font-family:var(--mono);font-size:11px;}
.pi-tbl tr:nth-child(even) td{background:rgba(26,110,62,.015);}
.pi-tbl tr:hover td{background:rgba(26,110,62,.05);}
.pi-bu-head{padding:7px 8px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;text-align:center;border-right:2px solid var(--surface);position:sticky;top:0;z-index:3;}
.pi-co-head{padding:5px 8px;font-size:10px;font-weight:700;text-align:center;background:var(--surface2);color:var(--text2);border-right:1px solid var(--border2);position:sticky;top:27px;z-index:2;}
.pi-val-head{padding:4px 8px;font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);background:var(--surface2);text-align:right;border-right:1px solid var(--border);position:sticky;top:52px;z-index:2;}
.pi-metric{padding:8px 10px;font-size:12px;background:var(--surface);position:sticky;left:0;z-index:1;border-right:2px solid var(--border2);min-width:150px;}
.pi-val{padding:7px 8px;text-align:right;font-family:var(--mono);font-size:11px;border-right:1px solid var(--border);}
.pi-bu-water{background:#1a6e3e;}.pi-bu-ww{background:#2563a8;}.pi-bu-bio{background:#7c3e9e;}
/* ── Badges / status ── */
.badge{display:inline-flex;padding:2px 9px;border-radius:20px;font-size:9.5px;font-weight:700;white-space:nowrap;}
.b-g{background:var(--green-bg);color:var(--green);}.b-a{background:var(--amber-bg);color:var(--amber);}.b-r{background:var(--red-bg);color:var(--red);}.b-n{background:var(--surface2);color:var(--text2);}
.pill{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid var(--border2);color:var(--text2);background:var(--surface);transition:all .12s;}
.pill.on{background:var(--green);color:#fff;border-color:var(--green);}

/* ── Upload / dropzone ── */
#drag-overlay{position:fixed;inset:0;z-index:300;background:rgba(13,36,22,0.82);display:none;align-items:center;justify-content:center;}
#drag-overlay .inner{background:var(--surface);border:3px dashed var(--green);border-radius:20px;padding:60px 80px;text-align:center;color:var(--text);font-size:18px;font-weight:700;}
#drag-overlay .inner div:first-child{font-size:54px;margin-bottom:14px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:250;background:#0c1f13;color:#fff;padding:11px 20px;border-radius:10px;font-size:12.5px;font-weight:600;box-shadow:var(--sh2);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.err{background:#922020;}.toast.warn{background:#7a4000;}

/* ── Modal ── */
.modal{position:fixed;inset:0;z-index:280;background:rgba(12,31,19,0.5);display:none;align-items:center;justify-content:center;padding:20px;}
.modal.open{display:flex;}
.modal-box{background:var(--surface);border-radius:16px;box-shadow:var(--sh2);max-width:680px;width:100%;max-height:86vh;overflow:auto;}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--surface);z-index:2;}
.modal-head h3{font-size:15px;font-weight:800;}
.modal-body{padding:18px 22px;}
.x-btn{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text3);line-height:1;}

/* ── Validation report ── */
.valrep{font-size:12px;}
.valrep .vr-row{display:grid;grid-template-columns:60px 150px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);}
.valrep .vr-h{font-weight:700;color:var(--text3);text-transform:uppercase;font-size:9px;letter-spacing:.06em;}

/* ── Glossary ── */
.gloss{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.gloss-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:15px 17px;box-shadow:var(--sh);}
.gloss-item h4{font-size:13px;font-weight:800;color:var(--green2);margin-bottom:4px;}
.gloss-item .formula{font-family:var(--mono);font-size:11px;background:var(--surface2);border-radius:7px;padding:7px 10px;margin:7px 0;color:var(--text);white-space:pre-wrap;}
.gloss-item p{font-size:11.5px;color:var(--text2);line-height:1.55;margin-top:5px;}
.gloss-item .src{font-size:10px;color:var(--text3);margin-top:6px;}
/* Help & Glossary approach blocks */
.hb-banner{background:var(--green2);color:#fff;font-weight:700;font-size:13px;padding:9px 14px;border-radius:9px;margin:20px 0 11px;letter-spacing:.01em;}
.hb-p{font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:10px;}
.hb-grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.hb-box{background:var(--green-bg);border:1px solid var(--border2);border-radius:9px;padding:11px 13px;font-size:11.5px;font-weight:600;color:var(--text);line-height:1.4;}
.hb-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.hb-col{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);box-shadow:var(--sh);padding:13px 15px;}
.hb-col-h{font-size:12.5px;font-weight:800;color:var(--green2);margin-bottom:6px;}
.hb-col-i{font-size:11px;color:var(--text2);margin-bottom:6px;}
.hb-col ul,.hb-metric ul{margin:0 0 4px 16px;font-size:11.5px;color:var(--text2);line-height:1.6;}
.hb-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.hb-metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);box-shadow:var(--sh);padding:14px 16px;}
.hb-metric h4{font-size:14px;font-weight:800;color:var(--green2);margin-bottom:3px;}
.hb-metric .hb-sub{font-size:11px;color:var(--text3);font-style:italic;margin-bottom:9px;}
.hb-tag{display:inline-block;background:var(--green);color:#fff;font-size:10px;font-weight:700;padding:3px 9px;border-radius:6px;margin:8px 0 4px;}
.hb-note{margin-top:8px;padding-top:7px;border-top:1px dashed var(--border2);font-size:11px;font-weight:600;color:var(--green2);}
.hb-flow{background:var(--surface2);border-radius:9px;padding:12px 15px;font-size:12px;color:var(--text2);line-height:1.6;margin-top:12px;}
/* Operational Overview — PowerPoint-style role-group cards */
.ov-subhead{font-size:13px;font-weight:800;color:var(--green2);margin:16px 0 9px;padding-left:2px;letter-spacing:.01em;}
.ov-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:18px;}
.ov-grid-wrap{grid-template-columns:repeat(6,1fr);}
.ov-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);box-shadow:var(--sh);overflow:hidden;cursor:pointer;transition:box-shadow .15s,transform .12s;}
.ov-card:hover{box-shadow:var(--sh2);transform:translateY(-2px);}
.ov-card.ov-sel{outline:3px solid var(--green);outline-offset:-1px;box-shadow:var(--sh2);}
.ov-budget{font-size:9.5px;font-weight:700;color:var(--text3);padding:3px 8px 2px;display:flex;align-items:center;gap:4px;}
.ov-budget input{width:44px;border:1px solid var(--border2);border-radius:5px;padding:1px 4px;font-family:var(--mono);font-size:9.5px;font-weight:700;color:var(--text);}
.ov-head{color:#fff;font-weight:800;font-size:10.5px;text-align:center;padding:5px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em;}
.ov-metric{padding:5px 8px 5px;}
/* Target % chart section */
.tgt-ctrl-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);font-size:11px;}
.tgt-ctrl-bar label{display:flex;align-items:center;gap:5px;color:var(--text2);font-weight:600;white-space:nowrap;}
.tgt-ctrl-bar select{font-size:11px;padding:3px 6px;border:1px solid var(--border);border-radius:5px;background:var(--bg);color:var(--text);cursor:pointer;}
.tgt-chart-wrap{background:var(--surface);border:1.5px solid var(--border2);border-radius:var(--r2);padding:12px 14px;}
.ov-metric+.ov-metric{border-top:1px solid var(--border);}
.ov-m-label{font-size:10px;font-weight:700;color:var(--text3);margin-bottom:1px;text-transform:uppercase;letter-spacing:.06em;}
.ov-m-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;}
.ov-m-val{font-size:16px;font-weight:800;letter-spacing:-.02em;line-height:1.05;}
.ov-deltas{font-size:9.5px;font-weight:700;text-align:right;line-height:1.4;white-space:nowrap;}
.ov-dpos{color:var(--green);}.ov-dneg{color:var(--red);}
.ov-spark{margin-top:4px;width:100%;}
.ov-net{border-top:1px solid var(--border);background:var(--surface3);color:var(--text2);font-weight:700;font-size:11px;padding:8px;display:flex;flex-direction:column;gap:2px;align-items:center;}
.ov-net-row{display:flex;gap:5px;align-items:baseline;justify-content:center;}
.ov-net .ov-net-lbl{font-weight:800;color:var(--text);letter-spacing:.04em;}
.ov-net .pos{color:var(--green);font-weight:800;}
.ov-net .neg{color:var(--red);font-weight:800;}
.ov-net-vs{color:var(--text3);font-weight:600;}
.ov-insight{padding:8px 12px 9px;border-top:1px solid var(--border);background:#fff;font-size:10px;line-height:1.55;font-style:italic;font-weight:700;}
.ov-foot-note{font-style:italic;font-size:11.5px;color:var(--green2);background:var(--green-bg);border-radius:8px;padding:9px 13px;margin-bottom:10px;}
.uct td,.uct th{text-align:center;}
.uct td.l,.uct th.l{text-align:left;}
.uct .dchip{display:inline-block;border-radius:6px;padding:2px 7px;font-family:var(--mono);font-size:10.5px;font-weight:700;}
.uct .dpos{background:var(--green-bg);color:var(--green);}.uct .dneg{background:var(--red-bg);color:var(--red);}.uct .dneu{background:var(--surface2);color:var(--text2);}
.uct tr.tot td{font-weight:800;background:var(--surface2);}
.uct tr.cty td{background:var(--surface2);font-weight:700;}
@media(max-width:1400px){.ov-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:900px){.ov-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:600px){.ov-grid{grid-template-columns:1fr;}}

.note{font-size:10.5px;color:var(--text3);background:var(--surface2);border-radius:7px;padding:8px 11px;border-left:3px solid var(--green-mid);margin-top:10px;line-height:1.5;}

.spin{width:16px;height:16px;border:2px solid var(--green-light);border-top-color:var(--green);border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:middle;}

/* ── Target Explorer ── */
.tgt-src{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text2);background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:8px 12px;margin-bottom:14px;}

.tgt-src .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

.tgt-callout{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:14px 16px;margin-bottom:18px;box-shadow:var(--sh);}

.tgt-co-card{border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;background:var(--surface2);}

.tgt-co-t{font-size:12px;font-weight:800;margin-bottom:4px;}

.tgt-chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.tgt-chip{display:flex;align-items:center;gap:9px;background:var(--surface);border:1.5px solid var(--border2);border-radius:var(--r);padding:8px 13px;cursor:pointer;font-family:var(--f);text-align:left;transition:box-shadow .15s,border-color .15s;}

.tr-controls{display:flex;gap:22px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:11px 14px;margin-bottom:12px;box-shadow:var(--sh);}

.tr-slider-top{display:flex;align-items:center;gap:12px;margin-bottom:8px;}

.tr-range{flex:1;max-width:520px;accent-color:var(--green);height:4px;}

.tr-sentence{background:var(--green-bg);border:1px solid var(--green-light);border-radius:var(--r2);padding:13px 16px;font-size:13px;line-height:1.6;color:var(--text);margin-bottom:16px;}
.tr-rails{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
.tr-rail{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:14px 16px;box-shadow:var(--sh);}
.tr-rail-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
.tr-rail-t{font-size:12px;font-weight:800;letter-spacing:-.01em;}
.tr-rail-track{position:relative;height:20px;background:var(--surface2);border-radius:5px;margin:6px 0 10px;}
.tr-mk{position:absolute;transform:translateX(-50%);}
.tr-mk-base{top:0;width:2px;height:20px;background:var(--text3);opacity:.65;}

.tr-mk-cur{top:3px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--green);box-shadow:0 1px 3px rgba(0,0,0,.2);}
.tr-rail-stats{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--text2);font-family:var(--mono);}
.tr-rail-stats b{font-family:var(--f);}
.tr-rail-bound{font-size:10px;color:var(--text3);margin-top:5px;}
.tr-two{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
.tr-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:14px 16px;box-shadow:var(--sh);min-width:0;}
.tr-panel-h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);margin-bottom:10px;}
@media(max-width:1100px){.tr-rails,.tr-two{grid-template-columns:1fr;}}
/* ── bigChart (executive actual-vs-target line chart) ── */
.bc-title{font-size:15px;font-weight:800;color:var(--text);letter-spacing:-.01em;line-height:1.25;}
.bc-sub{font-size:11px;color:var(--text3);font-weight:600;margin-top:2px;margin-bottom:8px;letter-spacing:.01em;}
</style>

<script>
"use strict";
/* ============================================================================
   OPERATIONS PERFORMANCE INTELLIGENCE DASHBOARD
   Single-file, client-side. Layered architecture — business logic is kept out
   of the UI layer entirely:
     CONFIG → Utils → DataEngine → AggregationEngine → CalcEngine → UCEngine
            → FilterEngine → ChartEngine → Components → Pages → Exports → App
   All productivity & Unlocked-Capacity formulas replicate the supplied workbooks
   exactly (see Help & Glossary page for the documented formulas).
   ========================================================================== */

/* ====================== 1. CONFIG (all tunables) ========================== */
const CONFIG = {
  /* Mandatory source columns the engine needs (normalised names). */
  columns:{
    relevanceDate:'RELEVANCE_DATE', weekStart:'WEEK_START_DATE', monthStart:'MONTH_START_DATE',
    county:'COUNTY', productionArea:'PRODUCTION_AREA', workcentre:'WORKCENTRE', businessArea:'BUSINESS_AREA',
    businessUnit:'BUSINESS_UNIT', role:'ROLE', skill:'PRIMARY_SKILL', district:'DISTRICT',
    interval:'SUM_INTERVAL_DURATION', overtime:'SUM_OVERTIME_DURATION',
    leave:'SUM_LEAVE', absence:'SUM_ABSENCE', meeting:'SUM_MEETING', training:'SUM_TRAINING', lunch:'SUM_LUNCH_BREAK',
    tradeUnion:'SUM_TRADE_UNION_DUTIES', /* Network sheet only — part of Shrinkage. Absent (→0) on Process. */
    sleep:'SUM_SLEEP_TIME', admin:'SUM_ADMINISTRATION', travel:'SUM_TRAVEL', whitespace:'SUM_WHITESPACE', van:'SUM_VAN_TASK', other:'SUM_OTHER',
    planned:'SUM_PLANNED_TIME', finished:'COUNT_OF_FINISHED_OPERATIONS', shiftHours:'AVG._DAILY_SHIFT_HOURS_PER_ROLE',
    /* OPTIONAL reconciliation columns (Excel's own pre-computed totals, cols AW–BF). Not used in any
       calculation — the glossary formulas still drive everything — only compared to Claude's numbers. */
    xlTotDur:'TOTAL_DURATION', xlShrink:'Shrinkage', xlNonProd:'Non-Productive_Available Time',
    xlEffCap:'Effective Capacity', xlWork:'Total Working Time'
  },
  /* Hour fields that make up Shrinkage / Non-Productive (drives breakdown charts). */
  shrinkageParts:[['leave','Leave'],['absence','Absence'],['meeting','Meetings'],['training','Training'],['lunch','Lunch Break'],['tradeUnion','Trade Union']],
  nonProdParts:[['admin','Administration'],['travel','Travel'],['sleep','Sleep Time'],['van','Van Tasks'],['whitespace','White Space'],['other','Other']],
  /* The dimensions exposed as global filters (label → derived-row field). */
  filterDims:[
    ['county','County'],['businessArea','Business Area'],['businessUnit','Business Unit'],
    ['productionArea','Production Area'],['role','Role'],['skill','Primary Skill']
  ],
  /* Comparison & baseline (initiative launched Dec-2025). */
  baseline:{label:'Sep–Nov 25 Baseline', startISO:'2025-09-01', endISO:'2025-11-30'},
  /* Default baseline period in the top toolbar. 24 Nov 2025 lands in Nov-25 (month), Q3 FY26 (quarter),
     w/c 24 Nov 25 (week) & FY26 (year) — used for weekly/yearly & as a fallback. */
  baselineDefaultISO:'2025-11-24',
  /* Toolbar Measurement & Baseline defaults per granularity (anchor date → the bucket it lands in).
     Monthly: measure Jun-26, baseline Apr-25. Quarterly: measure Q1 FY27 (Apr–Jun 26), baseline Q1 FY26 (Apr–Jun 25). */
  ovDefaults:{
    monthly:  {measure:'2026-06-01', baseline:'2025-04-01'},
    rolling3: {measure:'2026-06-01', baseline:'2025-04-01'},
    quarterly:{measure:'2026-04-15', baseline:'2025-04-15'}
  },
  /* Default since-launch baseline window for Operational Overview tables 2 & 3 (measurement = day after
     the end, up to today). Independent of the toolbar. */
  ovBaselineDefault:{start:'2025-04-01', end:'2026-03-31'},
  /* Upper-bound cutoff for the daily extract — null = use today's date dynamically so all actuals in
     the uploaded extract are included and only genuinely future-scheduled rows (beyond today) are dropped.
     Set to an ISO string (e.g. '2026-07-31') to enforce a hard cap instead. */
  maxDateISO:null,
  anomaly:{deltaPct:15, eworSaneMax:2}, // flag when EWOR / Working Time % / Shrinkage % move >15pp period-over-period; ignore EWOR baselines above 200% (data artefacts)
  /* Operational Overview role groups. 6 groups shown as 3 cards/row × 2 rows, in this order.
     Budget FTE & cost/hr come from the value tool rate card (uc.roles) so the £ reconciles with the
     Unlocked Capacity page — Budget FTE stays editable on the page. 'Other' = the 5 daily-extract
     roles listed below. `target` = FY27 productivity-uplift target (editable on the page). */
  targetFY:'FY27',
  hoursPerFteYear:1576,                   // convenience mirror of uc.hoursPerFteYear (target ↔ £ maths)
  /* Operational Overview role groups. 6 groups shown as 3 cards/row × 2 rows, in this order.
     TARGET-DRIVEN by the FY27 PRODUCTIVITY UPLIFT % (the editable driver, from the value-tool plan).

/* ====================== 1b. PROGRAMME TARGETS (uploadable) ================
   Targets can be driven off an uploaded value-tool "Productivity %" export
   (sheet 'Productivity %': Big Bet · Role · Initiative · Benefit type + 60
   month columns, each cell a productivity-% contribution as a fraction). When
   a file is loaded it OVERRIDES the built-in programme plan; otherwise the
   built-in TARGET_DETAIL is the fallback source (same shape).

   KEY MODEL RULE (per the programme): only "Higher efficiency" productivity
   shows up in EWOR / Working Time. "Lower volumes" and "Structural efficiency"
   are real benefit but reduce demand / restructure headcount — they do NOT
   lift per-hour output, so they are tracked as SEPARATE streams and are never
   folded into the EWOR/Working-Time target overlay.
   ========================================================================= */
const ProgTgt = (function(){
  const LS_KEY='fteDashTargets_v1';
  const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let store=null;   // uploaded store, or null → use the baked fallback
  let _baked=null;  // cached baked store built from TARGET_DETAIL

  // Benefit type → stream key. Order matters: 'Structural efficiency' must not
  // fall through to 'he' via the 'efficien' test, and 'Lower volumes' is caught first.
  function classify(bt){
    const s=String(bt||'').toLowerCase();
    if(s.indexOf('lower')>=0 || s.indexOf('volume')>=0) return 'lv';
    if(s.indexOf('structural')>=0) return 'se';
    if(s.indexOf('higher')>=0 || s.indexOf('efficien')>=0 || s.indexOf('productivity')>=0) return 'he';
    return null; // Overtime / Non-cashable / anything else → not a productivity-uplift stream
  }
  // Month label → canonical 'Mmm-YY' (dashboard format). Handles 'Apr 25', 'Apr-25', 'Apr-2025'.
  function normMonth(lbl){
    const s=String(lbl==null?'':lbl).trim();
    const m=s.match(/^([A-Za-z]{3})[ \-]?(\d{2,4})$/);
    if(!m) return s.replace(/\s+/g,'-');
    return m[1].charAt(0).toUpperCase()+m[1].slice(1,3).toLowerCase()+'-'+m[2].slice(-2);
  }
  function monthOrd(ml){ const m=String(ml).match(/^([A-Za-z]{3})-(\d{2})$/); if(!m) return 0; return (2000+ +m[2])*12 + MN.indexOf(m[1].slice(0,1).toUpperCase()+m[1].slice(1,3).toLowerCase()); }
  function fyOf(ml){ const m=String(ml).match(/^([A-Za-z]{3})-(\d{2})$/); if(!m) return null; const mi=MN.indexOf(m[1].slice(0,1).toUpperCase()+m[1].slice(1,3).toLowerCase()); const yy=2000+ +m[2]; return 'FY'+String((mi>=3?yy+1:yy)).slice(-2); }
  function normMObj(m){ const o={}; if(m) Object.keys(m).forEach(k=>{ const v=+m[k]; if(v) o[normMonth(k)]=(o[normMonth(k)]||0)+v; }); return o; }

  // Unified builder from initiative-level detail rows {bigBet/b, role/r, ini/n, btype/t, m:{month:frac}}.
  function buildStore(rows, meta){
    const byRole={}, monthsSet=new Set(), detail=[];
    rows.forEach(d=>{
      const btype=d.btype!=null?d.btype:d.t; const tKey=classify(btype); if(!tKey) return;
      const role=(d.role!=null?d.role:d.r)||''; if(!role) return;
      const bigBet=(d.bigBet!=null?d.bigBet:d.b)||''; const ini=(d.ini!=null?d.ini:d.n)||'';
      const m=normMObj(d.m);
      const rb=byRole[role]||(byRole[role]={he:{},lv:{},se:{},total:{}});
      Object.keys(m).forEach(ml=>{ const f=m[ml]; if(!f) return; rb[tKey][ml]=(rb[tKey][ml]||0)+f; rb.total[ml]=(rb.total[ml]||0)+f; monthsSet.add(ml); });
      detail.push({bigBet,role,ini,btype:String(btype||''),tKey,m});
    });
    const months=[...monthsSet].sort((a,b)=>monthOrd(a)-monthOrd(b));
    return Object.assign({roles:Object.keys(byRole).sort(),byRole,detail,months}, meta||{});
  }

  // Parse a value-tool 'Productivity %' workbook (ArrayBuffer) into detail rows, then a store.
  function parseWorkbook(buf, filename){
    const wb=XLSX.read(new Uint8Array(buf),{type:'array'});
    const sn=wb.SheetNames.find(n=>/productivity\s*%/i.test(n))||wb.SheetNames[0];
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:null});
    if(!aoa.length) throw new Error('The sheet is empty.');
    const header=aoa[0].map(x=>x==null?'':String(x).trim());
    const find=(re)=>header.findIndex(h=>re.test(h));
    const ci={bigBet:find(/^big ?bet$/i), role:find(/^role$/i), ini:find(/^initiative$/i), bt:find(/^benefit ?type$/i)};
    if(ci.role<0||ci.bt<0) throw new Error('This is not a "Productivity %" export — the Role and/or Benefit type columns are missing. Use the value tool → Productivity tab → "↓ Excel".');
    const labelCols=new Set([ci.bigBet,ci.role,ci.ini,ci.bt].filter(x=>x>=0));
    const monCols=[], monLbls=[];
    for(let c=0;c<header.length;c++){ if(labelCols.has(c)) continue; const ml=normMonth(header[c]); if(/^[A-Za-z]{3}-\d{2}$/.test(ml)){ monCols.push(c); monLbls.push(ml); } }
    if(!monCols.length) throw new Error('No month columns (e.g. "Apr 25") were found on the sheet.');
    const rows=[];
    for(let r=1;r<aoa.length;r++){ const row=aoa[r]; if(!row) continue;
      const role=String(row[ci.role]==null?'':row[ci.role]).trim(); if(!role) continue;
      const m={}; monCols.forEach((c,i)=>{ const v=row[c]; if(typeof v==='number'&&isFinite(v)&&v) m[monLbls[i]]=v; });
      rows.push({bigBet:ci.bigBet>=0?String(row[ci.bigBet]||'').trim():'', role, ini:ci.ini>=0?String(row[ci.ini]||'').trim():'', btype:String(row[ci.bt]||'').trim(), m});
    }
    if(!rows.length) throw new Error('No data rows found under the header.');
    return buildStore(rows, {filename:filename||'', importedAt:Date.now(), nInitiativeRows:rows.length});
  }

  function baked(){ if(!_baked) _baked=buildStore(typeof TARGET_DETAIL!=='undefined'?TARGET_DETAIL:[], {baked:true}); return _baked; }
  function active(){ return store||baked(); }
  function isLoaded(){ return !!store; }
  function pctMap(roleKey, stream){ const rb=active().byRole[roleKey]; return (rb&&rb[stream])||{}; }   // {ml:frac}
  function pct(roleKey, stream, ml){ return pctMap(roleKey,stream)[ml]||0; }

  function persist(){ try{ if(store) localStorage.setItem(LS_KEY, JSON.stringify({filename:store.filename,importedAt:store.importedAt,detail:store.detail.map(d=>({bigBet:d.bigBet,role:d.role,ini:d.ini,btype:d.btype,m:d.m}))})); else localStorage.removeItem(LS_KEY); }catch(e){} }
  function restore(){ try{ const raw=localStorage.getItem(LS_KEY); if(!raw) return false; const o=JSON.parse(raw); if(!o||!o.detail) return false; store=buildStore(o.detail,{filename:o.filename||'',importedAt:o.importedAt||Date.now(),nInitiativeRows:o.detail.length}); return true; }catch(e){ return false; } }

  return {
    classify, normMonth, monthOrd, fyOf,
    loadFromBuffer(buf, filename){ store=parseWorkbook(buf, filename); persist(); return store; },
    clear(){ store=null; persist(); },
    isLoaded, active, baked, pctMap, pct,
    info(){ const s=active(); return {loaded:!!store, filename:store?store.filename:'', importedAt:store?store.importedAt:null, roles:s.roles.length, initiatives:s.detail.length, months:s.months.length}; },
    restore
  };
})();

// Map a dashboard role-group label → the plan/target role name used in ProgTgt.
// Handles the known naming gaps between the daily extract and the value plan.
function tgtRoleKey(label){
  const l=String(label||'');
  if(/^field service engineer$/i.test(l)) return 'FSE';
  if(/leakage.*(day|night)/i.test(l)) return 'Network Leakage Technician';
  return l;
}
// Capacity-created conversion factor. A headline productivity uplift of p means output-per-hour rises
// 1:1 with p (a role of 100 gains the output-capacity of 100·(1+p)). So a metric delivering share s of
// the target scales up by (1 + s·p); single-lever = baseline × (1+p). Hence g = p (kept as one switch-point).
function _upliftG(p){ p=+p||0; return p; }

/* ====================== 2. UTILS ========================================== */
const U = {
  EXCEL_EPOCH: Date.UTC(1899,11,30),
  /* Parse a cell that may be an Excel serial, a Date, or a date string → epoch ms (UTC) or null. */
  toDate(v){
    if(v==null||v==='') return null;
    if(v instanceof Date) return Date.UTC(v.getUTCFullYear(),v.getUTCMonth(),v.getUTCDate());
    if(typeof v==='number' && isFinite(v)){
      if(v>20000 && v<80000) return U.EXCEL_EPOCH + Math.round(v)*86400000; // serial
      return null;
    }
    const s=String(v).trim();
    // Pure-numeric string (4–6 digits) = Excel serial. Handle FIRST — avoids the very slow
    // legacy Date.parse fallback that made large CSV imports take tens of seconds.
    if(s.length>=4 && s.length<=6 && /^\d+$/.test(s)){ const num=+s; return (num>20000&&num<80000)? U.EXCEL_EPOCH+num*86400000 : null; }
    // dd/mm/yyyy or dd-mm-yyyy (fast, explicit)
    let m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
    if(m){let d=+m[1],mo=+m[2],y=+m[3]; if(y<100)y+=2000; return Date.UTC(y,mo-1,d);}
    // ISO yyyy-mm-dd (fast native parse path)
    m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(m){ return Date.UTC(+m[1],+m[2]-1,+m[3]); }
    const t=Date.parse(s); if(!isNaN(t)){const d=new Date(t);return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());}
    return null;
  },
  num(v){ if(v==null||v==='')return 0; const n=+v; if(n===n)return n; /* fast path: numbers & clean numeric strings */ const m=parseFloat(String(v).replace(/[, ]/g,'')); return m===m?m:0; },
  txt(v){ return (v==null||String(v).trim()==='')?'':String(v).trim(); },
  // Week (Monday-start) and month buckets derived from a date — used so all grouping keys off RELEVANCE_DATE.
  weekStart(ms){ const d=new Date(ms); const dow=(d.getUTCDay()+6)%7; return ms-dow*86400000; },
  monthStart(ms){ const d=new Date(ms); return Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1); },
  fy(ms){ const d=new Date(ms); const y=d.getUTCFullYear(),mo=d.getUTCMonth(); return mo>=3? y+1 : y; }, // fiscal year ENDING year (Apr→Mar): Apr-2026 → FY27
  fyLabel(ms){ return 'FY'+String(U.fy(ms)).slice(2); },
  monthKey(ms){ const d=new Date(ms); return d.getUTCFullYear()*12+d.getUTCMonth(); },
  monthLabel(ms){ const d=new Date(ms); return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getUTCMonth()]+'-'+String(d.getUTCFullYear()).slice(2); },
  // FISCAL quarters: Apr–Jun = Q1, Jul–Sep = Q2, Oct–Dec = Q3, Jan–Mar = Q4. Keyed by fiscal-year-end.
  quarterKey(ms){ const d=new Date(ms),mo=d.getUTCMonth(); const fy=mo>=3?d.getUTCFullYear()+1:d.getUTCFullYear(); const fq=Math.floor(((mo+9)%12)/3); return fy*4+fq; },
  quarterLabelFromKey(k){ const fy=Math.floor(k/4), q=k%4+1; return 'Q'+q+' FY'+String(fy).slice(2); },
  quarterLabel(ms){ return U.quarterLabelFromKey(U.quarterKey(ms)); },
  dayLabel(ms){ const d=new Date(ms); return String(d.getUTCDate()).padStart(2,'0')+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getUTCMonth()]; },
  isoLabel(ms){ const d=new Date(ms); return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); },
  div(a,b){ return b? a/b : 0; },
  /* Formatting */
  fmt(n,dp=0){ if(n==null||!isFinite(n))return '—'; return n.toLocaleString('en-GB',{minimumFractionDigits:dp,maximumFractionDigits:dp}); },
  fmtH(n){ return U.fmt(n,0); },
  pct(n,dp=1){ if(n==null||!isFinite(n))return '—'; return (n*100).toLocaleString('en-GB',{minimumFractionDigits:dp,maximumFractionDigits:dp})+'%'; },
  ppt(n,dp=1){ if(n==null||!isFinite(n))return '—'; return (n*100>=0?'+':'')+(n*100).toFixed(dp)+'pp'; },
  money(n){ if(n==null||!isFinite(n))return '—'; const a=Math.abs(n); if(a>=1e6)return '£'+(n/1e6).toFixed(2)+'M'; if(a>=1e3)return '£'+(n/1e3).toFixed(0)+'k'; return '£'+U.fmt(n,0); },
  moneyFull(n){ if(n==null||!isFinite(n))return '—'; return '£'+U.fmt(Math.round(n),0); },
  debounce(fn,ms){ let t; return function(...a){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,a),ms); }; },
  esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
};

/* ====================== 3. DATA ENGINE ====================================
   Parse (CSV/XLSX) → validate → clean → build IMMUTABLE raw store + derived rows.
   The raw upload is frozen and never mutated; all calculation uses derived rows.
   ========================================================================= */
const DataEngine = (function(){
  const C = CONFIG.columns;
  // Mandatory columns; absence stops processing.
  const MANDATORY = ['relevanceDate','interval','overtime','leave','absence','meeting','training','lunch',
    'sleep','admin','travel','whitespace','van','other','planned'];

  // Normalise a header for tolerant matching (case/space/punctuation-insensitive).
  function norm(h){ return String(h||'').trim().toUpperCase().replace(/\s+/g,'_').replace(/[._%]+/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,''); }

  function parseCSV(text){
    if(text && text.charCodeAt(0)===0xFEFF) text=text.slice(1); // strip UTF-8 BOM
    const rows=[]; let i=0, field='', row=[], inQ=false; const n=text.length;
    while(i<n){
      const c=text[i];
      if(inQ){
        if(c==='"'){ if(text[i+1]==='"'){field+='"';i+=2;continue;} inQ=false;i++;continue; }
        field+=c;i++;continue;
      }
      if(c==='"'){inQ=true;i++;continue;}
      if(c===','){row.push(field);field='';i++;continue;}
      if(c==='\r'){i++;continue;}
      if(c==='\n'){row.push(field);rows.push(row);row=[];field='';i++;continue;}
      field+=c;i++;
    }
    if(field!==''||row.length){row.push(field);rows.push(row);}
    return rows.filter(r=>r.length>1 || (r.length===1&&r[0]!==''));
  }

  // Recognisable column names used to locate the header row (handles preamble rows).
  const KNOWN=new Set(['RELEVANCE_DATE','WEEK_START_DATE','MONTH_START_DATE','SUM_INTERVAL_DURATION',
    'SUM_OVERTIME_DURATION','SUM_PLANNED_TIME','TOTAL_DURATION','COUNTY','ROLE','BUSINESS_AREA',
    'BUSINESS_UNIT','PRODUCTION_AREA','SUM_LEAVE','SUM_LUNCH_BREAK']);
  // Find the row that looks most like the header (most recognised column names) within the first 20 rows.
  function findHeaderRow(matrix){
    let best=0,bestScore=-1, lim=Math.min(matrix.length,20);
    for(let i=0;i<lim;i++){ let sc=0; const row=matrix[i]||[]; for(const c of row){ if(KNOWN.has(norm(c)))sc++; } if(sc>bestScore){bestScore=sc;best=i;} }
    return {row:best,score:bestScore};
  }
  // Column index for every configured field, against the normalised header row (−1 if absent).
  function colIndex(headers){ const idx={}; for(const k in C) idx[k]=headers.indexOf(norm(C[k])); return idx; }

  // Single fast pass: validate mandatory columns, then build derived rows by COLUMN INDEX
  // (far faster than per-row keyed objects — matters at 150k+ rows) and collect validation stats.
  // opts.roleMap (optional): { NORMALISED raw role → {display, scope:'named'|'other'|'excluded', area} }.
  //   When supplied, each row's ROLE is mapped to its display name (Other-scope → 'Other'),
  //   its Business Type is taken from the mapping's Tagged Area, and excluded / unmapped roles are dropped.
  // opts.defaultArea: business type to stamp when there is no role map (single-sheet legacy files).
  function processMatrix(matrix, opts){

    const sourceSheet=opts.sheetArea||defaultArea; // physical sheet origin (drives per-sheet date coverage)
    if(!matrix.length) return {report:{ok:false,missing:MANDATORY.map(k=>C[k]),detectedHeaders:[],headerRow:0,total:0},derived:[]};
    const hr=findHeaderRow(matrix).row;
    const headers=Array.from(matrix[hr]||[], norm);
    const idx=colIndex(headers);
    // Recon columns (Excel's own pre-computed totals) must bind to the EXACT header — e.g. "Shrinkage"
    // and "SHRINKAGE_%" both normalise to SHRINKAGE, so a normalised match would grab the % column.
    const rawHdr=Array.from(matrix[hr]||[], x=>String(x==null?'':x).trim().toUpperCase());
    ['xlTotDur','xlShrink','xlNonProd','xlEffCap','xlWork'].forEach(k=>{ const j=rawHdr.indexOf(String(C[k]).trim().toUpperCase()); if(j>=0) idx[k]=j; });
    const missing=MANDATORY.filter(k=>idx[k]<0).map(k=>C[k]);
    const report={missing,detectedHeaders:headers,headerRow:hr,ok:missing.length===0,
      issues:[],badDates:0,futureDates:0,cappedLate:0,negatives:0,logical:0,excluded:0,unmapped:0,total:matrix.length-hr-1};
    if(!report.ok) return {report,derived:[]};

    const today=Date.now()+86400000;
    const maxDate=CONFIG.maxDateISO?U.toDate(CONFIG.maxDateISO):null;   // hard upper bound — drop forward-dated rows
    const numAt=(arr,k)=>{ const i=idx[k]; if(i<0)return 0; const v=arr[i]; if(v==null||v==='')return 0; const n=+v; if(n===n)return n; const m=parseFloat(String(v).replace(/[, ]/g,'')); return m===m?m:0; };
    const txtAt=(arr,k)=>{ const i=idx[k]; if(i<0)return 'Unknown'; const v=arr[i]; return (v==null||String(v).trim()==='')?'Unknown':String(v).trim(); };
    const out=[];
    // Reconciliation accumulators — Claude (glossary formulas) vs Excel's pre-computed cols (AW–BF).
    const hasRecon = idx.xlShrink>=0||idx.xlEffCap>=0||idx.xlWork>=0||idx.xlNonProd>=0||idx.xlTotDur>=0;
    const rc={cCap:0,xCap:0,cShr:0,xShr:0,cNon:0,xNon:0,cEff:0,xEff:0,cWork:0,xWork:0};
    for(let r=hr+1;r<matrix.length;r++){
      const arr=matrix[r]; if(!arr||arr.length===0) continue;
      const rd=U.toDate(arr[idx.relevanceDate]);
      if(rd==null){ if(arr.some(c=>c!=null&&c!=='')){ report.badDates++; if(report.issues.length<200)report.issues.push({row:r+1,column:C.relevanceDate,issue:'Blank/invalid date — row skipped',fix:'Provide a valid date'}); } continue; }
      if(maxDate!=null && rd>maxDate){ report.cappedLate++; continue; }   // forward-dated beyond CONFIG.maxDateISO — dropped
      // Week & month buckets are derived FROM the relevance date (each day lands in its own
      // month/week), NOT from the WEEK_START/MONTH_START columns.
      // Role mapping (Tracked Roles sheet): resolve display name, scope & Business Type; drop excluded/unmapped.
      const rawRole=txtAt(arr,'role');
      let displayRole=rawRole, area=defaultArea, scope='named';
      if(roleMap){
        const m=roleMap[norm(rawRole)];
        if(!m){ report.unmapped++; continue; }
        if(m.scope==='excluded'){ report.excluded++; continue; }
        scope=m.scope; area=m.area||defaultArea;
        displayRole = m.scope==='other' ? 'Other' : (m.display||rawRole);
      }
      const ws=U.weekStart(rd), ms=U.monthStart(rd);
      const interval=numAt(arr,'interval'), overtime=numAt(arr,'overtime');
      const leave=numAt(arr,'leave'),absence=numAt(arr,'absence'),meeting=numAt(arr,'meeting'),training=numAt(arr,'training'),lunch=numAt(arr,'lunch'),tradeUnion=numAt(arr,'tradeUnion');
      const sleep=numAt(arr,'sleep'),admin=numAt(arr,'admin'),travel=numAt(arr,'travel'),whitespace=numAt(arr,'whitespace'),van=numAt(arr,'van'),other=numAt(arr,'other');
      const totalCap=interval+overtime, shrink=leave+absence+meeting+training+lunch+tradeUnion, effCap=totalCap-shrink;
      const nonProd=sleep+admin+travel+whitespace+van+other, workTime=effCap-nonProd, planned=numAt(arr,'planned');
      if(rd>today){ report.futureDates++; continue; }   // drop forward-scheduled rows beyond today
      if(totalCap<0||shrink<0){ report.negatives++; if(report.issues.length<200)report.issues.push({row:r+1,column:'hours',issue:'Negative hours',fix:'Hours must be ≥ 0'}); }
      else if(shrink>totalCap+0.001 && totalCap>0){ report.logical++; if(report.issues.length<200)report.issues.push({row:r+1,column:'Shrinkage',issue:'Shrinkage exceeds Total Capacity',fix:'Review source values'}); }
      if(hasRecon){
        rc.cCap+=totalCap; rc.xCap+=numAt(arr,'xlTotDur');
        rc.cShr+=shrink;   rc.xShr+=numAt(arr,'xlShrink');
        rc.cNon+=nonProd;  rc.xNon+=numAt(arr,'xlNonProd');
        rc.cEff+=effCap;   rc.xEff+=numAt(arr,'xlEffCap');
        rc.cWork+=workTime;rc.xWork+=numAt(arr,'xlWork');
      }
      // Process Data uses PRODUCTION_AREA; Network Data calls the same thing WORKCENTRE — fall back to it.
      let productionArea=txtAt(arr,'productionArea'); if(productionArea==='Unknown') productionArea=txtAt(arr,'workcentre');
      out.push({
        rd, ws, ms, mk:U.monthKey(ms), qk:U.quarterKey(ms), fy:U.fy(ms),
        county:txtAt(arr,'county'), businessArea:txtAt(arr,'businessArea'), businessUnit:txtAt(arr,'businessUnit'),
        productionArea, role:displayRole, rawRole, scope, businessType:area, sourceSheet,
        skill:txtAt(arr,'skill'), district:txtAt(arr,'district'),
        interval,overtime,leave,absence,meeting,training,lunch,tradeUnion,sleep,admin,travel,whitespace,van,other,
        totalCap,shrink,effCap,nonProd,workTime,planned, finished:numAt(arr,'finished')
      });
    }
    report.kept=out.length;
    if(hasRecon) report.recon=[
      ['Total Capacity', rc.cCap, idx.xlTotDur>=0?rc.xCap:null, 'Interval + Overtime'],
      ['Shrinkage', rc.cShr, idx.xlShrink>=0?rc.xShr:null, 'Leave + Absence + Meetings + Training + Lunch (+ Trade Union on Network)'],
      ['Non-Productive', rc.cNon, idx.xlNonProd>=0?rc.xNon:null, 'Admin + Travel + Sleep + Van + Whitespace + Other'],
      ['Effective Capacity', rc.cEff, idx.xlEffCap>=0?rc.xEff:null, 'Total Capacity − Shrinkage'],
      ['Total Working Time', rc.cWork, idx.xlWork>=0?rc.xWork:null, 'Effective Capacity − Non-Productive']
    ].filter(r=>r[2]!=null);
    return {report,derived:out};
  }
  function weekStartOf(ms){ const d=new Date(ms); const dow=(d.getUTCDay()+6)%7; return ms-dow*86400000; } // Monday
  function monthStartOf(ms){ const d=new Date(ms); return Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1); }

  // Normalise a scope label from the mapping sheet → 'named' | 'other' | 'excluded'.
  function normScope(s){ const t=norm(s); if(t.indexOf('EXCLUD')>=0||t.indexOf('NOT_INCLUD')>=0) return 'excluded'; if(t.indexOf('OTHER')>=0) return 'other'; return 'named'; }
  function normArea(s){ const t=norm(s); return t.indexOf('NETWORK')>=0?'Network':(t.indexOf('PROCESS')>=0?'Process':(U.txt(s)||'')); }

  // Normalise a header row to a DENSE string array (parsed rows are sparse; .map skips holes → undefined).
  function normRow(row){ return Array.from(row||[], norm); }
  // Does a sheet look like the Tracked-Roles mapping? (has a role key + scope + tagged-area/display columns).
  function isMappingSheet(matrix){
    for(let i=0;i<Math.min(matrix.length,8);i++){ const h=normRow(matrix[i]);
      const hasRole=h.some(x=>x.indexOf('ROLE_NAME')>=0||x==='RAW_ROLE'||x.indexOf('ROLE_NAME_IN_DAILY')>=0);
      const hasArea=h.some(x=>x.indexOf('TAGGED_AREA')>=0||x==='SCOPE');
      const hasDisplay=h.some(x=>x.indexOf('DISPLAY_NAME')>=0);
      if(hasRole&&(hasArea||hasDisplay)) return true;
    }
    return false;
  }
  // Parse the Tracked-Roles sheet → { NORMALISED raw role → {display, scope, area} } plus ordered lists
  // for the cards / "tracked roles" panel. Columns are matched by header name (order-independent).
  function parseRoleMap(matrix){
    let hr=-1;
    for(let i=0;i<Math.min(matrix.length,8);i++){ const h=normRow(matrix[i]);
      if(h.some(x=>x.indexOf('ROLE_NAME')>=0||x==='RAW_ROLE')){ hr=i; break; } }
    if(hr<0) return null;
    const h=normRow(matrix[hr]);
    const find=(...keys)=>{ for(const k of keys){ const i=h.findIndex(x=>x===k||x.indexOf(k)>=0); if(i>=0)return i; } return -1; };
    const iRole=find('ROLE_NAME_IN_DAILY_EXTRACT','ROLE_NAME','RAW_ROLE');
    const iScope=find('SCOPE');
    const iDisp=find('DISPLAY_NAME_FOR_HTML','DISPLAY_NAME');
    const iArea=find('TAGGED_AREA','BUSINESS_TYPE','AREA');
    // Named roles the business wants folded into the "Other" card (per requirement).
    const CLUB=new Set(['CATCHMENT_CONTROLLER']);
    const map={};
    for(let r=hr+1;r<matrix.length;r++){
      const row=matrix[r]||[]; const raw=U.txt(row[iRole]); if(!raw) continue;
      let scope=normScope(iScope>=0?row[iScope]:'named');
      const area=iArea>=0?normArea(row[iArea]):'';
      let display=scope==='other'?'Other':(iDisp>=0&&U.txt(row[iDisp])?U.txt(row[iDisp]):raw);
      if(scope!=='excluded' && (CLUB.has(norm(raw))||CLUB.has(norm(display)))){ scope='other'; display='Other'; } // club into Other
      map[norm(raw)]={display,scope,area,raw};
    }

    const tracked=[]; const seen=new Set();
    Object.keys(map).forEach(k=>{ const m=map[k]; if(m.scope==='excluded')return;
      const key=(m.scope==='other')?'Other|'+m.area:m.display+'|'+m.area;
      if(!seen.has(key)){ seen.add(key); tracked.push({display:m.display,scope:m.scope,area:m.area}); } });
    return {map, tracked};
  }
  // Parse the secondary "Role Mapping" sheet for NAMED roles flagged "Not Tracked" — roles the programme
  // attributes benefit to but cannot measure in the systems (shown as the "untracked" overview section).
  function parseUntracked(matrix){
    if(!matrix||!matrix.length) return [];
    let hr=-1;
    for(let i=0;i<Math.min(matrix.length,8);i++){ const h=normRow(matrix[i]);
      if(h.some(x=>x==='RAW_ROLE'||x.indexOf('ROLE')>=0) && h.some(x=>x.indexOf('TRACKED')>=0)){ hr=i; break; } }
    if(hr<0) return [];
    const h=normRow(matrix[hr]);
    const find=(...keys)=>{ for(const k of keys){ const i=h.findIndex(x=>x===k||x.indexOf(k)>=0); if(i>=0)return i; } return -1; };
    const iDisp=find('DISPLAY_NAME','REFINED_NAME','RAW_ROLE'), iScope=find('SCOPE'), iTr=find('TRACKED_NOT_TRACKED','TRACKED');
    if(iTr<0) return [];
    const out=[]; const seen=new Set();
    for(let r=hr+1;r<matrix.length;r++){ const row=matrix[r]||[]; const tr=norm(row[iTr]);
      if(tr!=='NOT_TRACKED') continue;
      const scope=normScope(iScope>=0?row[iScope]:'named'); if(scope==='excluded'||scope==='other') continue;
      const disp=U.txt(row[iDisp]); if(!disp||disp==='Other'||disp==='Not Included') continue;
      if(!seen.has(disp)){ seen.add(disp); out.push(disp); }
    }
    return out;
  }

  // Lean XLSX → matrix parser (ported from the reference tool). Reads ONLY the cells that
  // actually exist in the sheet XML, so it ignores Excel's inflated/phantom used-range that
  // makes XLSX.read + sheet_to_json materialise ~1,000,000 empty rows and hang. Uses the
  // native DecompressionStream — fast and dependency-free.
  async function parseXlsxMatrix(buf){
    const u8=new Uint8Array(buf), dv=new DataView(buf), zip={}; let i=0;
    while(i+30<=u8.length){
      if(dv.getUint32(i,true)!==0x04034b50){ i++; continue; }

      const name=new TextDecoder().decode(u8.slice(i+30,i+30+fnl));
      zip[name]={comp,data:u8.slice(i+30+fnl+exl, i+30+fnl+exl+csz)};
      i=i+30+fnl+exl+csz;
    }
    const decomp=async entry=>{
      if(!entry) return null;
      if(entry.comp===0) return new TextDecoder().decode(entry.data);
      const ds=new DecompressionStream('deflate-raw'), w=ds.writable.getWriter(), r=ds.readable.getReader();
      w.write(entry.data); w.close();
      const chunks=[]; for(;;){ const{done,value}=await r.read(); if(done)break; chunks.push(value); }
      const out=new Uint8Array(chunks.reduce((s,c)=>s+c.length,0)); let o=0; for(const c of chunks){ out.set(c,o); o+=c.length; }
      return new TextDecoder().decode(out);
    };
