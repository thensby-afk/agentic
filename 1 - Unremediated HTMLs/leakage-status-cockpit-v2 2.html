      <div class="rawwrap"><table class="rawtbl"><thead>${_mHead}</thead><tbody>${_mBody}</tbody></table></div>`;
    rawHtml=`<div class="hint">${rows.length} source row${rows.length===1?'':'s'} &times; ${cols.length} source columns for case <b>${esc(x.caseKey)}</b>, then <b>${derCols.length} derived columns</b> at the right (&#9881; gear &mdash; blue header = per appointment, teal = per case). Values are the raw extract, exactly as supplied; rows are ordered by service-appointment date (earliest first).${_dupNote}</div>

    +rawHtml

}

/* "Median case" - a quick way to show what a NORMAL resolved case looks like, not just the problem ones.
   Pool = closed cases that had a repair (an external / contractor line, per the Closed-tab repair split);
   list = the ones sitting around the median time to resolution (rt), nearest the middle first.
   Reuses the shared #defModal / #defBox overlay; a row click closes it and opens that case's journey drawer. */
function openMedianCase(){
  const modal=document.getElementById('defModal'), box=document.getElementById('defBox');
  const pool=resolvedLeaks().filter(l=>isRepaired(l) && typeof l.rt==='number' && l.rt>0);
  const closeIt=()=>{modal.classList.remove('show');box.classList.remove('cfgwide');};
  if(!pool.length){
    box.classList.remove('cfgwide');
    box.innerHTML=`<button class="close" id="defClose">Close</button><h2>What a typical resolved case looks like</h2>`+
      `<p style="color:var(--muted);font-size:13px;margin-top:8px;line-height:1.5">No closed cases with a repair in the loaded extract, so there is no typical case to show yet. Load an extract that contains closed cases (or the Demo data), then try again.</p>`;
    document.getElementById('defClose').onclick=closeIt; modal.classList.add('show'); return;
  }
  const med=median(pool.map(l=>l.rt));
  const w=Math.max(3,Math.round(med*0.15));                    /* "around the median" band: +/-15%, at least +/-3 days */
  let band=pool.filter(l=>Math.abs(l.rt-med)<=w);
  if(band.length<8) band=[...pool].sort((a,b)=>Math.abs(a.rt-med)-Math.abs(b.rt-med)).slice(0,Math.min(15,pool.length)); /* fallback if the band is thin */
  band=band.sort((a,b)=>Math.abs(a.rt-med)-Math.abs(b.rt-med));
  const shown=band.slice(0,25);
  const rows=shown.map(x=>`<tr data-jid="${x.id}" style="cursor:pointer">
      <td><b>${esc(x.ref)}</b></td>
      <td class="num tnum" style="font-weight:700">${x.rt} d</td>
      <td>${countyLabel(x.county)}</td>
      <td>${x.closedTs?fmtD(new Date(x.closedTs)):'<span class="na">-</span>'}</td>
      <td class="num">${visitsCell(x)}</td>
      <td style="font-size:12px;color:var(--muted)">${closedReason(x)}</td>
    </tr>`).join('');
  box.classList.add('cfgwide');
  box.innerHTML=`<button class="close" id="defClose">Close</button>
    <h2>What a typical resolved case looks like</h2>
    <p style="color:var(--muted);font-size:12.5px;margin-top:8px;line-height:1.55">
      Closed cases that had a <b>repair</b> (a contractor / external visit, not a UU-only look) and sit <b>around the median time to resolution</b> &mdash; a quick way to show a normal case, not just the problem ones.
      Median time to resolution across the ${fmtN(pool.length)} repaired closed cases is <b>${med} days</b>; this shows the ${shown.length} nearest that mark (within about ${w} days), closest to the middle first.
      Click any row to open its full journey.</p>
    <div class="tbl-wrap" style="margin-top:12px;max-height:56vh"><table class="compact">
      <thead><tr><th>Case</th><th class="num" title="Days from reported to closed">Time to resolve</th><th>County</th><th>Closed</th><th class="num" title="Service appointments / visits on the case">Visits</th><th>How it closed</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  document.getElementById('defClose').onclick=closeIt;
  box.querySelectorAll('tbody tr').forEach(r=>r.onclick=()=>{ closeIt(); openDrawer(+r.dataset.jid); });
  modal.classList.add('show');
}

const EXDIMS={
  wo:{label:'Work order / SA',val:l=>l.hasWO?'Has WO or SA':'No WO or SA'},
  work:{label:'Work completed',val:l=>l.workDone?'Completed (work done)':'Not completed'},

};
function isoDate(d){const p=n=>(n<10?'0':'')+n;return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
/* any column whose sampled values look like dates (DD/MM/YYYY or ISO) */
function exDateCols(){return DATA_HEADERS.filter(c=>{const dd=DATA_DISTINCT[c];if(!dd||!dd.values.length)return false;let hit=0,tot=0;for(const v of dd.values){if(v==='')continue;tot++;if(/^\d{1,2}\/\d{1,2}\/\d{4}/.test(v)||/^\d{4}-\d{2}-\d{2}/.test(v))hit++;}return tot>0&&hit/tot>=0.6;});}
/* true min/max date in a column across the loaded cohort */
function exDateSpan(col){let lo=Infinity,hi=-Infinity;for(const x of LEAKS){const d=x.raw?pdate(x.raw[col]):null;if(d){const t=d.getTime();if(t<lo)lo=t;if(t>hi)hi=t;}}return lo<=hi?{lo:new Date(lo),hi:new Date(hi)}:null;}
function exFiltered(){ const s=state.ex; let l=LEAKS.slice();   /* FULL loaded cohort - deliberately ignores the header toggles */
  /* quick views = the global-rule sets behind the header toggles */
  if(s.quick==='nowo')l=l.filter(x=>!x.hasWO);
  else if(s.quick==='completed')l=l.filter(x=>x.workDone);
  else if(s.quick==='cancelled')l=l.filter(x=>x.allCancelled);
  else if(s.quick==='nosa')l=l.filter(x=>!x.hasSA);
  else if(s.quick==='dormant')l=l.filter(x=>isDormant(x));
  if(s.fwo!=='all')l=l.filter(x=>x.hasWO===(s.fwo==='yes'));
  if(s.fwork!=='all')l=l.filter(x=>x.workDone===(s.fwork==='yes'));
  if(s.fowner!=='all')l=l.filter(x=>x.owner===s.fowner);
  if(s.fstage!=='all')l=l.filter(x=>x.stage===s.fstage);
  if(s.fcounty!=='all')l=l.filter(x=>(x.county||'__unclear__')===s.fcounty);
  if(s.fage==='overdue')l=l.filter(x=>effAge(x)>T_OVERDUE); else if(s.fage==='within')l=l.filter(x=>effAge(x)<=T_OVERDUE);
  (s.custom||[]).forEach(f=>{ if(f&&f.col&&f.val!==''&&f.val!=null)l=l.filter(x=>x.raw&&x.raw[f.col]===f.val); });   /* user-added filters on any column */
  const dr=s.date;   /* date-range filter on any date column */
  if(dr&&dr.col&&(dr.from||dr.to)){ const f=dr.from?new Date(dr.from+'T00:00:00').getTime():-Infinity, t=dr.to?new Date(dr.to+'T23:59:59').getTime():Infinity;
    l=l.filter(x=>{const d=x.raw?pdate(x.raw[dr.col]):null;return d&&d.getTime()>=f&&d.getTime()<=t;}); }
  return l;
}

/* ================= VERIFY (p9) - audit of the cockpit's OWN closure decisions =================
   View only. Every case in sections 1-3 is still OPEN in the source extract and has been reclassified
   as closed by a cockpit rule - each one is a judgement the tool made on the client's behalf. Nothing on
   this tab changes data, filters or any other view; it exists so those judgements can be spot-checked
   against reality. Sections run in DESCENDING order of how likely a closure is to be wrong. */
const VF_WINDOWS=[[30,'Last 30 days','the last 30 days'],[90,'Last 90 days','the last 90 days'],[183,'Last 6 months','the last 6 months'],[0,'All time','the whole book']];
const VF_STEP=25;   /* "show next N" - the completed / cancelled rules run to thousands on the real extract */

/* which rule actually closed a case, following isClosedNow's OWN precedence, so every closed case lands in
   exactly one bucket and the section counts reconcile with the Closed tab. */
function verifyRule(l){
  if(l.resolved)return 'extract';
  if(state.completedClosed&&l.workDone&&!(state.ccKeepsOpen&&l.lastVisitCCRecent))return 'completed';
  if(state.cancelledClosed&&l.allCancelled)return 'cancelled';
  if(state.abandonedClosed&&l.abandoned)return 'abandoned';
  if(isStalled(l))return 'stalled';
  return null;
}
function lastAttendedVisit(l){ let b=null; (l.visitLog||[]).forEach(v=>{ if(v.occurred&&v.actTs!=null&&(b==null||v.actTs>b.actTs))b=v; }); return b; }
/* the date the closure DECISION took effect. Completed / cancelled / extract closures are dated at the close
   date itself. The two threshold rules are different: a case only BECOMES closed once it crosses the cutoff,
   and closedTs deliberately dates them at their last real activity (truthful for the timing metrics) - which
   is by definition already past the cutoff, so a recent window would show none of them at all. Dating them at
   the crossing puts the freshly-gone-cold cases, the ones actually worth checking, at the top. */
function verifyDateTs(l,rule){
  if(rule==='held'){ const b=lastAttendedVisit(l); return b?b.actTs:(l.lastActivityTs!=null?l.lastActivityTs:null); }   /* not a closure - dated at the Cannot Complete that is holding it open */
  if(rule==='abandoned'){ const b=lastAttendedVisit(l), d=(CONFIG.abandonedDays||90)*MS; return b?b.actTs+d:(l.closedTs!=null?l.closedTs+d:null); }
  if(rule==='stalled'){ const sd=staleDays()*MS; const base=(l.sinceDormancy!=null)?(AS_OF.getTime()-l.sinceDormancy*MS):l.closedTs; return base!=null?base+sd:null; }
  return l.closedTs!=null?l.closedTs:null;
}
/* the extract still shows a working status - we have closed it, the source system has not. Needs real rows
   (the demo carries no CASE_STATUS on open cases), so it simply does not fire on demo data. */
function srcStatusActive(l){ const st=l.raw?String(l.raw[CONFIG.columns.status]||'').trim():''; return !!st&&!/closed|customer resolved|work completed|complete|resolved|cancel/i.test(st); }

/* the reasons a closure might be wrong. Label is what shows on the row; the tooltip says why it matters. */
const VF_FLAG={
  recent:{l:'Closed in the last 14 days',t:'The rule fired very recently. If the next job simply has not been raised yet, this case is closed too early - the most likely false closure of all.'},
  further:{l:'Further work noted',t:'The last visit that happened closed "Further Work Required". The tool deliberately still trusts the completion (a completed case may or may not recur), so this is the one to eyeball.'},
  norepair:{l:'No repair completed',t:'Work completed but no repair work type ever completed on this case - it closed without a mend.'},
  oldcc:{l:'Old failed visit ignored',t:'The last visit that happened was a Cannot Complete more than '+CC_LAG+' days ago, so the recency gate let the case close. Check nobody is still waiting on a re-attend.'},
  discounted:{l:'Appointment discounted',t:'A pending appointment was set aside as a duplicate (superseded) or as a record left in progress and never closed off. That judgement is what allowed the case to close.'},
  novisit:{l:'Nobody ever attended',t:'Every appointment was cancelled and no visit ever took place - the reported leak was never seen.'},
  pending:{l:'Appointment still outstanding',t:'The case carries a live appointment that is neither cancelled nor discounted, yet it went quiet past the cutoff. Either the appointment is stale or the case is not really cold.'},
  admin:{l:'Record touched since',t:'The case record was updated more recently than the last real field activity. The dormancy clock ignores admin touches on purpose - check the touch was not a genuine restart.'},
  srcopen:{l:'Source status still active',t:'The extract still shows a working CASE_STATUS (not Closed / Work Completed / Customer Resolved). We have closed it; the source system has not. Needs real data - this never fires on demo.'},
  escal:{l:'Escalated case',t:'An escalation is recorded against this case, so a wrong closure carries more weight.'}
};
function verifyFlags(l,rule){
  const f=[], vl=l.visitLog||[], vt=verifyDateTs(l,rule), since=vt!=null?dsignTs(vt):null;
  if((rule==='completed'||rule==='cancelled')&&since!=null&&since<=T_OVERDUE)f.push('recent');
  if(l.lastVisitFurther)f.push('further');
  if(rule==='completed'&&!isRepaired(l))f.push('norepair');
  if(rule==='completed'&&l.lastVisitCC&&!l.lastVisitCCRecent)f.push('oldcc');
  if(rule==='completed'&&vl.some(v=>v.superseded||v.staleOpen))f.push('discounted');
  if(rule==='cancelled'&&!vl.some(v=>v.occurred))f.push('novisit');
  if((rule==='abandoned'||rule==='stalled')&&l.hasLiveOpen)f.push('pending');
  if((rule==='abandoned'||rule==='stalled')&&l.sinceActivity!=null&&l.sinceDormancy!=null&&l.sinceActivity<l.sinceDormancy)f.push('admin');
  if(srcStatusActive(l))f.push('srcopen');
  if(l.escal)f.push('escal');
  return f;
}

function renderVerify(){
  const el=document.getElementById('page-p9');
  const head=`<div class="pagehead">Verify</div><div class="pagehead-sub">Check the closures the cockpit made itself. View only &mdash; nothing on this tab changes the data, the filters or any other view.</div>`;
  if(!LEAKS.length){ el.innerHTML=head+'<div class="card pad" style="text-align:center;color:var(--muted);padding:40px 20px">Load an extract (or the demo book) and this tab will list every case the cockpit reclassified as closed.</div>'; return; }

  /* one pass: bucket every closed case by the rule that closed it */
  const closed=resolvedLeaks();
  const B={extract:[],completed:[],cancelled:[],abandoned:[],stalled:[]};
  closed.forEach(l=>{ const r=verifyRule(l); if(r&&B[r])B[r].push(l); });
  const V=state.vf;
  const win=V.win==null?90:V.win;
  const cutTs=win>0?AS_OF.getTime()-win*MS:null;
  const _w=VF_WINDOWS.find(w=>w[0]===win)||VF_WINDOWS[3];
  const winLbl=_w[2];                                  /* reads inside a sentence: "in the last 90 days" */
  const winOf=win>0?('in '+_w[2]):'across all time';   /* short form beside a count */

  /* per-case row object: the case, the rule that closed it, the decision date and its risk flags */
  const mk=(list,rule)=>list.map(l=>({l,rule,ts:verifyDateTs(l,rule),fl:verifyFlags(l,rule)}));
  const pool={ completed:mk(B.completed,'completed'), cancelled:mk(B.cancelled,'cancelled'),
               cold:mk(B.abandoned,'abandoned').concat(mk(B.stalled,'stalled')),
               held:mk(LEAKS.filter(l=>(!state.hideNonLeak||!isNonLeak(l))&&!l.resolved&&l.workDone&&state.ccKeepsOpen&&l.lastVisitCCRecent),'held') };
  Object.keys(pool).forEach(k=>pool[k].sort((a,b)=>(b.ts||0)-(a.ts||0)));   /* most recent decision first */
  const inWin=r=>cutTs==null||(r.ts!=null&&r.ts>=cutTs);

  const SEC=[
   {k:'completed',n:1,title:'Completed &rarr; closed',on:state.completedClosed,offName:'Completed &rarr; closed',
    rule:'At least one visit completed and nothing live is still booked, so the case is treated as finished even though the extract still calls it open.',
    risk:'A job that finished yesterday looks exactly like a job that finished for good. If the follow-up work simply has not been raised yet, the case is closed too early. The trailing Cannot-Complete gate ('+CC_LAG+' days) and discounted duplicate appointments are the other two judgements in this rule.',
    chips:['recent','further','norepair','oldcc','discounted','srcopen','escal']},
   {k:'cancelled',n:2,title:'Cancelled &rarr; closed',on:state.cancelledClosed,offName:'Cancelled &rarr; closed',
    rule:'Every appointment on the case is cancelled, so there is nothing left to do and the case is treated as closed.',
    risk:'A cancellation is often a reset, not an ending - work cancelled today may be rebooked tomorrow, and a recent one is indistinguishable from a case that was genuinely dropped. Where nobody ever attended, the reported leak was never seen.',
    chips:['recent','novisit','further','srcopen','escal']},
   {k:'cold',n:3,title:'Gone cold: abandoned or stalled',on:(state.abandonedClosed||state.stalledClosed),offName:'Abandoned &rarr; closed and Stalled &rarr; closed',
    rule:'<b>Abandoned</b>: nothing ever completed, the last visit that happened failed more than '+(CONFIG.abandonedDays||90)+' days ago and nothing is pending. <b>Stalled</b>: no real field activity for more than '+staleDays()+' days. Both are time-outs, not outcomes.',
    risk:'These are the safest of the three - on the source data, once a case has been quiet three months fewer than 1 in 1,000 ever moves again. The exposure is a slow-but-live case, or one whose clock is wrong: admin record touches are deliberately ignored, and a pending appointment left on the case can still be real.',
    chips:['pending','admin','further','srcopen','escal']}
  ];

  const flagCell=fl=>fl.length?fl.map(f=>`<span class="vf-f" title="${esc(VF_FLAG[f].t)}">${VF_FLAG[f].l}</span>`).join(''):'<span class="na">no flags</span>';
  const dcell=ts=>ts?`<span class="tnum">${fmtD(new Date(ts))}</span>`:'<span class="na">-</span>';
  const sincecell=ts=>{ if(ts==null)return '<span class="na">-</span>'; const d=dsignTs(ts); return `<span class="tnum"${d<=T_OVERDUE?' style="color:var(--age-60);font-weight:700"':''}>${d<=0?'today':d+' d'}</span>`; };
  const lvCell=l=>{ const b=lastAttendedVisit(l); if(!b)return '<span class="na">none</span>';
    return `<span class="mini tnum">${fmtD(new Date(b.actTs))}</span> &middot; ${esc(b.status||'-')}${b.closeStatus?`<div class="vf-sub">${esc(b.closeStatus)}</div>`:''}`; };
  const ynCell=v=>v?'Yes':'<span style="color:var(--muted-2)">No</span>';

  /* per-section table shapes: each rule has a different thing worth looking at */
  const COLS={
    completed:{h:['Case','County','Completed','Since','Last visit that happened','Visits','Repair','Why it might be wrong'],
      r:(o,i)=>`<td class="num mini">${i}</td><td><b>${esc(o.l.ref||o.l.caseKey||'')}</b></td><td>${countyLabel(o.l.county)}</td><td>${dcell(o.ts)}</td><td class="num">${sincecell(o.ts)}</td><td>${lvCell(o.l)}</td><td class="num tnum">${o.l.visits!=null?o.l.visits:'-'}</td><td>${ynCell(isRepaired(o.l))}</td><td>${flagCell(o.fl)}</td>`},
    cancelled:{h:['Case','County','Cancelled','Since','Appointments','Case age','Why it might be wrong'],
      r:(o,i)=>`<td class="num mini">${i}</td><td><b>${esc(o.l.ref||o.l.caseKey||'')}</b></td><td>${countyLabel(o.l.county)}</td><td>${dcell(o.ts)}</td><td class="num">${sincecell(o.ts)}</td><td class="num tnum">${(o.l.visitLog||[]).length}</td><td class="num tnum">${o.l.age!=null?o.l.age+' d':'-'}</td><td>${flagCell(o.fl)}</td>`},
    cold:{h:['Case','County','Rule','Went cold','Last real activity','Idle','Visits','Why it might be wrong'],
      r:(o,i)=>`<td class="num mini">${i}</td><td><b>${esc(o.l.ref||o.l.caseKey||'')}</b></td><td>${countyLabel(o.l.county)}</td><td><span class="vf-tag">${o.rule==='abandoned'?'Abandoned':'Stalled'}</span></td><td>${dcell(o.ts)}</td><td>${dcell(o.l.closedTs)}</td><td class="num tnum">${o.l.sinceDormancy!=null?o.l.sinceDormancy+' d':'-'}</td><td class="num tnum">${o.l.visits!=null?o.l.visits:'-'}</td><td>${flagCell(o.fl)}</td>`},
    held:{h:['Case','County','Failed visit','Since','Case age','Visits','Why it might be wrong'],
      r:(o,i)=>`<td class="num mini">${i}</td><td><b>${esc(o.l.ref||o.l.caseKey||'')}</b></td><td>${countyLabel(o.l.county)}</td><td>${lvCell(o.l)}</td><td class="num">${sincecell(o.ts)}</td><td class="num tnum">${o.l.age!=null?o.l.age+' d':'-'}</td><td class="num tnum">${o.l.visits!=null?o.l.visits:'-'}</td><td>${flagCell(o.fl)}</td>`}
  };

  function sectionHTML(s,rowsAll,shape,opposite){
    const rows=rowsAll.filter(inWin);
    const fsel=V.flag[s.k]||'';
    const counts={}; rows.forEach(o=>o.fl.forEach(f=>{counts[f]=(counts[f]||0)+1;}));
    const shown=rows.filter(o=>!fsel||o.fl.indexOf(fsel)>=0);
    const open=!!V.open[s.k];
    const lim=Math.min(shown.length,V.shown[s.k]||VF_STEP);
    const C=COLS[shape];
    const chips=s.chips.filter(f=>counts[f]).map(f=>`<button class="vf-chip${fsel===f?' on':''}" data-vfchip="${s.k}|${f}" title="${esc(VF_FLAG[f].t)}">${VF_FLAG[f].l} <b>${fmtN(counts[f])}</b></button>`).join('');
    const body=!open?'':(!shown.length
      ? `<div class="vf-empty">No cases${fsel?' carry that flag':''} in this window.</div>`
      : `<div class="tbl-wrap vf-wrap"><table class="compact"><thead><tr><th class="num">#</th>${C.h.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>
          ${shown.slice(0,lim).map((o,i)=>`<tr data-jid="${o.l.id}" title="Open the full case journey">${C.r(o,i+1)}</tr>`).join('')}
        </tbody></table></div>
        <div class="vf-more">Showing <b>${fmtN(lim)}</b> of <b>${fmtN(shown.length)}</b>${fsel?' flagged':''} case${shown.length===1?'':'s'}
          ${lim<shown.length?`<button class="vf-next" data-vfmore="${s.k}">Show next ${Math.min(VF_STEP,shown.length-lim)} &#8595;</button>`:''}
          ${lim>VF_STEP?`<button class="vf-next ghost" data-vffew="${s.k}">Back to ${VF_STEP} &#8593;</button>`:''}
        </div>`);
    return `<div class="card vf-sec${opposite?' vf-opp':''}${open?' open':''}">
      <div class="vf-top" data-vfsec="${s.k}" role="button" tabindex="0" aria-expanded="${open}">
        <span class="vf-caret">&#9656;</span>
        <span class="vf-n">${opposite?'&#8634;':s.n}</span>
        <div class="vf-t">
          <div class="vf-title">${s.title}<span class="vf-count">${fmtN(rows.length)}</span><span class="vf-of">${winOf}${rowsAll.length!==rows.length?` &middot; ${fmtN(rowsAll.length)} all time`:''}</span></div>
          <div class="vf-rule"><span class="vf-lbl">The rule</span>${s.rule}</div>
          <div class="vf-risk"><span class="vf-lbl">What could be wrong</span>${s.risk}</div>
        </div>
        <span class="vf-go">${open?'Hide':'Check these'}</span>
      </div>
      ${!s.on?`<div class="vf-off">This rule is currently switched off in Settings, so it is closing nothing &mdash; ${s.offName} is not firing.</div>`:''}
      ${chips?`<div class="vf-chips"><span class="vf-lbl">Filter</span>${chips}${fsel?`<button class="vf-chip clr" data-vfchip="${s.k}|">&times; clear</button>`:''}</div>`:''}
      ${body}</div>`;
  }

  const nW=k=>pool[k].filter(inWin).length;
  const tot=nW('completed')+nW('cancelled')+nW('cold');
  const fresh=pool.completed.concat(pool.cancelled).filter(o=>inWin(o)&&o.fl.indexOf('recent')>=0).length;
  const extractW=B.extract.filter(l=>cutTs==null||(l.closedTs!=null&&l.closedTs>=cutTs)).length;

  const intro=`<div class="card vf-intro">

    <div class="vf-win"><span class="vf-lbl">Decided in</span>${VF_WINDOWS.map(([d,l])=>`<button class="seg${win===d?' on':''}" data-vfwin="${d}">${l}</button>`).join('')}</div>
  </div>`;

  const refCard=`<div class="card vf-ref">

    <div class="vf-refb">The extract itself marked these closed (<code>D_CASE_OPEN_CLOSED = Closed</code>) &mdash; the case carries a real close date, or its status is Work Completed / Customer Resolved. The cockpit changed nothing, so there is no judgement of ours to check here. They are listed on the <b>Closed Cases</b> tab like any other closure.</div>
  </div>`;

  const footNote=`<div class="foot-note" style="margin-top:14px">This tab reads the same rules the rest of the cockpit runs on, so the counts move when you change a toggle in Settings &mdash; switch a rule off and its section empties. The flags are prompts to look, not errors: a flagged case may be perfectly correctly closed. Full rule definitions are in <b>closure-rules-verification.md</b>.</div>`;

  el.innerHTML=head+intro

        risk:'The error runs the other way here: if that failed visit is not going to be re-attended, the case is sitting in the open book inflating the backlog. Low stakes &mdash; it resolves itself once the visit ages past '+CC_LAG+' days.',
        chips:['further','discounted','escal']},pool.held,'held',true)
    +footNote;

  /* ---- wiring (all local to this tab) ---- */
  const rerun=()=>renderVerify();
  document.querySelectorAll('#page-p9 [data-vfwin]').forEach(b=>b.onclick=()=>{V.win=+b.dataset.vfwin;rerun();});
  document.querySelectorAll('#page-p9 [data-vfsec]').forEach(h=>{ const go=()=>{const k=h.dataset.vfsec;V.open[k]=!V.open[k];if(!V.open[k])V.shown[k]=VF_STEP;rerun();};
    h.onclick=go; h.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}}; });
  document.querySelectorAll('#page-p9 [data-vfchip]').forEach(b=>b.onclick=e=>{ e.stopPropagation();
    const [k,f]=b.dataset.vfchip.split('|'); V.flag[k]=(V.flag[k]===f||!f)?'':f; V.open[k]=true; V.shown[k]=VF_STEP; rerun(); });
  document.querySelectorAll('#page-p9 [data-vfmore]').forEach(b=>b.onclick=()=>{const k=b.dataset.vfmore;V.shown[k]=(V.shown[k]||VF_STEP)+VF_STEP;rerun();});
  document.querySelectorAll('#page-p9 [data-vffew]').forEach(b=>b.onclick=()=>{const k=b.dataset.vffew;V.shown[k]=VF_STEP;rerun();});
  document.querySelectorAll('#page-p9 .vf-wrap tbody').forEach(tb=>tb.onclick=e=>{const tr=e.target.closest('tr[data-jid]');if(tr&&tr.dataset.jid)openDrawer(+tr.dataset.jid);});
}

/* ---- helpers used by config persistence + the visual config manager ---- */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
/* spreadsheet-safe: a value beginning = + - @ (or TAB/CR) becomes a live formula when pasted
   into Excel, so prefix it with an apostrophe. Clipboard exports only - never display. */
function csvSafe(s){const t=String(s==null?'':s);const c=t.charCodeAt(0);return (c===61||c===43||c===45||c===64||c===9||c===13)?"'"+t:t;}
function cfgClone(o){return JSON.parse(JSON.stringify(o));}
function deepMerge(base,over){ if(over&&typeof over==='object'&&!Array.isArray(over)){ for(const k in over){ if(k==='__proto__'||k==='constructor'||k==='prototype')continue; const ov=over[k]; if(ov&&typeof ov==='object'&&!Array.isArray(ov)&&base[k]&&typeof base[k]==='object'&&!Array.isArray(base[k])){ deepMerge(base[k],ov); } else base[k]=ov; } } return base; }

/* hand-rolled CSV parse (quotes, commas, CRLF, BOM). Slice-based scanner:
   reads whole fields by substring rather than char-by-char concatenation, and
   builds the row objects inline so no giant intermediate array is retained -
   ~5x faster and lower peak memory than a naive per-char loop on a 270k-row file. */
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  const n=text.length, out=[];
  let head=null, i=0;
  while(i<n){
    const row=[]; let rowDone=false;
    while(!rowDone){
      let val;
      if(text.charCodeAt(i)===34){                       /* quoted field */
        i++; let s=i, buf=null;
        while(i<n){
          const c=text.charCodeAt(i);
          if(c===34){
            if(text.charCodeAt(i+1)===34){ buf=(buf===null?'':buf)+text.slice(s,i)+'"'; i+=2; s=i; }
            else { const seg=text.slice(s,i); val=(buf===null?seg:buf+seg); i++; break; }
          } else i++;
        }
        if(val===undefined) val=(buf===null?text.slice(s,i):buf+text.slice(s,i)); /* unterminated quote at EOF */
        while(i<n){ const c=text.charCodeAt(i); if(c===44||c===10||c===13) break; i++; }  /* skip to delimiter */
      } else {                                            /* unquoted field - slice to next , or newline */
        const s=i;
        while(i<n){ const c=text.charCodeAt(i); if(c===44||c===10||c===13) break; i++; }
        val=text.slice(s,i);
      }
      row.push(val);
      if(i>=n){ rowDone=true; }
      else { const c=text.charCodeAt(i);
        if(c===44){ i++; }
        else if(c===13){ i++; if(text.charCodeAt(i)===10)i++; rowDone=true; }
        else if(c===10){ i++; rowDone=true; }
        else { i++; } }
    }
    if(head===null){ head=row.map(h=>h.trim()); }
    else if(row.length>1||(row[0]&&row[0]!=='')){
      const o={}; for(let j=0;j<head.length;j++){ const v=row[j]; o[head[j]]=(v!==undefined?v.trim():''); } out.push(o);
    }
  }
  return out;
}
function pdate(s){ if(!s)return null;s=String(s).trim();if(!s)return null;
  let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/); if(m)return new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0),+(m[6]||0));
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2}))?/); if(m)return new Date(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0));
  const d=new Date(s);return isNaN(d)?null:d; }
function dbtw(a,b){return Math.max(0,Math.round((a-b)/MS));}

/* OWNER 'rule' mode - the sticky-world model (open-case-state-model.md §3), read from the case's own activity.
   R1  CASE_STATUS says waiting on the customer -> Customer.
   R2  otherwise the FIRST not-completed step decides (ordered by date - due, else raised - then SA position):
         - a partner step (External), booked OR unscheduled -> Partner   (partners schedule their own work)
         - a UU step (Internal), booked (a confirmed date in schedDateColumns) -> Field
         - a UU step (Internal), not scheduled -> Scheduling
   R3  no not-completed steps -> the team of the last completed visit (External -> Partner, Internal -> Field).
   Cancelled items are ignored (handled by the Cancelled->closed toggle); no work items at all -> Ownership unclear. */
function ownerByRule(rs,r0){
  const C=CONFIG.columns, R=CONFIG.ownerRule||{}, AT=AS_OF.getTime();
  const low=s=>String(s==null?'':s).trim().toLowerCase();
  const inSet=(set,val)=>(set||[]).some(s=>low(s)===low(val));
  const cancSet=(CONFIG.cancelledStatuses||[]).map(low), compSet=(CONFIG.completedStatuses||[]).map(low);
  const schedCols=(R.schedDateColumns&&R.schedDateColumns.length)?R.schedDateColumns:[C.saSched];
  const woCols=(CONFIG.woColumns||[]).map(k=>C[k]||k);
  if(inSet(R.customerStatuses, r0[C.status])) return 'customer';                       /* R1 */
  const pend=[]; let lastDoneExt=null, lastDoneTs=-Infinity;
  for(const r of rs){
    const isWork=woCols.some(col=>{const val=r[col];return val!==undefined&&String(val).trim()!=='';});
    if(!isWork) continue;
    const st=low(r[C.saStatus]);
    if(cancSet.indexOf(st)>=0) continue;                                                /* cancelled = not a live item */
    const ad=pdate(r[C.saStart])||pdate(r[C.saEnd]), sd=pdate(r[C.saSched]);
    const doneStatus=compSet.indexOf(st)>=0 || /cannot complete|abort|partial/.test(st);
    const done = ad!=null || (doneStatus && sd && sd.getTime()<=AT);
    const ext = low(r[C.intExt])==='external';
    if(done){ const t=ad?ad.getTime():(sd?sd.getTime():0); if(t>=lastDoneTs){lastDoneTs=t;lastDoneExt=ext;} continue; }
    /* a not-completed step. booked = a confirmed date in any schedDateColumns; seqTs orders undated ones by when raised */
    let sched=null; for(const sc of schedCols){ const d=pdate(r[sc]); if(d){sched=d;break;} }
    const pos=parseFloat(r[C.saPos]), cr=pdate(r[C.saCreated]);
    pend.push({ext, booked:sched!=null, pos:isNaN(pos)?null:pos, seqTs:(sched?sched.getTime():(cr?cr.getTime():null))});
  }
  if(pend.length){                                  /* R2 - first not-completed step, CHRONOLOGICALLY (due, else raised) */
    /* date-primary, position only as a tie-break - same ordering as the visit timeline. SA position disagrees with date
       order on ~28% of cases with 2+ pending steps and picks a different FIRST step on ~19%, so it was choosing the
       wrong "next step" (and therefore the wrong owner) on those. Undated steps sort last. */
    pend.sort((a,b)=>{ const ta=a.seqTs==null?Infinity:a.seqTs, tb=b.seqTs==null?Infinity:b.seqTs; if(ta!==tb)return ta-tb;
      const pa=a.pos==null?Infinity:a.pos, pb=b.pos==null?Infinity:b.pos; return pa-pb; });
    const n=pend[0];
    if(n.ext) return 'contractor';        /* partner - booked or not (self-schedules) */
    if(n.booked) return 'ops';            /* UU booked -> Field */
    return 'scheduling';                  /* UU not scheduled -> Scheduling */
  }
  if(lastDoneExt!==null) return lastDoneExt?'contractor':'ops';                          /* R3 - world of the last completed visit */
  return 'unclear';
}

function ingest(rows){
  const C=CONFIG.columns, meta={rowsIn:rows.length,dropped:{},cases:0,unmappedStatus:{},unmappedOwner:{}};
  const v=(r,k)=>{const col=C[k];return col&&r[col]!==undefined?r[col]:'';};
  const drop=w=>{meta.dropped[w]=(meta.dropped[w]||0)+1;};

  DATA_HEADERS = rows.length?Object.keys(rows[0]):[];

  let asOf=null;for(const r of rows){const d=pdate(r[C.extract]);if(d){asOf=d;break;}} AS_OF=asOf||new Date();
  const cut=CONFIG.recencyMonths?new Date(AS_OF.getTime()-CONFIG.recencyMonths*30.4375*MS):null;

    if(scan<CFG_DISTINCT_ROWS){ scan++; for(const col of DATA_HEADERS){ const dd=dcap[col]; if(dd.full)continue; const val=r[col]; if(val===undefined||val==='')continue; if(!dd.set.has(val)){ dd.set.add(val); if(dd.set.size>=CFG_DISTINCT_CAP)dd.full=true; } } }
    for(const f of filters){ if(!f.equals)continue; const val=r[f.column]!==undefined?r[f.column]:''; if(f.optional&&String(val).trim()==='')continue; if(cfNorm(val)!==f._eq){drop(f.dropLabel||('not '+(f.label||f.column)));continue rowloop;} }
    const cr=pdate(v(r,'created')); if(cut&&cr&&cr<cut){drop('older than '+CONFIG.recencyMonths+'m');continue;}
    const key=v(r,'id'); if(!key){drop('no case number');continue;}
    (groups[key]=groups[key]||[]).push(r);
  }
  DATA_DISTINCT={}; for(const col of DATA_HEADERS){ DATA_DISTINCT[col]={values:[...dcap[col].set].sort(),truncated:dcap[col].full}; }
  const out=[];let idc=0;
  const woCols=(CONFIG.woColumns||[]).map(k=>C[k]).filter(Boolean);
  const compSet=(CONFIG.completedStatuses||[]).map(s=>String(s).toLowerCase());
  const openSet=(CONFIG.openSaStatuses||[]).map(s=>String(s).toLowerCase());
  const cancSet=(CONFIG.cancelledStatuses||[]).map(s=>String(s).toLowerCase());
  for(const key in groups){ const rs=groups[key],r0=rs[0];
    const hasWO=woCols.length?rs.some(r=>woCols.some(col=>{const val=r[col];return val!==undefined&&String(val).trim()!=='';})):true;
    const cr=pdate(v(r0,'created')), age=cr?dbtw(AS_OF,cr):0, createdTs=cr?cr.getTime():0;
    /* ---- OWNER (V2: compute BOTH the extract's column owner and the in-tool rule owner, so the
       Owner-source toggle switches between them and the reconciliation view can compare them.
       Column mapping is case-insensitive so UNDEFINED / Undefined etc. all match. ) ---- */
    const ownerCol=CONFIG.ownerColumn||C.owner, rawOwner=(r0[ownerCol]!==undefined?r0[ownerCol]:'');
    const mapOwner=val=>{ const m=CONFIG.ownerColumnMap||{}; if(m[val]!=null)return m[val]; const hit=Object.keys(m).find(k=>k.toLowerCase()===String(val).trim().toLowerCase()); if(hit)return m[hit]; return OWNERS.indexOf(val)>=0?val:'unclear'; };
    const ownerExtract=mapOwner(rawOwner);
    let ownerDerived=ownerByRule(rs,r0);   /* let: the private-problem rule can override this to 'customer' below */

/* V2: stream a large file in chunks so we never build one giant string (FileReader.readAsText fails / OOMs
   past ~0.5-1 GB). Rows are cohort-filtered as they stream, so peak memory is the KEPT rows, not the file. */
const BIG_FILE=250*1024*1024;
async function loadFileStreaming(file){
  RAW_CSV_TEXT=''; ALL_ROWS=null; SRC_FILE=file;
  const mb=(file.size/1048576).toFixed(0);
  setMsg('Streaming <b>'+mb+' MB</b> (large file — parsed in chunks in your browser; nothing is uploaded) &hellip;');
  const cfNorm=s=>String(s==null?'':s).toLowerCase().replace(/\s+/g,'');
  const filters=(CONFIG.cohortFilters||[]).map(f=>({...f,_eq:f.equals?cfNorm(f.equals):''}));
  let header=null; const rows=[]; let read=0, kept=0, bytes=0, lastMsg=0; const dropped={};
  let inQ=false, pend=false, field='', row=[];
  const endField=()=>{ row.push(field); field=''; };
  function endRow(){
    endField();
    if(header===null){ header=row.map(h=>h.trim()); row=[]; return; }
    if(row.length===1 && row[0]===''){ row=[]; return; }
    const o={}; for(let j=0;j<header.length;j++)o[header[j]]=(row[j]!==undefined?row[j].trim():''); row=[];
    read++;
    for(const f of filters){ if(!f.equals)continue; const val=o[f.column]!==undefined?o[f.column]:''; if(f.optional&&String(val).trim()==='')continue; if(cfNorm(val)!==f._eq){ const k=f.dropLabel||('not '+(f.label||f.column)); dropped[k]=(dropped[k]||0)+1; return; } }
    kept++; rows.push(o);
  }
  function feed(s){ const n=s.length; let i=0;
    while(i<n){
      if(pend){ pend=false; const c=s.charCodeAt(i); if(c===34){ field+='"'; i++; continue; } else { inQ=false; } }
      if(inQ){ let j=i; while(j<n&&s.charCodeAt(j)!==34)j++; if(j>i)field+=s.slice(i,j); if(j<n){ pend=true; i=j+1; } else { i=n; } }
      else { let j=i; for(;j<n;j++){ const c=s.charCodeAt(j); if(c===44||c===34||c===10||c===13)break; } if(j>i){ field+=s.slice(i,j); i=j; if(i>=n)break; } const c=s.charCodeAt(i);
        if(c===34){ if(field===''){ inQ=true; } else { field+='"'; } i++; }
        else if(c===44){ endField(); i++; }
        else if(c===10){ endRow(); i++; }
        else { i++; } }
    }
  }
  try{
    if(!file.stream) throw new Error('this browser cannot stream files');
    const reader=file.stream().pipeThrough(new TextDecoderStream()).getReader();
    while(true){ const {done,value}=await reader.read(); if(done)break; bytes+=value.length; feed(value);
      if(bytes-lastMsg>4000000){ lastMsg=bytes; setMsg('Streaming &hellip; read <b>'+read.toLocaleString('en-GB')+'</b> rows, kept <b>'+kept.toLocaleString('en-GB')+'</b> customer rows'); await new Promise(r=>setTimeout(r,0)); } }
    if(field!==''||row.length) endRow();
    if(!rows.length){ showEmpty('No customer rows found in the file. Check the Source / Category / Stream filters in Config, or the file format.'); return; }
    setMsg('Deriving from <b>'+kept.toLocaleString('en-GB')+'</b> customer rows (of '+read.toLocaleString('en-GB')+') &hellip;');
    await new Promise(r=>setTimeout(r,20));
    ALL_ROWS=rows;
    const meta=ingest(rows); meta.rowsIn=read; for(const k in dropped)meta.dropped[k]=(meta.dropped[k]||0)+dropped[k]; LAST_META=meta;
    if(!meta.cases){ showEmpty('No rows matched the cohort after streaming.'); return; }
    afterLoad(meta);
  }catch(e){ showEmpty('Could not stream the file: '+e.message+'. If it persists, split the extract or keep the previous smaller one.'); console.error(e); }
}
function loadFile(file){ SRC_FILE=file;

function caseVerdict(l){
  const st=l.raw?String(l.raw[CONFIG.columns.status]||'').trim():'';
  if(isClosedNow(l)){
    const why=[];
    if(l.resolved) why.push(['Closed in the extract', 'the source record is already terminal'+(st?' (CASE_STATUS = &lsquo;'+esc(st)+'&rsquo;)':'')+'.']);
    if(state.completedClosed && l.workDone && !(state.ccKeepsOpen && l.lastVisitCCRecent)) why.push(['Completed &rarr; closed', 'all work is done and nothing is still scheduled'+(l.lastVisitCC?' &mdash; the trailing Cannot Complete is older than '+CC_LAG+' days, so it no longer keeps the case open':'')+'. (Toggle &ldquo;Completed &rarr; closed&rdquo;, on by default.)']);
    if(state.cancelledClosed && l.allCancelled) why.push(['All cancelled &rarr; closed', 'every appointment / line is cancelled. (Toggle &ldquo;All cancelled &rarr; closed&rdquo;, on by default.)']);
    if(state.abandonedClosed && l.abandoned) why.push(['Abandoned &rarr; closed', 'no visit ever completed, the last attended visit was a Cannot Complete / aborted more than '+(CONFIG.abandonedDays||90)+' days ago, and nothing is pending &mdash; a failed job that was never finished or re-attended. (Toggle &ldquo;Abandoned &rarr; closed&rdquo;, on by default.)']);
    if(isStalled(l)) why.push(['Stalled &rarr; closed', 'no real field activity for '+(l.sinceDormancy!=null?l.sinceDormancy:l.sinceActivity)+' days, over the '+staleDays()+'-day cutoff &mdash; appointment cancellations and record touches do not count as activity. (Toggle &ldquo;Stalled &rarr; closed&rdquo;, on by default.)']);
    if(!why.length) why.push(['Closed', 'treated as closed by the current rules.']);
    if(state.hideNonLeak && isNonLeak(l)){
      why.push(['Then removed as non-leakage', 'D_BLUE_REPORT_LEAKAGE_NON_LEAKAGE = &lsquo;'+esc(l.blueLnl)+'&rsquo; (not &ldquo;Leakage&rdquo;). The &ldquo;hide non-leakage&rdquo; filter is on, so it is excluded from the Closed list and the closed statistics too.']);
      return {status:'removed', label:'Closed &amp; hidden', where:'Not shown anywhere &mdash; it counts as closed, then drops out of the closed statistics as non-leakage', why};
    }
    return {status:'closed', label:'Closed', where:'Closed cases tab', why};
  }
  const why=[];
  if(state.hideNoWO && !l.hasWO) why.push(['Hidden &mdash; no work order', 'none of the work-order columns are populated. The &ldquo;hide cases with no work order&rdquo; filter is on.']);

  if(state.hideNonLeak && isNonLeak(l)) why.push(['Hidden &mdash; non-leakage', 'D_BLUE_REPORT_LEAKAGE_NON_LEAKAGE = &lsquo;'+esc(l.blueLnl)+'&rsquo; (not &ldquo;Leakage&rdquo;). The &ldquo;hide non-leakage&rdquo; filter is on.']);

const VERDICT_BG={open:'#e8f5f1',closed:'#eef2fb',hidden:'#fff1e8',removed:'#fdecec',dropped:'#f3f4f6',missing:'#f3f4f6'};
const VERDICT_FG={open:'#00805c',closed:'#024E43',hidden:'#c2560f',removed:'#d32f2f',dropped:'#475569',missing:'#475569'};
/* leading-zero-tolerant key: pure-digit ids compare without leading zeros (pasted 8321303 == stored 08321303);
   anything else is lower-cased and de-spaced. Shared by the case index and the pasted tokens. */
function findKey(s){ const t=String(s==null?'':s).trim(); return /^\d+$/.test(t)? t.replace(/^0+(?=\d)/,'') : t.toLowerCase().replace(/\s+/g,''); }
/* short reason a case in the raw file never entered the cohort (which filter/gate rejected all its rows) */
function cohortDropReason(rows){
  const norm=s=>String(s==null?'':s).toLowerCase().replace(/\s+/g,'');
  const failed=[];
  for(const f of (CONFIG.cohortFilters||[])){ if(!f.equals)continue;
    const pass=rows.some(r=>{const val=r[f.column]!==undefined?r[f.column]:'';if(f.optional&&String(val).trim()==='')return true;return norm(val)===norm(f.equals);});
    if(!pass){ const vals=[...new Set(rows.map(r=>String(r[f.column]==null?'':r[f.column]).trim()).filter(x=>x!==''))]; failed.push((f.label||f.column)+(vals.length?' is '+vals.slice(0,3).map(v=>'&ldquo;'+esc(v)+'&rdquo;').join('/'):' blank')); } }
  const cut=CONFIG.recencyMonths?new Date(AS_OF.getTime()-CONFIG.recencyMonths*30.4375*MS):null;
  if(cut){ const recPass=rows.some(r=>{const cr=pdate(r[CONFIG.columns.created]);return !cr||cr>=cut;}); if(!recPass)failed.push('older than '+CONFIG.recencyMonths+'m'); }
  const hasId=rows.some(r=>{const k=r[CONFIG.columns.id];return k!==undefined&&String(k).trim()!=='';});
  if(!hasId)failed.push('no case number');
  return failed.length?('outside cohort - '+failed.join('; ')):'in the file but filtered out at load';
}
/* Config "Find cases": paste a list of case numbers, get each one's status (open / closed / hidden /

function cfgFind(){
  const raw=(findCaseQ||'');
  const inputRow=`<div class="cfg-row" style="align-items:flex-start;flex-wrap:wrap;gap:10px">
      <label style="padding-top:6px">Case / leak #s</label>
      <textarea data-findlist rows="6" placeholder="Paste one case number per line — a header like &quot;Leak&quot; is ignored" style="flex:1;min-width:240px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;padding:7px 9px">${esc(raw)}</textarea>
      <button class="seg on acc" data-findgo style="align-self:flex-start">Look up</button></div>`;
  const shell=inner=>`<div class="cfg-sec"><h3>Find cases</h3>
      <div class="hint">Paste a list of case numbers to check each one's status in the loaded data &mdash; <b>open</b>, <b>closed</b>, <b>hidden by a filter</b>, dropped from the cohort, or not in the extract at all. Leading zeros are ignored (8321303 matches 08321303). Click any in-tool row to open its full case journey.</div>
      ${inputRow}${inner}</div>`;
  const tokens=[]; const seen=new Set();
  raw.split(/[\r\n,;\t|]+/).forEach(t=>{ t=t.trim(); if(!t)return; if(!/\d/.test(t))return; /* skip headers like "Leak" */ const k=findKey(t); if(seen.has(k))return; seen.add(k); tokens.push(t); });
  if(!tokens.length) return shell(`<div class="hint" style="margin-top:10px;color:var(--muted)">Paste your list above and press <b>Look up</b>.</div>`);
  const idx=new Map();
  for(const l of LEAKS){ [l.caseKey,l.ref,l.journeyId].forEach(v=>{ if(v==null||v==='')return; const k=findKey(v); if(!idx.has(k))idx.set(k,l); }); }
  const have=haveRows();
  let rawIdx=null;
  const buildRawIdx=()=>{ if(rawIdx)return rawIdx; rawIdx=new Map(); if(!have)return rawIdx; const idCol=CONFIG.columns.id,jCol=CONFIG.columns.journeyId;
    for(const r of (allRows()||[])){ [r[idCol], jCol?r[jCol]:null].forEach(v=>{ if(v==null||v==='')return; const k=findKey(v); (rawIdx.get(k)||rawIdx.set(k,[]).get(k)).push(r); }); } return rawIdx; };
  const PILL={open:'Open',closed:'Closed',hidden:'Open (hidden)',removed:'Closed (non-leak)',dropped:'Outside cohort',missing:(have?'Not in extract':'Not found')};
  const counts={open:0,closed:0,hidden:0,removed:0,dropped:0,missing:0};
  const resolved=tokens.map(tok=>{
    const k=findKey(tok), l=idx.get(k);
    if(l){ const V=caseVerdict(l); counts[V.status]=(counts[V.status]||0)+1; return {tok,l,status:V.status,where:V.where}; }
    if(have){ const rr=buildRawIdx().get(k); if(rr&&rr.length){ counts.dropped++; return {tok,status:'dropped',where:cohortDropReason(rr)}; } }
    counts.missing++; return {tok,status:'missing',where:(have?'no rows for this number in the loaded extract':'not in the demo data')};
  });
  const pill=st=>`<span style="display:inline-block;padding:2px 9px;border-radius:11px;font-size:11px;font-weight:800;white-space:nowrap;background:${VERDICT_BG[st]};color:${VERDICT_FG[st]};border:1px solid ${VERDICT_FG[st]}33">${PILL[st]}</span>`;
  const order=[['open','Open'],['closed','Closed'],['hidden','Open (hidden)'],['removed','Closed (non-leak)'],['dropped','Outside cohort'],['missing',PILL.missing]];
  const chips=order.filter(([k])=>counts[k]).map(([k,lab])=>`<span style="display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:11px;font-size:11.5px;font-weight:700;background:${VERDICT_BG[k]};color:${VERDICT_FG[k]};border:1px solid ${VERDICT_FG[k]}33"><b>${counts[k]}</b> ${lab}</span>`).join('');
  const summary=`<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 8px"><span style="font-weight:800;font-size:13px">${tokens.length} looked up</span>${chips}</div>`;
  const trs=resolved.map(r=>{
    if(r.l){ const x=r.l, ownerLbl=OWNER_LABEL[x.owner]||x.owner;
      const refMore=(String(r.tok).trim()!==String(x.ref||x.caseKey).trim())?` <span class="mini">&rarr; ${esc(x.ref||x.caseKey)}</span>`:'';
      const ageCell=x.reRaised?`${effAge(x)} <span class="mini" title="on the books ${x.age} d">&#8635;</span>`:(effAge(x)+'');
      return `<tr data-findrow="${x.id}" style="cursor:pointer"><td><b>${esc(r.tok)}</b>${refMore}</td><td>${pill(r.status)}</td><td>${countyLabel(x.county)}</td><td class="num tnum">${ageCell} d</td><td>${ownerLbl?esc(ownerLbl):'<span class="na">-</span>'}</td><td>${x.stage?esc(x.stage):'<span class="na">-</span>'}</td><td style="font-size:11.5px;color:var(--muted)">${r.where}</td></tr>`;
    }
    return `<tr style="opacity:.85"><td><b>${esc(r.tok)}</b></td><td>${pill(r.status)}</td><td colspan="4" style="color:var(--muted);font-size:12px">&mdash;</td><td style="font-size:11.5px;color:var(--muted)">${r.where}</td></tr>`;
  }).join('');
  const head=`<thead><tr><th>Leak #</th><th>Status</th><th>County</th><th class="num">Age</th><th>Owner</th><th>Stage</th><th>Why / where</th></tr></thead>`;
  const table=`<div class="tbl-wrap" style="max-height:50vh;border:1px solid var(--border);margin-top:4px"><table class="compact">${head}<tbody>${trs}</tbody></table></div>
    <div class="mini" style="margin-top:6px">Age = current-problem age (&#8635; = re-raised, hover for case age). Click an in-tool row to open its journey, raw rows and timeline.</div>`;
  return shell(summary+table);
}

  const sb=document.getElementById('settingsBtn'), sm=document.getElementById('settingsMenu');
  if(!sb||!sm)return;
  const isOpen=()=>sm.classList.contains('open');
  const place=()=>{const r=sb.getBoundingClientRect();sm.style.top=(r.bottom+4)+'px';sm.style.right=Math.max(8,window.innerWidth-r.right)+'px';};
  const close=()=>{sm.classList.remove('open');sb.classList.remove('open');sb.setAttribute('aria-expanded','false');};
  const open=()=>{place();sm.classList.add('open');sb.classList.add('open');sb.setAttribute('aria-expanded','true');};
  sb.addEventListener('click',e=>{e.stopPropagation();isOpen()?close():open();});
  document.addEventListener('click',e=>{if(isOpen()&&!sm.contains(e.target)&&!sb.contains(e.target))close();});

  window.addEventListener('resize',()=>{if(isOpen())place();});

  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&isOpen())close();});
})();

/* ===== BEGIN secure-publish layer (build_publish.py) ===== */
/* ================= SECURE PUBLISH / LOCKED VIEWER =================
   One file, two modes. The cockpit you open with no baked-in payload is the
   PUBLISHER: load the extract as normal, then "Publish secured file" writes a
   copy of this very page with the cohort rows encrypted inside it. The copy is
   the VIEWER: it has no upload, and it asks for the passphrase before it will
   render anything.

   Crypto: gzip -> AES-GCM-256, key from the passphrase via PBKDF2-HMAC-SHA256
   at 600,000 iterations (OWASP 2023). All WebCrypto - no libraries, works
   offline. A wrong passphrase fails on the GCM authentication tag, so the data
   is genuinely unreadable rather than just hidden behind a UI check.

   The published file carries the SAME columns it was given - the extract is
   re-serialised from the cohort rows exactly as parsed, so nothing is dropped
   or renamed here. Trim columns at the extract, not in this layer.

   Threat model, stated honestly: this protects the file at rest and in transit
   (misdirected mail, an over-shared channel, a lost laptop). It does not stop
   an authorised recipient who has the passphrase from reading or copying the
   data - once open, it is in their browser. There is no revocation.        */

const PUB_ITER=600000;                 /* PBKDF2-HMAC-SHA256 rounds */
const PUB_SLOT='cockpitPayload';       /* id of the <script> the payload is baked into */
let SHELL_SNAPSHOT=null;               /* pristine copy of this page, captured before any data is loaded */
let VIEWER_MODE=false;                 /* true once this file is running as a published viewer */

/* ---------- small binary helpers ---------- */
function pubB64(u8){ let s='';const CH=0x8000; for(let i=0;i<u8.length;i+=CH)s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH)); return btoa(s); }
function pubUnB64(b){ const s=atob(b),a=new Uint8Array(s.length); for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i); return a; }
async function pubGunzip(u8){ return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer()); }
async function pubKey(pass,salt,it,uses){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,uses);
}
function pubBytes(n){ return n<1024?n+' B':n<1048576?(n/1024).toFixed(0)+' KB':(n/1048576).toFixed(1)+' MB'; }

/* A readable 16-character passphrase from an unambiguous alphabet (no 0/O/1/I/l).
   32 symbols x 16 = 80 bits. This matters more than the iteration count: a
   published file can be brute-forced offline at the attacker's leisure, so the
   passphrase is the real control. Generated by default for exactly that reason. */
function pubGenPass(){
  const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789#';   /* 32 symbols */
  const r=crypto.getRandomValues(new Uint8Array(16));
  let s=''; for(let i=0;i<16;i++){ s+=A[r[i]&31]; if(i%4===3&&i<15)s+='-'; }
  return s;
}

/* ---------- pristine self-snapshot ----------
   document.documentElement.outerHTML reproduces this file at 99.7% (the delta is
   line-ending and attribute-quoting normalisation), keeping the CSP meta and the
   inline style/script. We cannot fetch our own source - the CSP blocks it with
   connect-src 'none' - so the snapshot is the route. It is taken at
   DOMContentLoaded, BEFORE any extract is loaded, so no case data can ever end
   up baked into the shell as rendered markup. */
function pubCaptureShell(){
  const d=document.documentElement.cloneNode(true);
  d.querySelectorAll('.page').forEach(s=>{ s.innerHTML=''; s.classList.remove('on'); });
  d.querySelectorAll('.drawer.dstack, #pubLock').forEach(e=>e.remove());
  ['empty','drawer','defBox','loadmsg'].forEach(id=>{ const e=d.querySelector('#'+id); if(e)e.innerHTML=''; });
  const em=d.querySelector('#empty'); if(em)em.style.display='none';
  const md=d.querySelector('#defModal'); if(md)md.classList.remove('show');
  const sl=d.querySelector('#'+PUB_SLOT); if(sl)sl.textContent='';
  return '<!doctype html>\n'+d.outerHTML;
}

/* Real case references used as worked examples while the rules were built. They are
   genuine UU case numbers, so they are swapped for an obviously-fake one on the way
   out - the surrounding comments and hint text are left exactly as they are. */
const PUB_SCRUB=[/\b08321303\b/g,/\b8321303\b/g,/\b08704022\b/g,/\b09652480\b/g];
function pubScrub(html){ let n=0; PUB_SCRUB.forEach(re=>{ html=html.replace(re,m=>{n++;return m.length===8?'01234567':'1234567';}); }); return {html,n}; }

/* ---------- cohort rows -> CSV -> gzip, streamed ----------
   Streamed rather than built as one string: a 300k-row extract is several hundred
   MB of CSV, and materialising that (plus the join) would spike past a GB. Feeding
   the CompressionStream in batches keeps peak memory at one batch. */
async function pubCsvGzip(rows,onProg){
  const cols=(DATA_HEADERS&&DATA_HEADERS.length)?DATA_HEADERS:Object.keys(rows[0]||{});
  const q=v=>{ v=(v==null?'':String(v)); return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const enc=new TextEncoder(); const BATCH=2000;
  let i=0, headDone=false, rawBytes=0;
  const rs=new ReadableStream({
    pull(ctrl){
      if(!headDone){ const h=cols.join(',')+'\r\n'; rawBytes+=h.length; ctrl.enqueue(enc.encode(h)); headDone=true; return; }
      if(i>=rows.length){ ctrl.close(); return; }
      const end=Math.min(i+BATCH,rows.length); let buf='';
      for(;i<end;i++){ const r=rows[i]; let line=''; for(let c=0;c<cols.length;c++){ if(c)line+=','; line+=q(r[cols[c]]); } buf+=line+'\r\n'; }
      rawBytes+=buf.length; ctrl.enqueue(enc.encode(buf));
      if(onProg)onProg(i,rows.length);
    }
  });
  const gz=new Uint8Array(await new Response(rs.pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
  return {gz,rawBytes,cols:cols.length};
}

/* ---------- publish ---------- */
async function pubPublish(pass,setStatus){
  const rows=allRows();
  if(!rows.length) throw new Error('No extract is loaded. Upload the CSV first.');
  if(!SHELL_SNAPSHOT) throw new Error('The page shell was not captured - reload and try again.');

  setStatus('Packaging '+fmtN(rows.length)+' rows…');
  const {gz,rawBytes,cols}=await pubCsvGzip(rows,(d,t)=>{ if(d%20000<2000)setStatus('Packaging '+fmtN(d)+' / '+fmtN(t)+' rows…'); });

  setStatus('Encrypting…');
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await pubKey(pass,salt,PUB_ITER,['encrypt']);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,gz));

  /* The envelope is deliberately self-describing OUTSIDE the ciphertext, so a
     recipient can see what they are holding - and how stale it is - before they
     type anything. Nothing here identifies a case. */
  const env={ v:1, kdf:'PBKDF2-SHA256', it:PUB_ITER, alg:'AES-GCM',
              salt:pubB64(salt), iv:pubB64(iv), ct:pubB64(ct),
              built:new Date().toISOString().slice(0,10),
              asAt:(typeof AS_OF!=='undefined'&&AS_OF)?fmtDT(AS_OF):'',
              cohort:(CONFIG.cohortFilters||[]).filter(f=>f.equals).map(f=>(f.label||f.column)+' = '+f.equals).join(' · '),
              rows:rows.length, cols:cols, cases:(typeof LEAKS!=='undefined')?LEAKS.length:0 };
  /* escape < so the JSON can never terminate the <script> block it sits in */
  const json=JSON.stringify(env).replace(/</g,'\\u003c');

  setStatus('Writing the file…');
  const sc=pubScrub(SHELL_SNAPSHOT);
  const html=sc.html.replace(new RegExp('<script id="'+PUB_SLOT+'"[^>]*>[\\s\\S]*?<\\/script>'),
    '<script id="'+PUB_SLOT+'" type="application/json">'+json+'<\/script>');
  if(html.indexOf(json.slice(0,40))<0) throw new Error('Could not write the payload into the page shell.');

  const blob=new Blob([html],{type:'text/html'});
  const name='UU-Leakage-Cockpit-'+env.built+'.html';
  const a=document.createElement('a'); const u=URL.createObjectURL(blob);
  a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(u); a.remove(); },4000);
  return { name, fileBytes:blob.size, rawBytes, gzBytes:gz.length, rows:rows.length, cases:env.cases, scrubbed:sc.n };
}

/* ---------- publish dialog (reuses the shared modal) ---------- */
function pubDialog(){
  if(!haveRows()){ alert('Load the CSV extract first, then publish.'); return; }
  const box=document.getElementById('defBox');
  const rows=allRows().length;
  box.classList.remove('cfgwide');
  box.innerHTML='<button class="close" id="defClose">Close</button><h2>Publish a secured file</h2>'
    +'<div class="mini" style="margin-bottom:14px">Writes a copy of this page with the <b>'+fmtN(rows)+'</b> loaded rows encrypted inside it. '
      +'The copy has no upload button and shows nothing until the passphrase is entered. Columns are published exactly as loaded.</div>'
    +'<div class="cfg-sec"><h3>Passphrase</h3>'
      +'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
        +'<input id="pubPass" type="text" spellcheck="false" value="'+esc(pubGenPass())+'" '
          +'style="flex:1;min-width:260px;font-family:ui-monospace,Consolas,monospace;font-size:14px;letter-spacing:.06em;padding:8px 10px;border:1px solid var(--border2);border-radius:7px"/>'
        +'<button class="seg" id="pubGen">Generate</button><button class="seg" id="pubCopy">Copy</button>'
      +'</div>'
      +'<div class="mini" id="pubStrength" style="margin-top:7px"></div>'
      +'<div class="mini" style="margin-top:9px;color:var(--age-60)"><b>Send the passphrase separately from the file.</b> '
        +'In the same message it protects nothing. A published file can be attacked offline with no rate limit, so keep the generated passphrase rather than substituting a memorable one.</div>'
    +'</div>'
    +'<div class="cfg-sec"><h3>What travels</h3><ul class="sum">'
      +'<li>The <b>'+fmtN(rows)+' cohort rows</b> as loaded - same columns, nothing renamed or dropped.</li>'
      +'<li>Encrypted with <b>AES-GCM-256</b>, key from the passphrase via <b>PBKDF2-SHA256 at '+fmtN(PUB_ITER)+' rounds</b>.</li>'
      +'<li>Build date and cohort are readable before unlocking; <b>no case data is</b>.</li>'
      +'<li>Recipients can still change the rules in Config - the logic travels, not just the numbers.</li>'
    +'</ul></div>'
    +'<div style="display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap">'
      +'<button class="seg on acc" id="pubGo" style="font-size:13.5px;padding:9px 18px">Publish and download</button>'
      +'<span class="mini" id="pubStatus"></span></div>';
  document.getElementById('defModal').classList.add('show');

  const pass=document.getElementById('pubPass');
  const strength=()=>{ const v=pass.value; const el=document.getElementById('pubStrength');
    const bits=Math.round(v.length*Math.log2(new Set(v).size||1));
    el.innerHTML = v.length<12
      ? '<span style="color:var(--age-60)">Too short - use at least 12 characters, or press Generate.</span>'
      : 'Roughly '+bits+' bits of entropy. Generated passphrases are 80 bits.'; };
  strength(); pass.oninput=strength;
  document.getElementById('pubGen').onclick=()=>{ pass.value=pubGenPass(); strength(); };
  document.getElementById('pubCopy').onclick=()=>{ pass.select();
    try{ document.execCommand('copy'); }catch(e){}
    try{ navigator.clipboard&&navigator.clipboard.writeText(pass.value); }catch(e){}
    document.getElementById('pubStatus').textContent='Passphrase copied.'; };
  document.getElementById('defClose').onclick=()=>document.getElementById('defModal').classList.remove('show');
  document.getElementById('pubGo').onclick=async()=>{
    const st=document.getElementById('pubStatus'); const go=document.getElementById('pubGo');
    if(pass.value.length<12){ st.innerHTML='<span style="color:var(--age-60)">Passphrase is too short.</span>'; return; }
    go.disabled=true;
    try{
      const r=await pubPublish(pass.value,m=>st.textContent=m);
      st.innerHTML='<b>'+esc(r.name)+'</b> &middot; '+pubBytes(r.fileBytes)+' downloaded &middot; '
        +fmtN(r.rows)+' rows ('+pubBytes(r.rawBytes)+' of CSV compressed to '+pubBytes(r.gzBytes)+')'
        +(r.scrubbed?' &middot; '+r.scrubbed+' real case reference'+(r.scrubbed===1?'':'s')+' scrubbed from the shell':'');
    }catch(e){ st.innerHTML='<span style="color:var(--age-60)">'+esc(e.message)+'</span>'; }
    go.disabled=false;
  };
}

/* ---------- locked viewer ---------- */
function pubLockScreen(env){
  VIEWER_MODE=true;
  document.querySelectorAll('.page').forEach(s=>s.classList.remove('on'));
  const e=document.getElementById('empty'); if(e)e.style.display='none';
  const meta=[ env.asAt?('Data as at <b>'+esc(env.asAt)+'</b>'):'', env.built?('published <b>'+esc(env.built)+'</b>'):'',
               env.cases?('<b>'+fmtN(env.cases)+'</b> cases'):'' ].filter(Boolean).join(' &middot; ');
  const d=document.createElement('div'); d.id='pubLock';
  d.style.cssText='position:fixed;inset:0;z-index:600;background:linear-gradient(160deg,#04303f,#075466);display:flex;align-items:center;justify-content:center;padding:24px';
  d.innerHTML='<div style="background:#fff;border-radius:14px;max-width:520px;width:100%;padding:30px 32px;box-shadow:0 18px 50px rgba(0,0,0,.35)">'
    +'<div style="font-size:21px;font-weight:800;color:var(--ink)">Customer Leakage Cockpit</div>'
    +'<div class="mini" style="margin:6px 0 2px">'+meta+'</div>'
    +(env.cohort?'<div class="mini" style="margin-bottom:18px">'+esc(env.cohort)+'</div>':'<div style="margin-bottom:18px"></div>')
    +'<div style="font-size:13px;color:var(--text);margin-bottom:8px">This file holds encrypted data. Enter the passphrase you were sent separately.</div>'
    +'<input id="pubUnPass" type="password" autocomplete="off" placeholder="Passphrase" '
      +'style="width:100%;box-sizing:border-box;font-family:ui-monospace,Consolas,monospace;font-size:15px;letter-spacing:.06em;padding:10px 12px;border:1px solid var(--border2);border-radius:8px"/>'
    +'<button class="seg on acc" id="pubUnGo" style="margin-top:12px;font-size:13.5px;padding:9px 18px">Unlock</button>'
    +'<span class="mini" id="pubUnMsg" style="margin-left:10px"></span>'
    +'<div class="mini" style="margin-top:16px;color:var(--muted)">Everything happens in this browser - nothing is uploaded, and the passphrase is never stored.</div>'
    +'</div>';
  document.body.appendChild(d);
  const inp=document.getElementById('pubUnPass'), msg=document.getElementById('pubUnMsg');
  const go=async()=>{
    const b=document.getElementById('pubUnGo'); b.disabled=true; msg.textContent='Decrypting…';
    try{
      const key=await pubKey(inp.value,pubUnB64(env.salt),env.it||PUB_ITER,['decrypt']);
      const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:pubUnB64(env.iv)},key,pubUnB64(env.ct));
      const csv=new TextDecoder().decode(await pubGunzip(new Uint8Array(gz)));
      d.remove();
      pubHideAuthoring();
      loadCSVText(csv);
    }catch(err){
      /* AES-GCM fails its authentication tag on a wrong key - this is a real
         cryptographic failure, not a UI check, so there is nothing to bypass. */
      msg.innerHTML='<span style="color:var(--age-60)">That passphrase did not work.</span>';
      b.disabled=false; inp.select();
    }
  };
  document.getElementById('pubUnGo').onclick=go;
  inp.onkeydown=ev=>{ if(ev.key==='Enter')go(); };
  inp.focus();
}

/* In a published file the authoring controls make no sense - there is no extract to
   load and no shell to re-publish from. Config, Definitions and Reset stay: they
   change how the baked data is interpreted, which is the point of shipping the logic. */
function pubHideAuthoring(){
  ['pubBtn','demoBtn'].forEach(id=>{ const b=document.getElementById(id); if(b)b.style.display='none'; });
  document.querySelectorAll('label[for="csvfile"]').forEach(l=>l.style.display='none');
}

/* ---------- boot ---------- */
function pubBoot(){
  const slot=document.getElementById(PUB_SLOT);
  const raw=slot?slot.textContent.trim():'';
  if(raw){
    let env=null; try{ env=JSON.parse(raw); }catch(e){}
    if(env&&env.ct){ pubLockScreen(env); return; }
    showEmpty('This file carries a data payload that could not be read.'); return;
  }
  /* publisher mode */
  showEmpty();
  const b=document.getElementById('pubBtn'); if(b)b.onclick=pubDialog;
  const cap=()=>{ if(!SHELL_SNAPSHOT&&!VIEWER_MODE) SHELL_SNAPSHOT=pubCaptureShell(); };
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',cap,{once:true});
  else cap();
}
/* ===== END secure-publish layer ===== */

pubBoot();
