  --border:rgba(15,60,80,.12); --border-2:rgba(15,60,80,.07); --border2:rgba(15,60,80,.16); --line:rgba(15,60,80,.10);

  --age-within:#7FC4EA; --age-30:#E4B44A; --age-60:#DC7F30; --age-90:#CB2B28; --unavail:#8a9aa2; --done:#1f9d6b;
  --own-customer:#2f4bbf; --own-ops:#c94f8a; --own-scheduling:#5a3fc0; --own-contractor:#1596a0; --own-unclear:#8a9aa2;
  --bar:#0f5f74; --track:#e7edf0;
  --sh:none;
  --sh2:0 10px 30px rgba(3,40,55,.16),0 30px 60px rgba(3,40,55,.18);
  --r:8px; --r2:10px; --r-sm:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--f);color:var(--text);background:var(--page);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
.tnum{font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
h1,h2,h3{color:var(--ink)}

/* header */
header.appbar{background:linear-gradient(180deg,#004a61,#003647);color:#fff;padding:13px max(20px,calc(50vw - 940px));display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.logo-chip{background:#fff;border-radius:8px;padding:6px 11px;display:flex;align-items:center}
.logo-chip img{height:28px;display:block}
.brand .titles h1{font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.15;color:#fff}
.brand .titles .scope{font-size:11px;color:rgba(255,255,255,.62);margin-top:3px;font-weight:500}
.hspring{flex:1}
.hmeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
.hmeta .block{font-size:8.5px;color:rgba(255,255,255,.5);line-height:1.3;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.hmeta .block b{color:#fff;font-weight:800;font-size:11.5px;letter-spacing:0;text-transform:none;display:block;margin-top:2px}
.hbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:7px;padding:5px 9px;font-size:11px;color:#fff;font-weight:600;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.2)}
.hbtn.wo-on{background:var(--accent);border-color:var(--accent);color:#04303f}
.fictag{align-self:center;display:none;align-items:center;gap:6px;background:#f4a72c;color:#3a2600;font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:7px 14px;border-radius:9px;box-shadow:0 2px 8px rgba(0,0,0,.22);white-space:nowrap}
.fictag.show{display:inline-flex}
.fictag::before{content:"";width:8px;height:8px;border-radius:50%;background:#7a4a00}

/* nav */
nav.pagenav{background:var(--chrome-ink);padding:0 max(28px,calc(50vw - 897px));display:flex;gap:2px;overflow-x:auto}
nav.pagenav button{background:transparent;border:0;border-bottom:2px solid transparent;color:rgba(255,255,255,.58);padding:9px 15px;font-size:12.5px;font-weight:600;white-space:nowrap}
nav.pagenav button:hover{color:#fff}
nav.pagenav button.on{color:#fff;border-bottom-color:var(--accent)}
nav.pagenav button.navset{align-self:center;margin-left:auto;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);border-radius:7px;color:#fff;font-size:12px;font-weight:600;padding:6px 12px;white-space:nowrap}
nav.pagenav button.navset:hover{color:#fff;background:rgba(255,255,255,.22)}
nav.pagenav button.navset.open{background:var(--accent);border-color:var(--accent);color:#04303f}
.setmenu{position:fixed;z-index:500;display:none;flex-direction:column;gap:4px;background:var(--chrome-ink,#04303f);border:1px solid rgba(255,255,255,.18);border-radius:11px;box-shadow:0 22px 55px rgba(0,0,0,.45);padding:11px;min-width:256px;max-width:320px;max-height:82vh;overflow:auto}
.setmenu.open{display:flex}
.setmenu .setgrp{font-size:9px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.42);margin:9px 4px 1px}
.setmenu .setgrp:first-child{margin-top:1px}
.setmenu .hbtn{display:block;width:100%;box-sizing:border-box;text-align:left;white-space:normal;margin:0}
.setmenu .dpf{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#fff;font-size:11.5px;font-weight:600;padding:2px}
.setmenu .dpf input[type=date]{background:#fff;color:#04303f;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:3px 6px;font-size:11px}
.setmenu .setlink{align-self:flex-start;margin-top:4px;background:none;border:0;color:var(--accent);font-size:11px;font-weight:600;cursor:pointer;padding:2px}
.setmenu .setlink:hover{text-decoration:underline}
/* per-toggle info icon + hover tooltip (tooltip is body-level so the menu's overflow:auto can't clip it) */
.setrow{display:flex;align-items:center;gap:6px}
.setrow>.hbtn{flex:1 1 auto;width:auto;margin:0}
.setinfo{flex:0 0 auto;width:17px;height:17px;border-radius:50%;border:1px solid rgba(255,255,255,.4);color:rgba(255,255,255,.85);font-size:10px;font-weight:800;font-style:italic;font-family:Georgia,'Times New Roman',serif;display:inline-flex;align-items:center;justify-content:center;cursor:help;user-select:none}
.setinfo:hover,.setinfo:focus{border-color:var(--accent);color:var(--accent);outline:none}
.settip{position:fixed;z-index:600;display:none;max-width:280px;background:#0b2b38;color:#eaf6fb;font-size:11.5px;font-weight:400;line-height:1.55;padding:9px 12px;border-radius:8px;box-shadow:0 14px 34px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.14);pointer-events:none}
.settip.show{display:block}

/* context bar */
.ctxbar{background:var(--accent-wash);border-bottom:1px solid #c3e6f5;padding:8px 22px;display:none;align-items:center;gap:12px;font-size:12px;color:var(--chrome)}
.ctxbar.show{display:flex}
.ctxbar b{font-weight:800}
.ctxbar .clear{margin-left:auto;background:#fff;border:1px solid #c3e6f5;border-radius:6px;padding:3px 11px;color:var(--chrome);font-weight:700;font-size:11px}

/* layout */
main{padding:10px 28px 8px;max-width:1850px;margin:0 auto}
.page{display:none}
.page.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.sec-title{font-size:14px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.sec-sub{font-size:11.5px;color:var(--muted);font-weight:400;margin-top:3px}
.pagehead{font-size:22px;font-weight:700;color:var(--ink);letter-spacing:-.02em;margin:0 0 2px}
.pagehead-sub{font-size:12.5px;color:var(--muted);margin-bottom:10px;max-width:74ch}
.card{background:var(--surface);border-radius:var(--r2)}
.card .tbl-wrap{box-shadow:none;border:0;border-radius:0}
.pad{padding:14px 18px}
.note{font-size:11px;color:var(--muted-2);margin-top:10px;line-height:1.5}

/* KPI strip - one surface, dividers, no card chrome */
.kpis{display:grid;grid-template-columns:1.5fr repeat(4,1fr);gap:0;margin-bottom:8px;background:var(--surface);border-radius:var(--r2);padding:13px 8px}
.kpi{position:relative;background:transparent;padding:2px 22px;cursor:pointer;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0}
.kpi[data-lens=""]{cursor:default}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:0;text-transform:none;margin-bottom:8px}
.kpi .val{font-size:30px;font-weight:700;color:var(--kc,var(--ink));line-height:1;letter-spacing:-.02em}
.kpi .sub{font-size:11.5px;color:var(--muted);margin-top:6px}
.kpi.primary .val{font-size:42px;font-weight:800}
.kpi.primary .lbl{font-weight:700;color:var(--text)}
.kpi:not([data-lens=""]):hover .lbl{color:var(--chrome)}

/* hero - age distribution band */
.hero{background:var(--surface);border-radius:var(--r2);padding:9px 20px;margin-bottom:8px}
.htitle{font-size:14px;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:700;margin-bottom:14px}
.hrow{display:flex;align-items:center;gap:26px}
.hbar{flex:1;display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface3)}
.hbar span{height:100%;border-right:2px solid var(--surface)}
.hbar span:last-child{border-right:0}
.hbar .hatch{background:var(--age-90)}
.ladder{display:flex;gap:22px;flex:none;flex-wrap:wrap}
.ladder .rung{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.ladder .rung .sw{width:10px;height:10px;border-radius:3px;flex:none}
.ladder .rung b{font-size:14px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.hlabels{display:flex;margin-top:8px}
.hl{text-align:center;padding:0 6px;box-sizing:border-box}
.hl .hn{font-size:16px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
.hl .hb{font-size:11px;color:var(--muted);margin-top:3px}

/* owner cards - flat, colour only as a dot */
.owner-row{display:grid;grid-template-columns:repeat(5,1fr);gap:0}
.ocard{position:relative;background:transparent;padding:2px 18px;cursor:pointer;border-left:1px solid var(--line)}
.ocard:first-child{border-left:0}
.ocard .onm{font-size:12.5px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px}
.ocard .onm .sw{width:9px;height:9px;border-radius:50%;background:var(--oc)}
.ocard .ov{font-size:28px;font-weight:700;color:var(--ink);line-height:1;margin-top:5px;letter-spacing:-.02em}
.ocard .osh{font-size:11.5px;color:var(--muted);margin-top:6px}
.ocard .orate{font-size:12px;font-weight:600;margin-top:3px}
.ocard .obadge{display:block;margin-top:5px;font-size:11px;font-weight:500;color:var(--muted);background:none;border:0;padding:0}
.ocard .obadge.none{color:var(--muted-2)}
.ocard .ohover{font-size:11px;color:var(--muted);margin-top:8px;opacity:0;max-height:0;overflow:hidden;transition:.18s}
.ocard:hover .ohover{opacity:1;max-height:40px}

/* generic bars - thin, pale track, teal fill, labels outside */
.barrow{display:grid;grid-template-columns:150px 1fr auto;align-items:center;gap:14px;padding:7px 0;font-size:12.5px}
.barrow .bl{color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bartrack{background:var(--track);border-radius:5px;height:9px;position:relative;overflow:hidden}
.barfill{height:100%;background:var(--bar);border-radius:5px}
.barrow .bv{font-weight:700;color:var(--ink);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}

/* county rate rows - name | bar | counts | rate | aged (one line) */
.crow{display:grid;grid-template-columns:132px 1fr auto auto auto;align-items:center;gap:14px;padding:2px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.crow:last-child{border-bottom:0}
.crow:hover{background:rgba(15,95,116,.04)}
.cname{font-weight:600;color:var(--ink);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crate{height:8px;border-radius:5px;background:var(--track);overflow:hidden}
.crate>div{height:100%;border-radius:5px;background:var(--bar)}
.cvals{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;min-width:50px}
.cpct{font-weight:700;color:var(--age-90);font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right;min-width:40px}
.caged{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;min-width:82px;white-space:nowrap}

/* stage rows */
.stagerow{display:grid;grid-template-columns:170px 1fr 96px;gap:16px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.stagerow:last-child{border-bottom:0}
.stagerow:hover{background:rgba(15,95,116,.03)}
.stagenm{font-weight:600;color:var(--ink);font-size:13px;display:flex;align-items:center;gap:9px}
.stagenm .n{width:20px;height:20px;border-radius:6px;background:var(--chrome);color:#fff;font-size:10.5px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.stagebar{display:flex;height:14px;border-radius:5px;overflow:hidden;background:var(--surface3)}
.stagebar>span{height:100%;border-right:1px solid var(--surface)}
.stagebar>span:last-child{border-right:0}
.stagecount{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);font-size:15px}
.stagecount .pc{color:var(--muted);font-weight:500;font-size:11px;display:block}
.stage-through{display:inline-flex;flex-direction:column;background:var(--surface2);border-radius:8px;padding:12px 16px;margin-top:14px}
.stage-through .l{font-size:11px;letter-spacing:0;text-transform:none;color:var(--muted);font-weight:600}
.stage-through .v{font-size:24px;font-weight:700;color:var(--ink);line-height:1.15;letter-spacing:-.02em;margin-top:2px}
.stage-through .s{font-size:11px;color:var(--muted-2);margin-top:2px}

/* trend */
.trend{display:flex;align-items:flex-end;gap:8px;height:92px;padding:6px 2px 0}
.trend .tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;justify-content:flex-end;height:100%}
.trend .tb .bar{width:64%;background:var(--bar);border-radius:3px 3px 0 0;min-height:2px}
.trend .tb .vv{font-size:10px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.trend .tb .tl{font-size:9px;color:var(--muted);font-weight:700}

/* two-col + grids */
.grid-2{display:grid;grid-template-columns:1.35fr 1fr;gap:12px}
.panelgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:0;margin-bottom:16px;background:var(--surface);border-radius:var(--r2);padding:18px 8px}
.metric{position:relative;background:transparent;padding:2px 18px;border-left:1px solid var(--line)}
.metric:first-child{border-left:0}
.metric .l{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:none;letter-spacing:0;margin-bottom:7px}
.metric .v{font-size:25px;font-weight:700;color:var(--mc,var(--ink));line-height:1;letter-spacing:-.02em}
.metric .vs{font-size:11px;color:var(--muted);margin-top:5px}
/* Closed-tab: clickable metric tiles, basis toggle, inline date range, show-all row, per-case metric strip */
.metric.clk{cursor:pointer;border-radius:8px}
.metric.clk:hover{background:var(--surface2)}
.metric.mact{background:var(--accent-wash);box-shadow:inset 0 0 0 1.5px var(--accent)}
.metric .cnt-link{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--ink)}
.metric.clk .cnt-link{color:var(--accent-2)}
.scope-arrow{font-size:11px;color:var(--accent-2);font-weight:800}
.metrics-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:2px 2px 6px}
.ocbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 2px 2px;font-size:11.5px}
.ocbar-lbl{color:var(--muted);font-weight:600;margin-right:2px}
.ocbar-sum{color:var(--muted-2);font-weight:600;margin-left:2px}
.occhip{border:1px solid var(--border2);background:var(--surface);border-radius:12px;padding:2px 10px;font-size:11px;font-weight:700;color:var(--text);cursor:pointer}
.occhip b{font-weight:800}
.occhip:hover{filter:brightness(0.97)}
.occhip.on{box-shadow:0 0 0 2px var(--chrome) inset}
.occhip.oc-repaired{background:#eafaf0;border-color:#bfe6cd;color:#1f7a4d}
.occhip.oc-uu,.occhip.oc-report{background:#eef1f6;border-color:#d4dbe6;color:#3a4a63}
.occhip.clr{background:var(--surface);border-color:var(--border2);color:var(--muted);font-weight:600}
.scope-chip{display:inline-flex;align-items:center;gap:3px;background:var(--accent-wash);color:var(--chrome);border:1px solid #c3e6f5;border-radius:20px;padding:1px 3px 1px 9px;font-weight:700}
.scope-chip button{background:none;border:0;color:var(--chrome);cursor:pointer;font-size:13px;line-height:1;padding:0 3px}
.cldate{border:1px solid var(--border2);border-radius:6px;padding:4px 7px;font:inherit;font-size:11.5px;color:var(--ink);background:var(--surface)}
.cl-dateline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 2px 10px;font-size:11px;color:var(--muted)}
.cl-dateline .cl-sp{flex:1 1 12px}
.cl-dateline .linkbtn{background:none;border:0;color:var(--accent-2);font-size:11px;font-weight:600;cursor:pointer;padding:2px 4px}
.cl-dateline .linkbtn:hover{text-decoration:underline}
.infodot{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--muted);color:var(--muted);font-size:10px;font-weight:800;font-style:italic;font-family:Georgia,'Times New Roman',serif;cursor:help;user-select:none;flex:0 0 auto}
.infodot:hover,.infodot:focus{border-color:var(--accent);color:var(--accent);outline:none}
.showall-row td{padding:0!important;border-bottom:0!important;background:var(--surface)}
.showall-btn{width:100%;background:var(--surface2);border:0;border-top:1px solid var(--border);color:var(--accent-2);font-weight:700;font-size:12px;padding:11px;cursor:pointer;letter-spacing:.01em}
.showall-btn:hover{background:var(--surface3);color:var(--chrome)}
.case-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px 4px;margin-bottom:14px}
.case-metrics .cm{padding:0 14px;border-left:1px solid var(--line)}
.case-metrics .cm:first-child{border-left:0}
.case-metrics .cm-v{font-size:20px;font-weight:700;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.case-metrics .cm-v small{font-size:12px;font-weight:600;color:var(--muted)}
.case-metrics .cm-l{font-size:10.5px;color:var(--muted);margin-top:5px}
/* Executive county bar chart (muted teal ramp: recent -> at-risk -> tail) */
.cc-legend{display:flex;gap:14px;margin-bottom:9px;font-size:10.5px;color:var(--muted)}
.cc-lg{display:inline-flex;align-items:center;gap:5px}
.cc-sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.cc-sw.rec,.cc-seg.rec{background:#bfe0e6}
.cc-sw.atr,.cc-seg.atr{background:#6faeba}
.cc-sw.tail,.cc-seg.tail{background:#2e6b78}
.cc-rows{display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.cc-row{display:flex;align-items:center;gap:9px;cursor:pointer;border-radius:6px;padding:3px 4px}
.cc-row:hover{background:rgba(2,62,82,.05)}
.cc-label{flex:0 0 100px;font-size:11.5px;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-track{flex:1;height:15px;background:var(--surface3);border-radius:4px;display:flex;overflow:hidden;min-width:40px}
.cc-seg{height:100%;cursor:pointer}
.cc-seg:hover{filter:brightness(1.09) saturate(1.1)}
.cc-count{flex:0 0 auto;min-width:30px;text-align:right;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:700}
/* Executive oldest-leaks table: inset the whole table so its row/header lines stop short of the card edges */
#page-p1 .tbl-wrap{padding:0 12px 14px}
#page-p1 table.compact{width:100%}

/* tables - calm, sentence-case header, no zebra */
.tbl-wrap{overflow:auto;border-radius:var(--r2);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
thead th{background:var(--surface3);color:var(--ink);font-weight:700;text-align:left;padding:8px 12px;position:sticky;top:0;z-index:2;white-space:nowrap;font-size:11px;letter-spacing:.02em;text-transform:none;border-bottom:2px solid var(--border2)}
.tbl-soft thead th{background:var(--surface2);color:var(--text);font-weight:600;border-bottom:1px solid var(--line)}   /* softer header (Executive) */
thead th.sortable{cursor:pointer}
thead th.sortable:hover{color:var(--chrome)}
thead th[title]{text-decoration:underline dotted rgba(15,60,80,.28);text-underline-offset:3px}
tbody td{padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:rgba(15,95,116,.05)}
.compact tbody td{padding:5px 12px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.num{font-family:var(--mono);font-size:12px}
.mini{color:var(--muted);font-size:11px}

/* chips */
.agecell{display:inline-flex;align-items:center;gap:8px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;font-family:var(--mono)}
.agecell .amark{width:4px;height:15px;border-radius:2px;background:transparent}
.s30 .amark{background:var(--age-30)} .s60 .amark{background:var(--age-60)} .s90 .amark{background:var(--age-90)}
.ochip{display:inline-flex;align-items:center;gap:7px;font-weight:500;color:var(--text)}
.ochip .sw{width:8px;height:8px;border-radius:50%;flex:none}
.stagechip{display:inline-block;background:var(--surface2);border:0;border-radius:5px;padding:2px 9px;font-size:11px;color:var(--text);font-weight:500}
.tag{display:inline;background:none;border:0;border-radius:0;padding:0;font-size:12.5px;color:var(--text);font-weight:500}
.na{color:var(--muted);font-style:normal}
.concern-ind{display:inline-flex;gap:5px}
.ci{font-size:10px;font-weight:700;border-radius:4px;padding:2px 7px;background:#fbe9f0;color:#a0296a;border:0}

/* segmented buttons */
.btnbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.btnbar .grp-lbl{font-size:11px;font-weight:600;letter-spacing:0;color:var(--muted);text-transform:none;margin-right:8px;min-width:104px}
.controls{background:var(--surface);border-radius:var(--r2);padding:14px 16px;margin-bottom:14px;display:flex;flex-direction:column;gap:11px}
.controls .btnbar{margin-bottom:0}
.seg{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 12px;font-size:12px;font-weight:500;color:var(--text);display:inline-flex;align-items:center;gap:7px;transition:.12s}
.seg:hover{border-color:var(--accent);color:var(--chrome)}
.seg.on{background:var(--chrome);border-color:var(--chrome);color:#fff;font-weight:600}
.seg.on.acc{background:var(--accent);border-color:var(--accent)}
.seg .badge{background:var(--surface2);color:var(--chrome);border-radius:20px;font-size:10.5px;font-weight:700;padding:1px 7px;min-width:20px;text-align:center}
.seg.on .badge{background:rgba(255,255,255,.24);color:#fff}
.seg .sw{width:9px;height:9px;border-radius:50%;flex:none}
.search{border:1px solid var(--border2);border-radius:8px;padding:7px 11px;font-size:12px;min-width:180px;background:var(--surface);font-family:inherit;color:var(--text)}
.filterrow th{position:sticky;top:31px;z-index:1;background:var(--surface2);padding:4px 8px 7px;border-bottom:1px solid var(--border2);vertical-align:top}
.ff{width:100%;min-width:38px;box-sizing:border-box;font-size:10.5px;padding:2px 5px;border:1px solid var(--border2);border-radius:5px;background:var(--surface);color:var(--text);font-family:inherit;font-weight:500}
.ff::placeholder{color:var(--muted-2);font-weight:400}
.ffclear{border:1px solid var(--border2);background:var(--surface);color:var(--muted);border-radius:5px;font-size:12px;line-height:1;padding:3px 7px;cursor:pointer}
.ffclear:hover{color:var(--age-90);border-color:var(--age-90)}
.search:focus{outline:2px solid var(--accent);outline-offset:0}
.link{background:none;border:0;color:var(--accent-2);font-weight:700;font-size:12px;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:1px}
.link:hover{color:var(--chrome)}

/* stacked age profile */
.stack-row{display:grid;grid-template-columns:120px 1fr 56px;gap:14px;align-items:center;margin:10px 0}
.stack-lbl{display:flex;align-items:center;gap:8px;font-weight:500;font-size:12.5px;color:var(--ink)}
.stack-lbl .sw{width:9px;height:9px;border-radius:50%}
.stack{display:flex;height:16px;background:var(--surface3);border-radius:5px;overflow:hidden}
.stack span{height:100%;border-right:2px solid var(--surface)}
.stack span:last-child{border-right:0}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:4px 0 12px}
.legend .it{display:flex;align-items:center;gap:7px}
.legend .sw{width:10px;height:10px;border-radius:3px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(4,30,40,.45);display:none;z-index:40}
.scrim.show{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:490px;max-width:94vw;background:var(--surface);box-shadow:var(--sh2);transform:translateX(100%);transition:transform .24s cubic-bezier(.25,.9,.3,1);z-index:41;display:flex;flex-direction:column}
.drawer.show{transform:translateX(0)}
.drawer.dstack{box-shadow:-18px 0 50px rgba(4,30,40,.4)}
.dback{display:inline-block;margin-bottom:9px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:7px;cursor:pointer}
.dback:hover{background:rgba(255,255,255,.28)}
.rel-ref{color:var(--accent);font-weight:700;cursor:pointer;text-decoration:none}
.rel-ref:hover{text-decoration:underline}
.dhead{background:linear-gradient(180deg,#004a61,#003647);color:#fff;padding:16px 18px;position:relative}
.dhead .r1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.dhead .jref{font-size:15px;font-weight:800}
.dhead .jage{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums}
.dhead .jage small{font-size:12px;font-weight:600;opacity:.8}
.dhead .r2{font-size:12px;color:rgba(255,255,255,.65);margin-top:4px}
.dclose{position:absolute;top:13px;right:15px;background:rgba(255,255,255,.15);border:0;color:#fff;width:28px;height:28px;border-radius:7px;font-size:16px}
.dclose:hover{background:rgba(255,255,255,.28)}
.dbody{overflow:auto;padding:18px}
.dsec{margin-bottom:20px}
.dsec h3{font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:9px;margin-bottom:11px;font-weight:800}
.dsec h3::after{content:"";flex:1;height:1px;background:var(--border2)}
.kv{display:grid;grid-template-columns:132px 1fr;gap:6px 10px;font-size:12.5px}
.kv .k{color:var(--muted);font-weight:600}
.kv .v{color:var(--ink);font-weight:600}
.why-full{background:var(--accent-wash);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:9px 12px;font-size:12.5px;color:var(--chrome);margin-top:8px}
.impact-chips{display:flex;flex-wrap:wrap;gap:7px}
.impact-chips .chip{background:#fbe9f0;color:#a0296a;border:1px solid #f0c6d8;border-radius:20px;padding:3px 11px;font-size:11.5px;font-weight:700}
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--border2)}
.tevent{position:relative;margin-bottom:14px}
.tevent .tdot{position:absolute;left:-19px;top:2px;width:11px;height:11px;border-radius:50%;background:var(--bar);border:2px solid var(--surface)}
.tevent.own .tdot{background:var(--accent)}
.tevent.tcanc .tdot{background:var(--surface);border-color:var(--unavail)}
.tevent.tcanc .tn{color:var(--muted-2)}
.tevent.tcanc .tn s{text-decoration:line-through}
.canc-tag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted-2);background:var(--surface2);border:1px solid var(--border2);border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:middle}
.rr-tag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#8a5a00;background:#fdf1d6;border:1px solid #f0d9a0;border-radius:10px;padding:1px 8px;margin-left:8px;vertical-align:middle}
.agewrap{display:inline-flex;align-items:center;gap:5px}
.rr-mark{color:#b07400;font-weight:800;cursor:help;font-size:12px;line-height:1}
.agewrap .rr-mark{margin-left:0}
.earlier-box{margin:2px 0 6px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);overflow:hidden}
.earlier-box>summary{list-style:none;cursor:pointer;padding:8px 12px;font-size:11.5px;font-weight:700;color:var(--text);user-select:none}
.earlier-box>summary::-webkit-details-marker{display:none}
.earlier-box .eb-tog{display:inline-block;transition:transform .15s;color:var(--muted);font-size:10px}
.earlier-box[open] .eb-tog{transform:rotate(90deg)}
.earlier-box .eb-sum{font-weight:500;color:var(--muted)}
.earlier-body{padding:10px 12px 2px;border-top:1px dashed var(--border2)}
.earlier-body.muted{opacity:.72}
.tl-gap{display:flex;align-items:center;gap:8px;margin:2px 0 10px;color:var(--muted);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.tl-gap::before,.tl-gap::after{content:"";flex:1;border-top:1px dashed var(--border2)}
.tl-gap span{white-space:nowrap}
.rr-tbl td,.rr-tbl th{padding:3px 8px;font-size:11.5px}
.rr-tbl tbody tr{cursor:pointer}
.rr-tbl tbody tr:hover{background:var(--surface2)}
.tevent .td{font-size:11px;color:var(--muted);font-weight:700}
.tevent .tn{font-size:12.5px;color:var(--ink);font-weight:700}
.tevent .tx{font-size:11.5px;color:var(--text)}
.tevent .own-change{background:var(--surface2);border-radius:7px;padding:6px 10px;font-size:11.5px;margin-top:4px}
.tevent .own-change b{color:var(--chrome)}
.hist{width:100%}
.hist td{padding:5px 8px;font-size:11.5px}
.hist .cur{color:var(--accent-2);font-weight:800}
/* drawer enrichment */
.dhead .r3{font-size:11px;color:rgba(255,255,255,.78);margin-top:3px;font-weight:600}
.cd{display:grid;grid-template-columns:118px 1fr;gap:6px 10px;font-size:12.5px}
.cd .k{color:var(--muted);font-weight:600}
.cd .v{color:var(--ink);font-weight:600}
.safety{display:flex;align-items:center;gap:7px;background:#fdecec;color:#b3261e;border:1px solid #f3c0bd;border-radius:8px;padding:7px 11px;font-size:11.5px;font-weight:800;margin-bottom:10px}
.tevent .vmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tevent .vmeta span{font-size:10px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--surface2);color:var(--text);border:1px solid var(--border2);white-space:nowrap}
.tevent .vmeta .who{background:var(--accent-wash);color:var(--chrome);border-color:#c3e6f5}
.tevent .vmeta .vstat.ccbad{background:#fdecec;color:#b3261e;border-color:#f3c0bd}
.tevent .vmeta .vstat.cccan{background:#fff2d9;color:#7a3d00;border-color:#f3d38a}
.tevent .vmeta .vco{background:#fff2e6;color:#8a4b00;border-color:#f2d0a8}
.tevent .vreason{font-size:11px;color:var(--age-60);margin-top:3px;font-weight:600}
/* expandable SA / work-order description (one line, click to expand) */
.tdesc{margin-top:5px;background:var(--surface2);border:0;border-radius:6px;padding:5px 22px 5px 9px;font-size:11.5px;color:var(--text);cursor:pointer;position:relative;line-height:1.45}
.tdesc .dl{font-size:8.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:5px}
.tdesc .dpart{display:block}
.tdesc .dpart+.dpart{margin-top:4px}
.tdesc-clamp{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;width:100%}
.tdesc.exp .tdesc-clamp{display:block;-webkit-line-clamp:unset;overflow:visible;white-space:pre-wrap}
.tdesc::after{content:"\25B8";position:absolute;top:6px;right:9px;color:var(--muted-2);font-size:10px;transition:transform .15s}
.tdesc.exp::after{transform:rotate(90deg)}
.tdesc:hover{background:var(--surface3)}
.closebox{margin-top:9px;background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;padding:8px 0 0}
.close-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.close-lbl{font-size:8.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.close-status{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--surface3);color:var(--ink)}
.close-status.cs-further{background:#fde2c8;color:#8a3d0a}
.close-conflict{font-size:9px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:10px;background:#fff3d6;color:#8a5a00;margin-left:6px}
.close-status.cs-done{background:#d6efe0;color:#0b6b43}
.close-status.cs-private{background:#e4e1f7;color:#3b3184}
.close-status.cs-nonuu{background:#e7ebef;color:#41525f}
.close-line{font-size:11.5px;color:var(--text);margin-top:4px}
.close-k{font-size:8.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.closebox .tdesc{margin-top:4px;background:transparent;border-radius:0;padding:1px 18px 1px 0}
.closebox .tdesc::after{top:1px;right:2px}
.closebox .tdesc:hover{background:transparent}
.closebox .tdesc:hover .dl{color:var(--accent)}
.tevent .handover{font-size:9px;font-weight:800;color:var(--own-contractor);background:#e6f7f8;border:1px solid #bfe9ec;border-radius:10px;padding:1px 7px;margin-left:5px;text-transform:uppercase;letter-spacing:.04em}
.nomove-note{margin-top:6px;padding:8px 12px;background:#fdecec;border:1px solid #f3c0bd;border-radius:8px;font-size:11.5px;color:var(--age-90);font-weight:600}
/* "no activity for X days" footer under the activity line */
.act-note{margin-top:8px;padding:8px 12px;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;font-size:11.5px;color:var(--text);font-weight:600}
.act-note.red{background:#fdecec;border-color:#f3c0bd;color:var(--age-90)}
.act-note.done{background:#eafaf0;border-color:#bfe6cd;color:#1f7a4d}
.tl-closed{display:flex;align-items:center;gap:9px;margin-top:12px;padding:9px 12px;background:#eef2fb;border:1px solid #024E43;border-left-width:3px;border-radius:8px;font-size:12px;color:#024E43}
.tl-closed .tl-cdot{width:10px;height:10px;border-radius:50%;background:#024E43;flex:none;box-shadow:0 0 0 3px #024e4322}
.tl-closed .tl-ctext{line-height:1.45}
/* scheduled / planned (not-yet-done) appointments - shown apart from the activity line, never as "today" dots */
/* section -> card (no outer panel). The appointment itself is the only card boundary. */
.up-sec{margin-top:14px}
.up-h{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.up-item{background:var(--surface);border:1px solid var(--border2);border-left:3px solid var(--bar);border-radius:6px;padding:6px 10px;margin-bottom:5px}
.up-item.own{border-left-color:var(--accent)}
.up-item.superseded{border-left-color:#b0b7c3;background:var(--surface2);opacity:.85}
.up-item.superseded .up-title{text-decoration:line-through;color:var(--muted)}
.up-superseded{font-size:11px;font-weight:600;color:#8a5a00;background:#fdf1d6;border:1px solid #f0d9a0;border-radius:6px;padding:4px 8px;margin-top:5px;line-height:1.4}
.up-item:last-child{margin-bottom:0}
.up-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.up-title{font-size:12px;font-weight:700;color:var(--ink);line-height:1.2}
.up-when{font-size:10.5px;font-weight:600;color:var(--chrome);white-space:nowrap;flex:none}
.up-when.past{color:var(--age-60);font-weight:700}
.up-when.none{color:var(--muted-2);font-style:italic}
/* pills: one uniform height / radius / alignment; type & status distinguished by fill+border only */
.up-meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:5px}
.up-meta .pill{font-size:10px;font-weight:700;height:16px;padding:0 8px;border-radius:8px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);white-space:nowrap;display:inline-flex;align-items:center}
.up-meta .pill.who{background:var(--accent-wash);color:var(--chrome);border-color:#c3e6f5}
.up-meta .pill.st{background:#eef1f6;color:#3a4a63;border-color:#d4dbe6}
.up-meta .pill.st.disp{background:#fff2d9;color:#7a3d00;border-color:#f3d38a}
.up-meta .pill.co{background:#fff2e6;color:#8a4b00;border-color:#f2d0a8}
.up-raised{font-size:10px;color:var(--muted-2);font-weight:600;margin-left:auto}
.up-cx{margin-top:12px}
.up-cxrow{padding:4px 2px;border-top:1px solid var(--border2);display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.up-cxrow:first-of-type{border-top:0}
.up-cxrow .cx-t{font-size:11.5px;font-weight:600;color:var(--muted-2);text-decoration:line-through}

/* modal */
.modal{position:fixed;inset:0;background:rgba(4,30,40,.5);display:none;align-items:center;justify-content:center;z-index:50}
.modal.show{display:flex}
.modal .box{background:var(--surface);border-radius:var(--r2);max-width:660px;width:92%;max-height:82vh;overflow:auto;padding:22px 26px;box-shadow:var(--sh2)}
.modal .box.cfgwide{max-width:900px}
.cfg-tabs{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0 12px}
.cfg-sec{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin:10px 0;background:var(--surface)}
.cfg-sec>h3{font-size:12.5px;margin:0 0 6px;color:var(--ink);font-weight:800}
.cfg-sec .hint{font-size:11px;color:var(--muted);font-weight:400;margin:0 0 8px;line-height:1.45}
.cfg-row{display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap}
.cfg-row>label{font-size:11.5px;color:var(--text);min-width:120px}
.cfg select,.cfg input[type=text],.cfg input[type=number]{font:inherit;font-size:11.5px;padding:4px 6px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--ink)}
.cfg select{max-width:250px}
.cfg input[type=number]{width:64px}
.map-grid{display:grid;grid-template-columns:1fr 18px minmax(150px,220px);gap:5px 8px;align-items:center;max-height:250px;overflow:auto;padding:8px 10px;background:var(--surface2);border-radius:8px;margin-top:4px}
.map-grid .mh{font-size:9.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;position:sticky;top:0;background:var(--surface2);padding:2px 0 5px;border-bottom:1px solid var(--border)}
.map-grid .k{font-size:11.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map-grid .k.u{color:var(--age-90);font-weight:700}
.map-grid .arrow{color:var(--muted-2);text-align:center;font-size:12px}
.cfg-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:sticky;bottom:-22px;background:var(--surface);padding:11px 0 3px;border-top:1px solid var(--border)}
.cfg-count{color:var(--muted-2)}
.rawwrap{max-height:340px;overflow:auto;border:1px solid var(--border);border-radius:8px;margin:8px 0}
.rawtbl{border-collapse:collapse;font-size:10.5px;white-space:nowrap}
.rawtbl th,.rawtbl td{border:1px solid var(--border-2);padding:3px 7px;text-align:left;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.rawtbl thead th{position:sticky;top:0;background:var(--surface3);color:var(--ink);font-weight:700;z-index:1}
.rawtbl .rnum{color:var(--muted-2);text-align:right;position:sticky;left:0;background:var(--surface2)}
.rawtbl td.rblank{background:var(--surface2);color:var(--muted-2)}
/* derived columns appended to the raw grid - visually set apart from the source columns */
.rawtbl thead th.dcol{background:var(--chrome);color:#fff;border-color:var(--chrome)}
.rawtbl thead th.dcol.sa{background:var(--accent-2)}
.rawtbl td.dcell{background:var(--accent-wash);color:var(--ink);font-weight:700}
.rawtbl th.dstart,.rawtbl td.dstart{border-left:3px solid var(--chrome)}
.derived-panel{margin-top:14px;background:var(--accent-wash);border:1px solid #c3e6f5;border-radius:10px;padding:12px 14px}
.derived-panel h3{font-size:12.5px;margin:0 0 8px;color:var(--chrome)}
.dertbl{border-collapse:collapse;width:100%;font-size:11.5px}
.dertbl th{text-align:left;color:var(--muted);font-weight:600;font-size:10.5px;padding:3px 8px;border-bottom:1px solid var(--border)}
.dertbl td{padding:4px 8px;border-bottom:1px solid var(--border-2);vertical-align:top}
.dertbl .df{font-weight:700;color:var(--ink);white-space:nowrap}
.dertbl .dv{color:var(--ink);white-space:nowrap}
.dertbl .dh{color:var(--muted);font-size:10.5px}
.vcols{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:2px 12px;max-height:180px;overflow:auto;padding:8px 10px;background:var(--surface2);border-radius:8px}
.vcol{font-size:11px;color:var(--ink);display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.vtext{width:100%;height:120px;margin-top:8px;font:11px/1.4 ui-monospace,Consolas,monospace;border:1px solid var(--border2);border-radius:6px;padding:6px;white-space:pre;overflow:auto;background:var(--surface);color:var(--ink)}
/* owner "derive from logic" rule cards (Config -> Current owner) */
.rulecards{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.rulecard{border:1px solid var(--border2);border-left:3px solid var(--chrome);border-radius:8px;padding:8px 11px;background:var(--surface2)}
.rulecard .rc-h{font-size:12.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px}

function buildLeaks(){

    const sh=set.filter(isHigh).length;
    const old=set.length?Math.max(...set.map(x=>effAge(x))):0;

    return `<div class="ocard" style="--oc:${OWNER_VAR[o]}" data-owner="${o}" title="${TIP.rate}">

  /* hero card: overdue-of-active headline (left) + who-owns-overdue (right, subtle bg) */

        <span style="font-size:18px;color:var(--muted);font-weight:600">overdue of ${fmtN(cnt(list))} open</span>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-top:7px">Overdue = open for more than ${T_OVERDUE} days</div>
      <div style="font-size:13px;color:var(--muted);margin-top:5px">${pct(cnt(overdue),cnt(list))} of the active book &middot; ${fmtN(bh)} aged &gt;${T_HIGH} days</div>
      <span class="link" style="margin-top:11px;align-self:flex-start">View overdue cases &rarr;</span>
    </div>
    <div style="flex:1;background:var(--surface2);border-left:1px solid var(--line);padding:14px 22px;display:flex;flex-direction:column;justify-content:center">
      <div class="sec-title">Who owns these overdue ${noun}?</div>
      <div class="sec-sub">click a tile to open that owner's overdue cases</div>
      <div class="owner-row" style="margin-top:10px">${oc}</div>
    </div>
  </div>`;
  /* ---- bottom row: narrowed oldest-overdue table (left, under Overdue cases) + county age-band chart (right, under the owner breakdown) ---- */
  const oldestRows=[...list.filter(isOverdue)].sort((a,b)=>effAge(b)-effAge(a)).slice(0,20);
  const cAgg={};
  list.forEach(l=>{ const key=l.county||'__unclear__'; const a=(cAgg[key]=cAgg[key]||{recent:0,atrisk:0,tail:0,total:0}); const band=isHigh(l)?'tail':(isOngoing(l)?'atrisk':'recent'); a[band]++; a.total++; });
  const cRows=Object.keys(cAgg).map(k=>({key:k,label:k==='__unclear__'?'County unclear':k,...cAgg[k]})).sort((a,b)=>b.total-a.total);
  const cMax=Math.max(1,...cRows.map(r=>r.total));
  const seg=(r,cls,band,n,lbl)=>n?`<span class="cc-seg ${cls}" style="width:${(n/cMax*100).toFixed(2)}%" data-ccounty="${esc(r.key)}" data-cband="${band}" title="${esc(r.label)} · ${lbl}: ${n} &mdash; click to filter Open Cases"></span>`:'';
  const bottomRow=`<div class="card" style="display:flex;overflow:hidden">
    <div style="flex:0 0 42%;display:flex;flex-direction:column;min-width:0">
      <div style="padding:12px 16px 8px"><div class="sec-title">Oldest Overdue Leaks</div><div class="sec-sub">Most-aged open ${noun} &mdash; top ${oldestRows.length}, oldest first</div></div>
      <div class="tbl-wrap tbl-soft" style="max-height:44vh;border-top:1px solid var(--line)"><table class="compact"><thead><tr>
        <th>Case #</th><th>County</th><th class="num" title="Current-problem age - re-raised cases show a marker; hover the value for case age">Age</th><th class="num">Visits</th><th>Customer concern</th>
      </tr></thead><tbody>
        ${oldestRows.map(x=>`<tr data-jid="${x.id}"><td><b>${esc(x.ref)}</b></td><td>${countyLabel(x.county)}</td><td class="num">${agecellDual(x)}</td><td class="num tnum">${visitsCell(x)}</td><td>${concernCell(x)}</td></tr>`).join('')||`<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:18px">No overdue ${noun}.</td></tr>`}
      </tbody></table></div>
    </div>
    <div style="flex:1;background:var(--surface);border-left:1px solid var(--line);padding:12px 18px;min-width:0;display:flex;flex-direction:column">
      <div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:9px">
        <div><div class="sec-title">Open cases by county</div><div class="sec-sub">by age band &mdash; click a county, or a segment for that age</div></div>
        <button class="seg acc" data-goleague="1" style="margin-left:auto;white-space:nowrap" title="Go to the Open Cases tab showing every open leak">All open leaks <span class="badge">${fmtN(list.length)}</span> &rarr;</button>
      </div>
      <div class="cc-legend"><span class="cc-lg"><i class="cc-sw rec"></i>Recent &le;14d</span><span class="cc-lg"><i class="cc-sw atr"></i>At-Risk 15-60d</span><span class="cc-lg"><i class="cc-sw tail"></i>Tail &gt;60d</span></div>
      <div class="cc-rows">
        ${cRows.map(r=>`<div class="cc-row" data-ccounty="${esc(r.key)}" title="${esc(r.label)} &mdash; ${r.total} open (recent ${r.recent} / at-risk ${r.atrisk} / tail ${r.tail}) &mdash; click to open in Open Cases">
          <div class="cc-label">${esc(r.label)}</div>
          <div class="cc-track">${seg(r,'rec','recent',r.recent,'Recent (&le;14d)')}${seg(r,'atr','atrisk',r.atrisk,'At-Risk (15-60d)')}${seg(r,'tail','tail',r.tail,'Tail (&gt;60d)')}</div>
          <div class="cc-count">${r.total}</div>
        </div>`).join('')||`<div class="sec-sub">No open ${noun}.</div>`}
      </div>
    </div>
  </div>`;

  document.getElementById('page-p1').innerHTML=heroCard+bottomRow;

  const goOv=document.querySelector('#page-p1 [data-go-overdue]'); if(goOv)goOv.onclick=()=>openLeague({view:'overdue',owner:'all',county:'all',stage:'all'});
  document.querySelectorAll('#page-p1 .ocard[data-owner]').forEach(c=>c.onclick=()=>openLeague({view:'overdue',owner:c.dataset.owner,county:'all',stage:'all'}));
  document.querySelectorAll('#page-p1 tbody tr').forEach(r=>{const j=r.dataset.jid; if(j)r.onclick=()=>openDrawer(+j);});
  const glb=document.querySelector('#page-p1 [data-goleague]'); if(glb)glb.onclick=()=>openLeague({view:'all',owner:'all',county:'all',stage:'all'});
  const bandView={recent:'within',atrisk:'ongoing',tail:'high'};
  document.querySelectorAll('#page-p1 .cc-row').forEach(r=>r.onclick=()=>openLeague({view:'all',county:r.dataset.ccounty,owner:'all',stage:'all'}));
  document.querySelectorAll('#page-p1 .cc-seg').forEach(s=>s.onclick=e=>{e.stopPropagation();openLeague({view:bandView[s.dataset.cband]||'all',county:s.dataset.ccounty,owner:'all',stage:'all'});});
  syncExecTableHeight();
  if(!window._execResizeBound){ window._execResizeBound=true; window.addEventListener('resize',()=>{ if(state.page==='p1')syncExecTableHeight(); }); }
}

/* ================= PAGE 2 - Reported Leaks by Stage ================= */
function renderStage(){
  const base=unit(active());
  const owner=state.stageOwner||'all';
  const act=owner==='all'?base:base.filter(x=>x.owner===owner);
  const totAct=act.length;
  const byAge=!!state.stageByAge;
  const unitLbl=state.lens==='leaks'?'open leaks':'active cases';
  /* Active-by-age strip (moved here from the Executive tab) */
  const awithin=act.filter(isRecent).length, aong=act.filter(isOngoing).length, atail=act.filter(isHigh).length, atot=act.length||1, asegp=n=>n?Math.max(2.5,n/atot*100):0;
  const ageStrip=`<div class="card" style="padding:9px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
    <div style="font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap">${unitLbl.charAt(0).toUpperCase()+unitLbl.slice(1)} by age${owner!=='all'?' &mdash; '+OWNER_LABEL[owner]:''}</div>
    <div class="hbar" style="flex:1;min-width:200px;height:10px">
      <span style="width:${asegp(awithin)}%;background:var(--age-within)" title="&le;${T_OVERDUE}d: ${awithin}"></span>
      <span data-hero="ongoing" style="width:${asegp(aong)}%;background:var(--age-30);cursor:pointer" title="${T_OVERDUE+1}-${T_HIGH}d: ${aong}"></span>
      <span data-hero="high" class="hatch" style="width:${asegp(atail)}%;cursor:pointer" title="&gt;${T_HIGH}d: ${atail}"></span>
    </div>
    <div style="font-size:11.5px;color:var(--muted);white-space:nowrap">&le;${T_OVERDUE}: <b>${awithin}</b> &middot; ${T_OVERDUE+1}-${T_HIGH}: <b>${aong}</b> &middot; &gt;${T_HIGH}: <b>${atail}</b></div>
  </div>`;
  const stageMax=Math.max(...ACTIVE_STAGES.map(s=>act.filter(l=>l.stage===s).length),1);
  const bandCols=['var(--age-within)','var(--age-30)','var(--age-90)'];
  const ageBands=leaks=>[leaks.filter(isRecent).length,leaks.filter(isOngoing).length,leaks.filter(isHigh).length];
  const stageRows=ACTIVE_STAGES.map((s,i)=>{
    const inS=act.filter(l=>l.stage===s);const n=inS.length;
    const w=n/stageMax*100;
    let bar;
    if(byAge&&n){ const b=ageBands(inS); bar=b.map((v,j)=>v>0?`<span style="width:${v/n*100}%;background:${bandCols[j]}" title="${v}"></span>`:'').join(''); }
    else { bar=`<span style="width:100%;background:var(--bar)"></span>`; }
    return `<div class="stagerow" data-stage="${s}">
      <div class="stagenm"><span class="n">${i+1}</span>${s}</div>
      <div style="display:flex;align-items:center;gap:10px"><div class="stagebar" style="width:${Math.max(6,w)}%">${bar}</div></div>
      <div class="stagecount">${n}<span class="pc">${pct(n,totAct)}</span></div>
    </div>`;}).join('');
  const obtns=['all',...OWNERS].map(o=>`<button class="seg ${owner===o?'on':''}" data-stowner="${o}">${o!=='all'?`<span class="sw" style="background:${OWNER_VAR[o]}"></span>`:''}${o==='all'?'All owners':OWNER_LABEL[o]}</button>`).join('');
  const modeBtns=`<button class="seg ${!byAge?'on':''}" data-stagemode="count">By count</button><button class="seg ${byAge?'on':''}" data-stagemode="age">By age</button>`;
  const ageLegend=byAge?`<div class="legend" style="margin-top:11px"><span class="it"><span class="sw" style="background:var(--age-within)"></span>&le;${T_OVERDUE}d</span><span class="it"><span class="sw" style="background:var(--age-30)"></span>${T_OVERDUE+1}-${T_HIGH}d</span><span class="it"><span class="sw" style="background:var(--age-90)"></span>&gt;${T_HIGH}d</span></div>`:'';
  const stageCard=`<div class="card pad"><div class="sec-title">Cases by stage${owner!=='all'?' &mdash; '+OWNER_LABEL[owner]:''}</div>
    <div class="sec-sub">${fmtN(totAct)} ${unitLbl}${owner!=='all'?' owned by '+OWNER_LABEL[owner]:''} across the five process stages &mdash; count and share of the current book.</div>
    <div class="btnbar" style="margin-top:10px"><span class="grp-lbl">Owner</span>${obtns}</div>
    <div class="btnbar" style="margin-bottom:2px"><span class="grp-lbl">Bars</span>${modeBtns}</div>
    ${ageLegend}
    <div style="margin-top:6px">${stageRows}</div>
    <div class="note">Stage shares are computed against the current book (stages 1-5). Stage is independent of ownership - a repair may be UU (Field) or a partner. Click a stage bar to open the Open Cases tab filtered to that stage${owner!=='all'?' and owner':''}.</div></div>`;

  document.getElementById('page-p2').innerHTML=
    `<div class="pagehead">By Stage</div><div class="pagehead-sub">How many ${unitLbl} sit at each process stage. Filter by owner, and switch the bars to an age breakdown.</div>`+
    ageStrip+stageCard;

  document.querySelectorAll('#page-p2 [data-stowner]').forEach(b=>b.onclick=()=>{state.stageOwner=b.dataset.stowner;renderStage();});
  document.querySelectorAll('#page-p2 [data-stagemode]').forEach(b=>b.onclick=()=>{state.stageByAge=(b.dataset.stagemode==='age');renderStage();});
  document.querySelectorAll('#page-p2 [data-hero]').forEach(s=>s.onclick=()=>openLeague({view:s.dataset.hero,owner:state.stageOwner||'all',county:'all',stage:'all'}));
  document.querySelectorAll('#page-p2 [data-stage]').forEach(r=>r.onclick=()=>openLeague({view:'oldest50',owner:state.stageOwner||'all',county:'all',stage:r.dataset.stage}));
}

/* ================= PAGE 3 - Overdue Leaks League Table ================= */
function lgbase(){
  let l=active();
  if(state.lgowner!=='all')l=l.filter(x=>x.owner===state.lgowner);
  if(state.lgcounty!=='all')l=l.filter(x=>(x.county||'__unclear__')===state.lgcounty);
  if(state.lgstage!=='all')l=l.filter(x=>x.stage===state.lgstage);
  return unit(l);   /* dual lens: one row per leak, or every case. Class filter applied in renderLeague (so class badges can count). */
}
/* count a view without sorting or allocating an array (used for the button badges) */
function viewCount(l,v){let n=0;for(const x of l){
  if(v==='oldest50'||v==='all'){n++;}
  else if(v==='within'){if(effAge(x)<=T_OVERDUE)n++;}
  else if(v==='overdue'){if(isOverdue(x))n++;}
  else if(v==='ongoing'){if(isOngoing(x))n++;}
  else if(v==='high'){if(isHigh(x))n++;}
  else if(v==='nomove'){if(x.lastAction>T_NOMOVE)n++;}
  else if(v==='concern'){if(x.concern&&isOverdue(x))n++;}
  else if(v==='ex_nosa'){if(x.exNoSA)n++;}
  else if(v==='ex_nostart'){if(x.exNoStart)n++;}
  else if(v==='ex_jeopardy'){if(x.exJeopardy)n++;}
  else if(v==='ex_reinstate'){if(x.exReinstate)n++;}
} return n;}
function renderLeague(){
  const base=lgbase();
  /* primary views: three age bands, MULTI-SELECT (click to toggle). Overdue = 15-60 and >60 both on. "All active" = none selected. */
  const bands=Array.isArray(state.lgbands)?state.lgbands:[];
  const bandOn=k=> k==='all'? bands.length===0 : bands.includes(k);
  const pvbtn=(k,lbl)=>`<button class="seg ${bandOn(k)?'on':''}" data-view="${k}">${lbl}<span class="badge">${viewCount(base,k)}</span></button>`;
  const pvbtns=pvbtn('within','Recent &lt;'+T_OVERDUE+'d')+pvbtn('ongoing','At-Risk '+(T_OVERDUE+1)+'-'+T_HIGH+'d')+pvbtn('high','Tail &gt;'+T_HIGH+'d')+pvbtn('all','All active');
  const obtns=['all',...OWNERS].map(o=>`<button class="seg ${state.lgowner===o?'on':''}" data-owner="${o}">${o!=='all'?`<span class="sw" style="background:${OWNER_VAR[o]}"></span>`:''}${o==='all'?'All':OWNER_LABEL[o]}</button>`).join('');
  const mainC=MAIN_COUNTIES.filter(c=>COUNTIES.includes(c)); const quickC=mainC.length>=2?mainC:COUNTIES;
  const cbtns=['all',...quickC].map(c=>`<button class="seg ${state.lgcounty===c?'on':''}" data-county="${esc(c)}">${c==='all'?'All counties':esc(c)}</button>`).join('');

  let rows=bands.length?base.filter(x=>bands.some(b=>b==='within'?isRecent(x):b==='ongoing'?isOngoing(x):b==='high'?isHigh(x):false)):base;
  if(state.lgsearch){const q=state.lgsearch.toLowerCase();rows=rows.filter(x=>x.ref.toLowerCase().includes(q)||(x.county||'').toLowerCase().includes(q));}
  /* per-column header filters (county/owner/stage reuse the existing filter state applied in lgbase; these are the extra columns) */
  const CF=state.colf||{};
  if(CF.ref){const q=CF.ref.toLowerCase();rows=rows.filter(x=>String(x.ref||'').toLowerCase().includes(q));}
  if(CF.ptype)rows=rows.filter(x=>String(x.problemReason||'')===CF.ptype);
  if(CF.pcls)rows=rows.filter(x=>CF.pcls==='none'?!x.pclass:x.pclass===CF.pcls);
  if(CF.sec)rows=rows.filter(x=>String(x.secWorktype||'')===CF.sec);
  if(CF.ageMin!==''&&CF.ageMin!=null&&!isNaN(+CF.ageMin))rows=rows.filter(x=>effAge(x)>=+CF.ageMin);
  if(CF.idleMin!==''&&CF.idleMin!=null&&!isNaN(+CF.idleMin))rows=rows.filter(x=>(x.sinceActivity||0)>=+CF.idleMin);
  if(CF.visitsMin!==''&&CF.visitsMin!=null&&!isNaN(+CF.visitsMin))rows=rows.filter(x=>(x.visits||0)>=+CF.visitsMin);
  if(CF.concern==='y')rows=rows.filter(x=>x.concern);else if(CF.concern==='n')rows=rows.filter(x=>!x.concern);
  if(state.lgsort){const K=state.lgsort; const sv=x=>K==='currentAge'?effAge(x):x[K];   /* the Age column sorts on the CURRENT-problem age (what the cell shows), not raw case age */
    rows=[...rows].sort((a,b)=>{let av=sv(a),bv=sv(b);if(typeof av==='string')return state.lgdir*av.localeCompare(bv);return state.lgdir*(av-bv);});}
  else {rows=[...rows].sort((a,b)=>effAge(b)-effAge(a));}   /* default order: most-aged CURRENT problem first (matches the displayed age; a re-raise sits by its live age, not its old case age) */
  const matched=rows.length;                                   /* rows in this view after search, before the row cap */
  const cap=state.lgall?Math.min(matched,LG_MAX):50;           /* "Show all" lifts the 50-cap (LG_MAX safety ceiling) */
  const capped=state.lgall&&matched>LG_MAX;
  rows=rows.slice(0,cap);

  const gl='<span class="grp-lbl" style="min-width:auto;margin-right:7px">';
  const head=`<div class="pagehead">Open Cases</div>
    <div class="controls">
      <div class="btnbar">
        ${gl}Show</span>${pvbtns}
        <span style="width:1px;height:20px;background:var(--line);margin:0 6px"></span>
        ${gl}Owner</span>${obtns}
      </div>
      <div class="btnbar">
        ${gl}County</span>${cbtns}
        <span style="flex:1;min-width:12px"></span>
        <input class="search" id="lgsearch" placeholder="Search case or county" value="${esc(state.lgsearch)}"/>
        <button class="seg ${state.lgall?'on':''}" id="lgall" title="Show every case in this view instead of only the top 50">${state.lgall?'Showing all ▪':'Show all rows'}</button>
        <button class="seg" id="lgrestore">Restore</button>
      </div>
    </div>`;

  const th=(lbl,key,cls,ttl)=>`<th class="${cls||''} ${key?'sortable':''}"${ttl?` title="${ttl}"`:''} ${key?`data-sort="${key}"`:''}>${lbl}${state.lgsort===key?(state.lgdir<0?' ▾':' ▴'):''}</th>`;
  /* per-column filter row (sits under the sortable headers) */
  const ptypes=[...new Set(active().map(x=>x.problemReason).filter(Boolean))].sort();
  const sectypes=[...new Set(active().map(x=>x.secWorktype).filter(Boolean))].sort();
  const fopt=(v,lb,cur)=>`<option value="${esc(v)}"${String(v)===String(cur)?' selected':''}>${esc(lb)}</option>`;
  const fnum=(key,ths,unit)=>`<select class="ff" data-cf="${key}"><option value="">Any</option>${ths.map(n=>`<option value="${n}"${String(CF[key]||'')===String(n)?' selected':''}>≥${n}${unit||''}</option>`).join('')}</select>`;
  const filterRow=`<tr class="filterrow">`
    +`<th><button class="ffclear" id="lgClearF" title="Clear all filters (columns, county/owner/stage and search)">&times;</button></th>`
    +`<th><input class="ff" data-cf="ref" placeholder="find…" value="${esc(CF.ref||'')}"></th>`
    +`<th><select class="ff" data-lgf="county"><option value="all">All</option>${COUNTIES.map(c=>fopt(c,c,state.lgcounty)).join('')}${fopt('__unclear__','Unclear',state.lgcounty)}</select></th>`
    +`<th><select class="ff" data-cf="ptype"><option value="">All</option>${ptypes.map(p=>fopt(p,p,CF.ptype||'')).join('')}</select></th>`
    +`<th><select class="ff" data-cf="pcls"><option value="">All</option>${['P1','P2'].map(k=>fopt(k,PCLASS_LABEL[k],CF.pcls||'')).join('')}${fopt('none','None',CF.pcls||'')}</select></th>`
    +`<th><select class="ff" data-cf="sec"><option value="">All</option>${sectypes.map(p=>fopt(p,p,CF.sec||'')).join('')}</select></th>`
    +`<th>${fnum('ageMin',[14,30,60,90,180,365],'d')}</th>`
    +`<th>${fnum('idleMin',[7,14,30,60,90,180],'d')}</th>`
    +`<th><select class="ff" data-lgf="owner"><option value="all">All</option>${OWNERS.map(o=>fopt(o,OWNER_LABEL[o],state.lgowner)).join('')}</select></th>`
    +`<th><select class="ff" data-lgf="stage"><option value="all">All</option>${ACTIVE_STAGES.map(sg=>fopt(sg,sg,state.lgstage)).join('')}</select></th>`
    +`<th>${fnum('visitsMin',[2,3,5,10,20],'')}</th>`
    +`<th><select class="ff" data-cf="concern"><option value="">Any</option>${fopt('y','With',CF.concern||'')}${fopt('n','Without',CF.concern||'')}</select></th>`
    +`</tr>`;
  const table=`<div class="tbl-wrap" style="max-height:calc(100vh - 300px);margin-top:16px;border:1px solid var(--border)"><table class="compact"><thead><tr>
    <th class="num">#</th>${th('Leak','ref')}<th>County</th><th>Leak type</th>${th('P1/P2','pRank',null,'P1/P2 from the UU field investigation work type (Internal line, live appointment). A cancelled or lapsed investigation reads - (not P1/P2). Separate from Leak size (volume band).')}<th>Secondary work type</th>${th('Age','currentAge','num',TIP.age)}<th class="num sortable" title="Days since last activity (last visit, SA raised, or case-history update)" data-sort="sinceActivity">Idle${state.lgsort==='sinceActivity'?(state.lgdir<0?' ▾':' ▴'):''}</th><th>Current owner</th><th>Current stage</th>${th('Visits','visits','num','Field visits (service appointments) recorded on the case')}<th>Customer concern</th>
  </tr>${filterRow}</thead><tbody>
    ${rows.map((x,i)=>`<tr data-jid="${x.id}">
      <td class="num mini">${i+1}</td>
      <td><b>${esc(x.ref)}</b></td>
      <td>${countyLabel(x.county)}</td>

/* ================= PAGE 5 - Closed Cases ================= */
/* completed visits on a case = attended visits with a completing status; drives the Completed-visits metric + per-case strip */
function completedVisits(l){ const vl=l.visitLog||[]; if(vl.length){ const c=(CONFIG.completedStatuses||[]).map(s=>String(s).toLowerCase()); const cs=(CONFIG.metricsFromSubCase&&l.reRaised&&l.currentStart!=null)?l.currentStart:0; return vl.filter(v=>v.occurred&&c.indexOf(String(v.status||'').toLowerCase())>=0&&(v.actTs==null||v.actTs>=cs)).length; } return l.visits||0; }   /* re-raised: count within the current episode; thin synthetic closures (no visit log) use the recorded visit count */
function visitsCell(x){ if(x.visits==null)return '<span class="na">-</span>'; const rr=(x.reRaised&&x.caseVisits!=null&&x.caseVisits!==x.visits); return rr?('<span title="Current problem: '+x.visits+' - whole case: '+x.caseVisits+'">'+x.visits+' <span class="rr-mark">&#8635;</span></span>'):String(x.visits); }   /* re-raised cases show the current-problem count + whole-case on hover */

function ensureClosedDates(){   /* default Closed-tab / Trends-baseline window = the last N months (formal-closure floor -> extract), so the biased pre-floor tail is out of the default view */
  if(typeof AS_OF!=='undefined' && AS_OF){
    if(!state.clTo)state.clTo=isoDate(AS_OF);
    if(!state.clFrom){ const f=closedFloorTs(); state.clFrom=f?isoDate(new Date(f)):'2026-01-01'; }
  } else if(!state.clFrom){ state.clFrom='2026-01-01'; } }
function resetClosedWindow(){ state.clFrom=''; state.clTo=''; ensureClosedDates(); }   /* force back to the default last-N-months window */
function floorWarnHtml(fromIso){   /* conditional - shows ONLY when the selected window reaches BEFORE the formal-closure floor */
  const f=closedFloorTs(); if(f==null||!fromIso)return '';
  if(Date.parse(fromIso) >= f - MS)return '';

function renderClosed(){
  ensureClosedDates();
  const resAll=resolvedLeaks();   /* the LIST shows every closure; the lens applies to the metric strip only (below) */
  if(!resAll.length){ document.getElementById('page-p5').innerHTML='<div class="pagehead">Closed Cases</div><div class="pagehead-sub">Closed customer-leak cases from the same extract (closed within ~6 months).</div><div class="card pad" style="text-align:center;color:var(--muted);padding:40px 20px">No closed cases in the loaded extract. Closed cases appear here automatically when the extract contains them (D_CASE_OPEN_CLOSED = Closed).</div>'; return; }

  /* per-case helpers: outcome bucket, resolution value (report to last activity), resolution-speed band */
  const oc=l=> (!(l.hasWO||l.hasSA))?'report' : (isRepaired(l)?'repaired':'uu');   /* No repair (uu) absorbs the 'went cold' cases (abandoned / stalled) - counted the same as any case closed without a repair (they are closure-hygiene noise, not a distinct outcome; their resolution runs report -> last activity as they carry no proper close date, and they are excluded from the repaired-only resolution tile just like every No-repair case). Repaired = a genuine COMPLETED repair; Report-only = no work order / SA. */

  const bandOf=l=>{const x=rv(l); return x<=7?'le7':x<=30?'8-30':x<=60?'31-60':'gt60';};

  /* ================= one filter pipeline drives BOTH the metric strip and the table ================= */
  const CF=state.clcolf||{};
  const dfield='closed'; state.clDateField='closed';   /* Closed tab filters on close date only (Created option removed 2026-09-16) */
  const dts=l=> l.closedTs;
  const fFrom=state.clFrom?Date.parse(state.clFrom):NaN, fTo=state.clTo?Date.parse(state.clTo)+MS-1:NaN;
  function crossFilter(list){
    let r=list;
    if(state.clcounty&&state.clcounty!=='all')r=r.filter(l=> state.clcounty==='__unclear__'? !l.county : l.county===state.clcounty);
    if(state.clLand==='public')r=r.filter(l=>l.publicLand); else if(state.clLand==='private')r=r.filter(l=>l.isPrivate);
    if(state.clVia==='self')r=r.filter(l=>l.uuSelfServe); else if(state.clVia==='other')r=r.filter(l=>!l.uuSelfServe);
    if(!isNaN(fFrom))r=r.filter(l=>{const t=dts(l);return t!=null&&t>=fFrom;});
    if(!isNaN(fTo))r=r.filter(l=>{const t=dts(l);return t!=null&&t<=fTo;});
    if(state.clsearch){const q=state.clsearch.toLowerCase();r=r.filter(l=>String(l.ref||'').toLowerCase().includes(q)||String(l.county||'').toLowerCase().includes(q));}
    if(CF.ref){const q=CF.ref.toLowerCase();r=r.filter(l=>String(l.ref||'').toLowerCase().includes(q));}
    if(CF.ptype)r=r.filter(l=>String(l.problemReason||'')===CF.ptype);
    if(CF.pcls)r=r.filter(l=>CF.pcls==='none'?!l.pclass:l.pclass===CF.pcls);
    if(CF.verify)r=r.filter(l=> CF.verify==='sys' ? !!l.resolved : !l.resolved);   /* how the closure was decided: the extract said so, or a cockpit rule did */
    if(CF.fvMin!==''&&CF.fvMin!=null&&!isNaN(+CF.fvMin))r=r.filter(l=>l.firstVisitDays!=null&&l.firstVisitDays>=+CF.fvMin);
    if(CF.frMin!==''&&CF.frMin!=null&&!isNaN(+CF.frMin))r=r.filter(l=>l.firstRepairDays!=null&&l.firstRepairDays>=+CF.frMin);
    if(CF.resMin!==''&&CF.resMin!=null&&!isNaN(+CF.resMin))r=r.filter(l=>rv(l)>=+CF.resMin);
    if(CF.visitsMin!==''&&CF.visitsMin!=null&&!isNaN(+CF.visitsMin))r=r.filter(l=>(l.visits||0)>=+CF.visitsMin);
    const effMatch=(v,f)=> f==='y'?v===true : f==='n'?v===false : v!==true&&v!==false;   /* 'na' = the metric does not apply to that pathway */

  const scopeSel=state.clScope||'';
  const scopeFn={visit:l=>l.firstVisitDays!=null, repair:l=>l.firstRepairDays!=null, completed:l=>completedVisits(l)>=1};
  const scoped=(scopeSel&&scopeFn[scopeSel])?afterBand.filter(scopeFn[scopeSel]):afterBand;
  const pct=+state.clPct||90, slowPct=100-pct;   /* cut-off: keep the fastest pct%, treat the slowest (100-pct)% as outliers - shared by the trim and the "show slowest" filter */
  let view=scoped, outCut=null;
  if(state.clOutliers&&scoped.length){ outCut=pctile(scoped.map(rv),pct); view=scoped.filter(l=>rv(l)>outCut); }   /* the slowest (100-pct)% by time to resolution */

  /* ---- hero strip computed over the current view; report-only excluded for the timing metrics ---- */
  const basis=state.clBasis||'mean';
  const trimTop=vals=>{ if(basis!=='p90'||state.clOutliers||vals.length<10)return vals; const c=pctile(vals,pct); const k=vals.filter(v=>v<=c); return k.length?k:vals; };
  const meanOf=(vals,dec)=>{ const t=trimTop(vals); if(!t.length)return dec?'0.0':'0'; const m=t.reduce((a,b)=>a+b,0)/t.length; return dec?(Math.round(m*10)/10).toFixed(1):String(Math.round(m)); };
  /* the averages are computed over mView - the lens narrows them to cases the EXTRACT closed, leaving the table

  const mView=state.formalOnly?view.filter(l=>l.resolved):view;
  const wkV=mView.filter(l=>(l.hasWO||l.hasSA)), noWorkV=mView.filter(l=>!(l.hasWO||l.hasSA));
  const withVisit=wkV.filter(l=>l.firstVisitDays!=null), withRepair=wkV.filter(l=>l.firstRepairDays!=null);
  const resVals=withRepair.map(rv);   /* resolution only over journeys that had a COMPLETED repair (Ayush) - a case closed without a repair was not 'resolved' by a fix; same cohort as Time to first repair, and rv is floored at first repair so resolution >= first repair */
  const avgFV=meanOf(withVisit.map(l=>l.firstVisitDays)), avgFR=meanOf(withRepair.map(l=>l.firstRepairDays)), avgRes=meanOf(resVals), avgComp=meanOf(withRepair.map(completedVisits),1);   /* completed visits over the SAME repaired cohort as first-repair + resolution, so the strip is one consistent funnel */
  const scopeLabels={visit:'had a visit',repair:'had a repair',completed:'had a completed visit'};

  const T=(lbl,val,expl,cnt,key)=>{ const active=key&&scopeSel===key; return `<div class="metric${key?' clk':''}${active?' mact':''}"${key?` data-clscope="${key}" role="button" tabindex="0" title="Filter the view to cases that ${scopeLabels[key]||''}"`:''}><div class="l">${lbl}</div><div class="v tnum">${val}</div><div class="vs">${expl}</div>${cnt?`<div class="vs cnt-link">${cnt}${key?' <span class="scope-arrow">&#8599;</span>':''}</div>`:''}</div>`; };
  const tiles=`<div class="metrics" style="grid-template-columns:repeat(5,1fr);padding:14px 8px;margin-bottom:0">

  /* First-Time Fix / First Visit Resolved / Perfect Journey moved to the Trends tab (grouped pathway tables). Per-case detail stays in the drawer (effLine). */

    +OCB.filter(([k])=>ocCount[k]>0).map(([k,l])=>`<button class="occhip oc-${k}${outSel===k?' on':''}" data-occhip="${k}" title="Filter the closed table to ${l} cases">${l} <b>${fmtN(ocCount[k])}</b></button>`).join('')
    +`${outSel!=='all'?`<button class="occhip clr" data-occhip="all" title="Clear the outcome filter">&times; clear</button>`:''}<span class="ocbar-sum" title="The outcome counts sum to the Closed-in-window total">= ${fmtN(baseAll.length)}</span></div>`;

  const metricsHead=`<div class="metrics-head">

/* expandable description block for a timeline event: WO description, SA description, service note.
   Collapsed = one line (CSS line-clamp); click toggles .exp to show the full text. */
function descBlock(v){
  if(!v)return '';
  const parts=[];
  if(v.woDesc&&String(v.woDesc).trim())parts.push(['Work order',v.woDesc]);
  if(v.saDesc&&String(v.saDesc).trim())parts.push(['SA',v.saDesc]);
  if(v.saNote&&String(v.saNote).trim())parts.push(['Service note',v.saNote]);
  if(!parts.length)return '';
  return `<div class="tdesc" title="Click to expand / collapse the description"><div class="tdesc-clamp">${parts.map(p=>`<span class="dpart"><span class="dl">${p[0]}</span>${esc(p[1])}</span>`).join('')}</div></div>`;
}
/* per-visit CLOSURE section: resolution status (prominent) + next-job details + external further-work,
   with internal comments / supporting info / partner comments folded into an expandable block. */
function closeBlock(v){
  if(!v)return '';
  const st=(v.closeStatus||'').trim(), job=(v.closeJob||'').trim(), extF=(v.extFurther||'').trim();
  const comments=[];
  if((v.closeComments||'').toString().trim())comments.push(['Comments',String(v.closeComments).trim()]);
  if((v.closeSupport||'').toString().trim())comments.push(['Supporting info',String(v.closeSupport).trim()]);
  if((v.extComments||'').toString().trim())comments.push(['Partner comment',String(v.extComments).trim()]);
  if(!(st||job||extF||comments.length))return '';
  const low=st.toLowerCase(), _cc=closureClass(st);   /* Further Work Required wins on a merged 'A ‖ B' value */
  const sc=_cc==='further'?'cs-further':(/private/.test(low)?'cs-private':(_cc==='nofurther'?'cs-done':((/non uu|non-ins/.test(low))?'cs-nonuu':'')));
  let h='<div class="closebox"><div class="close-top"><span class="close-lbl">Closure</span>'+(v.closureConflict?'<span class="close-conflict" title="This appointment had more than one closure record; both are shown. Further Work Required takes precedence.">both kept</span>':'');
  if(st)h+=`<span class="close-status ${sc}">${esc(st)}</span>`;
  h+='</div>';
  if(job)h+=`<div class="close-line"><span class="close-k">Closure job details</span>${esc(job)}</div>`;
  if(extF)h+=`<div class="close-line"><span class="close-k">Further work required</span>${esc(extF)}</div>`;
  if(comments.length)h+=`<div class="tdesc" title="Click to expand / collapse the closure comments"><div class="tdesc-clamp">${comments.map(c=>`<span class="dpart"><span class="dl">${c[0]}</span>${esc(c[1])}</span>`).join('')}</div></div>`;
  return h+'</div>';
}
function buildTimeline(x){
  /* the activity line = the reported event + visits that actually happened + cancelled visits (shown inline,
     greyed + struck, in date order). Merely scheduled / not-yet-done visits still go to "upcoming". */
  const repTs0=reportedTsOf(x);   /* anchor on the real CASE_CREATED_DATE, not AS_OF - rounded-age (which drifts up to a day and can sort the report AFTER the first visit) */
  const events=[{kind:'reported',ts:repTs0}];
  const upcoming=[], cancelled=[];
  const cancSet=(CONFIG.cancelledStatuses||[]).map(s=>String(s).toLowerCase());
  const isCanc=v=>cancSet.indexOf(String(v.status||'').toLowerCase())>=0;
  (x.visitLog||[]).forEach((v)=>{
    if(v.occurred){ events.push({kind:'visit',ts:v.actTs,v}); }
    else if(isCanc(v)){ events.push({kind:'cancelled',ts:(v.schTs||v.crTs||v.actTs||repTs0),v}); }   /* cancelled: inline on the line, greyed + struck */
    else { upcoming.push({v}); }
  });
  events.sort((a,b)=>a.ts-b.ts);   /* oldest at the top, newest at the foot of the line */
  upcoming.sort((a,b)=>{const sa=a.v.schTs,sb=b.v.schTs; if(sa==null&&sb==null)return (a.v.pos||0)-(b.v.pos||0); if(sa==null)return 1; if(sb==null)return -1; return sa-sb;});
  /* Visit numbers follow the CHRONOLOGICAL order actually shown, NOT the source SA position - SA_SAPOSITION is non-contiguous, so numbering by list index made "Visit 19" appear above "Visit 11". Number the activity line in date order first, then continue into the scheduled/planned block; recompute the UU->partner handover in that same order. */
  /* buildTimeline owns the episode boundary: split into the earlier episode(s) and the current problem (by currentStart), and number each from Visit 1 - a re-raise is a fresh problem, not a continuation. Non-re-raised = one episode, numbered 1..n. Handover is computed within each episode. */
  const _cs=x.currentStart||0;
  const earlierEvents = x.reRaised ? events.filter(e=>e.ts<_cs) : [];
  const currentEvents = x.reRaised ? events.filter(e=>e.ts>=_cs) : events;
  let nE=0, nC=0, prevE=null, prevC=null;
  earlierEvents.forEach(e=>{ if(e.kind==='reported')return; e.seq=++nE; if(e.kind==='visit'){ e.handover=(prevE===true&&e.v.uu===false); prevE=e.v.uu; } });
  currentEvents.forEach(e=>{ if(e.kind==='reported')return; e.seq=++nC; if(e.kind==='visit'){ e.handover=(prevC===true&&e.v.uu===false); prevC=e.v.uu; } });
  upcoming.forEach(u=>{ u.seq=++nC; });   /* planned visits continue the current problem's sequence */
  return {events, earlierEvents, currentEvents, upcoming, cancelled};
}
/* one timeline event -> HTML (shared by the current line and the collapsed "Earlier activity" box) */
function tlEventHTML(e){
  const dt=`<div class="td tnum">${fmtTs(e.ts)} · ${relTs(e.ts)}</div>`;

      <div class="vmeta"><span class="who">${cwho}</span>${cv.crTs?`<span>raised ${fmtTs(cv.crTs)}</span>`:''}</div>

  const v=e.v;const company=v.woContractor||v.contractor;
  const who=v.uu?'UU Field':'Partner';

    ${v.wtDesc?`<div class="tx">${esc(v.wtDesc)}</div>`:''}

    ${(v.reasons&&v.reasons.length)?v.reasons.map(rn=>`<div class="vreason"><b>${esc(rn.label)}:</b> ${esc(rn.val)}</div>`).join(''):''}
    ${v.staleOpen?`<div class="up-superseded">Left in &lsquo;${esc(v.status)}&rsquo; &mdash; never closed off. ${v.staleOpenBy==='later-visit'?`A later visit took place on ${fmtTs(v.staleOpenTs)}, so the case has moved past this record`:`Still showing in-flight ${dbtw(AS_OF,new Date(v.actTs))} days after the visit started`}: it is not counted as outstanding work. The visit itself still counts.</div>`:''}
    ${descBlock(v)}${closeBlock(v)}

/* why a closed case is closed - for the drawer header + timeline note (not a problem, an outcome) */
function closedReason(x){
  const st=x.raw?String(x.raw[CONFIG.columns.status]||'').trim():'';
  if(st&&/closed|customer resolved|work completed|complete|resolved/i.test(st))return "case marked &lsquo;"+esc(st)+"&rsquo;";
  if(x.allCancelled)return 'all appointments cancelled';
  if(x.workDone){ const vl=x.visitLog||[];
    return 'all work completed'
      +(vl.some(v=>v.superseded)?' (a duplicate appointment was superseded &mdash; same work already done)':'')
      +(vl.some(v=>v.staleOpen)?' (a visit was left in progress and never closed off)':''); }
  if(x.abandoned)return 'last visit failed'+(x.sinceOps!=null?' '+x.sinceOps+' days ago':'')+', nothing completed or pending';
  if(isStalled(x))return 'no real activity for '+(x.sinceDormancy!=null?x.sinceDormancy:x.sinceActivity)+' days';
  if(x.noOpenOps)return 'no open work orders / appointments';
  return 'closed in the extract';
}

  const tl=buildTimeline(x);

  /* ownership history from REAL attended visits: consecutive Field (UU) / Partner (contractor) spells with
     actual dates; the final row is the current rule-derived owner. Gaps before/between visits and any

    else rows.push({o:x.owner, fromTs:AS_OF.getTime()-x.age*MS, endTs:AS_OF.getTime(), cur:true});
    return rows.map(r=>({o:r.o, from:fmtTs(r.fromTs), to:r.cur?'Current':fmtTs(r.endTs), held:Math.max(0,dbtw(new Date(r.endTs),new Date(r.fromTs)))}));
  })();

/* drawer stack: a related case opens as a stacked drawer over the current one; close (× / ‹ Back / Esc) pops one level */
function pushDrawer(jid){
  if(!LEAKS.find(i=>i.id===jid))return;
  if(drawerStack[drawerStack.length-1]===jid)return;   /* already the top drawer */
  const backRef=(LEAKS.find(i=>i.id===drawerStack[drawerStack.length-1])||{}).ref||'';
  drawerStack.push(jid);
  const el=document.createElement('div');
  el.className='drawer dstack'; el.style.zIndex=String(42+Math.min(drawerStack.length,6));
  document.body.appendChild(el);
  void el.offsetWidth;                 /* render the off-screen state first so the slide-in animates */
  openDrawer(jid, el, backRef);
}
function popDrawer(){
  if(drawerStack.length>1){
    const st=document.querySelectorAll('.drawer.dstack:not(.closing)');
    const top=st[st.length-1];
    if(top){ top.classList.add('closing'); top.classList.remove('show'); setTimeout(()=>{try{top.remove();}catch(_){}},240); }
    drawerStack.pop();
  } else { closeDrawer(); }
}
/* pull the raw source rows for one case - from retained rows (streamed loads) or the CSV text (small loads) */
function rawRowsForCase(key){
  if(!key)return null;
  const idCol=CONFIG.columns.id;
  const rows=allRows();   /* full, correct parse (memoised) - the same parser that populated LEAKS.
                             The old line-by-line prefilter split RAW_CSV_TEXT on '\n', which mis-parses any
                             record with a quoted embedded newline (common in Salesforce text columns) and
                             returned nothing, so real-data lookups all read "no rows". */
  if(!(rows&&rows.length))return null;
  const k=String(key).trim();
  return rows.filter(r=>String(r[idCol]).trim()===k);
}

    const _cS=CONFIG.columns; const _saRows=rows.filter(r=>{const p=r[_cS.saPos],st=r[_cS.saStatus],sc=r[_cS.saSched];return (p!==undefined&&p!=='')||(st!==undefined&&st!=='')||(sc!==undefined&&sc!=='');});
    const _uniqSA=new Set(_saRows.map(r=>{const an=String(r[_cS.saNumber]||'').trim();return an||('#'+r[_cS.saPos]+'|'+r[_cS.saSched]+'|'+r[_cS.saStart]+'|'+r[_cS.saStatus]);})).size;
    const _dupNote=(_saRows.length>_uniqSA)?`<div style="color:#8a5a00;margin-top:5px">&#9888; The extract fans one appointment across multiple rows (one per work order / closure-detail record): ${_saRows.length} of these rows are the same <b>${_uniqSA}</b> appointment${_uniqSA===1?'':'s'}. The metrics de-duplicate by SA_APPOINTMENT_NUMBER, so this case counts <b>${_uniqSA}</b> visit${_uniqSA===1?'':'s'}, not ${_saRows.length}. The duplicates are <b>merged</b> (see the second table below), so a closure recorded on only one row is not lost.</div>`:'';
    /* Part 2: the de-duplicated appointment rows the metrics actually use (raw rows merged, one row per appointment) */
    const _apG=groupAppts(_saRows);   /* mirror the raw table exactly: all source columns + the same derived columns, one row per merged appointment */
    const _mHead='<tr><th class="rnum">#</th>'+cols.map(c=>`<th>${esc(c)}</th>`).join('')
      +derCols.map((dc,j)=>`<th class="dcol${dc.sa?' sa':''}${j===0?' dstart':''}" title="${dc.sa?'Derived per service appointment':'Derived once per case'}">&#9881; ${esc(dc.h)}</th>`).join('')+'</tr>';
    const _mBody=_apG.map((a,i)=>{ const r=a.merged.row, cf=a.merged.conflicts||{}, sd=saDerive(r);

        +cols.map(c=>{const val=r[c], conf=cf[c]; return `<td${(val===undefined||val==='')?' class="rblank"':''}>${(val===undefined||val==='')?'&middot;':esc(val)}${conf?' <span class="close-conflict">both kept</span>':''}</td>`;}).join('')
        +derCols.map((dc,j)=>`<td class="dcell${j===0?' dstart':''}">${dc.v(r,sd)}</td>`).join('')+'</tr>'; }).join('');
